/* ===== page-specific (the tracking journey card lives in raf_tracking_journey.js) ===== */
.od-wrap{max-width:860px;}


/* ===== ORDER DETAILS — one surface below the tracking journey, in its visual language ===== */
.od2{--od-line:var(--border,#E2DBCC);--od-mute:var(--text3,#8A857C);position:relative;background:linear-gradient(180deg,#FFFFFF 0%,#FBF8F2 100%);
  border:1px solid var(--od-line);border-radius:28px;box-shadow:0 1px 2px rgba(20,16,8,.04),0 24px 48px -30px rgba(20,16,8,.24);
  margin-bottom:16px;overflow:hidden;}
.od2-meta{display:flex;align-items:center;flex-wrap:wrap;gap:8px 18px;padding:18px 26px;border-bottom:1px solid var(--od-line);font-size:13px;color:var(--text2);}
.od2-meta span{display:inline-flex;align-items:center;gap:6px;min-width:0;}
.od2-meta .ti{font-size:16px;color:var(--gold2);}
.od2-meta b{color:var(--ink);font-weight:800;}
.od2-meta .od2-paym{margin-inline-start:auto;}
.od2-pill{display:inline-flex;align-items:center;min-height:24px;padding:0 10px;border-radius:999px;background:rgba(46,158,91,.1);color:#1F7A45;font-size:11.5px;font-weight:800;}
.od2-pill.warn{background:rgba(201,168,76,.16);color:#8A6418;}
.od2-grid{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);}
.od2-col{padding:20px 26px;min-width:0;}
.od2-col + .od2-col{border-inline-start:1px solid var(--od-line);}
.od2-sec + .od2-sec{margin-top:18px;padding-top:18px;border-top:1px dashed var(--od-line);}
.od2-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin:0 0 10px;font-size:11.5px;font-weight:800;letter-spacing:.6px;color:var(--od-mute);text-transform:uppercase;}
.od2-h em{font-style:normal;font-weight:700;letter-spacing:0;text-transform:none;}
/* items */
.od2-it{display:flex;align-items:center;gap:12px;padding:9px 0;}
.od2-it + .od2-it{border-top:1px solid rgba(226,219,204,.6);}
.od2-img{width:46px;height:46px;flex:0 0 auto;border-radius:13px;background:#F4F1EA center/cover no-repeat;display:flex;align-items:center;justify-content:center;font-size:21px;color:var(--gold2);}
.od2-ib{flex:1 1 auto;min-width:0;}
.od2-ib b{display:block;font-size:14px;font-weight:800;color:var(--ink);line-height:1.45;overflow-wrap:anywhere;}
.od2-ib span{display:block;font-size:12px;color:var(--od-mute);margin-top:2px;overflow-wrap:anywhere;}
.od2-pr{flex:0 0 auto;text-align:end;font-size:14px;font-weight:800;color:var(--ink);white-space:nowrap;font-variant-numeric:tabular-nums;}
.od2-pr small{font-size:11px;font-weight:700;color:var(--od-mute);}
.od2-pr .od2-each{display:block;font-size:11px;font-weight:600;color:var(--od-mute);}
.od2-more{display:inline-flex;align-items:center;gap:6px;margin-top:6px;padding:6px 0;border:0;background:none;color:var(--gold2);font-family:inherit;font-size:13px;font-weight:800;cursor:pointer;}
.od2-more:focus-visible,.od2-addr summary:focus-visible{outline:2px solid var(--gold);outline-offset:2px;border-radius:6px;}
/* delivery */
.od2-dl{display:flex;gap:10px;align-items:flex-start;}
.od2-dl > .ti{font-size:19px;color:var(--gold2);margin-top:2px;flex:0 0 auto;}
.od2-addr{min-width:0;font-size:13.5px;line-height:1.7;color:var(--ink);font-weight:700;}
.od2-addr summary{list-style:none;cursor:pointer;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
.od2-addr summary::-webkit-details-marker{display:none;}
.od2-addr[open] summary{display:block;-webkit-line-clamp:unset;}
.od2-addr .more{display:block;margin-top:2px;font-size:12px;color:var(--gold2);font-weight:800;}
.od2-addr[open] .more{display:none;}
.od2-dl small{display:block;font-size:12px;color:var(--od-mute);font-weight:600;margin-top:2px;}
/* payment summary */
.od2-row{display:flex;justify-content:space-between;gap:12px;padding:5px 0;font-size:13.5px;color:var(--text2);font-variant-numeric:tabular-nums;}
.od2-row b{font-weight:700;color:var(--ink);white-space:nowrap;}
.od2-row.minus b{color:#1F7A45;}
.od2-tot{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-top:8px;padding-top:12px;border-top:1px solid var(--od-line);}
.od2-tot span{font-size:14px;font-weight:800;color:var(--ink);}
.od2-tot b{font-size:21px;font-weight:800;color:var(--ink);white-space:nowrap;font-variant-numeric:tabular-nums;}
.od2-tot b small{font-size:12px;font-weight:700;color:var(--od-mute);}
.od2-after{margin-top:10px;padding:10px 12px;border-radius:14px;background:#F6FAF7;}
.od2-after .od2-row{font-size:13px;}
.od2-after .od2-row b{color:#1F7A45;}
/* help + continue */
.od2-foot{display:flex;align-items:center;gap:10px 16px;flex-wrap:wrap;padding:14px 26px;border-top:1px solid var(--od-line);background:rgba(244,241,234,.55);}
.od2-foot > span{flex:1 1 200px;min-width:0;font-size:13px;color:var(--text2);display:inline-flex;align-items:center;gap:8px;}
.od2-foot > span .ti{font-size:18px;color:var(--gold2);}
.od2-foot a{display:inline-flex;align-items:center;justify-content:center;gap:7px;min-height:44px;padding:0 16px;border-radius:13px;font-size:13.5px;font-weight:800;text-decoration:none;flex:0 0 auto;}
.od2-foot a.sup{border:1px solid var(--border2,#CFC6B3);background:#fff;color:var(--ink);}
.od2-foot a.sup:hover{border-color:var(--gold);color:var(--gold2);}
.od2-foot a.shop{background:linear-gradient(180deg,#D9B85C,var(--gold,#C9A84C));color:#1C1606;}
.od2-foot a:focus-visible{outline:2px solid var(--gold);outline-offset:2px;}
@media (max-width:760px){
  .od2-grid{grid-template-columns:minmax(0,1fr);}
  .od2-col + .od2-col{border-inline-start:0;border-top:1px solid var(--od-line);}
  .od2-meta,.od2-col,.od2-foot{padding-inline:18px;}
  .od2-meta .od2-paym{margin-inline-start:0;}
}
@media (max-width:420px){ .od2{border-radius:22px;} .od2-foot a{flex:1 1 100%;} }
/* the close control: an X in the header's own pill style */
.co-back.co-close{width:40px;padding:0;justify-content:center;font-size:19px;}
.co-back.co-close:focus-visible{outline:2px solid var(--gold);outline-offset:2px;}

/* 7 · action buttons */
.od-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:4px;}
.od-actions .btn{flex:1;min-width:190px;}
@media(max-width:560px){.od-actions .btn{min-width:100%;}.cf{padding:18px;}.cf-t{font-size:18px;}}
/* ---------- GROUP C · customer approved change ---------- */
.cc-card{background:var(--card);border:1.5px solid var(--gold);border-radius:18px;padding:18px;margin-bottom:16px;
  box-shadow:0 6px 24px rgba(201,168,76,.14);}
.cc-h{display:flex;gap:11px;align-items:flex-start;margin-bottom:14px;}
.cc-h i{font-size:24px;color:var(--gold2);flex:0 0 auto;}
.cc-h b{display:block;font-size:15px;font-weight:800;color:var(--ink);line-height:1.45;}
.cc-h span{font-size:12.5px;color:var(--text2);}
.cc-prod{display:flex;align-items:center;gap:11px;padding:10px;border-radius:12px;background:var(--bg);margin-bottom:12px;}
.cc-th{width:46px;height:46px;border-radius:10px;background:var(--bg2) center/cover no-repeat;
  border:1px solid var(--border);flex:0 0 auto;}
.cc-prod b{display:block;font-size:13.5px;font-weight:800;color:var(--ink);overflow-wrap:anywhere;}
.cc-prod span{font-size:12px;color:var(--text2);font-family:var(--font-en);}
.cc-diff{display:flex;align-items:stretch;gap:10px;margin-bottom:12px;}
.cc-side{flex:1 1 0;min-width:0;padding:11px 13px;border-radius:12px;border:1px solid var(--border2);background:var(--bg);}
.cc-side span{display:block;font-size:11px;font-weight:800;color:var(--text3);margin-bottom:3px;}
.cc-side b{font-size:13.5px;font-weight:800;color:var(--text2);overflow-wrap:anywhere;}
.cc-side.new{border-color:var(--gold);background:var(--gold-soft);}
.cc-side.new b{color:var(--gold2);}
.cc-arrow{align-self:center;font-size:20px;color:var(--gold2);flex:0 0 auto;}
html[dir="ltr"] .cc-arrow{transform:rotate(180deg);}
.cc-reason,.cc-price{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--text2);margin-bottom:8px;}
.cc-reason i,.cc-price i{color:var(--gold2);font-size:16px;flex:0 0 auto;}
.cc-outcome{background:var(--bg);border:1px solid var(--border);border-radius:12px;padding:11px 13px;margin:12px 0 14px;}
.cc-outcome div{display:flex;gap:8px;align-items:flex-start;font-size:12px;line-height:1.65;color:var(--text2);}
.cc-outcome div+div{margin-top:7px;}
.cc-outcome i{flex:0 0 auto;font-size:15px;margin-top:1px;}
.cc-outcome div:first-child i{color:var(--green);}
.cc-outcome div:last-child i{color:var(--red);}
.cc-amt{flex:0 0 auto;font-family:var(--font-en);font-size:14px;font-weight:800;color:var(--ink);white-space:nowrap;}
.cc-prod.new{border:1px solid var(--gold);background:var(--gold-soft);}
.cc-swap{text-align:center;color:var(--gold2);font-size:19px;margin:-4px 0 8px;}
.cc-refund{display:flex;gap:9px;align-items:flex-start;background:rgba(46,158,91,.09);
  border:1px solid rgba(46,158,91,.3);border-radius:12px;padding:11px 13px;margin-bottom:10px;}
.cc-refund i{color:var(--green);font-size:19px;flex:0 0 auto;margin-top:1px;}
.cc-refund b{display:block;font-size:14px;font-weight:800;color:var(--ink);font-family:var(--font-en);}
.cc-refund em{font-style:normal;display:block;font-size:11.5px;color:var(--text2);line-height:1.6;margin-top:3px;
  font-family:var(--font-ar);}
.cc-dest{margin-bottom:12px;}
.cc-dest-h{font-size:12.5px;font-weight:800;color:var(--ink);margin-bottom:8px;}
#ccCard .cc-dest-o{display:flex;align-items:center;gap:10px;width:100%;min-height:56px;padding:11px 13px;
  margin-bottom:8px;border-radius:12px;border:1.5px solid var(--border2);background:var(--card);
  cursor:pointer;font-family:inherit;text-align:start;transition:all .16s;}
#ccCard .cc-dest-o:hover{border-color:var(--gold);}
#ccCard .cc-dest-o[aria-pressed="true"]{border-color:var(--ink);background:var(--bg);}
.cc-dest-tick{flex:0 0 auto;width:20px;height:20px;border-radius:50%;border:2px solid var(--border2);
  display:flex;align-items:center;justify-content:center;font-size:12px;color:var(--card);}
#ccCard .cc-dest-o[aria-pressed="true"] .cc-dest-tick{border-color:var(--ink);background:var(--ink);color:#F5F0E4;}
.cc-dest-o > i{font-size:21px;color:var(--gold2);flex:0 0 auto;}
.cc-dest-b{min-width:0;flex:1;}
.cc-dest-b b{display:block;font-size:13px;font-weight:800;color:var(--ink);line-height:1.4;}
.cc-dest-b em{font-style:normal;display:block;font-size:11.5px;color:var(--text2);line-height:1.55;}
.cc-acts{display:flex;flex-direction:column;gap:9px;}
/* the theme stylesheet loads after this block and sets a 40px floor on every
   button, so these decisions are id-scoped to outrank it */
#ccCard .cc-acts button{min-height:52px;border-radius:14px;font-family:inherit;font-size:15px;font-weight:800;
  cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1.5px solid transparent;}
#ccCard .cc-ok{background:var(--ink);color:#F5F0E4;border-color:var(--ink);}
#ccCard .cc-no{background:var(--card);color:var(--text2);border-color:var(--border2);}
#ccCard .cc-no:hover{border-color:var(--red);color:var(--red);}
#ccCard .cc-acts button:disabled{opacity:.55;cursor:progress;}
.cc-spin{display:inline-block;animation:ccspin .9s linear infinite;}
@keyframes ccspin{to{transform:rotate(360deg);}}
@media (prefers-reduced-motion:reduce){ .cc-spin{animation:none;} }
.cc-locked{display:flex;align-items:flex-start;gap:9px;min-height:52px;padding:13px 14px;border-radius:14px;
           background:var(--bg2);border:1px solid var(--border2);font-size:13.5px;line-height:1.65;color:var(--text2);}
.cc-locked i{font-size:18px;color:var(--text3);flex:0 0 auto;margin-top:1px;}
.cc-err{display:none;margin-top:11px;padding:10px 12px;border-radius:11px;background:rgba(217,83,79,.1);
  border:1px solid rgba(217,83,79,.32);color:var(--red);font-size:12.5px;font-weight:700;line-height:1.6;}
.cc-err.show{display:block;}
@media (min-width:560px){ .cc-acts{flex-direction:row;} .cc-acts button{flex:1;} }

<script>
/* ============================================================
   ORDER DETAILS & TRACKING — single post-purchase page.
   Order is the single source of truth (RAFShop.Orders).
   ============================================================ */
(function(){
  var T=RAFCO.T, L=RAFCO.L, money=RAFCO.money;
  function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }

  /* THE ORDER, ONLY FOR ITS OWN CUSTOMER. RAFShop.Orders.mineById proves the
     signed-in customer is the one on the order record; an id in the URL grants
     nothing, and a refused visitor learns nothing about the order. */
  var ACCESS=null;
  function getOrder(){
    var id=new URLSearchParams(location.search).get('id');
    /* no id (e.g. the "Track your order" nav link): the signed-in customer's own
       most recent order still in progress — never anyone else's */
    if(!id && RAFShop.Orders.mine){ var act=RAFShop.Orders.mine().filter(function(x){ return x.status==='progress'; })[0]; if(act) id=act.id; }
    var r=(RAFShop.Orders.mineById ? RAFShop.Orders.mineById(id) : { ok:false, code:'NOT_FOUND' });
    ACCESS=r.ok ? null : r.code;
    return r.ok ? r.order : null;
  }

  /* ══════════════════════════════════════════════════════════════
     THE CUSTOMER'S VIEW OF THE ORDER — three stages, nothing else.

     The order lifecycle inside RAF has many more states than this, and the
     customer is shown none of them: no queue names, no engine states, no
     driver assignment wording, and none of the audit vocabulary that the
     record keeps internally. What follows is a PROJECTION of the existing
     authoritative data onto exactly three stages. It reads state, it never
     decides it, and it writes nothing.

       Stage 1 · جاري تجهيز طلبك   the store still has the order — placed,
                                   accepted, preparing, ready, or ready and
                                   waiting for a driver, or ready with a driver
                                   assigned who has not collected it yet
       Stage 2 · قيد التوصيل        the driver has PICKED UP the order: from
                                   the audited pickup
                                   until it is handed over
       Stage 3 · تم التوصيل         the order was delivered

     Source of truth, in order of preference:
       · RAFOrderSnapshot fulfilment  (driverId / pickedUpAt / deliveredAt)
       · order.status                 (delivered / cancelled)
       · the order's own stages       — legacy orders carry no snapshot; their
                                        `ship` / `done` stages answer the same
                                        question without exposing any wording
     ══════════════════════════════════════════════════════════════ */
  var STAGES=[
    { key:'prep', ic:'ti-package',        ar:'جاري تجهيز طلبك', en:'Order being prepared' },
    { key:'ship', ic:'ti-truck-delivery', ar:'قيد التوصيل',     en:'Out for delivery' },
    { key:'done', ic:'ti-home-check',     ar:'تم التوصيل',      en:'Delivered' }
  ];
  function fulfilmentOf(o){
    var f = (o && o.snapshot && o.snapshot.fulfilment) || null;
    return (f && typeof f==='object') ? f : null;
  }
  /* legacy fallback: an order with no snapshot still knows how far it got */
  function legacyStage(o){
    var tl=o.tl||[];
    function at(k){ return tl.filter(function(s){ return s.k===k; })[0]; }
    var done=at('done'), ship=at('ship');
    if(done && done.s==='done') return 2;
    if(ship && (ship.s==='active'||ship.s==='done')) return 1;
    return 0;
  }
  function stageOf(o){
    var cancelled = o.status==='cancelled';
    var f = fulfilmentOf(o);
    var idx;
    if(o.status==='delivered' || (f && f.deliveredAt)) idx=2;
    /* ASSIGNMENT IS NOT PICKUP. The order is out for delivery only once the
       driver has physically collected it (fulfilment.pickedUpAt, written by
       RAFLogistics.pickUp with the audited 'driver.pickup'); a driver who is
       merely assigned leaves it at the store's stage */
    else if(f && f.pickedUpAt)                         idx=1;
    else if(f)                                         idx=0;   /* still at the store — preparing, ready, or ready with a driver assigned */
    else                                               idx=legacyStage(o);
    return { index:idx, cancelled:cancelled,
             claimed:!!(f && f.driverId), picked:!!(f && f.pickedUpAt),
             delivered: idx===2 };
  }
  function statusMeta(st){
    if(st==='delivered') return {cls:'b-delivered',ic:'ti-circle-check',label:T('تم التسليم','Delivered')};
    if(st==='cancelled') return {cls:'b-cancelled',ic:'ti-circle-x',label:T('ملغى','Cancelled')};
    return {cls:'b-progress',ic:'ti-truck-delivery',label:T('قيد التوصيل','In progress')};
  }

  /* ---------- 1 · the delivery journey ----------
     RAFJourneyUI draws; every value below is read here from the authority
     that owns it, and nothing is guessed:
       stage            stageOf() — out for delivery only after the PICKUP
       prepared         RAFOrderEngine.readyAt()      (audited 'order.ready')
       store            RAFSource.store(slug from the snapshot) → name, category, logo
       delivery timer   RAFOrderEngine.acceptedAt()   (audited 'order.accept')
                        → RAFOrderEngine.deliveredAt() (audited 'driver.delivered')
       driver, message, call   RAFDriverCommunication — whenever this customer
                        has a LIVE conversation (a driver owns the delivery,
                        from assignment until delivery); never after delivery
       driver rating    RAFCustomerExperience.currentDriverRating() — the
                        average of real submitted ratings, or none
       compensation     RAFCompensation.forOrder()    — only a real record
       rating the order RAFCustomerExperience.orderRatingStatus() — delivered only */
  var CALLNOTE = null, COMPNOTE = null, CL_AT = null, CL_T = null;
  function journeyModel(o){
    var st=stageOf(o), f=fulfilmentOf(o)||{}, E=window.RAFOrderEngine;
    var slug=(o.snapshot && o.snapshot.storeSlug) || o.storeSlug || null;
    var store=null; try { store = (slug && window.RAFSource) ? RAFSource.store(slug) : null; } catch(e){ store=null; }
    var name = store ? L(store.name) : (L(o.store) || '');
    function ms(fn){ try { var r = E && E[fn] ? E[fn](o.id) : null; return r && typeof r.at==='number' ? r.at : null; } catch(e){ return null; } }
    var accepted=ms('acceptedAt'), ready=ms('readyAt');
    var delivered=ms('deliveredAt') || (typeof f.deliveredAt==='number' ? f.deliveredAt : null);
    var conv=null;
    try { conv = (!st.cancelled && !st.delivered && window.RAFDriverCommunication) ? RAFDriverCommunication.conversation(o.id) : null; } catch(e){ conv=null; }
    var live = !!(conv && conv.ok);
    var calls = live ? (conv.conversation.calls || {}) : {};
    var drating = null;
    /* the order's own driver — identity and aggregate stay visible after delivery; only contact ends */
    var odrv = null;
    if(!st.cancelled && window.RAFCustomerExperience){ try { var dr = RAFCustomerExperience.orderDriver(o.id); odrv = dr && dr.ok && dr.driver.name ? dr.driver : null; } catch(e){ odrv=null; } }
    if(odrv) drating = odrv.rating;
    var comp = null;
    if(!st.cancelled && window.RAFCompensation){ try { var cr = RAFCompensation.forOrder(o.id); comp = cr && cr.ok ? cr.compensation : null; } catch(e){ comp=null; } }
    /* the live delay against the approved compensation rules (an ESTIMATE from
       RAFCompensation — nothing is issued before Delivered); shown only once it
       has actually started */
    var compLive = null; CL_AT = null;
    if(!st.cancelled && !st.delivered && !comp && window.RAFCompensation && RAFCompensation.liveDelay){
      try { var ld = RAFCompensation.liveDelay(o.id); compLive = ld && ld.ok && ld.live && ld.started ? ld : null;
            /* not started yet: the line appears on its own at the moment it begins */
            CL_AT = ld && ld.ok && ld.live && !ld.started ? ld.startsAt : null; } catch(e){ compLive=null; } }
    var rating = null;
    if(st.delivered && window.RAFCustomerExperience){ try { var rs = RAFCustomerExperience.orderRatingStatus(o.id); rating = rs && rs.ok ? { state:rs.state } : null; } catch(e){ rating=null; } }
    /* the driver at the door, and the code to hand over — RAFLogistics.customerArrival,
       the order's own customer only; the code lives on the shared order record */
    var arr = null;
    if(!st.cancelled && !st.delivered && window.RAFLogistics && RAFLogistics.customerArrival){ try { var ar = RAFLogistics.customerArrival(o.id); arr = ar && ar.ok ? ar : null; } catch(e){ arr=null; } }
    var arrived = !!(arr && arr.arrived);
    /* prepared = the store's own Ready. A driver can now be assigned from acceptance,
       so an assigned driver no longer implies the order is ready */
    var prepared = !!ready;
    var label = st.cancelled ? T('ملغى','Cancelled')
              : st.index===2 ? T('تم التوصيل','Delivered')
              : st.index===1 && arrived ? T('التسليم — وصل السائق','Handover — driver arrived')
              : st.index===1 ? T('قيد التوصيل','Out for delivery')
              : prepared ? T('تم تجهيز طلبك','Order prepared')
              : T('جاري التجهيز','Being prepared');
    var message = st.cancelled ? T('تم إلغاء الطلب. إذا كان لديك أي استفسار تواصل مع الدعم.','This order was cancelled. Contact support if you have any questions.')
                : st.index===2 ? T('تم تسليم طلبك بنجاح، شكراً لاستخدامك رف!','Your order was delivered. Thank you for using RAF!')
                : st.index===1 && arrived ? T('وصل السائق إلى موقعك. يرجى الاستعداد لاستلام طلبك.','Your driver has arrived at your destination. Please prepare to receive your order.')
                : st.index===1 ? T('استلم السائق طلبك من المتجر وهو في طريقه إليك.','The driver collected your order from the store and is on the way to you.')
                : f.driverId && prepared ? T('طلبك جاهز، وتم تعيين سائق لاستلامه من المتجر.','Your order is ready and a driver has been assigned to collect it from the store.')
                : f.driverId ? T('المتجر يجهّز طلبك، وتم تعيين سائق سيستلمه عند جاهزيته.','The store is preparing your order, and a driver has been assigned to collect it once it is ready.')
                : prepared ? T('طلبك جاهز في المتجر.','Your order is ready at the store.')
                : T('المتجر يجهّز طلبك الآن، وسنخبرك فور خروجه للتوصيل.','The store is preparing your order — we will tell you as soon as it leaves for delivery.');
    return {
      orderId:o.id, stage:st.index, handover:st.index===1 && arrived, cancelled:st.cancelled, prepared:prepared,
      store:{ name:name, category:store && store.cat ? L(store.cat) : null, logo:store && store.logo ? store.logo : null,
              initial:String(name||'').trim().charAt(0) },
      status:{ label:label, message:message },
      acceptedAt:accepted, deliveredAt:st.delivered ? delivered : null,
      driver: odrv ? { name:odrv.name, rating:drating } : (live && conv.conversation.currentDriver ? { name:conv.conversation.currentDriver.name, rating:null } : null),
      canMessage:live, canCall:live && calls.remaining!==0,
      /* unread = the driver's messages to this customer on THIS order that the
         customer has not read yet (the communication authority's own receipts) */
      unread:live ? (conv.messages || []).filter(function(x){ return !x.mine && !(x.status && x.status.state==='read'); }).length : 0,
      callNote:live ? CALLNOTE : null,
      compensation:comp, compNote:comp ? COMPNOTE : null,
      rating:rating,
      arrived:arrived, deliveryCode:arr && arr.code ? arr.code : null,
      /* THE DELIVERY ETA. RAF has no authoritative delivery ETA (the merchant's
         Promised ETA is a different value and is never shown as one), so this is
         null and the ETA line honestly reads "—" until a delivery authority
         records one */
      deliveryEtaAt:null,
      compLive:compLive
    };
  }
  function journeyHTML(o){
    if(!window.RAFJourneyUI) return '';
    return '<div id="jrRoot">'+RAFJourneyUI.html(journeyModel(o))+'</div>';
  }
  /* the two actions go to the communication authority; nothing is decided here */
  /* Message opens the order's own chat screen (the same RAFDriverCommunication

  window.trkMessage=function(){
    var o=getOrder(); if(!o) return;
    location.href='raf_order_chat.html?id='+encodeURIComponent(o.id);
  };
  window.trkCall=function(){
    var o=getOrder(); if(!o || !window.RAFDriverCommunication) return;
    Promise.resolve(RAFDriverCommunication.call(o.id)).then(function(r){
      if(r && r.ok){
        CALLNOTE=null;
        var a=document.createElement('a'); a.href=r.dialHref; a.style.display='none'; document.body.appendChild(a); a.click(); a.remove();
      } else CALLNOTE=(r && r.message) || T('تعذّر الاتصال.','The call could not be placed.');
      render();
    });
  };
  /* the compensation's existing customer action: add the coupon to RAF Wallet */
  var WALLET_BUSY=false;
  window.trkWallet=function(){
    var o=getOrder(); if(!o || WALLET_BUSY || !window.RAFCompensation) return;
    var cr=null; try { cr=RAFCompensation.forOrder(o.id); } catch(e){ cr=null; }
    var c=cr && cr.ok ? cr.compensation : null; if(!c || !c.canAddToWallet) return;
    WALLET_BUSY=true;
    Promise.resolve(RAFCompensation.addToWallet(c.compensationId)).then(function(r){
      WALLET_BUSY=false;
      COMPNOTE = r && r.ok ? null : ((r && r.message) || T('تعذّرت إضافة القسيمة إلى المحفظة.','The coupon could not be added to your wallet.'));
      render();
    });
  };
  document.addEventListener('click', function(e){
    var b=e.target.closest && e.target.closest('#jrRoot [data-jr]'); if(!b) return;
    var act=b.getAttribute('data-jr');
    if(act==='call') trkCall(); else if(act==='wallet') trkWallet(); else trkMessage();
  });


  /* the conversation itself lives on its own screen (raf_order_chat.html) —
     RAFDriverCommunication decides who may see or write, exactly as before */

  /* ---------- 5 · THE ORDER DETAILS, below the tracking journey ----------
     One surface in the journey's visual language, ordered by what the
     customer needs while the order is on its way: what was ordered, what was

     calculation is changed here, and nothing already shown above is repeated:

  var SHOWALL=false;

  function paymentSection(o){

    h += '<div class="cc-outcome">'
      + '<div><i class="ti ti-check"></i>'+(isRemoval
          ? T('عند الموافقة: يُزال هذا المنتج فقط ويُعاد مبلغه، ويكمل المتجر تجهيز بقية طلبك.',
              'If you approve: only this product is removed and refunded; the store continues with the rest of your order.')
          : T('عند الموافقة: يُستبدل هذا المنتج فقط، ويُعاد الفرق إن وجد.',
              'If you approve: only this product is replaced, and any difference is refunded.'))+'</div>'
      + '<div><i class="ti ti-x"></i>'+T('عند الرفض: يبقى طلبك كما هو دون أي تغيير، ويُبلَّغ المتجر بقرارك.',
            'If you decline: your order stays exactly as it is and the store is told.')+'</div>'
      + '</div>'
      + ccActionsHTML(c, T('الموافقة','Approve'), T('رفض','Decline'))
      + '</section>';
    return h;
  }

  /* ---------- the decision controls ----------
     Enabled for the person who placed the order and nobody else. The gate is
     asked of the order-changes authority, so this page never decides who a
     customer is, and a disabled button is never the only thing stopping a
     wrong actor — the authority refuses them too. */
  var CCBUSY = false;
  function ccGate(o){
    var C = window.RAFOrderChanges;
    if (!C || !C.canDecide) return { ok:true };
    return C.canDecide(o.id, ccActor());
  }
  function ccActionsHTML(c, okLabel, noLabel){
    var o = getOrder();
    var gate = o ? ccGate(o) : { ok:false };
    if (!gate.ok){
      return '<div class="cc-locked"><i class="ti ti-lock"></i><span>'
        + (gate.message || T('لا يمكن الرد على هذا الطلب من هذا الحساب.',
                             'This order cannot be answered from this account.'))
        + '</span></div>'
        + '<div class="cc-err" id="ccErr" role="alert"></div>';
    }
    return '<div class="cc-acts">'
      + '<button class="cc-ok" id="ccOk"'+(CCBUSY?' disabled':'')+' onclick="approveChange(\''+c.id+'\')">'
        + (CCBUSY ? '<i class="ti ti-loader-2 cc-spin"></i> '+T('جارٍ التنفيذ…','Working…')
                  : '<i class="ti ti-check"></i> '+okLabel)+'</button>'
      + '<button class="cc-no" id="ccNo"'+(CCBUSY?' disabled':'')+' onclick="declineChange(\''+c.id+'\')">'
        + '<i class="ti ti-x"></i> '+noLabel+'</button>'
      + '</div>'
      + '<div class="cc-err" id="ccErr" role="alert"></div>';
  }

  function changeHTML(o){
    var C = window.RAFOrderChanges;
    if (!C) return '';
    var c = C.describe(o.id);
    if (!c) return '';
    if (c.kind === 'removal' || c.kind === 'replacement') return lineChangeHTML(o, c);
    var group = T(c.groupAr || c.groupEn, c.groupEn || c.groupAr);
    var to    = T(c.toLabelAr || c.toLabelEn, c.toLabelEn || c.toLabelAr);
    var name  = T(c.productNameAr || c.productNameEn, c.productNameEn || c.productNameAr);
    return '<section class="cc-card" id="ccCard">'
      + '<div class="cc-h"><i class="ti ti-message-question"></i><div>'
        + '<b>'+T('المتجر يطلب تعديلاً على طلبك','The store has requested a change to your order')+'</b>'
        + '<span>'+T('لن يتم تنفيذ أي تغيير إلا بعد موافقتك.','Nothing changes unless you approve it.')+'</span>'
      + '</div></div>'
      + '<div class="cc-prod">'
        + (c.image?'<span class="cc-th" style="background-image:url(\''+c.image+'\')"></span>':'')
        + '<div><b>'+name+'</b><span>'+T('الكمية','Qty')+': '+(c.qty||1)+'</span></div></div>'
      + '<div class="cc-diff">'
        + '<div class="cc-side"><span>'+T('الحالي','Current')+'</span><b>'+group+': '+c.fromLabel+'</b></div>'
        + '<i class="ti ti-arrow-left cc-arrow"></i>'
        + '<div class="cc-side new"><span>'+T('المقترح','Proposed')+'</span><b>'+group+': '+to+'</b></div>'
      + '</div>'
      + '<div class="cc-reason"><i class="ti ti-info-circle"></i><span>'
        + T('السبب','Reason')+': '+T(c.reasonAr, c.reasonEn)+'</span></div>'
      + '<div class="cc-price"><i class="ti ti-tag"></i><span>'
        + T('لا يوجد تغيير في السعر','No change in price')+'</span></div>'
      + '<div class="cc-outcome">'
        + '<div><i class="ti ti-check"></i>'+T('عند الموافقة: يتم تعديل هذا المنتج فقط ويكمل المتجر تجهيز طلبك.',
              'If you approve: only this item changes and the store continues preparing your order.')+'</div>'
        + '<div><i class="ti ti-x"></i>'+T('عند الرفض: يبقى طلبك كما هو دون أي تغيير، ويُبلَّغ المتجر بقرارك.',
              'If you decline: your order stays exactly as it is and the store is told.')+'</div>'
      + '</div>'
      + ccActionsHTML(c, T('الموافقة على التعديل','Approve the change'),
                         T('رفض التعديل','Decline the change'))
      + '</section>';
  }
  function ccActor(){
    var u = (window.RAFPerm && RAFPerm.currentUser()) ? RAFPerm.currentUser() : null;
    return u ? { id:u.id, name:u.name } : null;
  }
  function ccFail(res){
    var box = document.getElementById('ccErr');
    if (!box) return;
    box.textContent = res.message || T('تعذّر تنفيذ العملية.','The action could not be completed.');
    box.classList.add('show');
  }
  /* One decision per press. The flag survives the re-render, so a second click
     (or a second tab) cannot submit the same answer twice; the authority is
     idempotent as well, so neither can produce a duplicate effect. */
  window.approveChange = function(id){
    var o = getOrder(); if (!o || CCBUSY) return;
    CCBUSY = true; render();
    var res = RAFOrderChanges.customerApprove(o.id, id, ccActor(), { refundDestination: CCDEST });
    CCBUSY = false;
    if (!res.ok) {
      /* re-render first so the card survives, then show why */
      render(); ccFail(res); return;
    }
    var msg = res.refund
      ? (res.refund.destination === 'wallet'
          ? T('تمت الموافقة. أُضيف ' + res.refund.amount + ' د.ك إلى محفظتك.',
              'Approved. ' + res.refund.amount + ' KWD was added to your wallet.')
          : T('تمت الموافقة. سيُعاد ' + res.refund.amount + ' د.ك إلى وسيلة الدفع الأصلية خلال 7 أيام عمل كحد أقصى.',
              'Approved. ' + res.refund.amount + ' KWD will be returned to your original payment method within 7 business days.'))
      : T('تم تطبيق التعديل على طلبك.','The change has been applied to your order.');
    CCDEST = null;
    RAFShop.toast(msg, { icon:'ti-check' });
    render();
  };
  window.declineChange = function(id){
    var o = getOrder(); if (!o || CCBUSY) return;
    CCBUSY = true; render();
    var res = RAFOrderChanges.customerReject(o.id, id, ccActor());
    CCBUSY = false;
    if (!res.ok) { render(); ccFail(res); return; }
    RAFShop.toast(T('تم رفض التعديل. طلبك كما هو.','Change declined. Your order is unchanged.'), { icon:'ti-x' });
    render();
  };

  /* ---------- render ---------- */
  /* the close control follows the page language */
  function closeLabels(){
    var b=document.getElementById('trkClose'); if(!b) return;
    b.setAttribute('aria-label', T('إغلاق التتبع','Close tracking')); b.setAttribute('title', T('إغلاق','Close'));
  }
  /* AFTER DELIVERY the customer is taken straight into the post-delivery flow:
     Delivery Completed → Rating (raf_delivery_rating.html, the existing ratings
     screen). It happens when this page sees the order become delivered, or the
     first time this tab opens an already-delivered, not-yet-rated order; the
     tracking entry is REPLACED so Back does not return to it. An order already
     rated, or one this tab has already been through, stays on tracking. */
  var LASTSTAGE=null;
  function postDelivery(o){
    var st=stageOf(o), prev=LASTSTAGE; LASTSTAGE=st.index;
    if(!st.delivered || st.cancelled || !window.RAFCustomerExperience) return false;
    var rs=null; try { rs=RAFCustomerExperience.orderRatingStatus(o.id); } catch(e){ rs=null; }
    if(!rs || !rs.ok || rs.state!=='available') return false;
    var key='raf_post_delivery_'+o.id, done=null;
    try { done=sessionStorage.getItem(key); } catch(e){ done=null; }
    var live = prev!==null && prev<2;
    if(done && !live) return false;
    try { sessionStorage.setItem(key,'1'); } catch(e){}
    var to='raf_delivery_rating.html?id='+encodeURIComponent(o.id)+'&flow=delivered';
    try { location.replace(to); } catch(e){ location.href=to; }
    return true;
  }
  /* a NEW driver message while tracking is open: a visible alert, beside the
     badge. The message itself is already a RAF notification (created by
     RAFDriverCommunication); this only surfaces it on the screen in front of
     the customer. Only an increase alerts — never a re-render or a refresh. */
  var UNREAD={ id:null, n:null };
  function unreadAlert(o){
    var n=0;
    try { var cv=window.RAFDriverCommunication ? RAFDriverCommunication.conversation(o.id) : null;
          n = cv && cv.ok ? (cv.messages||[]).filter(function(x){ return !x.mine && !(x.status && x.status.state==='read'); }).length : 0; } catch(e){ n=0; }
    if(UNREAD.id===o.id && UNREAD.n!==null && n>UNREAD.n && window.RAFShop && RAFShop.toast)
      RAFShop.toast(T('رسالة جديدة من السائق','New message from your driver'), { icon:'ti-message-dots' });
    UNREAD={ id:o.id, n:n };
  }
  function render(){
    closeLabels();
    var root=document.getElementById('odRoot');
    var o=getOrder();
    if(o && postDelivery(o)) return;
    if(!o && ACCESS==='UNAUTHENTICATED'){
      root.innerHTML='<div class="empty"><div class="empty-ic"><i class="ti ti-lock"></i></div>'
        + '<div class="empty-t">'+T('يلزم تسجيل الدخول','Sign-in required')+'</div>'
        + '<div class="empty-s">'+T('سجّل الدخول بحسابك لتتبع طلبك.','Sign in with your account to track your order.')+'</div>'
        + '<div class="empty-actions"><a href="raf_login.html" class="btn btn-gold"><i class="ti ti-login"></i> '+T('تسجيل الدخول','Sign in')+'</a></div></div>';
      return;
    }
    if(!o){
      root.innerHTML='<div class="empty"><div class="empty-ic"><i class="ti ti-package-off"></i></div>'
        + '<div class="empty-t">'+T('الطلب غير موجود','Order not found')+'</div>'
        + '<div class="empty-s">'+T('لم نعثر على هذا الطلب. تحقق من قائمة طلباتك.','We couldn\'t find this order. Check your orders list.')+'</div>'
        + '<div class="empty-actions"><a href="raf_orders.html" class="btn btn-gold"><i class="ti ti-receipt"></i> '+T('طلباتي','My Orders')+'</a></div></div>';
      return;
    }
    /* progress first, then the delivery itself, then the order's own detail */
    root.innerHTML = journeyHTML(o) + changeHTML(o) + detailsHTML(o);
    if(window.RAFJourneyUI) RAFJourneyUI.settle(document.getElementById('jrRoot'));
    unreadAlert(o);
    clearTimeout(CL_T); CL_T = null;
    if(typeof CL_AT==='number'){ var wait=CL_AT-Date.now(); if(wait>0 && wait<2147000000) CL_T=setTimeout(render, wait+50); }
    RAFShop.Cart.badge();
  }

  /* CLOSE: tracking is left for the homepage, REPLACING this history entry so
     Back does not bring the closed tracking screen back. Closing never touches
     the order; the active-order bar reopens it. */
  window.closeTracking=function(){ try { location.replace('raf_homepage.html'); } catch(e){ location.href='raf_homepage.html'; } };

  function boot(){
    /* arriving straight from checkout: clean the flag so a refresh isn't treated as new */
    var qs=new URLSearchParams(location.search);
    if(qs.get('new')==='1'){ qs.delete('new'); history.replaceState({},'','raf_tracking.html?'+qs.toString()); }
    render();
    var root=document.getElementById('htmlRoot');
    if(root) new MutationObserver(render).observe(root,{attributes:true,attributeFilter:['lang']});
    /* §24 — a decision taken in another tab lands here as storage events.
       Only the final state is repainted; the decision itself is never replayed,
       so a second tab can produce no second inventory, refund or audit effect. */
    window.addEventListener('storage', function(e){
      if (e.key === 'raf_order_changes' || e.key === 'raf_orders') render();
    });
    /* messages and read receipts (another tab, or the chat screen) refresh the
       unread count — the event is a reason to re-read, never data */
    if(window.RAFEventBus){ try { RAFEventBus.subscribe('communication.*', function(){ render(); }); } catch(e){} }
    document.addEventListener('visibilitychange', function(){ if(document.visibilityState==='visible') render(); });
  }
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',boot); else boot();
})();
</script>
</body>
</html>
