<style>
/* ===== page-specific: confirmation · timeline · driver · map ===== */
.od-wrap{max-width:860px;}

/* 1 · confirmation card */
.cf{position:relative;overflow:hidden;background:linear-gradient(150deg,var(--ink),#1c180f);border:1px solid rgba(201,168,76,.34);
  border-radius:var(--rl);padding:22px;margin-bottom:16px;color:#F3EEDD;display:flex;align-items:center;gap:16px;flex-wrap:wrap;}
.cf::after{content:'';position:absolute;inset:0;background:radial-gradient(420px 180px at 88% -30%,rgba(201,168,76,.2),transparent 62%);pointer-events:none;}
.cf>*{position:relative;}
.cf-ic{width:56px;height:56px;flex-shrink:0;border-radius:50%;background:rgba(46,158,91,.16);border:1px solid rgba(46,158,91,.45);
  display:flex;align-items:center;justify-content:center;font-size:28px;color:#5FD08A;}
.cf.is-cancelled .cf-ic{background:rgba(217,83,79,.16);border-color:rgba(217,83,79,.5);color:#F09490;}
.cf-b{flex:1;min-width:180px;}
.cf-t{font-family:var(--fdisplay);font-size:20px;font-weight:800;color:#fff;margin-bottom:4px;}
.cf-s{font-size:13px;color:#c2b9a6;line-height:1.6;}
.cf-facts{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;}
.cf-chip{display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.15);
  border-radius:20px;padding:7px 13px;font-size:12.5px;color:#F3EEDD;}
.cf-chip.gold{background:rgba(201,168,76,.15);border-color:rgba(201,168,76,.42);color:var(--gold);font-weight:700;}
.cf-chip.paid{background:rgba(46,158,91,.14);border-color:rgba(46,158,91,.4);color:#7FD9A2;font-weight:700;}
.cf-chip i{font-size:14px;}

/* 2 · interactive vertical timeline */
.tl{position:relative;}
.tl-step{display:flex;gap:14px;position:relative;}
.tl-rail{position:relative;display:flex;flex-direction:column;align-items:center;flex-shrink:0;width:38px;}
.tl-dot{width:38px;height:38px;border-radius:50%;border:2px solid var(--border2);background:var(--card);display:flex;align-items:center;
  justify-content:center;font-size:18px;color:var(--text3);z-index:1;transition:transform .3s,background .3s,border-color .3s,color .3s;}
.tl-line{flex:1;width:2px;background:var(--border2);margin:2px 0;transition:background .35s;}
.tl-step:last-child .tl-line{display:none;}
.tl-body{flex:1;min-width:0;padding-bottom:24px;transition:opacity .3s;}
.tl-step:last-child .tl-body{padding-bottom:0;}
.tl-name{font-size:15px;font-weight:700;color:var(--text3);transition:color .3s;}
.tl-time{font-size:12.5px;color:var(--text3);margin-top:3px;display:flex;align-items:center;gap:5px;}
.tl-desc{font-size:13px;color:var(--text3);line-height:1.7;margin-top:6px;}
/* completed */
.tl-step.done .tl-dot{background:var(--green);border-color:var(--green);color:#fff;}
.tl-step.done .tl-line{background:var(--green);}
.tl-step.done .tl-name{color:var(--ink);}
.tl-step.done .tl-time,.tl-step.done .tl-desc{color:var(--text2);}
/* cancelled */
.tl-step.cancel .tl-dot{background:var(--red);border-color:var(--red);color:#fff;}
.tl-step.cancel .tl-name{color:var(--red);}
/* active — accent + pulse */
.tl-step.active .tl-dot{background:var(--gold);border-color:var(--gold);color:#1C1606;transform:scale(1.06);
  box-shadow:0 0 0 0 rgba(201,168,76,.55);animation:tlPulse 2s infinite;}
.tl-step.active .tl-name{color:var(--ink);font-weight:800;}
.tl-step.active .tl-desc,.tl-step.active .tl-time{color:var(--text2);}
@keyframes tlPulse{0%{box-shadow:0 0 0 0 rgba(201,168,76,.5);}70%{box-shadow:0 0 0 12px rgba(201,168,76,0);}100%{box-shadow:0 0 0 0 rgba(201,168,76,0);}}
@media(prefers-reduced-motion:reduce){.tl-step.active .tl-dot{animation:none;}}
/* pending */
.tl-step.pending .tl-body{opacity:.62;}
/* ETA merged into the active step */
.tl-eta{display:inline-flex;align-items:center;gap:8px;margin-top:10px;background:var(--gold-soft);border:1px solid rgba(201,168,76,.35);
  border-radius:12px;padding:9px 13px;font-size:13px;color:var(--gold2);font-weight:700;}
.tl-eta i{font-size:16px;}

/* 3 · driver */
.dr{display:flex;align-items:center;gap:14px;flex-wrap:wrap;}
.dr-av{width:54px;height:54px;flex-shrink:0;border-radius:50%;background:var(--gold-soft);display:flex;align-items:center;
  justify-content:center;font-size:25px;color:var(--gold2);}
.dr-b{flex:1;min-width:150px;}
.dr-n{font-size:15px;font-weight:700;color:var(--ink);}
.dr-m{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:5px;font-size:12.5px;color:var(--text3);}
.dr-rate{display:inline-flex;align-items:center;gap:4px;background:var(--gold-soft);color:var(--gold2);border-radius:20px;padding:3px 9px;font-weight:700;}
.dr-rate i{font-size:12px;}
.dr-veh{display:inline-flex;align-items:center;gap:5px;background:var(--bg2);border:1px solid var(--border);border-radius:20px;
  padding:4px 10px;margin-top:8px;font-family:var(--fen);font-size:12px;font-weight:600;color:var(--text2);}
.dr-acts{display:flex;gap:8px;flex-shrink:0;}
.dr-btn{display:inline-flex;align-items:center;gap:6px;height:42px;padding:0 16px;border-radius:30px;border:1px solid var(--border2);
  background:var(--card);color:var(--text2);font-family:var(--font);font-size:13.5px;font-weight:700;cursor:pointer;transition:all .2s;}
.dr-btn:hover{border-color:var(--gold);color:var(--gold2);}
.dr-btn.primary{background:var(--green);border-color:var(--green);color:#fff;}
.dr-btn.primary:hover{background:#26834b;color:#fff;}

/* 4 · map (reduced height) */
.map{height:190px;border-radius:var(--r);overflow:hidden;position:relative;background:
  linear-gradient(0deg,rgba(201,168,76,.05),rgba(201,168,76,.05)),
  repeating-linear-gradient(0deg,var(--bg2) 0 1px,transparent 1px 34px),
  repeating-linear-gradient(90deg,var(--bg2) 0 1px,transparent 1px 34px),var(--bg);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:9px;text-align:center;padding:16px;}
.map i{font-size:34px;color:var(--gold2);opacity:.8;}
.map-t{font-size:13.5px;font-weight:700;color:var(--text2);}
.map-s{font-size:12px;color:var(--text3);}
.map.live{background:linear-gradient(150deg,#EDF3EE,#E4EDE6);}
.map-live-badge{position:absolute;top:12px;inset-inline-start:12px;display:inline-flex;align-items:center;gap:6px;background:var(--green);
  color:#fff;border-radius:20px;padding:5px 11px;font-size:11.5px;font-weight:700;}
.map-live-badge .pulse{width:7px;height:7px;border-radius:50%;background:#fff;animation:tlPulse 1.6s infinite;}

/* 5 · order details rows (reuses .ci from raf_checkout.css) */
.oi-tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:7px;}
.oi-tag{display:inline-flex;align-items:center;gap:5px;background:var(--bg2);border:1px solid var(--border);border-radius:20px;
  padding:4px 10px;font-size:11.5px;color:var(--text2);}
.oi-tag b{color:var(--ink);font-weight:700;}

/* 7 · action buttons */
.od-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:4px;}
.od-actions .btn{flex:1;min-width:190px;}
@media(max-width:560px){.od-actions .btn{min-width:100%;}.cf{padding:18px;}.cf-t{font-size:18px;}}
</style>

<script>
/* ============================================================
   ORDER DETAILS & TRACKING — single post-purchase page.
   Order is the single source of truth (RAFShop.Orders).
   ============================================================ */
(function(){
  var T=RAFCO.T, L=RAFCO.L, money=RAFCO.money;

  function getOrder(){
    var id=new URLSearchParams(location.search).get('id');
    var all=RAFShop.Orders.all();
    return (id && RAFShop.Orders.get(id)) || all[0] || null;
  }

  /* step copy keyed by timeline stage */
  var STEP={
    placed:{ic:'ti-receipt',   d:{ar:'تم استلام طلبك وتأكيد الدفع بنجاح.',en:'Your order was received and payment confirmed.'}},
    prep:  {ic:'ti-package',   d:{ar:'المتجر يجهّز ويعبّئ منتجاتك الآن.',en:'The store is preparing and packing your items.'}},
    ship:  {ic:'ti-truck-delivery', d:{ar:'المندوب في الطريق إليك.',en:'Your courier is on the way to you.'}},
    done:  {ic:'ti-home-check',d:{ar:'تم تسليم الطلب بنجاح. نتمنى لك تجربة سعيدة!',en:'Delivered successfully. We hope you enjoy it!'}},
    cancel:{ic:'ti-circle-x',  d:{ar:'تم إلغاء هذا الطلب.',en:'This order was cancelled.'}}
  };
  /* ETA shown inside the ACTIVE step only (single source of truth) */
  var ETA={
    prep:{ar:'يجهز الآن — يغادر المتجر خلال 20–30 دقيقة',en:'Preparing — leaves the store in 20–30 min'},
    ship:{ar:'يصل خلال 15–25 دقيقة تقريباً',en:'Arriving in about 15–25 min'},
    placed:{ar:'سيبدأ التجهيز خلال دقائق',en:'Preparation starts in a few minutes'}
  };

  function statusMeta(st){
    if(st==='delivered') return {cls:'b-delivered',ic:'ti-circle-check',label:T('تم التسليم','Delivered')};
    if(st==='cancelled') return {cls:'b-cancelled',ic:'ti-circle-x',label:T('ملغى','Cancelled')};
    return {cls:'b-progress',ic:'ti-truck-delivery',label:T('قيد التوصيل','In progress')};
  }

  /* ---------- 1 · confirmation ---------- */
  function confirmationHTML(o){
    var cancelled=o.status==='cancelled', delivered=o.status==='delivered';
    var title = cancelled ? T('تم إلغاء الطلب','Order cancelled')
              : delivered ? T('تم تسليم طلبك','Order delivered')
              : T('تم تأكيد طلبك!','Order confirmed!');
    var sub = cancelled ? T('إذا كان لديك أي استفسار تواصل مع الدعم.','Contact support if you have any questions.')
            : delivered ? T('شكراً لتسوقك من رف.','Thanks for shopping with RAF.')
            : T('شكراً لك — يمكنك متابعة حالة طلبك من هنا.','Thank you — you can follow your order status here.');
    /* payment status derived from the payment method */
    var payTxt=L(o.pay)||'';
    var isCOD=/الدفع عند الاستلام|cash on delivery/i.test(payTxt);
    var payState = cancelled ? T('مسترجع','Refunded') : (isCOD ? T('الدفع عند الاستلام','Pay on delivery') : T('مدفوع','Paid'));
    return '<div class="cf'+(cancelled?' is-cancelled':'')+'">'
      + '<div class="cf-ic"><i class="ti '+(cancelled?'ti-x':'ti-check')+'"></i></div>'
      + '<div class="cf-b"><div class="cf-t">'+title+'</div><div class="cf-s">'+sub+'</div>'
        + '<div class="cf-facts">'
          + '<span class="cf-chip gold"><i class="ti ti-hash"></i>'+o.id+'</span>'
          + '<span class="cf-chip"><i class="ti ti-coin"></i>'+o.total+' '+T('د.ك','KWD')+'</span>'
          + '<span class="cf-chip '+(cancelled?'':'paid')+'"><i class="ti ti-credit-card"></i>'+payState+'</span>'
        + '</div></div></div>';
  }

  /* ---------- 2 · timeline (ETA merged into active step) ---------- */
  function timelineHTML(o){
    var steps=(o.tl||[]);
    var activeIdx=steps.findIndex(function(s){ return s.s==='active'; });
    var rows=steps.map(function(s,i){
      var meta=STEP[s.k]||{ic:'ti-point',d:{ar:'',en:''}};
      var state = s.s==='cancel' ? 'cancel' : (s.s==='done' ? 'done' : (s.s==='active' ? 'active' : 'pending'));
      var icon = state==='done' ? 'ti-check' : (state==='cancel' ? 'ti-x' : meta.ic);
      var eta = (state==='active' && ETA[s.k])
        ? '<div class="tl-eta"><i class="ti ti-clock-hour-4"></i> '+L(ETA[s.k])+'</div>' : '';
      return '<div class="tl-step '+state+'">'
        + '<div class="tl-rail"><div class="tl-dot"><i class="ti '+icon+'"></i></div><div class="tl-line"></div></div>'
        + '<div class="tl-body"><div class="tl-name">'+L(s.t)+'</div>'
          + '<div class="tl-time"><i class="ti ti-clock" style="font-size:13px"></i> '+(L(s.time)||'—')+'</div>'
          + '<div class="tl-desc">'+L(meta.d)+'</div>' + eta
        + '</div></div>';
    }).join('');
    var sm=statusMeta(o.status);
    return '<div class="panel"><div class="panel-h"><i class="ti ti-timeline"></i> '+T('مراحل الطلب','Order progress')
      + '<span class="side"><span class="badge '+sm.cls+'"><i class="ti '+sm.ic+'"></i> '+sm.label+'</span></span></div>'
      + '<div class="panel-b"><div class="tl">'+rows+'</div></div></div>';
  }

  /* ---------- 3 · driver ---------- */
  function driverHTML(o){
    if(o.status==='cancelled') return '';
    var assigned = !!o.driverName || (o.status==='progress' && hasShipped(o));
    var name = o.driverName || (assigned ? T('خالد العنزي','Khaled Al-Anzi') : T('قيد التعيين','Being assigned'));
    var rating = o.driverRating || '4.8';
    var vehicle = o.driverVehicle || 'KWT · 45 B 2291';
    var trips = o.driverTrips || '238';
    if(!assigned){
      return '<div class="panel"><div class="panel-h"><i class="ti ti-motorbike"></i> '+T('مندوب التوصيل','Courier')+'</div>'
        + '<div class="panel-b"><div class="alert info"><i class="ti ti-info-circle"></i><div>'
        + T('سيتم تعيين مندوب فور جاهزية الطلب، وستظهر بياناته هنا.','A courier will be assigned once your order is ready — their details will appear here.')
        + '</div></div></div></div>';
    }
    return '<div class="panel"><div class="panel-h"><i class="ti ti-motorbike"></i> '+T('مندوب التوصيل','Courier')+'</div>'
      + '<div class="panel-b"><div class="dr">'
        + '<div class="dr-av"><i class="ti ti-user"></i></div>'
        + '<div class="dr-b"><div class="dr-n">'+name+'</div>'
          + '<div class="dr-m"><span class="dr-rate"><i class="ti ti-star-filled"></i> '+rating+'</span>'
          + '<span>'+trips+' '+T('توصيلة','deliveries')+'</span></div>'
          + '<div class="dr-veh"><i class="ti ti-motorbike"></i> '+vehicle+'</div></div>'
        + '<div class="dr-acts">'
          + '<button class="dr-btn primary" onclick="callDriver()"><i class="ti ti-phone"></i> '+T('اتصال','Call')+'</button>'
          + '<button class="dr-btn" onclick="chatDriver()"><i class="ti ti-message-2"></i> '+T('محادثة','Chat')+'</button>'
        + '</div></div></div></div>';
  }
  function hasShipped(o){ return (o.tl||[]).some(function(s){ return s.k==='ship' && (s.s==='active'||s.s==='done'); }); }

  /* ---------- 4 · map (placeholder → live when a driver location exists) ---------- */
  function mapHTML(o){
    if(o.status==='cancelled') return '';
    var live = !!o.driverLocation || hasShipped(o);
    return '<div class="panel"><div class="panel-h"><i class="ti ti-map-2"></i> '+T('موقع الطلب','Order location')+'</div>'
      + '<div class="panel-b"><div class="map'+(live?' live':'')+'">'
        + (live ? '<span class="map-live-badge"><span class="pulse"></span> '+T('تتبع مباشر','Live')+'</span>' : '')
        + '<i class="ti '+(live?'ti-truck-delivery':'ti-map-2')+'"></i>'
        + '<div class="map-t">'+(live?T('المندوب في الطريق إليك','Your courier is on the way'):T('التتبع المباشر غير متاح بعد','Live tracking not available yet'))+'</div>'
        + '<div class="map-s">'+(live?T('يتم تحديث الموقع تلقائياً','Location updates automatically'):T('ستظهر الخريطة فور انطلاق المندوب','The map appears once the courier departs'))+'</div>'
      + '</div></div></div>';
  }

  /* ---------- 5 · order details (products shown ONCE) ---------- */
  function detailsHTML(o){
    var storeName=L(o.store);
    var rows=(o.items||[]).map(function(it){
      var v=it.variant||{};
      var tags=Object.keys(v).map(function(k){ return '<span class="oi-tag">'+k+': <b>'+v[k]+'</b></span>'; });
      if(!tags.length && it.meta) tags.push('<span class="oi-tag">'+L(it.meta)+'</span>');
      tags.push('<span class="oi-tag">'+T('الكمية','Qty')+': <b>'+(it.qty||1)+'</b></span>');
      var st=it.store?L(it.store):storeName;
      return '<div class="ci">'
        + '<div class="ci-img"><i class="ti '+(it.ic||'ti-box')+'"></i></div>'
        + '<div class="ci-main"><div class="ci-name">'+L(it.name)+'</div>'
          + (st?'<div class="rc-store" style="margin-top:5px;font-size:12px;color:var(--text3);display:flex;align-items:center;gap:5px;"><i class="ti ti-building-store" style="color:var(--gold2)"></i> '+st+'</div>':'')
          + '<div class="oi-tags">'+tags.join('')+'</div>'
          + '<div class="ci-bot"><div class="ci-price" style="margin-inline-start:0"><b>'+it.price+' <small>'+T('د.ك','KWD')+'</small></b></div></div>'
        + '</div></div>';
    }).join('');
    return '<div class="panel"><div class="panel-h"><i class="ti ti-shopping-bag"></i> '+T('تفاصيل الطلب','Order Details')
      + '<span class="side">'+(o.items||[]).length+' '+T('منتج','items')+'</span></div>'+rows
      + '<div class="panel-b" style="border-top:1px solid var(--border);">'
        + '<div class="sum-row"><span><i class="ti ti-map-pin" style="color:var(--gold2)"></i> '+T('عنوان التوصيل','Delivery address')+'</span><span style="max-width:60%;text-align:end">'+L(o.addr)+'</span></div>'
        + '<div class="sum-row"><span><i class="ti ti-credit-card" style="color:var(--gold2)"></i> '+T('طريقة الدفع','Payment method')+'</span><span>'+L(o.pay)+'</span></div>'
        + '<div class="sum-row"><span><i class="ti ti-calendar" style="color:var(--gold2)"></i> '+T('تاريخ الطلب','Order date')+'</span><span>'+L(o.date)+'</span></div>'
      + '</div></div>';
  }

  /* ---------- 6 · invoice summary ---------- */
  function invoiceHTML(o){
    var total=parseFloat(o.total)||0, ship=parseFloat(o.ship)||0;
    var disc=parseFloat(o.discount)||0, tax=parseFloat(o.tax)||0, tip=parseFloat(o.tip)||0;
    /* prefer the stored breakdown; otherwise derive the subtotal from the grand
       total so the receipt always adds up (legacy orders have no breakdown) */
    var sub = o.subtotal!=null ? parseFloat(o.subtotal)
            : Math.max(0, total - ship - tax - tip + disc);
    return '<div class="panel"><div class="panel-h"><i class="ti ti-receipt"></i> '+T('ملخص الفاتورة','Invoice summary')+'</div>'
      + '<div class="panel-b">'
        + '<div class="sum-row"><span>'+T('المجموع الفرعي','Subtotal')+'</span><span>'+money(sub)+' '+T('د.ك','KWD')+'</span></div>'
        + (disc>0?'<div class="sum-row disc"><span>'+T('الخصم','Discount')+(o.coupon?' ('+o.coupon+')':'')+'</span><span>− '+money(disc)+'</span></div>':'')
        + '<div class="sum-row"><span>'+T('رسوم التوصيل','Delivery fee')+'</span>'+(ship===0?'<span class="free">'+T('مجاني','Free')+'</span>':'<span>'+money(ship)+'</span>')+'</div>'
        + (tip>0?'<div class="sum-row"><span>'+T('إكرامية السائق','Driver tip')+'</span><span>'+money(tip)+'</span></div>':'')
        + (tax>0?'<div class="sum-row"><span>'+T('الضريبة','Tax')+'</span><span>'+money(tax)+'</span></div>':'')
        + '<div class="sum-row total"><span>'+T('الإجمالي','Grand total')+'</span><b>'+money(total)+' '+T('د.ك','KWD')+'</b></div>'
      + '</div></div>';
  }

  /* ---------- 7 · actions ---------- */
  function actionsHTML(){
    return '<div class="od-actions">'
      + '<a href="raf_orders.html" class="btn btn-gold"><i class="ti ti-receipt"></i> '+T('طلباتي','My Orders')+'</a>'
      + '<a href="raf_homepage.html" class="btn btn-ghost"><i class="ti ti-building-store"></i> '+T('متابعة التسوق','Continue Shopping')+'</a>'
      + '</div>';
  }

  /* ---------- render ---------- */
  function render(){
    var root=document.getElementById('odRoot');
    var o=getOrder();
    if(!o){
      root.innerHTML='<div class="empty"><div class="empty-ic"><i class="ti ti-package-off"></i></div>'
        + '<div class="empty-t">'+T('الطلب غير موجود','Order not found')+'</div>'
        + '<div class="empty-s">'+T('لم نعثر على هذا الطلب. تحقق من قائمة طلباتك.','We couldn\'t find this order. Check your orders list.')+'</div>'
        + '<div class="empty-actions"><a href="raf_orders.html" class="btn btn-gold"><i class="ti ti-receipt"></i> '+T('طلباتي','My Orders')+'</a></div></div>';
      return;
    }
    root.innerHTML = confirmationHTML(o) + timelineHTML(o) + driverHTML(o) + mapHTML(o)
                   + detailsHTML(o) + invoiceHTML(o) + actionsHTML();
    RAFShop.Cart.badge();
  }

  window.callDriver=function(){ RAFShop.toast(T('جارٍ الاتصال بالمندوب…','Calling your courier…'),{icon:'ti-phone'}); };
  window.chatDriver=function(){ RAFShop.toast(T('جارٍ فتح المحادثة…','Opening chat…'),{icon:'ti-message-2'}); };
  window.goBack=function(){ if(history.length>1) history.back(); else window.location='raf_orders.html'; };

  function boot(){
    /* arriving straight from checkout: clean the flag so a refresh isn't treated as new */
    var qs=new URLSearchParams(location.search);
    if(qs.get('new')==='1'){ qs.delete('new'); history.replaceState({},'','raf_tracking.html?'+qs.toString()); }
    render();
    var root=document.getElementById('htmlRoot');
    if(root) new MutationObserver(render).observe(root,{attributes:true,attributeFilter:['lang']});
  }
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',boot); else boot();
})();
</script>
</body>
</html>
