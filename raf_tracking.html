<!DOCTYPE html>
<html id="htmlRoot" lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>رف — تفاصيل الطلب والتتبع</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700;900&family=Tajawal:wght@300;400;500;700;800&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
<!-- reuses the shared checkout design system (panels, buttons, footer, bottom nav) -->
<link rel="stylesheet" href="raf_checkout.css">
<link rel="icon" type="image/png" sizes="64x64" href="raf_favicon.png">
<link rel="icon" type="image/png" sizes="32x32" href="raf_favicon_32.png">
<link rel="apple-touch-icon" href="raf_appicon.png">
<style>
/* ===== page-specific: confirmation · timeline · driver · map ===== */
.od-wrap{max-width:860px;}

/* 1 · the order header — one dark, premium card carrying the state,
      the live indicator and the three facts that matter at a glance */
.hero{position:relative;overflow:hidden;background:linear-gradient(150deg,var(--ink),#1c180f);
  border:1px solid rgba(201,168,76,.34);border-radius:var(--rl);padding:20px 20px 16px;margin-bottom:14px;color:#F3EEDD;}
.hero::after{content:'';position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(420px 190px at 88% -30%,rgba(201,168,76,.22),transparent 62%);}
.hero>*{position:relative;}
.hero-top{display:flex;align-items:flex-start;gap:13px;}
.hero-ic{width:50px;height:50px;flex:0 0 auto;border-radius:16px;background:rgba(201,168,76,.16);
  border:1px solid rgba(201,168,76,.42);display:flex;align-items:center;justify-content:center;font-size:25px;color:var(--gold);}
.hero.is-done .hero-ic{background:rgba(46,158,91,.16);border-color:rgba(46,158,91,.45);color:#5FD08A;}
.hero.is-cancelled .hero-ic{background:rgba(217,83,79,.16);border-color:rgba(217,83,79,.5);color:#F09490;}
.hero-t{flex:1;min-width:0;}
.hero-t h1{margin:0;font-family:var(--fdisplay);font-size:21px;font-weight:800;color:#fff;line-height:1.35;}
.hero-t p{margin:5px 0 0;font-size:13px;color:#c2b9a6;line-height:1.6;}
.hero-live{display:inline-flex;align-items:center;gap:6px;flex:0 0 auto;height:28px;padding:0 11px;border-radius:20px;
  background:rgba(46,158,91,.18);border:1px solid rgba(46,158,91,.45);color:#8FE0AF;font-size:11.5px;font-weight:800;}
.hero-live b{width:7px;height:7px;border-radius:50%;background:#5FD08A;animation:heroBlink 1.8s ease-in-out infinite;}
@keyframes heroBlink{0%,100%{opacity:1;}50%{opacity:.3;}}
.hero-facts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px;margin-top:16px;}
.hero-fact{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.13);border-radius:14px;padding:10px 11px;min-width:0;}
.hero-fact span{display:block;font-size:10.5px;font-weight:700;color:#a99f8c;margin-bottom:4px;line-height:1.4;}
.hero-fact b{display:block;font-size:13.5px;font-weight:800;color:#F7F2E4;line-height:1.45;overflow-wrap:anywhere;}
.hero-fact.gold b{color:var(--gold);}
.hero-fact.muted b{color:#a99f8c;font-weight:700;}
@media (max-width:400px){ .hero-facts{grid-template-columns:1fr 1fr;} .hero-fact:last-child{grid-column:1 / -1;} }

/* 2 · the products in the order — products only, nothing else */
.pr-row{display:flex;align-items:center;gap:12px;padding:13px 0;border-top:1px solid var(--border);}
.pr-row:first-of-type{border-top:0;}
.pr-img{width:54px;height:54px;flex:0 0 auto;border-radius:14px;background:var(--bg2) center/cover no-repeat;
  display:flex;align-items:center;justify-content:center;font-size:24px;color:var(--gold2);}
.pr-b{flex:1;min-width:0;}
.pr-b b{display:block;font-size:14.5px;font-weight:800;color:var(--ink);line-height:1.5;overflow-wrap:anywhere;}
.pr-meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px;}
.pr-tag{display:inline-flex;align-items:center;gap:5px;background:var(--bg2);border:1px solid var(--border);border-radius:20px;
  padding:4px 10px;font-size:11.5px;color:var(--text2);}
.pr-tag b{color:var(--ink);font-weight:700;}
.pr-price{flex:0 0 auto;font-size:14px;font-weight:800;color:var(--ink);white-space:nowrap;}
.pr-price small{font-size:11px;font-weight:700;color:var(--text3);}
.pr-more{display:flex;align-items:center;justify-content:center;gap:7px;width:100%;min-height:46px;margin-top:4px;
  border:1px dashed var(--border2);border-radius:13px;background:transparent;color:var(--gold2);
  font-family:inherit;font-size:13.5px;font-weight:800;cursor:pointer;}
.pr-more:hover{border-color:var(--gold);background:var(--gold-soft);}
.pr-more:focus-visible{outline:2px solid var(--gold);outline-offset:2px;}

/* 7 · action buttons */
.od-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:4px;}
.od-actions .btn{flex:1;min-width:190px;}
@media(max-width:560px){.od-actions .btn{min-width:100%;}.cf{padding:18px;}.cf-t{font-size:18px;}}
/* ---------- GROUP C · customer approved change ---------- */
.cc-card{background:var(--card);border:1.5px solid var(--gold);border-radius:18px;padding:18px;margin-bottom:16px;
  box-shadow:0 6px 24px rgba(201,168,76,.14);}
.cc-h{display:flex;gap:11px;align-items:flex-start;margin-bottom:14px;}
.cc-h i{font-size:24px;color:var(--gold2);flex:0 0 auto;}
.cc-h b{display:block;font-size:15px;font-weight:800;color:var(--ink);line-height:1.45;}
.cc-h span{font-size:12.5px;color:var(--text2);}
.cc-prod{display:flex;align-items:center;gap:11px;padding:10px;border-radius:12px;background:var(--bg);margin-bottom:12px;}
.cc-th{width:46px;height:46px;border-radius:10px;background:var(--bg2) center/cover no-repeat;
  border:1px solid var(--border);flex:0 0 auto;}
.cc-prod b{display:block;font-size:13.5px;font-weight:800;color:var(--ink);overflow-wrap:anywhere;}
.cc-prod span{font-size:12px;color:var(--text2);font-family:var(--font-en);}
.cc-diff{display:flex;align-items:stretch;gap:10px;margin-bottom:12px;}
.cc-side{flex:1 1 0;min-width:0;padding:11px 13px;border-radius:12px;border:1px solid var(--border2);background:var(--bg);}
.cc-side span{display:block;font-size:11px;font-weight:800;color:var(--text3);margin-bottom:3px;}
.cc-side b{font-size:13.5px;font-weight:800;color:var(--text2);overflow-wrap:anywhere;}
.cc-side.new{border-color:var(--gold);background:var(--gold-soft);}
.cc-side.new b{color:var(--gold2);}
.cc-arrow{align-self:center;font-size:20px;color:var(--gold2);flex:0 0 auto;}
html[dir="ltr"] .cc-arrow{transform:rotate(180deg);}
.cc-reason,.cc-price{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--text2);margin-bottom:8px;}
.cc-reason i,.cc-price i{color:var(--gold2);font-size:16px;flex:0 0 auto;}
.cc-outcome{background:var(--bg);border:1px solid var(--border);border-radius:12px;padding:11px 13px;margin:12px 0 14px;}
.cc-outcome div{display:flex;gap:8px;align-items:flex-start;font-size:12px;line-height:1.65;color:var(--text2);}
.cc-outcome div+div{margin-top:7px;}
.cc-outcome i{flex:0 0 auto;font-size:15px;margin-top:1px;}
.cc-outcome div:first-child i{color:var(--green);}
.cc-outcome div:last-child i{color:var(--red);}
.cc-amt{flex:0 0 auto;font-family:var(--font-en);font-size:14px;font-weight:800;color:var(--ink);white-space:nowrap;}
.cc-prod.new{border:1px solid var(--gold);background:var(--gold-soft);}
.cc-swap{text-align:center;color:var(--gold2);font-size:19px;margin:-4px 0 8px;}
.cc-refund{display:flex;gap:9px;align-items:flex-start;background:rgba(46,158,91,.09);
  border:1px solid rgba(46,158,91,.3);border-radius:12px;padding:11px 13px;margin-bottom:10px;}
.cc-refund i{color:var(--green);font-size:19px;flex:0 0 auto;margin-top:1px;}
.cc-refund b{display:block;font-size:14px;font-weight:800;color:var(--ink);font-family:var(--font-en);}
.cc-refund em{font-style:normal;display:block;font-size:11.5px;color:var(--text2);line-height:1.6;margin-top:3px;
  font-family:var(--font-ar);}
.cc-dest{margin-bottom:12px;}
.cc-dest-h{font-size:12.5px;font-weight:800;color:var(--ink);margin-bottom:8px;}
#ccCard .cc-dest-o{display:flex;align-items:center;gap:10px;width:100%;min-height:56px;padding:11px 13px;
  margin-bottom:8px;border-radius:12px;border:1.5px solid var(--border2);background:var(--card);
  cursor:pointer;font-family:inherit;text-align:start;transition:all .16s;}
#ccCard .cc-dest-o:hover{border-color:var(--gold);}
#ccCard .cc-dest-o[aria-pressed="true"]{border-color:var(--ink);background:var(--bg);}
.cc-dest-tick{flex:0 0 auto;width:20px;height:20px;border-radius:50%;border:2px solid var(--border2);
  display:flex;align-items:center;justify-content:center;font-size:12px;color:var(--card);}
#ccCard .cc-dest-o[aria-pressed="true"] .cc-dest-tick{border-color:var(--ink);background:var(--ink);color:#F5F0E4;}
.cc-dest-o > i{font-size:21px;color:var(--gold2);flex:0 0 auto;}
.cc-dest-b{min-width:0;flex:1;}
.cc-dest-b b{display:block;font-size:13px;font-weight:800;color:var(--ink);line-height:1.4;}
.cc-dest-b em{font-style:normal;display:block;font-size:11.5px;color:var(--text2);line-height:1.55;}
.cc-acts{display:flex;flex-direction:column;gap:9px;}
/* the theme stylesheet loads after this block and sets a 40px floor on every
   button, so these decisions are id-scoped to outrank it */
#ccCard .cc-acts button{min-height:52px;border-radius:14px;font-family:inherit;font-size:15px;font-weight:800;
  cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1.5px solid transparent;}
#ccCard .cc-ok{background:var(--ink);color:#F5F0E4;border-color:var(--ink);}
#ccCard .cc-no{background:var(--card);color:var(--text2);border-color:var(--border2);}
#ccCard .cc-no:hover{border-color:var(--red);color:var(--red);}
#ccCard .cc-acts button:disabled{opacity:.55;cursor:progress;}
.cc-spin{display:inline-block;animation:ccspin .9s linear infinite;}
@keyframes ccspin{to{transform:rotate(360deg);}}
@media (prefers-reduced-motion:reduce){ .cc-spin{animation:none;} }
.cc-locked{display:flex;align-items:flex-start;gap:9px;min-height:52px;padding:13px 14px;border-radius:14px;
           background:var(--bg2);border:1px solid var(--border2);font-size:13.5px;line-height:1.65;color:var(--text2);}
.cc-locked i{font-size:18px;color:var(--text3);flex:0 0 auto;margin-top:1px;}
.cc-err{display:none;margin-top:11px;padding:10px 12px;border-radius:11px;background:rgba(217,83,79,.1);
  border:1px solid rgba(217,83,79,.32);color:var(--red);font-size:12.5px;font-weight:700;line-height:1.6;}
.cc-err.show{display:block;}
@media (min-width:560px){ .cc-acts{flex-direction:row;} .cc-acts button{flex:1;} }

/* ══════════════════════════════════════════════════════════════
   CUSTOMER TRACKING — three stages, horizontally.
   The whole component is written in logical properties, so the
   progression runs right→left in Arabic and left→right in English
   from the same markup: the connector fills from `inset-inline-start`
   and the row is an ordinary flex row, which the document direction
   already reverses. Nothing here is mirrored by hand.
   ══════════════════════════════════════════════════════════════ */
.trk-steps{background:var(--card);border:1px solid var(--border);border-radius:var(--rl);
  padding:20px 18px 16px;margin-bottom:14px;}
.trk-row{display:flex;align-items:flex-start;gap:0;position:relative;}
.trk-step{flex:1 1 0;min-width:0;display:flex;flex-direction:column;align-items:center;gap:9px;position:relative;}
/* the connector lives behind the nodes and runs between them */
.trk-step::before{content:'';position:absolute;top:21px;height:3px;border-radius:3px;background:var(--border2);
  inset-inline-start:-50%;width:100%;z-index:0;}
.trk-step:first-child::before{display:none;}
.trk-step::after{content:'';position:absolute;top:21px;height:3px;border-radius:3px;background:var(--gold2);
  inset-inline-start:-50%;width:0;z-index:1;transition:width .55s cubic-bezier(.22,1,.36,1);}
.trk-step:first-child::after{display:none;}
.trk-step.done::after,.trk-step.current::after{width:100%;}
.trk-node{position:relative;z-index:2;width:44px;height:44px;border-radius:50%;display:flex;align-items:center;
  justify-content:center;font-size:21px;background:var(--bg2);border:2px solid var(--border2);color:var(--text3);
  transition:background .35s,border-color .35s,color .35s,transform .35s;}
.trk-step.done .trk-node{background:rgba(46,158,91,.14);border-color:#2E9E5B;color:#1F7A45;}
.trk-step.current .trk-node{background:var(--gold-soft);border-color:var(--gold2);color:var(--gold2);transform:scale(1.06);}
.trk-step.current .trk-node::after{content:'';position:absolute;inset:-6px;border-radius:50%;
  border:2px solid var(--gold2);opacity:.55;animation:trkPulse 2.1s ease-out infinite;}
@keyframes trkPulse{0%{transform:scale(.92);opacity:.5;}70%{transform:scale(1.22);opacity:0;}100%{opacity:0;}}
.trk-lbl{font-size:12.5px;font-weight:800;line-height:1.5;text-align:center;color:var(--text3);
  max-width:11ch;overflow-wrap:anywhere;transition:color .35s;}
.trk-step.done .trk-lbl{color:var(--text2);}
.trk-step.current .trk-lbl{color:var(--ink);}
.trk-state{font-size:11px;font-weight:700;color:var(--text3);}
.trk-step.current .trk-state{color:var(--gold2);}
.trk-steps.is-cancelled .trk-node{background:rgba(217,83,79,.1);border-color:rgba(217,83,79,.4);color:var(--red);}
.trk-steps.is-cancelled .trk-step::after{background:var(--red);}
.trk-note{margin-top:14px;padding-top:12px;border-top:1px solid var(--border);display:flex;align-items:flex-start;
  gap:8px;font-size:12.5px;line-height:1.7;color:var(--text3);}
.trk-note i{font-size:16px;color:var(--gold2);flex:0 0 auto;margin-top:1px;}

/* live delivery */
.trk-live{background:var(--card);border:1px solid rgba(201,168,76,.4);border-radius:var(--rl);
  padding:18px;margin-bottom:14px;box-shadow:0 0 0 3px var(--gold-soft);}
.trk-live-h{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:4px;}
.trk-live-h h2{margin:0;flex:1;min-width:140px;font-size:15.5px;font-weight:800;color:var(--ink);}
.trk-dot{display:inline-flex;align-items:center;gap:6px;height:27px;padding:0 11px;border-radius:20px;
  background:rgba(46,158,91,.13);color:#1F7A45;font-size:11.5px;font-weight:800;white-space:nowrap;}
.trk-dot span{width:8px;height:8px;border-radius:50%;background:#2E9E5B;animation:trkBlink 1.8s ease-in-out infinite;}
@keyframes trkBlink{0%,100%{opacity:1;}50%{opacity:.35;}}
.trk-sub{font-size:13px;color:var(--text2);line-height:1.7;}
.trk-leg{display:flex;align-items:flex-start;gap:11px;padding:12px 0;border-top:1px solid var(--border);margin-top:12px;}
.trk-leg:first-of-type{border-top:0;margin-top:6px;}
.trk-leg .ic{width:36px;height:36px;flex:0 0 auto;border-radius:11px;background:var(--bg2);color:var(--gold2);
  display:flex;align-items:center;justify-content:center;font-size:18px;}
.trk-leg .b{flex:1;min-width:0;}
.trk-leg .b b{display:block;font-size:11.5px;font-weight:800;color:var(--text3);margin-bottom:3px;}
.trk-leg .b span{display:block;font-size:14px;color:var(--ink);line-height:1.6;overflow-wrap:anywhere;}
.trk-na{display:flex;align-items:flex-start;gap:9px;margin-top:12px;padding:12px 13px;border-radius:13px;
  border:1px dashed var(--border2);font-size:12.5px;line-height:1.7;color:var(--text3);}
.trk-na i{font-size:17px;flex:0 0 auto;margin-top:1px;}

/* driver */
.trk-driver{display:flex;align-items:center;gap:13px;flex-wrap:wrap;}
.trk-av{width:52px;height:52px;flex:0 0 auto;border-radius:50%;background:var(--gold-soft);color:var(--gold2);
  display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:800;}
.trk-driver .who{flex:1 1 160px;min-width:0;}
.trk-driver .who b{display:block;font-size:15.5px;font-weight:800;color:var(--ink);overflow-wrap:anywhere;}
.trk-driver .who span{display:block;font-size:12.5px;color:var(--text3);margin-top:2px;}

/* Phase G — rate the driver (once, final) */
.trk-rate{width:100%;margin-top:13px;padding-top:13px;border-top:1px solid var(--border);}
.trk-rate h3{margin:0 0 4px;font-size:14px;font-weight:800;color:var(--ink);}
.trk-rate p{margin:0 0 10px;font-size:12.5px;color:var(--text3);line-height:1.7;}
.trk-stars{display:flex;gap:6px;flex-wrap:wrap;border:0;margin:0 0 10px;padding:0;}
.trk-stars label{position:relative;cursor:pointer;}
.trk-stars input{position:absolute;opacity:0;width:1px;height:1px;}
.trk-stars span{display:inline-flex;align-items:center;justify-content:center;gap:4px;min-width:48px;min-height:48px;border-radius:14px;
  border:1px solid var(--border2);background:var(--card);color:var(--text2);font-weight:800;font-size:15px;}
.trk-stars input:checked + span{background:var(--gold);border-color:var(--gold2);color:#1C1606;}
.trk-stars input:focus-visible + span{outline:2px solid var(--gold);outline-offset:2px;}
.trk-rate textarea{width:100%;min-height:80px;border-radius:12px;border:1px solid var(--border2);background:var(--card);color:var(--ink);
  font-family:inherit;font-size:14px;padding:10px 12px;resize:vertical;box-sizing:border-box;}
.trk-rate textarea:focus{outline:2px solid var(--gold);outline-offset:1px;}
.trk-rate .trk-err{color:#A63A36;font-size:12.5px;margin:8px 0 0;}
.trk-rate .trk-send{margin-top:10px;min-height:48px;width:100%;border-radius:14px;border:1px solid var(--gold2);background:var(--gold);
  color:#1C1606;font-family:inherit;font-size:14px;font-weight:800;cursor:pointer;}
.trk-rate .trk-send:disabled{opacity:.5;cursor:not-allowed;}
.trk-rate .trk-send:focus-visible{outline:2px solid var(--ink);outline-offset:2px;}
.trk-rated{font-size:13.5px;color:var(--text2);line-height:1.7;}

/* compact summary + support */
.trk-kv{display:flex;justify-content:space-between;gap:14px;padding:11px 0;border-top:1px solid var(--border);
  font-size:13.5px;line-height:1.6;}
.trk-kv:first-of-type{border-top:0;}
.trk-kv .k{color:var(--text3);font-weight:700;display:inline-flex;align-items:center;gap:7px;flex:0 0 auto;}
.trk-kv .k i{color:var(--gold2);font-size:16px;}
.trk-kv .v{color:var(--ink);font-weight:700;text-align:end;max-width:62%;overflow-wrap:anywhere;}
.trk-help{display:flex;align-items:center;gap:13px;flex-wrap:wrap;}
.trk-help .b{flex:1 1 180px;min-width:0;}
.trk-help .b b{display:block;font-size:15px;font-weight:800;color:var(--ink);}
.trk-help .b span{display:block;font-size:13px;color:var(--text3);margin-top:3px;line-height:1.6;}
.trk-help a{display:inline-flex;align-items:center;justify-content:center;gap:7px;min-height:48px;padding:0 18px;
  border-radius:14px;border:1px solid var(--border2);background:var(--card);color:var(--ink);text-decoration:none;
  font-size:14px;font-weight:800;flex:0 0 auto;}
.trk-help a:hover{border-color:var(--gold);color:var(--gold2);}
.trk-help a:focus-visible{outline:2px solid var(--gold);outline-offset:2px;}

@media (max-width:420px){
  .trk-steps{padding:18px 12px 14px;}
  .trk-lbl{font-size:11.5px;max-width:9ch;}
  .trk-help a{width:100%;}
}
/* motion is a flourish, never the message */
@media (prefers-reduced-motion:reduce){
  .trk-step::after{transition:none;}
  .trk-step.current .trk-node::after{animation:none;opacity:.4;}
  .trk-dot span{animation:none;}
  .trk-node{transition:none;}
}
</style>

<body>

<script>
/* ============================================================
   ORDER DETAILS & TRACKING — single post-purchase page.
   Order is the single source of truth (RAFShop.Orders).
   ============================================================ */
(function(){
  var T=RAFCO.T, L=RAFCO.L, money=RAFCO.money;
  function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }

  function getOrder(){
    var id=new URLSearchParams(location.search).get('id');
    var all=RAFShop.Orders.all();
    return (id && RAFShop.Orders.get(id)) || all[0] || null;
  }

  /* ══════════════════════════════════════════════════════════════
     THE CUSTOMER'S VIEW OF THE ORDER — three stages, nothing else.

     The order lifecycle inside RAF has many more states than this, and the
     customer is shown none of them: no queue names, no engine states, no
     driver assignment wording, and none of the audit vocabulary that the
     record keeps internally. What follows is a PROJECTION of the existing
     authoritative data onto exactly three stages. It reads state, it never
     decides it, and it writes nothing.

       Stage 1 · جاري تجهيز طلبك   the store still has the order — placed,
                                   accepted, preparing, ready, or ready and
                                   waiting for a driver to take it
       Stage 2 · قيد التوصيل        a driver owns the delivery: from the
                                   moment the order is taken, through pickup,
                                   until it is handed over
       Stage 3 · تم التوصيل         the order was delivered

     Source of truth, in order of preference:
       · RAFOrderSnapshot fulfilment  (driverId / pickedUpAt / deliveredAt)
       · order.status                 (delivered / cancelled)
       · the order's own stages       — legacy orders carry no snapshot; their
                                        `ship` / `done` stages answer the same
                                        question without exposing any wording
     ══════════════════════════════════════════════════════════════ */
  var STAGES=[
    { key:'prep', ic:'ti-package',        ar:'جاري تجهيز طلبك', en:'Order being prepared' },
    { key:'ship', ic:'ti-truck-delivery', ar:'قيد التوصيل',     en:'Out for delivery' },
    { key:'done', ic:'ti-home-check',     ar:'تم التوصيل',      en:'Delivered' }
  ];
  function fulfilmentOf(o){
    var f = (o && o.snapshot && o.snapshot.fulfilment) || null;
    return (f && typeof f==='object') ? f : null;
  }
  /* legacy fallback: an order with no snapshot still knows how far it got */
  function legacyStage(o){
    var tl=o.tl||[];
    function at(k){ return tl.filter(function(s){ return s.k===k; })[0]; }
    var done=at('done'), ship=at('ship');
    if(done && done.s==='done') return 2;
    if(ship && (ship.s==='active'||ship.s==='done')) return 1;
    return 0;
  }
  function stageOf(o){
    var cancelled = o.status==='cancelled';
    var f = fulfilmentOf(o);
    var idx;
    if(o.status==='delivered' || (f && f.deliveredAt)) idx=2;
    else if(f && f.driverId)                           idx=1;   /* taken, picked up or on the way */
    else if(f)                                         idx=0;   /* still the store's */
    else                                               idx=legacyStage(o);
    return { index:idx, cancelled:cancelled,
             claimed:!!(f && f.driverId), picked:!!(f && f.pickedUpAt),
             delivered: idx===2 };
  }
  /* the driver carrying this order, from the delivery authority. Never a
     fabricated name, rating, vehicle or photo — only what the record holds. */
  function assignment(o){
    if(!window.RAFDriver || !RAFDriver.assignmentOf) return { claimed:false };
    try { return RAFDriver.assignmentOf(o.id) || { claimed:false }; }
    catch(e){ return { claimed:false }; }
  }

  function statusMeta(st){
    if(st==='delivered') return {cls:'b-delivered',ic:'ti-circle-check',label:T('تم التسليم','Delivered')};
    if(st==='cancelled') return {cls:'b-cancelled',ic:'ti-circle-x',label:T('ملغى','Cancelled')};
    return {cls:'b-progress',ic:'ti-truck-delivery',label:T('قيد التوصيل','In progress')};
  }

  /* the delivery commitment frozen into the snapshot at checkout. It is the
     only authoritative "when" RAF has: there is no live ETA anywhere, so when
     this is absent the page says so rather than estimating. */
  function commitmentOf(o){
    try { return (window.RAFStoreSchedule && o.snapshot) ? RAFStoreSchedule.formatCommitment(o.snapshot, T('ar','en')) : null; }
    catch(e){ return null; }
  }

  /* ---------- 1 · header — the current stage, in the customer's words ---------- */
  function confirmationHTML(o){
    var cancelled=o.status==='cancelled';
    var st=stageOf(o);
    var title = cancelled ? T('تم إلغاء الطلب','Order cancelled')
              : st.index===2 ? T('تم توصيل طلبك','Your order was delivered')
              : st.index===1 ? T('طلبك قيد التوصيل','Your order is out for delivery')
              : T('جاري تجهيز طلبك','Your order is being prepared');
    var sub = cancelled ? T('إذا كان لديك أي استفسار تواصل مع الدعم.','Contact support if you have any questions.')
            : st.index===2 ? T('شكراً لتسوقك من رف.','Thanks for shopping with RAF.')
            : st.index===1 ? T('سيصل إليك قريباً..','It will reach you shortly…')
            : T('المتجر يجهّز طلبك الآن، وسنخبرك فور خروجه للتوصيل.','The store is preparing your order — we will tell you as soon as it leaves for delivery.');
    var icon = cancelled ? 'ti-x' : st.index===2 ? 'ti-circle-check' : st.index===1 ? 'ti-truck-delivery' : 'ti-package';
    var commit = commitmentOf(o);
    /* the live badge belongs to a delivery that is actually happening */
    var live = (!cancelled && st.index===1)
      ? '<span class="hero-live"><b aria-hidden="true"></b>'+T('مباشر','Live')+'</span>' : '';
    return '<header class="hero'+(cancelled?' is-cancelled':'')+(st.index===2?' is-done':'')+'">'
      + '<div class="hero-top"><span class="hero-ic" aria-hidden="true"><i class="ti '+icon+'"></i></span>'
        + '<div class="hero-t"><h1>'+title+'</h1><p>'+sub+'</p></div>'+live+'</div>'
      + '<div class="hero-facts">'
        + '<div class="hero-fact'+(commit?'':' muted')+'"><span>'+T('الوقت المتوقع للوصول','Expected arrival')+'</span>'
          + '<b>'+(commit ? commit : T('غير متاح','Not available'))+'</b></div>'
        + '<div class="hero-fact"><span>'+T('إجمالي الطلب','Order total')+'</span><b>'+o.total+' '+T('د.ك','KWD')+'</b></div>'
        + '<div class="hero-fact gold"><span>'+T('رقم الطلب','Order number')+'</span><b>'+o.id+'</b></div>'
      + '</div></header>';
  }

  /* ---------- 2 · the three-stage tracker ----------
     One horizontal row. Every stage carries an icon AND its own word, so the
     state never depends on colour, and the whole row is announced to a screen
     reader as a progress bar with the stage the order is actually at. */
  function timelineHTML(o){
    var st=stageOf(o);
    var stages=STAGES.map(function(s,i){
      /* a delivered order has no "current" stage left — all three are done,
         so the finished tracker rests instead of pulsing forever */
      var state = st.cancelled ? (i<=st.index?'done':'')
                : i<st.index ? 'done'
                : i===st.index ? (st.delivered ? 'done' : 'current') : '';
      var icon  = st.cancelled ? 'ti-circle-x' : (state==='done' ? 'ti-check' : s.ic);
      var word  = state==='done' ? T('تم','Done') : state==='current' ? T('الآن','Now') : T('قادم','Next');
      return '<div class="trk-step '+state+'">'
        + '<span class="trk-node" aria-hidden="true"><i class="ti '+icon+'"></i></span>'
        + '<span class="trk-lbl">'+T(s.ar,s.en)+'</span>'
        + '<span class="trk-state">'+(st.cancelled?'—':word)+'</span>'
        + '</div>';
    }).join('');
    var current=STAGES[Math.min(st.index,2)];
    var reading = st.cancelled
      ? T('الطلب ملغى','Order cancelled')
      : T('المرحلة '+(st.index+1)+' من 3: '+current.ar, 'Stage '+(st.index+1)+' of 3: '+current.en);
    return '<section class="trk-steps'+(st.cancelled?' is-cancelled':'')+'" aria-label="'+T('مراحل الطلب','Order progress')+'">'
      + '<div class="trk-row" role="progressbar" aria-valuemin="1" aria-valuemax="3" aria-valuenow="'+(st.index+1)+'"'
        + ' aria-valuetext="'+reading+'">'+stages+'</div>'
      + '<p class="trk-note"><i class="ti ti-info-circle" aria-hidden="true"></i><span>'+reading+'</span></p>'
      + '</section>';
  }

  /* ---------- 3 · live delivery ----------
     Shown while the order is out for delivery. It states what is genuinely
     known — that a driver has the order, where it came from and where it is
     going — and says plainly that live location is not configured. RAF holds
     no coordinates, no route and no ETA, so none is drawn or estimated. */
  function liveHTML(o){
    var st=stageOf(o); if(st.cancelled || st.index!==1) return '';
    var a=assignment(o);
    var storeName=L(o.store);
    var commitment=commitmentOf(o);
    var statusLine = a.picked || st.picked
      ? T('استلم المندوب طلبك من المتجر وهو في طريقه إليك.','The driver collected your order from the store and is on the way to you.')
      : T('طلبك جاهز ومع مندوب التوصيل الآن.','Your order is ready and with the delivery driver now.');
    return '<section class="trk-live" aria-label="'+T('التتبع المباشر','Live tracking')+'">'
      + '<div class="trk-live-h"><h2>'+T('التتبع المباشر','Live tracking')+'</h2>'
        + '<span class="trk-dot"><span aria-hidden="true"></span>'+T('مباشر','Live')+'</span></div>'
      + '<p class="trk-sub">'+statusLine+'</p>'
      + '<div class="trk-leg"><span class="ic" aria-hidden="true"><i class="ti ti-building-store"></i></span>'
        + '<span class="b"><b>'+T('من المتجر','From the store')+'</b><span>'+(storeName||'—')+'</span></span></div>'
      + '<div class="trk-leg"><span class="ic" aria-hidden="true"><i class="ti ti-map-pin"></i></span>'
        + '<span class="b"><b>'+T('إلى عنوانك','To your address')+'</b><span>'+(L(o.addr)||'—')+'</span></span></div>'
      + (commitment
          ? '<div class="trk-leg"><span class="ic" aria-hidden="true"><i class="ti ti-clock-hour-4"></i></span>'
            + '<span class="b"><b>'+T('موعد التوصيل','Delivery time')+'</b><span>'+commitment+'</span></span></div>'
          : '')
      + '<div class="trk-na"><i class="ti ti-map-off" aria-hidden="true"></i><span>'
        + T('التتبع على الخريطة والوقت المتبقي غير مُهيّأين في هذه النسخة. حالة التوصيل أعلاه محدّثة وصحيحة.',
            'Map tracking and a remaining-time estimate are not configured in this version. The delivery status above is live and accurate.')
        + '</span></div></section>';
  }

  /* ---------- 4 · the driver ----------
     Only a real, named driver appears here. Before anybody takes the order
     there is no driver to show and the card stays away entirely — the
     customer is never told about assignment, queues or waiting. Nothing is
     invented: no vehicle, no photo, no location, because RAF holds
     none of them. */
  function driverHTML(o){
    var st=stageOf(o); if(st.cancelled) return '';
    var a=assignment(o);
    if(!a.claimed || !a.driverName) return '';
    var delivered = st.index===2;
    var line = delivered
      ? T('سلّم طلبك بنجاح.','Delivered your order.')
      : (a.pickedUpAt ? T('في الطريق إليك الآن.','On the way to you now.')
                      : T('مسؤول عن توصيل طلبك.','Responsible for delivering your order.'));
    /* the avatar is RAF's own initial mark — no photo exists in the record and
       none is invented */
    /* Phase H: calling and messaging live in the "Contact your driver" panel
       (RAFDriverCommunication) — not duplicated here */
    return '<div class="panel"><div class="panel-h" role="heading" aria-level="2"><i class="ti ti-motorbike"></i> '+T('معلومات مندوب التوصيل','Delivery driver')+'</div>'
      + '<div class="panel-b"><div class="trk-driver">'
        + '<span class="trk-av" aria-hidden="true">'+esc(String(a.driverName).trim().charAt(0))+'</span>'
        + '<span class="who"><b>'+esc(a.driverName)+'</b>'
          + '<span>'+T('مندوب توصيل رف','RAF delivery driver')+' · '+line+'</span>'
          +'</span>'
        + (delivered ? rateHTML(o) : '')
      + '</div></div></div>';
  }

  /* ---------- Phase H: the conversation with the driver ----------
     RAFDriverCommunication decides who may see or write; the widget renders.
     The panel stays hidden until a conversation exists for this customer. */
  function commHTML(o){
    if(!window.RAFCommUI) return '';
    return '<div class="panel" id="commWrap" hidden><div class="panel-h" role="heading" aria-level="2"><i class="ti ti-messages"></i> '
      + T('التواصل مع السائق','Contact your driver')+'</div><div class="panel-b" id="commRoot"></div></div>';
  }
  function mountComm(o){
    var el = document.getElementById('commRoot'); if(!el || !window.RAFCommUI) return;
    RAFCommUI.mount(el, { orderId:o.id, mode:'participant', onRender:function(x){
      var w = document.getElementById('commWrap'); if(w) w.hidden = !x.innerHTML; } });
  }

  /* ---------- Phase G: rate the driver who completed the delivery ----------
     RAFDriverRating is the authority: it proves the customer owns the order,
     that it was delivered, and credits the driver who completed it. One
     rating per order, final — after submitting the customer only sees it. */
  var RATE = { value:0, comment:'', busy:false, err:'' };
  function rateHTML(o){
    if(!window.RAFDriverRating) return '';
    var s = RAFDriverRating.statusFor(o.id);
    if(!s.ok) return '';                                   /* not this customer's order, or not a customer */
    if(s.myRating){
      return '<div class="trk-rate"><h3>'+T('تقييمك للسائق','Your rating of the driver')+'</h3>'
        + '<div class="trk-rated"><bdi dir="ltr">'+s.myRating.rating+' / 5 ★</bdi>'
        + (s.myRating.comment ? ' · <bdi>'+esc(s.myRating.comment)+'</bdi>' : '')
        + '<br>'+T('التقييم نهائي ولا يمكن تعديله. شكرًا لك.','Your rating is final and cannot be changed. Thank you.')+'</div></div>';
    }
    if(!s.canRate) return '';
    var stars = [1,2,3,4,5].map(function(n){
      return '<label><input type="radio" name="trkStar" value="'+n+'" '+(RATE.value===n?'checked':'')+' onchange="rateSet('+n+')">'
        + '<span><bdi dir="ltr">'+n+'</bdi><i class="ti ti-star-filled" aria-hidden="true"></i></span></label>'; }).join('');
    return '<div class="trk-rate"><h3>'+T('قيّم السائق','Rate the driver')+'</h3>'
      + '<p>'+T('من 1 إلى 5 نجوم. التعليق اختياري. لا يمكن تعديل التقييم بعد إرساله.','From 1 to 5 stars. The comment is optional. The rating cannot be changed after you send it.')+'</p>'
      + '<fieldset class="trk-stars"><legend class="sr-only" style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)">'+T('عدد النجوم','Number of stars')+'</legend>'+stars+'</fieldset>'
      + '<label for="trkComment" style="display:block;font-size:12.5px;font-weight:800;color:var(--text3);margin-bottom:5px">'+T('تعليق (اختياري)','Comment (optional)')+'</label>'
      + '<textarea id="trkComment" maxlength="1000" oninput="rateComment(this.value)">'+esc(RATE.comment)+'</textarea>'
      + (RATE.err ? '<p class="trk-err" role="alert">'+esc(RATE.err)+'</p>' : '')
      + '<button type="button" class="trk-send" onclick="rateSend()" '+(RATE.value && !RATE.busy ? '' : 'disabled')+'>'
      + '<i class="ti ti-send" aria-hidden="true"></i> '+T('إرسال التقييم','Send rating')+'</button></div>';
  }
  window.rateSet = function(n){ RATE.value = n; RATE.err = ''; render(); var r = document.querySelector('input[name="trkStar"][value="'+n+'"]'); if(r) r.focus(); };
  window.rateComment = function(v){ RATE.comment = v; };
  window.rateSend = function(){
    var o = getOrder(); if(!o || RATE.busy || !RATE.value) return;
    RATE.busy = true;
    var res = RAFDriverRating.submit(o.id, RATE.comment.trim() ? { rating:RATE.value, comment:RATE.comment } : { rating:RATE.value });
    RATE.busy = false;
    if(!res.ok){ RATE.err = res.message; render(); return; }
    RATE = { value:0, comment:'', busy:false, err:'' };
    RAFShop.toast(T('شكرًا، تم إرسال تقييمك.','Thank you, your rating was sent.'), { icon:'ti-check' });
    render();
  };

  /* ---------- 5 · the products, and only the products ----------
     No address, no payment, no order metadata: those belong to their own
     cards below. A long order shows the first two and opens on request. */
  var SHOWALL=false;
  window.showAllItems=function(){ SHOWALL=true; render(); };
  function productsHTML(o){
    var items=o.items||[];
    var count=items.reduce(function(n,it){ return n + (parseInt(it.qty,10)||1); },0);
    var COMPACT=2, shown=(SHOWALL || items.length<=COMPACT) ? items : items.slice(0,COMPACT);
    var rows=shown.map(function(it){
      var qty=parseInt(it.qty,10)||1;
      var v=it.variant||{};
      var tags=Object.keys(v).map(function(k){ return '<span class="pr-tag">'+esc(k)+': <b>'+esc(v[k])+'</b></span>'; });
      if(!tags.length && it.meta) tags.push('<span class="pr-tag">'+L(it.meta)+'</span>');
      tags.push('<span class="pr-tag">'+T('الكمية','Qty')+': <b>'+qty+'</b></span>');
      /* a real product image when the record has one; RAF's own icon otherwise */
      var media = it.img ? ' style="background-image:url(\''+esc(it.img)+'\')"' : '';
      return '<div class="pr-row"><span class="pr-img"'+media+' aria-hidden="true">'
        + (it.img ? '' : '<i class="ti '+esc(it.ic||'ti-box')+'"></i>')+'</span>'
        + '<span class="pr-b"><b>'+L(it.name)+'</b><span class="pr-meta">'+tags.join('')+'</span></span>'
        + (it.price ? '<span class="pr-price">'+it.price+' <small>'+T('د.ك','KWD')+'</small></span>' : '')
        + '</div>';
    }).join('');
    var more = (!SHOWALL && items.length>COMPACT)
      ? '<button class="pr-more" type="button" onclick="showAllItems()"><i class="ti ti-chevron-down" aria-hidden="true"></i>'
        + T('عرض جميع المنتجات','View all products')+' ('+items.length+')</button>' : '';
    return '<div class="panel"><div class="panel-h" role="heading" aria-level="2"><i class="ti ti-shopping-bag"></i> '+T('المنتجات في طلبك','Products in your order')
      + '<span class="side">'+count+' '+T('قطعة','items')+'</span></div>'
      + '<div class="panel-b">'+(rows||('<div class="trk-kv"><span class="v">'+T('لا توجد منتجات','No products')+'</span></div>'))+more+'</div></div>';
  }

  /* ---------- 6 · order details — order-level facts, stored values only ---------- */
  function orderDetailsHTML(o){
    return '<div class="panel"><div class="panel-h" role="heading" aria-level="2"><i class="ti ti-file-description"></i> '+T('تفاصيل الطلب','Order details')+'</div>'
      + '<div class="panel-b">'
        + '<div class="trk-kv"><span class="k"><i class="ti ti-hash" aria-hidden="true"></i>'+T('رقم الطلب','Order number')+'</span><span class="v">'+o.id+'</span></div>'
        + '<div class="trk-kv"><span class="k"><i class="ti ti-building-store" aria-hidden="true"></i>'+T('المتجر','Store')+'</span><span class="v">'+(L(o.store)||'—')+'</span></div>'
        + '<div class="trk-kv"><span class="k"><i class="ti ti-calendar" aria-hidden="true"></i>'+T('تاريخ الطلب','Order date')+'</span><span class="v">'+(L(o.date)||'—')+'</span></div>'
        + '<div class="trk-kv"><span class="k"><i class="ti ti-credit-card" aria-hidden="true"></i>'+T('طريقة الدفع','Payment method')+'</span><span class="v">'+(L(o.pay)||'—')+'</span></div>'
        + '<div class="trk-kv"><span class="k"><i class="ti ti-coin" aria-hidden="true"></i>'+T('الإجمالي','Total')+'</span><span class="v">'+o.total+' '+T('د.ك','KWD')+'</span></div>'
      + '</div></div>';
  }

  /* ---------- 7 · delivery information ----------
     The address and the commitment exactly as the order holds them. There is
     no live ETA in RAF, so none is shown and none is estimated. */
  function deliveryHTML(o){
    var commitment=commitmentOf(o);
    var d=(o.snapshot && o.snapshot.delivery) || {};
    var TYPE={ delivery:{ar:'توصيل إلى العنوان',en:'Delivery to your address'}, pickup:{ar:'استلام من المتجر',en:'Pickup from the store'} };
    var TIMING={ instant:{ar:'فوري',en:'Instant'}, scheduled:{ar:'موعد محدد',en:'Scheduled'}, next_opening:{ar:'عند افتتاح المتجر',en:'At the next opening'} };
    return '<div class="panel"><div class="panel-h" role="heading" aria-level="2"><i class="ti ti-map-pin"></i> '+T('معلومات التوصيل','Delivery information')+'</div>'
      + '<div class="panel-b">'
        + '<div class="trk-kv"><span class="k"><i class="ti ti-map-pin" aria-hidden="true"></i>'+T('عنوان التوصيل','Delivery address')+'</span><span class="v">'+(L(o.addr)||'—')+'</span></div>'
        + (TYPE[d.type] ? '<div class="trk-kv"><span class="k"><i class="ti ti-truck-delivery" aria-hidden="true"></i>'+T('نوع التوصيل','Delivery type')+'</span><span class="v">'+T(TYPE[d.type].ar,TYPE[d.type].en)+'</span></div>' : '')
        + (TIMING[d.timing] ? '<div class="trk-kv"><span class="k"><i class="ti ti-clock" aria-hidden="true"></i>'+T('وقت التوصيل','Delivery timing')+'</span><span class="v">'+T(TIMING[d.timing].ar,TIMING[d.timing].en)+'</span></div>' : '')
        + '<div class="trk-kv" id="dlvCommit"><span class="k"><i class="ti ti-clock-hour-4" aria-hidden="true"></i>'+T('الوقت المتوقع للوصول','Expected arrival')+'</span>'
          + '<span class="v">'+(commitment ? commitment : '<span style="color:var(--text3);font-weight:700">'+T('غير متاح','Not available')+'</span>')+'</span></div>'
      + '</div></div>';
  }

  /* ---------- 6 · help ----------
     Points at RAF's existing support centre. No ticket is opened from here
     and no message is faked. */
  function supportHTML(){
    return '<div class="panel"><div class="panel-b"><div class="trk-help">'
      + '<span class="b"><b>'+T('تحتاج إلى مساعدة؟','Need help?')+'</b>'
      + '<span>'+T('فريق الدعم جاهز لمساعدتك في أي استفسار عن طلبك.',
                   'Our support team is ready to help with anything about your order.')+'</span></span>'
      + '<a href="raf_support.html"><i class="ti ti-headset" aria-hidden="true"></i>'+T('مركز الدعم','Support centre')+'</a>'
      + '</div></div></div>';
  }

  /* ---------- 6 · invoice summary ---------- */
  function invoiceHTML(o){
    var total=parseFloat(o.total)||0, ship=parseFloat(o.ship)||0;
    var disc=parseFloat(o.discount)||0, tax=parseFloat(o.tax)||0, tip=parseFloat(o.tip)||0;
    /* prefer the stored breakdown; otherwise derive the subtotal from the grand
       total so the receipt always adds up (legacy orders have no breakdown) */
    var sub = o.subtotal!=null ? parseFloat(o.subtotal)
            : Math.max(0, total - ship - tax - tip + disc);
    return '<div class="panel"><div class="panel-h" role="heading" aria-level="2"><i class="ti ti-receipt"></i> '+T('ملخص الفاتورة','Invoice summary')+'</div>'
      + '<div class="panel-b">'
        + '<div class="sum-row"><span>'+T('المجموع الفرعي','Subtotal')+'</span><span>'+money(sub)+' '+T('د.ك','KWD')+'</span></div>'
        + (disc>0?'<div class="sum-row disc"><span>'+T('الخصم','Discount')+(o.coupon?' ('+o.coupon+')':'')+'</span><span>− '+money(disc)+'</span></div>':'')
        + '<div class="sum-row"><span>'+T('رسوم التوصيل','Delivery fee')+'</span>'+(ship===0?'<span class="free">'+T('مجاني','Free')+'</span>':'<span>'+money(ship)+'</span>')+'</div>'
        + (tip>0?'<div class="sum-row"><span>'+T('إكرامية السائق','Driver tip')+'</span><span>'+money(tip)+'</span></div>':'')
        + (tax>0?'<div class="sum-row"><span>'+T('الضريبة','Tax')+'</span><span>'+money(tax)+'</span></div>':'')
        + '<div class="sum-row total"><span>'+T('الإجمالي','Grand total')+'</span><b>'+money(total)+' '+T('د.ك','KWD')+'</b></div>'
      + '</div></div>';
  }

  /* ---------- 7 · actions ---------- */
  function actionsHTML(){
    return '<div class="od-actions">'
      + '<a href="raf_orders.html" class="btn btn-gold"><i class="ti ti-receipt"></i> '+T('طلباتي','My Orders')+'</a>'
      + '<a href="raf_homepage.html" class="btn btn-ghost"><i class="ti ti-building-store"></i> '+T('متابعة التسوق','Continue Shopping')+'</a>'
      + '</div>';
  }

  /* ---------- customer approved change ----------
     The store has asked for something. Nothing has moved yet, and nothing
     will until one of these two buttons is pressed. */
  /* the customer's refund choice, held only until they decide. It starts
     unset and this file never assigns it a default. */
  var CCDEST = null;
  window.pickRefundDest = function(d){ CCDEST = d; render(); };

  function destHTML(c){
    if (!c.needsDestination) return '';
    /* a resumed approval keeps the choice the customer already made */
    if (c.resuming && c.chosenDestination) {
      CCDEST = CCDEST || c.chosenDestination;
      return '<div class="cc-refund"><i class="ti ti-refresh"></i><div><b>'
        + T('لم تكتمل العملية السابقة','Your previous approval did not finish')
        + '</b><em>'+T('اضغط «الموافقة» لإكمالها. لن يتم خصم أو إرجاع أي مبلغ مرتين.',
                       'Press Approve to finish it. Nothing will be refunded twice.')+'</em></div></div>';
    }
    var D = RAFOrderChanges.REFUND_DESTINATION;
    var opts = [
      [D.ORIGINAL_PAYMENT, 'ti-credit-card', T('إعادة المبلغ إلى وسيلة الدفع الأصلية','Refund to original payment method'),
       T('قد يستغرق استرداد المبلغ حتى 7 أيام عمل.','Refunds may take up to 7 business days.')],
      [D.WALLET, 'ti-wallet', T('إضافته إلى محفظة رف','Add to RAF Wallet'),
       T('يتوفر في محفظتك فوراً بعد الموافقة.','Available in your wallet immediately after you approve.')]
    ];
    return '<div class="cc-dest"><div class="cc-dest-h">'
      + T('أين تريد استرداد المبلغ؟','Where should the refund go?')+'</div>'
      + opts.map(function(x){
          var on = CCDEST === x[0];
          return '<button class="cc-dest-o" aria-pressed="'+(on?'true':'false')+'" onclick="pickRefundDest(\''+x[0]+'\')">'
            + '<span class="cc-dest-tick">'+(on?'<i class="ti ti-check"></i>':'')+'</span>'
            + '<i class="ti '+x[1]+'"></i>'
            + '<span class="cc-dest-b"><b>'+x[2]+'</b><em>'+x[3]+'</em></span></button>';
        }).join('') + '</div>';
  }

  /* removal / replacement — the two changes that can move money */
  function lineChangeHTML(o, c){
    var name = T(c.productNameAr || c.productNameEn, c.productNameEn || c.productNameAr);
    var sub = [];
    if (c.size)  sub.push(T('المقاس','Size')+': '+c.size);
    if (c.color) sub.push(T('اللون','Colour')+': '+c.color);
    sub.push(T('الكمية','Qty')+': '+(c.qty||1));
    var isRemoval = c.kind === 'removal';
    var refund = parseFloat(c.refundAmount) || 0;

    var h = '<section class="cc-card" id="ccCard">'
      + '<div class="cc-h"><i class="ti '+(isRemoval?'ti-package-off':'ti-repeat')+'"></i><div>'
        + '<b>'+(isRemoval
            ? T('المتجر يطلب إزالة منتج غير متوفر','The store has asked to remove an unavailable product')
            : T('المتجر يطلب استبدال أحد المنتجات','The store has asked to replace a product'))+'</b>'
        + '<span>'+T('لن يتم تنفيذ أي تغيير إلا بعد موافقتك.','Nothing changes unless you approve it.')+'</span>'
      + '</div></div>'
      + '<div class="cc-prod">'
        + (c.image?'<span class="cc-th" style="background-image:url(\''+c.image+'\')"></span>':'')
        + '<div><b>'+name+'</b><span>'+sub.join(' · ')+'</span></div>'
        + '<span class="cc-amt">'+c.paidAmount+' '+T('د.ك','KWD')+'</span></div>';

    if (!isRemoval){
      var rname = T(c.replacementNameAr || c.replacementNameEn, c.replacementNameEn || c.replacementNameAr);
      h += '<div class="cc-swap"><i class="ti ti-arrow-down"></i></div>'
        + '<div class="cc-prod new">'
        + (c.replacementImage?'<span class="cc-th" style="background-image:url(\''+c.replacementImage+'\')"></span>':'')
        + '<div><b>'+rname+'</b><span>'+T('المنتج البديل','Replacement product')+'</span></div>'
        + '<span class="cc-amt">'+c.replacementPayable+' '+T('د.ك','KWD')+'</span></div>';
    }

    h += '<div class="cc-reason"><i class="ti ti-info-circle"></i><span>'
      + T('السبب','Reason')+': '+T(c.reasonAr, c.reasonEn)+'</span></div>';

    h += refund > 0
      ? '<div class="cc-refund"><i class="ti ti-cash"></i><div><b>'
        + (isRemoval ? T('سيتم إرجاع المبلغ','You will be refunded')
                     : T('سيتم إرجاع الفرق','You will be refunded the difference'))
        + ': '+c.refundAmount+' '+T('د.ك','KWD')+'</b>'
        + '<em>'+T('لا تتغيّر رسوم التوصيل ولا الكوبون ولا بقية المنتجات.',
                   'Delivery fee, coupon and your other products do not change.')+'</em></div></div>'
      : '<div class="cc-price"><i class="ti ti-tag"></i><span>'+T('لا يوجد تغيير في السعر','No change in price')+'</span></div>';

    h += destHTML(c);

    h += '<div class="cc-outcome">'
      + '<div><i class="ti ti-check"></i>'+(isRemoval
          ? T('عند الموافقة: يُزال هذا المنتج فقط ويُعاد مبلغه، ويكمل المتجر تجهيز بقية طلبك.',
              'If you approve: only this product is removed and refunded; the store continues with the rest of your order.')
          : T('عند الموافقة: يُستبدل هذا المنتج فقط، ويُعاد الفرق إن وجد.',
              'If you approve: only this product is replaced, and any difference is refunded.'))+'</div>'
      + '<div><i class="ti ti-x"></i>'+T('عند الرفض: يبقى طلبك كما هو دون أي تغيير، ويُبلَّغ المتجر بقرارك.',
            'If you decline: your order stays exactly as it is and the store is told.')+'</div>'
      + '</div>'
      + ccActionsHTML(c, T('الموافقة','Approve'), T('رفض','Decline'))
      + '</section>';
    return h;
  }

  /* ---------- the decision controls ----------
     Enabled for the person who placed the order and nobody else. The gate is
     asked of the order-changes authority, so this page never decides who a
     customer is, and a disabled button is never the only thing stopping a
     wrong actor — the authority refuses them too. */
  var CCBUSY = false;
  function ccGate(o){
    var C = window.RAFOrderChanges;
    if (!C || !C.canDecide) return { ok:true };
    return C.canDecide(o.id, ccActor());
  }
  function ccActionsHTML(c, okLabel, noLabel){
    var o = getOrder();
    var gate = o ? ccGate(o) : { ok:false };
    if (!gate.ok){
      return '<div class="cc-locked"><i class="ti ti-lock"></i><span>'
        + (gate.message || T('لا يمكن الرد على هذا الطلب من هذا الحساب.',
                             'This order cannot be answered from this account.'))
        + '</span></div>'
        + '<div class="cc-err" id="ccErr" role="alert"></div>';
    }
    return '<div class="cc-acts">'
      + '<button class="cc-ok" id="ccOk"'+(CCBUSY?' disabled':'')+' onclick="approveChange(\''+c.id+'\')">'
        + (CCBUSY ? '<i class="ti ti-loader-2 cc-spin"></i> '+T('جارٍ التنفيذ…','Working…')
                  : '<i class="ti ti-check"></i> '+okLabel)+'</button>'
      + '<button class="cc-no" id="ccNo"'+(CCBUSY?' disabled':'')+' onclick="declineChange(\''+c.id+'\')">'
        + '<i class="ti ti-x"></i> '+noLabel+'</button>'
      + '</div>'
      + '<div class="cc-err" id="ccErr" role="alert"></div>';
  }

  function changeHTML(o){
    var C = window.RAFOrderChanges;
    if (!C) return '';
    var c = C.describe(o.id);
    if (!c) return '';
    if (c.kind === 'removal' || c.kind === 'replacement') return lineChangeHTML(o, c);
    var group = T(c.groupAr || c.groupEn, c.groupEn || c.groupAr);
    var to    = T(c.toLabelAr || c.toLabelEn, c.toLabelEn || c.toLabelAr);
    var name  = T(c.productNameAr || c.productNameEn, c.productNameEn || c.productNameAr);
    return '<section class="cc-card" id="ccCard">'
      + '<div class="cc-h"><i class="ti ti-message-question"></i><div>'
        + '<b>'+T('المتجر يطلب تعديلاً على طلبك','The store has requested a change to your order')+'</b>'
        + '<span>'+T('لن يتم تنفيذ أي تغيير إلا بعد موافقتك.','Nothing changes unless you approve it.')+'</span>'
      + '</div></div>'
      + '<div class="cc-prod">'
        + (c.image?'<span class="cc-th" style="background-image:url(\''+c.image+'\')"></span>':'')
        + '<div><b>'+name+'</b><span>'+T('الكمية','Qty')+': '+(c.qty||1)+'</span></div></div>'
      + '<div class="cc-diff">'
        + '<div class="cc-side"><span>'+T('الحالي','Current')+'</span><b>'+group+': '+c.fromLabel+'</b></div>'
        + '<i class="ti ti-arrow-left cc-arrow"></i>'
        + '<div class="cc-side new"><span>'+T('المقترح','Proposed')+'</span><b>'+group+': '+to+'</b></div>'
      + '</div>'
      + '<div class="cc-reason"><i class="ti ti-info-circle"></i><span>'
        + T('السبب','Reason')+': '+T(c.reasonAr, c.reasonEn)+'</span></div>'
      + '<div class="cc-price"><i class="ti ti-tag"></i><span>'
        + T('لا يوجد تغيير في السعر','No change in price')+'</span></div>'
      + '<div class="cc-outcome">'
        + '<div><i class="ti ti-check"></i>'+T('عند الموافقة: يتم تعديل هذا المنتج فقط ويكمل المتجر تجهيز طلبك.',
              'If you approve: only this item changes and the store continues preparing your order.')+'</div>'
        + '<div><i class="ti ti-x"></i>'+T('عند الرفض: يبقى طلبك كما هو دون أي تغيير، ويُبلَّغ المتجر بقرارك.',
              'If you decline: your order stays exactly as it is and the store is told.')+'</div>'
      + '</div>'
      + ccActionsHTML(c, T('الموافقة على التعديل','Approve the change'),
                         T('رفض التعديل','Decline the change'))
      + '</section>';
  }
  function ccActor(){
    var u = (window.RAFPerm && RAFPerm.currentUser()) ? RAFPerm.currentUser() : null;
    return u ? { id:u.id, name:u.name } : null;
  }
  function ccFail(res){
    var box = document.getElementById('ccErr');
    if (!box) return;
    box.textContent = res.message || T('تعذّر تنفيذ العملية.','The action could not be completed.');
    box.classList.add('show');
  }
  /* One decision per press. The flag survives the re-render, so a second click
     (or a second tab) cannot submit the same answer twice; the authority is
     idempotent as well, so neither can produce a duplicate effect. */
  window.approveChange = function(id){
    var o = getOrder(); if (!o || CCBUSY) return;
    CCBUSY = true; render();
    var res = RAFOrderChanges.customerApprove(o.id, id, ccActor(), { refundDestination: CCDEST });
    CCBUSY = false;
    if (!res.ok) {
      /* re-render first so the card survives, then show why */
      render(); ccFail(res); return;
    }
    var msg = res.refund
      ? (res.refund.destination === 'wallet'
          ? T('تمت الموافقة. أُضيف ' + res.refund.amount + ' د.ك إلى محفظتك.',
              'Approved. ' + res.refund.amount + ' KWD was added to your wallet.')
          : T('تمت الموافقة. سيُعاد ' + res.refund.amount + ' د.ك إلى وسيلة الدفع الأصلية خلال 7 أيام عمل كحد أقصى.',
              'Approved. ' + res.refund.amount + ' KWD will be returned to your original payment method within 7 business days.'))
      : T('تم تطبيق التعديل على طلبك.','The change has been applied to your order.');
    CCDEST = null;
    RAFShop.toast(msg, { icon:'ti-check' });
    render();
  };
  window.declineChange = function(id){
    var o = getOrder(); if (!o || CCBUSY) return;
    CCBUSY = true; render();
    var res = RAFOrderChanges.customerReject(o.id, id, ccActor());
    CCBUSY = false;
    if (!res.ok) { render(); ccFail(res); return; }
    RAFShop.toast(T('تم رفض التعديل. طلبك كما هو.','Change declined. Your order is unchanged.'), { icon:'ti-x' });
    render();
  };

  /* ---------- render ---------- */
  function render(){
    var root=document.getElementById('odRoot');
    var o=getOrder();
    if(!o){
      root.innerHTML='<div class="empty"><div class="empty-ic"><i class="ti ti-package-off"></i></div>'
        + '<div class="empty-t">'+T('الطلب غير موجود','Order not found')+'</div>'
        + '<div class="empty-s">'+T('لم نعثر على هذا الطلب. تحقق من قائمة طلباتك.','We couldn\'t find this order. Check your orders list.')+'</div>'
        + '<div class="empty-actions"><a href="raf_orders.html" class="btn btn-gold"><i class="ti ti-receipt"></i> '+T('طلباتي','My Orders')+'</a></div></div>';
      return;
    }
    /* progress first, then the delivery itself, then the order's own detail */
    root.innerHTML = confirmationHTML(o) + changeHTML(o) + timelineHTML(o) + liveHTML(o) + driverHTML(o)
                   + commHTML(o)
                   + productsHTML(o) + orderDetailsHTML(o) + deliveryHTML(o)
                   + invoiceHTML(o) + supportHTML() + actionsHTML();
    mountComm(o);
    RAFShop.Cart.badge();
  }

  window.goBack=function(){ if(history.length>1) history.back(); else window.location='raf_orders.html'; };

  function boot(){
    /* arriving straight from checkout: clean the flag so a refresh isn't treated as new */
    var qs=new URLSearchParams(location.search);
    if(qs.get('new')==='1'){ qs.delete('new'); history.replaceState({},'','raf_tracking.html?'+qs.toString()); }
    render();
    var root=document.getElementById('htmlRoot');
    if(root) new MutationObserver(render).observe(root,{attributes:true,attributeFilter:['lang']});
    /* §24 — a decision taken in another tab lands here as storage events.
       Only the final state is repainted; the decision itself is never replayed,
       so a second tab can produce no second inventory, refund or audit effect. */
    window.addEventListener('storage', function(e){
      if (e.key === 'raf_order_changes' || e.key === 'raf_orders') render();
    });
    /* Phase G: a rating sent from another tab of this customer — repaint, but
       never while the comment is being typed */
    if (window.RAFEventBus) RAFEventBus.subscribe('driver.rating.submitted', function(){
      var a = document.activeElement; if (!(a && a.id === 'trkComment')) render();
    });
  }
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',boot); else boot();
})();
</script>
</body>
</html>
