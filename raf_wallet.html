<style>
/* one connected flow: balance → the three ways to add value → transactions */
.wl-bal{padding:14px 2px 18px;border-bottom:1px solid #E8E1D3;}
.wl-bal .l{font-size:14px;font-weight:700;color:#5A5650;}
.wl-bal .v{font-family:'DM Sans',sans-serif;font-size:44px;font-weight:800;line-height:1.1;margin-top:6px;color:#15130F;}
.wl-bal .v small{font-family:'Tajawal',sans-serif;font-size:17px;font-weight:700;color:#A07828;margin-inline-start:8px;}
.wl-bal .n{font-size:13px;color:#5A5650;margin-top:8px;line-height:1.7;}
.wl-bal .n bdi{font-family:'DM Sans',sans-serif;font-weight:700;color:#15130F;}
.wl-panel{padding:6px 34px 16px;border-bottom:1px solid #ECE6DA;}
html[dir="ltr"] .wl-panel{padding:6px 34px 16px;}
.wl-panel[hidden]{display:none;}
.ac-row[aria-expanded="true"] .go{transform:rotate(-90deg);}
html[dir="ltr"] .ac-row[aria-expanded="true"] .go{transform:rotate(90deg) scaleX(-1);}
.wl-methods{display:grid;gap:8px;margin:6px 0 4px;}
.wl-m{display:flex;align-items:center;gap:12px;min-height:52px;padding:10px 12px;border:1px solid #D8D0BE;border-radius:10px;background:#fff;cursor:pointer;font:inherit;text-align:start;color:#15130F;}
.wl-m i{font-size:21px;color:#A07828;}
.wl-m .s{display:block;font-size:12.5px;color:#8A857C;}
.wl-m[aria-checked="true"]{border-color:#C9A84C;box-shadow:0 0 0 2px rgba(201,168,76,.25);}
.wl-m .rd{margin-inline-start:auto;width:18px;height:18px;border-radius:50%;border:1.5px solid #D8D0BE;}
.wl-m[aria-checked="true"] .rd{border:5px solid #C9A84C;}
.wl-sum{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid #ECE6DA;font-size:14px;}
.wl-sum b{font-family:'DM Sans',sans-serif;}
.wl-proto{font-size:12.5px;color:#8A6A1F;background:rgba(201,168,76,.12);border-radius:8px;padding:8px 10px;margin:10px 0 0;line-height:1.6;}
/* compensation entitlement */
.cp{padding:14px 0;border-bottom:1px solid #ECE6DA;}
.cp:last-child{border-bottom:0;}
.cp-h{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;}
.cp-t{font-size:15px;font-weight:800;}
.cp-o{font-size:13px;color:#5A5650;margin-top:2px;font-family:'DM Sans','Tajawal',sans-serif;}
.cp-a{font-family:'DM Sans',sans-serif;font-size:18px;font-weight:800;white-space:nowrap;}
.cp-a small{font-family:'Tajawal',sans-serif;font-size:12px;color:#8A857C;font-weight:600;}
.cp-m{display:flex;flex-wrap:wrap;align-items:center;gap:6px 14px;margin-top:8px;font-size:13px;color:#5A5650;}
.cp-terms{margin:10px 0 0;padding:10px 12px;border-inline-start:3px solid #C9A84C;background:#F6F2EA;border-radius:0 8px 8px 0;font-size:13px;line-height:1.8;color:#3F3B35;}
html[dir="ltr"] .cp-terms{border-radius:0 8px 8px 0;}
.cp-terms ul{margin:0;padding-inline-start:18px;}
.cp-terms[hidden]{display:none;}
.gift-row{display:flex;gap:10px;align-items:stretch;flex-wrap:wrap;}
.gift-row input{flex:1;min-width:160px;min-height:46px;padding:10px 12px;border:1px solid #D8D0BE;border-radius:10px;font-family:'DM Sans',sans-serif;font-size:15px;letter-spacing:1px;text-transform:uppercase;}
.gift-row input:focus{outline:none;border-color:#C9A84C;box-shadow:0 0 0 3px rgba(201,168,76,.18);}
/* transactions */
.tx{display:flex;align-items:center;gap:12px;padding:14px 2px;border-bottom:1px solid #ECE6DA;}
.tx .ic{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:17px;flex-shrink:0;}
.tx .ic.cr{background:rgba(46,158,91,.12);color:#23794A;}
.tx .ic.db{background:rgba(217,83,79,.1);color:#A63A36;}
.tx .b{flex:1;min-width:0;}
.tx .t{font-size:14.5px;font-weight:700;overflow-wrap:anywhere;}
.tx .s{font-size:12.5px;color:#8A857C;margin-top:2px;}
.tx .a{font-family:'DM Sans',sans-serif;font-size:15px;font-weight:800;white-space:nowrap;}
.tx .a.cr{color:#23794A;} .tx .a.db{color:#A63A36;}
</style>

<script>
/* ============================================================
   WALLET — a view over the financial authorities. It keeps no balance and
   does no arithmetic on money:
     · balance, lots, transactions ....... RAFWallet
     · top-up (prototype payment) ........ RAFWallet.topUp + RAFPaymentMethods.online
     · compensation entitlements ......... RAFCompensation (mine / addToWallet)
     · gift codes ........................ RAFGift.redeem → RAFWallet.redeemGift
   Refunds to the wallet are credited automatically by the order flows
   (RAFWallet ledger) and simply appear in the transactions.
   ============================================================ */
(function(){
  function en(){ return document.getElementById('htmlRoot').lang === 'en'; }
  function T(ar,e){ return en() ? e : ar; }
  function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
  function KWD(){ return T('د.ك','KWD'); }
  function me(){ var u = (window.RAFPerm && RAFPerm.currentUser()) ? RAFPerm.currentUser() : null; return u ? { id:u.id, name:u.name, type:'customer' } : null; }
  function when(ts, withTime){
    try { return new Date(ts).toLocaleString(en() ? 'en-GB' : 'ar-KW', withTime === false ? { day:'numeric', month:'short', year:'numeric' } : { day:'numeric', month:'short', year:'numeric', hour:'2-digit', minute:'2-digit' }); } catch(e){ return ''; }
  }
  var S = { open:null, step:1, amount:'', method:null, msg:null, termsOpen:{}, busy:false, gift:'' };

  function balanceHTML(u){
    var b = RAFWallet.balance(u.id, u);
    if (!b.ok) return '<div class="ac-msg err">' + esc(b.message || '') + '</div>';
    var lots = RAFWallet.lots(u.id, u), live = lots.ok ? lots.lots.filter(function(L){ return L.remainingMinor > 0 && L.status !== 'expired'; }) : [];
    return '<div class="wl-bal"><div class="l">' + esc(T('رصيد المحفظة','Wallet balance')) + '</div>'
      + '<div class="v" id="wBalance">' + esc(b.balance) + '<small>' + esc(KWD()) + '</small></div>'
      + (b.compensationCreditMinor > 0
          ? '<div class="n">' + esc(T('منها رصيد تعويض','Of which compensation credit')) + ': <bdi dir="ltr">' + esc(b.compensationCredit) + '</bdi> ' + esc(KWD())
            + live.map(function(L){ return '<br>' + esc(T('ينتهي','Expires')) + ' ' + esc(when(L.expiresAt)) + ' — <bdi dir="ltr">' + esc(L.remaining) + '</bdi> ' + esc(KWD()); }).join('') + '</div>'
          : '')
      + '</div>';
  }

  /* ── A · top-up through one of RAF's online payment methods ── */
  function topupHTML(){
    var M = RAFPaymentMethods.online();
    var h = '';
    if (S.step === 1){
      h += '<div class="ac-fld" style="max-width:360px"><label for="tuAmt">' + esc(T('المبلغ (د.ك)','Amount (KWD)')) + '</label>'
        + '<input id="tuAmt" type="text" inputmode="decimal" dir="ltr" value="' + esc(S.amount) + '" autocomplete="off"></div>'
        + '<div class="ac-actions"><button type="button" class="ac-btn gold" data-act="tu-next">' + esc(T('متابعة إلى الدفع','Continue to payment')) + '</button></div>';
    } else if (S.step === 2){
      h += '<div class="wl-sum"><span>' + esc(T('المبلغ','Amount')) + '</span><b>' + esc(S.amount) + ' ' + esc(KWD()) + '</b></div>'
        + '<div class="ac-fld"><label>' + esc(T('طريقة الدفع','Payment method')) + '</label><div class="wl-methods" role="radiogroup">'
        + M.map(function(m){ var on = S.method === m.id;
            return '<button type="button" class="wl-m" role="radio" aria-checked="' + on + '" data-act="tu-method" data-id="' + esc(m.id) + '"><i class="ti ' + esc(m.ic) + '"></i><span><b>' + esc(T(m.ar, m.en)) + '</b><span class="s">' + esc(T(m.sAr, m.sEn)) + '</span></span><span class="rd"></span></button>'; }).join('')
        + '</div></div>'
        + '<div class="wl-proto"><i class="ti ti-info-circle"></i> ' + esc(T('نموذج أولي: لا توجد بوابة دفع فعلية في رف بعد، ويُعتبر الدفع مؤكَّداً عند التأكيد — كما في الدفع الإلكتروني عند إتمام الطلب.','Prototype: RAF has no real payment gateway yet; the payment is treated as confirmed when you confirm — as online payment is at checkout.')) + '</div>'
        + '<div class="ac-actions"><button type="button" class="ac-btn gold" data-act="tu-pay"' + (S.method ? '' : ' disabled') + '>' + esc(T('تأكيد الدفع','Confirm payment')) + '</button>'
        + '<button type="button" class="ac-btn ghost" data-act="tu-back">' + esc(T('رجوع','Back')) + '</button></div>';
    }
    return h;
  }

  /* ── B · compensation coupons assigned to this customer ── */
  var CSTATUS = { issued:['gold','متاح للإضافة','Available to add'], add_pending:['gold','متاح للإضافة','Available to add'],
    in_wallet:['green','أُضيف إلى المحفظة','Added to wallet'], consumed:['green','أُضيف إلى المحفظة واستُخدم','Added and used'],
    expired:['red','منتهي الصلاحية','Expired'], voided:['red','ملغى','Cancelled'], reversed:['red','أُلغي رصيده','Credit reversed'] };
  function termsHTML(c){
    return '<div class="cp-terms" id="terms_' + esc(c.compensationId) + '"' + (S.termsOpen[c.compensationId] ? '' : ' hidden') + '><ul>'
      + '<li>' + esc(T('يُمنح تعويض التأخير عند تسليم الطلب بعد الموعد المتوقع بأكثر من ' + c.excludedDelayMinutes + ' دقيقة.',
                      'Delay compensation applies when an order is delivered more than ' + c.excludedDelayMinutes + ' minutes after its promised time.')) + '</li>'
      + '<li>' + esc(T('قيمته ' + c.amountPerStep + ' د.ك عن كل ' + c.stepMinutes + ' دقيقة مكتملة بعد ذلك، دون تقريب.',
                      c.amountPerStep + ' KWD for every ' + c.stepMinutes + ' completed minutes beyond that — no rounding up.')) + '</li>'
      + '<li>' + esc(T('يُضاف إلى محفظة رف فقط، وبواسطتك فقط، مرة واحدة.','It can only be added to your RAF Wallet, by you, once.')) + '</li>'
      + '<li>' + esc(T('صالح للإضافة ' + c.validityDays + ' أيام من إصداره، حتى ' + when(c.expiresAt) + '، ولا يُمدَّد.',
                      'It can be added for ' + c.validityDays + ' days from issue, until ' + when(c.expiresAt) + ', and is never extended.')) + '</li>'
      + '<li>' + esc(T('بعد إضافته، ينتهي الجزء غير المستخدم منه في الموعد نفسه، ويُستخدم قبل رصيدك العادي عند الدفع.',
                      'Once added, any unused part expires at that same time, and it is spent before your ordinary balance.')) + '</li>'
      + '</ul></div>';
  }
  function compHTML(){
    var r = RAFCompensation.mine();
    if (!r.ok) return '<div class="ac-note"><i class="ti ti-info-circle"></i><span>' + esc(r.message || '') + '</span></div>';
    if (!r.compensations.length) return '<div class="ac-note"><i class="ti ti-gift"></i><span>' + esc(T('لا توجد كوبونات تعويض لك حالياً. تظهر هنا تلقائياً عند منحك تعويضاً عن تأخير طلب.','You have no compensation coupons. They appear here automatically when RAF grants you compensation for a delayed order.')) + '</span></div>';
    return r.compensations.map(function(c){
      var st = CSTATUS[c.status] || ['', c.status, c.status];
      return '<div class="cp" data-comp="' + esc(c.compensationId) + '">'
        + '<div class="cp-h"><div><div class="cp-t">' + esc(T('تعويض تأخير الطلب','Order delay compensation')) + '</div>'
          + '<div class="cp-o">' + esc(T('طلب','Order')) + ' #' + esc(c.orderId) + '</div></div>'
          + '<div class="cp-a">' + esc(c.amount) + ' <small>' + esc(KWD()) + '</small></div></div>'
        + '<div class="cp-m"><span class="ac-pill ' + st[0] + '">' + esc(T(st[1], st[2])) + '</span>'
          + (c.expiresAt ? '<span>' + esc(T('صالح حتى','Valid until')) + ' ' + esc(when(c.expiresAt)) + '</span>' : '')
          + '<button type="button" class="ac-link" data-act="terms" data-id="' + esc(c.compensationId) + '" aria-expanded="' + !!S.termsOpen[c.compensationId] + '" aria-controls="terms_' + esc(c.compensationId) + '">' + esc(T('الشروط والأحكام','Terms & Conditions')) + '</button>'
          + (c.canAddToWallet ? '<button type="button" class="ac-btn gold" style="min-height:40px;margin-inline-start:auto" data-act="comp-add" data-id="' + esc(c.compensationId) + '"' + (S.busy ? ' disabled' : '') + '>' + esc(T('إضافة إلى المحفظة','Add to wallet')) + '</button>' : '')
        + '</div>' + termsHTML(c) + '</div>';
    }).join('');
  }

  /* ── C · gift code ── */
  function giftHTML(){
    return '<div class="gift-row"><label class="sr-only" for="giftCode">' + esc(T('رمز الهدية','Gift code')) + '</label>'
      + '<input id="giftCode" type="text" autocomplete="off" dir="ltr" maxlength="24" value="' + esc(S.gift) + '" placeholder="' + esc(T('أدخل رمز الهدية','Enter gift code')) + '">'
      + '<button type="button" class="ac-btn gold" data-act="gift"' + (S.busy ? ' disabled' : '') + '>' + esc(T('إضافة إلى المحفظة','Add to wallet')) + '</button></div>';
  }

  function methodRow(key, ic, ar, en2, dsAr, dsEn, body){
    var open = S.open === key;
    return '<button type="button" class="ac-row" data-act="open" data-id="' + key + '" aria-expanded="' + open + '" aria-controls="p_' + key + '">'
      + '<i class="ti ' + ic + ' ic" aria-hidden="true"></i><span class="tx"><span class="lb">' + esc(T(ar, en2)) + '</span><span class="ds">' + esc(T(dsAr, dsEn)) + '</span></span>'
      + '<i class="ti ti-chevron-left go" aria-hidden="true"></i></button>'
      + '<div class="wl-panel" id="p_' + key + '"' + (open ? '' : ' hidden') + '>' + (open ? body() : '') + '</div>';
  }

  function txHTML(u){
    var h = RAFWallet.history(u.id, u);
    if (!h.ok) return '<div class="ac-msg err">' + esc(h.message || '') + '</div>';
    if (!h.transactions.length) return '<div class="ac-empty"><i class="ti ti-receipt-off"></i><b>' + esc(T('لا توجد معاملات بعد','No transactions yet')) + '</b></div>';
    return h.transactions.map(function(t){
      var cr = t.type === 'credit';
      var extra = [];
      if (t.meta && t.meta.method) extra.push(T(t.meta.methodAr, t.meta.methodEn) + (t.meta.prototypePayment ? ' · ' + T('دفع تجريبي','prototype payment') : ''));
      if (t.meta && t.meta.giftCode) extra.push(t.meta.giftCode);
      if (t.orderId) extra.push(T('طلب','Order') + ' #' + t.orderId);
      extra.push(when(t.timestamp));
      return '<div class="tx"><span class="ic ' + (cr ? 'cr' : 'db') + '"><i class="ti ' + (cr ? 'ti-arrow-down-left' : 'ti-arrow-up-right') + '"></i></span>'
        + '<div class="b"><div class="t">' + esc(T(t.descriptionAr, t.descriptionEn)) + '</div><div class="s">' + esc(extra.join(' · ')) + '</div></div>'
        + '<div class="a ' + (cr ? 'cr' : 'db') + '" dir="ltr">' + (cr ? '+' : '−') + esc(t.amount) + ' ' + esc(KWD()) + '</div></div>';
    }).join('');
  }

  function render(){
    var root = document.getElementById('wRoot'), u = me();
    if (!u){
      root.innerHTML = '<div class="ac-empty"><i class="ti ti-user-question"></i><b>' + esc(T('سجّل الدخول لعرض محفظتك','Sign in to see your wallet')) + '</b>'
        + '<a class="ac-link" href="raf_login.html">' + esc(T('تسجيل الدخول','Sign in')) + '</a></div>';
      return;
    }
    var focusId = document.activeElement && document.activeElement.id;
    root.innerHTML = balanceHTML(u)
      + (S.msg ? '<div class="ac-msg ' + S.msg.kind + '" role="status">' + esc(S.msg.text) + '</div>' : '')
      + ''
        + '<section class="ac-sec"><div class="ac-sec-h">' + esc(T('إعادة تعبئة المحفظة','Top up your wallet')) + '</div>'
          + methodRow('pay', 'ti-credit-card', 'طرق الدفع المتاحة', 'Available payment methods', 'أضف رصيداً بالدفع الإلكتروني', 'Add balance with an online payment', topupHTML)
          + methodRow('comp', 'ti-gift', 'كوبونات التعويض', 'Compensation coupons', 'تعويضات منحتك إياها رف', 'Compensation RAF has granted you', compHTML)
          + methodRow('gift', 'ti-gift-card', 'هدية', 'Gift', 'أدخل رمز هدية', 'Enter a gift code', giftHTML)
        + '</section>'
        + '<section class="ac-sec"><div class="ac-sec-h">' + esc(T('المعاملات','Transactions')) + '</div><div id="wTx">' + txHTML(u) + '</div></section>'
      ;
    if (focusId){ var f = document.getElementById(focusId); if (f) f.focus(); }
  }

  function say(kind, text){ S.msg = { kind:kind, text:text }; }
  document.addEventListener('input', function(e){
    if (e.target.id === 'tuAmt') S.amount = e.target.value.trim();
    if (e.target.id === 'giftCode') S.gift = e.target.value;
  });
  document.getElementById('wRoot').addEventListener('click', function(e){
    var b = e.target.closest('[data-act]'); if (!b) return;
    var act = b.getAttribute('data-act'), id = b.getAttribute('data-id');
    if (act === 'open'){ S.open = S.open === id ? null : id; S.msg = null; if (id === 'pay'){ S.step = 1; S.method = null; } render(); return; }
    if (act === 'tu-next'){
      var amt = (document.getElementById('tuAmt') || {}).value || '';
      if (RAFWallet.toMinor(amt.trim()) === null || RAFWallet.toMinor(amt.trim()) <= 0){ say('err', T('أدخل مبلغاً صحيحاً بالدينار (حتى 3 منازل عشرية).','Enter a valid amount in KWD (up to 3 decimals).')); render(); return; }
      S.amount = RAFWallet.format(RAFWallet.toMinor(amt.trim())); S.step = 2; S.msg = null; render(); return;
    }
    if (act === 'tu-method'){ S.method = id; render(); return; }
    if (act === 'tu-back'){ S.step = 1; S.msg = null; render(); return; }
    if (act === 'tu-pay'){
      var r = RAFWallet.topUp({ amount:S.amount, methodId:S.method, paymentRef:'P' + Date.now() + '-' + Math.random().toString(36).slice(2, 8) });
      if (r.ok){ say('ok', T('تمت إعادة التعبئة. رصيدك الآن ' + r.balance + ' د.ك.','Top-up complete. Your balance is now ' + r.balance + ' KWD.')); S.step = 1; S.amount = ''; S.method = null; }
      else say('err', r.message || T('تعذّرت إعادة التعبئة.','The top-up failed.'));
      render(); return;
    }
    if (act === 'terms'){ S.termsOpen[id] = !S.termsOpen[id]; render(); return; }
    if (act === 'comp-add'){
      if (S.busy) return; S.busy = true; render();
      Promise.resolve(RAFCompensation.addToWallet(id)).then(function(r){
        S.busy = false;
        if (r && r.ok) say('ok', T('أُضيف التعويض إلى محفظتك.','The compensation was added to your wallet.'));
        else say('err', (r && r.message) || T('تعذّرت إضافة التعويض.','The compensation could not be added.'));
        render();
      });
      return;
    }
    if (act === 'gift'){
      var code = ((document.getElementById('giftCode') || {}).value || '').trim();
      if (!code){ say('err', T('أدخل رمز الهدية.','Enter a gift code.')); render(); return; }
      var g = RAFGift.redeem(code);
      if (g.ok && !g.duplicate){ say('ok', T('أُضيفت الهدية إلى محفظتك. رصيدك الآن ' + g.balance + ' د.ك.','The gift was added to your wallet. Your balance is now ' + g.balance + ' KWD.')); S.gift = ''; }
      else if (g.ok && g.duplicate) say('err', T('سبق أن استخدمت هذا الرمز.','You have already used this code.'));
      else say('err', g.message || T('رمز الهدية غير صحيح.','That gift code is not valid.'));
      render(); return;
    }
  });
  window.onLangChange = render;
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', render); else render();
  window.addEventListener('storage', function(e){ if (!e.key || /wallet|compens|gift/.test(e.key)) render(); });
})();
</script>
<script src="raf_active_order.js"></script>
</body>
</html>
