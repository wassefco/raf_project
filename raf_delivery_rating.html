<style>
/* ===== Delivery & Rating — the visual language of the tracking journey ===== */
.dr-wrap{max-width:860px;}
.dr{--dr-green:var(--green,#2E9E5B);--dr-green-d:#1F7A45;--dr-cream:#FBF8F2;}

/* the completion hero */
.dr-hero{position:relative;overflow:hidden;display:flex;align-items:center;gap:8px 20px;flex-wrap:wrap;
  background:linear-gradient(180deg,#FFFFFF 0%,var(--dr-cream) 100%);border:1px solid var(--border);border-radius:28px;
  padding:26px 28px 0;margin-bottom:16px;box-shadow:0 1px 2px rgba(20,16,8,.04),0 24px 48px -28px rgba(20,16,8,.28);}
.dr-hero::before{content:"";position:absolute;inset:auto -10% -40% -10%;height:70%;pointer-events:none;
  background:radial-gradient(60% 60% at 50% 100%,rgba(46,158,91,.12),transparent 70%);}
.dr-hero-t{position:relative;flex:1 1 280px;min-width:0;padding-bottom:26px;}
.dr-ok{width:64px;height:64px;border-radius:50%;display:flex;align-items:center;justify-content:center;margin:18px 18px 16px;
  background:linear-gradient(180deg,#2FA15C,#1F8A4C);color:#fff;font-size:32px;
  box-shadow:0 0 0 4px #fff,0 0 0 7px #1F8A4C,0 0 0 16px rgba(46,158,91,.14),0 14px 26px -10px rgba(31,122,69,.6);
  animation:drPop .7s cubic-bezier(.2,.9,.3,1.3) both;}
.dr-ok svg{width:30px;height:30px;}
.dr-ok path{stroke-dasharray:24;animation:drCheck .6s ease-out .35s both;}
.dr-hero h1{margin:0;font-size:25px;font-weight:800;color:var(--ink);line-height:1.35;}
.dr-hero p{margin:8px 0 0;font-size:14px;color:var(--text2);line-height:1.7;}
.dr-hero .dr-no{display:inline-flex;align-items:center;gap:6px;margin-top:12px;padding:6px 12px;border-radius:999px;
  background:rgba(46,158,91,.1);border:1px solid rgba(46,158,91,.28);color:var(--dr-green-d);font-weight:800;font-size:13px;}
.dr-hero-art{position:relative;flex:0 1 380px;min-width:0;display:flex;justify-content:center;align-items:flex-end;align-self:flex-end;}
.dr-hero-art img{display:block;width:100%;max-width:380px;height:auto;filter:drop-shadow(0 12px 14px rgba(60,40,10,.12));
  animation:drRise .9s ease-out .1s both;}
@keyframes drPop{from{transform:scale(.4);opacity:0;}to{transform:none;opacity:1;}}
@keyframes drCheck{from{stroke-dashoffset:24;}to{stroke-dashoffset:0;}}
@keyframes drRise{from{transform:translateY(14px);opacity:0;}to{transform:none;opacity:1;}}

/* a rating card */
.dr-card{background:var(--card);border:1px solid var(--border);border-radius:24px;padding:22px 24px;margin-bottom:16px;
  box-shadow:0 2px 6px rgba(20,16,8,.03),0 14px 30px -22px rgba(20,16,8,.28);}
.dr-card-h{display:flex;align-items:center;gap:14px;margin-bottom:16px;}
.dr-card-h .ic{width:54px;height:54px;flex:0 0 auto;border-radius:16px;background:#F1EADB center/cover no-repeat;border:1px solid var(--border);
  display:flex;align-items:center;justify-content:center;font-size:26px;color:var(--gold2);overflow:hidden;}
.dr-card-h .ic img{width:100%;height:100%;object-fit:cover;display:block;}
.dr-card-h h2{margin:0;font-size:19px;font-weight:800;color:var(--ink);}
.dr-card-h span{display:block;font-size:13px;color:var(--text3);margin-top:2px;}
.dr-stars{display:flex;gap:8px;flex-wrap:wrap;margin:2px 0 6px;}
.dr .dr-star{width:54px;height:54px;min-height:54px;border-radius:16px;border:1.5px solid var(--border2);background:#fff;cursor:pointer;
  display:inline-flex;align-items:center;justify-content:center;font-size:28px;color:#CFC6B4;padding:0;
  transition:transform .15s,background .2s,border-color .2s,color .2s;}
.dr .dr-star:hover{transform:translateY(-2px);border-color:var(--gold);}
.dr .dr-star.on{background:#FFF6DC;border-color:#E0A526;color:#E0A526;}
.dr .dr-star:focus-visible{outline:2px solid var(--gold2);outline-offset:3px;}
.dr-val{font-size:13.5px;font-weight:700;color:var(--text2);min-height:22px;}
.dr-val.need{color:#A63A36;}
.dr-lbl{display:block;font-size:13.5px;font-weight:800;color:var(--ink);margin:14px 0 6px;}
.dr-lbl em{font-style:normal;font-weight:600;color:var(--text3);}
.dr textarea{width:100%;min-height:96px;border-radius:14px;border:1.5px solid var(--border2);background:#fff;color:var(--ink);
  font-family:inherit;font-size:15px;line-height:1.7;padding:12px 14px;resize:vertical;box-sizing:border-box;}
.dr textarea:focus{outline:none;border-color:var(--gold);box-shadow:0 0 0 3px var(--gold-soft);}
.dr-cnt{display:block;text-align:end;font-size:12px;color:var(--text3);margin-top:4px;font-family:var(--fen);}

/* submit */
.dr-err{margin:0 0 12px;padding:12px 14px;border-radius:14px;background:rgba(217,83,79,.08);border:1px solid rgba(217,83,79,.3);
  color:#A63A36;font-size:13.5px;line-height:1.6;}
.dr .dr-submit{width:100%;min-height:58px;border-radius:18px;border:1px solid var(--gold2);cursor:pointer;
  background:linear-gradient(180deg,#D9B85C,var(--gold));color:#1C1606;font-family:inherit;font-size:17px;font-weight:800;
  display:inline-flex;align-items:center;justify-content:center;gap:10px;box-shadow:0 14px 26px -16px rgba(160,120,40,.8);
  transition:transform .15s,box-shadow .2s;}
.dr .dr-submit:hover{transform:translateY(-1px);}
.dr .dr-submit:disabled{opacity:.6;cursor:progress;transform:none;}
.dr .dr-submit:focus-visible{outline:2px solid var(--ink);outline-offset:3px;}
/* the Delivery Completed step: one clear way on to the rating */
.dr .dr-completed{min-height:320px;}
.dr .dr-next{width:auto;min-width:220px;margin-top:18px;padding:0 24px;}

/* states */
.dr-done{text-align:center;padding:34px 24px;}
.dr-done .dr-ok{margin:18px auto 16px;}
.dr-done h2{margin:0;font-size:21px;font-weight:800;color:var(--ink);}
.dr-done p{margin:8px 0 0;font-size:14px;color:var(--text2);}
.dr-done a{display:inline-flex;align-items:center;gap:6px;margin-top:14px;min-height:44px;padding:0 16px;border-radius:12px;
  border:1px solid var(--border2);color:var(--ink);font-weight:700;text-decoration:none;}
.dr .dr-av{border-radius:50%;background:radial-gradient(circle at 35% 30%,#F4E3B5,#D9B25A);color:#4A3712;font-size:24px;font-weight:800;border:3px solid #fff;
  box-shadow:0 6px 16px -8px rgba(20,16,8,.45);}
.dr-dname{font-weight:800;color:var(--ink);}
.dr-agg{font-style:normal;font-weight:700;color:var(--ink);display:inline-flex;align-items:center;gap:4px;}
.dr-agg .ti{color:#E0A526;}
.dr-agg.none{font-weight:600;color:var(--text3);}
.dr-sub{padding:14px 0;border-top:1px solid var(--border);}
.dr-sub:first-child{border-top:0;padding-top:0;}
.dr-sub h3{margin:0 0 6px;font-size:15px;font-weight:800;color:var(--ink);}
.dr-sub p{margin:6px 0 0;font-size:14px;line-height:1.7;color:var(--text2);overflow-wrap:anywhere;}
.dr-sub-stars{display:inline-flex;gap:3px;font-size:20px;color:#CFC6B4;}
.dr-sub-stars .on{color:#E0A526;}
.dr-none{color:var(--text3);font-size:13px;}
.dr-home{display:inline-flex;align-items:center;min-height:44px;margin-top:14px;padding:0 16px;border-radius:12px;border:1px solid var(--border2);color:var(--ink);font-weight:700;text-decoration:none;}
.dr-gate{text-align:center;padding:40px 24px;}
.dr-gate i.big{font-size:42px;color:var(--gold2);}
.dr-gate h2{margin:12px 0 0;font-size:19px;font-weight:800;color:var(--ink);}
.dr-gate p{margin:8px 0 0;font-size:14px;color:var(--text2);line-height:1.7;}
.dr-gate a{display:inline-flex;align-items:center;gap:6px;margin-top:16px;min-height:44px;padding:0 18px;border-radius:12px;
  background:var(--ink);color:#F5F0E4;font-weight:700;text-decoration:none;}

@media (max-width:560px){
  .dr-hero{padding:20px 18px 0;border-radius:22px;}
  .dr-hero h1{font-size:21px;}
  .dr-hero-art{flex-basis:100%;}
  .dr-hero-art img{max-width:320px;}
  .dr-card{padding:18px;border-radius:20px;}
  .dr-stars{gap:6px;}
  .dr .dr-star{width:48px;height:48px;min-height:48px;font-size:25px;}
}
@media (prefers-reduced-motion:reduce){ .dr *{animation:none !important;transition:none !important;} }
</style>

<script>
/* ============================================================
   DELIVERY & RATING — تسليم الطلب والتقييم
   After delivery the customer rates the store and the driver of ONE order.

   RAFCustomerExperience IS THE AUTHORITY. This page asks it whether the
   signed-in customer may rate this order (their own, delivered, not rated
   yet) and submits one rating through it. Nothing here decides ownership,
   delivery or duplicates, and nothing is taken from the URL but the order id
   the authority then checks. A refused visitor sees no order details.
   ============================================================ */
(function(){
  var T=RAFCO.T, L=RAFCO.L;
  var HOME='raf_homepage.html', REDIRECT_MS=1600;
  function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
  function el(id){ return document.getElementById(id); }
  var CX=window.RAFCustomerExperience;
  var ORDER=new URLSearchParams(location.search).get('id');
  /* arriving from a delivery that just completed (tracking hands over with
     flow=delivered): Delivery Completed first, then straight into the rating */
  var FLOW=new URLSearchParams(location.search).get('flow')==='delivered';
  var STEP=FLOW ? 'completed' : 'rate', STEP_T=null, STEP_MS=2600;
  var S={ store:0, driver:0, storeComment:'', driverComment:'', busy:false, err:'', done:false, tried:false };
  var STATUS=null;
  var CHECK='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>';

  function gate(icon, titleAr, titleEn, bodyAr, bodyEn, link){
    return '<section class="dr-card dr-gate" role="alert"><i class="ti '+icon+' big" aria-hidden="true"></i>'
      + '<h2>'+T(titleAr,titleEn)+'</h2><p>'+T(bodyAr,bodyEn)+'</p>'
      + (link ? '<a href="'+esc(link.href)+'">'+T(link.ar,link.en)+'</a>' : '')+'</section>';
  }
  function refusal(r){
    var c=r && r.code;
    if(c==='UNAUTHENTICATED') return gate('ti-lock','يلزم تسجيل الدخول','Sign-in required',
      'سجّل الدخول بحسابك لتقييم طلبك.','Sign in with your account to rate your order.', { href:'raf_login.html', ar:'تسجيل الدخول', en:'Sign in' });
    if(c==='NOT_DELIVERED') return gate('ti-truck-delivery','لم يُسلَّم الطلب بعد','Not delivered yet',
      'يمكنك تقييم الطلب بعد تسليمه.','You can rate the order once it has been delivered.', { href:'raf_tracking.html?id='+encodeURIComponent(ORDER), ar:'تتبع الطلب', en:'Track the order' });
    if(c==='ALREADY_RATED') return gate('ti-circle-check','تم تقييم هذا الطلب','This order is already rated',
      'شكرًا لك، سبق أن قيّمت هذا الطلب.','Thank you — you have already rated this order.', { href:HOME, ar:'العودة إلى الرئيسية', en:'Back to home' });
    /* not yours, not found, not a customer, inactive: say nothing about the order */
    return gate('ti-file-off','لا يمكن عرض هذا الطلب','This order cannot be shown',
      'تحقق من طلباتك ثم حاول مرة أخرى.','Check your orders and try again.', { href:'raf_orders.html', ar:'طلباتي', en:'My orders' });
  }

  /* the order's driver — identity and aggregate from the rating authority; no contact */
  function driverAvatar(d){
    return '<span class="ic dr-av" aria-hidden="true">'+(d && d.initial ? esc(d.initial) : '<i class="ti ti-motorbike"></i>')+'</span>';
  }
  function driverLine(d){
    if(!d || !d.name) return '<span>'+T('سائق التوصيل الذي سلّمك الطلب','The driver who delivered your order')+'</span>';
    var r=d.rating||{};
    var agg = (r.count>0 && typeof r.average==='number')
      ? '<em class="dr-agg" aria-label="'+esc(T('تقييم السائق '+r.average.toFixed(1)+' من 5 من '+r.count+' تقييم','Driver rating '+r.average.toFixed(1)+' of 5 from '+r.count+' rating'+(r.count===1?'':'s')))+'">'
        + '<i class="ti ti-star-filled" aria-hidden="true"></i><bdi dir="ltr">'+r.average.toFixed(1)+'</bdi> ('+T(r.count+' تقييم', r.count+(r.count===1?' rating':' ratings'))+')</em>'
      : '<em class="dr-agg none">'+T('لا توجد تقييمات بعد','No ratings yet')+'</em>';
    return '<span><b class="dr-dname">'+esc(d.name)+'</b> · '+agg+'</span>';
  }
  function starRow(n){
    if(typeof n!=='number') return '<span class="dr-none">'+T('بدون تقييم','Not rated')+'</span>';
    var s=''; for(var i=1;i<=5;i++) s+='<i class="ti '+(i<=n?'ti-star-filled on':'ti-star')+'" aria-hidden="true"></i>';
    return '<span class="dr-sub-stars" role="img" aria-label="'+esc(T(n+' من 5',n+' of 5'))+'">'+s+'</span>';
  }
  /* already submitted: the customer's own feedback, read-only — the record is immutable */
  function submittedHTML(st){
    var mine=st.mine||{ store:{}, driver:null }, s=st.store||{};
    function part(title, r){
      return '<div class="dr-sub"><h3>'+title+'</h3>'+starRow(r && r.rating)
        + (r && r.comment ? '<p>'+esc(r.comment)+'</p>' : '<p class="dr-none">'+T('بدون تعليق','No comment')+'</p>')+'</div>';
    }
    return '<section class="dr-card dr-done" role="status"><div class="dr-ok">'+CHECK+'</div>'
      + '<h2>'+T('تم تقييم الطلب','This order has been rated')+'</h2>'
      + '<p>'+T('شكرًا لك. هذا ما أرسلته — لا يمكن تعديله بعد الإرسال.','Thank you. This is what you sent — it cannot be changed after submission.')+'</p></section>'
      + '<section class="dr-card">'
      + part(T('المتجر','Store')+' · '+esc(L(s.name)||'—'), mine.store)
      + (st.hasDriver ? part(T('السائق','Driver')+(st.driver && st.driver.name ? ' · '+esc(st.driver.name) : ''), mine.driver) : '')
      + '<a class="dr-home" href="'+HOME+'">'+T('العودة إلى الرئيسية','Back to home')+'</a></section>';
  }
  function starsHTML(key, labelAr, labelEn){
    var v=S[key], name=T(labelAr,labelEn);
    var btns=[1,2,3,4,5].map(function(n){
      return '<button type="button" class="dr-star'+(n<=v?' on':'')+'" role="radio" aria-checked="'+(n===v)+'"'
        + ' tabindex="'+((v?n===v:n===1)?'0':'-1')+'" data-star="'+key+'" data-n="'+n+'"'
        + ' aria-label="'+esc(name+': '+T(n+' من 5',n+' of 5'))+'">'
        + '<i class="ti '+(n<=v?'ti-star-filled':'ti-star')+'" aria-hidden="true"></i></button>';
    }).join('');
    /* optional: nothing chosen is a valid answer, and choosing the same star again clears it */
    return '<div class="dr-stars" role="radiogroup" aria-label="'+esc(name+' '+T('(اختياري)','(optional)'))+'">'+btns+'</div>'
      + '<div class="dr-val" id="val-'+key+'">'
      + (v ? esc(name+': '+T(v+' من 5',v+' of 5')) : T('اختياري — يمكنك تركه دون تقييم.','Optional — you can leave it unrated.'))
      + '</div>';
  }
  function commentHTML(key){
    var id='c-'+key, val=S[key+'Comment'], max=(STATUS && STATUS.limits && STATUS.limits.comment) || 2000;
    return '<label class="dr-lbl" for="'+id+'">'+T('اكتب تعليقك','Write a comment')+' <em>'+T('(اختياري)','(optional)')+'</em></label>'
      + '<textarea id="'+id+'" data-comment="'+key+'" maxlength="'+max+'" placeholder="'+esc(T('شاركنا تجربتك…','Tell us about your experience…'))+'">'+esc(val)+'</textarea>'
      + '<span class="dr-cnt" id="cnt-'+key+'"><bdi dir="ltr">'+val.length+' / '+max+'</bdi></span>';
  }

  function render(){
    var root=el('drRoot'); if(!root) return;
    document.title=T('رف — تسليم الطلب والتقييم','RAF — Delivery & Rating');
    if(S.done){
      root.innerHTML='<section class="dr-card dr-done" role="status"><div class="dr-ok">'+CHECK+'</div>'
        + '<h2>'+T('شكرًا لتقييمك!','Thank you for your rating!')+'</h2>'
        + '<p>'+T('تم حفظ تقييمك. ننقلك الآن إلى الصفحة الرئيسية.','Your rating was saved. Taking you to the homepage now.')+'</p>'
        + '<a href="'+HOME+'">'+T('الانتقال الآن','Go now')+'</a></section>';
      return;
    }
    if(!CX){ root.innerHTML=refusal(null); return; }
    STATUS=null; var st=null;
    try { st=CX.orderRatingStatus(ORDER); } catch(e){ st=null; }
    if(!st || !st.ok){ root.innerHTML=refusal(st); return; }
    if(st.state==='rated'){ root.innerHTML=submittedHTML(st); return; }
    STATUS=st;
    if(STEP==='completed'){ root.innerHTML=completedHTML(); if(!STEP_T) STEP_T=setTimeout(toRating, STEP_MS); return; }
    var s=st.store||{}, name=L(s.name)||'—', cat=s.category?L(s.category):'';
    var hero='<section class="dr-hero" aria-labelledby="drH">'
      + '<div class="dr-hero-t"><div class="dr-ok">'+CHECK+'</div>'
        + '<h1 id="drH">'+T('تم توصيل طلبك بنجاح','Your order was delivered')+'</h1>'
        + '<p>'+T('نتمنى أن تكون تجربتك رائعة. شاركنا رأيك في المتجر والسائق.','We hope it was a great experience. Tell us how the store and the driver did.')+'</p>'
        + '<span class="dr-no"><i class="ti ti-receipt" aria-hidden="true"></i><bdi dir="ltr">'+esc(ORDER)+'</bdi></span></div>'
      + '<div class="dr-hero-art" aria-hidden="true"><img src="assets/tracking/scene-home.png" alt=""></div></section>';
    var storeCard='<section class="dr-card" aria-labelledby="drS">'
      + '<div class="dr-card-h"><span class="ic">'+(s.logo?'<img src="'+esc(s.logo)+'" alt="">':'<i class="ti ti-building-store" aria-hidden="true"></i>')+'</span>'
        + '<div><h2 id="drS">'+T('قيّم المتجر','Rate the store')+'</h2><span>'+esc(name)+(cat?' · '+esc(cat):'')+'</span></div></div>'
      + starsHTML('store','تقييم المتجر','Store rating') + commentHTML('store') + '</section>';
    var driverCard = st.hasDriver ? '<section class="dr-card" aria-labelledby="drD">'
      + '<div class="dr-card-h">'+driverAvatar(st.driver)
        + '<div><h2 id="drD">'+T('قيّم السائق','Rate the driver')+'</h2>'+driverLine(st.driver)+'</div></div>'
      + starsHTML('driver','تقييم السائق','Driver rating') + commentHTML('driver') + '</section>' : '';
    var submit=(S.err?'<p class="dr-err" role="alert">'+esc(S.err)+'</p>':'')
      + '<button type="button" class="dr-submit" id="drSubmit"'+(S.busy?' disabled aria-busy="true"':'')+'>'
      + '<i class="ti '+(S.busy?'ti-loader-2':'ti-star')+'" aria-hidden="true"></i>'+(S.busy?T('جارٍ الحفظ…','Saving…'):T('تقييم','Submit rating'))+'</button>';
    var focus=document.activeElement && root.contains(document.activeElement) ? (document.activeElement.getAttribute('data-star') ? 's:'+document.activeElement.getAttribute('data-star')
              : document.activeElement.getAttribute('data-comment') ? 'c:'+document.activeElement.getAttribute('data-comment') : null) : null;
    root.innerHTML=hero+storeCard+driverCard+submit;
    if(focus){
      var k=focus.slice(2), t = focus.charAt(0)==='s' ? root.querySelector('[data-star="'+k+'"][tabindex="0"]') : root.querySelector('[data-comment="'+k+'"]');
      if(t){ t.focus(); if(t.setSelectionRange && t.value!=null) try{ t.setSelectionRange(t.value.length,t.value.length); }catch(e){} }
    }
  }

  /* the Delivery Completed screen of the post-delivery flow — it moves on to
     the rating by itself, or at once with the button */
  function completedHTML(){
    return '<section class="dr-hero dr-completed" role="status" aria-labelledby="drC">'
      + '<div class="dr-hero-t"><div class="dr-ok">'+CHECK+'</div>'
        + '<h1 id="drC">'+T('تم تسليم طلبك','Your order has been delivered')+'</h1>'
        + '<p>'+T('استلمت طلبك بنجاح. شكرًا لاستخدامك رف!','You have received your order. Thank you for using RAF!')+'</p>'
        + '<span class="dr-no"><i class="ti ti-receipt" aria-hidden="true"></i><bdi dir="ltr">'+esc(ORDER)+'</bdi></span>'
        + '<button type="button" class="dr-submit dr-next" id="drNext" onclick="drToRating()"><i class="ti ti-star" aria-hidden="true"></i>'
        + T('متابعة إلى التقييم','Continue to rating')+'</button></div>'
      + '<div class="dr-hero-art" aria-hidden="true"><img src="assets/tracking/scene-home.png" alt=""></div></section>';
  }
  function toRating(){
    if(STEP!=='completed') return;
    clearTimeout(STEP_T); STEP='rate'; render();
    var h=el('drH'); if(h){ h.setAttribute('tabindex','-1'); try { h.focus({ preventScroll:true }); } catch(e){} }
    window.scrollTo(0,0);
  }
  window.drToRating=toRating;
  function pick(key, n, fromKey){ S[key] = (!fromKey && S[key]===n) ? 0 : n; S.err=''; render(); }
  /* every field is optional — the submission is sent as it is, even empty */
  function submit(){
    if(S.busy || !STATUS) return;
    S.busy=true; S.err=''; render();
    var input={ orderId:ORDER };
    if(S.store) input.storeRating=S.store;
    if(S.storeComment.trim()) input.storeComment=S.storeComment;
    if(STATUS.hasDriver){ if(S.driver) input.driverRating=S.driver; if(S.driverComment.trim()) input.driverComment=S.driverComment; }
    Promise.resolve(CX.rateOrder(input)).then(function(r){
      S.busy=false;
      if(r && r.ok){
        /* saved and read back by the authority — only now is success shown */
        S.done=true; render();
        setTimeout(function(){ location.href=HOME; }, REDIRECT_MS);
      } else if(r && r.code==='ALREADY_RATED'){
        render();                                                 /* shows the already-rated state */
      } else {
        S.err=(r && r.message) || T('تعذّر حفظ التقييم. حاول مرة أخرى.','The rating could not be saved. Try again.');
        render();
      }
    });
  }

  document.addEventListener('click', function(e){
    var b=e.target.closest && e.target.closest('[data-star]');
    if(b){ pick(b.getAttribute('data-star'), +b.getAttribute('data-n')); return; }
    if(e.target.closest && e.target.closest('#drSubmit')) submit();
  });
  /* the star group is one radio group: arrows move and select, in reading direction */
  document.addEventListener('keydown', function(e){
    var b=e.target.closest && e.target.closest('[data-star]'); if(!b) return;
    var key=b.getAttribute('data-star'), n=+b.getAttribute('data-n'), rtl=document.getElementById('htmlRoot').dir==='rtl', next=null;
    if(e.key==='ArrowRight') next = rtl ? n-1 : n+1;
    else if(e.key==='ArrowLeft') next = rtl ? n+1 : n-1;
    else if(e.key==='ArrowUp') next=n+1; else if(e.key==='ArrowDown') next=n-1;
    else if(e.key==='Home') next=1; else if(e.key==='End') next=5;
    else if(e.key===' ' || e.key==='Enter'){ e.preventDefault(); pick(key,n); return; }
    if(next===null) return;
    e.preventDefault(); next=Math.max(1,Math.min(5,next)); pick(key,next,true);
  });
  document.addEventListener('input', function(e){
    var t=e.target; if(!t.getAttribute) return; var k=t.getAttribute('data-comment'); if(!k) return;
    S[k+'Comment']=t.value;
    var c=el('cnt-'+k); if(c) c.innerHTML='<bdi dir="ltr">'+t.value.length+' / '+t.getAttribute('maxlength')+'</bdi>';
  });

  window.goBack=function(){ if(history.length>1) history.back(); else location.href='raf_tracking.html?id='+encodeURIComponent(ORDER||''); };
  function boot(){
    render();
    var root=document.getElementById('htmlRoot');
    if(root) new MutationObserver(function(){ if(!S.busy) render(); }).observe(root,{attributes:true,attributeFilter:['lang']});
  }
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',boot); else boot();
})();
</script>
</body>
</html>
