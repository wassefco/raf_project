  window.saveCreate = function(){
    if (!CW || cwBusy) return;
    var b = el('cwErr'); b.classList.remove('show'); b.innerHTML = '';
    cwBusy = true; el('cwSave').disabled = true;

    /* 1 — option groups, validated by the variant authority before anything */
    var groups = CW.groups.filter(function(g){ return g.options.length; }).map(function(g){
      return { label: g.kind==='color' ? { ar:'اللون', en:'Colour' } : { ar:'المقاس', en:'Size' },
               options: g.options.map(function(o){
                 var x = { v:o.v, label:{ ar:o.label.ar, en:o.label.en } };
                 if (o.hex) x.hex = o.hex;
                 return x;
               }) };
    });
    if (groups.length){
      var gv = MV.validateGroups(groups);
      if (!gv.ok){ cwBusy=false; el('cwSave').disabled=false; return cwShowErrors(gv.errors); }
    }
    /* 2 — images, validated by the media authority */
    if (CW.images.length){
      var mv = MM.validate(CW.images);
      if (!mv.ok){ cwBusy=false; el('cwSave').disabled=false; return cwShowErrors(mv.errors); }
    }

    /* 3 — the base product, created atomically by the authority */
    var draft = {
      name:{ ar:String(CW.name.ar).trim(), en:String(CW.name.en).trim() },
      desc:{ ar:String(CW.desc.ar).trim(), en:String(CW.desc.en).trim() },
      price:String(CW.price).trim(), cat:CW.cat, status:CW.status
    };
    if (String(CW.old).trim())  draft.old  = String(CW.old).trim();
    if (String(CW.disc).trim()) draft.disc = Number(String(CW.disc).trim());
    if (String(CW.sku).trim())     draft.sku = String(CW.sku).trim();
    if (String(CW.barcode).trim()) draft.barcode = String(CW.barcode).trim();
    if (groups.length) draft.variants = groups;
    if (CW.images.length){ draft.images = CW.images.slice(); draft.img = CW.images[0]; }

    var res = MP.create(draft, { actor:ME });
    if (!res.ok){
      cwBusy = false; el('cwSave').disabled = false;
      return cwShowErrors(res.errors || [{ message:T('تعذّر إنشاء المنتج','Could not create the product') }]);
    }

    /* 4 — the chosen combinations, through the inventory authority. The base
       product already exists and stays valid: if this step fails the merchant
       is told plainly and can finish in Products → Inventory. */
    var pid = res.productId, comboWarning = null;
    var chosen = Object.keys(CW.combos).filter(function(k){ return CW.combos[k]; });
    if (chosen.length && window.RAFInventory){
      var entries = {}, bad = false;
      chosen.forEach(function(k){
        var id = RAFInventory.combinationIdFor(pid, k.split('|'));
        if (!id) { bad = true; return; }
        entries[id] = 0;               /* exists, no units yet — quantities live in Inventory */
      });
      if (bad || !Object.keys(entries).length){
        comboWarning = T('تم إنشاء المنتج، لكن تعذّر تحديد بعض التركيبات. أكملها من المنتجات ← المخزون.',
                         'The product was created, but some combinations could not be resolved. Finish them in Products → Inventory.');
      } else {
        var cres = RAFInventory.setCombinations(pid, entries, { actor:ME });
        if (!cres.ok)
          comboWarning = T('تم إنشاء المنتج، لكن تعذّر حفظ التركيبات. أكملها من المنتجات ← المخزون.',
                           'The product was created, but its combinations could not be saved. Finish them in Products → Inventory.');
      }
    }

    cwBusy = false; el('cwSave').disabled = false;
    cwDirty = false;
    el('createWs').classList.remove('show');
    CW = null;
    document.body.style.overflow = '';
    render();
    toast(comboWarning || T('تم إنشاء المنتج '+pid, 'Product '+pid+' created'));
  };

  /* ---------- save / cancel ---------- */
  function readForm(){
    return {
      name: { ar:el('nameAr').value.trim(), en:el('nameEn').value.trim() },
      desc: { ar:el('descAr').value.trim(), en:el('descEn').value.trim() },
      price: el('price').value.trim(),
      old:   el('old').value.trim(),
      disc:  el('disc').value.trim() === '' ? 0 : Number(el('disc').value.trim()),
      /* stock is intentionally not collected — it is read-only in this phase */
      status: el('status').value,
      cat:   el('cat').value
    };
  }
  function clearErrors(){
    document.querySelectorAll('.mw-f.err').forEach(function(f){ f.classList.remove('err'); });
    var b = el('edErr'); b.classList.remove('show'); b.innerHTML = '';
  }
  var FIELD_MAP = { 'name.ar':'nameAr','name.en':'nameEn', price:'price', old:'old',
                    disc:'disc', status:'status', cat:'cat' };
  function showErrors(errors){
    var b = el('edErr');
    b.innerHTML = '<b>'+T('تعذّر الحفظ','Could not save')+'</b><ul>'
      + errors.map(function(e){ return '<li>'+esc(e.message)+'</li>'; }).join('') + '</ul>';
    b.classList.add('show');
    errors.forEach(function(e){
      var id = FIELD_MAP[e.field];
      var f = id && el('f-'+id);
      if (f) f.classList.add('err');
    });
    el('edBody').scrollTop = 0;
  }
  window.save = function(){
    if (!editing) return;
    clearErrors();

    /* Options and the size guide are validated BEFORE anything is written, so
       an invalid option can never leave a half-saved product behind. */
    var vPayload = {};
    if (JSON.stringify(vGroups) !== JSON.stringify(MV.groups(editing))) vPayload.variants = vGroups;
    var storedGuide = MV.guideOf(editing);
    if (JSON.stringify(vGuide) !== JSON.stringify(storedGuide || null)) vPayload.sizeGuide = vGuide;
    var hasVariantWork = Object.keys(vPayload).length > 0;

    var mediaChanged = JSON.stringify(vImages) !== JSON.stringify(MM.list(editing));

    /* everything is validated up front, so a rejected member cannot leave a
       partially saved product behind */
    var pre = [];
    if (hasVariantWork){
      if (vPayload.variants  !== undefined) pre = pre.concat(MV.validateGroups(vPayload.variants).errors);
      if (vPayload.sizeGuide !== undefined) pre = pre.concat(MV.validateGuide(vPayload.sizeGuide).errors);
    }
    if (mediaChanged) pre = pre.concat(MM.validate(vImages).errors);
    if (pre.length){ showErrors(pre); return; }

    /* 1 — the Phase 3.1 fields */
    var res = MP.update(editing, readForm(), { actor:ME, baseVersion:baseVersion });
    if (!res.ok && res.code !== 'NO_CHANGES'){
      showErrors(res.errors || [{ message:T('تعذّر الحفظ','Could not save') }]);
      /* a stale save must not be silently retried over newer data */
      if (res.code === 'STALE') el('saveBtn').disabled = true;
      return;
    }
    if (res.ok) baseVersion = res.version;      /* our own write is not a conflict */

    /* 2 — options + size guide, atomically */
    if (hasVariantWork){
      var vres = MV.save(editing, vPayload, { actor:ME, baseVersion:baseVersion });
      if (!vres.ok && vres.code !== 'NO_CHANGES'){
        showErrors(vres.errors || [{ message:T('تعذّر حفظ الخيارات','Could not save the options') }]);
        if (vres.code === 'STALE') el('saveBtn').disabled = true;
        return;
      }
      if (vres.ok) baseVersion = vres.version;
    }

    /* 3 — images */
    if (mediaChanged){
      var mres = MM.save(editing, vImages, { actor:ME, baseVersion:baseVersion });
      if (!mres.ok && mres.code !== 'NO_CHANGES'){
        showErrors(mres.errors || [{ message:T('تعذّر حفظ الصور','Could not save the images') }]);
        if (mres.code === 'STALE') el('saveBtn').disabled = true;
        return;
      }
      if (mres.ok) baseVersion = mres.version;
    }

    if (!res.ok && !hasVariantWork && !mediaChanged){
      showErrors(res.errors || [{ message:T('لا توجد تغييرات','No changes to save') }]);
      return;
    }

    dirty = false;
    closeEditor();
    render();
    toast(T('تم حفظ التغييرات','Changes saved'));
  };
  window.tryClose = function(){
    if (!dirty) return closeEditor();
    var keep = window.confirm(
      T('لديك تغييرات غير محفوظة.\n\nموافق = تجاهل التغييرات\nإلغاء = متابعة التعديل',
        'You have unsaved changes.\n\nOK = discard changes\nCancel = continue editing'));
    if (keep) closeEditor();
  };
  function closeEditor(){
    el('editor').classList.remove('show');
    document.body.style.overflow = '';
    el('saveBtn').disabled = false;
    editing = null; baseVersion = null; original = null; dirty = false;
  }

  var toastTimer = null;
  function toast(msg){
    el('toastMsg').textContent = msg;

    toastTimer = setTimeout(function(){ el('toast').classList.remove('show'); }, 2600);
  }

  /* ---------- language ---------- */
  window.toggleLang = function(){

    try { localStorage.setItem('raf_lang', r.lang); } catch(e){}
    applyLang(); render();
    /* rebuilding the editor body empties its panels, so they are repainted in
       the new language. */
    if (editing){
      var p = MP.get(editing);
      if (p){
        el('edBody').innerHTML = editorHTML(p);
        renderMedia(); renderGroups(); renderGuide();
      }
    }
    /* the inventory drawer keeps its unsaved combination draft deliberately:
       switching language must not silently discard what the merchant typed */
    if (invPid) renderInventory();     /* re-derives its own header */
    /* the create draft lives in CW, and every control writes to it on input,
       so repainting in the new language cannot lose what the merchant typed */
    if (CW){
      el('cwSub').textContent = T('سيتم إنشاء المنتج في متجر ','The product will be created in ') + L(STORE.name);
      renderCreate();
    }
  };
  function applyLang(){
    var en = isEn();
    document.querySelectorAll('[data-ar][data-en]').forEach(function(e){
      var t = e.getAttribute('data-'+(en?'en':'ar')); if (t!==null) e.textContent = t;
    });
    document.querySelectorAll('[data-ar-ph][data-en-ph]').forEach(function(e){
      e.placeholder = e.getAttribute('data-'+(en?'en':'ar')+'-ph');
    });
    el('searchHint').textContent = T('اسم المنتج · SKU · الباركود','Product name · SKU · barcode');
    el('langLabel').textContent = en ? 'ع' : 'EN';
    var rb = el('refreshBtn');
    if (rb) rb.setAttribute('aria-label', T('تحديث','Refresh'));
    document.title = en ? 'RAF — Products' : 'رف — المنتجات';
  }

  /* ---------- boot ---------- */
  function boot(){
    var l=null; try{ l=localStorage.getItem('raf_lang'); }catch(e){}
    if (l==='en'){ root().lang='en'; root().dir='ltr'; }
    applyLang();

    var link = window.RAFPerm ? RAFPerm.storeLinkOf() : { ok:false, reason:'unassigned' };
    if (!link.ok || !MP.canView()){
      el('gate').style.display = '';
      el('gateT').textContent = !link.ok
        ? (link.reason==='store_not_found' ? T('المتجر المرتبط غير موجود','Linked store not found')
                                           : T('لا يوجد متجر مرتبط بالحساب','No store linked to this account'))
        : T('لا تملك صلاحية عرض المنتجات','You do not have permission to view products');
      el('gateP').textContent = !link.ok
        ? T('لم يتم ربط هذا الحساب بمتجر. يتم الربط يدوياً ولا يُخمَّن تلقائياً.',
            'This account is not linked to a store. Links are set explicitly and never inferred.')
        : T('يتم التحكم بالصلاحيات من نظام صلاحيات رف.','Access is controlled by the RAF permission system.');
      return;
    }
    STORE = link.store; SLUG = link.slug;
    var me = RAFPerm.currentUser();
    /* the canonical store scope travels with the actor so an authority can
       prove ownership itself instead of trusting the page */
    ME = me ? { id:me.id, name:me.name, roleId:me.roleId, storeSlug:SLUG } : null;

    el('shell').style.display = '';
    el('stName').textContent = L(STORE.name);
    if (STORE.logo){ var lg = el('stLogo'); lg.style.backgroundImage = "url('"+STORE.logo+"')"; lg.innerHTML=''; }

    try { var v = localStorage.getItem('raf_pw_view'); if (v==='list'||v==='grid') view = v; } catch(e){}
    /* the action is offered only to an account the authority would accept */
    if (MP.canCreate()) el('addBtn').style.display = '';
    render();
    try { RAFPerm.enforce(); } catch(e){}

    /* another session changed a product — reflect it without losing the editor.
       Inventory uses the same propagation; no polling, no second state. */
    document.addEventListener('raf:source', function(){ render(); if (invPid) renderInventory(); });
    document.addEventListener('raf:inventory', function(){ render(); if (invPid) renderInventory(); });
    document.addEventListener('keydown', function(e){
      if (e.key !== 'Escape') return;
      if (CW) cancelCreate(); else if (invPid) closeInventory(); else if (editing) tryClose();
    });
    window.addEventListener('beforeunload', function(e){
      if (dirty){ e.preventDefault(); e.returnValue = ''; }
    });
  }
  if (document.readyState==='loading') document.addEventListener('DOMContentLoaded', boot); else boot();
})();
</script>
</body>
</html>
