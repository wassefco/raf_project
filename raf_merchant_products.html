<!DOCTYPE html>
<html id="htmlRoot" lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>رف — المنتجات</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700;900&family=Tajawal:wght@300;400;500;700;800&family=DM+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
<link rel="icon" type="image/png" sizes="64x64" href="raf_favicon.png">
<link rel="icon" type="image/png" sizes="32x32" href="raf_favicon_32.png">
<link rel="apple-touch-icon" href="raf_appicon.png">
<script src="raf_features.js"></script>
<link rel="stylesheet" href="raf_theme.css">
<style>
/* ══════════════════════════════════════════════════════════════
   MERCHANT WORKSPACE — PRODUCTS  (Phase 3.1)
   Same shell, tokens and interaction model as the approved Orders
   Workspace. Nothing here redefines the design language.
   ══════════════════════════════════════════════════════════════ */
*{box-sizing:border-box;}
body{background:var(--bg2);margin:0;}
.mw{display:flex;min-height:100vh;}
.mw-rail{width:74px;flex:0 0 74px;background:var(--ink);display:flex;flex-direction:column;align-items:center;
  gap:6px;padding:14px 0;position:sticky;top:0;height:100vh;z-index:40;}
.mw-rail-logo{width:42px;height:42px;border-radius:13px;background:var(--gold);color:#1C1606;display:flex;
  align-items:center;justify-content:center;font-family:var(--font-display);font-size:19px;font-weight:900;
  margin-bottom:10px;text-decoration:none;}
.mw-rail-b{width:50px;min-height:50px;border-radius:14px;border:0;background:transparent;color:#8E877A;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;cursor:pointer;
  font-family:inherit;font-size:9.5px;font-weight:700;text-decoration:none;transition:background .18s,color .18s;}
.mw-rail-b i{font-size:21px;}
.mw-rail-b:hover{background:rgba(255,255,255,.07);color:#EDE8DC;}
.mw-rail-b.on{background:var(--gold-soft);color:var(--gold);}
.mw-rail-sp{flex:1;}
.mw-main{flex:1;min-width:0;display:flex;flex-direction:column;}

.mw-head{position:sticky;top:0;z-index:35;background:var(--card);border-bottom:1px solid var(--border);
  padding:12px clamp(14px,2.2vw,24px);display:flex;align-items:center;gap:14px;flex-wrap:wrap;}
.mw-store{display:flex;align-items:center;gap:11px;min-width:0;}
.mw-store-logo{width:44px;height:44px;flex:0 0 auto;border-radius:13px;background:var(--bg3) center/cover no-repeat;
  display:flex;align-items:center;justify-content:center;color:var(--gold2);font-size:21px;}
.mw-store-t b{display:block;font-family:var(--font-display);font-size:17px;font-weight:800;color:var(--ink);}
.mw-store-t span{font-size:11.5px;color:var(--text3);}
.mw-head-sp{flex:1;min-width:8px;}
.mw-count{font-size:12.5px;font-weight:700;color:var(--text2);background:var(--bg2);border-radius:20px;padding:6px 13px;}

.mw-body{padding:16px clamp(14px,2.2vw,24px) 60px;}
.mw-search{position:relative;margin-bottom:12px;max-width:560px;}
.mw-search input{width:100%;height:48px;border-radius:14px;border:1px solid var(--border2);background:var(--card);
  font-family:inherit;font-size:14px;color:var(--ink);padding-inline-start:46px;padding-inline-end:14px;}
.mw-search input:focus{outline:2px solid var(--gold);outline-offset:1px;border-color:var(--gold);}
.mw-search > i{position:absolute;top:50%;transform:translateY(-50%);inset-inline-start:15px;font-size:19px;
  color:var(--text3);pointer-events:none;}
.mw-hint{font-size:11px;color:var(--text3);margin:0 2px 12px;}

/* ══════════════════════════════════════════════════════════════
   PRODUCTS WORKSPACE — calm hierarchy.
   One idea per block: identity, then price, then inventory, then
   actions. Numbers are grouped into a single inventory panel
   instead of competing pills, so a card can be read at a glance.
   ══════════════════════════════════════════════════════════════ */

/* ---------- header actions ---------- */
/* the theme's `html:not([data-ui]) button` rule is (0,1,2); every touch
   target below is scoped with two classes so 44px actually wins */
.mw-hact{display:flex;align-items:center;gap:8px;}
.mw-hact .mw-ico-b{min-height:44px;}
.pw-bar .pw-view button{min-height:44px;}
.pw-card .pw-f button{min-height:44px;}
.pw-ws .mw-ed-x,.pw-ws .mw-add,.pw-ws .pw-mini,.pw-ws .pw-more-h,
.pw-ws .pw-ws-f button,.pw-val .x,.pw-cb-grid .pw-cb{min-height:44px;}
.pw-val .x{width:44px;height:44px;}
.pw-ws .pw-ws-f button{min-height:50px;}
.mw-ico-b{width:44px;height:44px;flex:0 0 auto;border-radius:13px;border:1px solid var(--border2);
  background:var(--card);color:var(--text2);font-size:18px;cursor:pointer;display:inline-flex;
  align-items:center;justify-content:center;font-family:inherit;font-weight:800;transition:all .18s;}
.mw-ico-b:hover{border-color:var(--gold);color:var(--gold2);}
.mw-ico-b.lang{width:auto;padding:0 14px;font-size:12.5px;}

/* ---------- summary strip ---------- */
.pw-sum{display:grid;grid-template-columns:repeat(5,1fr);gap:9px;margin-bottom:14px;}
.pw-sum-c{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:11px 13px;
  text-align:start;cursor:pointer;font-family:inherit;transition:border-color .18s,background .18s;min-height:66px;}
.pw-sum-c:hover{border-color:var(--gold);}
.pw-sum-c[aria-pressed="true"]{border-color:var(--gold);background:var(--gold-soft);}
.pw-sum-n{display:block;font-family:var(--font-en);font-size:21px;font-weight:800;color:var(--ink);line-height:1.2;}
.pw-sum-l{display:block;font-size:11.5px;font-weight:700;color:var(--text3);margin-top:2px;}
.pw-sum-c.warn .pw-sum-n{color:#C8791E;}
.pw-sum-c.bad  .pw-sum-n{color:#A63A36;}

/* ---------- unified toolbar ---------- */
.pw-bar{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin-bottom:14px;}
.pw-bar .mw-search{margin:0;flex:1 1 240px;max-width:420px;}
.pw-sel{position:relative;flex:0 0 auto;}
.pw-sel select{min-height:44px;border-radius:13px;border:1px solid var(--border2);background:var(--card);
  font-family:inherit;font-size:12.5px;font-weight:700;color:var(--text2);padding:0 34px 0 13px;cursor:pointer;
  appearance:none;-webkit-appearance:none;max-width:180px;}
html[dir="rtl"] .pw-sel select{padding:0 13px 0 34px;}
.pw-sel select:focus{outline:2px solid var(--gold);outline-offset:1px;border-color:var(--gold);}
.pw-sel select.on{border-color:var(--gold);background:var(--gold-soft);color:var(--gold2);}
.pw-sel > i{position:absolute;top:50%;transform:translateY(-50%);inset-inline-end:12px;font-size:15px;
  color:var(--text3);pointer-events:none;}
.pw-bar-sp{flex:1 1 auto;min-width:0;}
.pw-view{display:inline-flex;flex:0 0 auto;border:1px solid var(--border2);border-radius:13px;overflow:hidden;background:var(--card);}
.pw-view button{width:46px;min-height:44px;border:0;background:transparent;color:var(--text3);font-size:17px;
  cursor:pointer;display:inline-flex;align-items:center;justify-content:center;transition:all .18s;}
.pw-view button[aria-pressed="true"]{background:var(--ink);color:#F5F0E4;}
.pw-clear{min-height:44px;padding:0 14px;border-radius:13px;border:1px solid var(--border2);background:var(--card);
  color:var(--text2);font-family:inherit;font-size:12.5px;font-weight:700;cursor:pointer;display:none;
  align-items:center;gap:6px;}
.pw-clear.show{display:inline-flex;}
.pw-clear:hover{border-color:var(--red);color:#A63A36;}

/* ---------- product grid card ---------- */
.mw-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(268px,1fr));gap:13px;}
.pw-card{background:var(--card);border:1px solid var(--border);border-radius:18px;overflow:hidden;
  display:flex;flex-direction:column;transition:border-color .18s,box-shadow .18s;}
.pw-card:hover{border-color:var(--gold);box-shadow:0 14px 30px -22px rgba(20,16,8,.5);}
.pw-media{position:relative;aspect-ratio:16/10;background:var(--bg3) center/cover no-repeat;display:flex;
  align-items:center;justify-content:center;color:var(--text3);font-size:34px;}
.pw-media .pw-state{position:absolute;top:9px;inset-inline-start:9px;}
.pw-media .pw-disc{position:absolute;top:9px;inset-inline-end:9px;background:rgba(217,83,79,.94);color:#fff;
  font-family:var(--font-en);font-size:11px;font-weight:800;border-radius:20px;padding:4px 9px;}
.pw-state{display:inline-flex;align-items:center;gap:5px;height:25px;padding:0 10px;border-radius:20px;
  font-size:11px;font-weight:800;backdrop-filter:blur(6px);}
.pw-state.ok  {background:rgba(46,158,91,.16);color:#1F7A45;}
.pw-state.low {background:rgba(200,121,30,.16);color:#9A5B12;}
.pw-state.out {background:rgba(217,83,79,.16);color:#A63A36;}
.pw-state.hid {background:rgba(20,16,8,.10);color:var(--text2);}
.pw-state.none{background:rgba(20,16,8,.08);color:var(--text3);}
.pw-media .pw-state.ok{background:rgba(255,255,255,.9);}
.pw-media .pw-state.low{background:rgba(255,255,255,.9);}
.pw-media .pw-state.out{background:rgba(255,255,255,.9);}
.pw-media .pw-state.hid{background:rgba(255,255,255,.9);}
.pw-media .pw-state.none{background:rgba(255,255,255,.9);}
.pw-b{padding:13px 14px 0;flex:1;min-width:0;}
.pw-name{font-size:14px;font-weight:800;color:var(--ink);line-height:1.5;margin-bottom:5px;
  display:-webkit-box;-webkit-line-clamp:2;line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
.pw-price{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;margin-bottom:11px;}
.pw-price b{font-family:var(--font-en);font-size:17px;font-weight:800;color:var(--ink);}
.pw-price span{font-family:var(--font-en);font-size:12px;color:var(--text3);text-decoration:line-through;}
.pw-price em{font-style:normal;font-size:11.5px;color:var(--text3);font-weight:700;}

/* the single inventory block — never split across loose badges */
.pw-inv{background:var(--bg);border:1px solid var(--border);border-radius:13px;padding:9px 11px;}
.pw-inv-h{display:flex;align-items:center;gap:7px;margin-bottom:7px;}
.pw-inv-h b{flex:1;min-width:0;font-size:11px;font-weight:800;color:var(--text3);letter-spacing:.4px;text-transform:uppercase;}
.pw-inv-n{display:flex;gap:6px;}
.pw-inv-n span{flex:1;min-width:0;text-align:center;border-radius:9px;padding:5px 3px;background:var(--card);
  border:1px solid var(--border);font-family:var(--font-en);font-size:14px;font-weight:800;color:var(--ink);}
.pw-inv-n span em{display:block;font-family:var(--font-ar);font-style:normal;font-size:10px;font-weight:700;
  color:var(--text3);margin-top:1px;}
.pw-inv-n span.hi{background:var(--gold-soft);border-color:var(--gold);color:var(--gold2);}
.pw-inv-n span.hi em{color:var(--gold2);}
.pw-inv-miss{font-size:11.5px;color:#9A5B12;line-height:1.6;display:flex;gap:6px;align-items:flex-start;}
.pw-combo{display:inline-flex;align-items:center;gap:5px;font-size:10.5px;font-weight:800;border-radius:20px;
  padding:3px 8px;background:var(--gold-soft);color:var(--gold2);}
.pw-sku{font-family:var(--font-en);font-size:11px;color:var(--text3);margin-top:9px;}
.pw-f{display:flex;gap:8px;padding:12px 14px 14px;}
.pw-f button{min-height:44px;border-radius:12px;font-family:inherit;font-size:12.5px;font-weight:800;
  cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;transition:all .18s;}
.pw-f .pw-edit{flex:1;background:var(--ink);color:#F5F0E4;border:1px solid var(--ink);}
.pw-f .pw-edit:hover:not(:disabled){background:#241F17;}
.pw-f .pw-stock{flex:1;background:var(--card);color:var(--text2);border:1px solid var(--border2);}
.pw-f .pw-stock:hover:not(:disabled){border-color:var(--gold);background:var(--gold-soft);color:var(--gold2);}
.pw-f button:disabled{opacity:.45;cursor:not-allowed;}

/* ---------- list view ---------- */
.mw-grid.list{display:flex;flex-direction:column;gap:8px;}
.mw-grid.list .pw-card{flex-direction:row;align-items:center;gap:13px;padding:11px 13px;border-radius:15px;}
.mw-grid.list .pw-media{aspect-ratio:auto;width:58px;height:58px;flex:0 0 auto;border-radius:12px;font-size:23px;}
.mw-grid.list .pw-media .pw-state,.mw-grid.list .pw-media .pw-disc{display:none;}
.mw-grid.list .pw-b{padding:0;flex:1 1 190px;min-width:150px;}
.mw-grid.list .pw-name{margin-bottom:3px;-webkit-line-clamp:1;line-clamp:1;font-size:13.5px;}
.mw-grid.list .pw-price{margin-bottom:0;}
.mw-grid.list .pw-price b{font-size:14.5px;}
.mw-grid.list .pw-sku{margin-top:3px;}
.mw-grid.list .pw-inv{flex:0 0 auto;width:212px;background:transparent;border:0;padding:0;}
.mw-grid.list .pw-inv-h{margin-bottom:5px;}
.mw-grid.list .pw-f{padding:0;flex:0 0 auto;}
.mw-grid.list .pw-f button{flex:0 0 auto;padding:0 13px;}

/* ---------- empty states ---------- */
.mw-empty{border:1px dashed var(--border2);border-radius:16px;padding:34px 22px;text-align:center;
  background:var(--card);grid-column:1/-1;}
.mw-empty i{font-size:34px;color:var(--text3);display:block;margin-bottom:10px;}
.mw-empty b{display:block;font-size:14.5px;font-weight:800;color:var(--ink);margin-bottom:5px;}
.mw-empty span{display:block;font-size:12.5px;color:var(--text3);line-height:1.7;max-width:380px;margin:0 auto;}
.mw-empty button{margin-top:13px;min-height:44px;padding:0 18px;border-radius:30px;border:1px solid var(--border2);
  background:var(--card);color:var(--text2);font-family:inherit;font-size:12.5px;font-weight:700;cursor:pointer;}
.mw-empty button:hover{border-color:var(--gold);color:var(--gold2);}

/* ---------- create product workspace ---------- */
.pw-add{min-height:44px;padding:0 16px;border-radius:13px;border:1px solid var(--gold2);background:var(--gold);
  color:#1C1606;font-family:inherit;font-size:13px;font-weight:800;cursor:pointer;display:inline-flex;
  align-items:center;gap:7px;transition:filter .18s;}
.mw-hact .pw-add{min-height:44px;}
.pw-add:hover{filter:brightness(1.05);}
.pw-ws{position:fixed;inset:0;z-index:96;display:none;background:var(--bg2);}
.pw-ws.show{display:flex;flex-direction:column;}
.pw-ws-h{display:flex;align-items:center;gap:12px;padding:13px clamp(14px,2.2vw,24px);background:var(--card);
  border-bottom:1px solid var(--border);flex:0 0 auto;}
.pw-ws-h .t{flex:1;min-width:0;}
.pw-ws-h h2{font-family:var(--font-display);font-size:19px;font-weight:800;color:var(--ink);}
.pw-ws-h .sub{font-size:11.5px;color:var(--text3);margin-top:2px;}
.pw-ws-b{flex:1;overflow:auto;padding:20px clamp(14px,2.2vw,24px) 30px;}
.pw-ws-in{max-width:760px;margin:0 auto;}
.pw-ws-f{flex:0 0 auto;display:flex;gap:10px;padding:12px clamp(14px,2.2vw,24px) calc(12px + env(safe-area-inset-bottom,0px));
  background:var(--card);border-top:1px solid var(--border);}
.pw-ws-f .sp{flex:1;}
.pw-ws-f button{min-height:50px;padding:0 22px;border-radius:30px;font-family:inherit;font-size:14.5px;
  font-weight:800;cursor:pointer;border:1px solid transparent;}
.pw-ws-f .pw-ws-cancel{background:var(--card);color:var(--text2);border-color:var(--border2);}
.pw-ws-f .pw-ws-save{background:var(--gold);color:#1C1606;border-color:var(--gold2);min-width:190px;}
.pw-ws-f .pw-ws-save:disabled{opacity:.55;cursor:progress;}

/* numbered sections keep the sequence obvious without a wizard */
.pw-step{background:var(--card);border:1px solid var(--border);border-radius:18px;padding:18px 20px;margin-bottom:14px;}
.pw-step-h{display:flex;align-items:center;gap:11px;margin-bottom:15px;}
.pw-step-n{width:30px;height:30px;flex:0 0 auto;border-radius:10px;background:var(--bg3);color:var(--text2);
  display:inline-flex;align-items:center;justify-content:center;font-family:var(--font-en);font-size:13px;font-weight:800;}
.pw-step-t{flex:1;min-width:0;}
.pw-step-t b{display:block;font-size:15px;font-weight:800;color:var(--ink);}
.pw-step-t span{display:block;font-size:11.5px;color:var(--text3);margin-top:2px;line-height:1.6;}
.pw-step.opt .pw-step-n{background:var(--gold-soft);color:var(--gold2);}

/* option groups + the combination picker */
.pw-og{border:1px solid var(--border2);border-radius:14px;padding:13px;margin-bottom:11px;background:var(--bg);}
.pw-og-h{display:flex;align-items:center;gap:8px;margin-bottom:11px;flex-wrap:wrap;}
.pw-og-h select{min-height:44px;border-radius:11px;border:1px solid var(--border2);background:var(--card);
  font-family:inherit;font-size:12.5px;font-weight:700;color:var(--ink);padding:0 12px;}
.pw-og-h .sp{flex:1;}
.pw-vals{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:10px;}
.pw-val{display:inline-flex;align-items:center;gap:7px;min-height:44px;padding:0 6px 0 11px;border-radius:12px;
  border:1px solid var(--border2);background:var(--card);font-size:12.5px;font-weight:700;color:var(--ink);
  overflow:hidden;}
html[dir="rtl"] .pw-val{padding:0 11px 0 6px;}
/* the swatch is the colour control, so it gets a real touch target rather
   than a decorative dot: it fills the chip's leading edge */
.pw-val.col{padding-inline-start:0;}
.pw-val .sw{width:44px;min-height:44px;height:44px;border:0;border-inline-end:1px solid var(--border2);
  flex:0 0 auto;padding:0;cursor:pointer;background:none;border-radius:0;}
.pw-val .lbl{max-width:130px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.pw-val .x{width:32px;height:32px;border-radius:9px;border:0;background:transparent;color:var(--text3);
  font-size:15px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;}
.pw-val .x:hover{background:rgba(217,83,79,.12);color:#A63A36;}
.pw-val-add{display:flex;gap:7px;flex-wrap:wrap;}
.pw-val-add input{flex:1 1 130px;min-width:0;min-height:44px;border-radius:11px;border:1px solid var(--border2);
  background:var(--card);font-family:inherit;font-size:13px;color:var(--ink);padding:0 12px;}
.pw-val-add input[type="color"]{flex:0 0 52px;padding:4px;cursor:pointer;}
.pw-val-add button{min-height:44px;padding:0 14px;border-radius:11px;border:1px solid var(--border2);
  background:var(--card);color:var(--text2);font-family:inherit;font-size:12.5px;font-weight:700;cursor:pointer;}
.pw-val-add button:hover{border-color:var(--gold);color:var(--gold2);}

.pw-combos{border:1px solid var(--gold);background:var(--gold-soft);border-radius:14px;padding:13px;}
.pw-combos-h{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin-bottom:11px;}
.pw-combos-h b{flex:1;min-width:120px;font-size:13px;font-weight:800;color:var(--ink);}
.pw-mini{min-height:38px;padding:0 12px;border-radius:20px;border:1px solid var(--border2);background:var(--card);
  color:var(--text2);font-family:inherit;font-size:11.5px;font-weight:700;cursor:pointer;}
.pw-mini:hover{border-color:var(--gold);color:var(--gold2);}
.pw-cb-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:7px;}
.pw-cb{display:flex;align-items:center;gap:8px;min-height:46px;padding:0 11px;border-radius:12px;
  border:1px solid var(--border2);background:var(--card);cursor:pointer;font-family:inherit;font-size:12.5px;
  font-weight:700;color:var(--text2);text-align:start;transition:all .16s;}
.pw-cb .tick{width:20px;height:20px;flex:0 0 auto;border-radius:6px;border:1.5px solid var(--border2);
  display:inline-flex;align-items:center;justify-content:center;font-size:12px;color:transparent;}
.pw-cb[aria-pressed="true"]{border-color:var(--gold);background:var(--gold-soft);color:var(--gold2);}
.pw-cb[aria-pressed="true"] .tick{background:var(--gold2);border-color:var(--gold2);color:#fff;}
.pw-cb .dot{width:14px;height:14px;border-radius:50%;border:1px solid rgba(0,0,0,.18);flex:0 0 auto;}
.pw-cb-sum{margin-top:11px;font-size:12px;font-weight:700;color:var(--text2);line-height:1.7;}
.pw-none{font-size:12.5px;color:var(--text3);line-height:1.7;}

/* collapsible advanced block */
.pw-more{border:1px solid var(--border2);border-radius:14px;overflow:hidden;}
.pw-more-h{display:flex;align-items:center;gap:9px;width:100%;min-height:52px;padding:0 14px;border:0;
  background:var(--bg);color:var(--ink);font-family:inherit;font-size:13px;font-weight:800;cursor:pointer;}

/* ---------- inventory drawer ---------- */

.pw-dr-b{flex:1;overflow:auto;padding:18px 20px calc(20px + env(safe-area-inset-bottom,0px));}

  .mw-grid.list .pw-f button{flex:1;}
  .pw-dr-c{width:100%;border-inline-start:0;}
}

/* ---------- editor ---------- */
.mw-ed{position:fixed;inset:0;z-index:90;display:none;align-items:center;justify-content:center;padding:20px;
  background:rgba(20,16,8,.5);}
.mw-ed.show{display:flex;}
.mw-ed-c{width:100%;max-width:640px;max-height:92vh;display:flex;flex-direction:column;background:var(--card);
  border:1px solid var(--border);border-radius:20px;overflow:hidden;}
.mw-ed-h{display:flex;align-items:center;gap:11px;padding:16px 20px;border-bottom:1px solid var(--border);}
.mw-ed-h h3{flex:1;font-family:var(--font-display);font-size:18px;font-weight:800;color:var(--ink);min-width:0;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.mw-ed-x{width:40px;height:40px;flex:0 0 auto;border-radius:12px;border:1px solid var(--border);background:var(--card);
  color:var(--text2);font-size:18px;cursor:pointer;}
.mw-ed-b{flex:1;overflow:auto;padding:18px 20px;}
.mw-ed-f{display:flex;gap:10px;padding:14px 20px calc(14px + env(safe-area-inset-bottom,0px));
  border-top:1px solid var(--border);background:var(--card);}
.mw-ed-f button{flex:1;min-height:50px;border-radius:30px;font-family:inherit;font-size:14.5px;font-weight:800;
  cursor:pointer;border:1px solid transparent;}
.mw-btn-ghost{background:var(--card);color:var(--text2);border-color:var(--border2);}
.mw-btn-gold{background:var(--gold);color:#1C1606;border-color:var(--gold2);}
.mw-btn-gold:disabled{opacity:.5;cursor:not-allowed;}

.mw-sec{margin-bottom:22px;}
.mw-sec-h{display:flex;align-items:center;gap:7px;font-size:12px;font-weight:800;color:var(--text3);
  letter-spacing:.4px;text-transform:uppercase;margin-bottom:11px;}
.mw-sec-h i{color:var(--gold2);font-size:15px;}
.mw-f{margin-bottom:13px;}
.mw-f label{display:block;font-size:12.5px;font-weight:700;color:var(--text2);margin-bottom:6px;}
.mw-f input,.mw-f textarea,.mw-f select{width:100%;min-height:48px;border-radius:12px;border:1px solid var(--border2);
  background:var(--card);font-family:inherit;font-size:14px;color:var(--ink);padding:12px 14px;}
.mw-f textarea{min-height:88px;resize:vertical;line-height:1.7;}
.mw-f input:focus,.mw-f textarea:focus,.mw-f select:focus{outline:2px solid var(--gold);outline-offset:1px;border-color:var(--gold);}
.mw-f input[readonly]{background:var(--bg2);color:var(--text3);cursor:not-allowed;}
.mw-f .note{font-size:11px;color:var(--text3);margin-top:5px;line-height:1.6;}
.mw-f.err input,.mw-f.err textarea,.mw-f.err select{border-color:var(--red);}
.mw-f .msg{font-size:11.5px;color:var(--red);margin-top:5px;display:none;}
.mw-f.err .msg{display:block;}
.mw-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.mw-num{font-family:var(--font-en);}
.mw-ed-err{background:rgba(217,83,79,.1);border:1px solid rgba(217,83,79,.34);border-radius:12px;
  padding:11px 13px;margin-bottom:16px;font-size:12.5px;color:#A63A36;line-height:1.7;display:none;}
.mw-ed-err.show{display:block;}
.mw-ed-err ul{margin:6px 0 0;padding-inline-start:18px;}
.mw-ro{background:var(--bg);border:1px solid var(--border);border-radius:12px;padding:11px 13px;
  font-size:12px;color:var(--text2);line-height:1.7;}
.mw-ro b{color:var(--ink);font-family:var(--font-en);}

/* ---------- PHASE 3.2 · options + size guide ---------- */
.mw-vg{border:1px solid var(--border);border-radius:14px;padding:12px;margin-bottom:11px;background:var(--bg);}
.mw-vg-h{display:flex;gap:8px;align-items:center;margin-bottom:10px;}
.mw-vg-l{flex:1;min-width:0;min-height:44px;border-radius:10px;border:1px solid var(--border2);
  background:var(--card);font-family:inherit;font-size:13px;color:var(--ink);padding:0 11px;}
.mw-vo-list{display:flex;flex-direction:column;gap:7px;}
.mw-vo{display:flex;gap:6px;align-items:center;flex-wrap:wrap;}
.mw-vo input{flex:1 1 110px;min-width:0;min-height:44px;border-radius:10px;border:1px solid var(--border2);
  background:var(--card);font-family:inherit;font-size:13px;color:var(--ink);padding:0 11px;}
.mw-vo-i{width:26px;height:26px;flex:0 0 auto;border-radius:8px;background:var(--bg3);color:var(--text2);
  display:flex;align-items:center;justify-content:center;font-family:var(--font-en);font-size:11.5px;font-weight:800;}
.mw-sw{width:44px;min-width:44px;height:44px;flex:0 0 auto;padding:2px;border-radius:10px;
  border:1px solid var(--border2);background:var(--card);cursor:pointer;}
.mw-vid{flex:0 0 auto;font-family:var(--font-en);font-size:10.5px;color:var(--text3);background:var(--bg2);
  border-radius:20px;padding:3px 8px;}
.mw-ico{width:44px;height:44px;flex:0 0 auto;border-radius:10px;border:1px solid var(--border2);
  background:var(--card);color:var(--text2);font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;}
.mw-ico:hover:not(:disabled){border-color:var(--gold);color:var(--gold2);}
.mw-ico:disabled{opacity:.35;cursor:not-allowed;}
.mw-ico.danger:hover{border-color:var(--red);color:var(--red);background:rgba(217,83,79,.07);}
.mw-add{min-height:44px;padding:0 15px;border-radius:30px;border:1px dashed var(--border2);background:var(--card);
  color:var(--text2);font-family:inherit;font-size:12.5px;font-weight:700;cursor:pointer;
  display:inline-flex;align-items:center;gap:6px;}
.mw-add:hover{border-color:var(--gold);color:var(--gold2);}
.mw-add.sm{font-size:12px;padding:0 13px;}
.mw-add.danger{color:var(--red);border-color:rgba(217,83,79,.4);}
.mw-sg-badge{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:800;color:#1F7A45;
  background:rgba(46,158,91,.13);border-radius:20px;padding:5px 12px;margin-bottom:12px;}
.mw-sg-note{font-size:11.5px;color:var(--text3);line-height:1.7;margin:4px 0 12px;}
.mw-sg-scroll{overflow-x:auto;border:1px solid var(--border);border-radius:12px;}
.mw-sg-t{border-collapse:collapse;width:100%;min-width:420px;}
.mw-sg-t th,.mw-sg-t td{border-bottom:1px solid var(--border);border-inline-end:1px solid var(--border);padding:6px;vertical-align:top;}
.mw-sg-t th{background:var(--bg2);}
.mw-sg-t th input,.mw-sg-t td input{width:100%;min-width:76px;min-height:40px;border-radius:8px;
  border:1px solid var(--border2);background:var(--card);font-family:inherit;font-size:12.5px;color:var(--ink);padding:0 8px;}
.mw-sg-t th input+input{margin-top:4px;}
.mw-sg-t th.mw-sg-add{width:52px;}
.mw-sg-f{display:flex;gap:8px;flex-wrap:wrap;margin-top:11px;}
/* ---------- PHASE 3.4 · inventory ---------- */
.mw-tag.res{background:rgba(224,163,46,.16);color:#8A6410;}
.mw-tag.avail{background:rgba(46,158,91,.13);color:#1F7A45;}
.mw-tag.warn{background:rgba(217,83,79,.12);color:#A63A36;}
.mw-inv-g{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-bottom:11px;}
.mw-inv-c{border:1px solid var(--border);border-radius:13px;padding:11px;background:var(--bg);text-align:center;}
.mw-inv-c span{display:block;font-size:11.5px;color:var(--text3);margin-bottom:4px;}
.mw-inv-c b{font-family:var(--font-en);font-size:21px;font-weight:800;color:var(--ink);}
.mw-inv-c.hi{border-color:var(--gold);background:var(--gold-soft);}
.mw-inv-c.hi b{color:var(--gold2);}
.mw-inv-state{display:inline-flex;align-items:center;border-radius:20px;padding:5px 12px;font-size:12px;font-weight:800;}
.mw-inv-state.st-available{background:rgba(46,158,91,.13);color:#1F7A45;}
.mw-inv-state.st-out{background:rgba(217,83,79,.12);color:#A63A36;}
.mw-inv-note{display:flex;gap:8px;align-items:flex-start;margin-top:10px;padding:10px 12px;border-radius:11px;
  background:var(--bg2);border:1px solid var(--border);font-size:11.5px;line-height:1.7;color:var(--text2);}
.mw-inv-note i{color:var(--text3);font-size:15px;flex:0 0 auto;margin-top:1px;}
.mw-inv-none{display:flex;gap:9px;align-items:flex-start;padding:12px;border-radius:13px;
  background:rgba(217,83,79,.09);border:1px solid rgba(217,83,79,.3);font-size:12.5px;line-height:1.7;color:#A63A36;}
.mw-inv-none i{font-size:19px;flex:0 0 auto;}
.mw-inv-none b{display:block;}
.mw-adj{margin-top:14px;padding-top:14px;border-top:1px solid var(--border);}
.mw-adj-h{font-size:12px;font-weight:800;color:var(--text3);letter-spacing:.4px;text-transform:uppercase;margin-bottom:10px;}
.mw-adj-row{display:flex;gap:8px;margin-bottom:9px;flex-wrap:wrap;}
.mw-adj-dir{display:flex;gap:6px;flex:1 1 200px;}
.mw-adj-b{flex:1;min-height:48px;border-radius:12px;border:1px solid var(--border2);background:var(--card);
  color:var(--text2);font-family:inherit;font-size:13px;font-weight:700;cursor:pointer;
  display:inline-flex;align-items:center;justify-content:center;gap:6px;}
.mw-adj-b.on{background:var(--ink);border-color:var(--ink);color:#F5F0E4;}
.mw-adj-row #adjQty{flex:0 1 130px;min-height:48px;border-radius:12px;border:1px solid var(--border2);
  background:var(--card);font-size:14px;color:var(--ink);padding:0 13px;}
#adjReason{width:100%;min-height:48px;border-radius:12px;border:1px solid var(--border2);background:var(--card);
  font-family:inherit;font-size:14px;color:var(--ink);padding:0 13px;margin-bottom:9px;}
.mw-adj-res{font-size:13px;color:var(--text2);min-height:20px;}
.mw-adj-res b{font-family:var(--font-en);color:var(--ink);}
.mw-adj-res .bad{color:var(--red);font-weight:700;}
.mw-adj-err{display:none;margin-top:8px;padding:10px 12px;border-radius:11px;background:rgba(217,83,79,.1);
  border:1px solid rgba(217,83,79,.34);color:#A63A36;font-size:12.5px;line-height:1.6;}
.mw-adj-err.show{display:block;}
/* id-scoped so the shared touch-target floor cannot pull these below 44px */

.cmb-h{display:flex;align-items:flex-start;gap:10px;margin-bottom:12px;}

.cmb-h span{font-size:12px;color:var(--text2);line-height:1.6;}

  padding:4px 10px;background:var(--bg3);color:var(--text2);white-space:nowrap;}
.cmb-mode.on{background:var(--gold-soft);color:var(--gold2);}
.cmb-sec{border:1px solid var(--border2);border-radius:14px;margin-bottom:10px;overflow:hidden;}
#invBox .cmb-sec-h{display:flex;align-items:center;gap:9px;width:100%;min-height:48px;padding:0 14px;
  border:0;background:var(--bg);font-family:inherit;font-size:13.5px;font-weight:800;color:var(--ink);
  cursor:pointer;text-align:start;}

  padding:7px 9px;font-family:var(--font-en);font-size:15px;font-weight:800;color:var(--ink);}

#invBox .cmb-b{width:44px;min-height:44px;flex:0 0 auto;border-radius:11px;border:1px solid var(--border2);
  background:var(--card);color:var(--text2);cursor:pointer;font-size:17px;}

.cmb-bar{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin-top:12px;padding:12px;
         border:1px solid var(--border2);border-radius:14px;background:var(--bg);}

#invBox .mw-adj-apply{width:100%;min-height:48px;border-radius:30px;font-family:inherit;font-size:14px;

@media(max-width:600px){

.mw-vnote{display:flex;gap:8px;align-items:flex-start;margin-top:10px;padding:10px 12px;border-radius:11px;
  background:var(--bg2);border:1px solid var(--border);font-size:11.5px;line-height:1.7;color:var(--text2);}

.mw-gate-c p{font-size:13.5px;line-height:1.85;color:var(--text2);}

.mw-toast{position:fixed;inset-inline:0;bottom:24px;z-index:120;display:flex;justify-content:center;
  pointer-events:none;opacity:0;transition:opacity .2s;}

@media(max-width:880px){ .mw-row{grid-template-columns:1fr;} }
@media(max-width:600px){
  .mw-rail{position:fixed;inset:auto 0 0 0;top:auto;width:100%;flex-direction:row;justify-content:space-around;
    padding:0 6px;padding-bottom:env(safe-area-inset-bottom,0px);height:calc(64px + env(safe-area-inset-bottom,0px));}
  .mw-rail-logo,.mw-rail-sp{display:none;}
  .mw{flex-direction:column;}
  .mw-main{padding-bottom:74px;}
  .mw-grid{grid-template-columns:1fr;}
  /* full-screen editor with the save actions always in reach */
  .mw-ed{padding:0;align-items:stretch;}
  .mw-ed-c{max-width:100%;max-height:100%;height:100%;border-radius:0;border:0;}
}
@media(prefers-reduced-motion:reduce){ .mw-p,.mw-toast{transition:none;} }
</style>
</head>

    <a class="mw-rail-b" href="raf_merchant.html"><i class="ti ti-clipboard-list"></i><span data-ar="الطلبات" data-en="Orders">الطلبات</span></a>

    <a class="mw-rail-b" href="raf_marketing.html"><i class="ti ti-speakerphone"></i><span data-ar="التسويق" data-en="Marketing">التسويق</span></a>

  <div class="mw-main">

        <div class="mw-store-t"><b id="stName">—</b>
          <span data-ar="مساحة عمل المنتجات" data-en="Products workspace">مساحة عمل المنتجات</span></div>

      <!-- one toolbar; nothing is scattered elsewhere on the page -->

<script>
/* ============================================================
   MERCHANT PRODUCTS — PHASE 3.1
   The page renders and collects input. Every write goes through
   RAFMerchantProducts, which owns ownership, permission,
   validation, staleness and audit. This file never touches
   RAFSource directly.
   ============================================================ */
(function(){
  'use strict';
  var MP = window.RAFMerchantProducts;
  var STORE = null, SLUG = null, ME = null;
  var editing = null, baseVersion = null, original = null, dirty = false;

  function root(){ return document.getElementById('htmlRoot'); }
  function isEn(){ return root().lang === 'en'; }
  function T(ar,en){ return isEn() ? en : ar; }
  function L(o){ return (o && typeof o==='object') ? (isEn()?(o.en||o.ar):(o.ar||o.en)) : (o||''); }
  function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
  function el(id){ return document.getElementById(id); }

  /* ---------- filter state ----------
     Three independent axes that intersect with AND. The status axis keeps the
     exact meaning it always had (lifecycle + stock state), so nothing that
     depended on it changes; stock and category are additional lenses. */
  var fStatus = 'all', fStock = 'all', fCat = 'all', view = 'grid';

  var STATUS_OPTS = [
    { k:'all',       ar:'كل الحالات',  en:'All statuses' },
    { k:'available', ar:'متوفر',       en:'Available' },
    { k:'out',       ar:'غير متوفر',   en:'Unavailable' },
    { k:'hidden',    ar:'مخفي',        en:'Hidden' }
  ];
  var STOCK_OPTS = [
    { k:'all',   ar:'كل المخزون',      en:'All stock' },
    { k:'in',    ar:'متوفر بالمخزون',  en:'In stock' },
    { k:'low',   ar:'مخزون منخفض',     en:'Low stock' },
    { k:'zero',  ar:'نفد المخزون',     en:'Out of stock' },
    { k:'combo', ar:'مخزون الخيارات',  en:'Combination inventory' }
  ];

  /* Availability comes from the inventory authority; the page never computes
     it. Product lifecycle (hidden) stays separate from stock. */
  var INV = window.RAFInventory;
  function statusOf(p){
    if (p.status === 'hidden') return 'hidden';
    if (!INV) return 'unknown';
    return INV.stateOf(p.id) === 'out_of_stock' ? 'out' : 'available';
  }
  /* a product with no readable inventory record is reported, never guessed */
  function invOf(id){
    if (!INV) return null;
    var s = RAFSource.product(id);
    if (!s || s.stock == null) return null;
    return { onHand:INV.onHand(id), reserved:INV.reserved(id), available:INV.available(id) };
  }
  /* LOW STOCK. There is no low-stock threshold in any authority, so none is
     invented here: this reuses the ONE convention already shipped to
     customers — raf_product.html / raf_quick.html call a product "only N
     left" at 5 or fewer. The merchant therefore sees low exactly when a
     shopper would. It is a display band only; nothing depends on it. */
  var LOW_AT = 5;
  function stockBand(p){
    var v = invOf(p.id);
    if (!v) return 'none';
    if (v.available <= 0) return 'zero';
    return v.available <= LOW_AT ? 'low' : 'in';
  }
  function isCombo(id){ return !!(INV && INV.isCombinationMode(id)); }

  function statusLabel(k){
    return k==='hidden'  ? T('مخفي','Hidden')
         : k==='out'     ? T('غير متوفر','Out of stock')
         : k==='unknown' ? T('بيانات المخزون غير متاحة','Inventory data unavailable')
         : T('متوفر','Available');
  }
  /* one state chip per card: lifecycle first, then the stock band */
  function stateChip(p){
    if (p.status === 'hidden')
      return '<span class="pw-state hid"><i class="ti ti-eye-off"></i>'+T('مخفي','Hidden')+'</span>';
    var b = stockBand(p);
    return b==='none' ? '<span class="pw-state none"><i class="ti ti-help-circle"></i>'+T('لا يوجد سجل','No record')+'</span>'
         : b==='zero' ? '<span class="pw-state out"><i class="ti ti-ban"></i>'+T('نفد المخزون','Out of stock')+'</span>'
         : b==='low'  ? '<span class="pw-state low"><i class="ti ti-alert-triangle"></i>'+T('مخزون منخفض','Low stock')+'</span>'
         :              '<span class="pw-state ok"><i class="ti ti-circle-check"></i>'+T('متوفر','In stock')+'</span>';
  }

  /* ---------- summary ----------
     Counts only; every number is derived from the same authorities the cards
     use, so the strip can never disagree with the list. */
  function summaryOf(all){
    var s = { total:all.length, active:0, hidden:0, low:0, zero:0 };
    all.forEach(function(p){
      if (p.status === 'hidden') s.hidden++; else s.active++;
      var b = stockBand(p);
      if (b === 'low') s.low++; else if (b === 'zero') s.zero++;
    });
    return s;
  }
  function renderSummary(all){
    var s = summaryOf(all);
    var rows = [
      { n:s.total,  ar:'إجمالي المنتجات', en:'Total products', cls:'',     act:"clearFilters()",        on:(fStatus==='all'&&fStock==='all'&&fCat==='all') },
      { n:s.active, ar:'معروض',           en:'Active',         cls:'',     act:"setStatusFromSummary('available')", on:fStatus==='available' },
      { n:s.hidden, ar:'مخفي',            en:'Hidden',         cls:'',     act:"setStatusFromSummary('hidden')",    on:fStatus==='hidden' },
      { n:s.low,    ar:'مخزون منخفض',      en:'Low stock',      cls:'warn', act:"setStockFromSummary('low')",        on:fStock==='low' },
      { n:s.zero,   ar:'نفد المخزون',      en:'Out of stock',   cls:'bad',  act:"setStockFromSummary('zero')",       on:fStock==='zero' }
    ];
    el('summary').innerHTML = rows.map(function(r){
      return '<button class="pw-sum-c '+r.cls+'" aria-pressed="'+(r.on?'true':'false')+'" onclick="'+r.act+'">'
        + '<span class="pw-sum-n">'+r.n+'</span>'
        + '<span class="pw-sum-l">'+T(r.ar,r.en)+'</span></button>';
    }).join('');
  }

  /* ---------- toolbar ---------- */
  function opt(list, cur){
    return list.map(function(o){
      return '<option value="'+o.k+'"'+(cur===o.k?' selected':'')+'>'+esc(T(o.ar,o.en))+'</option>';
    }).join('');
  }
  function renderToolbar(all){
    /* category options appear only for categories this store actually uses */
    var used = {};
    all.forEach(function(p){ if (p.cat) used[p.cat] = 1; });
    var cats = [{ k:'all', ar:'كل الفئات', en:'All categories' }]
      .concat(MP.categories().filter(function(c){ return used[c.k]; }));

    var st = el('fStatus'), sk = el('fStock'), ct = el('fCat');
    st.innerHTML = opt(STATUS_OPTS, fStatus); st.classList.toggle('on', fStatus!=='all');
    sk.innerHTML = opt(STOCK_OPTS,  fStock);  sk.classList.toggle('on', fStock!=='all');
    ct.innerHTML = opt(cats,        fCat);    ct.classList.toggle('on', fCat!=='all');

    var any = fStatus!=='all' || fStock!=='all' || fCat!=='all' || !!((el('q')||{}).value||'').trim();
    el('clearBtn').classList.toggle('show', any);
    el('vGrid').setAttribute('aria-pressed', view==='grid' ? 'true':'false');
    el('vList').setAttribute('aria-pressed', view==='list' ? 'true':'false');
  }
  window.setStatus = function(v){ fStatus = v; render(); };
  window.setStock  = function(v){ fStock  = v; render(); };
  window.setCat    = function(v){ fCat    = v; render(); };
  /* a summary tile toggles its own lens without disturbing the others */
  window.setStatusFromSummary = function(v){ fStatus = (fStatus===v?'all':v); render(); };
  window.setStockFromSummary  = function(v){ fStock  = (fStock===v?'all':v);  render(); };
  window.clearFilters = function(){
    fStatus='all'; fStock='all'; fCat='all';
    var q = el('q'); if (q) q.value = '';
    render();
  };
  window.setView = function(v){
    view = (v==='list') ? 'list' : 'grid';
    try { localStorage.setItem('raf_pw_view', view); } catch(e){}
    render();
  };
  window.refreshAll = function(){
    render();
    if (invPid) renderInventory();
    toast(T('تم التحديث','Refreshed'));
  };

  /* ---------- list ---------- */
  function matches(p, q){
    if (!q) return true;
    q = q.trim().toLowerCase();
    /* authoritative fields only: name, and the product id which is the SKU */
    var hay = [p.name.ar, p.name.en, p.id, p.barcode || ''].join(' ').toLowerCase();
    return hay.indexOf(q) > -1;
  }
  window.render = function(){
    var q = (el('q')||{}).value || '';
    var all = MP.list({ storeSlug:SLUG });
    renderSummary(all);
    renderToolbar(all);

    var list = all.filter(function(p){
      if (!matches(p,q)) return false;
      if (fStatus !== 'all' && statusOf(p) !== fStatus) return false;
      if (fCat    !== 'all' && p.cat !== fCat) return false;
      if (fStock  !== 'all'){
        if (fStock === 'combo') { if (!isCombo(p.id)) return false; }
        else if (stockBand(p) !== fStock) return false;
      }
      return true;
    });

    el('pCount').textContent = T(all.length+' منتج', all.length+' products');
    var grid = el('grid');
    grid.className = 'mw-grid' + (view==='list' ? ' list' : '');
    grid.innerHTML = list.length ? list.map(cardHTML).join('') : emptyHTML(all.length, q);
  };
  /* every empty situation says what happened and how to get out of it */
  function emptyHTML(total, q){
    if (!total) return '<div class="mw-empty"><i class="ti ti-package-off"></i>'
      + '<b>'+T('لا توجد منتجات في متجرك بعد','No products in your store yet')+'</b>'
      + '<span>'+T('عندما تُضاف منتجات إلى هذا المتجر ستظهر هنا مع مخزونها.',
                   'When products are added to this store they appear here with their inventory.')+'</span></div>';
    if (q.trim()) return '<div class="mw-empty"><i class="ti ti-search-off"></i>'
      + '<b>'+T('لا نتائج للبحث','No search results')+'</b>'
      + '<span>'+T('لم يطابق أي منتج «'+q.trim()+'». جرّب اسماً آخر أو رقم SKU.',
                   'Nothing matched “'+q.trim()+'”. Try another name or a SKU.')+'</span>'
      + '<button onclick="clearFilters()">'+T('مسح البحث والفلاتر','Clear search and filters')+'</button></div>';
    return '<div class="mw-empty"><i class="ti ti-filter-off"></i>'
      + '<b>'+T('لا منتجات بهذه الفلاتر','No products match these filters')+'</b>'
      + '<span>'+T('لديك '+total+' منتج، لكن أياً منها لا يطابق الفلاتر الحالية.',
                   'You have '+total+' products, but none match the current filters.')+'</span>'
      + '<button onclick="clearFilters()">'+T('مسح الفلاتر','Clear filters')+'</button></div>';
  }

  /* ---------- product card ----------
     Same markup for both views; the layout difference is CSS only, so there
     is exactly one card builder and one source of truth behind it. */
  function cardHTML(p){
    var canEdit = MP.canEdit();
    var v = invOf(p.id), combo = isCombo(p.id);
    var inv = !v
      ? '<div class="pw-inv-miss"><i class="ti ti-alert-triangle"></i><span>'
        + T('لا يوجد سجل مخزون لهذا المنتج','No inventory record for this product')+'</span></div>'
      : '<div class="pw-inv-n">'
          + '<span>'+v.onHand+'<em>'+T('المخزون','On hand')+'</em></span>'
          + '<span>'+v.reserved+'<em>'+T('محجوز','Reserved')+'</em></span>'
          + '<span class="hi">'+v.available+'<em>'+T('المتاح','Available')+'</em></span>'
        + '</div>';

    return '<article class="pw-card">'
      + '<div class="pw-media"'+(p.img?' style="background-image:url(\''+esc(p.img)+'\')"':'')+'>'
        + (p.img?'':'<i class="ti '+esc(p.ic||'ti-box')+'"></i>')
        + stateChip(p)
        + (p.disc ? '<span class="pw-disc">-'+esc(p.disc)+'%</span>' : '')
      + '</div>'
      + '<div class="pw-b">'
        + '<div class="pw-name">'+esc(L(p.name))+'</div>'
        + '<div class="pw-price"><b>'+esc(p.price)+'</b><em>'+MP.currency()+'</em>'
          + (p.old ? '<span>'+esc(p.old)+'</span>' : '')+'</div>'
        + '<div class="pw-inv">'
          + '<div class="pw-inv-h"><b>'+T('المخزون','Inventory')+'</b>'
            + (combo ? '<span class="pw-combo"><i class="ti ti-versions"></i>'
                       + T('مخزون الخيارات','Combination')+'</span>' : '')
            + (view==='list' ? stateChip(p) : '')
          + '</div>'
          + inv
        + '</div>'
        + '<div class="pw-sku">SKU '+esc(p.sku || p.id)+(p.cat?' · '+esc(catName(p.cat)):'')+'</div>'
      + '</div>'
      + '<div class="pw-f">'
        + '<button class="pw-edit" onclick="openEditor(\''+esc(p.id)+'\')"'
          + (canEdit?'':' disabled title="'+T('لا تملك صلاحية التعديل','No edit permission')+'"')+'>'
          + '<i class="ti ti-pencil"></i> '+T('تعديل','Edit')+'</button>'
        + '<button class="pw-stock" onclick="openInventory(\''+esc(p.id)+'\')">'
          + '<i class="ti ti-box"></i> '+T('المخزون','Inventory')+'</button>'
      + '</div></article>';
  }
  function catName(key){
    var c = MP.categories().filter(function(x){ return x.k===key; })[0];
    return c ? T(c.ar,c.en) : key;
  }

  /* ---------- editor ---------- */
  window.openEditor = function(id){
    var p = MP.get(id);
    if (!p){ toast(T('لا يمكن فتح هذا المنتج','This product cannot be opened')); return; }
    editing = id;
    baseVersion = MP.versionOf(id);
    original = JSON.parse(JSON.stringify({ name:p.name, desc:p.desc||{ar:'',en:''},
      price:p.price, old:p.old||'', disc:p.disc||0, cat:p.cat||'', stock:p.stock, status:p.status }));
    dirty = false;
    /* working copies — RAFSource is not touched until Save succeeds */
    vGroups = MV.groups(id);
    vGuide  = MV.guideOf(id) ? JSON.parse(JSON.stringify(MV.guideOf(id))) : null;
    vImages = MM.list(id);
    el('edTitle').textContent = L(p.name);
    el('edBody').innerHTML = editorHTML(p);
    renderMedia(); renderGroups(); renderGuide();
    el('editor').classList.add('show');
    document.body.style.overflow = 'hidden';
    el('edBody').addEventListener('input', markDirty);
    el('edBody').addEventListener('change', markDirty);
  };
  function markDirty(){ dirty = true; }

  function field(id, labelAr, labelEn, control, note){
    return '<div class="mw-f" id="f-'+id+'"><label for="'+id+'">'+T(labelAr,labelEn)+'</label>'
      + control + (note?'<div class="note">'+note+'</div>':'') + '<div class="msg" id="m-'+id+'"></div></div>';
  }
  function editorHTML(p){
    var cats = MP.categories();
    return '<div class="mw-ed-err" id="edErr"></div>'

      /* BASIC INFORMATION — each language edited on its own, never overwritten */
      + '<section class="mw-sec"><div class="mw-sec-h"><i class="ti ti-abc"></i> '+T('المعلومات الأساسية','Basic information')+'</div>'
        + field('nameAr','اسم المنتج (عربي)','Product name (Arabic)',
            '<input id="nameAr" dir="rtl" value="'+esc(p.name.ar)+'">')
        + field('nameEn','اسم المنتج (إنجليزي)','Product name (English)',
            '<input id="nameEn" dir="ltr" value="'+esc(p.name.en)+'">')
        + field('descAr','الوصف (عربي)','Description (Arabic)',
            '<textarea id="descAr" dir="rtl">'+esc((p.desc&&p.desc.ar)||'')+'</textarea>')
        + field('descEn','الوصف (إنجليزي)','Description (English)',
            '<textarea id="descEn" dir="ltr">'+esc((p.desc&&p.desc.en)||'')+'</textarea>')
      + '</section>'

      /* PRICING */
      + '<section class="mw-sec"><div class="mw-sec-h"><i class="ti ti-tag"></i> '+T('التسعير','Pricing')+'</div>'
        + '<div class="mw-row">'
          + field('price','السعر الحالي','Current price',
              '<input id="price" class="mw-num" inputmode="decimal" dir="ltr" value="'+esc(p.price)+'">',
              MP.currency())
          + field('old','السعر الأصلي','Original price',
              '<input id="old" class="mw-num" inputmode="decimal" dir="ltr" value="'+esc(p.old||'')+'">',
              T('اتركه فارغاً إن لم يوجد خصم','Leave empty when there is no discount'))
        + '</div>'
        + field('disc','نسبة الخصم %','Discount %',
            '<input id="disc" class="mw-num" inputmode="numeric" dir="ltr" value="'+esc(p.disc||0)+'">',
            T('يتطلب سعراً أصلياً أعلى من السعر الحالي','Requires an original price higher than the current price'))
      + '</section>'

      /* AVAILABILITY — the customer-facing state only. Stock itself is managed
         in the inventory workspace, so there is one place that writes stock
         and the editor never becomes a second one. */
      + '<section class="mw-sec"><div class="mw-sec-h"><i class="ti ti-package"></i> '+T('التوفر','Availability')+'</div>'
        + field('status','حالة العرض للعملاء','Customer-facing state',
            '<select id="status">'
            + '<option value="active"'+(p.status==='active'?' selected':'')+'>'+T('معروض للعملاء','Available to customers')+'</option>'
            + '<option value="hidden"'+(p.status==='hidden'?' selected':'')+'>'+T('مخفي','Hidden')+'</option>'
            + '</select>')
        + '<button type="button" class="mw-add" onclick="openInventoryFromEditor()">'
          + '<i class="ti ti-box"></i> '+T('إدارة المخزون','Manage inventory')+'</button>'
      + '</section>'

      /* CATEGORY — existing categories only */
      + '<section class="mw-sec"><div class="mw-sec-h"><i class="ti ti-category"></i> '+T('الفئة','Category')+'</div>'
        + field('cat','الفئة','Category',
            '<select id="cat">' + cats.map(function(c){
                return '<option value="'+esc(c.k)+'"'+(p.cat===c.k?' selected':'')+'>'+esc(T(c.ar,c.en))+'</option>';
              }).join('') + '</select>')
      + '</section>'

      /* IMAGES (Phase 3.3) — ordered gallery; the first image is the main one */
      + '<section class="mw-sec"><div class="mw-sec-h"><i class="ti ti-photo"></i> '+T('الصور','Images')+'</div>'
        + '<div id="mediaBox"></div>'
      + '</section>'

      /* OPTIONS (Phase 3.2) — the size / colour groups customers select from */
      + '<section class="mw-sec"><div class="mw-sec-h"><i class="ti ti-versions"></i> '+T('الخيارات','Options')+'</div>'
        + '<div id="vGroups"></div>'
        + '<button class="mw-add" onclick="addGroup()"><i class="ti ti-plus"></i> '
          + T('إضافة مجموعة خيارات','Add option group')+'</button>'
      + '</section>'

      /* SIZE GUIDE (Phase 3.2) — product-specific, shown only when configured */
      + '<section class="mw-sec"><div class="mw-sec-h"><i class="ti ti-ruler-measure"></i> '+T('دليل المقاسات','Size guide')+'</div>'
        + '<div id="sgBox"></div>'
      + '</section>'

      /* ADVANCED — read-only in this phase */
      + '<section class="mw-sec"><div class="mw-sec-h"><i class="ti ti-adjustments"></i> '+T('معلومات متقدمة','Advanced information')+'</div>'
        + '<div class="mw-ro">'
          + '<div>SKU: <b>'+esc(p.id)+'</b></div>'
          + '<div>'+T('الباركود','Barcode')+': <b>'+T('غير مسجَّل','Not recorded')+'</b></div>'
          + '<div>'+T('الخيارات','Options')+': <b>'+(p.variants?p.variants.length:0)+'</b></div>'
          + '<div style="margin-top:7px;color:var(--text3);font-size:11.5px;">'
            + T('الصور والخيارات ودليل المقاسات والباركود تُدار في مراحل لاحقة.',
                'Images, options, size guide and barcode are managed in later phases.')
          + '</div>'
        + '</div>'
      + '</section>';
  }

  /* ══════════ PHASE 3.4 · INVENTORY ══════════
     Every number comes from RAFInventory. The page keeps no inventory state
     of its own — each render resolves from the authority.

     The inventory workspace is its own drawer, opened from a product card or
     from the editor. It carries its own product id and concurrency stamp so
     stock can be managed without the editor being open, and so the editor
     never becomes a second place that writes stock. */
  var adjDir = 1;
  var invPid = null, invBase = null;

  window.openInventory = function(id){
    var p = MP.get(id);
    if (!p){ toast(T('لا يمكن فتح هذا المنتج','This product cannot be opened')); return; }
    invPid = id;
    invBase = MP.versionOf(id);
    adjDir = 1;
    cmbResetDraft(id);                 /* the baseline this merchant is reading */
    renderInvHeader();
    renderInventory();
    el('invDrawer').classList.add('show');
    document.body.style.overflow = 'hidden';
  };
  /* the mode can change under the merchant — configuring the first
     combination switches a product onto combination stock — so the header is
     re-derived on every render rather than fixed when the drawer opened */
  function renderInvHeader(){
    if (!invPid) return;
    var p = MP.get(invPid); if (!p) return;
    var combo = isCombo(invPid);
    el('invTitle').textContent = L(p.name);
    el('invSub').innerHTML =
      '<span class="pw-mode'+(combo?' on':'')+'">'
        + (combo ? T('مخزون الخيارات','Combination inventory')
                 : T('مخزون على مستوى المنتج','Product-level inventory'))+'</span>'
      + '<span>SKU '+esc(invPid)+'</span>'
      + '<span>'+T('آخر تحديث','Updated')+': '+esc(lastUpdatedText(invPid))+'</span>';
  }
  /* human-readable, from the record's own timestamp — no internal ids shown */
  function lastUpdatedText(id){
    var t = 0;
    if (isCombo(id)) INV.combinationsOf(id).forEach(function(r){ t = Math.max(t, r.updatedAt || 0); });
    if (!t){ var s = RAFSource.product(id); t = (s && s.updatedAt) || 0; }
    if (!t) return T('غير مسجَّل','Not recorded');
    var d = new Date(t);
    return d.toLocaleDateString(isEn()?'en-GB':'ar-EG', { day:'numeric', month:'short' })
         + ' · ' + d.toLocaleTimeString(isEn()?'en-GB':'ar-EG', { hour:'2-digit', minute:'2-digit' });
  }
  window.openInventoryFromEditor = function(){ if (editing) openInventory(editing); };
  window.closeInventory = function(){
    /* an unsaved combination edit must not disappear silently */
    if (invPid && cmbChangedCount() > 0 &&
        !confirm(T('لديك تغييرات مخزون غير محفوظة.\n\nموافق = تجاهل التغييرات\nإلغاء = متابعة التعديل',
                   'You have unsaved inventory changes.\n\nOK = discard them\nCancel = keep editing'))) return;
    el('invDrawer').classList.remove('show');
    invPid = null; invBase = null;
    if (!el('editor').classList.contains('show')) document.body.style.overflow = '';
  };

  /* ══════════ VARIANT COMBINATION INVENTORY ══════════
     Shown only for a product whose options can actually express more than
     one purchasable combination. A product with no options, or a single
     option group, keeps the simple product-level panel it always had. */
  var comboOpen = {};                       /* which colour/dimension groups are expanded */
  function comboGroupsFor(pid){
    var p = RAFCatalog.get(pid);
    return (p && p.variants) || [];
  }
  function comboCapable(pid){ return comboGroupsFor(pid).length >= 2; }

  /* group the flat combination list by its FIRST dimension, so a phone shows
     "Black → S / M / L" as vertical cards rather than a wide matrix */
  function comboSections(pid){
    var gs = comboGroupsFor(pid);
    if (!gs.length) return [];
    var lead = gs[0], rest = gs.slice(1);
    var rows = INV.combinationsOf(pid);
    return (lead.options || []).map(function(lo){
      var mine = rows.filter(function(r){ return r.vs.indexOf(String(lo.v)) > -1; });
      return { v:String(lo.v), label:lo.label || lo, hex:lo.hex || null,
               rows:mine.map(function(r){
                 /* label this row by the remaining dimensions only */
                 var tail = r.options.filter(function(o){ return String(o.v) !== String(lo.v); });
                 return { id:r.id, label:tail.map(function(o){ return L(o.label||o); }).join(' · ') || L(lo.label||lo),
                          onHand:r.onHand, reserved:r.reserved, available:r.available,
                          configured:r.configured };
               }) };
    });
  }
  function comboInventoryHTML(pid){
    var secs = comboSections(pid);
    var mode = INV.modeOf(pid);
    var unconfigured = INV.combinationsOf(pid).filter(function(r){ return !r.configured; }).length;
    var h = '<div class="cmb-h"><div><b>'+T('مخزون الخيارات','Combination stock')+'</b>'
      + '<span>'+T('لكل تركيبة قابلة للشراء مخزون خاص بها.',
                   'Every purchasable combination carries its own stock.')+'</span></div>'
      + '<span class="cmb-mode '+(mode==='combination'?'on':'')+'">'
      + (mode==='combination' ? T('مُفعّل','Active') : T('غير مُفعّل','Not set up'))+'</span></div>';

    if (mode === 'product'){
      h += '<div class="mw-inv-note"><i class="ti ti-info-circle"></i><span>'
        + T('هذا المنتج يستخدم مخزوناً على مستوى المنتج. حدّد كميات التركيبات أدناه لتفعيل مخزون الخيارات — لا يتم توزيع الكمية الحالية تلقائياً.',
            'This product uses product-level stock. Set quantities below to switch it to combination stock — the current quantity is never split automatically.')
        + '</span></div>';
    } else if (unconfigured){
      h += '<div class="mw-inv-note"><i class="ti ti-alert-triangle"></i><span>'
        + T(unconfigured+' تركيبة بدون مخزون محدد — لن تكون متاحة للعملاء حتى تُحدَّد.',
            unconfigured+' combination(s) have no stock configured — customers cannot buy them until you set one.')
        + '</span></div>';
    }

    secs.forEach(function(s){
      var open = comboOpen[s.v] !== false;
      h += '<section class="cmb-sec">'
        + '<button type="button" class="cmb-sec-h" onclick="toggleCombo(\''+esc(s.v)+'\')" aria-expanded="'+open+'">'
          + (s.hex ? '<span class="cmb-dot" style="background:'+esc(s.hex)+'"></span>' : '')
          + '<b>'+esc(L(s.label))+'</b>'
          + '<i class="ti ti-chevron-'+(open?'up':'down')+'"></i></button>';
      if (open){
        h += '<div class="cmb-rows">' + s.rows.map(function(r){
          var state = !r.configured ? T('غير محدد','Not configured')
                    : r.available > 0 ? T('متوفر','Available') : T('غير متوفر','Out of stock');
          var cls = !r.configured ? 'un' : (r.available > 0 ? 'ok' : 'out');
          /* an unsaved edit keeps its value across re-renders and is marked,
             so the merchant can see exactly what one Save is about to write */
          var shown = (cmbDraft[r.id] != null) ? cmbDraft[r.id] : r.onHand;
          var dirty = String(shown).trim() !== String(r.onHand);
          return '<div class="cmb-row">'
            + '<div class="cmb-n"><b>'+esc(r.label)+'</b><span class="cmb-st '+cls+'">'+state+'</span></div>'
            + '<div class="cmb-nums">'
              + '<span><em>'+T('المخزون','On hand')+'</em>'+r.onHand+'</span>'
              + '<span><em>'+T('محجوز','Reserved')+'</em>'+r.reserved+'</span>'
              + '<span class="hi"><em>'+T('المتاح','Available')+'</em>'+r.available+'</span>'
            + '</div>'
            + '<div class="cmb-adj">'
              + '<button type="button" class="cmb-b" onclick="cmbStep(\''+esc(r.id)+'\',-1)" aria-label="'+T('إنقاص','Decrease')+'"><i class="ti ti-minus"></i></button>'
              + '<input class="cmb-in'+(dirty?' dirty':'')+'" id="cmb_'+esc(r.id)+'" inputmode="numeric" dir="ltr"'
                + ' value="'+esc(String(shown))+'" oninput="cmbEdit(\''+esc(r.id)+'\',this.value)">'
              + '<button type="button" class="cmb-b" onclick="cmbStep(\''+esc(r.id)+'\',1)" aria-label="'+T('زيادة','Increase')+'"><i class="ti ti-plus"></i></button>'
            + '</div>'
          + '</div>';
        }).join('') + '</div>';
      }
      h += '</section>';
    });
    h += '<div class="cmb-err" id="cmbErr"></div>';
    /* §3 — ONE Save for the whole edited set. There is deliberately no
       per-row Save: a set that is half-written is exactly the partial state
       this operation must never produce. */
    var n = cmbChangedCount();
    h += '<div class="cmb-bar">'
      + '<span class="cmb-count">'+(n
          ? T(n+' تركيبة معدّلة', n+' combination'+(n===1?'':'s')+' edited')
          : T('لا توجد تغييرات','No changes'))+'</span>'
      + '<button type="button" class="cmb-reset" onclick="cmbDiscard()"'+(n?'':' disabled')+'>'
        + T('تراجع','Discard')+'</button>'
      + '<button type="button" class="cmb-save" onclick="cmbSaveAll()"'+(n?'':' disabled')+'>'
        + '<i class="ti ti-device-floppy"></i> '+T('حفظ كل التغييرات','Save all changes')+'</button>'
      + '</div>';
    return '<div class="cmb">'+h+'</div>';
  }
  window.toggleCombo = function(v){ comboOpen[v] = comboOpen[v] === false; renderInventory(); };

  /* ---- the edited set, held until the merchant saves it as one operation ----
     `cmbBase` is captured when the editor is opened, NOT when Save is pressed:
     it is the version the merchant actually read, which is what makes the
     stale-write check mean anything. */
  var cmbDraft = {}, cmbBase = null, cmbBaseFor = null;
  function cmbVersionOf(pid){
    return INV.combinationsOf(pid).reduce(function(m, r){ return Math.max(m, r.updatedAt || 0); }, 0);
  }
  function cmbResetDraft(pid){
    cmbDraft = {}; cmbBaseFor = pid || null;
    cmbBase = pid ? cmbVersionOf(pid) : null;
  }
  function cmbCurrent(){
    var map = {};
    if (invPid) INV.combinationsOf(invPid).forEach(function(r){ map[r.id] = r; });
    return map;
  }
  /* a row counts as edited only when its value actually differs from stock */
  function cmbChangedCount(){
    var cur = cmbCurrent(), n = 0;
    for (var id in cmbDraft) if (cmbDraft.hasOwnProperty(id)) {
      var r = cur[id]; if (!r) continue;
      if (String(cmbDraft[id]).trim() !== String(r.onHand)) n++;
    }
    return n;
  }
  window.cmbEdit = function(id, val){
    cmbDraft[id] = String(val);
    var bar = el('invBox') && el('invBox').querySelector('.cmb-bar');
    var n = cmbChangedCount();
    if (bar){
      bar.querySelector('.cmb-count').textContent = n
        ? T(n+' تركيبة معدّلة', n+' combination'+(n===1?'':'s')+' edited')
        : T('لا توجد تغييرات','No changes');
      bar.querySelector('.cmb-save').disabled = !n;
      bar.querySelector('.cmb-reset').disabled = !n;
    }
    var i = el('cmb_'+id);
    if (i) i.classList.toggle('dirty', n > 0 && String(val).trim() !== String((cmbCurrent()[id]||{}).onHand));
  };
  window.cmbStep = function(id, d){
    var i = el('cmb_'+id); if (!i) return;
    var n = parseInt(i.value, 10); if (!isFinite(n)) n = 0;
    i.value = Math.max(0, n + d);
    cmbEdit(id, i.value);
  };
  window.cmbDiscard = function(){ cmbResetDraft(invPid); renderInventory(); };
  function cmbErr(msg){ var e = el('cmbErr'); if (e){ e.textContent = msg; e.classList.add('show'); } }
  function cmbLabel(id){
    var r = cmbCurrent()[id];
    return r ? r.options.map(function(o){ return L(o.label||o); }).join(' · ') : id;
  }
  /* Build the entire edited set and submit it in ONE atomic operation.
     Nothing is written unless every entry passes; a single bad row leaves the
     whole product exactly as it was. */
  window.cmbSaveAll = function(){
    if (!invPid) return;
    var e = el('cmbErr'); if (e) e.classList.remove('show');
    var cur = cmbCurrent(), entries = {}, n = 0;
    for (var id in cmbDraft) if (cmbDraft.hasOwnProperty(id)) {
      var row = cur[id]; if (!row) continue;
      var raw = String(cmbDraft[id]).trim();
      if (raw === String(row.onHand)) continue;
      /* a value that is not a whole number is sent as-is and refused by the
         authority, so the refusal covers the WHOLE set, not just this row */
      entries[id] = /^\d+$/.test(raw) ? parseInt(raw, 10) : NaN;
      n++;
    }
    if (!n) return cmbErr(T('لا توجد تغييرات لحفظها.','There is nothing to save.'));

    var res = INV.setCombinations(invPid, entries,
      { actor:ME, baseVersion: (cmbBaseFor === invPid && cmbBase != null) ? cmbBase : undefined });
    if (!res.ok){
      var who = res.combinationId ? ' — ' + cmbLabel(res.combinationId) : '';
      var m = res.code === 'BELOW_RESERVED'
        ? T('لا يمكن أن يقل المخزون عن الكمية المحجوزة ('+res.reserved+')'+who+'. لم يتم حفظ أي تغيير.',
            'Stock cannot go below the reserved quantity ('+res.reserved+')'+who+'. Nothing was saved.')
        : res.code === 'INVALID_QUANTITY'
        ? T('أدخل كمية صحيحة'+who+'. لم يتم حفظ أي تغيير.',
            'Enter a whole quantity'+who+'. Nothing was saved.')
        : res.code === 'STALE' ? T('تم تحديث المخزون من جلسة أخرى. أعد تحميل المنتج ثم حاول مجدداً. لم يتم حفظ أي تغيير.',
                                   'Stock was updated in another session. Reload the product and try again. Nothing was saved.')
        : res.code === 'INVALID_COMBINATION' ? T('تركيبة غير صالحة'+who+'. لم يتم حفظ أي تغيير.',
                                                 'Invalid combination'+who+'. Nothing was saved.')
        : res.code === 'CROSS_STORE' ? T('هذا المنتج لا يخص متجرك.','This product does not belong to your store.')
        : res.code === 'FORBIDDEN' ? T('ليس لديك صلاحية.','You do not have permission.')
        : T('تعذّر حفظ المخزون. لم يتم حفظ أي تغيير.','Stock could not be saved. Nothing was saved.');
      return cmbErr(m);
    }
    cmbResetDraft(invPid);
    renderInventory(); render();          /* the card's numbers move with it */
    toast(T('تم حفظ '+n+' تركيبة','Saved '+n+' combination'+(n===1?'':'s')));
  };

  function renderInventory(){
    var box = el('invBox'); if (!box || !invPid) return;
    renderInvHeader();
    /* a multi-dimension product is governed by its combinations */
    if (comboCapable(invPid)){ box.innerHTML = comboInventoryHTML(invPid); return; }
    var v = invOf(invPid);
    if (!v){
      box.innerHTML = '<div class="mw-inv-none"><i class="ti ti-alert-triangle"></i><div>'
        + '<b>'+T('لا يوجد سجل مخزون لهذا المنتج','No inventory record for this product')+'</b>'
        + T('لا يمكن عرض أو تعديل المخزون.','Inventory cannot be shown or adjusted.')
        + '</div></div>';
      return;
    }
    var st = INV.stateOf(invPid);
    box.innerHTML =
      '<div class="mw-inv-g">'
        + '<div class="mw-inv-c"><span>'+T('المخزون','On hand')+'</span><b>'+v.onHand+'</b></div>'
        + '<div class="mw-inv-c"><span>'+T('محجوز','Reserved')+'</span><b>'+v.reserved+'</b></div>'
        + '<div class="mw-inv-c hi"><span>'+T('المتاح','Available')+'</span><b>'+v.available+'</b></div>'
      + '</div>'
      + '<div class="mw-inv-state st-'+(st==='out_of_stock'?'out':'available')+'">'
        + (st==='out_of_stock' ? T('غير متوفر للعملاء','Out of stock for customers')
                               : T('متوفر للعملاء','Available to customers'))
      + '</div>'
      + (v.reserved > 0
          ? '<div class="mw-inv-note"><i class="ti ti-info-circle"></i><span>'
            + T('الكمية المحجوزة مرتبطة بطلبات جارية وتعود تلقائياً إذا أُلغيت.',
                'Reserved units belong to orders in progress and return automatically if those orders are cancelled.')
            + '</span></div>' : '')
      /* manual adjustment — an explicit action, validated by the authority */
      + '<div class="mw-adj">'
        + '<div class="mw-adj-h">'+T('تعديل المخزون','Adjust stock')+'</div>'
        + '<div class="mw-adj-row">'
          + '<div class="mw-adj-dir">'
            + '<button type="button" class="mw-adj-b'+(adjDir===1?' on':'')+'" onclick="setAdjDir(1)">'
              + '<i class="ti ti-plus"></i> '+T('زيادة','Increase')+'</button>'
            + '<button type="button" class="mw-adj-b'+(adjDir===-1?' on':'')+'" onclick="setAdjDir(-1)">'
              + '<i class="ti ti-minus"></i> '+T('إنقاص','Decrease')+'</button>'
          + '</div>'
          + '<input id="adjQty" class="mw-num" inputmode="numeric" dir="ltr" value=""'
            + ' placeholder="'+T('الكمية','Quantity')+'" oninput="previewAdj()">'
        + '</div>'
        + '<input id="adjReason" placeholder="'+T('سبب التعديل (مطلوب)','Reason (required)')+'" oninput="clearAdjMsg()">'
        + '<div class="mw-adj-res" id="adjPreview"></div>'
        + '<div class="mw-adj-err" id="adjErr"></div>'
        + '<button type="button" class="mw-btn-gold mw-adj-apply" onclick="applyAdj()">'
          + T('تطبيق التعديل','Apply adjustment')+'</button>'
      + '</div>';
    previewAdj();
  }
  window.setAdjDir = function(d){ adjDir = d; renderInventory(); };
  window.clearAdjMsg = function(){ var e=el('adjErr'); if(e){ e.textContent=''; e.classList.remove('show'); } };
  window.previewAdj = function(){
    var box = el('adjPreview'); if (!box || !invPid) return;
    var v = invOf(invPid); if (!v) return;
    var raw = (el('adjQty')||{}).value || '';
    var n = Number(String(raw).trim());
    if (!raw || !isFinite(n) || n <= 0 || n % 1 !== 0){ box.textContent = ''; return; }
    var next = v.onHand + (adjDir * n);
    box.innerHTML = T('النتيجة','Result') + ': <b>' + v.onHand + ' → ' + next + '</b>'
      + (next < 0 ? ' <span class="bad">'+T('غير مسموح','not allowed')+'</span>' : '');
  };
  window.applyAdj = function(){
    if (!invPid) return;
    clearAdjMsg();
    var qty = Number(String((el('adjQty')||{}).value || '').trim());
    var reason = String((el('adjReason')||{}).value || '').trim();
    /* the authority validates; the page only passes the merchant's input */
    var res = INV.adjust(invPid, adjDir * qty, reason, { actor:ME, baseVersion:invBase });
    if (!res.ok){
      var e = el('adjErr');
      e.textContent = (res.errors && res.errors[0] && res.errors[0].message) || adjErrorText(res.code);
      e.classList.add('show');
      /* a stale reading must be reloaded, not retried over newer data */
      if (res.code === 'STALE'){ invBase = MP.versionOf(invPid); renderInventory(); }
      return;
    }
    /* our own write moved the product's version — keep both surfaces in step */
    invBase = MP.versionOf(invPid);
    if (editing === invPid) baseVersion = invBase;
    el('adjQty').value = ''; el('adjReason').value = '';
    renderInventory(); render();
    toast(T('تم تعديل المخزون','Stock adjusted'));
  };
  function adjErrorText(code){
    return code === 'FORBIDDEN'    ? T('لا تملك صلاحية تعديل المخزون','You do not have permission to change inventory')
         : code === 'CROSS_STORE'  ? T('هذا المنتج لا يخص متجرك','This product does not belong to your store')
         : code === 'PERSIST_FAILED' ? T('تعذّر حفظ المخزون','Inventory could not be saved')
         : T('تعذّر تنفيذ التعديل','The adjustment could not be applied');
  }

  /* ══════════ PHASE 3.3 · IMAGES ══════════
     A working copy of the ordered image list. Nothing reaches RAFSource
     until Save, and every write goes through RAFMerchantMedia. */
  var MM = window.RAFMerchantMedia;
  var vImages = [];

  function renderMedia(){
    var box = el('mediaBox'); if (!box) return;
    box.innerHTML =
      (vImages.length
        ? '<div class="mw-mg">' + vImages.map(function(refUrl, i){
            var kind = MM.kindOf(refUrl);
            return '<div class="mw-mi'+(i===0?' main':'')+'">'

                + '<button class="mw-ico" onclick="moveImg('+i+',1)" '+(i===vImages.length-1?'disabled':'')+' aria-label="'+T('لليمين','Move forward')+'"><i class="ti ti-chevron-down"></i></button>'

                + '<button class="mw-ico" onclick="replaceImg('+i+')" aria-label="'+T('استبدال','Replace')+'"><i class="ti ti-refresh"></i></button>'
                + '<button class="mw-ico danger" onclick="removeImg('+i+')" '+(vImages.length<=1?'disabled title="'+T('يجب إبقاء صورة واحدة','At least one image is required')+'"':'')+' aria-label="'+T('حذف','Remove')+'"><i class="ti ti-trash"></i></button>'
              + '</div>'
              + '<span class="mw-mi-k">'+kind+'</span>'
            + '</div>';
          }).join('') + '</div>'
        : '<div class="mw-ro">'+T('لا توجد صور لهذا المنتج.','This product has no images.')+'</div>')
      + '<div class="mw-mg-add">'
        + '<button class="mw-add" onclick="pickFile(-1)"><i class="ti ti-upload"></i> '+T('إضافة من جهازك','Add from your device')+'</button>'
        + '<button class="mw-add" onclick="addByUrl()"><i class="ti ti-link"></i> '+T('إضافة برابط','Add by link')+'</button>'
      + '</div>'
      + '<div class="mw-mnote"><i class="ti ti-info-circle"></i><span>'
        + T('الصورة الأولى هي الصورة الرئيسية التي تظهر في البطاقات ونتائج البحث. الحد الأقصى '
            + MM.MAX_IMAGES + ' صور، وحجم الملف حتى ' + Math.round(MM.MAX_DATA_URL_BYTES/1024) + ' كيلوبايت.',
            'The first image is the main image shown on cards and in search results. Up to '
            + MM.MAX_IMAGES + ' images, each file up to ' + Math.round(MM.MAX_DATA_URL_BYTES/1024) + ' KB.')
      + '</span></div>'
      + '<input type="file" id="mediaFile" accept="image/*" style="display:none" onchange="onFile(event)">';
  }

  var replaceAt = -1;
  window.moveImg = function(i, dir){
    var j = i + dir; if (j < 0 || j >= vImages.length) return;
    var t = vImages[i]; vImages[i] = vImages[j]; vImages[j] = t;
    markDirty(); renderMedia();
  };
  window.makeMain = function(i){
    var pick = vImages.splice(i,1)[0];
    vImages.unshift(pick);
    markDirty(); renderMedia();
  };
  window.removeImg = function(i){
    if (vImages.length <= 1) return;         /* a product must keep one image */
    vImages.splice(i,1); markDirty(); renderMedia();
  };
  window.replaceImg = function(i){ pickFile(i); };
  window.pickFile = function(i){ replaceAt = i; el('mediaFile').value = ''; el('mediaFile').click(); };
  window.onFile = function(e){
    var f = e.target.files && e.target.files[0]; if (!f) return;
    MM.fileToDataUrl(f).then(function(dataUrl){
      if (MM.byteLength(dataUrl) > MM.MAX_DATA_URL_BYTES){
        showErrors([{ message:T('حجم الصورة يتجاوز '+Math.round(MM.MAX_DATA_URL_BYTES/1024)+' كيلوبايت',
                                'Image exceeds '+Math.round(MM.MAX_DATA_URL_BYTES/1024)+' KB') }]);
        return;
      }
      applyNewRef(dataUrl);
    }).catch(function(){
      showErrors([{ message:T('تعذّرت قراءة الملف','The file could not be read') }]);
    });
  };
  window.addByUrl = function(){
    var url = window.prompt(T('أدخل رابط الصورة','Enter the image URL'), '');
    if (!url) return;
    url = url.trim();
    if (MM.kindOf(url) === 'ephemeral'){
      showErrors([{ message:T('هذا الرابط مؤقت ولن يبقى بعد التحديث.','This link is temporary and would not survive a refresh.') }]);
      return;
    }
    /* never save a reference that does not resolve */
    MM.probe(url).then(function(ok){
      if (!ok){ showErrors([{ message:T('تعذّر تحميل هذه الصورة. تحقق من الرابط.','This image could not be loaded. Check the link.') }]); return; }
      applyNewRef(url);
    });
  };
  function applyNewRef(ref){
    clearErrors();
    if (vImages.indexOf(ref) > -1){
      showErrors([{ message:T('هذه الصورة مضافة بالفعل','This image has already been added') }]);
      return;
    }
    if (replaceAt >= 0){ vImages[replaceAt] = ref; }        /* position preserved */
    else {
      if (vImages.length >= MM.MAX_IMAGES){
        showErrors([{ message:T('الحد الأقصى '+MM.MAX_IMAGES+' صور','A maximum of '+MM.MAX_IMAGES+' images is allowed') }]);
        return;
      }
      vImages.push(ref);
    }
    replaceAt = -1;
    markDirty(); renderMedia();
  }

  /* ══════════════════════════════════════════════════════════════

     validation, persistence and audit all live there.

     Options and combinations are two separate ideas on purpose. The

  /* ---------- images: the existing media authority, nothing new ---------- */
  function cwRenderMedia(){

      (CW.images.length
        ? '<div class="mw-mg">' + CW.images.map(function(u,i){

    var t=CW.images[i]; CW.images[i]=CW.images[j]; CW.images[j]=t; cwMark(); cwRenderMedia(); };
  window.cwMakeMain = function(i){ CW.images.unshift(CW.images.splice(i,1)[0]); cwMark(); cwRenderMedia(); };
  window.cwRemoveImg = function(i){ CW.images.splice(i,1); cwMark(); cwRenderMedia(); };

  window.cwOnFile = function(ev){
    var f = ev.target.files && ev.target.files[0]; ev.target.value = '';

      if (!res.ok){ cwMediaErr(res.message || T('تعذّر قراءة الملف','The file could not be read')); return; }
      cwTryAddImage(res.dataUrl);

  /* the media authority validates the resulting list, exactly as on edit */

    if (!v.ok){ cwMediaErr((v.errors[0] && v.errors[0].message) || T('صورة غير صالحة','Invalid image')); return; }

  /* ---------- options and the combination picker ---------- */
  function cwOptionsHTML(){

  /* every pairing the values can express — the merchant ticks the real ones */
  function cwCandidates(){
    var gs = CW.groups.filter(function(g){ return g.options.length; });
    if (!gs.length) return [];
    var rows = [[]];
    gs.forEach(function(g){
      var next = [];
      g.options.forEach(function(o){ rows.forEach(function(r){ next.push(r.concat([{g:g,o:o}])); }); });
      rows = next;
    });
    return rows.map(function(r){
      return { key:r.map(function(x){ return x.o.v; }).sort().join('|'),
               vs:r.map(function(x){ return x.o.v; }),
               label:r.map(function(x){ return L(x.o.label); }).join(' / '),
               hex:(r.filter(function(x){ return x.g.kind==='color'; })[0]||{o:{}}).o.hex || null };
    });
  }
  function cwCombosHTML(){
    var cands = cwCandidates();
    if (!cands.length)
      return '<div class="pw-combos"><div class="pw-none">'
        + T('أضف قيم الخيارات أولاً لتظهر التركيبات الممكنة. المنتج بدون تركيبات يستخدم مخزوناً على مستوى المنتج.',
            'Add option values first and the possible combinations appear here. A product with no combinations uses product-level inventory.')
        + '</div></div>';
    var chosen = Object.keys(CW.combos).filter(function(k){ return CW.combos[k]; }).length;
    return '<div class="pw-combos">'

          ? T('سيتم إنشاء '+chosen+' تركيبة. تُحدَّد الكميات لاحقاً من المنتجات ← المخزون.',
              chosen+' combination'+(chosen===1?'':'s')+' will be created. Quantities are set afterwards in Products → Inventory.')
          : T('لم تختر أي تركيبة — سيستخدم المنتج مخزوناً على مستوى المنتج.',

  window.cwAddGroup = function(){
    var kind = CW.groups.some(function(g){ return g.kind==='color'; }) ? 'size' : 'color';

  };
  window.cwRemoveGroup = function(gi){ CW.groups.splice(gi,1); CW.combos = {}; cwMark(); renderCreate(); };
  window.cwSetGroupKind = function(gi, k){ CW.groups[gi].kind = k; cwMark(); renderCreate(); };
  window.cwSetHex = function(gi, oi, hex){ CW.groups[gi].options[oi].hex = hex; cwMark(); renderCreate(); };
  window.cwAddValue = function(gi){
    var ar = (el('cwv-ar-'+gi)||{}).value || '', en = (el('cwv-en-'+gi)||{}).value || '';

    if (!ar && !en) return;
    /* the option id comes from the variant authority, never from this page */
    var v = MV.newOptionId(CW.groups[gi].options, en || ar);
    var o = { v:v, label:{ ar:ar || en, en:en || ar } };
    if (CW.groups[gi].kind === 'color') o.hex = (el('cwv-hex-'+gi)||{}).value || '#cccccc';
    CW.groups[gi].options.push(o);
    cwMark(); renderCreate();
  };
  /* nothing is saved yet, so an unsaved value can simply go */
  window.cwRemoveValue = function(gi, oi){
    var gone = CW.groups[gi].options.splice(oi,1)[0];

    });

  /* ---------- save ---------- */
  function cwShowErrors(errors){
    var b = el('cwErr');
    b.innerHTML = '<b>'+T('تعذّر إنشاء المنتج','Could not create the product')+'</b><ul>'
      + errors.map(function(e){ return '<li>'+esc(e.message)+'</li>'; }).join('') + '</ul>';
    b.classList.add('show');
    el('cwBody').parentNode.scrollTop = 0;
