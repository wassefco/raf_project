<!DOCTYPE html>
<html lang="ar" dir="rtl" id="htmlRoot">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>رف — تسجيل الدخول</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700;900&family=Tajawal:wght@300;400;500;700&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
<style>
  :root {
    --bg: #F5F2EC;
    --bg2: #EDE8DC;
    --card: #FFFFFF;
    --gold: #C9A84C;
    --gold2: #A07828;
    --black: #0A0A0A;
    --text: #0A0A0A;
    --text2: #555;
    --text3: #888;
    --border: #D8D3C8;
    --r: 8px;
    --rl: 16px;
    --font: 'Tajawal', sans-serif;
    --fdisplay: 'Playfair Display', serif;
    --fen: 'DM Sans', sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }

  html { overflow-x: hidden; }
  body {
    background: #0A0A0A;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: var(--font);
    padding: 20px;
    position: relative;
    overflow-x: hidden;
    max-width: 100%;
  }

  /* Background dot grid */
  body::before {
    content: '';
    position: fixed; inset: 0;
    background-image: radial-gradient(rgba(201,168,76,0.07) 1px, transparent 1px);
    background-size: 32px 32px;
    pointer-events: none;
  }

  /* Ambient gold glow */
  body::after {
    content: '';
    position: fixed;
    width: 600px; height: 600px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(201,168,76,0.09) 0%, transparent 65%);
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    pointer-events: none;
  }

  /* LANG BUTTON */
  .lang-btn {
    position: fixed; top: 20px; left: 20px;
    padding: 7px 14px;
    border: 1px solid #222;
    border-radius: var(--r);
    background: rgba(255,255,255,0.04);
    color: #555; font-family: var(--fen);
    font-size: 12px; cursor: pointer;
    transition: all .2s;
    display: inline-flex; align-items: center; gap: 6px;
    z-index: 100; letter-spacing: .5px;
  }
  .lang-btn:hover { border-color: var(--gold); color: var(--gold); }
  .lang-dot { width: 5px; height: 5px; border-radius: 50%; background: var(--gold); }

  /* BACK LINK */
  .back-link {
    position: fixed; top: 20px; right: 20px;
    display: flex; align-items: center; gap: 6px;
    font-size: 13px; color: #444;
    text-decoration: none;
    transition: color .2s;
    z-index: 100;
  }
  .back-link:hover { color: var(--gold); }

  /* LOGIN CARD */
  .login-card {
    position: relative; z-index: 10;
    width: 100%; max-width: 420px;
    background: #111;
    border: 1px solid #1e1e1e;
    border-radius: 20px;
    padding: 44px 40px 36px;
    box-shadow: 0 0 0 1px rgba(201,168,76,0.08), 0 40px 80px rgba(0,0,0,0.6);
  }

  /* Card top glow accent */
  .login-card::before {
    content: '';
    position: absolute;
    top: 0; left: 50%; transform: translateX(-50%);
    width: 160px; height: 1px;
    background: linear-gradient(90deg, transparent, var(--gold), transparent);
    border-radius: 50%;
  }

  /* LOGO */
  .logo-wrap {
    text-align: center;
    margin-bottom: 32px;
  }
  .logo-mark {
    font-family: var(--fdisplay);
    font-size: 52px; font-weight: 900;
    color: var(--gold);
    line-height: 1;
    display: block;
    letter-spacing: -1px;
  }
  .logo-sub {
    font-family: var(--fen);
    font-size: 10px; font-weight: 300;
    color: #333; letter-spacing: 5px;
    text-transform: uppercase;
    margin-top: 4px;
    display: block;
  }

  /* STEP INDICATOR */
  .steps {
    display: flex; align-items: center; gap: 8px;
    margin-bottom: 24px;
  }
  .step-dot {
    width: 6px; height: 6px; border-radius: 50%;
    background: #222; transition: all .3s;
  }
  .step-dot.on { background: var(--gold); width: 20px; border-radius: 3px; }
  .step-label { font-size: 11px; color: #333; margin-right: auto; font-family: var(--fen); }

  /* FORM HEADER */
  .form-header { margin-bottom: 24px; }
  .form-title {
    font-family: var(--fdisplay);
    font-size: 22px; font-weight: 700;
    color: #F5F2EC; margin-bottom: 6px;
  }
  .form-sub { font-size: 13px; color: #444; line-height: 1.6; }

  /* METHOD TABS */
  .method-tabs {
    display: grid; grid-template-columns: repeat(3,1fr);
    gap: 6px; margin-bottom: 24px;
    background: #0d0d0d;
    border: 1px solid #1e1e1e;
    border-radius: 12px;
    padding: 4px;
  }
  .method-tab {
    padding: 10px 6px;
    border-radius: 9px;
    border: none; background: transparent;
    color: #444; font-family: var(--font);
    font-size: 12px; cursor: pointer;
    transition: all .2s;
    display: flex; flex-direction: column;
    align-items: center; gap: 5px;
  }
  .method-tab i { font-size: 18px; }
  .method-tab.on {
    background: #1a1a1a;
    color: #ccc;
    box-shadow: 0 1px 4px rgba(0,0,0,0.4);
    border: 1px solid #2a2a2a;
  }
  .method-tab.on i { color: var(--gold); }

  /* FORM FIELDS */
  .field { margin-bottom: 16px; }
  .field-label {
    font-size: 12px; font-weight: 500;
    color: #444; margin-bottom: 7px;
    display: block; letter-spacing: .3px;
  }
  .field-input {
    width: 100%; padding: 12px 16px;
    border: 1px solid #1e1e1e;
    border-radius: var(--r);
    background: #0d0d0d;
    color: #ccc; font-family: var(--font);
    font-size: 14px; outline: none;
    transition: border-color .2s, box-shadow .2s;
  }
  .field-input:focus {
    border-color: var(--gold);
    box-shadow: 0 0 0 3px rgba(201,168,76,0.08);
  }
  .field-input::placeholder { color: #2e2e2e; }
  .input-wrap { position: relative; }
  .input-wrap input { padding-right: 44px; }
  .input-prefix {
    position: absolute; right: 14px; top: 50%;
    transform: translateY(-50%);
    font-size: 14px; color: #333;
  }

  /* OTP */
  .otp-wrap { display: flex; gap: 8px; }
  .otp-input {
    flex: 1; padding: 12px 0;
    border: 1px solid #1e1e1e;
    border-radius: var(--r);
    background: #0d0d0d;
    color: #F5F2EC; font-family: var(--fen);
    font-size: 20px; font-weight: 700;
    text-align: center; outline: none;
    transition: border-color .2s, box-shadow .2s;
    min-width: 0;
  }
  .otp-input:focus {
    border-color: var(--gold);
    box-shadow: 0 0 0 3px rgba(201,168,76,0.08);
  }

  /* PRIMARY BUTTON */
  .btn-main {
    width: 100%; padding: 14px;
    background: var(--gold); border: none;
    border-radius: var(--r);
    color: #0A0A0A;
    font-family: var(--font); font-size: 14px; font-weight: 700;
    cursor: pointer; transition: all .2s;
    display: flex; align-items: center; justify-content: center; gap: 8px;
    margin-bottom: 16px; letter-spacing: .3px;
  }
  .btn-main:hover { background: var(--gold2); transform: translateY(-1px); box-shadow: 0 6px 20px rgba(201,168,76,0.25); }

  /* GHOST BUTTON */
  .btn-ghost {
    width: 100%; padding: 12px;
    background: transparent; border: 1px solid #1e1e1e;
    border-radius: var(--r); color: #444;
    font-family: var(--font); font-size: 13px;
    cursor: pointer; transition: all .2s;
    display: flex; align-items: center; justify-content: center; gap: 6px;
  }
  .btn-ghost:hover { border-color: var(--gold); color: var(--gold); }

  /* DIVIDER */
  .or-divider {
    display: flex; align-items: center; gap: 12px;
    margin: 16px 0; color: #2a2a2a; font-size: 12px; font-family: var(--fen);
  }
  .or-divider::before, .or-divider::after {
    content: ''; flex: 1; height: 1px; background: #1a1a1a;
  }

  /* SOCIAL BUTTONS */
  .social-btns { display: flex; gap: 8px; margin-bottom: 20px; }
  .social-login {
    flex: 1; padding: 11px;
    border: 1px solid #1e1e1e; border-radius: var(--r);
    background: #0d0d0d; cursor: pointer;
    transition: all .2s; font-family: var(--font);
    font-size: 13px; color: #444;
    display: flex; align-items: center; justify-content: center; gap: 7px;
  }
  .social-login:hover { border-color: #2a2a2a; color: #888; }
  .social-login i { font-size: 17px; }

  /* TERMS */
  .terms-text { font-size: 11px; color: #2e2e2e; text-align: center; line-height: 1.7; }
  .terms-text a { color: var(--gold); text-decoration: none; opacity: .7; }
  .terms-text a:hover { opacity: 1; }

  /* PANEL SWITCH */
  .form-panel { display: none; }
  .form-panel.on { display: block; }

  /* OTP HEADER */
  .otp-header {
    text-align: center; margin-bottom: 24px;
  }
  .otp-icon-wrap {
    width: 56px; height: 56px;
    background: rgba(201,168,76,0.08);
    border: 1px solid rgba(201,168,76,0.15);
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 24px; color: var(--gold);
    margin: 0 auto 14px;
  }
  .otp-title { font-size: 15px; font-weight: 600; color: #ccc; margin-bottom: 6px; }
  .otp-desc { font-size: 12px; color: #333; line-height: 1.6; }

  /* STAFF SECTION */
  .staff-section {
    margin-top: 24px;
    padding-top: 20px;
    border-top: 1px solid #161616;
  }
  .staff-label {
    text-align: center;
    font-size: 10px; color: #2a2a2a;
    letter-spacing: 2px; text-transform: uppercase;
    font-family: var(--fen);
    margin-bottom: 12px;
  }
  .staff-roles {
    display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px;
  }
  .role-btn {
    display: flex; flex-direction: column; align-items: center; gap: 5px;
    padding: 12px 6px;
    background: transparent; border: 1px solid #1a1a1a;
    border-radius: var(--r); color: #2e2e2e;
    font-family: var(--font); font-size: 11px; font-weight: 500;
    cursor: pointer; transition: all .2s;
  }
  .role-btn i { font-size: 18px; color: #2a2a2a; transition: color .2s; }
  .role-btn:hover { border-color: rgba(201,168,76,0.3); color: #666; }
  .role-btn:hover i { color: var(--gold); }

  /* RESEND */
  .resend-row { text-align: center; margin-bottom: 16px; }
  .resend-row span { font-size: 12px; color: #333; }
  .resend-row a { font-size: 12px; color: var(--gold); text-decoration: none; opacity: .7; }
  .resend-row a:hover { opacity: 1; }

  /* ── GLOBAL MOBILE RESET ── */
  @media (max-width: 768px) {
    * { max-width: 100%; }
    img, video, iframe { max-width: 100% !important; height: auto; }
    table { max-width: 100%; }
  }

  @media (max-width: 480px) {
    .login-card { padding: 36px 24px 28px; border-radius: 16px; }
    .logo-mark { font-size: 44px; }
    .back-link span { display: none; }
    .staff-roles { grid-template-columns: repeat(2, 1fr); }
    .login-card { padding: 28px 16px 24px; margin: 0; }
    .otp-wrap { gap: 5px; }
    .otp-input { font-size: 18px; padding: 10px 0; }
  }
</style>
</head>
<body>

<!-- LANG TOGGLE -->
<button class="lang-btn" onclick="toggleLang()">
  <span class="lang-dot"></span>
  <span id="langLabel">EN</span>
</button>

<!-- BACK LINK -->
<a href="raf_homepage.html" class="back-link">
  <i class="ti ti-arrow-right"></i>
  <span data-ar="التسوق" data-en="Shopping">التسوق</span>
</a>

<!-- MAIN CARD -->
<div class="login-card">

  <!-- LOGO -->
  <div class="logo-wrap">
    <span class="logo-mark">رف</span>
    <span class="logo-sub">RAF Marketplace</span>
  </div>

  <!-- STEP DOTS -->
  <div class="steps">
    <div class="step-dot on" id="dot1"></div>
    <div class="step-dot" id="dot2"></div>
    <span class="step-label" id="step-label">١ / ٢</span>
  </div>

  <!-- ────────── STEP 1 ────────── -->
  <div class="form-panel on" id="step1">

    <div class="form-header">
      <div class="form-title" data-ar="أهلاً بك" data-en="Welcome Back">أهلاً بك</div>
      <div class="form-sub" data-ar="سجّل دخولك أو أنشئ حساباً جديداً" data-en="Sign in or create a new account">سجّل دخولك أو أنشئ حساباً جديداً</div>
    </div>

    <!-- METHOD TABS -->
    <div class="method-tabs">
      <button class="method-tab on" onclick="selectMethod(this,'whatsapp')">
        <i class="ti ti-brand-whatsapp"></i>
        <span data-ar="واتساب" data-en="WhatsApp">واتساب</span>
      </button>
      <button class="method-tab" onclick="selectMethod(this,'email')">
        <i class="ti ti-mail"></i>
        <span data-ar="البريد" data-en="Email">البريد</span>
      </button>
      <button class="method-tab" onclick="selectMethod(this,'sms')">
        <i class="ti ti-device-mobile"></i>
        <span>SMS</span>
      </button>
    </div>

    <!-- WHATSAPP -->
    <div id="method-whatsapp">
      <div class="field">
        <label class="field-label" data-ar="رقم الواتساب" data-en="WhatsApp Number">رقم الواتساب</label>
        <div class="input-wrap">
          <input type="tel" class="field-input" placeholder="XXXXXXXX" style="padding-right:82px;direction:ltr;text-align:right;">
          <span class="input-prefix" style="display:flex;align-items:center;gap:4px;font-size:12px;color:#333;">🇰🇼 +965</span>
        </div>
      </div>
      <button class="btn-main" onclick="goStep2()">
        <i class="ti ti-brand-whatsapp"></i>
        <span data-ar="إرسال رمز واتساب" data-en="Send WhatsApp Code">إرسال رمز واتساب</span>
      </button>
    </div>

    <!-- EMAIL -->
    <div id="method-email" style="display:none;">
      <div class="field">
        <label class="field-label" data-ar="البريد الإلكتروني" data-en="Email Address">البريد الإلكتروني</label>
        <div class="input-wrap">
          <input type="email" class="field-input" placeholder="example@email.com" style="direction:ltr;text-align:right;padding-right:44px;">
          <span class="input-prefix"><i class="ti ti-mail"></i></span>
        </div>
      </div>
      <button class="btn-main" onclick="goStep2()">
        <i class="ti ti-send"></i>
        <span data-ar="إرسال رمز التحقق" data-en="Send Verification Code">إرسال رمز التحقق</span>
      </button>
    </div>

    <!-- SMS -->
    <div id="method-sms" style="display:none;">
      <div class="field">
        <label class="field-label" data-ar="رقم الجوال" data-en="Mobile Number">رقم الجوال</label>
        <div class="input-wrap">
          <input type="tel" class="field-input" placeholder="XXXXXXXX" style="padding-right:82px;direction:ltr;text-align:right;">
          <span class="input-prefix" style="display:flex;align-items:center;gap:4px;font-size:12px;color:#333;">🇰🇼 +965</span>
        </div>
      </div>
      <button class="btn-main" onclick="goStep2()">
        <i class="ti ti-message"></i>
        <span data-ar="إرسال رمز SMS" data-en="Send SMS Code">إرسال رمز SMS</span>
      </button>
    </div>

    <div class="or-divider" data-ar="أو" data-en="or">أو</div>

    <div class="social-btns">
      <button class="social-login">
        <i class="ti ti-brand-google" style="color:#EA4335;"></i>
        Google
      </button>
      <button class="social-login">
        <i class="ti ti-brand-apple" style="color:#888;"></i>
        Apple
      </button>
    </div>

    <div class="terms-text">
      <span data-ar="بالمتابعة أنت توافق على" data-en="By continuing you agree to">بالمتابعة أنت توافق على</span>
      <a href="#" data-ar="الشروط" data-en="Terms">الشروط</a>
      <span data-ar="و" data-en="&amp;"> و </span>
      <a href="#" data-ar="الخصوصية" data-en="Privacy">الخصوصية</a>
    </div>

  </div><!-- /step1 -->

  <!-- ────────── STEP 2 ────────── -->
  <div class="form-panel" id="step2">

    <div class="otp-header">
      <div class="otp-icon-wrap">
        <i class="ti ti-brand-whatsapp" id="otp-icon"></i>
      </div>
      <div class="otp-title" data-ar="أدخل رمز التحقق" data-en="Enter Verification Code">أدخل رمز التحقق</div>
      <div class="otp-desc" id="otp-desc">تم إرسال رمز مكون من 6 أرقام إلى واتساب رقم +965 XXXXXXXX</div>
    </div>

    <div class="field">
      <div class="otp-wrap" style="direction:ltr;">
        <input type="text" class="otp-input" maxlength="1" oninput="moveOtp(this,1)">
        <input type="text" class="otp-input" maxlength="1" oninput="moveOtp(this,2)">
        <input type="text" class="otp-input" maxlength="1" oninput="moveOtp(this,3)">
        <input type="text" class="otp-input" maxlength="1" oninput="moveOtp(this,4)">
        <input type="text" class="otp-input" maxlength="1" oninput="moveOtp(this,5)">
        <input type="text" class="otp-input" maxlength="1" oninput="moveOtp(this,6)">
      </div>
    </div>

    <button class="btn-main" style="margin-top:12px;" onclick="window.location='raf_account.html'">
      <i class="ti ti-check"></i>
      <span data-ar="تأكيد الدخول" data-en="Confirm">تأكيد الدخول</span>
    </button>

    <div class="resend-row">
      <span data-ar="لم يصلك الرمز؟ " data-en="Didn't receive it? ">لم يصلك الرمز؟ </span>
      <a href="#" onclick="return false;" data-ar="إعادة الإرسال (59s)" data-en="Resend (59s)">إعادة الإرسال (59s)</a>
    </div>

    <button class="btn-ghost" onclick="goStep1()">
      <i class="ti ti-arrow-right"></i>
      <span data-ar="تغيير طريقة التحقق" data-en="Change method">تغيير طريقة التحقق</span>
    </button>

  </div><!-- /step2 -->

  <!-- ────────── STAFF ACCESS ────────── -->
  <div class="staff-section">
    <div class="staff-label" data-ar="دخول طاقم العمل" data-en="STAFF ACCESS">دخول طاقم العمل</div>
    <div class="staff-roles">
      <button class="role-btn" onclick="goStaff('merchant')">
        <i class="ti ti-building-store"></i>
        <span data-ar="تاجر" data-en="Merchant">تاجر</span>
      </button>
      <button class="role-btn" onclick="goStaff('driver')">
        <i class="ti ti-motorbike"></i>
        <span data-ar="سائق" data-en="Driver">سائق</span>
      </button>
      <button class="role-btn" onclick="goStaff('supervisor')">
        <i class="ti ti-truck-delivery"></i>
        <span data-ar="مشرف" data-en="Supervisor">مشرف</span>
      </button>
      <button class="role-btn" onclick="goStaff('management')">
        <i class="ti ti-shield"></i>
        <span data-ar="إدارة" data-en="Admin">إدارة</span>
      </button>
    </div>
  </div>

</div><!-- /login-card -->

<script>
  let currentMethod = 'whatsapp';

  function selectMethod(btn, method) {
    document.querySelectorAll('.method-tab').forEach(t => t.classList.remove('on'));
    btn.classList.add('on');
    currentMethod = method;
    ['whatsapp','email','sms'].forEach(m => {
      document.getElementById('method-' + m).style.display = m === method ? 'block' : 'none';
    });
  }

  function goStep2() {
    document.getElementById('step1').classList.remove('on');
    document.getElementById('step2').classList.add('on');
    document.getElementById('dot1').classList.remove('on');
    document.getElementById('dot2').classList.add('on');
    document.getElementById('step-label').textContent = '٢ / ٢';
    const icons = { whatsapp: 'ti-brand-whatsapp', email: 'ti-mail', sms: 'ti-device-mobile' };
    document.getElementById('otp-icon').className = 'ti ' + icons[currentMethod];
    setTimeout(() => document.querySelector('.otp-input').focus(), 50);
  }

  function goStep1() {
    document.getElementById('step2').classList.remove('on');
    document.getElementById('step1').classList.add('on');
    document.getElementById('dot2').classList.remove('on');
    document.getElementById('dot1').classList.add('on');
    document.getElementById('step-label').textContent = '١ / ٢';
  }

  function moveOtp(input, index) {
    if (input.value.length === 1 && index < 6) {
      document.querySelectorAll('.otp-input')[index].focus();
    }
  }

  function goStaff(role) {
    window.location = 'raf_login_staff.html?role=' + role;
  }

  /* LANG TOGGLE */
  function toggleLang() {
    const html = document.getElementById('htmlRoot');
    const isAR = html.lang === 'ar';
    const newLang = isAR ? 'en' : 'ar';
    html.lang = newLang;
    html.dir  = isAR ? 'ltr' : 'rtl';
    document.getElementById('langLabel').textContent = isAR ? 'ع' : 'EN';
    localStorage.setItem('raf_lang', newLang);
    document.querySelectorAll('[data-ar]').forEach(el => {
      const t = el.getAttribute('data-' + newLang);
      if (t) el.textContent = t;
    });
  }
  (function() {
    if (localStorage.getItem('raf_lang') === 'en') {
      const html = document.getElementById('htmlRoot');
      html.lang = 'en'; html.dir = 'ltr';
      document.getElementById('langLabel').textContent = 'ع';
      document.querySelectorAll('[data-en]').forEach(el => { el.textContent = el.getAttribute('data-en'); });
    }
  })();
</script>
</body>
</html>
