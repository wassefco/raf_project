<style>
/* ══════════════════════════════════════════════════════════════════════
   ORDERS — the Logistics orders workspace. Shares the Logistics shell and
   components; what follows is only what this page adds: a working toolbar,
   the scope tabs, the orders table and the inspection sheet.
   ══════════════════════════════════════════════════════════════════════ */

/* the workspace fills the viewport: toolbar pinned, list scrolls */
.wk{ display:flex; flex-direction:column; gap:12px; }
.wk-head{ display:flex; align-items:center; gap:12px; flex-wrap:wrap; }
.wk-head p{ margin:0; color:var(--muted); font-size:13px; flex:1 1 240px; min-width:0; }
.wk-count{ color:var(--faint); font-size:12px; font-weight:700; font-family:'DM Sans',sans-serif; white-space:nowrap; }

/* scope: the authoritative lifecycle split, current work first */
.scopes{ display:flex; gap:2px; padding:3px; background:var(--surface-2); border:1px solid var(--line); border-radius:var(--r); overflow-x:auto; }
.scope{ display:inline-flex; align-items:center; gap:7px; min-height:36px; padding:0 14px; border:0; background:transparent; cursor:pointer;
  border-radius:var(--r-sm); color:var(--muted); font-size:13px; font-weight:700; white-space:nowrap; }
.scope:hover{ color:var(--ink); }
.scope[aria-pressed="true"]{ background:var(--surface); color:var(--ink); box-shadow:var(--shadow); }
.scope .n{ font-family:'DM Sans',sans-serif; font-size:11.5px; color:var(--faint); }
.scope[aria-pressed="true"] .n{ color:var(--accent); }

/* toolbar */
.tools{ display:flex; gap:10px; flex-wrap:wrap; align-items:center; background:var(--surface); border:1px solid var(--line);
  border-radius:var(--r); padding:10px; box-shadow:var(--shadow); }
.srch{ position:relative; flex:1 1 280px; min-width:0; }
.srch > i{ position:absolute; inset-inline-start:11px; top:50%; transform:translateY(-50%); color:var(--faint); font-size:18px; pointer-events:none; }
.srch input{ width:100%; min-height:42px; padding:0 12px; padding-inline-start:38px; padding-inline-end:36px; border:1px solid var(--line-2);
  border-radius:var(--r-sm); background:var(--surface); color:var(--ink); font-size:13.5px; }
.srch input:focus{ outline:2px solid var(--accent); outline-offset:0; border-color:var(--accent); }
.srch .clr{ position:absolute; inset-inline-end:4px; top:50%; transform:translateY(-50%); width:32px; height:32px; border:0; border-radius:var(--r-sm);
  background:transparent; color:var(--faint); cursor:pointer; display:grid; place-items:center; }
.srch .clr:hover{ background:var(--surface-2); color:var(--ink); }
.sel{ min-height:42px; padding:0 10px; border:1px solid var(--line-2); border-radius:var(--r-sm); background:var(--surface); color:var(--ink);
  font-size:13px; font-weight:600; flex:0 1 auto; min-width:0; max-width:100%; }
.sel:focus{ outline:2px solid var(--accent); outline-offset:0; border-color:var(--accent); }
.tools .btn{ min-height:42px; }
/* the Filter button belongs to the search control: one pair, nothing else */
.filter-btn{ flex:0 0 auto; gap:8px; }
.filter-btn.on{ border-color:var(--accent); color:var(--accent-2); background:var(--accent-soft); }
.filter-btn .fcount{ min-width:20px; height:20px; padding:0 6px; border-radius:10px; background:var(--accent); color:#fff;
  font-size:11.5px; font-weight:800; display:inline-grid; place-items:center; font-family:'DM Sans',sans-serif; }

/* filter applet — the same sheet family as the details sheet */
.applet{ width:min(440px,100%); }
.applet .sheet-b{ padding:4px 16px 16px; }
.fld{ padding:12px 0; border-block-end:1px solid var(--line); }
.fld:last-child{ border-block-end:0; }
.fld > label,.fld > .lg{ display:block; font-size:12px; font-weight:800; color:var(--muted); margin-block-end:6px; }
.fld select,.fld input[type="date"]{ width:100%; min-height:44px; padding:0 10px; border:1px solid var(--line-2);
  border-radius:var(--r-sm); background:var(--surface); color:var(--ink); font-size:13.5px; }
.fld select:focus,.fld input:focus{ outline:2px solid var(--accent); outline-offset:0; border-color:var(--accent); }
.fld .two{ display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:10px; }
.sub-f{ display:block; font-size:11.5px; font-weight:700; color:var(--faint); }
.sub-f input{ margin-block-start:5px; }
.sheet-f{ display:flex; gap:10px; padding:12px 16px; border-block-start:1px solid var(--line); background:var(--surface-2); }
.sheet-f .btn{ flex:1 1 auto; min-height:44px; }

/* active filter chips */
.fchips{ display:flex; flex-wrap:wrap; gap:8px; align-items:center; }
.fchip{ display:inline-flex; align-items:center; gap:6px; min-height:30px; padding:0 6px 0 11px; border-radius:999px;
  border:1px solid var(--line-2); background:var(--surface); color:var(--text); font-size:12.5px; font-weight:600; }
[dir="rtl"] .fchip{ padding:0 11px 0 6px; }
.fchip b{ color:var(--ink); font-weight:800; }
.fchip button{ width:22px; height:22px; border:0; border-radius:50%; background:var(--surface-2); color:var(--muted); cursor:pointer;
  display:grid; place-items:center; flex-shrink:0; }
.fchip button:hover{ background:var(--alert-bg); color:var(--alert); }
.fchip button i{ font-size:13px; }

/* the table is the workspace: full-bleed inside its card, sticky header */
.tbl-card{ background:var(--surface); border:1px solid var(--line); border-radius:var(--r-lg); box-shadow:var(--shadow); overflow:hidden; }
.tbl-scroll{ overflow-x:auto; -webkit-overflow-scrolling:touch; }
/* ───────── the orders grid ─────────
   A deliberate, fixed grid: every column keeps its width whatever the content
   is, so headers never drift from their data and rows never jump as orders
   change. Widths are proportional (they hold at any viewport) and weighted by
   how much text each field really carries. Scoped to .ord — the shared
   Logistics stylesheet is untouched. */
table.ord{ width:100%; border-collapse:collapse; table-layout:fixed; min-width:700px; }
table.ord th,table.ord td{ padding:10px 10px; vertical-align:middle; }
table.ord col.o-order { width:12%; }   /* a full RAF-XXXXXXX id, never broken */
table.ord col.o-store { width:10%; }
table.ord col.o-cust  { width:10%; }
table.ord col.o-status{ width:14.5%; } /* the longest operational label lives here */
table.ord col.o-driver{ width:9.5%; }
table.ord col.o-pay   { width:11%; }
table.ord col.o-total { width:7.5%; }
table.ord col.o-time  { width:10.5%; }
table.ord col.o-eta   { width:6.5%; }  /* compact: a time or a dash */
table.ord col.o-act   { width:8.5%; }  /* stable: the button never resizes the grid */

/* semantic alignment — not everything centred */
table.ord .o-order,table.ord .o-store,table.ord .o-cust{ text-align:start; }
table.ord .o-status,table.ord .o-driver,table.ord .o-pay,table.ord .o-time,
table.ord .o-eta,table.ord .o-act{ text-align:center; }
table.ord .o-total{ text-align:end; }

/* wrapping: room where names and labels need it, compact everywhere else */
table.ord .o-store,table.ord .o-cust,table.ord .o-status,table.ord .o-driver{ overflow-wrap:anywhere; }
table.ord .o-order .ord-id{ white-space:nowrap; }
table.ord .o-eta{ white-space:nowrap; }
/* the grid is fixed at every width, so a status label or an amount wraps
   inside its own column instead of pushing past it */
table.ord .badge{ max-width:100%; white-space:normal; overflow-wrap:anywhere; }
table.ord .o-total{ white-space:normal; }
table.ord .o-act .btn{ width:100%; max-width:92px; padding:0 8px; }
/* the two-line Time block stays one centred unit */
table.ord .o-time .nowrap{ display:block; }
table.ord .o-time .sub{ display:block; margin-block-start:1px; }
table.ord th{ position:sticky; top:0; z-index:1; }
table.ord tbody tr{ cursor:pointer; }
table.ord tbody tr:focus-visible{ outline:2px solid var(--accent); outline-offset:-2px; }
td.num{ font-family:'DM Sans',sans-serif; font-weight:700; white-space:nowrap; }
.ord-id{ display:inline-flex; align-items:center; gap:7px; font-family:'DM Sans',ui-monospace,monospace; font-size:12.5px; font-weight:700; color:var(--ink); }
.ord-id .live{ width:6px; height:6px; border-radius:50%; background:var(--accent); flex-shrink:0; }
.cust{ display:block; max-width:190px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.tkt-flag{ display:inline-flex; align-items:center; gap:4px; color:var(--pend); font-size:11.5px; font-weight:700; }

/* details sheet */
.sheet{ position:fixed; inset:0; z-index:90; background:rgba(12,20,17,.42); display:flex; justify-content:flex-end; }
.sheet-c{ width:min(560px,100%); height:100%; background:var(--surface); display:flex; flex-direction:column; box-shadow:var(--shadow-pop); }
.sheet-h{ display:flex; align-items:center; gap:10px; padding:12px 16px; border-block-end:1px solid var(--line); background:var(--surface-2); }
.sheet-h .t{ flex:1; min-width:0; }
.sheet-h .t b{ display:block; color:var(--ink); font-size:14.5px; font-family:'DM Sans',sans-serif; }
.sheet-h .t span{ display:block; color:var(--muted); font-size:12px; }
.sheet-b{ flex:1; overflow-y:auto; padding:0 0 20px; }
.sec{ padding:14px 16px; border-block-end:1px solid var(--line); }
.sec:last-child{ border-block-end:0; }
.sec > h3{ margin:0 0 10px; font-size:11px; font-weight:800; letter-spacing:.08em; text-transform:uppercase; color:var(--faint);
  display:flex; align-items:center; gap:7px; }
.sec > h3 i{ font-size:15px; color:var(--accent); letter-spacing:0; }
.kv{ display:flex; gap:12px; padding:5px 0; font-size:13px; align-items:baseline; }
.kv .k{ color:var(--muted); flex:0 0 40%; max-width:40%; }
.kv .v{ color:var(--ink); font-weight:600; min-width:0; overflow-wrap:anywhere; }
.lines{ list-style:none; margin:0; padding:0; }
.lines li{ display:flex; gap:10px; align-items:baseline; padding:7px 0; border-block-end:1px dashed var(--line); font-size:13px; }
.lines li:last-child{ border-block-end:0; }
.lines .q{ color:var(--faint); font-family:'DM Sans',sans-serif; font-weight:700; flex-shrink:0; }
.lines .nm{ flex:1; min-width:0; color:var(--ink); overflow-wrap:anywhere; }
.lines .pr{ color:var(--muted); font-family:'DM Sans',sans-serif; white-space:nowrap; }
.lines .sub{ display:block; color:var(--faint); font-size:11.5px; margin-block-start:2px; overflow-wrap:anywhere; }
.ms{ list-style:none; margin:0; padding:0; }
.ms li{ display:flex; gap:10px; align-items:baseline; padding:6px 0; font-size:12.5px; }
.ms .k{ flex:1; color:var(--muted); }
.ms .v{ color:var(--ink); font-weight:600; font-family:'DM Sans',sans-serif; white-space:nowrap; }
.ms .v.na{ color:var(--faint); font-weight:500; font-family:var(--font); }

/* the Audit entry point: secondary, set apart from the order's own information */
.sheet-extra{ padding:14px 16px 4px; display:flex; flex-direction:column; gap:7px; align-items:flex-start; border-block-start:1px solid var(--line); }
.audit-btn{ min-height:40px; color:var(--muted); }
.audit-btn:hover{ color:var(--ink); border-color:var(--line-2); }
.sheet-extra .hint{ font-size:11.5px; color:var(--faint); line-height:1.6; }

/* audit layer — a dense technical record, visibly not the operational view */
.audit{ list-style:none; margin:0; padding:0; }
.audit li{ display:flex; gap:10px; align-items:flex-start; padding:10px 0; border-block-end:1px solid var(--line); }
.audit li:last-child{ border-block-end:0; }
.audit .ai{ width:26px; height:26px; border-radius:var(--r-sm); background:var(--surface-2); color:var(--muted);
  display:grid; place-items:center; flex-shrink:0; }
.audit .ai i{ font-size:14px; }
.audit .ab{ flex:1; min-width:0; }
.audit .ab b{ display:block; font-size:13px; color:var(--ink); font-weight:700; }
.audit .act{ display:block; margin-block-start:2px; }
.audit .act code{ font-family:'DM Sans',ui-monospace,monospace; font-size:11px; color:var(--accent-2);
  background:var(--accent-soft); border-radius:4px; padding:1px 6px; overflow-wrap:anywhere; }
.audit .who{ display:block; font-size:11.5px; color:var(--muted); margin-block-start:3px; overflow-wrap:anywhere; }
.audit .md{ display:block; font-size:11px; color:var(--faint); margin-block-start:3px; line-height:1.7; overflow-wrap:anywhere; }
.audit .md .sep{ margin-inline:5px; opacity:.6; }
.audit .aw{ font-size:11px; color:var(--faint); font-family:'DM Sans',sans-serif; white-space:nowrap; flex-shrink:0; }

/* laptop: the eight columns tighten so the workspace fits beside the sidebar
   without a sideways scroll — the long labels wrap instead */
@media (max-width:1400px){
  table.ord th,table.ord td{ padding:9px 8px; }
  table.ord th{ white-space:normal; }
  .cust{ max-width:104px; }
  table.ord td.num{ white-space:normal; }
  table.ord .ord-id{ font-size:12px; }
}
/* 1024-class laptops: the same ten columns, a notch tighter, so nothing is cut
   off and the grid still fits beside the sidebar without a sideways scroll */
@media (max-width:1100px){
  table.ord th,table.ord td{ padding:9px 6px; }
  table.ord .ord-id{ font-size:11px; gap:5px; }
  table.ord .badge{ font-size:11px; padding:3px 7px; }
  table.ord .o-act .btn{ padding:0 6px; }
  table.ord .o-act .btn i{ display:none; }   /* the label alone is clear here */
  html[lang="en"] table.ord th{ font-size:10px; letter-spacing:.02em; }
  html[lang="en"] .cust{ max-width:88px; }
}
@media (max-width:900px){
  .tools{ padding:8px; }
  .sel{ flex:1 1 140px; }
}
/* the table becomes one card per order */
@media (max-width:860px){
  /* the card presentation is unchanged: the desktop grid, its fixed layout and
     its column alignment all stop applying here */
  table.ord{ min-width:0; table-layout:auto; }
  table.ord colgroup{ display:none; }
  table.ord td[class*="o-"]{ text-align:start; }
  table.ord .o-total{ text-align:start; }
  table.ord .o-act .btn{ width:auto; max-width:none; }
  table.ord .o-time .nowrap,table.ord .o-time .sub{ display:inline; }
  table.ord, table.ord tbody, table.ord tr, table.ord td{ display:block; width:100%; }
  table.ord thead{ position:absolute; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; border:0; }
  table.ord tbody tr{ border-block-end:1px solid var(--line); padding:8px 0; }
  table.ord tbody tr:last-child{ border-block-end:0; }
  table.ord td{ border:0; display:flex; align-items:center; gap:12px; padding:5px 14px; }
  table.ord td::before{ content:attr(data-l); flex:0 0 38%; max-width:38%; color:var(--faint); font-size:11.5px; font-weight:700; }
  table.ord td > *{ min-width:0; }
  table.ord td .badge{ white-space:normal; }
  .cust{ max-width:none; white-space:normal; }
  .sheet-c{ width:100%; }
  .kv .k{ flex-basis:44%; max-width:44%; }
  /* a long status label wraps inside the pair instead of being cut off */
  .kv .badge{ white-space:normal; }
}
@media (max-width:520px){
  .scope{ padding:0 10px; font-size:12.5px; }
  .tools .btn{ flex:1 1 auto; }
}
</style>
</head>

<script>
/* ============================================================================
   ORDERS — الطلبات
   The Logistics orders workspace: find an order, read its operational state,
   inspect it. It is a VIEW — it writes no order, no ticket, no audit event and
   keeps no storage of its own. Every value comes from the authority that owns
   it (RAFShop.Orders, RAFOrderSnapshot, RAFOrderEngine, RAFSource,
   RAFCustomerService, RAFAudit, RAFPerm); a value that does not exist is shown
   as "—" rather than computed, guessed or filled in.

   Unlike the Command Center this page deliberately reaches the whole order
   history; the scope tabs keep current work first without hiding the rest.
   ==========================================================================*/
(function(){
  'use strict';

  var E = window.RAFOrderEngine, P = window.RAFPerm, CS = window.RAFCustomerService;
  var ME = null, CAN = { tickets:false, audit:false };

  /* the Command Center's access boundary, unchanged: existing keys only, which
     today is exactly Super Admin, Higher Management and Operations Manager.
     RAF still has no dedicated logistics permission key. */
  var PERM = { orders:'orders.view', drivers:'drivers.view', ops:'drivers.suspend' };

  function root(){ return document.getElementById('htmlRoot'); }
  function isEn(){ return root().lang === 'en'; }
  function T(ar,en){ return isEn() ? en : ar; }
  function L(o){ return (o && typeof o === 'object') ? (isEn() ? (o.en||o.ar) : (o.ar||o.en)) : (o||''); }
  function el(id){ return document.getElementById(id); }
  function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
  function locale(){ return isEn() ? 'en-GB' : 'ar-KW-u-nu-latn'; }
  var DASH = '<span class="dash">—</span>';
  function bidi(v){ return (v == null || v === '') ? DASH : '<bdi>' + esc(v) + '</bdi>'; }

  function clockOf(ms){
    if(!ms && ms !== 0) return null;
    var d = new Date(ms); if(isNaN(d.getTime())) return null;
    try { return d.toLocaleString(locale(), { day:'2-digit', month:'short', year:'numeric', hour:'2-digit', minute:'2-digit', timeZone:'Asia/Kuwait' }); }
    catch(e){ return d.toISOString().slice(0,16).replace('T',' '); }
  }
  function shortClock(ms){
    if(!ms && ms !== 0) return null;
    var d = new Date(ms); if(isNaN(d.getTime())) return null;
    try { return d.toLocaleString(locale(), { day:'2-digit', month:'short', hour:'2-digit', minute:'2-digit', timeZone:'Asia/Kuwait' }); }
    catch(e){ return d.toISOString().slice(0,16).replace('T',' '); }
  }
  function mins(ms){
    var m = Math.max(0, Math.round(ms/60000));
    if(m < 60) return T(m + ' د', m + 'm');
    var h = Math.floor(m/60), r = m%60;
    if(h < 48) return T(h + ' س ' + r + ' د', h + 'h ' + r + 'm');
    return T(Math.floor(h/24) + ' ي', Math.floor(h/24) + 'd');
  }
  function ago(ms){ return ms ? T('منذ ' + mins(Date.now()-ms), mins(Date.now()-ms) + ' ago') : null; }

  /* ───────── the read model ─────────
     One pass over the orders the authorities already hold. Nothing is stored;
     every render re-reads. */
  var ROWS = [];
  function readAll(){
    var orders = [];
    try { orders = (window.RAFShop && RAFShop.Orders ? RAFShop.Orders.all() : []) || []; } catch(e){ orders = []; }
    ROWS = orders.map(function(o){
      var snap = null;
      try { snap = window.RAFOrderSnapshot ? RAFOrderSnapshot.of(o.id) : null; } catch(e){ snap = null; }
      var f = (snap && snap.fulfilment) || {};
      var c = (snap && snap.commercial) || {};
      var m = null; try { m = E ? E.mstate(o.id) : null; } catch(e){ m = null; }
      var accepted = null, ready = null;
      try {
        var ma = E ? E.acceptedAt(o.id) : null, mr = E ? E.readyAt(o.id) : null;
        accepted = ma && ma.at ? ma.at : null; ready = mr && mr.at ? mr.at : null;
      } catch(e){}
      /* the canonical store record, by the snapshot's slug */
      var store = null;
      if(snap && snap.storeSlug){
        var s = null; try { s = window.RAFSource ? RAFSource.store(snap.storeSlug) : null; } catch(e){ s = null; }
        store = s && s.name ? { ar:s.name.ar, en:s.name.en } : { ar:snap.storeNameAr, en:snap.storeNameEn };
      } else if(o.store) store = o.store;
      return {
        id:o.id, status:o.status, mstate:m, snap:snap,
        store:store, storeSlug:(snap && snap.storeSlug) || null,
        customerId:(snap && snap.customer) ? snap.customer.id : null,
        customerName:(snap && snap.customer) ? snap.customer.name : null,
        placedAt:snap ? snap.checkoutAt : null,
        acceptedAt:accepted, readyAt:ready,
        driverId:f.driverId || null, pickedUpAt:f.pickedUpAt || null, deliveredAt:f.deliveredAt || null,
        payStatus:c.paymentStatus || null, payMethod:c.paymentMethod || null,
        total:c.grandTotal != null ? c.grandTotal : (o.total != null ? o.total : null),
        currency:c.currency || null
      };
    });
    return ROWS;
  }

  /* ───────── operational state ─────────
     A DISPLAY reading of facts the authorities already hold: the order status,
     the merchant state (RAFOrderEngine) and the snapshot's fulfilment record.
     This page defines no state and writes none. */
  function stateOf(r){
    if(r.status === 'cancelled') return { k:'cancelled', ar:'ملغى', en:'Cancelled', cls:'b-off' };
    if(r.status === 'delivered' || r.deliveredAt) return { k:'delivered', ar:'تم التسليم', en:'Delivered', cls:'b-done' };
    if(r.pickedUpAt) return { k:'on_the_way', ar:'في الطريق', en:'On the way', cls:'b-go' };
    if(r.driverId)   return { k:'assigned', ar:'تم تعيين السائق', en:'Assigned', cls:'b-go' };
    if(r.mstate === 'ready' || r.mstate === 'waiting_driver')
      return { k:'unassigned', ar:'بانتظار تعيين سائق', en:'Waiting for Driver Assignment', cls:'b-wait' };
    if(r.mstate === 'preparing' || r.mstate === 'accepted')
      return { k:'preparing', ar:'قيد التجهيز في المتجر', en:'Preparing at the store', cls:'b-prep' };
    if(r.mstate === 'pending')
      return { k:'pending', ar:'بانتظار قبول المتجر', en:'Awaiting merchant acceptance', cls:'b-prep' };
    if(r.mstate === 'rejected') return { k:'rejected', ar:'رفضه المتجر', en:'Rejected by the store', cls:'b-off' };
    return { k:'none', ar:'—', en:'—', cls:'b-plain' };
  }
  var LIVE_MSTATE = { pending:1, accepted:1, preparing:1, ready:1, waiting_driver:1 };
  /* active = still moving through the lifecycle the authorities track */
  function isActive(r){
    if(r.status !== 'progress') return false;
    if(r.driverId || r.pickedUpAt) return true;
    return !!LIVE_MSTATE[r.mstate];
  }
  /* the newest authoritative moment on the record — used for sorting and the Time column */
  function lastAt(r){ return r.deliveredAt || r.pickedUpAt || r.readyAt || r.acceptedAt || r.placedAt || null; }

  /* RAFOrderSnapshot's own DELIVERY values, shown in words rather than as the
     stored identifier */
  function deliveryType(v){
    var S = window.RAFOrderSnapshot, D = (S && S.DELIVERY) || { DELIVERY:'delivery', PICKUP:'pickup' };
    if(v === D.DELIVERY) return T('توصيل','Delivery');
    if(v === D.PICKUP)   return T('استلام من المتجر','Pickup from the store');
    return v ? '<bdi>' + esc(v) + '</bdi>' : DASH;
  }

  /* payment — RAFOrderSnapshot's own PAY_STATUS values, never invented */
  var PAY = {
    paid:     { ar:'مدفوع',  en:'Paid',     cls:'b-done' },
    pending:  { ar:'معلّق',  en:'Pending',  cls:'b-wait' },
    cod:      { ar:'عند الاستلام', en:'Cash on delivery', cls:'b-prep' },
    refunded: { ar:'مسترد',  en:'Refunded', cls:'b-off' }
  };

  /* ───────── scopes: current work first, history always reachable ───────── */
  var SCOPES = [
    { k:'active',    ar:'الحالية',   en:'Current',   emptyAr:'لا توجد طلبات حالية',  emptyEn:'No current orders',   test:function(r){ return isActive(r); } },
    { k:'delivered', ar:'المكتملة',  en:'Completed', emptyAr:'لا توجد طلبات مكتملة', emptyEn:'No completed orders', test:function(r){ return stateOf(r).k === 'delivered'; } },
    { k:'cancelled', ar:'الملغاة',   en:'Cancelled', emptyAr:'لا توجد طلبات ملغاة',  emptyEn:'No cancelled orders', test:function(r){ return r.status === 'cancelled' || stateOf(r).k === 'rejected'; } },
    { k:'all',       ar:'الكل',      en:'All',       emptyAr:'لا توجد طلبات',        emptyEn:'No orders',           test:function(){ return true; } }
  ];
  var F = { scope:'active', q:'', state:'', store:'', pay:'', from:'', to:'' };

  function scopeOf(k){ for(var i=0;i<SCOPES.length;i++) if(SCOPES[i].k === k) return SCOPES[i]; return SCOPES[0]; }
  function matchesFilters(r){
    if(F.state && stateOf(r).k !== F.state) return false;
    if(F.store && r.storeSlug !== F.store) return false;
    if(F.pay && (r.payStatus || '') !== F.pay) return false;
    var at = r.placedAt;
    if(F.from){ var fromMs = Date.parse(F.from + 'T00:00:00'); if(!at || isNaN(fromMs) || at < fromMs) return false; }
    if(F.to){ var toMs = Date.parse(F.to + 'T23:59:59'); if(!at || isNaN(toMs) || at > toMs) return false; }
    if(F.q){
      var q = F.q.trim().toLowerCase();
      if(q){
        var hay = [r.id, L(r.store), r.store && r.store.ar, r.store && r.store.en, r.customerName]
          .filter(Boolean).join(' ').toLowerCase();
        if(hay.indexOf(q) < 0) return false;
      }
    }
    return true;
  }
  function visibleRows(){
    var sc = scopeOf(F.scope);
    return ROWS.filter(function(r){ return sc.test(r) && matchesFilters(r); })
               .sort(function(a,b){ return (lastAt(b)||0) - (lastAt(a)||0); });   /* newest activity first */
  }
  function filtersActive(){ return !!(F.q || F.state || F.store || F.pay || F.from || F.to); }

  /* ───────── toolbar ───────── */
  function storeOptions(){
    var seen = {}, out = [];
    ROWS.forEach(function(r){
      if(!r.storeSlug || seen[r.storeSlug]) return;
      seen[r.storeSlug] = 1; out.push({ slug:r.storeSlug, name:L(r.store) || r.storeSlug });
    });
    return out.sort(function(a,b){ return String(a.name).localeCompare(String(b.name)); });
  }
  function stateOptions(){
    var seen = {}, out = [];
    ROWS.forEach(function(r){ var s = stateOf(r); if(s.k === 'none' || seen[s.k]) return; seen[s.k] = 1; out.push(s); });
    return out;
  }
  function payOptions(){
    var seen = {}, out = [];
    ROWS.forEach(function(r){ var p = r.payStatus; if(!p || seen[p] || !PAY[p]) return; seen[p] = 1; out.push(p); });
    return out;
  }
  /* THE LOGISTICS FILTER PATTERN — search + one Filter button that opens one
     applet. No dropdown ever returns to the toolbar: every page in this
     workspace uses this same control, so the page itself stays clean. */
  function toolbar(){
    var n = activeFilterCount();
    return '<div class="tools" role="search">'
      + '<div class="srch"><i class="ti ti-search" aria-hidden="true"></i>'
      + '<input id="q" type="search" value="' + esc(F.q) + '" autocomplete="off" spellcheck="false"'
      + ' placeholder="' + esc(T('ابحث عن رقم الطلب أو المتجر أو العميل...','Search order ID, store or customer...')) + '"'
      + ' aria-label="' + esc(T('بحث في الطلبات','Search orders')) + '" oninput="OPS.setQ(this.value)">'
      + (F.q ? '<button class="clr" type="button" onclick="OPS.setQ(\'\')" aria-label="' + esc(T('مسح البحث','Clear search')) + '"><i class="ti ti-x" aria-hidden="true"></i></button>' : '')
      + '</div>'
      + '<button class="btn filter-btn' + (n ? ' on' : '') + '" type="button" id="filterBtn" onclick="OPS.openFilters()"'
      + ' aria-haspopup="dialog" aria-label="' + esc(T('تصفية الطلبات','Filter orders')) + '">'
      + '<i class="ti ti-filter" aria-hidden="true"></i>' + T('فلتر','Filter')
      + (n ? '<span class="fcount">' + n + '</span>' : '') + '</button>'
      + '</div>';
  }
  /* ───────── the filter applet ─────────
     One dialog holding every supported Orders filter. It edits a DRAFT copy;
     the list changes only on Apply, so nothing shifts under the operator while
     they are choosing. It reads no authority and writes no record. */
  var DRAFT = null, filterTrigger = null;
  function activeFilterCount(){
    var n = 0;
    if(F.state) n++; if(F.store) n++; if(F.pay) n++; if(F.from) n++; if(F.to) n++;
    return n;
  }
  function openFilters(){
    if(!ME) return;
    filterTrigger = document.activeElement;
    DRAFT = { state:F.state, store:F.store, pay:F.pay, from:F.from, to:F.to };
    renderApplet();
  }
  function closeFilters(){
    DRAFT = null; el('appletHost').innerHTML = '';
    var b = el('filterBtn'); if(b) b.focus(); filterTrigger = null;
  }
  function renderApplet(){
    if(!DRAFT) return;
    var stOpts = stateOptions().map(function(s){
      return '<option value="' + esc(s.k) + '"' + (DRAFT.state === s.k ? ' selected' : '') + '>' + T(s.ar,s.en) + '</option>'; }).join('');
    var stOpts2 = storeOptions().map(function(s){
      return '<option value="' + esc(s.slug) + '"' + (DRAFT.store === s.slug ? ' selected' : '') + '>' + esc(s.name) + '</option>'; }).join('');
    var pyOpts = payOptions().map(function(p){
      return '<option value="' + esc(p) + '"' + (DRAFT.pay === p ? ' selected' : '') + '>' + T(PAY[p].ar, PAY[p].en) + '</option>'; }).join('');
    el('appletHost').innerHTML =
      '<div class="sheet" id="applet" onclick="if(event.target===this)OPS.closeFilters()">'
      + '<div class="sheet-c applet" role="dialog" aria-modal="true" aria-labelledby="flT">'
      + '<div class="sheet-h"><div class="t"><b id="flT">' + T('تصفية الطلبات','Filter Orders') + '</b>'
        + '<span>' + T('تُطبَّق على النطاق المحدد','Applied within the selected scope') + '</span></div>'
        + '<button class="ibtn" type="button" onclick="OPS.closeFilters()" aria-label="' + esc(T('إغلاق','Close')) + '"><i class="ti ti-x" aria-hidden="true"></i></button></div>'
      + '<div class="sheet-b">'
        + '<div class="fld"><label for="f-state">' + T('الحالة','Status') + '</label>'
          + '<select id="f-state" onchange="OPS.draft(\'state\',this.value)"><option value="">' + T('كل الحالات','All statuses') + '</option>' + stOpts + '</select></div>'
        + '<div class="fld"><label for="f-store">' + T('المتجر','Store') + '</label>'
          + '<select id="f-store" onchange="OPS.draft(\'store\',this.value)"><option value="">' + T('كل المتاجر','All stores') + '</option>' + stOpts2 + '</select></div>'
        + (pyOpts ? '<div class="fld"><label for="f-pay">' + T('الدفع','Payment') + '</label>'
          + '<select id="f-pay" onchange="OPS.draft(\'pay\',this.value)"><option value="">' + T('كل حالات الدفع','All payment states') + '</option>' + pyOpts + '</select></div>' : '')
        + '<div class="fld"><span class="lg">' + T('التاريخ','Date') + '</span><div class="two">'
          + '<label class="sub-f" for="f-from">' + T('من تاريخ','From date')
            + '<input id="f-from" type="date" dir="ltr" value="' + esc(DRAFT.from) + '" onchange="OPS.draft(\'from\',this.value)"></label>'
          + '<label class="sub-f" for="f-to">' + T('إلى تاريخ','To date')
            + '<input id="f-to" type="date" dir="ltr" value="' + esc(DRAFT.to) + '" onchange="OPS.draft(\'to\',this.value)"></label>'
          + '</div></div>'
      + '</div>'
      + '<div class="sheet-f">'
        + '<button class="btn" type="button" onclick="OPS.clearFilters()"><i class="ti ti-filter-off" aria-hidden="true"></i>' + T('مسح الفلاتر','Clear Filters') + '</button>'
        + '<button class="btn pri" type="button" id="applyBtn" onclick="OPS.applyFilters()"><i class="ti ti-check" aria-hidden="true"></i>' + T('تطبيق','Apply') + '</button>'
      + '</div></div></div>';
    var first = el('f-state'); if(first) first.focus();
  }

  function chips(){
    if(!filtersActive()) return '';
    var out = [];
    function chip(key, label, value){
      out.push('<span class="fchip">' + esc(label) + ': <b><bdi>' + esc(value) + '</bdi></b>'
        + '<button type="button" onclick="OPS.setF(\'' + key + '\',\'\')" aria-label="' + esc(T('إزالة الفلتر','Remove filter')) + '">'
        + '<i class="ti ti-x" aria-hidden="true"></i></button></span>');
    }
    if(F.q) chip('q', T('بحث','Search'), F.q);
    if(F.state){ var s = stateOptions().filter(function(x){ return x.k === F.state; })[0]; chip('state', T('الحالة','Status'), s ? T(s.ar,s.en) : F.state); }
    if(F.store){ var st = storeOptions().filter(function(x){ return x.slug === F.store; })[0]; chip('store', T('المتجر','Store'), st ? st.name : F.store); }
    if(F.pay) chip('pay', T('الدفع','Payment'), PAY[F.pay] ? T(PAY[F.pay].ar, PAY[F.pay].en) : F.pay);
    if(F.from) chip('from', T('من','From'), F.from);
    if(F.to) chip('to', T('إلى','To'), F.to);
    return '<div class="fchips">' + out.join('') + '</div>';
  }

  /* ───────── the list ───────── */
  function customerCell(r){
    /* the snapshot's customer name is the operational identifier; nothing more
       of the customer record is read or shown on this page */
    if(!CAN.customer) return '<span class="dash" title="' + esc(T('غير مصرّح','Not authorised')) + '">—</span>';
    return r.customerName ? '<span class="cust"><bdi>' + esc(r.customerName) + '</bdi></span>' : DASH;
  }
  /* ───────── driver ─────────
     ONLY a real assignment record. The delivery system that used to write
     `fulfilment.driverId` was decommissioned, so today this is always empty and
     the cell reads "—" — the Status column already says the order is waiting
     for driver assignment, so the cell never repeats it. When the rebuilt
     delivery authority starts writing an assignment, the name appears here with
     no further change. Only the display name is ever shown: no phone, no
     account id, no other field of the driver's account. */
  function driverCell(r){
    if(!r.driverId) return DASH;
    var u = null; try { u = P.getUser(r.driverId); } catch(e){ u = null; }
    var name = u && u.name ? u.name : null;
    return name ? '<bdi>' + esc(name) + '</bdi>' : DASH;
  }

  /* ───────── delivery ETA ─────────
     The operational arrival estimate of a delivery — NOT the merchant's
     Promised ETA (RAFOrderEngine.promisedEtaAt), which is the order promise
     recorded at acceptance and means something else entirely.

     RAF exposes no authoritative delivery ETA today: the field belongs to the
     delivery record, and that system is being rebuilt. So this reads the
     authoritative record and, finding nothing, shows "—". Nothing is estimated
     here from order age, the promise, a fixed duration, distance or location. */
  function deliveryEtaOf(r){
    var f = (r.snap && r.snap.fulfilment) || {};
    var at = f.etaAt != null ? f.etaAt : null;     /* written by the future delivery authority */
    return (typeof at === 'number' && isFinite(at)) ? at : null;
  }
  function etaCell(r){
    var at = deliveryEtaOf(r);
    if(at == null) return DASH;
    var t = shortClock(at);
    return t ? '<span class="nowrap"><bdi>' + esc(t) + '</bdi></span>' : DASH;
  }

  function totalCell(r){
    if(r.total == null || r.total === '') return DASH;
    var cur = r.currency ? T(r.currency === 'KWD' ? 'د.ك' : r.currency, r.currency) : '';
    return '<bdi>' + esc(r.total) + '</bdi>' + (cur ? ' <span class="dash">' + esc(cur) + '</span>' : '');
  }
  function rows(list){
    var H = [T('الطلب','Order'), T('المتجر','Store'), T('العميل','Customer'), T('الحالة','Status'),
             T('السائق','Driver'), T('الدفع','Payment'), T('الإجمالي','Total'), T('الوقت','Time'),
             T('ETA','ETA'), T('الإجراء','Action')];
    /* one grid definition drives both the header and every row */
    var COLS = ['o-order','o-store','o-cust','o-status','o-driver','o-pay','o-total','o-time','o-eta','o-act'];
    return '<div class="tbl-scroll"><table class="ord"><caption class="sr-only">' + T('الطلبات','Orders') + '</caption>'
      + '<colgroup>' + COLS.map(function(c){ return '<col class="' + c + '">'; }).join('') + '</colgroup>'
      + '<thead><tr>'
      + H.map(function(h,i){ return '<th scope="col" class="' + COLS[i] + '">' + h + '</th>'; }).join('') + '</tr></thead><tbody>'
      + list.map(function(r){
          var st = stateOf(r), pay = r.payStatus && PAY[r.payStatus] ? PAY[r.payStatus] : null;
          var at = lastAt(r), tkt = TKT[r.id];
          return '<tr tabindex="0" onclick="OPS.open(\'' + esc(r.id) + '\')" onkeydown="if(event.key===\'Enter\'||event.key===\' \'){event.preventDefault();OPS.open(\'' + esc(r.id) + '\');}">'
            + '<td class="o-order" data-l="' + esc(H[0]) + '"><span class="ord-id">' + (isActive(r) ? '<span class="live" aria-hidden="true"></span>' : '')
              + '<bdi>' + esc(r.id) + '</bdi></span>'
              + (tkt ? '<span class="tkt-flag"><i class="ti ti-ticket" aria-hidden="true"></i>' + T(tkt + ' تذكرة', tkt + ' ticket(s)') + '</span>' : '') + '</td>'
            + '<td class="o-store" data-l="' + esc(H[1]) + '">' + (r.store ? bidi(L(r.store)) : DASH) + '</td>'
            + '<td class="o-cust" data-l="' + esc(H[2]) + '">' + customerCell(r) + '</td>'
            + '<td class="o-status" data-l="' + esc(H[3]) + '">' + (st.k === 'none' ? DASH : '<span class="badge ' + st.cls + '">' + T(st.ar,st.en) + '</span>') + '</td>'
            + '<td class="o-driver" data-l="' + esc(H[4]) + '">' + driverCell(r) + '</td>'
            + '<td class="o-pay" data-l="' + esc(H[5]) + '">' + (pay ? '<span class="badge ' + pay.cls + '">' + T(pay.ar,pay.en) + '</span>' : DASH) + '</td>'
            + '<td class="num o-total" data-l="' + esc(H[6]) + '">' + totalCell(r) + '</td>'
            + '<td class="o-time" data-l="' + esc(H[7]) + '">' + (at ? '<span class="nowrap">' + esc(ago(at)) + '</span><span class="sub">' + esc(shortClock(at)) + '</span>' : DASH) + '</td>'
            + '<td class="o-eta" data-l="' + esc(H[8]) + '">' + etaCell(r) + '</td>'
            + '<td class="o-act" data-l="' + esc(H[9]) + '"><button class="btn sm" type="button" onclick="event.stopPropagation();OPS.open(\'' + esc(r.id) + '\')">'
              + '<i class="ti ti-eye" aria-hidden="true"></i>' + T('عرض','View') + '</button></td>'
            + '</tr>';
        }).join('')
      + '</tbody></table></div>';
  }

  /* related central tickets, counted per order by the ticket authority itself */
  var TKT = {};
  function readTickets(){
    TKT = {};
    if(!CAN.tickets || !CS) return;
    try {
      var r = CS.listTickets({ active:true });
      if(r && r.ok) (r.items || []).forEach(function(t){
        var oid = t.context && t.context.orderId;
        if(oid) TKT[oid] = (TKT[oid] || 0) + 1;
      });
    } catch(e){ TKT = {}; }
  }

  function render(){
    renderHeader(); renderNav();
    var list = visibleRows(), total = ROWS.length;
    var body = list.length
      ? rows(list)
      : '<div class="empty"><i class="ti ti-package-off" aria-hidden="true"></i><b>'
        /* a filtered-out list and an empty scope are different facts */
        + (filtersActive()
            ? T('لا توجد طلبات مطابقة للفلاتر الحالية','No orders match the current filters')
            : T(scopeOf(F.scope).emptyAr, scopeOf(F.scope).emptyEn))
        + '</b>' + (filtersActive() ? '<button class="btn sm" type="button" onclick="OPS.clearFilters()">'
            + T('مسح الفلاتر','Clear Filters') + '</button>' : '') + '</div>';
    el('view').innerHTML =
      '<h1 class="sr-only">' + T('الطلبات','Orders') + '</h1>'
      + '<div class="wk">'
      + '<div class="wk-head"><p>' + T('عرض ومتابعة الطلبات ضمن العمليات التشغيلية.','View and monitor orders within operations.') + '</p>'
      + '<span class="wk-count">' + T(list.length + ' من ' + total + ' طلب', list.length + ' of ' + total + ' orders') + '</span></div>'
      + '<div class="scopes" role="group" aria-label="' + esc(T('نطاق الطلبات','Order scope')) + '">'
      + SCOPES.map(function(s){
          var n = ROWS.filter(s.test).length;
          return '<button class="scope" type="button" aria-pressed="' + (F.scope === s.k) + '" onclick="OPS.setScope(\'' + s.k + '\')">'
            + T(s.ar,s.en) + '<span class="n">' + n + '</span></button>'; }).join('')
      + '</div>'
      + toolbar() + chips()
      + '<div class="tbl-card">' + body + '</div>'
      + '</div>';
    if(OPEN) renderSheet();
  }

  /* ───────── inspection sheet ───────── */
  var OPEN = null, openTrigger = null, AUDIT = null;
  function sec(title, icon, inner){
    return '<section class="sec"><h3><i class="ti ' + icon + '" aria-hidden="true"></i>' + esc(title) + '</h3>' + inner + '</section>';
  }
  function kv(k, v){ return '<div class="kv"><span class="k">' + esc(k) + '</span><span class="v">' + v + '</span></div>'; }

  function sheetBody(r){
    var st = stateOf(r), snap = r.snap, c = (snap && snap.commercial) || {}, cust = (snap && snap.customer) || {};
    var pay = r.payStatus && PAY[r.payStatus] ? PAY[r.payStatus] : null;
    var h = '';

    /* order */
    h += sec(T('الطلب','Order'), 'ti-receipt',
        kv(T('رقم الطلب','Order ID'), '<bdi>' + esc(r.id) + '</bdi>')
      + kv(T('الحالة','Status'), st.k === 'none' ? DASH : '<span class="badge ' + st.cls + '">' + T(st.ar,st.en) + '</span>')
      /* the same authoritative reads as the list: no assignment record and no
         delivery ETA exist today, so both read "—" rather than being invented */
      + kv(T('السائق','Driver'), driverCell(r))
      + kv(T('ETA','ETA'), etaCell(r))
      + kv(T('وقت الإنشاء','Created'), r.placedAt ? '<bdi>' + esc(clockOf(r.placedAt)) + '</bdi>' : DASH)
      + (snap && snap.delivery ? kv(T('نوع الاستلام','Fulfilment type'), deliveryType(snap.delivery.type)) : ''));

    /* store */
    h += sec(T('المتجر','Store'), 'ti-building-store',
        kv(T('المتجر','Store'), r.store ? bidi(L(r.store)) : DASH)
      + kv(T('المعرّف','Slug'), r.storeSlug ? '<bdi>' + esc(r.storeSlug) + '</bdi>' : DASH));

    /* customer — only what operations needs to identify the order */
    h += sec(T('العميل','Customer'), 'ti-user',
        CAN.customer
          ? kv(T('الاسم','Name'), cust.name ? bidi(cust.name) : DASH)
            + kv(T('العنوان','Address'), (snap && snap.delivery && snap.delivery.address) ? bidi(snap.delivery.address) : DASH)
            + kv(T('المنطقة','Area'), (snap && snap.delivery && snap.delivery.area) ? bidi(snap.delivery.area) : DASH)
          : '<div class="notice"><i class="ti ti-lock" aria-hidden="true"></i><span>'
            + T('بيانات العميل غير متاحة لحسابك.','Customer data is not available to your account.') + '</span></div>');

    /* payment — read only */
    h += sec(T('الدفع','Payment'), 'ti-credit-card',
        kv(T('حالة الدفع','Payment status'), pay ? '<span class="badge ' + pay.cls + '">' + T(pay.ar,pay.en) + '</span>' : DASH)
      + kv(T('طريقة الدفع','Method'), r.payMethod ? bidi(L(r.payMethod)) : DASH)
      + kv(T('الإجمالي','Total'), totalCell(r))
      + (c.deliveryFee != null ? kv(T('رسوم التوصيل','Delivery fee'), '<bdi>' + esc(c.deliveryFee) + '</bdi>') : '')
      + (c.discount != null && c.discount !== '0.000' ? kv(T('الخصم','Discount'), '<bdi>' + esc(c.discount) + '</bdi>') : ''));

    /* items */
    var items = (snap && snap.items) || [];
    h += sec(T('المحتويات','Items'), 'ti-package', items.length
      ? '<ul class="lines">' + items.map(function(it){
          var nm = isEn() ? (it.nameEn || it.nameAr) : (it.nameAr || it.nameEn);
          return '<li><span class="q">' + esc(it.qty) + '×</span><span class="nm"><bdi>' + esc(nm || it.productId || '') + '</bdi></span>'
            + '<span class="pr">' + (it.finalPrice != null ? '<bdi>' + esc(it.finalPrice) + '</bdi>' : '') + '</span></li>'; }).join('')
        + '</ul>'
      : '<div class="empty"><span>' + T('لا توجد تفاصيل محتويات لهذا الطلب.','No item detail is recorded for this order.') + '</span></div>');

    /* milestones — authoritative timestamps only */
    var ms = [
      [T('الإنشاء','Created'), r.placedAt],
      [T('قبول المتجر','Merchant accepted'), r.acceptedAt],
      [T('الجاهزية','Ready'), r.readyAt]
    ];
    h += sec(T('التوقيت','Timeline'), 'ti-clock', '<ul class="ms">' + ms.map(function(m){
        return '<li><span class="k">' + esc(m[0]) + '</span><span class="v' + (m[1] ? '' : ' na') + '">'
          + (m[1] ? '<bdi>' + esc(clockOf(m[1])) + '</bdi>' : '—') + '</span></li>'; }).join('')
      + '</ul>'
      + (st.k === 'unassigned' ? '<div class="notice"><i class="ti ti-info-circle" aria-hidden="true"></i><span>'
          + T('الطلب جاهز في المتجر وبانتظار تعيين سائق.','The order is ready at the store and waiting for driver assignment.') + '</span></div>' : ''));

    /* related central tickets — the ticket authority's own answer */
    h += sec(T('التذاكر','Tickets'), 'ti-ticket', ticketSection(r));

    /* order activity — operational events only; the technical record is one
       deliberate step away, under التدقيق */
    h += sec(T('النشاط','Activity'), 'ti-history', activitySection(r));

    /* a secondary, clearly separated read-only action — never an order action */
    h += '<div class="sheet-extra"><button class="btn audit-btn" type="button" onclick="OPS.openAudit(\'' + esc(r.id) + '\')">'
      + '<i class="ti ti-file-search" aria-hidden="true"></i>' + T('التدقيق','Audit') + '</button>'
      + '<span class="hint">' + T('كل ما سجّله النظام لهذا الطلب — للاطلاع فقط.','Everything the system recorded for this order — read only.') + '</span></div>';
    return h;
  }

  function ticketSection(r){
    if(!CAN.tickets)
      return '<div class="notice"><i class="ti ti-lock" aria-hidden="true"></i><span>'
        + T('لا تملك صلاحية قراءة التذاكر.','You do not have permission to read tickets.') + '</span></div>';
    var list = null;
    try { var res = CS.listTickets({ orderId:r.id }); if(res && res.ok) list = res.items || []; } catch(e){ list = null; }
    if(list == null)
      return '<div class="notice warn"><i class="ti ti-alert-circle" aria-hidden="true"></i><span>'
        + T('تعذّرت قراءة التذاكر.','Tickets could not be read.') + '</span></div>';
    if(!list.length)
      return '<div class="empty"><span>' + T('لا توجد تذاكر مرتبطة بهذا الطلب.','No tickets are linked to this order.') + '</span></div>';
    return '<ul class="lines">' + list.map(function(t){
        return '<li><span class="nm"><bdi>' + esc(t.subject || t.ticketId) + '</bdi>'
          + '<span class="sub"><bdi>' + esc(t.ticketId) + '</bdi>'
          + (t.departmentText ? ' · ' + esc(L(t.departmentText)) : '') + '</span></span>'
          + (t.statusText ? '<span class="badge b-plain">' + esc(L(t.statusText)) + '</span>' : '') + '</li>'; }).join('')
      + '</ul>';
  }

  /* ───────── النشاط · Activity ─────────
     What HAPPENED to the order, in an operator's words. Technical and
     audit-only records — the processing locks, internal record updates, order
     opens, migrations, inventory movements, notes — are deliberately NOT here;
     they live in التدقيق (Audit) below. Nothing is hidden from the record:
     RAFAudit keeps everything and the Audit layer shows all of it. */
  var OPS_ACTIVITY = {
    'order.created':'ti-receipt', 'order.accept':'ti-check', 'order.ready':'ti-package',
    'order.reject':'ti-x', 'order.cancelled':'ti-circle-x', 'order.undo':'ti-arrow-back-up',
    'order.oos_preference':'ti-adjustments-alt',
    'modify.requested':'ti-edit', 'modify.approved':'ti-check', 'modify.rejected':'ti-x',
    'modify.applied':'ti-check', 'modify.failed':'ti-alert-triangle',
    'product_removal.requested':'ti-edit', 'product_removal.approved':'ti-check',
    'product_removal.rejected':'ti-x', 'product_removal.applied':'ti-package-off',
    'product_replacement.requested':'ti-edit', 'product_replacement.approved':'ti-check',
    'product_replacement.rejected':'ti-x', 'product_replacement.applied':'ti-package',
    'product.removed':'ti-package-off', 'customer.approved':'ti-check', 'customer.response':'ti-message',
    'payment.result':'ti-credit-card', 'refund.created':'ti-receipt-refund',
    'system.timeout':'ti-clock-off', 'system.cancelled':'ti-circle-x', 'system.ready_recovery':'ti-package',
    'system.stock_restored':'ti-rotate', 'system.refunded':'ti-receipt-refund',
    /* the delivery milestones the order lifecycle already defines; they appear
       only for an order that really carries them */
    'driver.assigned':'ti-user-check', 'driver.ready_ack':'ti-check', 'driver.pickup':'ti-package',
    'driver.delivery_start':'ti-truck-delivery', 'driver.arrived':'ti-map-pin-check', 'driver.delivered':'ti-circle-check',
    'driver.returned':'ti-arrow-back-up'
  };
  function activitySection(r){
    var A = window.RAFAudit;
    if(!A || !CAN.audit)
      return '<div class="notice"><i class="ti ti-lock" aria-hidden="true"></i><span>'
        + T('سجل النشاط غير متاح لحسابك.','The activity log is not available to your account.') + '</span></div>';
    var list = [];
    try { list = (A.forOrder(r.id) || []).filter(function(e){ return !!OPS_ACTIVITY[e.action]; }); } catch(e){ list = []; }
    if(!list.length)
      return '<div class="empty"><span>' + T('لا توجد نشاطات تشغيلية لهذا الطلب.','No operational activity for this order.') + '</span></div>';
    list = list.slice().sort(function(a,b){ return b.timestamp - a.timestamp; }).slice(0, 12);
    return '<ul class="ms">' + list.map(function(e){
        var lbl = ''; try { lbl = A.label(e.action); } catch(err){ lbl = e.action; }
        return '<li><span class="k"><i class="ti ' + (OPS_ACTIVITY[e.action] || 'ti-point') + '" aria-hidden="true"></i> ' + esc(lbl || e.action) + '</span>'
          + '<span class="v"><bdi>' + esc(shortClock(e.timestamp) || '') + '</bdi></span></li>'; }).join('')
      + '</ul>';
  }

  /* ───────── التدقيق · Audit ─────────
     A separate, read-only layer over the SAME RAFAudit records: everything the
     system recorded for this one order, technical events included, with the
     registry's own labels. It reads RAFAudit.forOrder(orderId), which scopes by
     the record's own orderId — never by anything from the URL — and it writes
     nothing. */
  var AUDIT_IC = {
    'lock.acquired':'ti-lock', 'lock.released':'ti-lock-open', 'lock.expired':'ti-lock-off',
    'lock.overridden':'ti-lock-access', 'snapshot.updated':'ti-file-text', 'order.opened':'ti-folder-open',
    'order.migrated':'ti-file-import', 'note.order':'ti-note', 'note.preparation':'ti-note',
    'inventory.reserved':'ti-box', 'inventory.released':'ti-box-off', 'inventory.sale_committed':'ti-box',
    'system.lock_expired':'ti-lock-off'
  };
  /* the technical metadata the record already carries — never invented */
  function auditMeta(e){
    var bits = [];
    if(e.previousState || e.newState)
      bits.push(T('الحالة: ','State: ') + (e.previousState || '—') + ' → ' + (e.newState || '—'));
    if(e.reason) bits.push(T('السبب: ','Reason: ') + e.reason);
    if(e.source) bits.push(T('المصدر: ','Source: ') + e.source);
    if(e.automatic) bits.push(T('تلقائي','Automatic'));
    if(e.systemGenerated) bits.push(T('من النظام','System generated'));
    if(e.undone) bits.push(T('تم التراجع عنه','Undone'));
    var md = e.metadata;
    if(md && typeof md === 'object') Object.keys(md).forEach(function(k){
      var v = md[k];
      if(v == null || typeof v === 'object') return;
      bits.push(k + ': ' + v);
    });
    return bits;
  }
  function auditBody(orderId){
    var A = window.RAFAudit;
    if(!A || !CAN.audit)
      return '<div class="sec"><div class="notice"><i class="ti ti-lock" aria-hidden="true"></i><span>'
        + T('التدقيق غير متاح لحسابك.','Audit is not available to your account.') + '</span></div></div>';
    var list = [];
    try { list = (A.forOrder(orderId) || []).slice(); } catch(e){ list = []; }
    if(!list.length)
      return '<div class="sec"><div class="empty"><i class="ti ti-file-off" aria-hidden="true"></i>'
        + '<b>' + T('لا توجد سجلات تدقيق لهذا الطلب','No audit records for this order') + '</b></div></div>';
    list.sort(function(a,b){ return b.timestamp - a.timestamp; });
    return '<div class="sec"><ul class="audit">' + list.map(function(e){
        var lbl = ''; try { lbl = A.label(e.action); } catch(err){ lbl = e.action; }
        var meta = auditMeta(e);
        return '<li><span class="ai" aria-hidden="true"><i class="ti ' + (AUDIT_IC[e.action] || OPS_ACTIVITY[e.action] || 'ti-point') + '"></i></span>'
          /* the audit action's own human label, not the internal event name */
          + '<span class="ab"><b>' + esc(lbl || e.action) + '</b>'
          + '<span class="who"><bdi>' + esc(e.actorName || (e.actorType === 'system' ? T('النظام','System') : '—')) + '</bdi>'
            + ' · <bdi>' + esc(e.orderId || orderId) + '</bdi></span>'
          + (meta.length ? '<span class="md">' + meta.map(function(m){ return '<bdi>' + esc(m) + '</bdi>'; }).join('<span class="sep">·</span>') + '</span>' : '')
          + '</span>'
          + '<span class="aw"><bdi>' + esc(shortClock(e.timestamp) || '') + '</bdi></span></li>'; }).join('')
      + '</ul></div>';
  }
  function renderAudit(){
    if(!AUDIT) return;
    el('auditHost').innerHTML =
      '<div class="sheet" id="auditSheet" onclick="if(event.target===this)OPS.closeAudit()">'
      + '<div class="sheet-c" role="dialog" aria-modal="true" aria-labelledby="auT">'
      + '<div class="sheet-h"><button class="ibtn" type="button" onclick="OPS.closeAudit()" aria-label="' + esc(T('رجوع','Back')) + '">'
        + '<i class="ti ti-arrow-' + (isEn() ? 'left' : 'right') + '" aria-hidden="true"></i></button>'
      + '<div class="t"><b id="auT">' + T('التدقيق','Audit') + '</b>'
        + '<span><bdi>' + esc(AUDIT) + '</bdi> · ' + T('سجل تقني للقراءة فقط','Technical record, read only') + '</span></div></div>'
      + '<div class="sheet-b">' + auditBody(AUDIT) + '</div></div></div>';
    var b = el('auditSheet').querySelector('.ibtn'); if(b) b.focus();
  }
  function closeAudit(){
    AUDIT = null; el('auditHost').innerHTML = '';
    var b = document.querySelector('.audit-btn'); if(b) b.focus();
  }

  function renderSheet(){
    var r = null;
    for(var i=0;i<ROWS.length;i++) if(ROWS[i].id === OPEN) r = ROWS[i];
    if(!r){ closeSheet(); return; }
    var st = stateOf(r);
    el('sheetHost').innerHTML =
      '<div class="sheet" id="sheet" onclick="if(event.target===this)OPS.close()">'
      + '<div class="sheet-c" role="dialog" aria-modal="true" aria-labelledby="shT">'
      + '<div class="sheet-h"><div class="t"><b id="shT"><bdi>' + esc(r.id) + '</bdi></b>'
        + '<span>' + (r.store ? esc(L(r.store)) : '') + '</span></div>'
        + (st.k === 'none' ? '' : '<span class="badge ' + st.cls + '">' + T(st.ar,st.en) + '</span>')
        + '<button class="ibtn" type="button" onclick="OPS.close()" aria-label="' + esc(T('إغلاق','Close')) + '"><i class="ti ti-x" aria-hidden="true"></i></button></div>'
      + '<div class="sheet-b">' + sheetBody(r) + '</div></div></div>';
    var x = el('sheet').querySelector('.ibtn'); if(x) x.focus();
  }
  function closeSheet(){
    if(AUDIT) closeAudit();
    OPEN = null; el('sheetHost').innerHTML = '';
    if(openTrigger && document.contains(openTrigger)) openTrigger.focus();
    openTrigger = null;
  }

  /* ───────── shell ───────── */
  /* the existing settings permission decides whether Settings is listed */
  function canSettings(){ try { return !!(ME && P.can(ME.id, 'settings.view')); } catch(e){ return false; } }
  /* Compensation is listed for the accounts the compensation authority lets
     manage compensations — the same existing Logistics management permission
     these pages already gate their operational actions on. */
  function canCompensation(){ try { return !!(ME && P.can(ME.id, 'drivers.suspend')); } catch(e){ return false; } }
  function renderNav(){
    function item(href, icon, ar, en, current){
      return '<li><a href="' + href + '"' + (current ? ' aria-current="page"' : '') + '>'
        + '<i class="ti ' + icon + '" aria-hidden="true"></i><span>' + T(ar,en) + '</span></a></li>';
    }
    el('navTree').innerHTML =
      '<span class="grp">' + T('العمليات','Operations') + '</span><ul>'
      + item('raf_logistics.html', 'ti-layout-dashboard', 'مركز العمليات', 'Command Center', false)
      + item('raf_logistics_orders.html', 'ti-shopping-bag', 'الطلبات', 'Orders', true)
      + item('raf_logistics_dispatch.html', 'ti-route', 'التوزيع والتعيين', 'Dispatch & Assignment', false)
      + item('raf_logistics_tickets.html', 'ti-ticket', 'التذاكر', 'Tickets', false)
      + item('raf_logistics_drivers.html', 'ti-motorbike', 'السائقون', 'Drivers', false)
      /* Settings is the final administrative section, listed only for an
         account that may actually open it */
      + (canSettings() ? item('raf_logistics_settings.html', 'ti-settings', 'الإعدادات', 'Settings', false) : '')
      + (canCompensation() ? item('raf_logistics_compensation.html', 'ti-receipt-refund', 'التعويضات', 'Compensation', false) : '')
      + '</ul>'
      + '<div class="ops-nav-foot"><b>' + T('العمليات واللوجستيات','Operations & Logistics') + '</b>'
      + T('منصة رف','RAF platform') + '</div>';
  }
  function renderHeader(){
    el('crumbGroup').textContent = T('اللوجستيات · العمليات','Logistics · Operations');
    el('crumbPage').textContent = T('الطلبات','Orders');
    el('langBtn').textContent = isEn() ? 'ع' : 'EN';
    el('langBtn').setAttribute('aria-label', T('التبديل إلى الإنجليزية','Switch to Arabic'));
    if(ME){
      el('userAv').textContent = String(ME.name || '?').trim().charAt(0);
      el('userName').textContent = ME.name || '';
      var role = null; try { role = P.getRole(ME.roleId); } catch(e){}
      el('userRole').textContent = role ? T(role.nameAr, role.nameEn) : '';
    }
    document.title = T('رف — الطلبات','RAF — Orders');
  }

  function refresh(){ readAll(); readTickets(); render(); }

  function gate(titleAr, titleEn, msg){
    ME = null; OPEN = null; AUDIT = null; DRAFT = null;
    el('shell').hidden = true; el('sheetHost').innerHTML = '';
    el('auditHost').innerHTML = ''; el('appletHost').innerHTML = '';
    var g = el('gate'); g.hidden = false;
    el('gateT').textContent = T(titleAr, titleEn);
    el('gateP').textContent = msg;
    document.title = T('رف — الطلبات','RAF — Orders');
  }
  function applyLang(){
    var en = isEn();
    document.querySelectorAll('[data-ar][data-en]').forEach(function(e){
      var t = e.getAttribute('data-' + (en ? 'en' : 'ar')); if(t !== null) e.textContent = t;
    });
  }
  function boot(){
    var l = null; try { l = localStorage.getItem('raf_lang'); } catch(e){}
    if(l === 'en'){ root().lang = 'en'; root().dir = 'ltr'; }
    applyLang();

    if(!P || !E || !window.RAFShop){
      gate('تعذّر التحميل','Could not load', T('لم يتم تحميل وحدات رف المطلوبة.','The required RAF modules did not load.'));
      return;
    }
    /* identity from the stored session only — never from the URL or a
       caller-supplied id. RAFPerm.currentUser() falls back to the first
       administrator when nothing is signed in, so the session key is read
       first and an empty session is refused. */
    var sid = null;
    try {
      sid = P.sessionUserId ? P.sessionUserId() : null;   /* RAFPerm owns this tab's session */
    } catch(e){ sid = null; }
    if(!sid){ gate('يلزم تسجيل الدخول','Sign-in required', T('الطلبات متاحة لفريق عمليات رف بعد تسجيل الدخول.','Orders are available to RAF operations staff after signing in.')); return; }
    var u = null; try { u = P.getUser(sid); } catch(e){ u = null; }
    if(!u){ gate('يلزم تسجيل الدخول','Sign-in required', T('تعذّر التعرف على الحساب.','That account could not be identified.')); return; }
    if(u.status !== 'active'){ gate('حسابك موقوف','Your account is suspended', T('لا يمكن فتح الطلبات بحساب موقوف.','A suspended account cannot open Orders.')); return; }
    var ok = true;
    try { ok = P.can(u.id, PERM.orders) && P.can(u.id, PERM.drivers) && P.can(u.id, PERM.ops); } catch(e){ ok = false; }
    if(!ok){ gate('لا تملك صلاحية الوصول','You do not have access', T('الطلبات متاحة لفريق عمليات رف فقط.','Orders are available to RAF operations staff only.')); return; }

    ME = { id:u.id, name:u.name, roleId:u.roleId };
    CAN.tickets  = (function(){ try { return !!(CS && P.can(u.id, 'support.view')); } catch(e){ return false; } })();
    CAN.audit    = (function(){ try { return !!(window.RAFAudit && RAFAudit.canViewAudit(u.id)); } catch(e){ return false; } })();
    /* the customer's operational identity rides on the order record this
       account may already read (orders.view); nothing else of the customer is read */
    CAN.customer = (function(){ try { return !!P.can(u.id, PERM.orders); } catch(e){ return false; } })();

    el('gate').hidden = true; el('shell').hidden = false;
    refresh();

    /* live updates through the mechanisms that already exist — no polling, no timer */
    if(window.RAFEventBus){
      ['order.*','support.*','audit.*'].forEach(function(p){
        try { RAFEventBus.subscribe(p, function(){ refresh(); }); } catch(e){}
      });
    }
    window.addEventListener('storage', function(e){
      if(e.key && /^raf_(orders|order_mstate|order_undo|pending|support_tickets|support_activities|audit_events|users)$/.test(e.key)) refresh();
    });
    document.addEventListener('raf:order', refresh);
    document.addEventListener('raf:audit', refresh);
  }

  window.OPS = {
    refresh: refresh,
    setScope: function(k){ F.scope = k; render(); },
    setQ: function(v){
      F.q = v; render();
      var i = el('q'); if(i){ i.focus(); try { i.setSelectionRange(i.value.length, i.value.length); } catch(e){} }
    },
    setF: function(k, v){ F[k] = v; render(); },
    /* applet: edit a draft, commit on Apply */
    openFilters: openFilters,
    closeFilters: closeFilters,
    draft: function(k, v){ if(DRAFT) DRAFT[k] = v; },
    applyFilters: function(){
      if(!DRAFT) return;
      F.state = DRAFT.state; F.store = DRAFT.store; F.pay = DRAFT.pay; F.from = DRAFT.from; F.to = DRAFT.to;
      closeFilters(); render();
      var b = el('filterBtn'); if(b) b.focus();
    },
    /* clears the applet's filters; the scope and the search box are separate controls */
    clearFilters: function(){
      F.state = ''; F.store = ''; F.pay = ''; F.from = ''; F.to = '';
      if(DRAFT){ closeFilters(); }
      render();
      var b = el('filterBtn'); if(b) b.focus();
    },
    /* nothing opens over the access gate: with no authorised session there is
       no sheet, no applet and no audit layer */
    open: function(id){ if(!ME) return; openTrigger = document.activeElement; OPEN = id; renderSheet(); },
    close: closeSheet,
    /* the audit layer sits ON TOP of the details sheet, which stays open behind it */
    openAudit: function(id){ if(!ME) return; AUDIT = id; renderAudit(); },
    closeAudit: closeAudit,
    toggleLang: function(){
      var r = root(), en = r.lang === 'en';
      r.lang = en ? 'ar' : 'en'; r.dir = en ? 'rtl' : 'ltr';
      try { localStorage.setItem('raf_lang', r.lang); } catch(e){}
      applyLang(); render(); el('langBtn').focus();
    },
    openNav: function(){ el('shell').classList.add('nav-open'); var x = document.querySelector('.ops-nav-x'); if(x) x.focus(); },
    closeNav: function(){ el('shell').classList.remove('nav-open'); var b = document.querySelector('.ops-burger'); if(b) b.focus(); }
  };
  document.addEventListener('keydown', function(e){
    if(e.key !== 'Escape') return;
    if(AUDIT){ e.preventDefault(); closeAudit(); return; }
    if(DRAFT){ e.preventDefault(); closeFilters(); return; }
    if(OPEN){ e.preventDefault(); closeSheet(); return; }
    if(el('shell') && el('shell').classList.contains('nav-open')) OPS.closeNav();
  });

  if(document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();
})();
</script>
</body>
</html>
