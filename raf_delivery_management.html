<!DOCTYPE html>
<html id="htmlRoot" lang="ar" dir="rtl" data-ui="admin">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>رف — إدارة اللوجستيات</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
<link rel="icon" type="image/png" sizes="64x64" href="raf_favicon.png">
<link rel="icon" type="image/png" sizes="32x32" href="raf_favicon_32.png">
<link rel="apple-touch-icon" href="raf_appicon.png">
<script src="raf_features.js"></script>
<script src="raf_config.js"></script>
<script src="raf_event_bus.js"></script>
<script src="raf_record_store.js"></script>
<script src="raf_notify_core.js"></script>
<link rel="stylesheet" href="raf_theme.css">
<style>
/* ══════════════════════════════════════════════════════════════════════
   RAF LOGISTICS MANAGEMENT — a standalone operations interface.
   Own shell, own navigation, own visual identity. It opts out of the
   storefront theme (data-ui="admin") and is written in logical properties,
   so Arabic and English share one layout.
   The page renders what RAFDeliveryOps answers; it holds no delivery logic.
   ══════════════════════════════════════════════════════════════════════ */
:root{
  --bg:#F2F3F0; --surface:#FFFFFF; --surface-2:#F7F8F6; --line:#E1E4DF; --line-2:#CED3CC;
  --ink:#141917; --text:#29302D; --muted:#5F6965; --faint:#88918D;
  --nav:#0E1C1A; --nav-2:#162825; --nav-3:#1E3531; --nav-text:#D3DDD9; --nav-muted:#8A9A95;
  --accent:#1C7466; --accent-2:#155C51; --accent-soft:#E2F0EC;
  --gold:#C9A84C;
  --wait:#9A6414; --wait-bg:#FBF0DA;
  --claim:#2D5B97; --claim-bg:#E5EDF8;
  --out:#1C7466;  --out-bg:#E2F0EC;
  --done:#2B7446; --done-bg:#E3F1E7;
  --alert:#A8412D; --alert-bg:#FAE8E3;
  --r-sm:8px; --r:10px; --r-lg:14px;
  --shadow:0 1px 2px rgba(14,28,26,.05), 0 1px 1px rgba(14,28,26,.03);
  --shadow-pop:0 12px 32px rgba(14,28,26,.16);
  --head-h:64px; --nav-w:272px;
  --font:'Tajawal',system-ui,-apple-system,'Segoe UI',sans-serif;
}
html[lang="en"]{ --font:'DM Sans',system-ui,-apple-system,'Segoe UI',sans-serif; }
*{ box-sizing:border-box; }
html,body{ margin:0; }
body{ background:var(--bg); color:var(--text); font-family:var(--font); font-size:14px; line-height:1.5;
  -webkit-font-smoothing:antialiased; overflow-x:hidden; }
[hidden]{ display:none !important; }
button,input,select{ font:inherit; color:inherit; }
a{ color:inherit; }
:focus-visible{ outline:2px solid var(--accent); outline-offset:2px; }
.sr-only{ position:absolute !important; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; border:0; }
bdi{ unicode-bidi:isolate; }

/* ───────── APP GRID ───────── */
.dm{ min-height:100vh; display:grid; grid-template-columns:var(--nav-w) minmax(0,1fr); }
.dm-main{ min-width:0; display:flex; flex-direction:column; }

/* ───────── SIDEBAR ───────── */
.dm-nav{ background:var(--nav); color:var(--nav-text); display:flex; flex-direction:column;
  position:sticky; top:0; height:100vh; min-width:0; }
.dm-brand{ display:flex; align-items:center; gap:12px; padding:0 18px; height:var(--head-h); border-block-end:1px solid rgba(255,255,255,.06); flex-shrink:0; }
.dm-brand-mark{ width:36px; height:36px; border-radius:9px; background:var(--accent); color:#fff; display:grid; place-items:center; flex-shrink:0; position:relative; }
.dm-brand-mark i{ font-size:20px; }
.dm-brand-mark::after{ content:""; position:absolute; inset-inline-end:-3px; inset-block-end:-3px; width:10px; height:10px; border-radius:3px; background:var(--gold); border:2px solid var(--nav); }
.dm-brand-t{ min-width:0; line-height:1.2; }
.dm-brand-t b{ display:block; color:#fff; font-size:15px; font-weight:800; letter-spacing:.1px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.dm-brand-t span{ display:block; color:var(--nav-muted); font-size:11.5px; font-weight:600; }
.ibtn.dm-nav-x{ display:none; margin-inline-start:auto; }
.dm-nav-scroll{ flex:1; overflow-y:auto; padding:12px 10px 16px; overscroll-behavior:contain; }
.dm-nav-scroll::-webkit-scrollbar{ width:6px; } .dm-nav-scroll::-webkit-scrollbar-thumb{ background:var(--nav-3); border-radius:3px; }
.dm-nav ul{ list-style:none; margin:0; padding:0; }
.dm-group{ margin-block-end:2px; }
.dm-group-btn{ width:100%; min-height:44px; display:flex; align-items:center; gap:12px; padding:0 12px; border:0; background:transparent;
  color:var(--nav-text); border-radius:var(--r-sm); cursor:pointer; font-size:14px; font-weight:600; text-align:start; }
.dm-group-btn:hover{ background:var(--nav-2); color:#fff; }
.dm-group-btn > i:first-child{ font-size:19px; color:var(--nav-muted); flex-shrink:0; width:20px; text-align:center; }
.dm-group-btn .lbl{ flex:1; min-width:0; }
.dm-group-btn .chev{ font-size:16px; color:var(--nav-muted); transition:transform .18s ease; }
[dir="rtl"] .dm-group-btn .chev{ transform:scaleX(-1); }
.dm-group-btn[aria-expanded="true"] .chev{ transform:rotate(90deg); }
.dm-group.is-current > .dm-group-btn{ color:#fff; }
.dm-group.is-current > .dm-group-btn > i:first-child{ color:var(--gold); }
.dm-sub{ padding:2px 0 8px; margin-inline-start:22px; border-inline-start:1px solid var(--nav-3); }
.dm-sub a{ display:flex; align-items:center; gap:8px; min-height:44px; padding:0 12px 0 14px; margin-inline-start:-1px;
  border-inline-start:2px solid transparent; color:var(--nav-muted); text-decoration:none; font-size:13.5px; font-weight:500; border-radius:0 var(--r-sm) var(--r-sm) 0; }
[dir="rtl"] .dm-sub a{ border-radius:var(--r-sm) 0 0 var(--r-sm); }
.dm-sub a:hover{ color:#fff; background:var(--nav-2); }
.dm-sub a[aria-current="page"]{ color:#fff; font-weight:700; border-inline-start-color:var(--gold); background:var(--nav-2); }
.dm-sub a .n{ margin-inline-start:auto; min-width:22px; padding:0 6px; height:20px; border-radius:10px; background:var(--nav-3); color:var(--nav-text);
  font-size:11px; font-weight:700; display:inline-grid; place-items:center; font-family:'DM Sans',sans-serif; }
.dm-sub a .soon{ margin-inline-start:auto; font-size:10.5px; color:var(--nav-muted); font-weight:600; opacity:.8; }

/* ───────── HEADER ───────── */
.dm-head{ position:sticky; top:0; z-index:40; height:var(--head-h); background:rgba(255,255,255,.92); backdrop-filter:saturate(1.4) blur(8px);
  -webkit-backdrop-filter:saturate(1.4) blur(8px); border-block-end:1px solid var(--line); display:flex; align-items:center; gap:10px; padding:0 24px; }
.ibtn.dm-burger{ display:none; }
.dm-crumb{ min-width:0; flex:1; display:flex; align-items:center; gap:8px; }
.dm-crumb .mob-brand{ display:none; width:34px; height:34px; border-radius:9px; background:var(--accent); color:#fff; place-items:center; flex-shrink:0; }
.dm-crumb .mob-brand i{ font-size:19px; }
.dm-crumb-t{ min-width:0; line-height:1.25; }
.dm-crumb-t small{ display:block; color:var(--faint); font-size:11.5px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.dm-crumb-t b{ display:block; color:var(--ink); font-size:15px; font-weight:800; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.dm-tools{ display:flex; align-items:center; gap:6px; flex-shrink:0; }
.ibtn{ width:44px; height:44px; min-height:44px; border-radius:var(--r); border:1px solid transparent; background:transparent; color:var(--muted);
  display:inline-grid; place-items:center; cursor:pointer; position:relative; padding:0; }
.ibtn:hover{ background:var(--surface-2); border-color:var(--line); color:var(--ink); }
.ibtn i{ font-size:20px; }
.ibtn.lang{ width:auto; min-width:44px; padding:0 12px; font-weight:800; font-size:13px; color:var(--text); border-color:var(--line); }
.dm-user{ display:flex; align-items:center; gap:10px; min-height:44px; padding:0 8px 0 6px; border-radius:var(--r); border:1px solid transparent;
  background:transparent; cursor:pointer; text-align:start; max-width:240px; }
.dm-user:hover{ background:var(--surface-2); border-color:var(--line); }
.dm-av{ width:32px; height:32px; border-radius:50%; background:var(--nav); color:#fff; display:grid; place-items:center; font-size:13px; font-weight:800; flex-shrink:0; }
.dm-user-t{ min-width:0; line-height:1.2; }
.dm-user-t b{ display:block; font-size:13px; color:var(--ink); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.dm-user-t span{ display:block; font-size:11.5px; color:var(--faint); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.pop-wrap{ position:relative; }
.pop{ position:absolute; top:calc(100% + 8px); inset-inline-end:0; width:300px; max-width:calc(100vw - 24px); background:var(--surface);
  border:1px solid var(--line); border-radius:var(--r-lg); box-shadow:var(--shadow-pop); z-index:60; overflow:hidden; }
.pop-h{ padding:14px 16px; border-block-end:1px solid var(--line); font-weight:800; color:var(--ink); font-size:14px; }
.pop-b{ padding:16px; color:var(--muted); font-size:13px; }
.pop-empty{ display:flex; gap:12px; align-items:flex-start; }
.pop-empty i{ font-size:22px; color:var(--faint); }
.pop-id{ display:flex; gap:12px; align-items:center; padding:16px; }
.pop-id .dm-av{ width:40px; height:40px; font-size:15px; }
.pop-id b{ display:block; color:var(--ink); }
.pop-id span{ display:block; color:var(--faint); font-size:12px; }

/* ───────── CONTENT ───────── */
.dm-content{ padding:28px 28px 48px; width:100%; max-width:1440px; margin-inline:auto; }
.pg-head{ display:flex; align-items:flex-end; justify-content:space-between; gap:16px; margin-block-end:22px; flex-wrap:wrap; }
.pg-head h1{ margin:0; font-size:24px; line-height:1.25; font-weight:800; color:var(--ink); letter-spacing:-.2px; }
.pg-head p{ margin:4px 0 0; color:var(--muted); font-size:13.5px; }
.pg-actions{ display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
.btn{ display:inline-flex; align-items:center; justify-content:center; gap:8px; min-height:44px; padding:0 16px; border-radius:var(--r);
  border:1px solid var(--line-2); background:var(--surface); color:var(--text); font-weight:700; font-size:13.5px; cursor:pointer; text-decoration:none; white-space:nowrap; }
.btn:hover{ border-color:var(--accent); color:var(--accent-2); }
.btn i{ font-size:18px; }
.btn.primary{ background:var(--accent); border-color:var(--accent); color:#fff; }
.btn.primary:hover{ background:var(--accent-2); color:#fff; }
.live-pill{ display:inline-flex; align-items:center; gap:7px; height:30px; padding:0 12px; border-radius:15px; background:var(--accent-soft); color:var(--accent-2); font-size:12px; font-weight:700; }
.live-pill b{ width:7px; height:7px; border-radius:50%; background:var(--accent); }

.card{ background:var(--surface); border:1px solid var(--line); border-radius:var(--r-lg); box-shadow:var(--shadow); min-width:0; }
.card-h{ display:flex; align-items:center; gap:10px; padding:16px 18px; border-block-end:1px solid var(--line); }
.card-h h2{ margin:0; font-size:15px; font-weight:800; color:var(--ink); display:flex; align-items:center; gap:8px; }
.card-h h2 i{ font-size:18px; color:var(--muted); }
.card-h .sp{ flex:1; }
.card-h .count{ font-size:12px; color:var(--faint); font-weight:700; }
.card-h a.more{ display:inline-flex; align-items:center; gap:4px; min-height:44px; padding:0 4px; font-size:12.5px; font-weight:700; color:var(--accent-2); text-decoration:none; }
[dir="rtl"] .card-h a.more i{ transform:scaleX(-1); }
.card-note{ padding:12px 18px; border-block-start:1px solid var(--line); color:var(--faint); font-size:12px; display:flex; gap:8px; align-items:flex-start; }
.card-note i{ font-size:15px; margin-block-start:1px; }

/* KPI row */
.kpis{ display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:14px; margin-block-end:18px; }
.kpi{ display:flex; flex-direction:column; gap:10px; padding:16px 18px; text-decoration:none; color:inherit; position:relative; min-height:112px; }
.kpi:hover{ border-color:var(--line-2); }
.kpi-top{ display:flex; align-items:center; gap:10px; padding-inline-end:22px; }
.kpi-ic{ width:34px; height:34px; border-radius:9px; display:grid; place-items:center; flex-shrink:0; }
.kpi-ic i{ font-size:19px; }
.kpi-l{ font-size:13px; font-weight:700; color:var(--muted); min-width:0; }
.kpi-v{ font-family:'DM Sans',sans-serif; font-size:32px; line-height:1; font-weight:700; color:var(--ink); letter-spacing:-.5px; }
.kpi-s{ font-size:12px; color:var(--faint); }
.kpi .go{ position:absolute; top:16px; inset-inline-end:14px; color:var(--faint); font-size:16px; }
[dir="rtl"] .kpi .go{ transform:scaleX(-1); }
.kpi.wait .kpi-ic{ background:var(--wait-bg); color:var(--wait); }
.kpi.claim .kpi-ic{ background:var(--claim-bg); color:var(--claim); }
.kpi.out .kpi-ic{ background:var(--out-bg); color:var(--out); }
.kpi.done .kpi-ic{ background:var(--done-bg); color:var(--done); }

.dash-grid{ display:grid; grid-template-columns:minmax(0,1fr) 340px; gap:18px; align-items:start; }
.dash-grid > .col{ display:flex; flex-direction:column; gap:18px; min-width:0; }

/* status chip */
.chip{ display:inline-flex; align-items:center; gap:5px; height:24px; padding:0 9px; border-radius:12px; font-size:12px; font-weight:700; white-space:nowrap; background:var(--surface-2); color:var(--muted); }
.chip i{ font-size:14px; }
.chip.wait{ background:var(--wait-bg); color:var(--wait); }
.chip.claim{ background:var(--claim-bg); color:var(--claim); }
.chip.out{ background:var(--out-bg); color:var(--out); }
.chip.done{ background:var(--done-bg); color:var(--done); }
.chip.alert{ background:var(--alert-bg); color:var(--alert); }
.chip.muted{ background:var(--surface-2); color:var(--muted); border:1px solid var(--line); }

/* table (becomes cards on narrow screens) */
.tbl-wrap{ width:100%; overflow-x:auto; }
.tbl td.first, .tbl td.nw{ white-space:nowrap; }
.tbl{ width:100%; border-collapse:collapse; font-size:13.5px; }
.tbl th{ text-align:start; font-size:11.5px; font-weight:700; color:var(--faint); padding:10px 14px; background:var(--surface-2); border-block-end:1px solid var(--line); white-space:nowrap; }
.tbl td{ padding:10px 14px; border-block-end:1px solid var(--line); vertical-align:middle; color:var(--text); }
.tbl tbody tr:last-child td{ border-block-end:0; }
.tbl tbody tr{ cursor:pointer; }
.tbl tbody tr:hover td{ background:#FAFBF9; }
.tbl .strong{ font-weight:700; color:var(--ink); }
.tbl .sub{ display:block; font-size:12px; color:var(--faint); }
.tbl .num{ font-family:'DM Sans',sans-serif; }
.order-btn{ display:inline-flex; align-items:center; min-height:44px; padding:0; border:0; background:transparent; font-weight:800; color:var(--accent-2); cursor:pointer; font-family:'DM Sans',sans-serif; font-size:13.5px; }
.order-btn:hover{ text-decoration:underline; }
.cell-muted{ color:var(--faint); }

/* side panels */
.list{ list-style:none; margin:0; padding:0; }
.list li{ display:flex; gap:12px; padding:14px 18px; border-block-end:1px solid var(--line); align-items:flex-start; }
.list li:last-child{ border-block-end:0; }
.list .ic{ width:30px; height:30px; border-radius:8px; display:grid; place-items:center; flex-shrink:0; }
.list .ic i{ font-size:16px; }
.list .ic.alert{ background:var(--alert-bg); color:var(--alert); }
.list .ic.wait{ background:var(--wait-bg); color:var(--wait); }
.list .ic.claim{ background:var(--claim-bg); color:var(--claim); }
.list .ic.out{ background:var(--out-bg); color:var(--out); }
.list .ic.done{ background:var(--done-bg); color:var(--done); }
.list .bd{ min-width:0; flex:1; }
.list .bd b{ display:block; color:var(--ink); font-size:13.5px; font-weight:700; }
.list .bd span{ display:block; color:var(--muted); font-size:12.5px; overflow-wrap:anywhere; }
.list .tm{ font-size:12px; color:var(--faint); white-space:nowrap; font-family:'DM Sans',sans-serif; }
.list .order-btn{ font-size:12.5px; }
.list .bd > span{ display:flex; flex-wrap:wrap; align-items:center; column-gap:6px; }
.ok-state{ display:flex; gap:12px; align-items:center; padding:18px; }
.ok-state .ic{ width:36px; height:36px; border-radius:50%; background:var(--done-bg); color:var(--done); display:grid; place-items:center; flex-shrink:0; }
.ok-state b{ display:block; color:var(--ink); font-size:14px; }
.ok-state span{ display:block; color:var(--muted); font-size:12.5px; }
.status-rows{ padding:6px 18px 12px; }
.status-row{ display:flex; align-items:center; gap:10px; min-height:40px; border-block-end:1px dashed var(--line); font-size:13px; }
.status-row:last-child{ border-block-end:0; }
.status-row .k{ flex:1; color:var(--muted); }
.status-row .v{ font-weight:700; color:var(--ink); }

/* empty / not configured */
.empty{ padding:40px 24px; text-align:center; color:var(--muted); }
.empty i{ font-size:34px; color:var(--line-2); display:block; margin-block-end:10px; }
.empty b{ display:block; color:var(--ink); font-size:15px; margin-block-end:4px; }
.empty span{ display:block; font-size:13px; max-width:460px; margin-inline:auto; }
.nc{ display:grid; grid-template-columns:minmax(0,1fr); place-items:center; padding:56px 24px; text-align:center; }
.nc-ic{ width:64px; height:64px; border-radius:18px; background:var(--surface-2); border:1px solid var(--line); display:grid; place-items:center; color:var(--muted); margin-block-end:18px; }
.nc-ic i{ font-size:30px; }
.nc-tag{ display:inline-flex; align-items:center; gap:6px; height:26px; padding:0 10px; border-radius:13px; background:var(--surface-2); border:1px solid var(--line); color:var(--muted); font-size:12px; font-weight:700; margin-block-end:12px; }
.nc h2{ margin:0 0 8px; font-size:19px; color:var(--ink); font-weight:800; }
.nc p{ margin:0 auto; max-width:520px; color:var(--muted); font-size:14px; }
.nc .pg-actions{ justify-content:center; margin-block-start:20px; }

/* toolbar */
.toolbar{ display:flex; flex-wrap:wrap; gap:10px; padding:14px 18px; border-block-end:1px solid var(--line); align-items:center; }
.search{ position:relative; flex:1 1 240px; min-width:0; }
.search i{ position:absolute; inset-inline-start:12px; top:50%; transform:translateY(-50%); color:var(--faint); font-size:17px; pointer-events:none; }
.search input{ width:100%; min-height:44px; border:1px solid var(--line-2); border-radius:var(--r); background:var(--surface); padding:0 12px; padding-inline-start:38px; }
.sel{ min-height:44px; border:1px solid var(--line-2); border-radius:var(--r); background:var(--surface); padding:0 10px; min-width:0; max-width:100%; flex:0 1 170px; }
.search input:focus, .sel:focus{ outline:2px solid var(--accent); outline-offset:0; border-color:var(--accent); }
.note-bar{ display:flex; gap:8px; align-items:flex-start; padding:12px 18px; background:var(--surface-2); border-block-end:1px solid var(--line); color:var(--muted); font-size:12.5px; }
.note-bar i{ font-size:16px; margin-block-start:1px; }

/* ───────── DETAIL DRAWER ───────── */
.dw{ position:fixed; inset:0; background:rgba(14,28,26,.38); z-index:90; display:flex; justify-content:flex-end; }
.dw-c{ width:min(460px,100%); height:100%; background:var(--surface); display:flex; flex-direction:column; box-shadow:var(--shadow-pop); }
.dw-h{ display:flex; align-items:center; gap:10px; padding:14px 16px 14px 18px; border-block-end:1px solid var(--line); }
.dw-h .t{ flex:1; min-width:0; }
.dw-h .t b{ display:block; color:var(--ink); font-size:16px; font-family:'DM Sans',sans-serif; }
.dw-h .t span{ display:block; color:var(--muted); font-size:12.5px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.dw-b{ flex:1; overflow-y:auto; padding:6px 18px 24px; }
.dw-sec{ padding:14px 0; border-block-end:1px solid var(--line); }
.dw-sec:last-child{ border-block-end:0; }
.dw-sec h3{ margin:0 0 10px; font-size:12px; letter-spacing:.3px; color:var(--faint); font-weight:800; display:flex; gap:6px; align-items:center; }
.dw-sec h3 i{ font-size:15px; }
.kv{ display:flex; gap:12px; padding:5px 0; font-size:13.5px; }
.kv .k{ color:var(--muted); flex-shrink:0; min-width:110px; }
.kv .v{ color:var(--ink); font-weight:600; min-width:0; overflow-wrap:anywhere; }
.tml{ display:flex; flex-direction:column; }
.tml-s{ display:flex; gap:10px; position:relative; padding-block-end:12px; }
.tml-s::before{ content:""; position:absolute; inset-inline-start:11px; top:24px; bottom:0; width:2px; background:var(--line); }
.tml-s:last-child::before{ display:none; }
.tml-s .dot{ width:24px; height:24px; border-radius:50%; display:grid; place-items:center; background:var(--surface-2); border:1px solid var(--line-2); color:var(--faint); flex-shrink:0; z-index:1; }
.tml-s.done .dot{ background:var(--accent); border-color:var(--accent); color:#fff; }
.tml-s .dot i{ font-size:13px; }
.tml-s b{ display:block; font-size:13px; color:var(--ink); }
.tml-s span{ display:block; font-size:12px; color:var(--faint); }
.dw-item{ display:flex; gap:10px; padding:6px 0; font-size:13px; }
.dw-item .q{ color:var(--faint); font-family:'DM Sans',sans-serif; flex-shrink:0; }
.dw-item .n{ flex:1; min-width:0; color:var(--ink); }
.dw-item .n span{ display:block; color:var(--faint); font-size:12px; }
.dw-call{ margin-block-start:10px; }
.dw-foot{ margin-block-start:14px; padding:12px; border-radius:var(--r); background:var(--surface-2); color:var(--muted); font-size:12.5px; display:flex; gap:8px; }
.dw-foot i{ font-size:16px; }

/* ───────── GATE ───────── */
.gate{ min-height:100vh; display:grid; place-items:center; padding:24px; background:var(--bg); }
.gate-c{ width:min(440px,100%); background:var(--surface); border:1px solid var(--line); border-radius:var(--r-lg); box-shadow:var(--shadow); padding:32px 28px; text-align:center; }
.gate-c .nc-ic{ margin-inline:auto; color:var(--alert); background:var(--alert-bg); border-color:transparent; }
.gate-c h1{ margin:0 0 8px; font-size:19px; color:var(--ink); }
.gate-c p{ margin:0 0 20px; color:var(--muted); }

.scrim{ display:none; }

/* ───────── DISPATCH BOARD ───────── */
.nc-inline{ display:flex; gap:12px; align-items:flex-start; padding:14px 18px; }
.nc-inline > i{ font-size:22px; color:var(--muted); flex-shrink:0; }
.nc-inline b{ display:block; color:var(--ink); font-size:14px; }
.nc-inline span{ display:block; color:var(--muted); font-size:13px; }
.nc-inline .nc-tag{ margin:0 0 6px; }
.stack{ display:flex; flex-direction:column; gap:18px; margin-block-end:18px; }
.pool-h-label{ display:inline-flex; align-items:center; gap:6px; }
.pool li{ align-items:center; flex-wrap:wrap; }
.pool .bd .meta{ display:flex; flex-wrap:wrap; column-gap:10px; row-gap:2px; color:var(--muted); font-size:12.5px; }
.pool .acts{ display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin-inline-start:auto; }
.btn.sm{ min-height:40px; padding:0 14px; font-size:13px; }
.btn[disabled]{ opacity:.55; cursor:not-allowed; }
.drv-pick{ display:flex; flex-direction:column; gap:8px; }
.drv-opt{ display:flex; align-items:center; gap:12px; min-height:52px; padding:8px 12px; border:1px solid var(--line-2); border-radius:var(--r); cursor:pointer; background:var(--surface); }
.drv-opt:hover{ border-color:var(--accent); }
.drv-opt input{ width:18px; height:18px; accent-color:var(--accent); flex-shrink:0; margin:0; }
.drv-opt .t{ flex:1; min-width:0; }
.drv-opt .t b{ display:block; color:var(--ink); font-size:13.5px; overflow-wrap:anywhere; }
.drv-opt .t span{ display:block; color:var(--faint); font-size:12px; }
.drv-opt.sel-on{ border-color:var(--accent); background:var(--accent-soft); }
.dw-acts{ display:flex; gap:8px; flex-wrap:wrap; margin-block-start:14px; }
.dw-acts .btn{ flex:1 1 160px; }
.dw-msg{ margin-block-start:12px; padding:10px 12px; border-radius:var(--r); font-size:13px; display:flex; gap:8px; align-items:flex-start; }
.dw-msg.err{ background:var(--alert-bg); color:var(--alert); }
.dw-msg.info{ background:var(--surface-2); color:var(--muted); }
@media (max-width:560px){
  .pool .bd{ flex:1 1 calc(100% - 42px); }
  .pool .acts{ flex:1 1 100%; margin-inline-start:42px; }
  .pool .acts .btn{ flex:1 1 auto; }
}
.dm-toast{ position:fixed; inset-inline:16px; bottom:20px; margin-inline:auto; max-width:420px; background:var(--nav); color:#fff; padding:12px 16px; border-radius:var(--r); box-shadow:var(--shadow-pop); z-index:120; font-size:13.5px; font-weight:600; text-align:center; }

/* ───────── RESPONSIVE ───────── */
@media (max-width:1439px){
  .dash-grid{ grid-template-columns:minmax(0,1fr); }
  .dash-grid > .col.side{ display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:18px; }
}
@media (max-width:1023px){
  .dm{ grid-template-columns:minmax(0,1fr); }
  .dm-nav{ position:fixed; top:0; bottom:0; inset-inline-start:0; width:min(300px,86vw); height:100%; z-index:80; transform:translateX(-105%);
    transition:transform .22s ease; box-shadow:var(--shadow-pop); visibility:hidden; }
  [dir="rtl"] .dm-nav{ transform:translateX(105%); }
  .dm.nav-open .dm-nav{ transform:none; visibility:visible; }
  .dm-brand{ padding-inline:16px 12px; gap:10px; }
  .dm-brand-t b{ white-space:normal; font-size:14px; }
  .ibtn.dm-nav-x{ display:inline-grid; color:var(--nav-text); flex-shrink:0; }
  .ibtn.dm-nav-x:hover{ background:var(--nav-2); border-color:transparent; color:#fff; }
  .scrim{ display:block; position:fixed; inset:0; background:rgba(14,28,26,.42); z-index:70; opacity:0; pointer-events:none; transition:opacity .2s; }
  .dm.nav-open .scrim{ opacity:1; pointer-events:auto; }
  .ibtn.dm-burger{ display:inline-grid; color:var(--ink); }
  .dm-crumb .mob-brand{ display:grid; }
  .dm-head{ padding:0 12px; gap:6px; }
  .dm-content{ padding:20px 16px 40px; }
  .kpis{ grid-template-columns:repeat(2,minmax(0,1fr)); }
}
@media (max-width:760px){
  .dm-user-t{ display:none; }
  .dm-user{ padding:0; width:44px; justify-content:center; }

  .pg-head h1{ font-size:20px; }
  .kpi{ min-height:0; padding:14px; }
  .kpi-v{ font-size:26px; }
  .sel{ flex:1 1 calc(50% - 5px); }
}
/* the full column set needs ~860px of content width; below that each
   delivery becomes a labelled card instead of scrolling sideways */
@media (max-width:1180px){
  .tbl thead{ position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); }
  .tbl, .tbl tbody, .tbl tr, .tbl td{ display:block; width:100%; }
  .tbl tr{ padding:6px 16px 10px; border-block-end:1px solid var(--line); }
  .tbl tbody tr:last-child{ border-block-end:0; }
  .tbl td{ display:flex; gap:12px; align-items:center; justify-content:space-between; border:0; padding:5px 0; min-width:0; }
  .tbl td::before{ content:attr(data-label); color:var(--faint); font-size:12px; font-weight:700; flex-shrink:0; }
  .tbl td > *{ min-width:0; text-align:end; }
  .tbl td.first{ padding-block-start:0; }
  .tbl td.first::before{ display:none; }
  .tbl td.first{ justify-content:space-between; }
  .tbl .sub{ display:inline; margin-inline-start:6px; }
}
@media (max-width:430px){
  .dm-crumb-t small{ display:none; }
  .dm-tools{ gap:2px; }
  .ibtn.lang{ padding:0 10px; }
  .kpis{ gap:10px; }
  .kpi-l{ font-size:12px; }
  .sel{ flex:1 1 100%; }
  .kv .k{ min-width:92px; }
}
@media (prefers-reduced-motion:reduce){ *{ transition:none !important; } }

  function root(){ return document.getElementById('htmlRoot'); }

    if(m < 60) return T('قبل '+m+' د', m+' min ago');

  /* ───────── ROUTING (the URL hash; no state system) ───────── */
  function parseHash(){
    var m = /^#\/([a-z]+)\/([a-z]+)$/.exec(location.hash || '');
    if(m && itemOf(m[1], m[2])) return { g:m[1], s:m[2] };
    return { g:'dashboard', s:'overview' };
  }
  function onRoute(){
    var r = parseHash();
    var changed = r.g !== route.g || r.s !== route.s;
    route = r; expanded = r.g;
    if(changed){ F = { q:'', driver:'', store:'', timing:'', day:'' }; if(DS) dispatchClose(false); }
    renderNav(); renderView();
    if(mq.matches && isNavOpen()) closeNav(false);
    if(changed){ var v = el('view'); if(v) v.focus({ preventScroll:true }); window.scrollTo(0,0); }
  }

  /* ───────── SIDEBAR ───────── */
  function countFor(it){
    if(!DATA || it.view !== 'list') return null;
    if(!it.stages) return DATA.deliveries.length;
    return DATA.deliveries.filter(function(d){ return it.stages.indexOf(d.stage) > -1; }).length;
  }
  function renderNav(){
    var html = '<ul>' + NAV.map(function(G){
      var open = expanded === G.k, current = route.g === G.k;
      return '<li class="dm-group'+(current?' is-current':'')+'">'
        + '<button class="dm-group-btn" type="button" aria-expanded="'+open+'" aria-controls="sub-'+G.k+'" onclick="DM.toggleGroup(\''+G.k+'\')">'
          + '<i class="ti '+G.ic+'" aria-hidden="true"></i><span class="lbl">'+T(G.ar,G.en)+'</span>'
          + '<i class="ti ti-chevron-right chev" aria-hidden="true"></i></button>'
        + '<ul class="dm-sub" id="sub-'+G.k+'"'+(open?'':' hidden')+'>'
        + G.items.map(function(it){
            var here = current && route.s === it.k, n = countFor(it);
            /* an item that is its own existing page (Driver Management) links there */
            return '<li><a href="'+(it.link || href(G.k,it.k))+'"'+(here?' aria-current="page"':'')+'><span>'+T(it.ar,it.en)+'</span>'
              + (n != null ? '<span class="n">'+n+'</span>'
                 : it.link ? '<i class="ti ti-external-link soon" aria-hidden="true"></i>'
                 : (it.view ? '' : '<span class="soon">'+T('غير مُهيّأ','Not set up')+'</span>'))
              + '</a></li>';
          }).join('')
        + '</ul></li>';
    }).join('') + '</ul>';
    el('navTree').innerHTML = html;
  }
  function isNavOpen(){ return el('shell').classList.contains('nav-open'); }
  function syncNavA11y(){
    var nav = el('dmNav'), open = isNavOpen();
    if(mq.matches){ if(open) nav.removeAttribute('inert'); else nav.setAttribute('inert',''); }
    else nav.removeAttribute('inert');
    el('navOpen').setAttribute('aria-expanded', String(mq.matches && open));
  }
  function openNav(){
    navTrigger = document.activeElement;
    el('shell').classList.add('nav-open'); syncNavA11y();
    var cur = el('navTree').querySelector('[aria-current="page"]') || el('navClose');
    setTimeout(function(){ (cur || el('navClose')).focus(); }, 30);
  }
  function closeNav(restore){
    el('shell').classList.remove('nav-open'); syncNavA11y();
    if(restore !== false && navTrigger && document.contains(navTrigger)) navTrigger.focus();

  /* the recorded moments of each delivery, newest first — no event is invented */

    var out = [];

      var who = d.driver && d.driver.name;
      if(d.assignedAt)  out.push({ at:d.assignedAt,  orderId:d.orderId, who:who, cls:'claim', ic:'ti-hand-grab',
                                   title:(d.assignedVia === 'dispatch' || d.assignedVia === 'reassignment') ? T('أُسند الطلب إلى سائق','Order assigned to a driver') : T('سحب سائق الطلب','Driver claimed the order') });

  /* ───────── EXCEPTIONS + SLA + ESCALATION (Phase E) ─────────

     the page except elapsed/remaining time for display. */
  var EXO = function(){ return OPS && OPS.exceptions; };
  var EXF = { status:'active', category:'', sla:'', q:'' };
  var EX_STATUS = {
    open:          { cls:'wait',  ar:'مفتوح',              en:'Open' },
    escalated:     { cls:'alert', ar:'مُصعّد — يتطلب إجراء الإدارة', en:'Escalated — requires management action' },
    in_management: { cls:'claim', ar:'لدى الإدارة',        en:'With management' },
    closed:        { cls:'done',  ar:'مغلق',               en:'Closed' }
  };
  var SLA_STATE = {
    running:        { cls:'muted', ar:'ضمن المهلة',          en:'Within SLA' },
    approaching:    { cls:'wait',  ar:'اقتراب انتهاء المهلة', en:'SLA approaching' },
    breached:       { cls:'alert', ar:'تجاوز المهلة',         en:'SLA breached' },
    met:            { cls:'done',  ar:'أُغلق ضمن المهلة',     en:'Closed within SLA' },
    breached_closed:{ cls:'alert', ar:'أُغلق بعد تجاوز المهلة', en:'Closed after SLA breach' },
    not_configured: { cls:'muted', ar:'المهلة غير مُهيّأة',   en:'SLA not configured' }
  };
  function catLabel(c){ return c ? (isEn() ? (c.en || c.key) : (c.ar || c.en || c.key)) : '—'; }
  function exChip(map, k){ var m = map[k]; return m ? '<span class="chip '+m.cls+'">'+T(m.ar,m.en)+'</span>' : ''; }
  function dur(ms){
    var neg = ms < 0, m = Math.floor(Math.abs(ms)/60000), s = Math.floor((Math.abs(ms) % 60000)/1000);
    var t = m >= 60 ? Math.floor(m/60) + T(' س ','h ') + (m%60) + T(' د',' min') : m + T(' د ',' min ') + s + T(' ث','s');
    return (neg ? '−' : '') + t;
  }
  function slaText(sla){
    if(!sla || !sla.configured) return T('غير مُهيّأ','Not configured');
    if(sla.state === 'met' || sla.state === 'breached_closed') return T('المدة: ','Took ')+dur(sla.elapsedMs);
    return sla.remainingMs >= 0 ? T('متبقٍ ','Remaining ')+dur(sla.remainingMs) : T('متجاوز بـ ','Over by ')+dur(-sla.remainingMs);
  }
  function exList(){
    var X = EXO(); if(!X) return { ok:false, message:T('وحدة الاستثناءات غير محمّلة.','The exceptions module is not loaded.') };
    return X.list({ status:EXF.status === 'all' ? undefined : EXF.status });
  }
  /* ───────── DISPATCH & OPERATIONS → DELIVERY CONVERSATIONS (Phase H) ─────────
     Read-only history of the Customer ↔ Driver conversations. Access is decided
     by RAFDriverCommunication: management (existing drivers.suspend) may review;
     support only with an associated complaint (no complaint source exists yet,
     so it is refused). Nothing here can send, call or change a message. */
  var CONV = { open:null };
  function viewConversations(){
    var C = window.RAFDriverCommunication;
    var head = pageHead(T('محادثات التوصيل','Delivery Conversations'),
      T('سجل إداري للاطلاع فقط على المحادثات بين العميل والسائق. لا يمكن الإرسال أو التعديل أو الحذف.','Read-only administrative history of customer ↔ driver conversations. Nothing can be sent, edited or deleted.'), refreshBtn());
    if(!C) return head + '<section class="card nc"><h2>'+T('خدمة المحادثات غير محمّلة.','The conversation service is not loaded.')+'</h2></section>';
    var r = C.list();
    if(!r.ok) return head + '<section class="card nc"><h2>'+esc(r.message)+'</h2></section>';
    var rows = r.conversations.length ? '<ul class="list">'+r.conversations.map(function(x){
        return '<li><span class="ic '+(x.closed ? 'done' : (x.active ? 'wait' : 'alert'))+'"><i class="ti ti-messages" aria-hidden="true"></i></span>'

  function exConfirm(){
    if(!DS || DS.mode !== 'exception' || DS.step !== 'confirm') return;
    var X = EXO(), f = DS.form, id = DS.exceptionId, r;
    var b = el('exConfirm'); if(b) b.disabled = true;
    if(DS.action === 'note') r = X.addAction(id, { note:f.note });
    else if(DS.action === 'escalate') r = X.escalate(id, { reasonKey:f.reasonKey || undefined, description:f.description });
    else if(DS.action === 'resolve') r = X.resolve(id, { resolutionType:f.resolutionType, details:f.details });
    else if(DS.action === 'take') r = X.take(id);
    else if(DS.action === 'return') r = X.returnToEmployee(id, { decision:f.decision, driverInstruction:f.driverInstruction });
    else if(DS.action === 'reopen') r = X.reopen(id, { reason:f.reason });
    else if(DS.action === 'eta') r = X.updateEta(DS.id, { etaAt:f.eta ? new Date(f.eta).getTime() : NaN, reason:f.reason });

      var label = T(EX_ACTIONS[DS.action].ar, EX_ACTIONS[DS.action].en);
      DS.step = 'choose'; DS.action = null; DS.form = {}; DS.err = null;
      toast(T('تم: ','Done: ') + label);
      reload(); renderPanel(false);
      return;
    }
    DS.err = (r && r.message) || T('تعذّر تنفيذ الإجراء.','The action could not be completed.');
    DS.step = 'form'; reload(); syncLock(); renderPanel(false);
  }

  /* one business-deadline timer: wakes at the next SLA/penalty threshold so
     the authority records the transition. It is not a synchronisation poll —
     all data still arrives through RAFEventBus. */
  var deadlineTimer = null;
  function scheduleDeadline(){
    if(deadlineTimer){ clearTimeout(deadlineTimer); deadlineTimer = null; }
    var X = EXO(); if(!X || !X.nextDeadline) return;
    var next = X.nextDeadline(); if(!next) return;
    var wait = Math.min(Math.max(next - Date.now() + 250, 250), 2147483000);
    deadlineTimer = setTimeout(function(){ deadlineTimer = null; try { X.evaluate(); } catch(e){} reload(); }, wait);
  }

  /* per-user notification sound (RAFNotify preference; OFF means silent, the record still exists) */

  function beep(){
    try {
      audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
      var o = audioCtx.createOscillator(), g = audioCtx.createGain();
      o.frequency.value = 880; g.gain.value = 0.06; o.connect(g); g.connect(audioCtx.destination);
      o.start(); o.stop(audioCtx.currentTime + 0.18);
    } catch(e){}
  }

    if(F.store)  list = list.filter(function(d){ return d.storeSlug === F.store; });
    if(F.timing) list = list.filter(function(d){ return d.timing === F.timing; });
    if(F.day)    list = list.filter(function(d){
      var t = latest(d); if(!t) return false;
      var dt = new Date(t), iso = dt.getFullYear()+'-'+String(dt.getMonth()+1).padStart(2,'0')+'-'+String(dt.getDate()).padStart(2,'0');
      return iso === F.day;

    if(q) list = list.filter(function(d){

             '<a class="btn" href="raf_driver_management.html"><i class="ti ti-external-link" aria-hidden="true"></i>'+T('إدارة السائقين','Driver Management')+'</a>')
      + '<section class="card" aria-labelledby="h-drv"><div class="card-h"><h2 id="h-drv"><i class="ti ti-steering-wheel" aria-hidden="true"></i>'
      + T(it.ar,it.en)+'</h2><span class="count">'+list.length+'</span></div>' + body
      + '<div class="card-note"><i class="ti ti-info-circle" aria-hidden="true"></i><span>'
      + T('إنشاء الحسابات وتعديلها وإيقافها وتغيير التوفر والجدول يتم من إدارة السائقين. لا تتوفر في رف بيانات مركبات أو تقييمات للسائقين.',
          'Accounts, availability and schedules are managed in Driver Management. RAF holds no driver vehicle or rating data.')
      + (avErr ? ' '+esc(T('التوفر: ','Availability: '))+esc(avErr) : '')+'</span></div></section>';
  }

  /* ───────── DISPATCH & OPERATIONS → ASSIGNMENT ─────────
     Manual dispatch. The board is RAFDeliveryOps.dispatchBoard(): the pools
     arrive already classified and ordered by RAFDriver, so this page never
     sorts, filters or decides eligibility. Assigning goes through the panel
     below, which holds the operation lock and asks for confirmation. */
  var BOARD = null;
  function priorityLabel(){
    var l = BOARD && BOARD.priorityLabel;
    /* the approved label exists in English only; Arabic wording is not approved */
    return l ? (isEn() ? (l.en || '') : (l.ar || l.en || '')) : '';
  }
  function lockChip(lk){
    if(!lk || lk.state === 'none') return '';
    if(lk.state === 'mine')  return '<span class="chip claim"><i class="ti ti-lock" aria-hidden="true"></i>'+T('تعمل عليها أنت','You are working on it')+'</span>';
    if(lk.state === 'stale') return '<span class="chip muted"><i class="ti ti-lock-open" aria-hidden="true"></i>'+T('قفل متوقف — ','Stale lock — ')+esc(lk.ownerName||'')+'</span>';
    return '<span class="chip alert"><i class="ti ti-lock" aria-hidden="true"></i>'+esc(L(lk.label))+'</span>';
  }
  function poolList(list, emptyT){
    if(!list.length) return '<div class="empty"><i class="ti ti-package-off" aria-hidden="true"></i><b>'+esc(emptyT)+'</b></div>';
    return '<ul class="list pool">'+list.map(function(d){
      var entered = d.poolEnteredAt ? T('في القائمة منذ ','In the pool since ')+esc(ago(d.poolEnteredAt)) : T('وقت دخول القائمة غير مسجّل','Pool entry time not recorded');
      /* a returned delivery that was already collected: the goods are not at the store */
      if(d.pickedUpAt) entered += '</span><span class="chip muted"><i class="ti ti-package-export" aria-hidden="true"></i>'+T('استُلم من المتجر مسبقًا','Already collected from the store');
      var locked = d.lock && d.lock.state === 'other';
      return '<li><span class="ic wait"><i class="ti ti-package" aria-hidden="true"></i></span>'
        + '<span class="bd"><b><button class="order-btn" type="button" onclick="DM.open(\''+esc(d.orderId)+'\', this)"><bdi>'+esc(d.orderId)+'</bdi></button>'
        + ' · '+esc(L(d.store)||'—')+'</b>'
        + '<span class="meta"><span>'+esc(d.destination||'—')+'</span><span>'+esc(T(d.itemCount+' قطعة', d.itemCount+' items'))+'</span>'
        + (d.timingText ? '<span>'+esc(d.timingText)+'</span>' : '')+'<span>'+entered+'</span></span></span>'
        + '<span class="acts">'+lockChip(d.lock)
        + '<button class="btn sm'+(locked?'':' primary')+'" type="button" onclick="DM.dispatchOpen(\''+esc(d.orderId)+'\', this)">'
          + '<i class="ti '+(locked?'ti-eye':'ti-user-plus')+'" aria-hidden="true"></i>'+(locked?T('عرض','View'):T('إسناد','Assign'))+'</button></span></li>';
    }).join('')+'</ul>';
  }
  function viewDispatch(){
    BOARD = OPS.dispatchBoard();
    if(!BOARD.ok) return '<section class="card nc"><h2>'+esc(BOARD.message||'')+'</h2></section>';
    var b = BOARD, notes = '';
    if(!b.lockPolicy.configured)
      notes += '<section class="card"><div class="nc-inline"><i class="ti ti-lock-cog" aria-hidden="true"></i><div>'
        + '<span class="nc-tag"><i class="ti ti-tool" aria-hidden="true"></i>'+T('غير مُهيّأ','Not configured')+'</span>'
        + '<b>'+T('مدة أقفال العمليات غير مُهيّأة','Operation lock timing is not configured')+'</b>'
        + '<span>'+T('لم تُضبط قيم نبض القفل ومدة توقفه في إعدادات رف بعد. لا يمكن فتح توصيل للعمل عليه أو إسناده حتى تُضبط، ولا تُستخدم أي مدة افتراضية.',
                     'The lock heartbeat and stale durations have not been set in RAF configuration yet. No delivery can be opened for work or assigned until they are, and no default duration is used.')+'</span></div></div></section>';
    else if(b.lockPolicy.temporary)
      notes += '<section class="card"><div class="nc-inline"><i class="ti ti-lock-cog" aria-hidden="true"></i><div>'
        + '<span class="nc-tag"><i class="ti ti-flask" aria-hidden="true"></i>'+T('إعداد مؤقت','Temporary')+'</span>'
        + '<span>'+T('مدد أقفال العمليات قيم مؤقتة لبيئة النموذج الأولي، وليست قرار عمل معتمدًا، ويمكن تغييرها من الإعدادات.',
                     'Operation lock timings are temporary prototype values, not an approved business decision, and can be changed in configuration.')+'</span></div></div></section>';
    if(!b.canAssign)
      notes += '<section class="card"><div class="nc-inline"><i class="ti ti-eye" aria-hidden="true"></i><div><b>'+T('للعرض فقط','View only')+'</b>'
        + '<span>'+T('حسابك يطّلع على الإسناد لكنه لا يملك صلاحية إسناد التوصيلات.','Your account can view assignment but does not have permission to assign deliveries.')+'</span></div></div></section>';

    var prio = '<section class="card" aria-labelledby="h-prio"><div class="card-h"><h2 id="h-prio"><i class="ti ti-flag-3" aria-hidden="true"></i>'
      + '<span class="pool-h-label"><bdi>'+esc(priorityLabel())+'</bdi></span></h2><span class="count">'+b.pool.priority.length+'</span></div>'
      + poolList(b.pool.priority, T('لا توجد توصيلات مُعادة بأولوية','No priority reassigned deliveries'))
      + '<div class="card-note"><i class="ti ti-info-circle" aria-hidden="true"></i><span>'
      + T('توصيلات أُعيدت إلى القائمة بعد أكثر من 5 دقائق، مرتبة حسب أقرب موعد وصول موعود.','Deliveries returned to the pool after more than 5 minutes, ordered by the closest promised arrival.')+'</span></div></section>';
    var reg = '<section class="card" aria-labelledby="h-reg"><div class="card-h"><h2 id="h-reg"><i class="ti ti-list" aria-hidden="true"></i>'
      + T('القائمة العادية','Regular pool')+'</h2><span class="count">'+b.pool.regular.length+'</span></div>'
      + poolList(b.pool.regular, T('لا توجد توصيلات بانتظار سائق','No deliveries waiting for a driver'))
      + '<div class="card-note"><i class="ti ti-info-circle" aria-hidden="true"></i><span>'
      + T('الأقدم دخولًا إلى القائمة أولًا.','Oldest pool entry first.')+'</span></div></section>';
    var prog = withDriversCard(b);
    var reqs = requestsCard(b);
    var closed = '<section class="card" aria-labelledby="h-closed"><div class="card-h"><h2 id="h-closed"><i class="ti ti-circle-check" aria-hidden="true"></i>'
      + T('تم التوصيل اليوم','Delivered today')+'</h2><span class="count">'+b.closedToday.length+'</span></div>'
      + rowsTable(b.closedToday, { caption:T('تم التوصيل اليوم','Delivered today'), emptyT:T('لا توجد توصيلات مكتملة اليوم','No deliveries completed today') })
      + '</section>';
    var drivers = '<section class="card" aria-labelledby="h-drvs"><div class="card-h"><h2 id="h-drvs"><i class="ti ti-steering-wheel" aria-hidden="true"></i>'
      + T('السائقون النشطون','Active drivers')+'</h2><span class="count">'+b.drivers.length+'</span></div>'
      + (b.drivers.length ? '<ul class="list">'+b.drivers.map(function(d){
          return '<li><span class="dm-av" aria-hidden="true" style="width:32px;height:32px">'+esc(initials(d.name))+'</span><span class="bd"><b>'+esc(d.name||'—')+'</b>'
            + '<span>'+esc(T('توصيلات جارية: '+d.liveDeliveries, 'Live deliveries: '+d.liveDeliveries))+'</span></span></li>';
        }).join('')+'</ul>'
        : '<div class="empty"><i class="ti ti-user-off" aria-hidden="true"></i><b>'+T('لا يوجد سائقون نشطون','No active drivers')+'</b></div>')
      + '<div class="card-note"><i class="ti ti-info-circle" aria-hidden="true"></i><span>'
      + T('الأهلية حسب حالة الحساب (نشط) فقط. لا توجد في رف حالة توفّر أو موقع للسائق، ولا يوجد إسناد تلقائي.',
          'Eligibility is account status (active) only. RAF holds no driver availability or location, and nothing is assigned automatically.')+'</span></div></section>';

    return pageHead(T('الإسناد','Assignment'), T('إسناد يدوي: اختر توصيلًا من القائمة، ثم سائقًا نشطًا، ثم أكّد.','Manual dispatch: choose a pool delivery, then an active driver, then confirm.'),
             '<span class="live-pill"><b aria-hidden="true"></b>'+T('بيانات مباشرة','Live data')+'</span>'+refreshBtn())
      + notes
      + '<div class="dash-grid"><div class="col">'+reqs+prio+reg+prog+closed+'</div><div class="col side">'+drivers+'</div></div>';
  }

  /* ───────── REASSIGNMENT (Phase D) ─────────
     Deliveries with drivers can be managed (reassign / return to pool) and
     pending driver requests reviewed. Every action opens the operations panel,
     which holds the lock and asks for confirmation. */
  function withDriversCard(b){
    var list = b.inProgress;
    var body = list.length ? '<ul class="list pool">'+list.map(function(d){
        var locked = d.lock && d.lock.state === 'other';
        return '<li><span class="ic '+(d.stage === 'out_for_delivery' ? 'out' : 'claim')+'"><i class="ti '+(STAGE[d.stage] ? STAGE[d.stage].ic : 'ti-point')+'" aria-hidden="true"></i></span>'
          + '<span class="bd"><b><button class="order-btn" type="button" onclick="DM.open(\''+esc(d.orderId)+'\', this)"><bdi>'+esc(d.orderId)+'</bdi></button>'
          + ' · '+esc(L(d.store)||'—')+'</b>'
          + '<span class="meta"><span>'+esc((d.driver && d.driver.name) || '—')+'</span>'+chip(d.stage)
          + (d.pendingRequest ? '<span class="chip alert"><i class="ti ti-arrows-exchange" aria-hidden="true"></i>'+T('طلب إعادة إسناد معلّق','Reassignment request pending')+'</span>' : '')
          + (d.assignedAt ? '<span>'+esc(T('منذ ','Since ')+ago(d.assignedAt))+'</span>' : '')+'</span></span>'
          + '<span class="acts">'+lockChip(d.lock)
          + '<button class="btn sm" type="button" onclick="DM.manageOpen(\''+esc(d.orderId)+'\', this)"><i class="ti '+(locked?'ti-eye':'ti-adjustments')+'" aria-hidden="true"></i>'
          + (locked ? T('عرض','View') : T('إدارة','Manage'))+'</button></span></li>';
      }).join('')+'</ul>'
      : '<div class="empty"><i class="ti ti-truck-off" aria-hidden="true"></i><b>'+T('لا توجد توصيلات لدى السائقين الآن','No deliveries are with drivers right now')+'</b></div>';
    return '<section class="card" aria-labelledby="h-prog"><div class="card-h"><h2 id="h-prog"><i class="ti ti-truck-delivery" aria-hidden="true"></i>'
      + T('لدى السائقين','With drivers')+'</h2><span class="count">'+list.length+'</span></div>' + body
      + '<div class="card-note"><i class="ti ti-info-circle" aria-hidden="true"></i><span>'
      + T('إعادة الإسناد والإعادة إلى القائمة يدويتان فقط، ولا تلغيان الطلب ولا تغيّران أي مبلغ أو مخزون.','Reassignment and return to pool are manual only; they never cancel the order or change any amount or stock.')+'</span></div></section>';
  }
  function requestsCard(b){
    var list = b.requests || [];
    return '<section class="card" aria-labelledby="h-reqs"><div class="card-h"><h2 id="h-reqs"><i class="ti ti-arrows-exchange" aria-hidden="true"></i>'
      + T('طلبات إعادة الإسناد من السائقين','Driver reassignment requests')+'</h2><span class="count">'+list.length+'</span></div>'
      + (list.length ? '<ul class="list pool">'+list.map(function(r){
          return '<li><span class="ic alert"><i class="ti ti-hand-stop" aria-hidden="true"></i></span>'
            + '<span class="bd"><b><bdi>'+esc(r.orderId)+'</bdi> · '+esc(r.driverName||'—')+'</b>'
            + '<span class="meta"><span>'+esc(r.reason||'')+'</span><span>'+esc(ago(r.at)||'')+'</span></span></span>'
            + '<span class="acts"><button class="btn sm primary" type="button" onclick="DM.manageOpen(\''+esc(r.orderId)+'\', this)">'
            + '<i class="ti ti-gavel" aria-hidden="true"></i>'+T('مراجعة','Review')+'</button></span></li>';
        }).join('')+'</ul>'
        : '<div class="empty"><i class="ti ti-checks" aria-hidden="true"></i><b>'+T('لا توجد طلبات معلّقة','No pending requests')+'</b></div>')
      + '</section>';
  }
  function viewReassign(){
    BOARD = OPS.dispatchBoard();
    if(!BOARD.ok) return '<section class="card nc"><h2>'+esc(BOARD.message||'')+'</h2></section>';
    return pageHead(T('إعادة الإسناد','Reassignment'), T('طلبات السائقين والتوصيلات التي لدى السائقين: إعادة إسناد يدوية أو إعادة إلى القائمة.','Driver requests and deliveries with drivers: manual reassignment or return to pool.'),
             '<span class="live-pill"><b aria-hidden="true"></b>'+T('بيانات مباشرة','Live data')+'</span>'+refreshBtn())
      + '<div class="stack">'+requestsCard(BOARD)+withDriversCard(BOARD)+'</div>';
  }

  /* the Manage panel for a delivery a driver owns */
  var HIST_KIND = {
    claim:            { ar:'سحب السائق الطلب',      en:'Driver claimed' },
    dispatch:         { ar:'إسناد يدوي',            en:'Manual assignment' },
    reassignment:     { ar:'إعادة إسناد',           en:'Reassignment' },
    returned_to_pool: { ar:'إعادة إلى القائمة',     en:'Returned to pool' },
    transfer:         { ar:'نقل ملكية',             en:'Ownership transfer' }
  };
  var REQ_TYPE = {
    submitted:{ ar:'طلب السائق إعادة الإسناد', en:'Driver requested reassignment' },
    cancelled:{ ar:'ألغى السائق الطلب',        en:'Driver cancelled the request' },
    approved: { ar:'تمت الموافقة على الطلب',   en:'Request approved' },
    rejected: { ar:'رُفض الطلب — يتابع السائق', en:'Request rejected — driver continues' }
  };
  function historyBlock(id){
    var h = OPS.history(id); if(!h.ok) return '';
    var rows = [];
    h.ownership.forEach(function(r){
      var k = HIST_KIND[r.kind] || { ar:r.kind, en:r.kind };
      var who = r.kind === 'returned_to_pool'
        ? (r.fromDriverName||'—') + ' → ' + T('القائمة','pool') + ' (' + (r.pool === 'priority' ? T('أولوية','priority') : T('عادية','regular')) + ')'
        : (r.fromDriverName ? r.fromDriverName + ' → ' : '') + (r.toDriverName||'—');
      rows.push({ at:r.at, t:T(k.ar,k.en), s:who + (r.actor && r.actor.type === 'staff' && r.actor.name ? ' · ' + r.actor.name : '') + (r.pickedUpAt ? ' · ' + T('بعد الاستلام','after pickup') : ''), reason:r.reason });
    });
    h.requests.forEach(function(e){
      var k = REQ_TYPE[e.type] || { ar:e.type, en:e.type };
      rows.push({ at:e.at, t:T(k.ar,k.en), s:(e.actor && e.actor.name) || '', reason:e.reason });
    });
    rows.sort(function(a,b){ return a.at - b.at; });
    return rows.length ? '<div class="tml">'+rows.map(function(r){
        return '<div class="tml-s done"><span class="dot" aria-hidden="true"><i class="ti ti-point"></i></span><span><b>'+esc(r.t)+'</b>'
          + '<span>'+esc(kwTime(r.at)||'')+(r.s ? ' · '+esc(r.s) : '')+'</span>'
          + (r.reason ? '<span>'+T('السبب: ','Reason: ')+esc(r.reason)+'</span>' : '')+'</span></div>';
      }).join('')+'</div>'
      : '<div class="kv"><span class="v" style="color:var(--muted);font-weight:500">'+T('لا يوجد سجل ملكية مسجّل لهذا التوصيل.','No ownership history is recorded for this delivery.')+'</span></div>';
  }
  var ACTIONS = {
    reassign:         { ar:'إعادة الإسناد',                 en:'Reassign',                    ic:'ti-arrows-exchange', needsDriver:true },
    'return':         { ar:'إعادة إلى القائمة',             en:'Return to pool',              ic:'ti-arrow-back-up',   reasonRequired:true },
    approve_reassign: { ar:'الموافقة وإعادة الإسناد',       en:'Approve & reassign',          ic:'ti-arrows-exchange', needsDriver:true },
    approve_return:   { ar:'الموافقة وإعادة إلى القائمة',   en:'Approve & return to pool',    ic:'ti-arrow-back-up',   reasonRequired:true },
    reject:           { ar:'رفض — يتابع السائق التوصيل',    en:'Reject — driver continues',   ic:'ti-player-play' }
  };
  function renderManage(focus){
    var d = ownedItem(DS.id);
    function kv(k,v){ return '<div class="kv"><span class="k">'+k+'</span><span class="v">'+v+'</span></div>'; }
    var body = '';
    if(!d){
      if(DS.lock === 'mine'){ stopHeartbeat(); try { OPS.releaseLock(DS.id); } catch(e){} DS.lock = 'none'; }
      body = '<div class="dw-msg info"><i class="ti ti-info-circle" aria-hidden="true"></i><span>'
        + esc(DS.err || T('لم يعد هذا التوصيل لدى سائق. تم تحديث البيانات.','This delivery is no longer with a driver. The data has been refreshed.'))+'</span></div>'
        + (DS.info ? '<div class="dw-msg info"><i class="ti ti-check" aria-hidden="true"></i><span>'+esc(DS.info)+'</span></div>' : '')
        + '<section class="dw-sec"><h3><i class="ti ti-history" aria-hidden="true"></i>'+T('السجل','History')+'</h3>'+historyBlock(DS.id)+'</section>'
        + '<div class="dw-acts"><button class="btn" type="button" onclick="DM.dispatchClose()">'+T('إغلاق','Close')+'</button></div>';
    } else {
      /* the owner changed under us: work from the new state, never the old one */
      if(DS.expectedDriverId && DS.expectedDriverId !== d.driverId && DS.step !== 'choose'){
        DS.step = 'choose'; DS.action = null; DS.err = T('تغيّر السائق المسؤول أثناء العمل. راجع الحالة الحالية.','The responsible driver changed while you were working. Review the current state.');
      }
      DS.expectedDriverId = d.driverId;
      var pend = d.pendingRequest;
      if((pend ? pend.requestId : null) !== DS.requestId){
        if(DS.step !== 'choose') DS.err = T('تغيّرت حالة طلب إعادة الإسناد. راجع الحالة الحالية.','The reassignment request changed. Review the current state.');
        DS.step = 'choose'; DS.action = null; DS.requestId = pend ? pend.requestId : null;
      }
      var picked = !!d.pickedUpAt;
      body = '<section class="dw-sec"><h3><i class="ti ti-package" aria-hidden="true"></i>'+T('التوصيل','Delivery')+'</h3>'
        + kv(T('الطلب','Order'), '<bdi>'+esc(d.orderId)+'</bdi>')
        + kv(T('المتجر','Store'), esc(L(d.store)||'—'))
        + kv(T('الوجهة','Destination'), esc(d.destination||'—'))
        + kv(T('الحالة','Status'), chip(d.stage))
        + kv(T('السائق الحالي','Current driver'), '<b>'+esc((d.driver && d.driver.name)||'—')+'</b>')
        + kv(T('الاستلام من المتجر','Picked up'), picked ? esc(kwTime(d.pickedUpAt)) : T('لم يُستلم بعد','Not yet'))
        + '</section>';
      if(pend) body += '<section class="dw-sec"><h3><i class="ti ti-hand-stop" aria-hidden="true"></i>'+T('طلب إعادة إسناد معلّق','Pending reassignment request')+'</h3>'
        + kv(T('السائق','Driver'), esc(pend.driverName||'—')) + kv(T('السبب','Reason'), esc(pend.reason||'—')) + kv(T('وقت الطلب','Requested'), esc(kwTime(pend.at)||'—'))
        + '<div class="dw-foot"><i class="ti ti-info-circle" aria-hidden="true"></i><span>'+T('إجراءات السائق متوقفة حتى تبت في الطلب.','The driver’s delivery actions are paused until you decide.')+'</span></div></section>';
      var s = '<section class="dw-sec"><h3><i class="ti ti-adjustments" aria-hidden="true"></i>'+T('الإجراء','Action')+'</h3>';
      var lb = lockBlock();
      var drivers = ((BOARD && BOARD.ok) ? BOARD.drivers : []).filter(function(x){ return x.id !== d.driverId; });
      var chosen = drivers.filter(function(x){ return x.id === DS.driverId; })[0] || null;
      var A = DS.action ? ACTIONS[DS.action] : null;
      var reasonRequired = A && (A.reasonRequired || (A.needsDriver && picked));
      if(lb !== null){
        s += lb;
      } else if(!BOARD.canAssign){
        s += '<div class="dw-msg info"><i class="ti ti-eye" aria-hidden="true"></i><span>'+T('حسابك لا يملك صلاحية إدارة التوصيلات.','Your account does not have permission to manage deliveries.')+'</span></div>';
      } else if(DS.step === 'choose'){
        var keys = pend ? ['approve_reassign','approve_return','reject'] : ['reassign','return'];
        s += '<div class="dw-acts" style="flex-direction:column">'+keys.map(function(k){
            return '<button class="btn'+(k === 'reject' ? '' : ' primary')+'" type="button" onclick="DM.manageAction(\''+k+'\')"><i class="ti '+ACTIONS[k].ic+'" aria-hidden="true"></i>'+T(ACTIONS[k].ar, ACTIONS[k].en)+'</button>';
          }).join('')
          + '<button class="btn" type="button" onclick="DM.dispatchClose()">'+T('إغلاق','Close')+'</button></div>';
      } else if(DS.step === 'form'){
        s += '<div class="dw-msg info"><i class="ti '+A.ic+'" aria-hidden="true"></i><span><b>'+T(A.ar, A.en)+'</b></span></div>';
        if(A.needsDriver){
          s += drivers.length ? '<fieldset style="border:0;margin:0 0 12px;padding:0"><legend class="sr-only">'+T('اختر السائق البديل','Choose the replacement driver')+'</legend><div class="drv-pick">'
              + drivers.map(function(x){

  function manageConfirm(){
    if(!DS || DS.step !== 'confirm' || !DS.action) return;
    var btn = el('dsConfirm'); if(btn) btn.disabled = true;
    var id = DS.id, reason = DS.reason, r;
    var chosen = ((BOARD && BOARD.ok) ? BOARD.drivers : []).filter(function(x){ return x.id === DS.driverId; })[0];
    var base = { expectedDriverId:DS.expectedDriverId };
    if(DS.action === 'reassign') r = OPS.reassign(id, Object.assign({ toDriverId:DS.driverId, reason:reason }, base));
    else if(DS.action === 'return') r = OPS.returnToPool(id, Object.assign({ reason:reason }, base));
    else r = OPS.decideRequest(id, Object.assign({ requestId:DS.requestId, decision:DS.action, reason:reason,
               toDriverId:DS.action === 'approve_reassign' ? DS.driverId : undefined }, base));
    if(r.ok){
      stopHeartbeat(); DS.lock = r.lockReleased ? 'none' : DS.lock;
      var msg = r.kind === 'return_to_pool'
        ? T('أُعيد ','Returned ')+id+T(' إلى القائمة ',' to the ')+(r.pool === 'priority' ? T('(أولوية)','priority pool') : T('(العادية)','regular pool'))
        : r.kind === 'reassignment' ? T('أُعيد إسناد ','Reassigned ')+id+T(' إلى ',' to ')+((chosen && chosen.name)||'')
        : T('رُفض الطلب ويتابع السائق التوصيل','Request rejected; the driver continues');
      dispatchClose(); toast(msg); reload();
      return;
    }
    DS.err = r.message || T('تعذّر تنفيذ العملية.','The operation could not be completed.');
    if(r.lockReleased) DS.lock = 'none';
    DS.step = 'form';
    if(['OWNERSHIP_CHANGED','REQUEST_PENDING','REQUEST_CHANGED','NO_PENDING_REQUEST','NOT_OWNED','NOT_REASSIGNABLE'].indexOf(r.code) > -1){ DS.step = 'choose'; DS.action = null; }
    reload();
    syncLock(); if(DS.lock === 'mine') scheduleHeartbeat();
    renderPanel(false);
  }

  /* ───────── ASSIGNMENT PANEL ─────────
     Opening a delivery claims its operation lock (RAFDeliveryOps). The panel
     is read-only unless this employee holds the lock. Nothing is assigned on
     selection: a driver is chosen, the summary is confirmed, and only then is
     RAFDeliveryOps.assign called — which revalidates everything itself. */
  var DS = null, hbTimer = null;
  function stopHeartbeat(){ if(hbTimer){ clearTimeout(hbTimer); hbTimer = null; } }
  /* the lock heartbeat is a lock-liveness timer at the CONFIGURED interval —
     it is not a data refresh and does not run when the policy is unset */
  function scheduleHeartbeat(){
    stopHeartbeat();
    var pol = OPS.lockPolicy();
    if(!DS || DS.lock !== 'mine' || !pol.configured) return;
    hbTimer = setTimeout(function(){
      if(!DS || DS.lock !== 'mine') return;
      var r = OPS.heartbeatLock(DS.id);
      if(r.ok) scheduleHeartbeat();
      else { syncLock(); renderPanel(); }
    }, pol.heartbeatMs);
  }
  function syncLock(){
    if(!DS) return;
    var l = OPS.lockOf(DS.id);
    if(!l.ok){ DS.lock = 'error'; DS.err = l.message; return; }
    if(!l.policyConfigured){ DS.lock = 'not_configured'; return; }
    if(!l.lock) DS.lock = DS.lock === 'mine' ? 'lost' : 'none';
    else if(l.lock.stale) DS.lock = 'stale';
    else DS.lock = l.lock.ownerUserId === ME.id ? 'mine' : 'other';
    DS.lockInfo = l.lock;
  }
  function acquireFor(id){
    var r = OPS.acquireLock(id);
    if(r.ok){ DS.lock = 'mine'; DS.lockInfo = r.lock; scheduleHeartbeat(); return; }
    DS.lockInfo = r.lock || null;
    DS.lock = r.code === 'LOCK_POLICY_NOT_CONFIGURED' ? 'not_configured' : r.code === 'LOCKED' ? 'other'
            : r.code === 'LOCK_STALE' ? 'stale' : 'error';
    if(DS.lock === 'error') DS.err = r.message;
  }
  function dispatchOpen(id, trigger, mode, exceptionId){
    if(DS) dispatchClose(false);
    openId = null;
    DS = { id:id, mode:(mode === 'manage' || mode === 'exception') ? mode : 'dispatch', step:mode === 'manage' ? 'choose' : 'select', form:{}, exceptionId:null,
           action:null, driverId:null, reason:'', err:null, info:null, lock:'none', lockInfo:null, done:false,
           expectedDriverId:null, requestId:null };
    if(DS.mode === 'exception'){ DS.exceptionId = exceptionId || null; DS.step = 'choose'; }
    if(DS.mode === 'manage'){ var it0 = ownedItem(id); if(it0){ DS.expectedDriverId = it0.driverId; DS.requestId = it0.pendingRequest ? it0.pendingRequest.requestId : null; } }
    drawerTrigger = trigger || document.activeElement;
    acquireFor(id);
    renderPanel(true);
  }
  function dispatchClose(restore){
    stopHeartbeat();
