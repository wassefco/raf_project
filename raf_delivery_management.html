      + '<div class="nc-ic"><i class="ti '+G.ic+'" aria-hidden="true"></i></div>'
      + '<span class="nc-tag"><i class="ti ti-tool" aria-hidden="true"></i>'+esc(T(G.ar,G.en)+' · '+T(it.ar,it.en))+'</span>'
      + '<h1 id="h-nc" class="sr-only">'+esc(T(it.ar,it.en))+'</h1>'
      + '<h2>'+esc(title)+'</h2><p>'+esc(reasonFor(G.k, it.k))+'</p>'
      + (actions ? '<div class="pg-actions">'+actions+'</div>' : '')
      + '</section>';
  }

  function renderView(){
    if(!DATA) return;
    renderHeader();
    var G = groupOf(route.g), it = itemOf(route.g, route.s), html;
    if(it.view === 'overview') html = viewOverview();
    else if(it.view === 'exceptions') html = viewExceptions();
    else if(it.view === 'list') html = viewList(it);
    else if(it.view === 'drivers') html = viewDrivers(it);
    else if(it.view === 'dispatch') html = viewDispatch();
    else if(it.view === 'reassign') html = viewReassign();
    else if(it.view === 'exlist') html = viewExceptionList();
    else if(it.view === 'conversations') html = viewConversations();
    else if(it.view === 'compensation') html = viewCompensation();
    else if(it.view === 'driverperf') html = viewDriverPerformance();
    else if(it.view === 'reports') html = viewReports();
    else html = viewNotConfigured(G, it);
    scheduleDeadline();
    el('view').innerHTML = html;
    if(it.view === 'conversations') mountConversation();
    if(it.view === 'compensation') mountCompensation();
    if(it.view === 'driverperf') mountDriverPerformance();
    if(it.view === 'reports') mountReports();
    if(openId) renderDrawer();
    else if(DS){
      /* the panel reads the board; outside the dispatch views refresh it here */
      if(it.view !== 'dispatch' && it.view !== 'reassign') BOARD = OPS.dispatchBoard();
      syncLock(); renderPanel(false);
    }
  }

  /* ───────── DETAIL DRAWER (read-only) ───────── */
  function renderDrawer(){
    var res = OPS.detail(openId, { actor:ME.id });
    if(!res.ok){ closeDrawer(); return; }
    var d = res.delivery;
    var items = d.items.map(function(x){
      var v = x.variant || {}, bits = Object.keys(v).map(function(k){ return k+': '+v[k]; });
      if(!bits.length && x.meta) bits.push(L(x.meta));
      return '<div class="dw-item"><span class="q">'+x.qty+'×</span><span class="n">'+esc(L(x.name)||'—')
        + (bits.length?'<span>'+esc(bits.join(' · '))+'</span>':'')+'</span>'+(x.price!=null?'<span class="q">'+esc(x.price)+'</span>':'')+'</div>';
    }).join('');
    var tml = res.timeline.map(function(s){
      return '<div class="tml-s'+(s.done?' done':'')+'"><span class="dot" aria-hidden="true"><i class="ti '+(s.done?'ti-check':'ti-point')+'"></i></span>'
        + '<span><b>'+T(s.ar,s.en)+'</b><span>'+(s.at?esc(kwTime(s.at)):(s.done?T('تم','Done'):T('لم يحدث بعد','Not yet')))+'</span></span></div>';
    }).join('');
    function kv(k,v){ return '<div class="kv"><span class="k">'+k+'</span><span class="v">'+v+'</span></div>'; }
    var drv = d.driver
      ? kv(T('الاسم','Name'), esc(d.driver.name||'—')+(d.driver.status==='suspended'?' <span class="chip alert">'+T('موقوف','Suspended')+'</span>':''))
        + (d.driver.phone ? kv(T('الهاتف','Phone'), '<bdi>'+esc(d.driver.phone)+'</bdi>') : '')
        + kv((d.assignedVia === 'dispatch' || d.assignedVia === 'reassignment') ? T('وقت الإسناد','Assigned at') : T('وقت السحب','Claimed at'), esc(kwTime(d.assignedAt)||'—'))
        + kv(T('وقت الاستلام','Picked up at'), esc(kwTime(d.pickedUpAt)||'—'))
        + kv(T('وقت التسليم','Delivered at'), esc(kwTime(d.deliveredAt)||'—'))
        + (between(d.pickedUpAt,d.deliveredAt) ? kv(T('مدة التوصيل','Delivery duration'), esc(between(d.pickedUpAt,d.deliveredAt))) : '')
        + (d.driver.phone ? '<a class="btn dw-call" href="tel:'+esc(String(d.driver.phone).replace(/\s/g,''))+'"><i class="ti ti-phone" aria-hidden="true"></i>'+T('اتصال بالسائق','Call the driver')+'</a>' : '')
      : '<div class="kv"><span class="v" style="color:var(--muted);font-weight:500">'+T('هذا التوصيل ليس لدى أي سائق بعد.','No driver has this delivery yet.')+'</span></div>'
        + (d.stage === 'awaiting_driver' ? '<a class="btn dw-call" href="'+href('dispatch','assignment')+'" onclick="DM.close()"><i class="ti ti-route" aria-hidden="true"></i>'+T('الإسناد اليدوي','Manual assignment')+'</a>' : '');
    el('drawerHost').innerHTML =
      '<div class="dw" id="dw" onclick="if(event.target===this)DM.close()">'
      + '<div class="dw-c" role="dialog" aria-modal="true" aria-labelledby="dwT">'
        + '<div class="dw-h"><div class="t"><b id="dwT"><bdi>'+esc(d.orderId)+'</bdi></b><span>'+esc(L(d.store)||'—')+'</span></div>'+chip(d.stage)
          + '<button class="ibtn dw-x" type="button" onclick="DM.close()" aria-label="'+esc(T('إغلاق','Close'))+'"><i class="ti ti-x" aria-hidden="true"></i></button></div>'
        + '<div class="dw-b">'
          + '<section class="dw-sec"><h3><i class="ti ti-timeline" aria-hidden="true"></i>'+T('مسار التوصيل','Delivery progress')+'</h3><div class="tml">'+tml+'</div></section>'
          + '<section class="dw-sec"><h3><i class="ti ti-steering-wheel" aria-hidden="true"></i>'+T('السائق','Driver')+'</h3>'+drv+'</section>'
          + '<section class="dw-sec"><h3><i class="ti ti-user" aria-hidden="true"></i>'+T('العميل','Customer')+'</h3>'
            + kv(T('الاسم','Name'), esc(d.customer.name||'—'))
            + kv(T('الهاتف','Phone'), '<bdi>'+esc(d.customer.phone||'—')+'</bdi>')
            + kv(T('العنوان','Address'), esc(d.address||d.destination||'—'))
            + (d.instructions ? kv(T('تعليمات','Instructions'), esc(d.instructions)) : '')
          + '</section>'
          + '<section class="dw-sec"><h3><i class="ti ti-shopping-bag" aria-hidden="true"></i>'+T('الطلب','Order')+' · '+d.itemCount+' '+T('قطعة','items')+'</h3>'+items
            + kv(T('الإجمالي','Total'), esc(d.total||'—')+' '+T('د.ك','KWD'))
            + kv(T('طريقة الدفع','Payment'), esc(L(d.payment.method)||'—'))
            + (d.timingText ? kv(T('توقيت التوصيل','Delivery timing'), esc(d.timingText)) : '')
            + kv(T('موعد التوصيل','Delivery commitment'), d.commitment ? esc(d.commitment) : '<span style="color:var(--faint)">'+T('غير متاح','Not available')+'</span>')
          + '</section>'
          + '<div class="dw-foot"><i class="ti ti-eye" aria-hidden="true"></i><span>'
            + T('للمتابعة فقط. الإسناد اليدوي من «التشغيل والتوزيع ← الإسناد»؛ السحب والاستلام والتسليم من تطبيق السائق.','View only. Manual assignment is under “Dispatch & Operations → Assignment”; claiming, pickup and delivery happen in the Driver App.')+'</span></div>'
        + '</div></div></div>';
    var x = el('dw').querySelector('.dw-x'); if(x) x.focus();
  }
  function closeDrawer(){
    openId = null; el('drawerHost').innerHTML = '';
    if(drawerTrigger && document.contains(drawerTrigger)) drawerTrigger.focus();
    drawerTrigger = null;
  }

  /* ───────── POPOVERS ───────── */
  function closePops(except){
    [['notif','notifBtn','notifPop'],['user','userBtn','userPop']].forEach(function(p){
      if(p[0] === except) return;
      el(p[2]).hidden = true; el(p[1]).setAttribute('aria-expanded','false');
    });
  }
  function togglePop(k){
    var ids = k === 'notif' ? ['notifBtn','notifPop'] : ['userBtn','userPop'];
    var open = el(ids[1]).hidden;
    closePops(k);
    el(ids[1]).hidden = !open; el(ids[0]).setAttribute('aria-expanded', String(open));
  }
  document.addEventListener('click', function(e){
    if(!e.target.closest || !e.target.closest('.pop-wrap')) closePops();
  });
  document.addEventListener('keydown', function(e){
    if(e.key !== 'Escape') return;
    if(openId){ e.preventDefault(); closeDrawer(); return; }
    if(DS){ e.preventDefault(); dispatchClose(); return; }
    if(!el('notifPop').hidden || !el('userPop').hidden){ closePops(); return; }
    if(mq.matches && isNavOpen()){ closeNav(); }
  });

  /* ───────── LANGUAGE (the existing raf_lang preference) ───────── */
  function applyLang(){
    var en = isEn();
    document.querySelectorAll('[data-ar][data-en]').forEach(function(e){
      var t = e.getAttribute('data-'+(en?'en':'ar')); if(t !== null) e.textContent = t;
    });
  }
  function toggleLang(){
    var r = root(), en = r.lang === 'en';
    r.lang = en ? 'ar' : 'en'; r.dir = en ? 'rtl' : 'ltr';
    try { localStorage.setItem('raf_lang', r.lang); } catch(e){}
    applyLang(); renderHeader(); renderNav(); renderView(); renderNotifs();
    el('langBtn').focus();
  }

  /* ───────── DATA ───────── */
  function gate(tAr,tEn,msg){
    el('shell').hidden = true; el('gate').hidden = false; el('drawerHost').innerHTML = '';
    el('gateT').textContent = T(tAr,tEn); el('gateP').textContent = msg;
    document.title = T('رف — إدارة اللوجستيات','RAF — Logistics Management');
  }
  function load(){
    var res = OPS.board({ actor:ME.id });
    /* the signed-in account changed in another tab: ask again as whoever is
       signed in now, so they get their own answer rather than a mismatch */
    if(!res.ok && res.code === 'OTHER_ACTOR'){
      res = OPS.board({});
      if(res.ok){ var me = RAFPerm.currentUser(); ME = { id:me.id, name:me.name, roleId:me.roleId }; renderHeader(); }
    }
    if(!res.ok){ DATA = null; gate('لا تملك صلاحية الوصول إلى إدارة اللوجستيات','You do not have access to Logistics Management', res.message); return false; }
    DATA = res; el('gate').hidden = true; el('shell').hidden = false; return true;
  }
  function reload(){ if(load()){ renderNav(); renderView(); renderNotifs(); } }

  /* ───────── STAFF NOTIFICATIONS (RAFNotify, this account only) ───────── */
  function renderNotifs(){
    var box = el('notifList'), btn = el('notifBtn'); if(!box || !window.RAFNotify || !RAFNotify.forRecipient) return;
    var list = RAFNotify.forRecipient({ audience:'logistics' }), unread = list.filter(function(n){ return !n.read; }).length;
    var badge = btn.querySelector('.n-badge');
    if(!badge){ badge = document.createElement('span'); badge.className = 'n-badge'; badge.style.cssText = 'position:absolute;top:6px;inset-inline-end:6px;min-width:16px;height:16px;padding:0 4px;border-radius:8px;background:var(--alert);color:#fff;font-size:10px;font-weight:700;display:grid;place-items:center;font-family:\'DM Sans\',sans-serif'; btn.appendChild(badge); }
    badge.textContent = unread > 9 ? '9+' : String(unread); badge.hidden = !unread;
    btn.setAttribute('aria-label', T('الإشعارات','Notifications') + (unread ? ' (' + unread + ')' : ''));
    var sp = null; try { sp = RAFNotify.soundPreference(); } catch(e){}
    var soundRow = '<div style="display:flex;align-items:center;gap:8px;margin:-6px 0 10px"><span style="flex:1;font-size:12.5px">'
      + T('صوت الإشعارات: ','Notification sound: ') + '<b>' + (sp && sp.enabled === true ? T('مفعّل','On') : (sp && sp.configured ? T('متوقف','Off') : T('غير مُهيّأ (متوقف)','Not set (off)'))) + '</b></span>'
      + '<button class="btn sm" type="button" onclick="DM.soundToggle()">'+(sp && sp.enabled === true ? T('إيقاف','Turn off') : T('تشغيل','Turn on'))+'</button></div>';
    box.innerHTML = soundRow + (list.length ? '<ul class="list" style="margin:0 -16px -16px">'+list.slice(0,12).map(function(n){
        return '<li><span class="ic '+(n.read?'done':'alert')+'"><i class="ti ti-bell" aria-hidden="true"></i></span><span class="bd"><b>'+esc(L(n.title))+'</b>'
          + '<span><button class="order-btn" type="button" onclick="DM.openNotif(\''+esc(n.notificationId)+'\',\''+esc(n.entityId||'')+'\')"><bdi>'+esc(n.entityId||'')+'</bdi></button>'
          + (n.read ? '' : ' · '+T('غير مقروء','Unread'))+'</span></span><span class="tm">'+esc(ago(n.timestamp)||'')+'</span></li>';
      }).join('')+'</ul>'
      : '<div class="pop-empty"><i class="ti ti-bell-off" aria-hidden="true"></i><span>'+T('لا توجد إشعارات.','No notifications.')+'</span></div>');
  }

  window.DM = {
    /* Phase H: open a conversation's read-only history */
    convOpen: function(id){ CONV.open = CONV.open === id ? null : id; renderView(); var c = el('convCard'); if(c) c.scrollIntoView({ block:'nearest' }); },
    open: function(id, trigger){ if(DS) dispatchClose(false); drawerTrigger = trigger || document.activeElement; openId = id; renderDrawer(); },
    close: closeDrawer,
    /* manual dispatch */
    dispatchOpen: dispatchOpen, dispatchClose: dispatchClose, dispatchConfirm: dispatchConfirm,
    /* reassignment / return to pool / request decisions */
    manageOpen: function(id, trigger){ dispatchOpen(id, trigger, 'manage'); },
    manageAction: function(a){ if(!DS || !ACTIONS[a]) return; DS.action = a; DS.step = 'form'; DS.err = null; DS.driverId = null; DS.reason = ''; renderPanel(false);
      var f = el('dw') && (el('dw').querySelector('input[type=radio]') || el('dsReason')); if(f) f.focus(); },
    manageReason: function(v){ if(DS) DS.reason = v; },
    manageContinue: function(){
      if(!DS || !DS.action) return;
      var A = ACTIONS[DS.action], d = ownedItem(DS.id);
      if(A.needsDriver && !DS.driverId){ DS.err = T('اختر السائق البديل.','Choose the replacement driver.'); renderPanel(false); return; }
      if((A.reasonRequired || (A.needsDriver && d && d.pickedUpAt)) && !String(DS.reason).trim()){ DS.err = T('السبب إلزامي لهذه العملية.','A reason is required for this operation.'); renderPanel(false); var t = el('dsReason'); if(t) t.focus(); return; }
      DS.err = null; DS.step = 'confirm'; renderPanel(false); var c = el('dsConfirm'); if(c) c.focus(); },
    manageBack: function(){ if(!DS) return; DS.err = null; DS.step = DS.step === 'confirm' ? 'form' : 'choose'; if(DS.step === 'choose') DS.action = null; renderPanel(false); },
    manageConfirm: manageConfirm,
    /* exceptions */
    exOpen: exOpen, exConfirm: exConfirm,
    exNew: function(trigger){
      if(DS) dispatchClose(false); openId = null; drawerTrigger = trigger || document.activeElement;
      DS = { id:null, mode:'exopen', step:'form', form:{}, err:null, lock:'none' }; renderPanel(true);
      var s = el('exf-order'); if(s) s.focus(); },
    exNewContinue: function(){
      var f = DS.form, X = EXO(), cat = X.config().categories.filter(function(c){ return c.key === f.category; })[0];
      if(!f.orderId || !cat){ DS.err = T('اختر التوصيل والفئة.','Choose the delivery and the category.'); renderPanel(false); return; }
      if(cat.requiresDescription && !String(f.description||'').trim()){ DS.err = T('الوصف إلزامي لهذه الفئة.','A description is required for this category.'); renderPanel(false); return; }
      DS.err = null; DS.step = 'confirm'; renderPanel(false); var c = el('exConfirm'); if(c) c.focus(); },
    exNewConfirm: function(){
      var f = DS.form, r = EXO().open(f.orderId, { category:f.category, description:f.description });
      if(!r.ok){ DS.err = r.message; DS.step = 'form'; renderPanel(false); return; }
      dispatchClose(false); toast(T('فُتح الاستثناء','Exception opened')); reload();
      exOpen(r.exception.exceptionId, el('view')); },
    exAction: function(a){ if(!DS || !EX_ACTIONS[a]) return; DS.action = a; DS.form = {}; DS.err = null; DS.step = a === 'take' ? 'confirm' : 'form'; renderPanel(false);
      var fEl = el('dw') && el('dw').querySelector('textarea, input, select, #exConfirm'); if(fEl) fEl.focus(); },
    exField: function(name, value, rerender){ if(!DS) return; DS.form[name] = value; if(rerender){ DS.err = null; renderPanel(false); } },
    exContinue: function(){
      var f = DS.form, a = DS.action, need = null;
      if(a === 'note' && !String(f.note||'').trim()) need = T('نص الإجراء إلزامي.','The action text is required.');
      if(a === 'escalate' && !f.reasonKey && !String(f.description||'').trim()) need = T('اختر سبب التصعيد أو اكتب وصفًا.','Select an escalation reason or enter a description.');
      if(a === 'resolve' && !f.resolutionType) need = T('اختر نوع المعالجة.','Choose a resolution type.');
      if(a === 'resolve' && f.resolutionType === 'other_resolution' && !String(f.details||'').trim()) need = T('التفاصيل إلزامية لهذه المعالجة.','Details are required for this resolution.');
      if(a === 'return' && !String(f.decision||'').trim()) need = T('قرار الإدارة إلزامي.','A management decision is required.');
      if((a === 'reopen' || a === 'eta') && !String(f.reason||'').trim()) need = T('السبب إلزامي.','A reason is required.');
      if(a === 'eta' && !f.eta) need = T('حدّد الوقت المتوقع الجديد.','Set the new ETA.');
      if(need){ DS.err = need; renderPanel(false); return; }
      DS.err = null; DS.step = 'confirm'; renderPanel(false); var c = el('exConfirm'); if(c) c.focus(); },
    exBack: function(){ if(!DS) return; DS.err = null;
      if(DS.mode === 'exopen'){ DS.step = 'form'; }
      else if(DS.step === 'confirm' && DS.action !== 'take'){ DS.step = 'form'; }
      else { DS.step = 'choose'; DS.action = null; DS.form = {}; }
      renderPanel(false); },
    exFilter: function(k, v, keepFocus){ EXF[k] = v; renderView();
      if(keepFocus){ var i = el('exQ'); if(i){ i.focus(); try { i.setSelectionRange(i.value.length, i.value.length); } catch(e){} } } },
    soundToggle: function(){ try { var p = RAFNotify.soundPreference(); RAFNotify.setSoundPreference(!(p && p.enabled === true)); } catch(e){} renderNotifs(); },
    openNotif: function(nid, orderId){
      try { RAFNotify.markRead(nid); } catch(e){}
      closePops(); renderNotifs();
      BOARD = OPS.dispatchBoard();
      if(orderId && BOARD.ok && BOARD.inProgress.some(function(d){ return d.orderId === orderId; })) dispatchOpen(orderId, el('notifBtn'), 'manage');
    },
    dispatchPick: function(v){ if(!DS) return; DS.driverId = v; DS.err = null; renderPanel(false);
      var i = el('dw') && el('dw').querySelector('input[value="'+String(v).replace(/"/g,'')+'"]'); if(i) i.focus(); },
    dispatchContinue: function(){ if(!DS || !DS.driverId) return; DS.step = 'confirm'; DS.err = null; renderPanel(false);
      var c = el('dsConfirm'); if(c) c.focus(); },
    dispatchBack: function(){ if(!DS) return; DS.step = 'select'; renderPanel(false); },
    dispatchRecover: function(){ if(!DS) return; var r = OPS.recoverStaleLock(DS.id);
      if(r.ok){ DS.lock = 'mine'; DS.lockInfo = r.lock; DS.err = null; scheduleHeartbeat(); }
      else { DS.err = r.message; syncLock(); }
      renderPanel(false); },
    dispatchRetryLock: function(){ if(!DS) return; DS.err = null; acquireFor(DS.id); renderPanel(false); },
    toggleGroup: function(k){ expanded = expanded === k ? null : k; renderNav();
      var b = el('navTree').querySelector('[aria-controls="sub-'+k+'"]'); if(b) b.focus(); },
    openNav: openNav, closeNav: closeNav, togglePop: togglePop, toggleLang: toggleLang,
    refresh: reload,
    setFilter: function(k,v){ F[k] = v; renderView(); },
    setQuery: function(v){ F.q = v; renderView();
      var i = el('fQ'); if(i){ i.focus(); try { i.setSelectionRange(i.value.length, i.value.length); } catch(e){} } },
    clearFilters: function(){ F = { q:'', driver:'', store:'', timing:'', day:'' }; renderView(); }
  };

  function boot(){
    var l = null; try { l = localStorage.getItem('raf_lang'); } catch(e){}
    if(l === 'en'){ root().lang = 'en'; root().dir = 'ltr'; }
    applyLang();
    if(!OPS || !window.RAFPerm || !window.RAFDriver){
      gate('تعذّر التحميل','Could not load', T('لم يتم تحميل وحدات رف المطلوبة.','The required RAF modules did not load.')); return;
    }
    /* the authority decides — the page only renders its answer */
    var probe = OPS.board({});
    if(!probe.ok){ gate('لا تملك صلاحية الوصول إلى إدارة اللوجستيات','You do not have access to Logistics Management', probe.message); return; }
    var me = RAFPerm.currentUser();
    ME = { id:me.id, name:me.name, roleId:me.roleId };
    DATA = probe;
    el('gate').hidden = true; el('shell').hidden = false;
    route = parseHash(); expanded = route.g;
    function onViewport(){ if(!mq.matches) el('shell').classList.remove('nav-open'); syncNavA11y(); }
    if(mq.addEventListener) mq.addEventListener('change', onViewport);
    else if(mq.addListener) mq.addListener(onViewport);
    window.addEventListener('resize', onViewport);
    renderNav(); renderView(); syncNavA11y(); renderNotifs();

    window.addEventListener('hashchange', onRoute);
    /* the storage events the driver and merchant surfaces already emit — no polling */
    window.addEventListener('storage', function(e){
      if(e.key && /^raf_(orders|order_mstate|driver_claims|users|current_user)$/.test(e.key)) reload();
    });
    /* live operational news on RAFEventBus (same tab and other tabs). The
       event only says something changed; reload() re-reads every authority. */
    if(window.RAFEventBus){
      ['order.*','ownership.*','logistics.*','driver.*','config.changed'].forEach(function(p){
        RAFEventBus.subscribe(p, function(){ reload(); });
      });
      RAFEventBus.subscribe('notification.*', function(ev){
        /* sound only for this account's own new notification, and only if its preference is ON */
        if(ev && ev.eventType === 'notification.created' && ev.payload && ME && ev.payload.recipientUserId === ME.id && soundOn()) beep();
        renderNotifs();
      });
    } else {
      document.addEventListener('raf:order', reload);
      document.addEventListener('raf:snapshot', reload);
    }
    /* leaving the page lets go of an operation lock this employee holds */
    window.addEventListener('pagehide', function(){ if(DS && DS.lock === 'mine'){ try { OPS.releaseLock(DS.id); } catch(e){} } });
  }
  if(document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();
})();
</script>
</body>
