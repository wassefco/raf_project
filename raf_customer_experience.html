<!DOCTYPE html>
<html id="htmlRoot" lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>رف — تجربة العملاء</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700;900&family=Tajawal:wght@300;400;500;700;800&family=DM+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
<link rel="icon" type="image/png" sizes="64x64" href="raf_favicon.png">
<link rel="icon" type="image/png" sizes="32x32" href="raf_favicon_32.png">
<link rel="apple-touch-icon" href="raf_appicon.png">
<script src="raf_features.js"></script>
<script src="raf_config.js"></script>
<script src="raf_event_bus.js"></script>
<script src="raf_record_store.js"></script>
<script src="raf_notify_core.js"></script>
<link rel="stylesheet" href="raf_theme.css">
<style>
/* ══════════════════════════════════════════════════════════════
   CUSTOMER EXPERIENCE — Overview · Reviews · Customer Issues.
   UI only: every read and write goes through RAFCustomerExperience.
   ══════════════════════════════════════════════════════════════ */
*{box-sizing:border-box;}
[hidden]{display:none!important;}
body{background:var(--bg2);margin:0;}
.mw{display:flex;min-height:100vh;}
.mw-rail{width:74px;flex:0 0 74px;background:var(--ink);display:flex;flex-direction:column;align-items:center;
  gap:6px;padding:14px 0;position:sticky;top:0;height:100vh;z-index:40;}
.mw-rail-logo{width:44px;height:44px;min-height:44px;border-radius:13px;background:var(--gold);color:#1C1606;display:flex;
  align-items:center;justify-content:center;font-family:var(--font-display);font-size:19px;font-weight:900;
  margin-bottom:10px;text-decoration:none;}
.mw-rail-b{width:50px;min-height:50px;border-radius:14px;border:0;background:transparent;color:#8E877A;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;cursor:pointer;
  font-family:inherit;font-size:9.5px;font-weight:700;text-decoration:none;transition:background .18s,color .18s;}
.mw-rail-b i{font-size:21px;}
.mw-rail-b:hover{background:rgba(255,255,255,.07);color:#EDE8DC;}
.mw-rail-b.on{background:var(--gold-soft);color:var(--gold);}
.mw-rail-sp{flex:1;}
.mw-main{flex:1;min-width:0;display:flex;flex-direction:column;}
.mw-head{position:sticky;top:0;z-index:35;background:var(--card);border-bottom:1px solid var(--border);
  padding:12px clamp(14px,2.2vw,24px);display:flex;align-items:center;gap:14px;flex-wrap:wrap;}
.mw-store{display:flex;align-items:center;gap:11px;min-width:0;}
.mw-store-logo{width:44px;height:44px;flex:0 0 auto;border-radius:13px;background:var(--bg3) center/cover no-repeat;
  display:flex;align-items:center;justify-content:center;color:var(--gold2);font-size:21px;}
.mw-store-t{min-width:0;}
.mw-store-t b{display:block;font-family:var(--font-display);font-size:17px;font-weight:800;color:var(--ink);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.mw-store-t span{font-size:11.5px;color:var(--text3);}
.mw-head-sp{flex:1;min-width:8px;}
.mw-hact{display:flex;align-items:center;gap:8px;}
.mw-hact .mw-ico-b{min-height:44px;}
.mw-ico-b{width:44px;height:44px;flex:0 0 auto;border-radius:13px;border:1px solid var(--border2);
  background:var(--card);color:var(--text2);font-size:18px;cursor:pointer;display:inline-flex;
  align-items:center;justify-content:center;font-family:inherit;font-weight:800;transition:all .18s;}
.mw-ico-b:hover{border-color:var(--gold);color:var(--gold2);}
.mw-ico-b.signout{color:var(--red,#C0503C);}
.mw-ico-b.signout .so-t{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;}
.mw-ico-b.signout:hover{border-color:var(--red,#C0503C);color:var(--red,#C0503C);}
.mw-ico-b.lang{width:auto;padding:0 14px;font-size:12.5px;}
.mw-body{padding:18px clamp(14px,2.2vw,24px) 60px;width:100%;}

/* tabs — two-class selectors so the theme's 40px button rule never wins */
.cx-tabs{display:flex;gap:4px;max-width:960px;margin:0 auto 16px;border:1px solid var(--border2);border-radius:15px;
  background:var(--card);padding:4px;overflow-x:auto;scrollbar-width:none;}
.cx-tabs::-webkit-scrollbar{display:none;}
.mw-body .cx-tabs button{min-height:46px;}
.cx-tabs button{flex:1 0 auto;min-height:46px;padding:0 16px;border:0;border-radius:11px;background:transparent;
  color:var(--text2);font-family:inherit;font-size:13.5px;font-weight:800;cursor:pointer;white-space:nowrap;
  display:inline-flex;align-items:center;justify-content:center;gap:7px;}
.cx-tabs button i{font-size:17px;}
.cx-tabs button:hover{color:var(--ink);background:var(--bg);}
.cx-tabs button[aria-selected="true"]{background:var(--ink);color:#F5F0E4;}
.cx-tabs button:focus-visible{outline:2px solid var(--gold);outline-offset:2px;}

.cx-wrap{max-width:960px;margin:0 auto;display:flex;flex-direction:column;gap:14px;min-width:0;}
.cx-sec{background:var(--card);border:1px solid var(--border);border-radius:18px;padding:18px 20px;min-width:0;}
.cx-sec-h{display:flex;align-items:center;gap:10px;min-height:44px;flex-wrap:wrap;}
.cx-sec-h h3{margin:0;flex:1;min-width:0;font-size:15.5px;font-weight:800;color:var(--ink);}
.cx-small{font-size:13px;color:var(--text3);line-height:1.7;}
.cx-num{font-family:var(--font-en);direction:ltr;unicode-bidi:isolate;}

/* overview */
.cx-kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;}
.cx-kpi{background:var(--card);border:1px solid var(--border);border-radius:18px;padding:16px 18px;min-width:0;}
.cx-kpi .l{font-size:12.5px;font-weight:800;color:var(--text3);display:flex;align-items:center;gap:6px;}
.cx-kpi .l i{font-size:16px;color:var(--gold2);}
.cx-kpi .v{font-size:26px;font-weight:800;color:var(--ink);margin-top:8px;line-height:1.2;overflow-wrap:anywhere;}
.cx-kpi .v.muted{font-size:15px;color:var(--text2);font-weight:700;}
.cx-kpi .s{font-size:12px;color:var(--text3);margin-top:4px;}
.cx-dist{display:flex;flex-direction:column;gap:10px;margin-top:10px;}
.cx-dist-r{display:grid;grid-template-columns:44px minmax(0,1fr) 48px;align-items:center;gap:10px;font-size:13px;}
.cx-dist-r .k{font-weight:800;color:var(--ink);white-space:nowrap;}
.cx-dist-r .k i{color:#C9A84C;font-style:normal;}
.cx-bar{height:10px;border-radius:10px;background:var(--bg3);overflow:hidden;}
.cx-bar span{display:block;height:100%;border-radius:10px;background:var(--gold);}
.cx-dist-r .c{text-align:end;color:var(--text2);font-weight:700;}

/* filters */
.cx-filters{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;align-items:end;}
.cx-f label{display:block;font-size:12px;font-weight:800;color:var(--text3);margin-bottom:6px;}
.cx-f select,.cx-f input{width:100%;min-height:46px;border-radius:12px;border:1px solid var(--border2);background:var(--card);
  font-family:inherit;font-size:14px;color:var(--ink);padding:0 12px;}
.cx-f select:focus,.cx-f input:focus{outline:2px solid var(--gold);outline-offset:1px;border-color:var(--gold);}
.cx-f.search{grid-column:1 / -1;}
.cx-frow{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:12px;}
.cx-count{font-size:12.5px;color:var(--text3);font-weight:700;}

/* buttons */
.cx-sec .cx-btn,.cx-wrap .cx-btn{min-height:46px;}
.cx-btn{min-height:46px;padding:0 18px;border-radius:13px;border:1px solid var(--border2);background:var(--card);
  color:var(--text2);font-family:inherit;font-size:13.5px;font-weight:800;cursor:pointer;display:inline-flex;
  align-items:center;justify-content:center;gap:7px;}
.cx-btn:hover:not(:disabled){border-color:var(--gold);color:var(--gold2);}
.cx-btn.gold{background:var(--gold);border-color:var(--gold2);color:#1C1606;}
.cx-btn.ink{background:var(--ink);border-color:var(--ink);color:#F5F0E4;}
.cx-btn.green{background:var(--green);border-color:#25834A;color:#fff;}
.cx-btn:disabled{opacity:.45;cursor:not-allowed;}
.cx-btn:focus-visible{outline:2px solid var(--gold);outline-offset:2px;}
.cx-acts{display:flex;gap:10px;flex-wrap:wrap;justify-content:flex-end;margin-top:12px;}

/* list cards */
.cx-list{display:flex;flex-direction:column;gap:10px;}
.cx-wrap .cx-card{min-height:44px;}
.cx-card{width:100%;text-align:start;background:var(--card);border:1px solid var(--border);border-radius:16px;padding:14px 16px;
  cursor:pointer;font-family:inherit;color:inherit;display:block;min-width:0;}
.cx-card:hover{border-color:var(--gold);}
.cx-card:focus-visible{outline:2px solid var(--gold);outline-offset:2px;}
.cx-card-top{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
.cx-card-top .date{margin-inline-start:auto;font-size:12px;color:var(--text3);}
.cx-card .body{margin-top:8px;font-size:14px;line-height:1.8;color:var(--ink);overflow-wrap:anywhere;white-space:pre-wrap;
  display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;}
.cx-card .body.muted{color:var(--text3);}
.cx-meta{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:10px;font-size:12.5px;color:var(--text2);}
.cx-meta span{display:inline-flex;align-items:center;gap:5px;min-width:0;overflow-wrap:anywhere;}
.cx-meta i{color:var(--gold2);font-size:15px;flex:0 0 auto;}
.cx-stars{color:#C9A84C;font-size:16px;letter-spacing:1px;white-space:nowrap;direction:ltr;unicode-bidi:isolate;}
.cx-stars .off{color:#D8D0BE;}
.cx-tag{display:inline-flex;align-items:center;gap:5px;min-height:26px;padding:3px 11px;border-radius:20px;font-size:11.5px;
  font-weight:800;background:var(--bg3);color:var(--text2);}
.cx-tag.green{background:rgba(46,158,91,.14);color:#1F7A45;}
.cx-tag.amber{background:rgba(200,121,30,.14);color:#9A5B12;}
.cx-tag.blue{background:rgba(59,125,216,.13);color:#26507F;}
.cx-tag.gold{background:var(--gold-soft);color:var(--gold2);}
.cx-tag.red{background:rgba(217,83,79,.13);color:#A63A36;}

/* detail */
.cx-back{display:inline-flex;align-items:center;gap:6px;}
.cx-dl{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-top:14px;}
.cx-dl div{min-width:0;}
.cx-dl dt{font-size:11.5px;font-weight:800;color:var(--text3);}
.cx-dl dd{margin:4px 0 0;font-size:14px;color:var(--ink);font-weight:700;overflow-wrap:anywhere;}
.cx-text{margin-top:12px;font-size:15px;line-height:1.9;color:var(--ink);white-space:pre-wrap;overflow-wrap:anywhere;}
.cx-reply{margin-top:12px;border-radius:14px;background:var(--bg);border:1px solid var(--border);padding:14px;}
.cx-reply .h{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:12.5px;font-weight:800;color:var(--gold2);}
.cx-reply .h .d{margin-inline-start:auto;color:var(--text3);font-weight:600;}
.cx-reply p{margin:8px 0 0;font-size:14px;line-height:1.85;color:var(--ink);white-space:pre-wrap;overflow-wrap:anywhere;}
.cx-field{margin-top:12px;}
.cx-field textarea{width:100%;min-height:110px;border-radius:12px;border:1px solid var(--border2);background:var(--card);
  font-family:inherit;font-size:15px;line-height:1.8;color:var(--ink);padding:12px 14px;resize:vertical;}
.cx-field textarea:focus{outline:2px solid var(--gold);outline-offset:1px;border-color:var(--gold);}
.cx-field.bad textarea{border-color:var(--red);}
.cx-fmeta{display:flex;justify-content:space-between;gap:10px;margin-top:6px;font-size:12px;color:var(--text3);min-height:18px;}
.cx-fmeta .err{color:#A63A36;font-weight:700;}
.cx-fmeta .cnt{margin-inline-start:auto;font-family:var(--font-en);direction:ltr;unicode-bidi:isolate;}
.cx-note{display:flex;gap:8px;align-items:flex-start;font-size:13px;color:var(--text3);line-height:1.7;margin-top:12px;}
.cx-note i{font-size:17px;flex:0 0 auto;margin-top:1px;}
.cx-msgs{display:flex;flex-direction:column;gap:10px;margin-top:12px;}
.cx-msg{max-width:88%;border-radius:14px;padding:11px 13px;background:var(--bg);border:1px solid var(--border);min-width:0;}
.cx-msg.merchant{align-self:flex-end;background:var(--gold-soft);border-color:rgba(201,168,76,.35);}
.cx-msg.customer{align-self:flex-start;}
.cx-msg .h{display:flex;gap:8px;flex-wrap:wrap;font-size:11.5px;font-weight:800;color:var(--text2);}
.cx-msg .h .d{margin-inline-start:auto;color:var(--text3);font-weight:600;}
.cx-msg p{margin:6px 0 0;font-size:14px;line-height:1.8;color:var(--ink);white-space:pre-wrap;overflow-wrap:anywhere;}
.cx-statuses{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;}

/* states */
.cx-state{padding:34px 16px;text-align:center;color:var(--text3);font-size:13.5px;line-height:1.8;}
.cx-state i{font-size:36px;display:block;margin-bottom:8px;color:var(--border2);}
.cx-state b{display:block;font-size:15px;color:var(--ink);margin-bottom:4px;}
.cx-msgbox{border-radius:12px;padding:11px 13px;font-size:12.5px;line-height:1.7;margin-top:12px;
  background:rgba(217,83,79,.1);border:1px solid rgba(217,83,79,.34);color:#A63A36;}

.mw-gate{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:30px;}
.mw-gate-c{max-width:420px;text-align:center;}
.mw-gate-c i{font-size:40px;color:var(--text3);}
.mw-gate-c h1{font-family:var(--font-display);font-size:20px;font-weight:800;color:var(--ink);margin:12px 0 8px;}
.mw-gate-c p{font-size:13px;color:var(--text2);line-height:1.8;}
.mw-toast{position:fixed;inset-inline:0;bottom:26px;display:flex;justify-content:center;z-index:120;
  pointer-events:none;opacity:0;transform:translateY(10px);transition:opacity .22s,transform .22s;}
.mw-toast.show{opacity:1;transform:none;}
.mw-toast > div{background:var(--ink);color:#F5F0E4;border-radius:30px;padding:12px 20px;font-size:13.5px;
  font-weight:700;box-shadow:0 14px 30px -14px rgba(20,16,8,.6);max-width:90vw;text-align:center;}

@media (max-width:640px){
  .cx-sec{padding:16px;}
  .cx-tabs button{padding:0 12px;font-size:13px;}
  .cx-acts .cx-btn{flex:1 1 0;}
  .cx-frow .cx-btn{flex:1 1 auto;}
  .cx-msg{max-width:100%;}
}
@media (max-width:560px){
  .mw-rail{position:fixed;bottom:0;top:auto;width:100%;height:auto;flex-direction:row;justify-content:space-around;
    padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px));}
  .mw-rail-logo,.mw-rail-sp{display:none;}
  /* eight destinations share the row: each takes an equal slice */
  .mw-rail{gap:0;padding-inline:2px;}
  .mw-rail-b{flex:1 1 0;min-width:0;width:auto;padding:0 1px;}
  .mw-rail-b span{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:9px;}
  .mw{flex-direction:column;}
  .mw-body{padding-bottom:90px;}
  .mw-store-logo{width:38px;height:38px;font-size:18px;}
  .mw-store-t b{font-size:15px;}
  .mw-toast{bottom:90px;}
  .cx-filters{grid-template-columns:1fr 1fr;}
  .cx-kpis{grid-template-columns:1fr 1fr;}
  .cx-kpi .v{font-size:22px;}
}
</style>
</head>
<body>

<div class="mw-gate" id="gate" style="display:none;">
  <div class="mw-gate-c"><i class="ti ti-mood-smile"></i>
    <h1 id="gateT"></h1><p id="gateP"></p></div>
</div>

<div class="mw" id="shell" style="display:none;">
  <!-- drawn by RAFMerchantNav from the account's own saved order -->
  <aside class="mw-rail" data-nav="customers"></aside>

  <div class="mw-main">
    <header class="mw-head">
      <div class="mw-store">
        <div class="mw-store-logo" id="stLogo"><i class="ti ti-building-store"></i></div>
        <div class="mw-store-t"><b id="stName">—</b>
          <span data-ar="تجربة العملاء" data-en="Customer Experience">تجربة العملاء</span></div>
      </div>
      <div class="mw-head-sp"></div>
      <div class="mw-hact">
        <button class="mw-ico-b" onclick="cxRefresh()" aria-label="refresh"><i class="ti ti-refresh"></i></button>
        <button class="mw-ico-b lang" onclick="toggleLang()"><span id="langLabel">EN</span></button>
        <!-- sign out: the shared RAFSignOut action -->
        <button class="mw-ico-b signout" onclick="RAFSignOut()"><i class="ti ti-logout" aria-hidden="true"></i><span class="so-t" data-ar="تسجيل الخروج" data-en="Sign Out">تسجيل الخروج</span></button>
      </div>
    </header>

    <div class="mw-body">
      <div class="cx-tabs" role="tablist" id="tabs"></div>
      <section id="panel" role="tabpanel" aria-live="polite"></section>
    </div>
  </div>
</div>

<div class="mw-toast" id="toast"><div id="toastMsg"></div></div>

<script src="raf_source.js"></script>
<script src="raf_audit.js"></script>
<script src="raf_data.js"></script>
<script src="raf_order_snapshot.js"></script>
<script src="raf_store_ops.js"></script>
<script src="raf_catalog.js"></script>
<script src="raf_inventory.js"></script>
<script src="raf_rules.js"></script>
<script src="raf_order_engine.js"></script>
<script src="raf_permissions.js"></script>
<script src="raf_customer_experience.js"></script>
<script src="raf_merchant_prefs.js"></script>
<script src="raf_merchant_nav.js"></script>
<script>
/* ============================================================
   CUSTOMER EXPERIENCE (merchant)
   Every value comes from RAFCustomerExperience, scoped to the
   account's own store; every write goes back through it. Order and
   product details are read from the historical order snapshot.
   ============================================================ */
(function(){
  'use strict';
  var CX = window.RAFCustomerExperience;
  var PREF = 'raf_cx_view';
  var TABS = [
    { k:'overview', ic:'ti-layout-dashboard', ar:'نظرة عامة',     en:'Overview' },
    { k:'reviews',  ic:'ti-star',             ar:'التقييمات',     en:'Reviews' },
    { k:'issues',   ic:'ti-message-report',   ar:'مشاكل العملاء', en:'Customer Issues' }
  ];
  var PERIODS = [
    { k:'all', ar:'كل الفترات',   en:'All time' },
    { k:'7',   ar:'آخر 7 أيام',   en:'Last 7 days' },
    { k:'30',  ar:'آخر 30 يومًا', en:'Last 30 days' },
    { k:'90',  ar:'آخر 90 يومًا', en:'Last 90 days' }
  ];
  var STATUS_TAG = { open:'blue', in_progress:'amber', waiting_customer:'gold', resolved:'green' };
  var MOVE_TXT = {
    in_progress:      { ar:'بدء المعالجة',          en:'Start progress',        ic:'ti-player-play', cls:'ink' },
    waiting_customer: { ar:'بانتظار العميل',        en:'Wait for customer',     ic:'ti-hourglass',   cls:'' },
    resolved:         { ar:'تم الحل',               en:'Mark resolved',         ic:'ti-circle-check', cls:'green' }
  };

  var ME = null, SLUG = null;
  var st = { tab:'overview', detail:null, state:'loading' };   /* state: loading | ready | error */
  var data = null;
  var rf = { period:'all', rating:'all', product:'all', order:'all', q:'' };
  var isf = { status:'all', category:'all', period:'all', order:'all' };
  var draft = { text:'', editing:false, err:null };

  /* ---------- helpers ---------- */
  function root(){ return document.getElementById('htmlRoot'); }
  function isEn(){ return root().lang === 'en'; }
  function T(ar,en){ return isEn() ? en : ar; }
  function L(o){ return (o && typeof o === 'object') ? (isEn() ? (o.en || o.ar) : (o.ar || o.en)) : (o || ''); }
  function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
  function el(id){ return document.getElementById(id); }
  var toastTimer = null;
  function toast(msg){
    el('toastMsg').textContent = msg; el('toast').classList.add('show');
    clearTimeout(toastTimer); toastTimer = setTimeout(function(){ el('toast').classList.remove('show'); }, 2400);
  }
  function fmtDate(ms){
    try { return new Date(ms).toLocaleDateString(isEn() ? 'en-GB' : 'ar-KW-u-nu-latn', { day:'numeric', month:'short', year:'numeric', timeZone:'Asia/Kuwait' }); }
    catch(e){ return ''; }
  }
  function fmtDateTime(ms){
    try { return new Date(ms).toLocaleString(isEn() ? 'en-GB' : 'ar-KW-u-nu-latn', { day:'numeric', month:'short', hour:'numeric', minute:'2-digit', timeZone:'Asia/Kuwait' }); }
    catch(e){ return ''; }
  }
  function stars(n){
    var s = ''; for (var i = 1; i <= 5; i++) s += i <= n ? '★' : '<span class="off">★</span>';
    return '<span class="cx-stars" role="img" aria-label="'+esc(T(n+' من 5 نجوم', n+' out of 5 stars'))+'">'+s+'</span>';
  }
  function num(v){ return '<span class="cx-num">'+esc(v)+'</span>'; }
  function statusTag(s){ return '<span class="cx-tag '+(STATUS_TAG[s]||'')+'">'+esc(L(CX.STATUS_TXT[s]||{ar:s,en:s}))+'</span>'; }
  function catLabel(k){ var c = CX.categoryOf(k); return c ? L(c) : k; }
  function stateHTML(ic, title, text){
    return '<div class="cx-state"><i class="ti '+ic+'"></i><b>'+esc(title)+'</b>'+(text ? esc(text) : '')+'</div>';
  }
  function withinPeriod(ms, p){
    var d = { '7':7, '30':30, '90':90 }[p];
    return !d || ms >= Date.now() - d * 86400000;
  }
  function savePrefs(){ try { localStorage.setItem(PREF, JSON.stringify({ tab:st.tab })); } catch(e){} }
  function loadPrefs(){
    try { var p = JSON.parse(localStorage.getItem(PREF) || 'null');
      if (p && TABS.some(function(t){ return t.k === p.tab; })) st.tab = p.tab; } catch(e){}
  }

  /* ---------- data: read through the authority, never storage ---------- */
  function load(){
    try {
      var r = CX.reviews({ actor:ME.id }), i = CX.issues({ actor:ME.id });
      if (!r.ok || !i.ok) throw new Error('scope');
      data = { reviews:r.items, issues:i.items, editable:!!r.editable };
      st.state = 'ready';
    } catch(e){ data = null; st.state = 'error'; }
  }
  function reviewById(id){ return data && data.reviews.filter(function(x){ return x.reviewId === id; })[0]; }
  function issueById(id){ return data && data.issues.filter(function(x){ return x.issueId === id; })[0]; }

  /* ---------- chrome ---------- */
  function renderTabs(){
    el('tabs').innerHTML = TABS.map(function(t){
      var on = st.tab === t.k;
      return '<button role="tab" id="tab-'+t.k+'" aria-controls="panel" aria-selected="'+on+'" tabindex="'+(on?0:-1)+'"'
        + ' onclick="setTab(\''+t.k+'\')"><i class="ti '+t.ic+'"></i>'+esc(T(t.ar,t.en))+'</button>';
    }).join('');
    el('panel').setAttribute('aria-labelledby', 'tab-' + st.tab);
  }
  function render(){
    renderTabs();
    var h;
    try {
      if (st.state === 'loading') h = '<div class="cx-wrap"><section class="cx-sec">'+stateHTML('ti-loader-2', T('جارٍ التحميل…','Loading…'), '')+'</section></div>';
      else if (st.state === 'error') h = errorHTML();
      else if (st.detail && st.detail.kind === 'review') h = reviewDetailHTML();
      else if (st.detail && st.detail.kind === 'issue') h = issueDetailHTML();
      else h = st.tab === 'reviews' ? reviewsHTML() : st.tab === 'issues' ? issuesHTML() : overviewHTML();
    } catch(e){ st.state = 'error'; h = errorHTML(); }
    el('panel').innerHTML = h;
  }
  function errorHTML(){
    return '<div class="cx-wrap"><section class="cx-sec">'
      + stateHTML('ti-alert-triangle', T('تعذّر تحميل تجربة العملاء','Customer Experience could not be loaded'), T('حاول مرة أخرى.','Please try again.'))
      + '<div class="cx-acts" style="justify-content:center"><button class="cx-btn gold" onclick="cxRefresh()"><i class="ti ti-refresh"></i>'
      + esc(T('إعادة المحاولة','Retry'))+'</button></div></section></div>';
  }

  /* ════════════════════ OVERVIEW ════════════════════ */
  function overviewHTML(){
    var s = CX.summarize(data.reviews);
    var active = data.issues.filter(function(x){ return x.status !== 'resolved'; }).length;
    var resolved = data.issues.length - active;
    function kpi(ic, label, value, sub, muted){
      return '<div class="cx-kpi"><div class="l"><i class="ti '+ic+'"></i>'+esc(label)+'</div>'
        + '<div class="v'+(muted?' muted':'')+'">'+value+'</div>'+(sub ? '<div class="s">'+sub+'</div>' : '')+'</div>';
    }
    var none = T('لا توجد تقييمات بعد','No reviews yet');
    var h = '<div class="cx-wrap"><div class="cx-kpis" id="cxKpis">'
      + kpi('ti-star', T('متوسط التقييم','Average rating'), s.total ? num(s.average.toFixed(1)) : esc(none), s.total ? stars(Math.round(s.average)) : '', !s.total)
      + kpi('ti-message-star', T('إجمالي التقييمات','Total reviews'), num(s.total), '', false)
      + kpi('ti-mood-happy', T('تجربة إيجابية','Positive experience'), s.total ? num(Math.round(s.positivePct) + '%') : esc(none),
            s.total ? esc(T('تقييمات 4 و5 نجوم','4★ and 5★ reviews')) : '', !s.total)
      + kpi('ti-message-report', T('مشاكل مفتوحة','Open issues'), num(active), esc(T('غير محلولة بعد','Not resolved yet')), false)
      + kpi('ti-circle-check', T('مشاكل محلولة','Resolved issues'), num(resolved), '', false)
      + '</div>';
    h += '<section class="cx-sec" id="cxDist"><div class="cx-sec-h"><h3>'+esc(T('توزيع التقييمات','Rating distribution'))+'</h3></div>';
    if (!s.total) h += stateHTML('ti-star', none, T('ستظهر التقييمات هنا عندما يقيّم العملاء منتجات طلباتهم.','Reviews appear here when customers rate products from their orders.'));
    else {
      h += '<div class="cx-dist">' + [5,4,3,2,1].map(function(n){
        var c = s.counts[n], pct = Math.round((c / s.total) * 100);
        return '<div class="cx-dist-r"><span class="k">'+num(n)+' <i>★</i></span>'
          + '<span class="cx-bar" role="img" aria-label="'+esc(T(c+' تقييم', c+' reviews'))+'"><span style="width:'+pct+'%"></span></span>'
          + '<span class="c">'+num(c)+'</span></div>';
      }).join('') + '</div>';
    }
    return h + '</section></div>';
  }

  /* ════════════════════ REVIEWS ════════════════════ */
  function reviewHay(r){
    var p = CX.productOf(r.orderId, r.productId);
    return [r.comment, r.merchantReply, r.orderId, r.productId, p.ar, p.en].join(' ').toLowerCase();
  }
  function reviewsFiltered(){
    var q = rf.q.trim().toLowerCase();
    return data.reviews.filter(function(r){
      return withinPeriod(r.createdAt, rf.period)
        && (rf.rating === 'all' || r.rating === +rf.rating)
        && (rf.product === 'all' || r.productId === rf.product)
        && (rf.order === 'all' || r.orderId === rf.order)
        && (!q || reviewHay(r).indexOf(q) > -1);
    }).sort(function(a,b){ return b.createdAt - a.createdAt; });
  }
  function reviewCount(n){ return T(n+' تقييم', n+' review'+(n===1?'':'s')); }
  function issueCount(n){ return T(n+' مشكلة', n+' issue'+(n===1?'':'s')); }
  function opt(v, label, cur){ return '<option value="'+esc(v)+'"'+(String(cur) === String(v) ? ' selected' : '')+'>'+esc(label)+'</option>'; }
  function distinct(list, key){ var s = {}; list.forEach(function(x){ s[x[key]] = x; }); return Object.keys(s).map(function(k){ return s[k]; }); }
  function reviewsHTML(){
    var h = '<div class="cx-wrap">';
    if (!data.reviews.length){
      return h + '<section class="cx-sec">'+stateHTML('ti-star', T('لا توجد تقييمات بعد','No reviews yet'),
        T('ستظهر هنا تقييمات العملاء لمنتجات طلباتهم.','Customer reviews of products from their orders will appear here.'))+'</section></div>';
    }
    var prods = distinct(data.reviews, 'productId'), orders = distinct(data.reviews, 'orderId');
    h += '<section class="cx-sec"><div class="cx-filters">'
      + '<div class="cx-f"><label for="rfPeriod">'+esc(T('الفترة','Period'))+'</label><select id="rfPeriod" onchange="setRF(\'period\',this.value)">'
        + PERIODS.map(function(p){ return opt(p.k, T(p.ar,p.en), rf.period); }).join('')+'</select></div>'
      + '<div class="cx-f"><label for="rfRating">'+esc(T('التقييم','Rating'))+'</label><select id="rfRating" onchange="setRF(\'rating\',this.value)">'
        + opt('all', T('كل التقييمات','All ratings'), rf.rating) + [5,4,3,2,1].map(function(n){ return opt(n, n+' ★', rf.rating); }).join('')+'</select></div>'
      + '<div class="cx-f"><label for="rfProduct">'+esc(T('المنتج','Product'))+'</label><select id="rfProduct" onchange="setRF(\'product\',this.value)">'
        + opt('all', T('كل المنتجات','All products'), rf.product) + prods.map(function(r){ return opt(r.productId, L(CX.productOf(r.orderId, r.productId)), rf.product); }).join('')+'</select></div>'
      + '<div class="cx-f"><label for="rfOrder">'+esc(T('الطلب','Order'))+'</label><select id="rfOrder" onchange="setRF(\'order\',this.value)">'
        + opt('all', T('كل الطلبات','All orders'), rf.order) + orders.map(function(r){ return opt(r.orderId, r.orderId, rf.order); }).join('')+'</select></div>'
      + '<div class="cx-f search"><label for="rfQ">'+esc(T('بحث','Search'))+'</label><input id="rfQ" type="search" value="'+esc(rf.q)+'" oninput="setRF(\'q\',this.value,true)"'
        + ' placeholder="'+esc(T('ابحث في التعليقات أو المنتج أو رقم الطلب','Search comments, product or order number'))+'"></div>'
      + '</div><div class="cx-frow"><span class="cx-count" id="rfCount">'+esc(reviewCount(reviewsFiltered().length))+'</span>'
      + '<button class="cx-btn" onclick="clearRF()"><i class="ti ti-filter-off"></i>'+esc(T('مسح الفلاتر','Clear filters'))+'</button></div></section>';
    return h + '<div class="cx-list" id="cxList">'+reviewListHTML()+'</div></div>';
  }
  function reviewListHTML(){
    var list = reviewsFiltered();
    var c = el('rfCount'); if (c) c.textContent = reviewCount(list.length);   /* live search updates it in place */
    if (!list.length) return '<section class="cx-sec">'+stateHTML('ti-filter-off', T('لا توجد نتائج مطابقة للفلاتر.','No results match your filters.'), '')+'</section>';
    return list.map(function(r){
      return '<button class="cx-card" data-id="'+esc(r.reviewId)+'" onclick="openReview(\''+esc(r.reviewId)+'\')">'
        + '<div class="cx-card-top">'+stars(r.rating)
          + (r.merchantReply ? '<span class="cx-tag green"><i class="ti ti-message-check"></i>'+esc(T('تم الرد','Replied'))+'</span>'
                             : '<span class="cx-tag">'+esc(T('بدون رد','No reply'))+'</span>')
          + '<span class="date">'+esc(fmtDate(r.createdAt))+'</span></div>'
        + (r.comment ? '<div class="body">'+esc(r.comment)+'</div>' : '<div class="body muted">'+esc(T('بدون تعليق','No comment'))+'</div>')
        + '<div class="cx-meta"><span><i class="ti ti-package"></i>'+esc(L(CX.productOf(r.orderId, r.productId)))+'</span>'
          + '<span><i class="ti ti-receipt"></i><bdi>'+esc(r.orderId)+'</bdi></span></div>'
        + '</button>';
    }).join('');
  }
  function refreshList(){ var box = el('cxList'); if (box) box.innerHTML = reviewListHTML(); }
  window.setRF = function(k, v, live){ rf[k] = v; if (live) refreshList(); else { render(); } };
  window.clearRF = function(){ rf = { period:'all', rating:'all', product:'all', order:'all', q:'' }; render(); };

  function reviewDetailHTML(){
    var r = reviewById(st.detail.id);
    if (!r){ st.detail = null; return reviewsHTML(); }
    var prod = CX.productOf(r.orderId, r.productId);
    var h = '<div class="cx-wrap"><div><button class="cx-btn cx-back" onclick="closeDetail()"><i class="ti ti-arrow-'+(isEn()?'left':'right')+'"></i>'
      + esc(T('كل التقييمات','All reviews'))+'</button></div>';
    h += '<section class="cx-sec" id="cxReview"><div class="cx-sec-h"><h3>'+esc(T('تقييم العميل','Customer review'))+'</h3>'
      + stars(r.rating)+'<span class="cx-tag gold">'+num(r.rating+' / 5')+'</span></div>'
      + (r.comment ? '<div class="cx-text">'+esc(r.comment)+'</div>' : '<div class="cx-small" style="margin-top:10px">'+esc(T('لم يكتب العميل تعليقًا.','The customer did not write a comment.'))+'</div>')
      + '<dl class="cx-dl"><div><dt>'+esc(T('المنتج','Product'))+'</dt><dd>'+esc(L(prod))+'</dd></div>'
      + '<div><dt>'+esc(T('الطلب','Order'))+'</dt><dd><bdi>'+esc(r.orderId)+'</bdi></dd></div>'
      + '<div><dt>'+esc(T('تاريخ التقييم','Review date'))+'</dt><dd>'+esc(fmtDate(r.createdAt))+'</dd></div></dl>'
      + '<div class="cx-note"><i class="ti ti-lock"></i>'+esc(T('تقييم العميل وتعليقه لا يمكن تعديلهما أو حذفهما.','The customer\'s rating and comment cannot be changed or deleted.'))+'</div>'
      + '</section>';
    h += '<section class="cx-sec" id="cxReplySec"><div class="cx-sec-h"><h3>'+esc(T('رد المتجر','Store reply'))+'</h3>';
    if (r.merchantReply && !draft.editing && data.editable)
      h += '<button class="cx-btn" onclick="editReply()"><i class="ti ti-pencil"></i>'+esc(T('تعديل الرد','Edit reply'))+'</button>';
    h += '</div>';
    if (r.merchantReply && !draft.editing){
      h += '<div class="cx-reply" id="cxReply"><div class="h"><i class="ti ti-building-store"></i>'+esc(T('رد المتجر','Store reply'))
        + (r.replyHistory && r.replyHistory.length ? '<span class="cx-tag">'+esc(T('معدّل','Edited'))+'</span>' : '')
        + '<span class="d">'+esc(fmtDateTime(r.merchantReplyAt))+'</span></div><p>'+esc(r.merchantReply)+'</p></div>';
    } else if (!data.editable){
      h += '<div class="cx-note"><i class="ti ti-eye"></i>'+esc(r.merchantReply ? '' : T('لا يوجد رد بعد.','No reply yet.'))
        + ' '+esc(T('للقراءة فقط — الرد متاح لصاحب المتجر.','Read only — replying is available to the store owner.'))+'</div>';
    } else {
      var max = CX.LIMITS.reply;
      h += '<div class="cx-field'+(draft.err ? ' bad' : '')+'"><textarea id="cxDraft" maxlength="'+max+'" aria-label="'+esc(T('رد المتجر','Store reply'))+'"'
        + ' oninput="draftInput(this.value)" placeholder="'+esc(T('اكتب ردك على العميل','Write your reply to the customer'))+'">'+esc(draft.text)+'</textarea>'
        + '<div class="cx-fmeta"><span class="err" id="cxErr">'+esc(draft.err || '')+'</span><span class="cnt" id="cxCnt">'+draft.text.length+' / '+max+'</span></div></div>'
        + '<div class="cx-note"><i class="ti ti-info-circle"></i>'+esc(T('يظهر ردك منفصلًا عن تقييم العميل ولا يغيّره.','Your reply is shown separately from the customer\'s review and never changes it.'))+'</div>'
        + '<div class="cx-acts">'+(draft.editing ? '<button class="cx-btn" onclick="cancelReply()">'+esc(T('إلغاء','Cancel'))+'</button>' : '')
        + '<button class="cx-btn gold" id="cxSend" onclick="saveReply()"'+(draft.text.trim() ? '' : ' disabled')+'><i class="ti ti-send"></i>'
        + esc(draft.editing ? T('حفظ التعديل','Save changes') : T('إرسال الرد','Send reply'))+'</button></div>';
    }
    return h + '</section></div>';
  }
  window.openReview = function(id){ st.detail = { kind:'review', id:id }; draft = { text:'', editing:false, err:null }; render(); scrollTop(); };
  window.editReply = function(){ var r = reviewById(st.detail.id); draft = { text:r.merchantReply || '', editing:true, err:null }; render(); focusDraft(); };
  window.cancelReply = function(){ draft = { text:'', editing:false, err:null }; render(); };
  window.draftInput = function(v){
    draft.text = v; draft.err = null;
    var c = el('cxCnt'); if (c) c.textContent = v.length + ' / ' + (st.detail.kind === 'review' ? CX.LIMITS.reply : CX.LIMITS.message);
    var e = el('cxErr'); if (e) e.textContent = '';
    var b = el('cxSend'); if (b) b.disabled = !v.trim();
  };
  window.saveReply = function(){
    var r = reviewById(st.detail.id); if (!r) return;
    var res = CX.replyReview(r.reviewId, draft.text, { actor:ME.id, baseVersion:r.merchantReplyAt || 0 });
    if (!res.ok){ draft.err = res.message; render(); focusDraft(); return; }
    draft = { text:'', editing:false, err:null }; load(); render(); toast(T('تم حفظ الرد','Reply saved'));
  };

  /* ════════════════════ CUSTOMER ISSUES ════════════════════ */
  function issuesFiltered(){
    return data.issues.filter(function(x){
      return (isf.status === 'all' || x.status === isf.status)
        && (isf.category === 'all' || x.category === isf.category)
        && withinPeriod(x.createdAt, isf.period)
        && (isf.order === 'all' || x.orderId === isf.order);
    }).sort(function(a,b){ return b.updatedAt - a.updatedAt; });
  }
  function issuesHTML(){
    var h = '<div class="cx-wrap">';
    if (!data.issues.length){
      return h + '<section class="cx-sec">'+stateHTML('ti-message-report', T('لا توجد مشاكل من العملاء','No customer issues'),
        T('ستظهر هنا المشاكل التي يفتحها العملاء على طلباتهم من متجرك.','Issues customers raise about their orders from your store will appear here.'))+'</section></div>';
    }
    var orders = distinct(data.issues, 'orderId');
    h += '<section class="cx-sec"><div class="cx-filters">'
      + '<div class="cx-f"><label for="ifStatus">'+esc(T('الحالة','Status'))+'</label><select id="ifStatus" onchange="setIF(\'status\',this.value)">'
        + opt('all', T('كل الحالات','All statuses'), isf.status) + Object.keys(CX.STATUS_TXT).map(function(k){ return opt(k, L(CX.STATUS_TXT[k]), isf.status); }).join('')+'</select></div>'
      + '<div class="cx-f"><label for="ifCat">'+esc(T('التصنيف','Category'))+'</label><select id="ifCat" onchange="setIF(\'category\',this.value)">'
        + opt('all', T('كل التصنيفات','All categories'), isf.category) + CX.CATEGORIES.map(function(c){ return opt(c.key, L(c), isf.category); }).join('')+'</select></div>'
      + '<div class="cx-f"><label for="ifPeriod">'+esc(T('التاريخ','Date'))+'</label><select id="ifPeriod" onchange="setIF(\'period\',this.value)">'
        + PERIODS.map(function(p){ return opt(p.k, T(p.ar,p.en), isf.period); }).join('')+'</select></div>'
      + '<div class="cx-f"><label for="ifOrder">'+esc(T('الطلب','Order'))+'</label><select id="ifOrder" onchange="setIF(\'order\',this.value)">'
        + opt('all', T('كل الطلبات','All orders'), isf.order) + orders.map(function(x){ return opt(x.orderId, x.orderId, isf.order); }).join('')+'</select></div>'
      + '</div><div class="cx-frow"><span class="cx-count" id="ifCount">'+esc(issueCount(issuesFiltered().length))+'</span>'
      + '<button class="cx-btn" onclick="clearIF()"><i class="ti ti-filter-off"></i>'+esc(T('مسح الفلاتر','Clear filters'))+'</button></div></section>';
    var list = issuesFiltered();
    h += '<div class="cx-list" id="cxIssues">';
    if (!list.length) h += '<section class="cx-sec">'+stateHTML('ti-filter-off', T('لا توجد نتائج مطابقة للفلاتر.','No results match your filters.'), '')+'</section>';
    else h += list.map(function(x){
      var last = x.messages.length ? x.messages[x.messages.length - 1] : null;
      return '<button class="cx-card" data-id="'+esc(x.issueId)+'" onclick="openIssue(\''+esc(x.issueId)+'\')">'
        + '<div class="cx-card-top">'+statusTag(x.status)+'<span class="cx-tag">'+esc(catLabel(x.category))+'</span>'
          + '<span class="date">'+esc(fmtDate(x.createdAt))+'</span></div>'
        + '<div class="body" style="font-weight:800">'+esc(x.subject)+'</div>'
        + '<div class="cx-meta"><span><i class="ti ti-receipt"></i><bdi>'+esc(x.orderId)+'</bdi></span>'
          + '<span><i class="ti ti-messages"></i>'+num(x.messages.length)+' '+esc(T('رسالة','messages'))+'</span>'
          + (last ? '<span><i class="ti ti-clock"></i>'+esc(T('آخر تحديث ','Updated '))+esc(fmtDateTime(x.updatedAt))+'</span>' : '')
        + '</div></button>';
    }).join('');
    h += '</div></div>';
    return h;
  }
  window.setIF = function(k, v){ isf[k] = v; render(); };
  window.clearIF = function(){ isf = { status:'all', category:'all', period:'all', order:'all' }; render(); };

  function issueDetailHTML(){
    var x = issueById(st.detail.id);
    if (!x){ st.detail = null; return issuesHTML(); }
    var h = '<div class="cx-wrap"><div><button class="cx-btn cx-back" onclick="closeDetail()"><i class="ti ti-arrow-'+(isEn()?'left':'right')+'"></i>'
      + esc(T('كل المشاكل','All issues'))+'</button></div>';
    h += '<section class="cx-sec" id="cxIssue"><div class="cx-sec-h"><h3>'+esc(x.subject)+'</h3>'+statusTag(x.status)+'</div>'
      + '<dl class="cx-dl"><div><dt>'+esc(T('رقم المشكلة','Issue ID'))+'</dt><dd><bdi>'+esc(x.issueId)+'</bdi></dd></div>'
      + '<div><dt>'+esc(T('التصنيف','Category'))+'</dt><dd>'+esc(catLabel(x.category))+'</dd></div>'
      + '<div><dt>'+esc(T('الطلب','Order'))+'</dt><dd><bdi>'+esc(x.orderId)+'</bdi></dd></div>'
      + '<div><dt>'+esc(T('العميل','Customer'))+'</dt><dd>'+esc(CX.customerNameOf(x.orderId) || '—')+'</dd></div>'
      + '<div><dt>'+esc(T('تاريخ الفتح','Opened'))+'</dt><dd>'+esc(fmtDateTime(x.createdAt))+'</dd></div>'
      + (x.reopenedAt ? '<div><dt>'+esc(T('أُعيد فتحها','Reopened'))+'</dt><dd>'+esc(fmtDateTime(x.reopenedAt))+'</dd></div>' : '')
      + '</dl><div class="cx-small" style="margin-top:14px;font-weight:800">'+esc(T('وصف العميل','Customer description'))+'</div>'
      + '<div class="cx-text" style="margin-top:6px">'+esc(x.description)+'</div>';
    /* status controls — only the moves the authority allows from here */
    var moves = CX.TRANSITIONS[x.status] || [];
    if (data.editable && moves.length){
      h += '<div class="cx-statuses" id="cxMoves">' + moves.map(function(m){
        var t = MOVE_TXT[m];
        return '<button class="cx-btn '+t.cls+'" onclick="moveIssue(\''+m+'\')"><i class="ti '+t.ic+'"></i>'+esc(T(t.ar,t.en))+'</button>';
      }).join('') + '</div>';
    }
    if (st.detail.msg) h += '<div class="cx-msgbox">'+esc(st.detail.msg)+'</div>';
    h += '</section>';

    h += '<section class="cx-sec" id="cxConv"><div class="cx-sec-h"><h3>'+esc(T('المحادثة','Conversation'))+'</h3></div>';
    h += x.messages.length ? '<div class="cx-msgs">' + x.messages.map(function(m){
      var who = m.actorType === 'merchant' ? T('المتجر','Store') : T('العميل','Customer');
      return '<div class="cx-msg '+(m.actorType === 'merchant' ? 'merchant' : 'customer')+'"><div class="h">'+esc(who)+' · '+esc(m.actorName || '')
        + '<span class="d">'+esc(fmtDateTime(m.createdAt))+'</span></div><p>'+esc(m.body)+'</p></div>';
    }).join('') + '</div>' : '<div class="cx-small" style="margin-top:8px">'+esc(T('لا توجد رسائل بعد.','No messages yet.'))+'</div>';
    if (x.status === 'resolved'){
      h += '<div class="cx-note"><i class="ti ti-circle-check"></i>'+esc(T('تم حل هذه المشكلة. يمكن للعميل إعادة فتحها إذا لم تُحل فعلًا.','This issue is resolved. The customer can reopen it if it was not actually solved.'))+'</div>';
    } else if (!data.editable){
      h += '<div class="cx-note"><i class="ti ti-eye"></i>'+esc(T('للقراءة فقط — الرد وتغيير الحالة متاحان لصاحب المتجر.','Read only — replying and changing status are available to the store owner.'))+'</div>';
    } else {
      var max = CX.LIMITS.message;
      h += '<div class="cx-field'+(draft.err ? ' bad' : '')+'"><textarea id="cxDraft" maxlength="'+max+'" aria-label="'+esc(T('رد على العميل','Reply to the customer'))+'"'
        + ' oninput="draftInput(this.value)" placeholder="'+esc(T('اكتب ردك للعميل','Write your reply to the customer'))+'">'+esc(draft.text)+'</textarea>'
        + '<div class="cx-fmeta"><span class="err" id="cxErr">'+esc(draft.err || '')+'</span><span class="cnt" id="cxCnt">'+draft.text.length+' / '+max+'</span></div></div>'
        + '<div class="cx-acts"><button class="cx-btn gold" id="cxSend" onclick="sendIssueReply()"'+(draft.text.trim() ? '' : ' disabled')+'><i class="ti ti-send"></i>'
        + esc(T('إرسال','Send'))+'</button></div>';
    }
    return h + '</section></div>';
  }
  window.openIssue = function(id){ st.detail = { kind:'issue', id:id, msg:null }; draft = { text:'', editing:false, err:null }; render(); scrollTop(); };
  window.sendIssueReply = function(){
    var res = CX.replyIssue(st.detail.id, draft.text, { actor:ME.id });
    if (!res.ok){ draft.err = res.message; render(); focusDraft(); return; }
    draft = { text:'', editing:false, err:null }; load(); render(); toast(T('تم إرسال الرد','Reply sent'));
  };
  window.moveIssue = function(to){
    var x = issueById(st.detail.id); if (!x) return;
    var res = CX.changeIssueStatus(x.issueId, to, { actor:ME.id, baseVersion:x.updatedAt });
    if (!res.ok){ st.detail.msg = res.message; load(); render(); return; }
    st.detail.msg = null; load(); render(); toast(T('تم تحديث الحالة','Status updated'));
  };

  window.closeDetail = function(){ st.detail = null; draft = { text:'', editing:false, err:null }; render(); };
  function scrollTop(){ try { window.scrollTo(0, 0); } catch(e){} }
  function focusDraft(){ var t = el('cxDraft'); if (t){ t.focus(); var n = t.value.length; try { t.setSelectionRange(n, n); } catch(e){} } }

  /* ---------- navigation / language ---------- */
  window.setTab = function(k){
    if (!TABS.some(function(t){ return t.k === k; })) return;
    st.tab = k; st.detail = null; draft = { text:'', editing:false, err:null }; savePrefs(); render();
    var b = el('tab-' + k); if (b) b.focus({ preventScroll:true });
  };
  window.cxRefresh = function(){ load(); render(); };
  window.toggleLang = function(){
    var r = root(), en = r.lang === 'en';
    r.lang = en ? 'ar' : 'en'; r.dir = en ? 'rtl' : 'ltr';
    try { localStorage.setItem('raf_lang', r.lang); } catch(e){}
    applyLang(); render();
  };
  function applyLang(){
    var en = isEn();
    document.querySelectorAll('[data-ar][data-en]').forEach(function(e){
      var t = e.getAttribute('data-'+(en?'en':'ar')); if (t !== null) e.textContent = t;
    });
    el('langLabel').textContent = en ? 'ع' : 'EN';
    document.title = en ? 'RAF — Customer Experience' : 'رف — تجربة العملاء';
  }
  document.addEventListener('keydown', function(e){
    if (e.key === 'Escape' && st.detail){ closeDetail(); return; }
    if (!e.target || !e.target.closest || !e.target.closest('#tabs')) return;
    if (e.key !== 'ArrowLeft' && e.key !== 'ArrowRight') return;
    var i = TABS.findIndex(function(t){ return t.k === st.tab; });
    var fwd = (e.key === 'ArrowLeft') === !isEn();
    e.preventDefault(); setTab(TABS[(i + (fwd ? 1 : -1) + TABS.length) % TABS.length].k);
  });
  /* another session changed something: re-read, keep any draft being typed */
  function onExternal(){ if (st.state === 'ready'){ load(); render(); if (draft.text) focusDraft(); } }
  window.addEventListener('storage', function(e){ if (e.key === 'raf_customer_experience') onExternal(); });

  function gate(title, text){
    el('gate').style.display = ''; el('gateT').textContent = title; el('gateP').textContent = text;
  }
  function boot(){
    var l = null; try { l = localStorage.getItem('raf_lang'); } catch(e){}
    if (l === 'en'){ root().lang = 'en'; root().dir = 'ltr'; }
    applyLang();
    if (!CX || !window.RAFPerm){ gate(T('تعذّر التحميل','Could not load'), ''); return; }
    var me = RAFPerm.currentUser();
    var link = RAFPerm.storeLinkOf(me ? me.id : null);
    if (!me || !link.ok){
      gate(link.reason === 'store_not_found' ? T('المتجر المرتبط غير موجود','Linked store not found') : T('لا يوجد متجر مرتبط بالحساب','No store linked to this account'),
           T('لم يتم ربط هذا الحساب بمتجر. يتم الربط يدوياً ولا يُخمَّن تلقائياً.','This account is not linked to a store. Links are set explicitly and never inferred.'));
      return;
    }
    if (!CX.canView(me.id)){
      gate(T('لا تملك صلاحية عرض تجربة العملاء','You do not have permission to view Customer Experience'), '');
      return;
    }
    ME = me; SLUG = link.slug;
    var s = link.store;
    el('stName').textContent = L(s.name);
    if (s.logo){ el('stLogo').style.backgroundImage = 'url("'+s.logo+'")'; el('stLogo').innerHTML = ''; }
    el('shell').style.display = '';
    loadPrefs();
    st.state = 'loading'; render();
    setTimeout(function(){ load(); render(); }, 0);
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot); else boot();
})();
</script>
</body>
</html>
