<!DOCTYPE html>
<html id="htmlRoot" lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>رف — طلب سريع</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700;900&family=Tajawal:wght@300;400;500;700;800&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
<link rel="icon" type="image/png" sizes="64x64" href="raf_favicon.png">
<link rel="icon" type="image/png" sizes="32x32" href="raf_favicon_32.png">
<link rel="apple-touch-icon" href="raf_appicon.png">
<style>
:root{
  --bg:#F5F2EC; --bg2:#EDE8DC; --bg3:#E7E1D4; --card:#FFFFFF;
  --gold:#C9A84C; --gold2:#A07828; --gold-soft:rgba(201,168,76,.12);
  --ink:#15130F; --text:#0A0A0A; --text2:#5A5650; --text3:#8A857C;
  --border:#E2DBCC; --border2:#D8D0BE;
  --green:#2E9E5B; --green-bg:rgba(46,158,91,.12);
  --red:#D9534F; --red-bg:rgba(217,83,79,.12);
  --r:12px; --rl:18px;
  --font:'Tajawal',sans-serif; --fdisplay:'Playfair Display',serif; --fen:'DM Sans',sans-serif;
  --sh:0 1px 3px rgba(20,16,8,.05),0 12px 30px -20px rgba(20,16,8,.25);
}
*{box-sizing:border-box;margin:0;padding:0;}
html{overflow-x:hidden;}
body{background:var(--bg);color:var(--text);font-family:var(--font);min-height:100vh;overflow-x:hidden;
  display:flex;flex-direction:column;}

/* ---------- header ---------- */
.qhead{position:sticky;top:0;z-index:60;display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:11px clamp(14px,4vw,32px);padding-top:max(11px,env(safe-area-inset-top));
  background:rgba(245,242,236,.9);backdrop-filter:saturate(180%) blur(12px);border-bottom:1px solid var(--border);}
.qh-btn{display:inline-flex;align-items:center;gap:7px;height:40px;padding:0 14px;border-radius:30px;background:var(--card);
  border:1px solid var(--border2);color:var(--text2);font-family:var(--font);font-size:13px;font-weight:600;
  text-decoration:none;cursor:pointer;transition:all .2s;}
.qh-btn:hover{border-color:var(--gold);color:var(--gold2);}
.qh-title{display:inline-flex;align-items:center;gap:7px;font-family:var(--fen);font-size:11px;font-weight:700;
  letter-spacing:2.5px;text-transform:uppercase;color:var(--gold2);}
.qh-title i{font-size:15px;}
.lang-btn{height:40px;padding:0 13px;border:1px solid var(--border2);border-radius:30px;background:var(--card);color:var(--text2);
  font-family:var(--fen);font-size:12px;font-weight:600;cursor:pointer;transition:all .2s;display:inline-flex;align-items:center;gap:6px;}
.lang-btn:hover{border-color:var(--gold);color:var(--gold2);}
.lang-dot{width:6px;height:6px;border-radius:50%;background:var(--gold);}

/* ---------- layout ---------- */
.qwrap{flex:1;width:100%;max-width:980px;margin:0 auto;padding:20px clamp(14px,4vw,32px) 132px;}
.qcard{background:var(--card);border:1px solid var(--border);border-radius:24px;box-shadow:var(--sh);overflow:hidden;}
.qgrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.05fr);}
@media(max-width:860px){.qgrid{grid-template-columns:1fr;}}

/* ---------- visual ---------- */
.qvis{position:relative;aspect-ratio:1/1;background:linear-gradient(150deg,var(--bg2),var(--bg3));
  display:flex;align-items:center;justify-content:center;font-size:120px;color:var(--gold2);}
@media(max-width:860px){.qvis{aspect-ratio:16/10;font-size:82px;}}
.qvis::after{content:'';position:absolute;inset:0;background:radial-gradient(420px 220px at 78% 16%,rgba(255,255,255,.5),transparent 62%);pointer-events:none;}
.q-disc{position:absolute;top:16px;inset-inline-start:16px;background:var(--red);color:#fff;font-family:var(--fen);
  font-size:13px;font-weight:800;padding:6px 12px;border-radius:20px;box-shadow:0 6px 16px -6px rgba(217,83,79,.6);}
.q-wish{position:absolute;top:14px;inset-inline-end:14px;width:42px;height:42px;border-radius:50%;border:none;
  background:rgba(255,255,255,.94);color:var(--text2);font-size:20px;cursor:pointer;display:flex;align-items:center;
  justify-content:center;box-shadow:0 4px 14px -4px rgba(20,16,8,.3);transition:all .2s;}
.q-wish:hover,.q-wish.on{color:var(--red);}
.q-oosbadge{position:absolute;inset-inline-start:16px;bottom:16px;background:rgba(20,16,8,.86);color:#fff;
  border-radius:20px;padding:7px 14px;font-size:12.5px;font-weight:700;display:inline-flex;align-items:center;gap:6px;}

/* ---------- body ---------- */
.qbody{padding:24px clamp(18px,3vw,28px);display:flex;flex-direction:column;}
.qstore{display:inline-flex;align-items:center;gap:8px;align-self:flex-start;background:var(--gold-soft);
  border:1px solid rgba(201,168,76,.32);border-radius:30px;padding:6px 13px;font-size:12.5px;font-weight:700;
  color:var(--gold2);text-decoration:none;transition:all .2s;}
.qstore:hover{background:var(--gold);color:#1C1606;}
.qstore i{font-size:15px;}
.qname{font-family:var(--fdisplay);font-size:clamp(21px,2.6vw,27px);font-weight:800;color:var(--ink);
  line-height:1.3;margin:13px 0 8px;}
.qrate{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--text2);}
.qrate i{color:var(--gold);font-size:16px;}
.qrate span{color:var(--text3);}
.qdesc{font-size:13.5px;line-height:1.8;color:var(--text2);margin-top:12px;}
.qprice{display:flex;align-items:baseline;gap:11px;margin:16px 0 4px;flex-wrap:wrap;}
.qprice b{font-family:var(--fen);font-size:30px;font-weight:800;color:var(--ink);line-height:1;}
.qprice small{font-size:14px;font-weight:600;color:var(--text3);}
.qprice del{font-family:var(--fen);font-size:15px;color:var(--text3);}
.qsave{font-size:12px;font-weight:700;color:var(--green);background:var(--green-bg);border-radius:20px;padding:4px 10px;}
.qstock{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:700;margin-top:10px;}
.qstock.ok{color:var(--green);} .qstock.low{color:#C8791E;} .qstock.out{color:var(--red);}

/* ---------- options ---------- */
.qsec{margin-top:22px;}
.qlbl{display:flex;align-items:center;gap:7px;font-size:13px;font-weight:700;color:var(--ink);margin-bottom:10px;}
.qlbl .req{color:var(--red);font-size:15px;line-height:1;}
.qlbl .pick{margin-inline-start:auto;font-size:11.5px;font-weight:600;color:var(--text3);}
.qopts{display:flex;flex-wrap:wrap;gap:9px;}
.qopt{min-width:52px;padding:10px 16px;border:1.5px solid var(--border2);border-radius:12px;background:var(--card);
  color:var(--text2);font-family:var(--font);font-size:13.5px;font-weight:700;cursor:pointer;transition:all .18s;}
.qopt:hover{border-color:var(--gold);color:var(--gold2);}
.qopt.on{background:var(--ink);color:#F5F0E4;border-color:var(--ink);}
.qopt:focus-visible{outline:2px solid var(--gold);outline-offset:2px;}
/* colour swatches */
.qsw{display:flex;align-items:center;gap:8px;padding:7px 14px 7px 8px;border:1.5px solid var(--border2);border-radius:30px;
  background:var(--card);color:var(--text2);font-family:var(--font);font-size:13px;font-weight:700;cursor:pointer;transition:all .18s;}
[dir="rtl"] .qsw{padding:7px 8px 7px 14px;}
.qsw:hover{border-color:var(--gold);}
.qsw.on{border-color:var(--ink);background:var(--bg2);color:var(--ink);}
.qsw i.dot{width:22px;height:22px;border-radius:50%;border:1px solid rgba(20,16,8,.18);flex-shrink:0;}
.qsw:focus-visible{outline:2px solid var(--gold);outline-offset:2px;}

/* qty + notes */
.qqty{display:inline-flex;align-items:center;border:1.5px solid var(--border2);border-radius:30px;overflow:hidden;background:var(--card);}
.qqty button{width:44px;height:44px;border:none;background:transparent;color:var(--text2);font-size:17px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;transition:background .15s;}
.qqty button:hover:not(:disabled){background:var(--gold-soft);color:var(--gold2);}
.qqty button:disabled{opacity:.4;cursor:not-allowed;}
.qqty span{min-width:46px;text-align:center;font-family:var(--fen);font-size:16px;font-weight:800;color:var(--ink);}
.qnotes{width:100%;min-height:64px;border:1.5px solid var(--border2);border-radius:12px;background:#FCFBF8;padding:11px 13px;
  font-family:var(--font);font-size:13.5px;color:var(--text);outline:none;resize:vertical;line-height:1.7;}
.qnotes:focus{border-color:var(--gold);box-shadow:0 0 0 3px var(--gold-soft);}

/* full details link */
.qfull{display:inline-flex;align-items:center;gap:7px;margin-top:18px;font-size:13px;font-weight:700;color:var(--gold2);
  text-decoration:none;align-self:flex-start;}
.qfull:hover{text-decoration:underline;}

/* ---------- sticky action bar ---------- */
.qbar{position:fixed;inset-inline:0;bottom:0;z-index:70;background:rgba(255,255,255,.97);backdrop-filter:blur(14px);
  border-top:1px solid var(--border);box-shadow:0 -4px 24px -12px rgba(20,16,8,.3);
  padding:12px clamp(14px,4vw,32px);padding-bottom:calc(12px + env(safe-area-inset-bottom,0px));}
.qbar-in{max-width:980px;margin:0 auto;display:flex;align-items:center;gap:14px;}
.qtotal{flex-shrink:0;}
.qtotal small{display:block;font-size:11px;color:var(--text3);margin-bottom:2px;}
.qtotal b{font-family:var(--fen);font-size:21px;font-weight:800;color:var(--ink);}
.qadd{flex:1;height:54px;border:1px solid var(--gold2);border-radius:30px;background:var(--gold);color:#1C1606;
  font-family:var(--font);font-size:15.5px;font-weight:800;cursor:pointer;display:inline-flex;align-items:center;
  justify-content:center;gap:9px;transition:all .2s;box-shadow:0 10px 24px -12px rgba(201,168,76,.8);}
.qadd:hover:not(:disabled){background:var(--gold2);color:#fff;transform:translateY(-1px);}
.qadd:disabled{background:var(--bg3);color:var(--text3);border-color:var(--border);box-shadow:none;cursor:not-allowed;}
.qadd i{font-size:20px;}
@media(max-width:560px){.qtotal b{font-size:18px;}.qadd{font-size:14.5px;height:50px;}}

/* ---------- toast / states ---------- */
.qempty{text-align:center;padding:70px 20px;}
.qempty i{font-size:52px;color:var(--gold);display:block;margin-bottom:14px;}
.qempty h2{font-family:var(--fdisplay);font-size:22px;font-weight:800;color:var(--ink);margin-bottom:8px;}
.qempty p{font-size:14px;color:var(--text3);margin-bottom:22px;}
.qempty a{display:inline-flex;align-items:center;gap:8px;height:48px;padding:0 24px;border-radius:30px;background:var(--gold);
  color:#1C1606;text-decoration:none;font-weight:700;}
.hint{font-size:12.5px;color:var(--red);margin-top:10px;display:none;align-items:center;gap:6px;}
.hint.show{display:flex;}
@media(prefers-reduced-motion:reduce){.qadd:hover{transform:none;}}
</style>
<script src="raf_features.js"></script>
<link rel="stylesheet" href="raf_theme.css">
</head>
<body>

<header class="qhead">
  <button type="button" class="qh-btn" onclick="goBack()"><i class="ti ti-arrow-right"></i> <span data-ar="رجوع" data-en="Back">رجوع</span></button>
  <div class="qh-title"><i class="ti ti-bolt"></i> <span data-ar="طلب سريع" data-en="Quick Order">طلب سريع</span></div>
  <button class="lang-btn" onclick="toggleLang()"><span class="lang-dot"></span><span id="langLabel">EN</span></button>
</header>

<main class="qwrap" id="qRoot"></main>

<div class="qbar" id="qBar" style="display:none;">
  <div class="qbar-in">
    <div class="qtotal"><small data-ar="الإجمالي" data-en="Total">الإجمالي</small><b id="qTotal">—</b></div>
    <button class="qadd" id="qAdd" onclick="addAndContinue()">
      <i class="ti ti-shopping-cart-plus"></i> <span id="qAddLbl" data-ar="أضف ومتابعة التسوق" data-en="Add & continue shopping">أضف ومتابعة التسوق</span>
    </button>
  </div>
</div>

<script src="raf_source.js"></script>
<script src="raf_data.js"></script>
<script src="raf_swipe.js"></script>
<script src="raf_sizeguide.js"></script>
<script src="raf_card.js"></script>
<script src="raf_catalog.js"></script>
<script src="raf_rules.js"></script>
<script>
/* ============================================================
   QUICK ORDER PRODUCT — lightweight preview for multi-store listings.
   Flow: listing → Quick Order → (add) → Store Page.
   Full details remain available on raf_product.html (untouched).
   ============================================================ */
(function(){
  function en(){ return document.getElementById('htmlRoot').lang==='en'; }
  function T(ar,e){ return en()?e:ar; }
  function L(o){ return (o&&typeof o==='object')?(en()?o.en:o.ar):(o||''); }
  function money(n){ return (Math.round(n*1000)/1000).toFixed(3); }

  var qs=new URLSearchParams(location.search);
  var PID=qs.get('id')||'';
  var P=null, sel={}, qty=1;

  /* ---------- language ---------- */
  window.toggleLang=function(){
    var r=document.getElementById('htmlRoot'), isAr=r.lang==='ar';
    r.lang=isAr?'en':'ar'; r.dir=isAr?'ltr':'rtl';
    try{ localStorage.setItem('raf_lang',r.lang); }catch(e){}
    document.getElementById('langLabel').textContent=isAr?'ع':'EN';
    document.querySelectorAll('[data-ar]').forEach(function(el){
      var t=el.getAttribute('data-'+r.lang); if(t!==null) el.textContent=t;
    });
    render();
  };
  (function(){
    var l=null; try{ l=localStorage.getItem('raf_lang'); }catch(e){}
    if(l==='en'){ var r=document.getElementById('htmlRoot'); r.lang='en'; r.dir='ltr';
      document.getElementById('langLabel').textContent='ع';
      document.querySelectorAll('[data-en]').forEach(function(el){ el.textContent=el.getAttribute('data-en'); }); }
  })();

  window.goBack=function(){
    if(document.referrer && document.referrer.indexOf(location.origin)===0 && history.length>1) history.back();
    else location.href='raf_homepage.html';
  };

  function storeUrl(){ return 'raf_store.html?store='+encodeURIComponent(P.slug||''); }

  /* ---------- render ---------- */
  function render(){
    var root=document.getElementById('qRoot');
    P = window.RAFCatalog ? RAFCatalog.get(PID) : null;
    if(!P){
      document.getElementById('qBar').style.display='none';
      root.innerHTML='<div class="qempty"><i class="ti ti-package-off"></i>'
        +'<h2>'+T('المنتج غير متاح','Product unavailable')+'</h2>'
        +'<p>'+T('لم نتمكن من العثور على هذا المنتج.','We couldn\'t find this product.')+'</p>'
        +'<a href="raf_homepage.html"><i class="ti ti-building-store"></i> '+T('تصفّح المحلات','Browse stores')+'</a></div>';
      return;
    }
    var out = P.stock===0;
    var saved = P.old ? (parseFloat(P.old)-parseFloat(P.price)) : 0;
    var inWish = window.RAFShop && RAFShop.Wish.has(P.id);

    root.innerHTML =
      '<div class="qcard"><div class="qgrid">'
      + '<div class="qvis"><i class="ti '+P.ic+'"></i>'
        + (P.disc?'<span class="q-disc">-'+P.disc+'%</span>':'')
        + '<button class="q-wish'+(inWish?' on':'')+'" onclick="toggleWish(this)" aria-label="wishlist"><i class="ti '+(inWish?'ti-heart-filled':'ti-heart')+'"></i></button>'
        + (out?'<span class="q-oosbadge"><i class="ti ti-ban"></i> '+T('نفد المخزون','Out of stock')+'</span>':'')
      + '</div>'
      + '<div class="qbody">'
        + '<a class="qstore" href="'+storeUrl()+'"><i class="ti ti-building-store"></i> '+L(P.store)+'</a>'
        + '<h1 class="qname">'+L(P)+'</h1>'
        + (P.rate?'<div class="qrate"><i class="ti ti-star-filled"></i> '+P.rate+(P.rev?' <span>('+P.rev+')</span>':'')+'</div>':'')
        + (P.desc?'<p class="qdesc">'+L(P.desc)+'</p>':'')
        + '<div class="qprice"><b>'+P.price+'</b><small>'+T('د.ك','KWD')+'</small>'
          + (P.old?'<del>'+P.old+'</del>':'')
          + (saved>0?'<span class="qsave">'+T('وفّرت '+money(saved)+' د.ك','Save '+money(saved)+' KWD')+'</span>':'')
        + '</div>'
        + stockHTML(P)
        + optionsHTML(P)
        + '<div class="qsec"><div class="qlbl"><i class="ti ti-stack-2"></i> '+T('الكمية','Quantity')+'</div>'
          + '<div class="qqty"><button onclick="chQty(-1)" '+(out?'disabled':'')+' aria-label="-"><i class="ti ti-minus"></i></button>'
          + '<span id="qNum">'+qty+'</span>'
          + '<button onclick="chQty(1)" '+(out?'disabled':'')+' aria-label="+"><i class="ti ti-plus"></i></button></div></div>'
        + '<div class="qsec"><div class="qlbl"><i class="ti ti-note"></i> '+T('ملاحظات','Notes')
          + '<span class="pick">'+T('اختياري','Optional')+'</span></div>'
          + '<textarea class="qnotes" id="qNotes" placeholder="'+T('أي طلب خاص لهذا المنتج…','Any special request for this item…')+'"></textarea></div>'
        + '<div class="hint" id="qHint"><i class="ti ti-alert-circle"></i><span></span></div>'
        + '<a class="qfull" href="raf_product.html?id='+encodeURIComponent(P.id)+'"><i class="ti ti-list-details"></i> '
          + T('عرض التفاصيل الكاملة','View full details')+'</a>'
      + '</div></div></div>';

    /* restore textarea + selections across re-render (language toggle) */
    document.getElementById('qNotes').value = notes;
    document.getElementById('qBar').style.display='';
    var add=document.getElementById('qAdd');
    add.disabled = out;
    document.getElementById('qAddLbl').textContent = out ? T('غير متوفر','Unavailable') : T('أضف و تابع التسوق','Add & continue shopping');
    updateTotal();
  }

  function stockHTML(p){
    if(p.stock===0) return '<div class="qstock out"><i class="ti ti-ban"></i> '+T('نفد المخزون حالياً','Currently out of stock')+'</div>';
    if(p.stock<=5)  return '<div class="qstock low"><i class="ti ti-flame"></i> '+T('بقي '+p.stock+' قطع فقط','Only '+p.stock+' left')+'</div>';
    return '<div class="qstock ok"><i class="ti ti-circle-check"></i> '+T('متوفر','In stock')+'</div>';
  }

  function optionsHTML(p){
    if(!p.variants||!p.variants.length) return '';
    return p.variants.map(function(g,gi){
      var isColor=/لون|color/i.test(L(g.label));
      var opts=g.options.map(function(o,oi){
        var lbl=L(o.label||o), on=sel['g'+gi]===String(o.v);
        if(isColor&&o.hex){
          return '<button class="qsw'+(on?' on':'')+'" onclick="pick('+gi+',\''+String(o.v).replace(/'/g,"\\'")+'\',this)">'
            + '<i class="dot" style="background:'+o.hex+'"></i>'+lbl+'</button>';
        }
        return '<button class="qopt'+(on?' on':'')+'" onclick="pick('+gi+',\''+String(o.v).replace(/'/g,"\\'")+'\',this)">'+lbl+'</button>';
      }).join('');
      var chosen=sel['g'+gi];
      var chosenLbl=chosen?L((g.options.find(function(o){return String(o.v)===chosen;})||{}).label||''):'';
      return '<div class="qsec"><div class="qlbl">'+L(g.label)+' <span class="req">*</span>'
        + '<span class="pick">'+(chosenLbl||T('مطلوب','Required'))+'</span></div>'
        + '<div class="qopts">'+opts+'</div></div>';
    }).join('');
  }

  /* ---------- interactions ---------- */
  var notes='';
  window.pick=function(gi,v,btn){
    sel['g'+gi]=v;
    btn.parentElement.querySelectorAll('.qopt,.qsw').forEach(function(b){ b.classList.remove('on'); });
    btn.classList.add('on');
    var lblRow=btn.closest('.qsec').querySelector('.pick');
    if(lblRow) lblRow.textContent=btn.textContent.trim();
    hideHint();
  };
  window.chQty=function(d){
    var max=P.stock||99;
    qty=Math.max(1,Math.min(max,qty+d));
    document.getElementById('qNum').textContent=qty;
    updateTotal();
  };
  window.toggleWish=function(btn){
    if(!window.RAFShop) return;
    var on=RAFShop.Wish.toggle(P);
    btn.classList.toggle('on',on);
    btn.querySelector('i').className='ti '+(on?'ti-heart-filled':'ti-heart');
    RAFShop.toast(on?T('أُضيف إلى المفضلة','Added to favorites'):T('أُزيل من المفضلة','Removed from favorites'),{icon:on?'ti-heart-filled':'ti-heart'});
  };
  function updateTotal(){
    document.getElementById('qTotal').textContent=money(parseFloat(P.price)*qty)+' '+T('د.ك','KWD');
  }
  function showHint(msg){ var h=document.getElementById('qHint'); h.querySelector('span').textContent=msg; h.classList.add('show'); }
  function hideHint(){ var h=document.getElementById('qHint'); if(h) h.classList.remove('show'); }

  /* ---------- add → then continue in the same store ---------- */
  window.addAndContinue=function(){
    if(!P || P.stock===0) return;
    notes=(document.getElementById('qNotes')||{}).value||'';
    /* every required option must be chosen first */
    var variant={};
    if(P.variants){
      for(var gi=0; gi<P.variants.length; gi++){
        var g=P.variants[gi], v=sel['g'+gi];
        if(v==null){ showHint(T('اختر '+L(g.label)+' أولاً','Please select '+L(g.label)+' first')); return; }
        var opt=g.options.find(function(o){ return String(o.v)===String(v); });
        variant[L(g.label)]=L(opt.label||opt);
      }
    }
    if(notes.trim()) variant[T('ملاحظات','Notes')]=notes.trim();

    var btn=document.getElementById('qAdd');
    btn.disabled=true;
    /* one-store-per-order is enforced centrally by RAFShop.Cart.tryAdd */
    RAFShop.Cart.tryAdd(P,variant).then(function(r){
      if(!r.added){ btn.disabled=false; return; }
      for(var i=1;i<qty;i++) RAFShop.Cart.add(P,variant);
      RAFShop.Cart.badge();
      RAFShop.toast(T('تمت الإضافة إلى السلة','Added to your cart'),{icon:'ti-circle-check'});
      /* intentional flow: continue shopping inside the same store */
      setTimeout(function(){ location.href=storeUrl(); },700);
    }).catch(function(){ btn.disabled=false; });
  };

  render();
})();
</script>
</body>
</html>
