<!DOCTYPE html>
<html id="htmlRoot" lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>رف — إدارة المتجر</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700;900&family=Tajawal:wght@300;400;500;700;800&family=DM+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
<!-- RAF's existing theme mechanism: the saved light / dark choice is applied
     before first paint (no flash). Reading it writes nothing. -->
<script src="raf_admin_theme.js"></script>
<link rel="icon" type="image/png" sizes="64x64" href="raf_favicon.png">
<link rel="icon" type="image/png" sizes="32x32" href="raf_favicon_32.png">
<link rel="apple-touch-icon" href="raf_appicon.png">
<script src="raf_features.js"></script>
<script src="raf_config.js"></script>
<script src="raf_event_bus.js"></script>
<script src="raf_record_store.js"></script>
<script src="raf_notify_core.js"></script>
<link rel="stylesheet" href="raf_theme.css">
<style>
/* ══════════════════════════════════════════════════════════════
   STORE MANAGEMENT — view → edit → save.
   Values are shown as plain text; a section becomes editable only when
   the merchant asks, one section at a time, with Save beside it.
   Every write still goes through RAFStoreProfile / RAFStoreOps.
   ══════════════════════════════════════════════════════════════ */
*{box-sizing:border-box;}
[hidden]{display:none!important;}
body{background:var(--bg2);margin:0;}
.mw{display:flex;min-height:100vh;}
.mw-rail{width:74px;flex:0 0 74px;background:var(--ink);display:flex;flex-direction:column;align-items:center;
  gap:6px;padding:14px 0;position:sticky;top:0;height:100vh;z-index:40;}
.mw-rail-logo{width:44px;height:44px;min-height:44px;border-radius:13px;background:var(--gold);color:#1C1606;display:flex;
  align-items:center;justify-content:center;font-family:var(--font-display);font-size:19px;font-weight:900;
  margin-bottom:10px;text-decoration:none;}
.mw-rail-b{width:50px;min-height:50px;border-radius:14px;border:0;background:transparent;color:#8E877A;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;cursor:pointer;
  font-family:inherit;font-size:9.5px;font-weight:700;text-decoration:none;transition:background .18s,color .18s;}
.mw-rail-b i{font-size:21px;}
.mw-rail-b:hover{background:rgba(255,255,255,.07);color:#EDE8DC;}
.mw-rail-b.on{background:var(--gold-soft);color:var(--gold);}
.mw-rail-sp{flex:1;}
.mw-main{flex:1;min-width:0;display:flex;flex-direction:column;}

.mw-head{position:sticky;top:0;z-index:35;background:var(--card);border-bottom:1px solid var(--border);
  padding:12px clamp(14px,2.2vw,24px);display:flex;align-items:center;gap:14px;flex-wrap:wrap;}
.mw-store{display:flex;align-items:center;gap:11px;min-width:0;}
.mw-store-logo{width:44px;height:44px;flex:0 0 auto;border-radius:13px;background:var(--bg3) center/cover no-repeat;
  display:flex;align-items:center;justify-content:center;color:var(--gold2);font-size:21px;}
.mw-store-t{min-width:0;}
.mw-store-t b{display:block;font-family:var(--font-display);font-size:17px;font-weight:800;color:var(--ink);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.mw-store-t span{font-size:11.5px;color:var(--text3);}
.mw-head-sp{flex:1;min-width:8px;}
.mw-hact{display:flex;align-items:center;gap:8px;}
.mw-ico-b{width:44px;height:44px;flex:0 0 auto;border-radius:13px;border:1px solid var(--border2);
  background:var(--card);color:var(--text2);font-size:18px;cursor:pointer;display:inline-flex;
  align-items:center;justify-content:center;font-family:inherit;font-weight:800;transition:all .18s;}
.mw-hact .mw-ico-b{min-height:44px;}
.mw-ico-b:hover{border-color:var(--gold);color:var(--gold2);}
.mw-ico-b.lang{width:auto;padding:0 14px;font-size:12.5px;}
.mw-body{padding:18px clamp(14px,2.2vw,24px) 60px;width:100%;}

/* ---------- tabs ---------- */
.sm-tabs{display:flex;gap:4px;max-width:760px;margin:0 auto 16px;border:1px solid var(--border2);border-radius:15px;
  background:var(--card);padding:4px;overflow-x:auto;scrollbar-width:none;}
.sm-tabs::-webkit-scrollbar{display:none;}
/* the theme's `html:not([data-ui]) button` rule is (0,1,2); touch targets are
   scoped with two classes so 44px+ actually wins */
.mw-body .sm-tabs button{min-height:46px;}
.sm-tabs button{flex:1 0 auto;min-height:46px;padding:0 16px;border:0;border-radius:11px;background:transparent;
  color:var(--text2);font-family:inherit;font-size:13.5px;font-weight:800;cursor:pointer;white-space:nowrap;
  display:inline-flex;align-items:center;justify-content:center;gap:7px;transition:all .18s;}
.sm-tabs button i{font-size:17px;}
.sm-tabs button:hover{color:var(--ink);background:var(--bg);}
.sm-tabs button[aria-selected="true"]{background:var(--ink);color:#F5F0E4;}
.sm-tabs button:focus-visible{outline:2px solid var(--gold);outline-offset:2px;}

/* ---------- sections ---------- */
.sm-wrap{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:14px;}
.sm-sec{background:var(--card);border:1px solid var(--border);border-radius:18px;padding:18px 20px;min-width:0;}
.sm-sec.editing{border-color:var(--gold);box-shadow:0 0 0 3px var(--gold-soft);}
.sm-sec-h{display:flex;align-items:center;gap:10px;min-height:44px;}
.sm-sec-h h3{margin:0;flex:1;min-width:0;font-size:15.5px;font-weight:800;color:var(--ink);}
.sm-sec .sm-edit-b{min-height:44px;}
.sm-edit-b{min-height:44px;padding:0 16px;border-radius:12px;border:1px solid var(--border2);background:var(--card);
  color:var(--ink);font-family:inherit;font-size:13px;font-weight:800;cursor:pointer;display:inline-flex;
  align-items:center;gap:6px;flex:0 0 auto;transition:all .18s;}
.sm-edit-b i{font-size:16px;color:var(--gold2);}
.sm-edit-b:hover{border-color:var(--gold);background:var(--gold-soft);}
.sm-edit-b:focus-visible{outline:2px solid var(--gold);outline-offset:2px;}

/* read values */
.sm-val{margin-top:10px;}
.sm-val + .sm-val{margin-top:12px;padding-top:12px;border-top:1px solid var(--border);}
.sm-val .lg{display:block;font-size:11.5px;font-weight:800;color:var(--text3);margin-bottom:4px;}
.sm-val p{margin:0;font-size:14.5px;line-height:1.85;color:var(--ink);white-space:pre-wrap;overflow-wrap:anywhere;}
.sm-val p[dir="ltr"]{font-family:var(--font-en);text-align:left;}
html[dir="rtl"] .sm-val p[dir="ltr"]{text-align:right;}
html[dir="rtl"] .sm-val p[dir="ltr"]{text-align:left;}
.sm-big{font-size:22px;font-weight:800;color:var(--ink);margin-top:6px;line-height:1.3;}
.sm-big.muted{font-size:17px;color:var(--text2);}
.sm-small{font-size:13px;color:var(--text3);margin-top:4px;line-height:1.7;}

/* identity (read-only) */
.sm-cover{height:120px;border-radius:14px;background:var(--bg3) center/cover no-repeat;margin:-4px -6px 14px;}
.sm-id{display:flex;align-items:center;gap:14px;min-width:0;}
.sm-lg{width:60px;height:60px;flex:0 0 auto;border-radius:16px;background:var(--bg3) center/cover no-repeat;
  display:flex;align-items:center;justify-content:center;color:var(--gold2);font-size:26px;}
.sm-id .t{flex:1;min-width:0;}
.sm-id h2{margin:0;font-family:var(--font-display);font-size:19px;font-weight:800;color:var(--ink);overflow-wrap:anywhere;}
.sm-id .sub{font-size:12.5px;color:var(--text3);margin-top:3px;}
.sm-id .sub bdi{font-family:var(--font-en);}
.sm-id-foot{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:14px;padding-top:12px;border-top:1px solid var(--border);}
.sm-ro-note{flex:1;min-width:200px;font-size:12px;color:var(--text3);display:flex;align-items:center;gap:6px;line-height:1.6;}
.sm-ro-note i{font-size:15px;}
.sm-link{display:inline-flex;align-items:center;gap:6px;min-height:44px;padding:0 14px;border-radius:12px;
  border:1px solid var(--border2);color:var(--text2);text-decoration:none;font-size:12.5px;font-weight:800;}
.sm-link:hover{border-color:var(--gold);color:var(--gold2);}
.sm-tag{display:inline-flex;align-items:center;gap:5px;height:26px;padding:0 11px;border-radius:20px;font-size:11.5px;
  font-weight:800;background:var(--bg3);color:var(--text2);white-space:nowrap;flex:0 0 auto;}
.sm-tag.green{background:rgba(46,158,91,.14);color:#1F7A45;}
.sm-tag.red{background:rgba(217,83,79,.13);color:#A63A36;}
.sm-tag.amber{background:rgba(200,121,30,.14);color:#9A5B12;}
.sm-tag.gold{background:var(--gold-soft);color:var(--gold2);}

/* segmented choice (language, automatic/manual, levels) */
.sm-seg{display:inline-flex;flex-wrap:wrap;gap:4px;background:var(--bg);border:1px solid var(--border2);border-radius:13px;padding:4px;margin-top:12px;}
.sm-seg .sm-seg-b{min-height:44px;}
.sm-seg-b{min-height:44px;padding:0 18px;border:0;border-radius:10px;background:transparent;color:var(--text2);
  font-family:inherit;font-size:13.5px;font-weight:800;cursor:pointer;display:inline-flex;align-items:center;gap:8px;}
.sm-seg-b[aria-pressed="true"]{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(20,16,8,.14);}
.sm-seg-b:focus-visible{outline:2px solid var(--gold);outline-offset:1px;}
.sm-seg-b .dot{width:7px;height:7px;border-radius:50%;display:none;}
.sm-seg-b .dot.chg{display:inline-block;background:var(--gold2);}
.sm-seg-b .dot.err{display:inline-block;background:var(--red);}

/* the one field being edited */
.sm-field{margin-top:12px;}
.sm-field textarea,.sm-field input{width:100%;border-radius:12px;border:1px solid var(--border2);background:var(--card);
  font-family:inherit;font-size:15px;color:var(--ink);padding:12px 14px;line-height:1.8;}
.sm-field textarea{min-height:130px;resize:vertical;}
.sm-field input{min-height:50px;}
.sm-field [dir="ltr"]{font-family:var(--font-en);}
.sm-field textarea:focus,.sm-field input:focus{outline:2px solid var(--gold);outline-offset:1px;border-color:var(--gold);}
.sm-field.bad textarea,.sm-field.bad input{border-color:var(--red);}
.sm-meta{display:flex;justify-content:space-between;gap:10px;margin-top:6px;font-size:12px;color:var(--text3);min-height:18px;}
.sm-meta .err{color:#A63A36;font-weight:700;}
/* "113 / 1000" reads the same way in both languages */
.sm-meta .cnt{font-family:var(--font-en);margin-inline-start:auto;direction:ltr;unicode-bidi:isolate;}
.sm-msg{border-radius:12px;padding:11px 13px;font-size:12.5px;line-height:1.7;margin-top:12px;
  background:rgba(217,83,79,.1);border:1px solid rgba(217,83,79,.34);color:#A63A36;}

.sm-acts{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap;margin-top:14px;}
.sm-sec .sm-btn{min-height:46px;}
.sm-btn{min-height:46px;padding:0 20px;border-radius:13px;border:1px solid var(--border2);background:var(--card);
  color:var(--text2);font-family:inherit;font-size:13.5px;font-weight:800;cursor:pointer;display:inline-flex;
  align-items:center;justify-content:center;gap:7px;transition:all .18s;}
.sm-btn:hover:not(:disabled){border-color:var(--gold);color:var(--gold2);}
.sm-btn.gold{background:var(--gold);border-color:var(--gold2);color:#1C1606;}
.sm-btn.gold:hover:not(:disabled){filter:brightness(1.05);color:#1C1606;}
.sm-btn:disabled{opacity:.45;cursor:not-allowed;}
.sm-btn:focus-visible{outline:2px solid var(--gold);outline-offset:2px;}

/* operations */
.sm-now{display:flex;align-items:center;gap:14px;flex-wrap:wrap;}
.sm-dot{width:14px;height:14px;border-radius:50%;flex:0 0 auto;}
.sm-dot.green{background:var(--green);box-shadow:0 0 0 5px rgba(46,158,91,.16);}
.sm-dot.amber{background:#E0A32E;box-shadow:0 0 0 5px rgba(224,163,46,.18);}
.sm-dot.red{background:var(--red);box-shadow:0 0 0 5px rgba(217,83,79,.16);}
.sm-now .t{flex:1;min-width:0;}
.sm-now .t b{display:block;font-size:20px;font-weight:800;color:var(--ink);}
.sm-now .t span{display:block;font-size:13px;color:var(--text3);margin-top:2px;}
.sm-durs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-top:10px;}
.sm-durs .sm-dur{min-height:52px;}
.sm-dur{min-height:52px;border-radius:13px;border:1px solid var(--border2);background:var(--card);color:var(--ink);
  font-family:inherit;font-size:14px;font-weight:800;cursor:pointer;}
.sm-dur[aria-pressed="true"]{border-color:var(--gold2);background:var(--gold-soft);box-shadow:inset 0 0 0 1px var(--gold2);}
.sm-dur:focus-visible{outline:2px solid var(--gold);outline-offset:2px;}
.sm-choose{margin-top:14px;padding-top:14px;border-top:1px solid var(--border);}
.sm-choose-l{font-size:13px;font-weight:800;color:var(--text2);}
.sm-preview{display:flex;align-items:center;gap:7px;margin-top:12px;font-size:13px;color:var(--text2);}
.sm-preview i{color:var(--gold2);font-size:16px;}
.sm-preview b{font-family:var(--font-en);color:var(--ink);}
.sm-levels{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:10px;}
.sm-levels .sm-lvl{min-height:60px;}
.sm-lvl{min-height:60px;border-radius:13px;border:1px solid var(--border2);background:var(--card);color:var(--ink);
  font-family:inherit;font-size:13.5px;font-weight:800;cursor:pointer;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:2px;padding:6px;}
.sm-lvl small{font-size:12px;font-weight:600;color:var(--text3);font-family:var(--font-en);}
.sm-lvl[aria-pressed="true"]{border-color:var(--gold2);background:var(--gold-soft);box-shadow:inset 0 0 0 1px var(--gold2);}
.sm-lvl:focus-visible{outline:2px solid var(--gold);outline-offset:2px;}
.sm-days{display:flex;flex-direction:column;margin-top:8px;}
.sm-days div{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid var(--border);font-size:13.5px;}
.sm-days div:last-child{border-bottom:0;}
.sm-days div.today{font-weight:800;color:var(--ink);}
.sm-days span:last-child{font-family:var(--font-en);direction:ltr;unicode-bidi:isolate;}

/* opening schedule — view */
.sm-nowline{display:flex;align-items:center;gap:12px;margin-top:8px;font-size:14px;font-weight:700;color:var(--ink);}
.sm-nowline .sm-dot{width:10px;height:10px;box-shadow:none;}
.sm-dayl{margin-top:10px;}
.sm-day{display:grid;grid-template-columns:minmax(110px,1.1fr) minmax(76px,auto) minmax(0,2fr);gap:12px;align-items:center;
  padding:11px 0;border-bottom:1px solid var(--border);font-size:14px;min-height:44px;}
.sm-day:last-child{border-bottom:0;}
.sm-day .d{font-weight:800;color:var(--ink);display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
.sm-day .d .sm-tag{height:22px;font-size:10.5px;}
.sm-day .s{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;font-weight:800;}
.sm-day .s i{width:8px;height:8px;border-radius:50%;flex:0 0 auto;}
.sm-day .s.on{color:#1F7A45;} .sm-day .s.on i{background:var(--green);}
.sm-day .s.off{color:var(--text3);} .sm-day .s.off i{border:1.5px solid var(--text3);}
.sm-day .h{text-align:end;color:var(--ink);font-weight:700;}
.sm-day .arr{color:var(--text3);}
.sm-t{white-space:nowrap;}
/* opening schedule — edit */
.sm-sched{margin-top:6px;}
.sm-sday{padding:14px 0;border-bottom:1px solid var(--border);}
.sm-sday:last-child{border-bottom:0;}
.sm-sday-h{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
.sm-sday-h b{flex:1;min-width:90px;font-size:14.5px;font-weight:800;color:var(--ink);}
.sm-sday .sm-oc{margin-top:0;}
.sm-sday.closed .sm-small{margin-top:8px;}
.sm-times{display:flex;align-items:flex-end;gap:10px 16px;flex-wrap:wrap;margin-top:12px;}
.sm-tp label{display:block;font-size:12px;font-weight:800;color:var(--text3);margin-bottom:6px;}
.sm-picker{display:inline-flex;align-items:center;gap:8px;}
.sm-hm{display:inline-flex;align-items:center;gap:4px;direction:ltr;}
.sm-hm .c{font-weight:800;color:var(--text3);}
.sm-hm select{min-height:46px;min-width:64px;border-radius:12px;border:1px solid var(--border2);background:var(--card);
  font-family:var(--font-en);font-size:15px;font-weight:700;color:var(--ink);padding:0 8px;text-align:center;cursor:pointer;}
.sm-hm select:focus{outline:2px solid var(--gold);outline-offset:1px;border-color:var(--gold);}
.sm-ap{display:inline-flex;border:1px solid var(--border2);border-radius:12px;overflow:hidden;background:var(--card);}
.sm-ap .sm-ap-b{min-height:46px;}
.sm-ap-b{min-height:46px;min-width:50px;border:0;background:transparent;font-family:inherit;font-weight:800;font-size:14px;
  color:var(--text2);cursor:pointer;padding:0 10px;}
.sm-ap-b[aria-pressed="true"]{background:var(--ink);color:#F5F0E4;}
.sm-ap-b:focus-visible{outline:2px solid var(--gold);outline-offset:-2px;}
.sm-sday.bad .sm-hm select,.sm-sday.bad .sm-ap{border-color:var(--red);}
.sm-derr{color:#A63A36;font-size:12.5px;font-weight:700;margin-top:8px;line-height:1.6;}
.sm-times .sm-copy-b{min-height:44px;}
.sm-copy-b{min-height:44px;padding:0 12px;border-radius:12px;border:1px dashed var(--border2);background:transparent;
  color:var(--gold2);font-family:inherit;font-size:12.5px;font-weight:800;cursor:pointer;display:inline-flex;align-items:center;gap:6px;
  margin-inline-start:auto;}
.sm-copy-b:hover{border-color:var(--gold);background:var(--gold-soft);}
/* opening schedule — periods */
.sm-day .h .pl{display:block;white-space:nowrap;}
.sm-day .h .pl + .pl{margin-top:4px;}
.sm-per{margin-top:12px;}
.sm-per-l{font-size:12px;font-weight:800;color:var(--text2);}
.sm-per .sm-times{margin-top:6px;}
.sm-per.bad .sm-hm select,.sm-per.bad .sm-ap{border-color:var(--red);}
.sm-dtools{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px;}
.sm-dtools .sm-copy-b{min-height:44px;margin-inline-start:0;}
.sm-copy-b.rm{color:#A63A36;}
@media (max-width:640px){
  .sm-dtools .sm-copy-b{flex:1 1 auto;justify-content:center;}
}
.sm-copy{margin-top:12px;padding:12px;border-radius:14px;background:var(--bg);}
.sm-copy-days{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px;}
.sm-chk{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 12px;border:1px solid var(--border2);
  border-radius:12px;background:var(--card);cursor:pointer;font-size:13px;font-weight:700;color:var(--ink);}
.sm-chk input{width:18px;height:18px;accent-color:var(--gold2);margin:0;}
@media (max-width:640px){
  .sm-day{grid-template-columns:1fr auto;}
  .sm-day .h{grid-column:1 / -1;text-align:start;margin-top:-4px;}
  .sm-times{flex-direction:column;align-items:stretch;}
  .sm-picker{display:flex;}
  .sm-hm{flex:1;}
  .sm-hm select{flex:1;}
  .sm-copy-b{margin-inline-start:0;justify-content:center;}
  .sm-sday .sm-oc{width:100%;}
}

/* team */
.sm-mem{display:flex;align-items:flex-start;gap:12px;padding:14px 0;border-top:1px solid var(--border);}
.sm-mem:first-of-type{border-top:0;}
.sm-av{width:44px;height:44px;flex:0 0 auto;border-radius:50%;background:var(--gold-soft);color:var(--gold2);
  display:flex;align-items:center;justify-content:center;font-weight:800;font-size:17px;}
.sm-mem .who{flex:1;min-width:0;}
.sm-mem .who b{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:14.5px;font-weight:800;color:var(--ink);}
.sm-mem .who .sub{font-size:12.5px;color:var(--text3);margin-top:3px;}
.sm-perm summary{cursor:pointer;min-height:44px;display:inline-flex;align-items:center;gap:6px;font-size:12.5px;
  font-weight:800;color:var(--gold2);list-style:none;}
.sm-perm summary::-webkit-details-marker{display:none;}
.sm-perm summary:focus-visible{outline:2px solid var(--gold);outline-offset:2px;border-radius:8px;}
.sm-perm ul{margin:2px 0 0;padding-inline-start:18px;font-size:12.5px;color:var(--text2);line-height:1.9;columns:2;}

.sm-info i{font-size:17px;flex:0 0 auto;margin-top:1px;}

.sm-empty{padding:30px 10px;text-align:center;color:var(--text3);font-size:13px;}

/* ---------- settings · navigation preferences ---------- */
.sm-nav-list{display:flex;flex-direction:column;gap:8px;margin-top:12px;}

.sm-nav-row .nm{flex:1;min-width:0;font-size:14px;font-weight:800;color:var(--ink);overflow-wrap:anywhere;}

.sm-sec .sm-nav-b{min-height:44px;}

.sm-nav-b:focus-visible{outline:2px solid var(--gold);outline-offset:2px;}
.sm-nav-f{margin-top:16px;}
.sm-nav-f label{display:block;font-size:12.5px;font-weight:800;color:var(--text3);margin-bottom:6px;}
.sm-nav-f select{width:100%;max-width:340px;min-height:46px;border-radius:12px;border:1px solid var(--border2);

.sm-nav-f select:focus{outline:2px solid var(--gold);outline-offset:1px;border-color:var(--gold);}
.sm-okbox{border-radius:12px;padding:11px 13px;font-size:12.5px;line-height:1.7;margin-top:12px;
  background:rgba(46,158,91,.1);border:1px solid rgba(46,158,91,.3);color:#1F7A45;}

/* ---------- settings · account, notifications, security ---------- */
.sm-kv{display:grid;grid-template-columns:minmax(120px,auto) minmax(0,1fr);gap:10px 16px;margin-top:12px;}
.sm-kv dt{font-size:12.5px;font-weight:800;color:var(--text3);min-height:22px;}
.sm-kv dd{margin:0;font-size:14px;font-weight:700;color:var(--ink);overflow-wrap:anywhere;min-height:22px;}
.sm-kv dd bdi,.sm-kv dd .en{font-family:var(--font-en);}
.sm-kv dd .muted{font-weight:600;color:var(--text3);}
.sm-row{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:13px 0;border-top:1px solid var(--border);}
.sm-row:first-of-type{border-top:0;}
.sm-row .rb{flex:1 1 220px;min-width:0;}
.sm-row .rb b{display:block;font-size:14px;font-weight:800;color:var(--ink);}
.sm-row .rb span{display:block;font-size:12.5px;color:var(--text3);line-height:1.65;margin-top:3px;}
.sm-row .sm-seg{margin-top:0;flex:0 0 auto;}
.sm-row .sm-tag{align-self:center;}
@media (max-width:640px){
  .sm-kv{grid-template-columns:1fr;gap:2px 0;}
  .sm-kv dt{margin-top:10px;}
  .sm-row .sm-seg{width:100%;display:flex;}
  .sm-row .sm-seg .sm-seg-b{flex:1 1 0;justify-content:center;}
}

/* discard dialog */
.sm-dlg{position:fixed;inset:0;z-index:130;background:rgba(20,16,8,.45);display:flex;align-items:center;justify-content:center;padding:20px;}
.sm-dlg-c{width:100%;max-width:360px;background:var(--card);border-radius:20px;padding:22px;box-shadow:0 30px 60px -30px rgba(20,16,8,.6);}
.sm-dlg-c h3{margin:0 0 18px;font-size:17px;font-weight:800;color:var(--ink);text-align:center;}
.sm-dlg-a{display:flex;gap:10px;}
.sm-dlg-a .sm-btn{flex:1;min-height:48px;}
.sm-btn.danger{background:var(--red);border-color:var(--red);color:#fff;}
.sm-btn.danger:hover{filter:brightness(1.05);color:#fff;}

.mw-gate{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:30px;}
.mw-gate-c{max-width:420px;text-align:center;}
.mw-gate-c i{font-size:40px;color:var(--text3);}
.mw-gate-c h1{font-family:var(--font-display);font-size:20px;font-weight:800;color:var(--ink);margin:12px 0 8px;}
.mw-gate-c p{font-size:13px;color:var(--text2);line-height:1.8;}
.mw-toast{position:fixed;inset-inline:0;bottom:26px;display:flex;justify-content:center;z-index:120;
  pointer-events:none;opacity:0;transform:translateY(10px);transition:opacity .22s,transform .22s;}
.mw-toast.show{opacity:1;transform:none;}
.mw-toast > div{background:var(--ink);color:#F5F0E4;border-radius:30px;padding:12px 20px;font-size:13.5px;
  font-weight:700;box-shadow:0 14px 30px -14px rgba(20,16,8,.6);max-width:90vw;text-align:center;}

@media (max-width:640px){
  .sm-sec{padding:16px;}
  .sm-tabs button{padding:0 12px;font-size:13px;}
  .sm-acts .sm-btn{flex:1 1 0;}
  .sm-durs{grid-template-columns:repeat(2,minmax(0,1fr));}
  .sm-levels{grid-template-columns:1fr;}
  .sm-levels .sm-lvl{flex-direction:row;justify-content:space-between;padding:0 16px;}

  .sm-seg .sm-seg-b{flex:1 1 0;justify-content:center;}

}

  .mw-toast{bottom:90px;}
}

<style>
/* ══════════════════════════════════════════════════════════════
   RAF MERCHANT — STORE PAGE DESIGN LAYER
   Visual only: every class the page script renders is kept; this layer
   restyles them and adds the header, the "store at a glance" strip, the
   two-column grids and dark mode. Tokens are scoped to THIS page — the
   shared raf_theme.css and every other page are untouched.
   ══════════════════════════════════════════════════════════════ */
:root{
  --rail:#15130F; --rail-fg:#8E877A;
  --inv:#15130F; --inv-fg:#F5F0E4;
  --ok:#1F7A45;  --ok-bg:rgba(46,158,91,.11);
  --bad:#A63A36; --bad-bg:rgba(217,83,79,.09);
  --warn:#8F5410; --warn-bg:rgba(200,121,30,.11);
  --r-card:12px; --r-ctl:10px;
  --sh-card:0 1px 2px rgba(20,16,8,.04), 0 10px 28px -22px rgba(20,16,8,.35);
}
html[data-theme="dark"]{
  color-scheme:dark;
  --bg:#12110F; --bg2:#0D0C0B; --bg3:#201E1A; --card:#171614;
  --ink:#F4F0E6; --text:#ECE7DB; --text2:#BCB5A7; --text3:#8C8578;
  --border:#2A2721; --border2:#3A362E;
  --gold2:#D9B85C; --gold-soft:rgba(201,168,76,.14);
  --rail:#090908; --rail-fg:#7E786C;
  --inv:#F4F0E6; --inv-fg:#15130F;
  --ok:#63CC90;  --ok-bg:rgba(99,204,144,.12);
  --bad:#F08985; --bad-bg:rgba(240,137,133,.11);
  --warn:#E7B45E; --warn-bg:rgba(231,180,94,.12);
  --red:#E0625D; --green:#3FB46E;
  --sh-card:none;
}
body{background:var(--bg2);color:var(--text);}

/* ---------- rail ---------- */
.mw-rail{background:var(--rail);}
html[data-theme="dark"] .mw-rail{border-inline-end:1px solid var(--border);}
.mw-rail-b{color:var(--rail-fg);border-radius:12px;}

/* ---------- header ---------- */
.mw-head{background:var(--card);border-bottom:1px solid var(--border);padding:10px clamp(14px,2.4vw,28px);gap:12px;}
.mw-store{gap:12px;}
.mw-store-logo{width:42px;height:42px;border-radius:11px;border:1px solid var(--border);}
.mw-store-t .kick{display:block;font-size:10.5px;font-weight:800;letter-spacing:.06em;color:var(--gold2);line-height:1.2;}
.mw-store-t b{font-size:17px;line-height:1.35;}
.mw-store-t .meta{display:block;font-size:11.5px;color:var(--text3);line-height:1.3;}
.mw-store-t .meta bdi{font-family:var(--font-en);}
.mw-ico-b{border-radius:var(--r-ctl);background:var(--card);border-color:var(--border2);color:var(--text2);}
.mw-ico-b:focus-visible{outline:2px solid var(--gold);outline-offset:2px;}
.mw-body{padding:16px clamp(14px,2.4vw,28px) 60px;}

/* ---------- the store at a glance ---------- */
.st-strip{max-width:1080px;margin:0 auto 14px;display:flex;flex-wrap:wrap;gap:8px;}
.st-chip{display:inline-flex;align-items:center;gap:7px;min-height:40px;padding:0 13px;border-radius:999px;
  border:1px solid var(--border2);background:var(--card);color:var(--text2);font-family:inherit;font-size:12.5px;
  font-weight:800;line-height:1.3;text-decoration:none;cursor:pointer;max-width:100%;text-align:start;}
.st-chip i{font-size:16px;flex:0 0 auto;}
.st-chip span{min-width:0;overflow-wrap:anywhere;}
.st-chip .go{font-size:13px;opacity:.55;}
.st-chip:hover{border-color:var(--gold);}
.st-chip:focus-visible{outline:2px solid var(--gold);outline-offset:2px;}
.st-chip.ok{background:var(--ok-bg);border-color:transparent;color:var(--ok);}
.st-chip.bad{background:var(--bad-bg);border-color:transparent;color:var(--bad);}
.st-chip.warn{background:var(--warn-bg);border-color:transparent;color:var(--warn);}
.st-chip.gold{background:var(--gold-soft);border-color:transparent;color:var(--gold2);}
.st-chip.link{margin-inline-start:auto;background:transparent;}

/* ---------- tabs: a flat underline bar, not a pill container ---------- */
.sm-tabs{max-width:1080px;margin:0 auto 16px;border:0;border-bottom:1px solid var(--border2);border-radius:0;
  background:transparent;padding:0;gap:2px;}
.mw-body .sm-tabs button{min-height:46px;}
.sm-tabs button{flex:0 0 auto;border-radius:0;padding:0 14px;color:var(--text3);font-size:13.5px;
  box-shadow:inset 0 -2px 0 transparent;}
.sm-tabs button:hover{background:transparent;color:var(--ink);}
.sm-tabs button[aria-selected="true"]{background:transparent;color:var(--ink);box-shadow:inset 0 -2px 0 var(--gold);}
.sm-tabs button[aria-selected="true"] i{color:var(--gold2);}

/* ---------- sections ---------- */
.sm-wrap{max-width:1080px;gap:14px;}
.sm-grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;align-items:start;}
.sm-grid2 > .sm-sec{min-width:0;}
/* operations: status + its closure workflow in the wide column, Busy Mode and
   preparation time stacked beside it — no half-empty full-width panel */
.sm-opsgrid{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:14px;align-items:start;}
.sm-opsgrid > div{display:flex;flex-direction:column;gap:14px;min-width:0;}
.sm-sec{border-radius:var(--r-card);padding:16px 18px;box-shadow:var(--sh-card);border-color:var(--border);}
.sm-sec.editing{border-color:var(--gold);box-shadow:0 0 0 3px var(--gold-soft);}
.sm-sec-h{min-height:40px;gap:10px;flex-wrap:wrap;}
.sm-sec-h h3{font-size:14.5px;letter-spacing:.01em;}
.sm-big{font-size:19px;}
.sm-big.muted{font-size:15.5px;}
.sm-small{font-size:12.5px;}
.sm-edit-b,.sm-btn,.sm-link,.sm-nav-b,.sm-copy-b,.sm-chk,.sm-dur,.sm-lvl{border-radius:var(--r-ctl);}
.sm-edit-b{background:transparent;color:var(--ink);}
.sm-btn{background:var(--card);color:var(--text2);}
.sm-btn.gold{background:var(--gold);border-color:var(--gold2);color:#1C1606;}
.sm-btn.danger{background:var(--red);border-color:var(--red);color:#fff;}
.sm-seg{border-radius:12px;background:var(--bg);}
.sm-seg-b{border-radius:9px;}
.sm-seg-b[aria-pressed="true"]{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.18);}
.sm-field textarea,.sm-field input{border-radius:var(--r-ctl);background:var(--card);color:var(--ink);}
.sm-hm select,.sm-nav-f select{border-radius:var(--r-ctl);background:var(--card);color:var(--ink);}
.sm-ap{border-radius:var(--r-ctl);}
.sm-ap-b[aria-pressed="true"]{background:var(--inv);color:var(--inv-fg);}

/* status colours through tokens (both themes; never colour alone — every
   status keeps its text) */
.sm-tag.green{background:var(--ok-bg);color:var(--ok);}
.sm-tag.red{background:var(--bad-bg);color:var(--bad);}
.sm-tag.amber{background:var(--warn-bg);color:var(--warn);}
.sm-tag.gold{background:var(--gold-soft);color:var(--gold2);}
.sm-meta .err,.sm-derr,.sm-copy-b.rm{color:var(--bad);}
.sm-msg{background:var(--bad-bg);border-color:transparent;color:var(--bad);border-radius:var(--r-ctl);}
.sm-okbox{background:var(--ok-bg);border-color:transparent;color:var(--ok);border-radius:var(--r-ctl);}
.sm-day .s.on{color:var(--ok);}
.sm-st{font-weight:800;} .sm-st.ok{color:var(--ok);} .sm-st.bad{color:var(--bad);}

/* operations: the live status reads first and large */
.sm-now{gap:12px;padding:12px 14px;border-radius:var(--r-ctl);background:var(--bg);margin-top:4px;}
.sm-now .t b{font-size:18px;}
.sm-dot{width:12px;height:12px;}
.sm-preview{background:var(--bg);border-radius:var(--r-ctl);padding:10px 12px;}

/* profile identity */
.sm-cover{height:110px;border-radius:10px;margin:0 0 12px;}
.sm-lg{width:56px;height:56px;border-radius:12px;border:1px solid var(--border);}
.sm-id h2{font-size:18px;}

/* dialog + toast follow the theme */
.sm-dlg-c{border-radius:14px;border:1px solid var(--border);}
.mw-toast > div{background:var(--inv);color:var(--inv-fg);}
.sm-copy{background:var(--bg);}
.sm-nav-row{border-radius:var(--r-ctl);}

@media (max-width:900px){
  .sm-grid2{grid-template-columns:1fr;}
  .sm-opsgrid{grid-template-columns:1fr;}
}
@media (max-width:640px){
  .mw-head{padding:8px 12px;gap:8px;}
  .mw-hact{gap:6px;}
  .mw-hact .mw-ico-b{width:40px;min-height:40px;height:40px;}
  .mw-ico-b.lang{padding:0 10px;}
  .mw-store-t .kick{display:none;}
  .mw-body{padding:12px 12px 90px;}
  /* one scrollable row of chips — status first — instead of four wrapped rows */
  .st-strip{flex-wrap:nowrap;overflow-x:auto;gap:6px;margin:0 -12px 12px;padding:0 12px 2px;scrollbar-width:none;}
  .st-strip::-webkit-scrollbar{display:none;}
  .st-chip{flex:0 0 auto;white-space:nowrap;}
  .st-chip span{overflow-wrap:normal;}
  /* short facts stay label / value side by side */
  .sm-kv{grid-template-columns:minmax(88px,auto) minmax(0,1fr);gap:6px 12px;}
  .sm-kv dt{margin-top:0;}
  .st-chip{min-height:38px;padding:0 11px;font-size:12px;}
  .st-chip.link{margin-inline-start:0;}
  .sm-tabs button{padding:0 11px;font-size:13px;}
  .sm-sec{padding:14px;}
  .sm-big{font-size:17px;}
}
@media (max-width:360px){
  .mw-store-logo{display:none;}
  .sm-tabs button i{display:none;}
  .sm-durs{grid-template-columns:1fr 1fr;}
}
</style>
</head>

   Profile    → RAFStoreProfile (stores.edit + own store)

                RAFStoreStatus  open / close (same check) and the full-

  ];
  var STATUS_TXT = {

  };
  var LEVELS = {
    normal:   { ar:'عادي',   en:'Normal' },
    moderate: { ar:'متوسط',  en:'Moderate' },
    high:     { ar:'مزدحم',  en:'Heavy' }
  };
  var SECTIONS = {
    name:  { ar:'اسم المتجر',  en:'Store name',        eAr:'تعديل الاسم',   eEn:'Edit name' },
    cat:   { ar:'فئة المتجر',  en:'Store category',    eAr:'تعديل الفئة',   eEn:'Edit category' },
    desc:  { ar:'وصف المتجر',  en:'Store description', eAr:'تعديل الوصف',   eEn:'Edit description' }
  };
  var DAY_TXT = {
    sunday:{ar:'الأحد',en:'Sunday'}, monday:{ar:'الاثنين',en:'Monday'}, tuesday:{ar:'الثلاثاء',en:'Tuesday'},
    wednesday:{ar:'الأربعاء',en:'Wednesday'}, thursday:{ar:'الخميس',en:'Thursday'},
    friday:{ar:'الجمعة',en:'Friday'}, saturday:{ar:'السبت',en:'Saturday'}
  };

  var ME = null, SLUG = null, prof = null;
  var pdraft = {}, pkey = null, pmsg = null, psubmitting = false;   /* the unsent store-profile change set (memory only) */
  var st = { tab:'operations' };
  var edit = null;      /* { section, lang, draft:{ar,en}, errors:{ar,en}, msg, base, focus } */
  var prepEdit = null;  /* { mode:'auto'|'manual', level, msg } */
  var busyPick = null;  /* { hours, msg } */
  var busyMsg = null;
  var SST = window.RAFStoreStatus;
  var closeDraft = null; /* { days, reason, msg, bad, busy } — the full-closure request form */
  var closeMsg = null;
  var statusAsk = null; /* { expect, busy } — the merchant open / close confirmation */
  var statusMsg = null;
  var cancelAsk = null; /* the pending request whose cancellation is being confirmed */
  var lastBusy = null;
  var SS = window.RAFStoreSchedule;
  var schedEdit = null; /* { days, base, original, errors, msg, touched, copyFrom, copySel } */
  var navDraft = null;  /* { order:[keys], landing:key, msg, ok, dragFrom, focus } */
  var sndDraft = null;  /* { newOrder:bool, warning:bool, msg, ok } */

  /* ---------- helpers ---------- */
  function root(){ return document.getElementById('htmlRoot'); }
  function isEn(){ return root().lang === 'en'; }
  function T(ar,en){ return isEn() ? en : ar; }
  function L(o){ return (o && typeof o==='object') ? (isEn()?(o.en||o.ar):(o.ar||o.en)) : (o||''); }
  function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
  function el(id){ return document.getElementById(id); }
  function can(key){ try { return !!(ME && RAFPerm.can(ME.id, key)); } catch(e){ return false; } }
  function actor(){ return { id:ME.id, name:ME.name }; }
  var toastTimer = null;
  function toast(msg){
    el('toastMsg').textContent = msg; el('toast').classList.add('show');
    clearTimeout(toastTimer); toastTimer = setTimeout(function(){ el('toast').classList.remove('show'); }, 2400);
  }
  /* Kuwait time, in the Western digits the rest of RAF uses */
  function kwTime(ms){

  }

    var x = STATUS_TXT[s] || { ar:s || '—', en:s || '—', tag:'' };

  }
  function durLabel(h){ return T(h === 1 ? 'ساعة' : h === 2 ? 'ساعتان' : h + ' ساعات', h === 1 ? '1 hour' : h + ' hours'); }
  function savePrefs(){ try { localStorage.setItem(PREF, JSON.stringify({ tab:st.tab })); } catch(e){} }
  function loadPrefs(){
    try { var p = JSON.parse(localStorage.getItem(PREF) || 'null');
      if (p && TABS.some(function(t){ return t.k === p.tab; })) st.tab = p.tab; } catch(e){}
  }
  function loadProfile(){ prof = SP.read({ actor:ME.id }); }

  /* ---------- unsaved changes ---------- */
  function sectionDirty(){
    if (!edit || !prof || !prof.ok) return false;
    var cur = edit.orig || prof.fields[edit.section];
    return edit.draft.ar !== cur.ar || edit.draft.en !== cur.en;
  }
  function prepTarget(){ return prepEdit ? (prepEdit.mode === 'auto' ? 'auto' : prepEdit.level) : null; }
  function prepCurrent(){ var s = OPS.snapshot(SLUG); return s.manual ? s.state : 'auto'; }
  function prepDirty(){ return !!prepEdit && prepTarget() !== prepCurrent(); }
  /* an unsaved sound choice is a pending change like any other, so leaving the
     tab asks the same one question. The sidebar order keeps its existing
     behaviour: it is redrawn from the saved preference and nothing else. */
  function soundsDirty(){
    if (!sndDraft || !PREFS || !ME) return false;
    var pr = PREFS.read({ actor:ME.id });
    return pr.ok && sndDirty(pr);
  }
  function closeDirty(){ return !!(closeDraft && (String(closeDraft.days).trim() || String(closeDraft.reason).trim())); }
  function dirty(){ return sectionDirty() || prepDirty() || schedDirty() || soundsDirty() || closeDirty(); }
  function clearEdits(){ edit = null; prepEdit = null; busyPick = null; schedEdit = null; sndDraft = null; closeDraft = null; statusAsk = null; cancelAsk = null; }

  var pending = null;
  function confirmDiscard(go){
    if (!dirty()){ clearEdits(); go(); return; }
    pending = go;
    el('dlgT').textContent = T('تجاهل التغييرات؟','Discard changes?');
    el('dlgKeep').textContent = T('متابعة التعديل','Keep editing');
    el('dlgDiscard').textContent = T('تجاهل','Discard');
    el('dlg').hidden = false;
    el('dlgKeep').focus();
  }
  window.dlgKeep = function(){ el('dlg').hidden = true; pending = null; var f = el('smField'); if (f) f.focus(); };
  window.dlgDiscard = function(){ el('dlg').hidden = true; var go = pending; pending = null; clearEdits(); if (go) go(); };

  /* ---------- chrome ---------- */
  /* ════════════════════ HEADER + STORE AT A GLANCE ════════════════════
     Everything here is read from the authorities that own it — the store
     record (RAFSource), Busy Mode (RAFStoreOps), closure requests
     (RAFStoreStatus), profile requests (RAFStoreProfile) and the schedule
     (RAFStoreSchedule). Nothing is computed that they do not state. Each
     item is text + icon (never colour alone) and jumps to where it is
     handled. */
  function renderHead(){
    var s = RAFSource.store(SLUG) || {}, meta = [];
    el('stName').textContent = L(s.name) || '—';
    if (s.num) meta.push('<bdi>' + esc(s.num) + '</bdi>');
    if (L(s.cat)) meta.push(esc(L(s.cat)));
    el('stMeta').innerHTML = meta.join(' · ');
    var lg = el('stLogo');
    if (s.logo){ lg.style.backgroundImage = "url('" + s.logo + "')"; lg.innerHTML = ''; }
    else { lg.style.backgroundImage = ''; lg.innerHTML = '<i class="ti ' + esc(s.ic || 'ti-building-store') + '"></i>'; }
    renderThemeBtn();
  }
  function stChip(tone, icon, text, go, label){
    var inner = '<i class="ti ' + icon + '" aria-hidden="true"></i><span>' + esc(text) + '</span>';
    return go
      ? '<button type="button" class="st-chip ' + tone + '" onclick="' + go + '"' + (label ? ' aria-label="' + esc(label) + '"' : '') + '>' + inner + '<i class="ti ti-chevron-' + (isEn() ? 'right' : 'left') + ' go" aria-hidden="true"></i></button>'
      : '<span class="st-chip ' + tone + '">' + inner + '</span>';
  }
  function renderStrip(){
    var box = el('stStrip'); if (!box || !ME) return;
    var store = RAFSource.store(SLUG) || {}, busy = OPS.isBusy(SLUG), h = '';
    /* the one status the customer experiences right now */
    if (store.status === 'open' && busy)
      h += stChip('warn', 'ti-player-pause', T('مشغول — الطلبات الجديدة متوقفة حتى ', 'Busy — new orders paused until ') + kwTime(OPS.busyUntil(SLUG)), "setTab('operations')");
    else if (store.status === 'open')
      h += stChip('ok', 'ti-circle-check', T('مفتوح — يستقبل الطلبات الجديدة', 'Open — accepting new orders'), "setTab('operations')");
    else if (store.status === 'closed')
      h += stChip('bad', 'ti-lock', T('مغلق — لا يستقبل طلبات جديدة', 'Closed — not accepting new orders'), "setTab('operations')");
    else if (store.status === 'suspended')
      h += stChip('bad', 'ti-ban', T('موقوف من إدارة رف', 'Suspended by RAF'), "setTab('operations')");
    /* closures: the approved one running, and requests still waiting */
    var cr = SST ? SST.myRequests() : null;
    if (cr && cr.ok){
      if (cr.activeClosure && cr.activeClosure.endsAt)
        h += stChip('warn', 'ti-calendar-off', T('إغلاق معتمد حتى ', 'Approved closure until ') + fcDate(cr.activeClosure.endsAt), "setTab('operations')");
      var pc = cr.items.filter(function(r){ return r.status === 'pending'; }).length;
      if (pc) h += stChip('gold', 'ti-clock', T(pc === 1 ? 'طلب إغلاق قيد المراجعة' : pc + ' طلبات إغلاق قيد المراجعة', pc === 1 ? '1 closure request pending' : pc + ' closure requests pending'), "setTab('operations')");
    }
    /* profile: requests waiting, and changes not sent yet */
    var pr = SP.myRequests ? SP.myRequests({ actor:ME.id }) : null;
    if (pr && pr.ok){
      var pp = pr.items.filter(function(r){ return r.status === 'pending'; }).length;
      if (pp) h += stChip('gold', 'ti-id-badge-2', T(pp === 1 ? 'تعديل ملف قيد المراجعة' : pp + ' تعديلات ملف قيد المراجعة', pp === 1 ? '1 profile change pending' : pp + ' profile changes pending'), "setTab('profile')");
    }
    if (hasDraft()) h += stChip('gold', 'ti-pencil', T('تعديلات ملف غير مرسلة', 'Unsent profile changes'), "setTab('profile')");
    /* the schedule is what customers see as opening hours */
    var sr = SS ? SS.read({ actor:ME.id }) : null;
    if (sr && sr.ok && !sr.configured) h += stChip('', 'ti-calendar-time', T('جدول العمل غير مُعدّ', 'Opening schedule not set up'), 'goSchedule()');
    h += '<a class="st-chip link" href="raf_store.html?store=' + encodeURIComponent(SLUG) + '" target="_blank" rel="noopener"><i class="ti ti-external-link" aria-hidden="true"></i><span>'
      + esc(T('صفحة المتجر للعملاء', 'Customer store page')) + '</span></a>';
    box.innerHTML = h;
    box.setAttribute('aria-label', T('المتجر في لمحة', 'Store at a glance'));
  }
  /* light / dark — RAF's existing theme preference (raf_admin_theme.js),
     saved only when the merchant presses the control */
  function curTheme(){ return document.documentElement.getAttribute('data-theme') === 'dark' ? 'dark' : 'light'; }
  function renderThemeBtn(){
    var b = el('themeBtn'); if (!b) return;
    var dark = curTheme() === 'dark';
    b.setAttribute('aria-pressed', dark ? 'true' : 'false');
    b.setAttribute('aria-label', T('الوضع الداكن', 'Dark mode'));
    b.setAttribute('title', dark ? T('التبديل إلى الوضع الفاتح', 'Switch to light mode') : T('التبديل إلى الوضع الداكن', 'Switch to dark mode'));
    b.innerHTML = '<i class="ti ' + (dark ? 'ti-sun' : 'ti-moon') + '" aria-hidden="true"></i>';
  }
  window.toggleTheme = function(){
    var next = curTheme() === 'dark' ? 'light' : 'dark';
    document.documentElement.setAttribute('data-theme', next);
    try { localStorage.setItem('raf_admin_theme', next); } catch(e){}
    renderThemeBtn(); var b = el('themeBtn'); if (b) b.focus();
  };

  function renderTabs(){
    el('tabs').innerHTML = TABS.map(function(t){
      var on = st.tab === t.k;
      return '<button role="tab" id="tab-'+t.k+'" aria-controls="panel" aria-selected="'+on+'" tabindex="'+(on?0:-1)+'"'
        + ' onclick="setTab(\''+t.k+'\')"><i class="ti '+t.ic+'"></i>'+esc(T(t.ar,t.en))+'</button>';
    }).join('');
    el('panel').setAttribute('aria-labelledby', 'tab-' + st.tab);
  }
  function render(){
    renderHead(); renderStrip();
    renderTabs();
    el('panel').innerHTML = st.tab === 'operations' ? renderOps()
                          : st.tab === 'team'       ? renderTeam()
                          : st.tab === 'settings'   ? renderSettings()
                          :                           renderProfile();
    if (edit && edit.focus){
      var f = el('smField');
      if (f){ f.focus(); var n = f.value.length; try { f.setSelectionRange(n, n); } catch(e){} }
      edit.focus = false;
    }
    /* a keyboard reorder keeps the caret on the button that did the moving */
    if (st.tab === 'settings') navAfterRender();
  }

  /* ════════════════════ STORE PROFILE ════════════════════
     CONFIRMED RULE: nothing edited here is live immediately. Every change
     (name, category, description, logo, cover) is collected into ONE change
     set on this page and submitted as ONE Store Profile Change Request —
     RAFStoreProfile.submitChange → Requests & Approvals. The live profile
     shown here stays as it is until RAF Management approves. The unsent
     change set lives only in this page's memory: it is not a profile. */
  function draftKeys(){ return Object.keys(pdraft); }
  function hasDraft(){ return draftKeys().length > 0; }
  function fieldLabel(f){ var d = SP.FIELDS[f] || SP.MEDIA[f]; return d ? T(d.label.ar, d.label.en) : f; }
  function fmtSize(b){ return typeof b === 'number' ? (b < 1024 ? b + ' B' : b < 1048576 ? (b / 1024).toFixed(1) + ' KB' : (b / 1048576).toFixed(1) + ' MB') : ''; }
  function pDate(ms){
    try { return new Date(ms).toLocaleString(isEn() ? 'en-GB' : 'ar-KW-u-nu-latn', { day:'2-digit', month:'short', hour:'2-digit', minute:'2-digit', timeZone:'Asia/Kuwait' }); }
    catch(e){ return new Date(ms).toISOString().slice(0,16).replace('T',' '); }
  }
  function renderProfile(){
    if (!prof) loadProfile();
    if (!prof.ok) return '<div class="sm-wrap"><section class="sm-sec"><div class="sm-empty">'+esc(prof.message)+'</div></section></div>';
    var fx = prof.fixed;
    var id = '<section class="sm-sec">'
      + (fx.cover ? '<div class="sm-cover" style="background-image:url(\''+esc(fx.cover)+'\')"></div>' : '')
      + '<div class="sm-id"><div class="sm-lg" style="'+(fx.logo ? 'background-image:url(\''+esc(fx.logo)+'\')' : '')+'">'
          + (fx.logo ? '' : '<i class="ti '+esc(fx.icon || 'ti-building-store')+'"></i>')+'</div>'
        + '<div class="t"><h2>'+esc(L(fx.name))+'</h2><div class="sub">'+esc(L(fx.cat))
          + (fx.num ? ' · <bdi>'+esc(fx.num)+'</bdi>' : '')+'</div></div>'
        + statusTag(fx.status) + '</div>'
      + '<div class="sm-id-foot"><span class="sm-ro-note"><i class="ti ti-shield-check"></i>'
          + esc(T('أي تعديل على ملف المتجر يُرسل إلى إدارة رف للموافقة، ولا يظهر للعملاء قبل اعتماده.','Every store-profile change is sent to RAF Management for approval and is not shown to customers until approved.'))+'</span>'
        + '<a class="sm-link" href="raf_store.html?store='+encodeURIComponent(SLUG)+'" target="_blank" rel="noopener">'
          + '<i class="ti ti-external-link"></i>'+esc(T('صفحة المتجر','Store page'))+'</a></div>'
      + '</section>';
    /* opening hours are read-only here — generated from the Opening schedule */
    return '<div class="sm-wrap">' + id + requestsPanel() + draftBar()
      + '<div class="sm-grid2">' + textSection('name') + textSection('cat') + '</div>'
      + textSection('desc') + '<div class="sm-grid2">' + mediaSection() + hoursSection() + '</div></div>';
  }
  /* the merchant's real profile requests — pending ones, and the last decision */
  function requestsPanel(){
    var mine = SP.myRequests({ actor:ME.id }); if (!mine || !mine.ok || !mine.items.length) return '';
    var pending = mine.items.filter(function(r){ return r.status === 'pending'; });
    var last = mine.items.filter(function(r){ return r.status !== 'pending'; })[0] || null;
    var h = '<section class="sm-sec"><div class="sm-sec-h"><h3>'+esc(T('طلبات تعديل الملف','Profile change requests'))+'</h3></div>';
    pending.forEach(function(r){
      h += '<div class="sm-big" style="font-size:16px;margin-top:6px">'+esc(T('طلب قيد المراجعة','Request pending review'))+' <bdi>'+esc(r.ref)+'</bdi></div>'
        + '<div class="sm-small">'+esc(T('التعديلات المرسلة غير مطبّقة بعد؛ الملف المعروض هو الحالي حتى تعتمد إدارة رف الطلب.','The submitted changes are not live yet; the profile shown is the current one until RAF Management approves.'))+'</div>'
        + '<dl class="sm-kv"><dt>'+esc(T('الحقول','Fields'))+'</dt><dd>'+esc(Object.keys(r.changes || {}).map(fieldLabel).join(T('، ',', ')))+'</dd>'
        + '<dt>'+esc(T('تاريخ الإرسال','Submitted'))+'</dt><dd><bdi>'+esc(pDate(r.createdAt))+'</bdi></dd></dl>';
    });
    if (last){
      var ap = last.status === 'approved', notApplied = ap && last.applied && (last.applied.mediaNotApplied || []).length;
      h += '<div class="sm-small" style="margin-top:12px">'+esc(T('آخر طلب ','Last request '))+'<bdi>'+esc(last.ref)+'</bdi>: <b>'
        + esc(ap ? T('مقبول','Approved') : T('مرفوض','Rejected'))+'</b>'
        + (last.rejectionReason ? ' — '+esc(last.rejectionReason) : '')+' · <bdi>'+esc(pDate(last.decidedAt))+'</bdi>'
        + (notApplied ? '<br>'+esc(T('لم تُطبَّق الصور المرفقة: لا يوجد تخزين ملفات في هذا النموذج.','The attached images were not applied: this prototype has no file storage.')) : '')+'</div>';
    }
    return h + '</section>';
  }
  /* the unsent change set — submitted together, as one request */
  function draftBar(){
    if (!hasDraft()) return '';
    return '<section class="sm-sec editing"><div class="sm-sec-h"><h3>'+esc(T('تعديلات غير مرسلة','Unsent changes'))+'</h3></div>'
      + '<div class="sm-small">'+esc(draftKeys().map(fieldLabel).join(T('، ',', ')))+'</div>'
      + '<div class="sm-small">'+esc(T('لن تظهر هذه التعديلات قبل إرسالها وموافقة إدارة رف عليها.','These changes are not live until you submit them and RAF Management approves.'))+'</div>'
      + (pmsg ? '<div class="sm-msg" role="alert">'+esc(pmsg)+'</div>' : '')
      + '<div class="sm-acts"><button class="sm-btn" onclick="discardDraft()"'+(psubmitting ? ' disabled' : '')+'>'+esc(T('تجاهل','Discard'))+'</button>'
      + '<button class="sm-btn gold" id="spSubmit" onclick="submitProfile()"'+(psubmitting ? ' disabled' : '')+'><i class="ti ti-send"></i>'
      + esc(psubmitting ? T('جارٍ الإرسال…','Sending…') : T('إرسال للموافقة','Submit for approval'))+'</button></div></section>';
  }
  function shownValue(f){ return pdraft[f] || prof.fields[f]; }
  function textSection(f){
    var S = SECTIONS[f], cur = shownValue(f), editing = !!(edit && edit.section === f), inDraft = !!pdraft[f];
    var h = '<section class="sm-sec'+(editing ? ' editing' : '')+'" id="sec-'+f+'"><div class="sm-sec-h"><h3>'+esc(T(S.ar,S.en))+'</h3>'
      + (inDraft && !editing ? '<span class="sm-tag gold">'+esc(T('تعديل غير مرسل','Unsent change'))+'</span>' : '')
      + (prof.editable && !editing
          ? '<button class="sm-edit-b" onclick="startEdit(\''+f+'\')"><i class="ti ti-pencil"></i>'+esc(T(S.eAr,S.eEn))+'</button>'
          : '')
      + '</div>';
    if (!editing){
      return h + '<div class="sm-val"><span class="lg">العربية</span><p dir="rtl" lang="ar">'+esc(cur.ar || '—')+'</p></div>'
               + '<div class="sm-val"><span class="lg">English</span><p dir="ltr" lang="en">'+esc(cur.en || '—')+'</p></div>'
               + '</section>';
    }
    var rule = SP.FIELDS[f], l = edit.lang, v = edit.draft[l];
    h += '<div class="sm-seg" role="group" aria-label="'+esc(T('اللغة','Language'))+'">'
      + ['ar','en'].map(function(k){
          return '<button class="sm-seg-b" aria-pressed="'+(k === l)+'" onclick="pickLang(\''+k+'\')">'
            + (k === 'ar' ? 'العربية' : 'English') + '<span class="dot'+dotOf(k)+'"></span></button>';
        }).join('') + '</div>';
    var attrs = ' id="smField" dir="'+(l === 'ar' ? 'rtl' : 'ltr')+'" lang="'+l+'" maxlength="'+rule.max+'"'
      + ' aria-label="'+esc(T(S.ar,S.en) + ' — ' + (l === 'ar' ? 'العربية' : 'English'))+'" oninput="editInput(this.value)"';
    var ctl = rule.multiline
      ? '<textarea'+attrs+' rows="5">'+esc(v)+'</textarea>'
      : '<input'+attrs+' value="'+esc(v)+'" onkeydown="if(event.key===\'Enter\'){event.preventDefault();saveEdit();}">';
    h += '<div class="sm-field'+(edit.errors[l] ? ' bad' : '')+'" id="smWrap">' + ctl
      + '<div class="sm-meta"><span class="err" id="smErr">'+esc(edit.errors[l] || '')+'</span>'
      + '<span class="cnt" id="smCount">'+v.length+' / '+rule.max+'</span></div></div>';
    if (edit.msg) h += '<div class="sm-msg">'+esc(edit.msg)+'</div>';
    h += '<div class="sm-small">'+esc(T('يُضاف التعديل إلى «تعديلات غير مرسلة»، ثم ترسلها كلها معاً للموافقة.','The change is added to “Unsent changes”; you then submit them all together for approval.'))+'</div>'
      + '<div class="sm-acts"><button class="sm-btn" onclick="cancelEdit()">'+esc(T('إلغاء','Cancel'))+'</button>'
      + '<button class="sm-btn gold" id="smSave" onclick="saveEdit()"'+(sectionDirty() ? '' : ' disabled')+'>'
      + '<i class="ti ti-check"></i>'+esc(T('إضافة إلى التعديلات','Add to changes'))+'</button></div>';
    return h + '</section>';
  }
  /* logo / cover — the chosen file's details only; there is no file storage */
  function mediaSection(){
    var h = '<section class="sm-sec" id="sec-media"><div class="sm-sec-h"><h3>'+esc(T('الشعار وصورة الغلاف','Logo and cover image'))+'</h3></div>'
      + '<div class="sm-small">'+esc(T('لا يوجد تخزين ملفات في هذا النموذج: تُرسل بيانات الصورة المختارة فقط (الاسم والنوع والحجم) لتراها إدارة رف، ولا تُطبَّق على المتجر حتى عند الموافقة.',
                                        'This prototype has no file storage: only the chosen image’s details (name, type, size) are sent for RAF Management to see, and it is not applied to the store even when approved.'))+'</div>';
    ['logo','cover'].forEach(function(m){
      var cur = prof.media[m], d = pdraft[m];
      h += '<div class="sm-val" style="margin-top:12px"><span class="lg">'+esc(fieldLabel(m))+'</span>'
        + '<p>'+esc(cur ? T('صورة حالية على المتجر','An image is set on the store') : T('لا توجد صورة','No image'))+'</p>'
        + (d ? '<p style="margin-top:6px"><span class="sm-tag gold">'+esc(T('تعديل غير مرسل','Unsent change'))+'</span></p>'
               + '<p dir="ltr" style="overflow-wrap:anywhere;text-align:start">'+esc(d.name)

  window.openClose = function(kind){ confirmDiscard(function(){ closeDraft = { kind:kind === 'extension' ? 'extension' : 'closure', days:'', reason:'', msg:null, bad:null, busy:false }; closeMsg = null; cancelAsk = null; render(); var d = el('fcDays'); if (d) d.focus(); }); };
  window.cancelClose = function(){ closeDraft = null; render(); };
  window.fcInput = function(k, v){ if (!closeDraft) return; closeDraft[k] = v; closeDraft.msg = null; closeDraft.bad = null; };
  window.submitClose = function(){
    if (!closeDraft || closeDraft.busy) return;
    var days = String(closeDraft.days).trim(), reason = String(closeDraft.reason).trim(), kind = closeDraft.kind;
    if (!/^\d+$/.test(days) || Number(days) < 1){ closeDraft.bad = 'days'; closeDraft.msg = T('عدد الأيام مطلوب (رقم صحيح أكبر من صفر).','The number of days is required (a whole number above zero).'); render(); el('fcDays').focus(); return; }
    if (!reason){ closeDraft.bad = 'reason'; closeDraft.msg = T('السبب مطلوب.','A reason is required.'); render(); el('fcReason').focus(); return; }
    closeDraft.busy = true; render();
    var input = { days:Number(days), reason:reason, key:closeKey(kind) };
    var res = kind === 'extension' ? SST.requestExtension(input) : SST.requestClosure(input);
    if (!res.ok){ closeDraft.busy = false; closeDraft.msg = res.message || T('تعذّر إرسال الطلب.','The request could not be sent.'); render(); return; }
    try { sessionStorage.removeItem('raf_sclose_key_' + kind); } catch(e){}
    closeDraft = null; render();

    var res = SST.cancelRequest(id, {});
    closeMsg = res.ok ? null : (res.message || T('تعذّر إلغاء الطلب.','The request could not be cancelled.'));
    render(); if (res.ok) toast(T('أُلغي الطلب','The request was cancelled'));
  };
  function opsError(res){
    if (res && res.reason === 'offline') return T('لا يوجد اتصال — لم يتم حفظ التغيير.','No connection — the change was not saved.');
    return (res && res.message) || T('تعذّر تنفيذ التغيير.','The change could not be applied.');
  }

  /* ════════════════════ OPENING SCHEDULE ════════════════════
     The structured weekly hours — the single source of the store's opening
     hours. RAFStoreSchedule validates, saves, converts 12↔24-hour and
     formats; RAFStoreOps evaluates them in Kuwait time. An open day has one
     or two periods. Shown as a weekly list, edited with 12-hour pickers. */
  function lng(){ return isEn() ? 'en' : 'ar'; }
  function dayName(d){ return T(DAY_TXT[d].ar, DAY_TXT[d].en); }
  function t12(s){ return '<bdi class="sm-t">'+esc(SS.format12(s, lng()) || '—')+'</bdi>'; }
  function periodName(i){ return i === 0 ? T('الفترة الأولى','Period 1') : T('الفترة الثانية','Period 2'); }
  function emptyTime(){ return { h:'', m:'', p:'' }; }
  function emptyPeriod(){ return { from:emptyTime(), to:emptyTime() }; }
  function toParts(s){ var t = SS.from24(s); return t ? { h:String(t.h), m:(t.m < 10 ? '0' : '') + t.m, p:t.period } : emptyTime(); }
  function copyTime(t){ return { h:t.h, m:t.m, p:t.p }; }
  function copyDay(x){ return { open:x.open, periods:x.periods.map(function(p){ return { from:copyTime(p.from), to:copyTime(p.to) }; }) }; }
  /* the draft as the schedule the authority will judge — an incomplete time
     is sent as missing, so the authority's own message explains it */
  function buildSchedule(){
    var out = {};
    SS.DAYS.forEach(function(d){
      var x = schedEdit.days[d];
      if (!x.open){ out[d] = { closed:true }; return; }
      function one(t){ return (t.h === '' || t.m === '' || !t.p) ? undefined : (SS.to24(t.h, t.m, t.p) || 'invalid'); }
      out[d] = { periods:x.periods.map(function(p){ return { open:one(p.from), close:one(p.to) }; }) };
    });
    return out;
  }
  function schedDirty(){
    if (!schedEdit || !schedEdit.touched) return false;
    return JSON.stringify(buildSchedule()) !== JSON.stringify(schedEdit.original || null);
  }

  /* Store Profile → Opening hours: the customer-facing text, generated from

      + '<button class="sm-edit-b" onclick="goSchedule()"><i class="ti ti-calendar-time"></i>'+esc(T('جدول العمل','Opening schedule'))+'</button></div>';
    if (ar.configured){
      h += '<div class="sm-val"><span class="lg">العربية</span><p dir="rtl" lang="ar" id="pubHoursAr">'+esc(ar.text)+'</p></div>'
         + '<div class="sm-val"><span class="lg">English</span><p dir="ltr" lang="en" id="pubHoursEn">'+esc(en.text)+'</p></div>';
    } else {
      h += '<div class="sm-big muted">'+esc(T('لم يُضبط بعد','Not configured yet'))+'</div>';

    h += '<div class="sm-small" style="margin-top:10px">'+esc(T('ساعات العمل تُدار من جدول العمل، ويُنشأ هذا النص تلقائيًا ليراه العملاء.',
                                                              'Opening hours are managed from Opening Schedule. Customers see this text, generated automatically.'))+'</div>';
    return h + '</section>';
  }
  window.goSchedule = function(){

  function renderSchedule(){
    var r = SS.read({ actor:ME.id }), editing = !!schedEdit;
    var h = '<section class="sm-sec'+(editing ? ' editing' : '')+'" id="sec-sched"><div class="sm-sec-h"><h3>'+esc(T('جدول العمل','Opening schedule'))+'</h3>';
    if (r.ok && r.editable && !editing)
      h += '<button class="sm-edit-b" onclick="startSched()"><i class="ti ti-calendar-time"></i>'
        + esc(r.configured ? T('تعديل الجدول','Edit schedule') : T('ضبط الجدول','Set up schedule'))+'</button>';
    h += '</div>';
    if (!r.ok) return h + '<div class="sm-small">'+esc(r.message)+'</div></section>';
    if (editing) return h + schedEditHTML() + '</section>';
    if (!r.configured){
      return h + '<div class="sm-big muted">'+esc(T('لم يُضبط بعد','Not configured yet'))+'</div>'
        + '<div class="sm-small">'+esc(T('لن تظهر ساعات العمل للعملاء قبل ضبط الجدول.','Customers see no opening hours until the schedule is set up.'))+'</div></section>';
    }
    var hs = OPS.hoursState(SLUG), today = OPS.DAYS[OPS.kuwaitNow().getDay()];
    var nowLine = hs.state === 'open'            ? esc(T('مفتوح الآن · يغلق ','Open now · closes ')) + t12(hs.closesAt)
                : hs.state === 'before_open'
               || hs.state === 'between_periods' ? esc(T('مغلق الآن · يفتح ','Closed now · opens ')) + t12(hs.opensAt)
                : hs.state === 'after_close'     ? esc(T('انتهى دوام اليوم عند ','Closed for today since ')) + t12(hs.closesAt)
                : hs.state === 'closed_today'    ? esc(T('مغلق اليوم','Closed today')) : '';
    if (nowLine) h += '<div class="sm-nowline" id="schedNow"><span class="sm-dot '+(hs.state === 'open' ? 'green' : 'red')+'"></span><span>'+nowLine+'</span></div>';
    h += '<div class="sm-dayl">' + SS.DAYS.map(function(d){
      var e = r.schedule[d], closed = e.closed === true;
      return '<div class="sm-day'+(d === today ? ' today' : '')+'" data-day="'+d+'">'
        + '<span class="d">'+esc(dayName(d))+(d === today ? ' <span class="sm-tag gold">'+esc(T('اليوم','Today'))+'</span>' : '')+'</span>'
        + '<span class="s '+(closed ? 'off' : 'on')+'"><i></i>'+esc(closed ? T('مغلق','Closed') : T('مفتوح','Open'))+'</span>'
        + '<span class="h">'+(closed ? '' : e.periods.map(function(p){
            return '<span class="pl">' + t12(p.open) + '<span class="arr"> – </span>' + t12(p.close) + '</span>';
          }).join(''))+'</span></div>';
    }).join('') + '</div>';
    h += '<div class="sm-small">'+esc(T('الأوقات بتوقيت الكويت.','Times are Kuwait time.'))+'</div>';
    return h + '</section>';
  }
  function pickerHTML(d, i, which, t){
    var hours = '<option value="">--</option>';
    for (var n = 1; n <= 12; n++) hours += '<option value="'+n+'"'+(t.h === String(n) ? ' selected' : '')+'>'+n+'</option>';
    var mins = '<option value="">--</option>';
    for (var m = 0; m < 60; m++){ var mv = (m < 10 ? '0' : '') + m; mins += '<option value="'+mv+'"'+(t.m === mv ? ' selected' : '')+'>'+mv+'</option>'; }
    var lab = dayName(d) + ' — ' + periodName(i) + ' — ' + (which === 'from' ? T('من','From') : T('إلى','To'));

      + '<span class="sm-hm" dir="ltr">'
        + '<select aria-label="'+esc(lab + ' · ' + T('الساعة','hour'))+'" onchange="'+call+'\'h\',this.value)">'+hours+'</select>'
        + '<span class="c">:</span>'
        + '<select aria-label="'+esc(lab + ' · ' + T('الدقيقة','minute'))+'" onchange="'+call+'\'m\',this.value)">'+mins+'</select>'

      + '<span class="sm-ap" role="group" aria-label="'+esc(lab)+'">' + ['am','pm'].map(function(p){
          return '<button class="sm-ap-b" data-p="'+p+'" aria-pressed="'+(t.p === p)+'" onclick="'+call+'\'p\',\''+p+'\')">'

        }).join('') + '</span>'

  }
  function errText(d){
    var err = schedEdit.errors[d]; if (!err) return '';

  }
  function schedEditHTML(){
    var e = schedEdit;

      var x = e.days[d], err = e.errors[d], dayBad = err && err.period === null;
      var row = '<div class="sm-sday'+(dayBad ? ' bad' : '')+(x.open ? '' : ' closed')+'" id="sd-'+d+'">'
        + '<div class="sm-sday-h"><b>'+esc(dayName(d))+'</b>'
        + '<div class="sm-seg sm-oc" role="group" aria-label="'+esc(dayName(d))+'">'
          + '<button class="sm-seg-b" aria-pressed="'+x.open+'" onclick="setDayOpen(\''+d+'\',true)">'+esc(T('مفتوح','Open'))+'</button>'
          + '<button class="sm-seg-b" aria-pressed="'+(!x.open)+'" onclick="setDayOpen(\''+d+'\',false)">'+esc(T('مغلق','Closed'))+'</button>'
        + '</div></div>';
      if (x.open){
        row += x.periods.map(function(p, i){
          return '<div class="sm-per'+(err && err.period === i ? ' bad' : '')+'" id="sp-'+d+'-'+i+'">'
            + '<div class="sm-per-l">'+esc(periodName(i))+'</div>'
            + '<div class="sm-times">'
              + '<div class="sm-tp"><label>'+esc(T('من','From'))+'</label>'+pickerHTML(d, i, 'from', p.from)+'</div>'
              + '<div class="sm-tp"><label>'+esc(T('إلى','To'))+'</label>'+pickerHTML(d, i, 'to', p.to)+'</div>'
            + '</div></div>';

      } else {
        row += '<div class="sm-small">'+esc(T('المتجر مغلق هذا اليوم.','The store is closed this day.'))+'</div>';
      }
      row += '<div class="sm-dtools">'
        + (x.open ? (x.periods.length < SS.MAX_PERIODS
            ? '<button class="sm-copy-b sm-per-b" onclick="addPeriod(\''+d+'\')"><i class="ti ti-plus"></i>'+esc(T('إضافة فترة ثانية','Add second period'))+'</button>'
            : '<button class="sm-copy-b sm-per-b rm" onclick="removePeriod(\''+d+'\')"><i class="ti ti-minus"></i>'+esc(T('حذف الفترة الثانية','Remove second period'))+'</button>') : '')
        + '<button class="sm-copy-b" onclick="openCopy(\''+d+'\')"><i class="ti ti-copy"></i>'+esc(T('نسخ لأيام أخرى','Copy to other days'))+'</button>'
        + '</div>';
      if (e.copyFrom === d) row += copyHTML(d);
      if (err) row += '<div class="sm-derr">'+esc(errText(d))+'</div>';
      return row + '</div>';
    }).join('') + '</div>';
    if (e.msg) h += '<div class="sm-msg">'+esc(e.msg)+'</div>';
    h += '<div class="sm-small" style="margin-top:12px">'+esc(T('الأوقات بتوقيت الكويت. فترة أو فترتان في اليوم، وكل فترة تُغلق بعد أن تفتح في اليوم نفسه.',
                                                              'Times are Kuwait time. One or two periods a day; each closes later than it opens on the same day.'))+'</div>';
    h += '<div class="sm-acts"><button class="sm-btn" onclick="cancelSched()">'+esc(T('إلغاء','Cancel'))+'</button>'
      + '<button class="sm-btn gold" id="schedSave" onclick="saveSched()"'+(schedDirty() ? '' : ' disabled')+'><i class="ti ti-check"></i>'
      + esc(T('حفظ التغييرات','Save changes'))+'</button></div>';
    return h;
  }
  function copyHTML(d){
    var src = schedEdit.days[d];
    return '<div class="sm-copy"><div class="sm-choose-l">'+esc(src.open ? T('انسخ جدول هذا اليوم كاملًا إلى:','Copy this day\'s full schedule to:')
                                                                     : T('انسخ «مغلق» إلى:','Copy "Closed" to:'))+'</div>'
      + '<div class="sm-copy-days">' + SS.DAYS.filter(function(x){ return x !== d; }).map(function(x){
          return '<label class="sm-chk"><input type="checkbox"'+(schedEdit.copySel[x] ? ' checked' : '')
            + ' onchange="toggleCopy(\''+x+'\',this.checked)"><span>'+esc(dayName(x))+'</span></label>';
        }).join('') + '</div>'
      + '<div class="sm-acts"><button class="sm-btn" onclick="closeCopy()">'+esc(T('إلغاء','Cancel'))+'</button>'
      + '<button class="sm-btn gold" onclick="applyCopy()">'+esc(T('نسخ','Copy'))+'</button></div></div>';
  }
  function schedSaveState(){ var sv = el('schedSave'); if (sv) sv.disabled = !schedDirty(); }
  function schedTouched(d){ schedEdit.touched = true; delete schedEdit.errors[d]; schedEdit.msg = null; }
  window.startSched = function(){
    confirmDiscard(function(){
      var r = SS.read({ actor:ME.id });
      if (!r.ok || !r.editable) return;
      var days = {};
      SS.DAYS.forEach(function(d){
        var e = r.configured ? r.schedule[d] : null;
        /* an unconfigured schedule starts empty — no hours are assumed */
        days[d] = !e ? { open:true, periods:[emptyPeriod()] }
                : e.closed === true ? { open:false, periods:[emptyPeriod()] }
                : { open:true, periods:e.periods.map(function(p){ return { from:toParts(p.open), to:toParts(p.close) }; }) };
      });
      schedEdit = { days:days, base:r.version, original:r.configured ? r.schedule : null,
                    errors:{}, msg:null, touched:false, copyFrom:null, copySel:{} };
      render();
      var s = el('sec-sched'); if (s) s.scrollIntoView({ block:'nearest' });
    });
  };
  window.setDayOpen = function(d, open){
    if (!schedEdit) return;
    var x = schedEdit.days[d];
    x.open = open; if (!x.periods.length) x.periods.push(emptyPeriod());
    schedTouched(d);
    render();
    var b = document.querySelector('#sd-' + d + ' .sm-oc [aria-pressed="true"]'); if (b) b.focus({ preventScroll:true });
  };
  window.addPeriod = function(d){
    if (!schedEdit) return;
    var x = schedEdit.days[d];
    if (!x.open || x.periods.length >= SS.MAX_PERIODS) return;
    x.periods.push(emptyPeriod()); schedTouched(d); render();
    var s = document.querySelector('#tp-' + d + '-1-from select'); if (s) s.focus({ preventScroll:true });
  };
  window.removePeriod = function(d){
    if (!schedEdit) return;
    var x = schedEdit.days[d];
    if (x.periods.length < 2) return;
    x.periods = x.periods.slice(0, 1); schedTouched(d); render();
    var b = document.querySelector('#sd-' + d + ' .sm-per-b'); if (b) b.focus({ preventScroll:true });
  };
  window.setTime = function(d, i, which, field, v){
    if (!schedEdit) return;
    var per = schedEdit.days[d].periods[i]; if (!per) return;
    var t = per[which];
    t[field] = v;
    /* a picker convenience the merchant can see before saving: an hour
       with no minute starts at :00, and an unset AM/PM starts as the usual
       one — morning for the day's first opening, afternoon otherwise */
    if (field === 'h' && v !== '' && t.m === '') t.m = '00';
    if (field !== 'p' && t.h !== '' && !t.p) t.p = (i === 0 && which === 'from') ? 'am' : 'pm';
    schedTouched(d);
    var box = el('tp-' + d + '-' + i + '-' + which);
    if (box){
      var sels = box.querySelectorAll('select'); sels[0].value = t.h; sels[1].value = t.m;
      [].forEach.call(box.querySelectorAll('.sm-ap-b'), function(b){ b.setAttribute('aria-pressed', String(b.getAttribute('data-p') === t.p)); });
    }
    var row = el('sd-' + d);
    if (row){
      row.classList.remove('bad');
      [].forEach.call(row.querySelectorAll('.sm-per.bad'), function(p){ p.classList.remove('bad'); });
      var er = row.querySelector('.sm-derr'); if (er) er.remove();
    }
    var m = document.querySelector('#sec-sched > .sm-msg'); if (m) m.remove();
    schedSaveState();
  };
  window.openCopy = function(d){
    if (!schedEdit) return;
    schedEdit.copyFrom = d; schedEdit.copySel = {};
    /* an open day offers the other open days; "Closed" is never pre-ticked onto anything */
    if (schedEdit.days[d].open) SS.DAYS.forEach(function(x){ if (x !== d && schedEdit.days[x].open) schedEdit.copySel[x] = true; });
    render();
  };
  window.toggleCopy = function(x, on){ if (schedEdit) schedEdit.copySel[x] = !!on; };
  window.closeCopy = function(){ if (schedEdit){ schedEdit.copyFrom = null; render(); } };
  window.applyCopy = function(){
    if (!schedEdit || !schedEdit.copyFrom) return;
    var src = schedEdit.days[schedEdit.copyFrom];
    Object.keys(schedEdit.copySel).forEach(function(x){
      if (!schedEdit.copySel[x]) return;
      schedEdit.days[x] = copyDay(src);            /* open/closed, period 1 and period 2 */
      delete schedEdit.errors[x];
    });
    schedEdit.touched = true; schedEdit.copyFrom = null; render();
  };
  window.cancelSched = function(){ schedEdit = null; render(); };
  window.saveSched = function(){
    if (!schedDirty()) return;
    var res = SS.update(buildSchedule(), { actor:ME.id, baseVersion:schedEdit.base });
    if (!res.ok){
      schedEdit.errors = {}; schedEdit.msg = null;
      (res.errors || []).forEach(function(e){
        if (e.day){ if (!schedEdit.errors[e.day]) schedEdit.errors[e.day] = { msg:e.message, period:(e.period === undefined ? null : e.period) }; }
        else if (!schedEdit.msg) schedEdit.msg = e.message;
      });
      if (!Object.keys(schedEdit.errors).length && !schedEdit.msg) schedEdit.msg = res.message;
      render();
      var first = SS.DAYS.filter(function(d){ return schedEdit.errors[d]; })[0];
      if (first){ var row = el('sd-' + first); if (row) row.scrollIntoView({ block:'center' }); }
      return;
    }
    schedEdit = null; render(); toast(T('تم حفظ جدول العمل','Opening schedule saved'));
  };
