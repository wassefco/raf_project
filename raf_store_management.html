  /* ════════════════════ SETTINGS ════════════════════
     Four sections, all of them about the SIGNED-IN ACCOUNT rather than the
     store: Account, Notifications, Preferences and Security.

     · Account       — read-only. RAF's user record is the only account
                       authority, and it has no self-service update path, so
                       the values are shown and not offered for editing.
     · Notifications — only the two alerts the workspace really produces.
                       The setting decides audibility and nothing else.
     · Preferences   — sidebar order + landing page (RAFMerchantPrefs) and the
                       app language, which keeps using RAF's existing
                       `raf_lang` switch rather than a second store.
     · Security      — the prototype has no password, session or 2FA
                       authority, so the capabilities are named and marked
                       unavailable instead of being simulated.

     Nothing here changes a permission, a store setting or a business rule. */
  var PREFS = window.RAFMerchantPrefs;
  function navDirty(saved){
    return JSON.stringify(navDraft.order) !== JSON.stringify(saved.order) || navDraft.landing !== saved.landing;
  }
  function settingsShell(body){
    return '<div class="sm-wrap"><section class="sm-sec"><div class="sm-sec-h"><h3>'+esc(T('الإعدادات','Settings'))+'</h3></div>'
      + '<div class="sm-empty">'+esc(body)+'</div></section></div>';
  }

  /* ---------- A · Account (read-only) ----------
     Identity comes from RAFPerm and is never derived from the store. Only
     fields the user record actually carries are shown. */
  var ACCOUNT_TYPE = {
    merchant:{ ar:'حساب تاجر', en:'Merchant account' }, staff:{ ar:'حساب موظف رف', en:'RAF staff account' },
    driver:{ ar:'حساب سائق', en:'Driver account' },     customer:{ ar:'حساب عميل', en:'Customer account' }
  };
  function renderAccount(){
    var u = null; try { u = RAFPerm.getUser(ME.id); } catch(e){}
    var h = '<section class="sm-sec"><div class="sm-sec-h"><h3>'+esc(T('الحساب','Account'))+'</h3>'
      + '<span class="sm-tag"><i class="ti ti-lock"></i>'+esc(T('للعرض فقط','Read-only'))+'</span></div>';
    if (!u) return h + '<div class="sm-empty">'+esc(T('تعذّر قراءة بيانات الحساب.','Your account details could not be read.'))+'</div></section>';

    var role = null; try { role = RAFPerm.getRole(u.roleId); } catch(e){}
    var typ = ACCOUNT_TYPE[u.accountType];
    var rows = [
      [T('الاسم','Name'), esc(u.name || '—')],
      [T('البريد الإلكتروني','Email'), u.email ? '<bdi>'+esc(u.email)+'</bdi>' : '<span class="muted">—</span>'],
      [T('رقم الجوال','Phone'), u.phone ? '<bdi>'+esc(u.phone)+'</bdi>' : '<span class="muted">—</span>'],
      [T('نوع الحساب','Account type'), esc(typ ? T(typ.ar, typ.en) : (u.accountType || '—'))],
      [T('الدور','Role'), esc(role ? T(role.nameAr, role.nameEn) : '—')],
      [T('الحالة','Status'), '<span class="sm-tag '+(u.status === 'active' ? 'green' : 'red')+'">'
        + esc(u.status === 'active' ? T('نشط','Active') : T('موقوف','Suspended'))+'</span>'],
      [T('المتجر المرتبط','Linked store'), prof && prof.ok ? esc(L(prof.fixed.name)) + ' · <bdi class="en">'+esc(SLUG)+'</bdi>' : '<bdi class="en">'+esc(SLUG)+'</bdi>'],
      [T('تاريخ الانضمام','Member since'), '<bdi class="en">'+esc(u.regDate || '—')+'</bdi>']
    ];
    h += '<dl class="sm-kv">' + rows.map(function(r){
      return '<dt>'+esc(r[0])+'</dt><dd>'+r[1]+'</dd>'; }).join('') + '</dl>';
    h += '<div class="sm-info"><i class="ti ti-info-circle"></i><span>'
      + esc(T('بيانات الحساب تديرها إدارة رف من نظام الحسابات والصلاحيات، ولا يمكن تعديلها من هنا. لا تُحفظ أي كلمات مرور أو بيانات اعتماد في هذا الجهاز.',
              'Account details are managed by RAF through the accounts and permissions system and cannot be edited here. No passwords or credentials are stored on this device.'))
      + '</span></div></section>';
    return h;
  }

  /* ---------- B · Notifications ----------
     Two real alerts exist in the merchant workspace, both produced by the
     Orders page: the new-order alert and the acceptance-window warning. The
     toggles below change whether those two make a sound. Everything else in
     this section is named honestly as not built. */
  function sndDirty(saved){
    return !!sndDraft && (sndDraft.newOrder !== saved.sounds.newOrder || sndDraft.warning !== saved.sounds.warning);
  }
  function onOff(field, on){
    return '<span class="sm-seg" role="group">'
      + '<button class="sm-seg-b" aria-pressed="'+(on ? 'true' : 'false')+'" onclick="sndSet(\''+field+'\',true)">'
        + esc(T('مفعّل','On'))+'</button>'
      + '<button class="sm-seg-b" aria-pressed="'+(!on ? 'true' : 'false')+'" onclick="sndSet(\''+field+'\',false)">'
        + esc(T('صامت','Off'))+'</button></span>';
  }
  function notAvailableRow(ar, en, subAr, subEn){
    return '<div class="sm-row"><div class="rb"><b>'+esc(T(ar,en))+'</b><span>'+esc(T(subAr,subEn))+'</span></div>'
      + '<span class="sm-tag">'+esc(T('غير مُهيّأ','Not configured'))+'</span></div>';
  }
  function renderNotifs(pr){
    if (!sndDraft) sndDraft = { newOrder:pr.sounds.newOrder, warning:pr.sounds.warning, msg:null, ok:null };
    var h = '<section class="sm-sec"><div class="sm-sec-h"><h3>'+esc(T('الإشعارات','Notifications'))+'</h3>'
      + '<span class="sm-tag">'+esc(T('خاصة بحسابك','Personal to your account'))+'</span></div>'
      + '<div class="sm-small">'+esc(T('تنبيهات لوحة التاجر داخل التطبيق. التحكم هنا بالصوت فقط: الإشعار ومهلة القبول ووضع التركيز لا تتغيّر.',
              'Merchant alerts inside the workspace. These control sound only: the notification itself, the acceptance window and Focus Mode are unchanged.'))+'</div>'
      + '<div class="sm-row"><div class="rb"><b>'+esc(T('صوت الطلب الجديد','New order sound'))+'</b>'
        + '<span>'+esc(T('عند وصول طلب يحتاج قراراً. الطلبات المجدولة وطلبات الافتتاح التالي تُنبّه عند موعدها فقط.',
                        'When an order arrives that needs a decision. Scheduled and next-opening orders alert only once they are actionable.'))+'</span></div>'
        + onOff('newOrder', sndDraft.newOrder)+'</div>'
      + '<div class="sm-row"><div class="rb"><b>'+esc(T('صوت تحذير قرب انتهاء المهلة','Acceptance warning sound'))+'</b>'
        + '<span>'+esc(T('قبل انتهاء مهلة قبول الطلب. المهلة نفسها لا تتأثر بهذا الإعداد.',
                        'Before the acceptance window runs out. The window itself is not affected by this setting.'))+'</span></div>'
        + onOff('warning', sndDraft.warning)+'</div>'
      + (sndDraft.msg ? '<div class="sm-msg">'+esc(sndDraft.msg)+'</div>' : '')
      + (sndDraft.ok ? '<div class="sm-okbox">'+esc(sndDraft.ok)+'</div>' : '')
      + '<div class="sm-acts"><button class="sm-btn" onclick="sndCancel()"'+(sndDirty(pr) ? '' : ' disabled')+'>'
        + esc(T('إلغاء','Cancel'))+'</button>'
      + '<button class="sm-btn gold" onclick="sndSave()"'+(sndDirty(pr) ? '' : ' disabled')+'><i class="ti ti-check"></i>'
        + esc(T('حفظ','Save'))+'</button></div>'
      + '<div class="sm-sec-h" style="margin-top:14px;padding-top:14px;border-top:1px solid var(--border)"><h3 style="font-size:13.5px">'
        + esc(T('قنوات غير متوفرة في هذه النسخة','Channels not built in this prototype'))+'</h3></div>'
      + notAvailableRow('إشعارات تجربة العملاء','Customer Experience notifications',
                        'لا يوجد مصدر إشعارات للتقييمات أو البلاغات حتى الآن.','Reviews and issues do not emit a notification yet.')
      + notAvailableRow('إشعارات الدعم','Support notifications',
                        'تذاكر الدعم تُقرأ من صفحة الدعم ولا ترسل تنبيهاً.','Support tickets are read from the Support page and send no alert.')
      + notAvailableRow('إشعارات المخزون','Inventory notifications',
                        'تنبيه نفاد المخزون يُعرض داخل صفحة المنتجات فقط.','Low stock is shown inside Products & Inventory only.')
      + notAvailableRow('البريد والرسائل والإشعارات الفورية','Email, SMS and push',
                        'لا توجد بنية إرسال خارجية في هذه النسخة.','The prototype has no external delivery of any kind.')
      + '</section>';
    return h;
  }
  window.sndSet = function(field, on){
    if (!sndDraft || (field !== 'newOrder' && field !== 'warning')) return;
    sndDraft[field] = !!on; sndDraft.msg = null; sndDraft.ok = null; render();
  };
  window.sndSave = function(){
    var res = PREFS.saveSounds({ newOrder:sndDraft.newOrder, warning:sndDraft.warning }, { actor:ME.id });
    if (!res.ok){ sndDraft.msg = res.message; sndDraft.ok = null; render(); return; }
    sndDraft = { newOrder:res.sounds.newOrder, warning:res.sounds.warning, msg:null,
                 ok:T('تم حفظ إعدادات التنبيه الصوتي.','Your alert sound settings were saved.') };
    render(); toast(T('تم الحفظ','Saved'));
  };
  window.sndCancel = function(){ sndDraft = null; render(); };

  /* ---------- D · Security ----------
     Nothing is simulated here. RAF's prototype has no password store, no
     session registry and no second factor, so each capability is named and
     marked unavailable. The one real action is the existing sign-out. */
  function renderSecurity(){
    var u = null; try { u = RAFPerm.getUser(ME.id); } catch(e){}
    return '<section class="sm-sec"><div class="sm-sec-h"><h3>'+esc(T('الأمان','Security'))+'</h3></div>'
      + '<div class="sm-row"><div class="rb"><b>'+esc(T('الجلسة الحالية','Current session'))+'</b>'
        + '<span>'+esc(T('مسجّل الدخول باسم','Signed in as'))+' '+esc((u && u.name) || ME.name || '—')+'</span></div>'
        + '<button type="button" class="sm-link" onclick="RAFSignOut()"><i class="ti ti-logout"></i>'+esc(T('تسجيل الخروج','Sign Out'))+'</button></div>'
      + notAvailableRow('تغيير كلمة المرور','Change password',
                        'لا يوجد نظام كلمات مرور في هذه النسخة، ولا تُحفظ أي كلمة مرور.','The prototype has no password system, and no password is stored anywhere.')
      + notAvailableRow('الجلسات النشطة وسجل الدخول','Active sessions and login activity',
                        'لا يوجد سجل جلسات يمكن عرضه.','There is no session registry to show.')
      + notAvailableRow('التحقق بخطوتين','Two-factor authentication',
                        'لا توجد بنية تحقق ثانية في هذه النسخة.','No second-factor infrastructure exists in this prototype.')
      + '<div class="sm-info"><i class="ti ti-shield-lock"></i><span>'
      + esc(T('لا تُخزَّن كلمات مرور أو رموز أو بيانات اعتماد في هذا المتصفح. هذه الحالات معروضة كما هي بدل محاكاة ميزات غير موجودة.',
              'No passwords, tokens or credentials are stored in this browser. These states are shown as they are rather than simulating features that do not exist.'))
      + '</span></div></section>';
  }

  function renderSettings(){
    if (!PREFS) return settingsShell(T('تعذّر تحميل التفضيلات.','Preferences could not be loaded.'));
    var pr = PREFS.read({ actor:ME.id });
    if (!pr.ok) return settingsShell(pr.message);
    if (!navDraft) navDraft = { order:pr.order.slice(), landing:pr.landing, msg:null, ok:null, dragFrom:null, focus:null };

    var n = navDraft.order.length;
    var rows = navDraft.order.map(function(k, i){
      var item = PREFS.itemOf(k);
      return '<div class="sm-nav-row" draggable="true" data-i="'+i+'"'
        + ' ondragstart="navDragStart(event,'+i+')" ondragover="navDragOver(event,'+i+')"'
        + ' ondrop="navDrop(event,'+i+')" ondragend="navDragEnd(event)" ondragleave="navDragLeave(event)">'
        + '<i class="ti ti-grip-vertical gr" aria-hidden="true"></i>'
        + '<span class="ic"><i class="ti '+esc(item.ic)+'"></i></span>'
        + '<span class="nm">'+esc(PREFS.label(item, true))+'</span>'
        + '<span class="pos">'+(i+1)+'/'+n+'</span>'
        + '<span class="mv">'
        + '<button class="sm-nav-b" id="navUp'+i+'" onclick="navMove('+i+',-1)"'+(i === 0 ? ' disabled' : '')
          + ' aria-label="'+esc(T('تحريك '+PREFS.label(item, true)+' لأعلى','Move '+PREFS.label(item, true)+' up'))+'"><i class="ti ti-chevron-up"></i></button>'
        + '<button class="sm-nav-b" id="navDn'+i+'" onclick="navMove('+i+',1)"'+(i === n - 1 ? ' disabled' : '')
          + ' aria-label="'+esc(T('تحريك '+PREFS.label(item, true)+' لأسفل','Move '+PREFS.label(item, true)+' down'))+'"><i class="ti ti-chevron-down"></i></button>'
        + '</span></div>';
    }).join('');

    var opts = pr.allowed.map(function(k){
      var item = PREFS.itemOf(k);
      return '<option value="'+esc(k)+'"'+(navDraft.landing === k ? ' selected' : '')+'>'+esc(PREFS.label(item, true))+'</option>';
    }).join('');

    var prefs = '<section class="sm-sec"><div class="sm-sec-h"><h3>'+esc(T('التفضيلات','Preferences'))+'</h3>'
      + '<span class="sm-tag">'+esc(T('خاصة بحسابك','Personal to your account'))+'</span></div>'
      + '<div class="sm-small" style="font-size:13px;color:var(--text3);line-height:1.7">'
      + esc(T('رتّب قائمة التنقل واختر الصفحة التي تفتح أولاً. تُطبَّق على حسابك في كل صفحات لوحة التاجر، ولا تؤثر على حسابات أخرى.',
              'Arrange the navigation and choose which page opens first. This applies to your account across every Merchant Dashboard page and never affects anyone else.'))+'</div>'
      + '<div class="sm-nav-list" id="navList" role="list" aria-label="'+esc(T('ترتيب قائمة التنقل','Sidebar order'))+'">'+rows+'</div>'
      + '<div class="sm-nav-f"><label for="navLanding">'+esc(T('الصفحة الافتراضية عند الدخول','Default landing page'))+'</label>'
      + '<select id="navLanding" onchange="navLanding(this.value)">'+opts+'</select></div>'
      + (pr.landingFellBack ? '<div class="sm-info"><i class="ti ti-info-circle"></i><span>'
          + esc(T('الصفحة المحفوظة لم تعد متاحة لصلاحياتك، لذلك تم الرجوع إلى صفحة متاحة.',
                  'Your saved page is no longer available to your permissions, so an available page was used instead.'))+'</span></div>' : '')
      + (navDraft.msg ? '<div class="sm-msg">'+esc(navDraft.msg)+'</div>' : '')
      + (navDraft.ok ? '<div class="sm-okbox">'+esc(navDraft.ok)+'</div>' : '')
      + '<div class="sm-acts"><button class="sm-btn" onclick="navReset()"><i class="ti ti-rotate"></i>'
        + esc(T('إعادة التعيين للوضع الافتراضي','Reset to default'))+'</button>'
      + '<button class="sm-btn gold" onclick="navSave()"'+(navDirty(pr) ? '' : ' disabled')+'><i class="ti ti-check"></i>'
        + esc(T('حفظ','Save'))+'</button></div>'
      + '<div class="sm-info"><i class="ti ti-info-circle"></i><span>'
      + esc(T('إعادة التعيين تعيد ترتيب القائمة والصفحة الافتراضية فقط، ولا تمس أي إعدادات أخرى.',
              'Reset restores only the sidebar order and the default page; no other settings are touched.'))+'</span></div>'
      /* the app language keeps using RAF's own `raf_lang` switch — this is the
         same control as the header toggle, not a second language store */
      + '<div class="sm-row" style="margin-top:16px;border-top:1px solid var(--border)">'
        + '<div class="rb"><b>'+esc(T('لغة التطبيق','App language'))+'</b>'
        + '<span>'+esc(T('تُطبَّق فوراً على هذا المتصفح، مثل زر اللغة في الأعلى.',
                        'Applies immediately on this browser, exactly like the language button in the header.'))+'</span></div>'
        + '<span class="sm-seg" role="group">'
        + '<button class="sm-seg-b" aria-pressed="'+(!isEn() ? 'true' : 'false')+'" onclick="setLang(\'ar\')">العربية</button>'
        + '<button class="sm-seg-b" aria-pressed="'+(isEn() ? 'true' : 'false')+'" onclick="setLang(\'en\')">English</button>'
        + '</span></div>'
      + '</section>';
    return '<div class="sm-wrap">' + renderAccount() + renderNotifs(pr) + prefs + renderSecurity() + '</div>';
  }
  /* the rail is redrawn from the same authority, so the page the merchant is
     standing on shows the new order immediately */
  function navRepaint(){ try { if (window.RAFMerchantNav) RAFMerchantNav.render(); } catch(e){} }
  function navAfterRender(){
    if (!navDraft || !navDraft.focus) return;
    var b = el(navDraft.focus); navDraft.focus = null;
    if (b && !b.disabled) b.focus();
  }
  window.navMove = function(i, dir){
    var j = i + dir;
    if (!navDraft || j < 0 || j >= navDraft.order.length) return;
    var o = navDraft.order; var t = o[i]; o[i] = o[j]; o[j] = t;
    navDraft.msg = null; navDraft.ok = null;
    navDraft.focus = (dir < 0 ? 'navUp' : 'navDn') + j;
    render();
  };
  window.navDragStart = function(e, i){
    if (!navDraft) return;
    navDraft.dragFrom = i;
    try { e.dataTransfer.effectAllowed = 'move'; e.dataTransfer.setData('text/plain', String(i)); } catch(x){}
    var row = e.currentTarget; setTimeout(function(){ row.classList.add('drag'); }, 0);
  };
  window.navDragOver = function(e, i){
    if (!navDraft || navDraft.dragFrom === null) return;
    e.preventDefault();
    try { e.dataTransfer.dropEffect = 'move'; } catch(x){}
    if (navDraft.dragFrom !== i) e.currentTarget.classList.add('over');
  };
  window.navDragLeave = function(e){ e.currentTarget.classList.remove('over'); };
  window.navDrop = function(e, i){
    e.preventDefault();
    if (!navDraft || navDraft.dragFrom === null) return;
    var from = navDraft.dragFrom; navDraft.dragFrom = null;
    if (from === i) { render(); return; }
    var o = navDraft.order, moved = o.splice(from, 1)[0];
    o.splice(i, 0, moved);
    navDraft.msg = null; navDraft.ok = null;
    render();
  };
  window.navDragEnd = function(){
    if (navDraft) navDraft.dragFrom = null;
    document.querySelectorAll('.sm-nav-row').forEach(function(r){ r.classList.remove('drag','over'); });
  };
  window.navLanding = function(v){ if (!navDraft) return; navDraft.landing = v; navDraft.msg = null; navDraft.ok = null; render(); };
  window.navSave = function(){
    var res = PREFS.save({ order:navDraft.order, landing:navDraft.landing }, { actor:ME.id });
    if (!res.ok){ navDraft.msg = res.message; navDraft.ok = null; render(); return; }
    navDraft = { order:res.order.slice(), landing:res.landing, msg:null,
                 ok:T('تم حفظ تفضيلات التنقل.','Your navigation preferences were saved.'), dragFrom:null, focus:null };
    navRepaint(); render(); toast(T('تم الحفظ','Saved'));
  };
  window.navReset = function(){
    var res = PREFS.reset({ actor:ME.id });
    if (!res.ok){ navDraft.msg = res.message; navDraft.ok = null; render(); return; }
    navDraft = { order:res.order.slice(), landing:res.landing, msg:null,
                 ok:T('تمت إعادة التعيين للوضع الافتراضي.','Reset to the default order and page.'), dragFrom:null, focus:null };
    navRepaint(); render(); toast(T('تمت إعادة التعيين','Reset'));
  };

  /* ---------- navigation ---------- */
  window.setTab = function(k){
    if (!TABS.some(function(t){ return t.k === k; }) || k === st.tab) return;
    confirmDiscard(function(){
      st.tab = k; busyMsg = null; savePrefs(); render();
      var b = el('tab-' + k); if (b) b.focus({ preventScroll:true });
    });
  };
  window.refreshAll = function(){
    confirmDiscard(function(){ busyMsg = null; loadProfile(); render(); });
  };
  window.toggleLang = function(){
    var r = root(), en = r.lang === 'en';
    r.lang = en ? 'ar' : 'en'; r.dir = en ? 'rtl' : 'ltr';
    try { localStorage.setItem('raf_lang', r.lang); } catch(e){}
    applyLang(); if (edit) edit.focus = true; render();      /* an edit in progress is kept */
  };
  /* the Preferences control and the header button are the same switch */
  window.setLang = function(l){ if ((l === 'en') !== isEn()) toggleLang(); };
  function applyLang(){
    var en = isEn();
    document.querySelectorAll('[data-ar][data-en]').forEach(function(e){
      var t = e.getAttribute('data-'+(en?'en':'ar')); if (t !== null) e.textContent = t;
    });
    el('langLabel').textContent = en ? 'ع' : 'EN';
    document.title = en ? 'RAF — Store Management' : 'رف — إدارة المتجر';
  }
  document.addEventListener('keydown', function(e){
    if (e.key === 'Escape'){
      if (!el('dlg').hidden){ dlgKeep(); return; }
      if (edit || schedEdit){ confirmDiscard(function(){ render(); }); return; }
      if (prepEdit || busyPick){ prepEdit = null; busyPick = null; render(); }
      return;
    }
    if (!e.target || !e.target.closest || !e.target.closest('#tabs')) return;
    if (e.key !== 'ArrowLeft' && e.key !== 'ArrowRight') return;
    var i = TABS.findIndex(function(t){ return t.k === st.tab; });
    var fwd = (e.key === 'ArrowLeft') === !isEn();
    e.preventDefault(); setTab(TABS[(i + (fwd ? 1 : -1) + TABS.length) % TABS.length].k);
  });
  /* leaving through the sidebar asks the same one question */
  document.addEventListener('click', function(e){
    var a = e.target && e.target.closest && e.target.closest('.mw-rail a[href]');
    if (!a || !dirty() || a.target === '_blank') return;
    e.preventDefault();
    var href = a.getAttribute('href');
    confirmDiscard(function(){ window.location.href = href; });
  }, true);

  /* ---------- another session changed the store ---------- */
  function onExternal(){
    if (schedEdit && schedDirty()){
      var fr = SS.read({ actor:ME.id });
      if (fr.ok && fr.version !== schedEdit.base){
        schedEdit.msg = T('تم تعديل جدول العمل من جلسة أخرى. ألغِ التعديل لعرض أحدث نسخة.',
                          'The schedule was changed in another session. Cancel to see the latest version.');
        render();
      }
      return;
    }
    if (schedEdit) schedEdit = null;
    if (edit && sectionDirty()){
      var fresh = SP.read({ actor:ME.id });
      if (fresh.ok && fresh.version !== edit.base){
        edit.msg = T('تم تعديل هذه المعلومات من جلسة أخرى. ألغِ التعديل لعرض أحدث نسخة.',
                     'This was changed in another session. Cancel to see the latest version.');
        render();
      }
      return;
    }
    edit = null; loadProfile(); render();
  }

  function gate(title, text){
    el('gate').style.display = ''; el('gateT').textContent = title; el('gateP').textContent = text;
  }
  function boot(){
    var l = null; try { l = localStorage.getItem('raf_lang'); } catch(e){}
    if (l === 'en'){ root().lang = 'en'; root().dir = 'ltr'; }
    applyLang();

    if (!SP || !OPS || !window.RAFPerm){ gate(T('تعذّر التحميل','Could not load'), ''); return; }
    var me = RAFPerm.currentUser();
    var link = RAFPerm.storeLinkOf(me ? me.id : null);
    if (!me || !link.ok){
      gate(link.reason === 'store_not_found' ? T('المتجر المرتبط غير موجود','Linked store not found') : T('لا يوجد متجر مرتبط بالحساب','No store linked to this account'),
           T('لم يتم ربط هذا الحساب بمتجر. يتم الربط يدوياً ولا يُخمَّن تلقائياً.','This account is not linked to a store. Links are set explicitly and never inferred.'));
      return;
    }
    if (!SP.canView(me.id)){
      gate(T('لا تملك صلاحية إدارة المتجر','You do not have permission to manage the store'),
           T('يتم التحكم بالصلاحيات من نظام صلاحيات رف.','Access is controlled by the RAF permission system.'));
      return;
    }
    ME = { id:me.id, name:me.name };
    SLUG = link.slug;
    loadPrefs();
    el('shell').style.display = '';
    el('stName').textContent = L(link.store.name);
    if (link.store.logo){ var lg = el('stLogo'); lg.style.backgroundImage = "url('"+link.store.logo+"')"; lg.innerHTML = ''; }
    loadProfile();
    render();

    document.addEventListener('raf:ops', function(){ if (st.tab === 'operations') render(); });
    document.addEventListener('raf:source', onExternal);
    window.addEventListener('storage', function(e){
      if (e.key === 'raf_source_overrides') onExternal();
      else if ((e.key === 'raf_store_profile_requests' || e.key === 'raf_store_profile_request_events') && st.tab === 'profile' && !edit) render();
      else if ((e.key === 'raf_store_closure_requests' || e.key === 'raf_store_closure_request_events') && st.tab === 'operations' && !closeDraft) render();
      else if ((e.key === 'raf_users' || e.key === 'raf_roles') && st.tab === 'team') render();
    });
    /* Busy Mode ends by time — reflect it when it does */
    setInterval(function(){ if (st.tab === 'operations' && lastBusy !== null && OPS.isBusy(SLUG) !== lastBusy) render(); }, 15000);
    window.addEventListener('beforeunload', function(e){ if (dirty() || hasDraft()){ e.preventDefault(); e.returnValue = ''; } });
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot); else boot();
})();
</script>
</body>
</html>
