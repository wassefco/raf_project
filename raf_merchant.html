<!DOCTYPE html>
<html id="htmlRoot" lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>رف — الطلبات</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700;900&family=Tajawal:wght@300;400;500;700;800&family=DM+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
<link rel="icon" type="image/png" sizes="64x64" href="raf_favicon.png">
<link rel="icon" type="image/png" sizes="32x32" href="raf_favicon_32.png">
<link rel="apple-touch-icon" href="raf_appicon.png">
<script src="raf_features.js"></script>
<link rel="stylesheet" href="raf_theme.css">
<style>
/* ══════════════════════════════════════════════════════════════
   MERCHANT WORKSPACE — ORDERS  (Phase 1, interface only)
   Built on the RAF design tokens from raf_theme.css. Nothing here
   redefines the design language; it only lays out the workspace.
   ══════════════════════════════════════════════════════════════ */
*{box-sizing:border-box;}
body{background:var(--bg2);margin:0;}

/* ---------- shell ---------- */
.mw{display:flex;min-height:100vh;}
.mw-rail{width:74px;flex:0 0 74px;background:var(--ink);display:flex;flex-direction:column;align-items:center;
  gap:6px;padding:14px 0;position:sticky;top:0;height:100vh;z-index:40;}
.mw-rail-logo{width:42px;height:42px;border-radius:13px;background:var(--gold);color:#1C1606;display:flex;
  align-items:center;justify-content:center;font-family:var(--font-display);font-size:19px;font-weight:900;
  margin-bottom:10px;text-decoration:none;}
.mw-rail-b{width:50px;min-height:50px;border-radius:14px;border:0;background:transparent;color:#8E877A;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;cursor:pointer;
  font-family:inherit;font-size:9.5px;font-weight:700;transition:background .18s,color .18s;}
.mw-rail-b i{font-size:21px;}
.mw-rail-b:hover:not(:disabled){background:rgba(255,255,255,.07);color:#EDE8DC;}
.mw-rail-b.on{background:var(--gold-soft);color:var(--gold);}
.mw-rail-b:disabled{opacity:.34;cursor:not-allowed;}
.mw-rail-sp{flex:1;}
.mw-main{flex:1;min-width:0;display:flex;flex-direction:column;}

/* ---------- header ---------- */
.mw-head{position:sticky;top:0;z-index:35;background:var(--card);border-bottom:1px solid var(--border);
  padding:12px clamp(14px,2.2vw,24px);display:flex;align-items:center;gap:14px;flex-wrap:wrap;}
.mw-store{display:flex;align-items:center;gap:11px;min-width:0;}
.mw-store-logo{width:44px;height:44px;flex:0 0 auto;border-radius:13px;background:var(--bg3) center/cover no-repeat;
  display:flex;align-items:center;justify-content:center;color:var(--gold2);font-size:21px;}
.mw-store-t{min-width:0;}
.mw-store-t b{display:block;font-family:var(--font-display);font-size:17px;font-weight:800;color:var(--ink);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.mw-store-t span{font-size:11.5px;color:var(--text3);}
.mw-head-sp{flex:1;min-width:8px;}
.mw-hbtn{width:44px;height:44px;border-radius:13px;border:1px solid var(--border);background:var(--card);
  color:var(--text2);font-size:20px;cursor:pointer;position:relative;display:flex;align-items:center;justify-content:center;
  transition:border-color .18s,color .18s;}
.mw-hbtn:hover{border-color:var(--gold);color:var(--gold2);}
.mw-hbtn .dot{position:absolute;top:8px;inset-inline-end:8px;width:8px;height:8px;border-radius:50%;
  background:var(--red);border:2px solid var(--card);}
.mw-prof{display:flex;align-items:center;gap:9px;height:44px;padding:0 12px;border-radius:13px;
  border:1px solid var(--border);background:var(--card);cursor:pointer;font-family:inherit;transition:border-color .18s;}
.mw-prof:hover{border-color:var(--gold);}
.mw-prof-av{width:28px;height:28px;border-radius:50%;background:var(--gold-soft);color:var(--gold2);
  display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:800;}
.mw-prof-n{font-size:12.5px;font-weight:700;color:var(--ink);max-width:120px;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap;}

/* ---------- operational banner ---------- */
.mw-ops{display:flex;align-items:center;gap:12px;padding:9px 14px;border-radius:14px;border:1px solid var(--border2);
  background:var(--bg);min-width:0;}
.mw-ops-dot{width:11px;height:11px;flex:0 0 auto;border-radius:50%;background:var(--green);
  box-shadow:0 0 0 4px rgba(46,158,91,.16);}
.mw-ops[data-load="moderate"] .mw-ops-dot{background:#E0A32E;box-shadow:0 0 0 4px rgba(224,163,46,.18);}
.mw-ops[data-load="heavy"] .mw-ops-dot{background:var(--red);box-shadow:0 0 0 4px rgba(217,83,79,.18);}
.mw-ops-t{min-width:0;line-height:1.35;}
.mw-ops-t b{display:block;font-size:12.5px;font-weight:800;color:var(--ink);white-space:nowrap;}
.mw-ops-t span{font-size:11.5px;color:var(--text2);white-space:nowrap;}
.mw-ops-t span em{font-style:normal;font-family:var(--font-en);font-weight:700;color:var(--gold2);}
.mw-ops-edit{margin-inline-start:4px;height:34px;padding:0 13px;border-radius:30px;border:1px solid var(--border2);
  background:var(--card);color:var(--text2);font-family:inherit;font-size:12px;font-weight:700;cursor:pointer;
  display:inline-flex;align-items:center;gap:6px;transition:border-color .18s,color .18s,background .18s;}
.mw-ops-edit:hover{border-color:var(--gold);background:var(--gold-soft);color:var(--gold2);}

/* ---------- split workspace ---------- */
.mw-split{flex:1;display:grid;grid-template-columns:minmax(0,1fr) minmax(360px,420px);gap:0;align-items:start;}
.mw-list{min-width:0;padding:16px clamp(14px,2.2vw,24px) 40px;}
.mw-side{position:sticky;top:69px;height:calc(100vh - 69px);border-inline-start:1px solid var(--border);
  background:var(--card);overflow:auto;}

/* ---------- search + chips ---------- */
.mw-search{position:relative;margin-bottom:12px;}
.mw-search input{width:100%;height:48px;border-radius:14px;border:1px solid var(--border2);background:var(--card);
  font-family:inherit;font-size:14px;color:var(--ink);padding-inline-start:46px;padding-inline-end:14px;}
.mw-search input:focus{outline:2px solid var(--gold);outline-offset:1px;border-color:var(--gold);}
.mw-search > i{position:absolute;top:50%;transform:translateY(-50%);inset-inline-start:15px;font-size:19px;color:var(--text3);
  pointer-events:none;}
.mw-search-hint{font-size:11px;color:var(--text3);margin:6px 2px 0;}
.mw-chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;margin-bottom:14px;scrollbar-width:none;}
.mw-chips::-webkit-scrollbar{display:none;}
.mw-chip{flex:0 0 auto;height:36px;padding:0 14px;border-radius:30px;border:1px solid var(--border2);
  background:var(--card);color:var(--text2);font-family:inherit;font-size:12.5px;font-weight:700;cursor:pointer;
  display:inline-flex;align-items:center;gap:6px;transition:all .18s;}
.mw-chip:hover{border-color:var(--gold);color:var(--gold2);}
.mw-chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#F5F0E4;}
.mw-chip i{font-size:15px;}

/* ---------- queue groups ---------- */
.mw-grp{margin-bottom:22px;}
.mw-grp-h{display:flex;align-items:center;gap:9px;margin-bottom:11px;}
.mw-grp-h b{font-size:13.5px;font-weight:800;color:var(--ink);}
.mw-grp-n{font-family:var(--font-en);font-size:11.5px;font-weight:800;color:var(--text2);background:var(--bg3);
  border-radius:20px;padding:2px 9px;min-width:24px;text-align:center;}
.mw-grp-line{flex:1;height:1px;background:var(--border);}
.mw-grp-h .pip{width:9px;height:9px;border-radius:50%;flex:0 0 auto;}
.pip-pending{background:var(--gold);} .pip-preparing{background:#E0A32E;} .pip-ready{background:var(--green);}
.pip-driver{background:#3E7BB6;} .pip-scheduled{background:#8A857C;} .pip-done{background:#5A9E76;}
.pip-cancelled{background:var(--red);}
.mw-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:11px;}
.mw-empty{border:1px dashed var(--border2);border-radius:14px;padding:16px;text-align:center;font-size:12.5px;
  color:var(--text3);background:var(--card);}

/* ---------- order card ---------- */
.mw-card{text-align:start;width:100%;background:var(--card);border:1px solid var(--border);border-radius:16px;
  padding:13px 14px;cursor:pointer;font-family:inherit;display:flex;flex-direction:column;gap:9px;
  transition:border-color .18s,box-shadow .18s,transform .18s;}
.mw-card:hover{border-color:var(--gold);box-shadow:0 12px 26px -20px rgba(20,16,8,.5);}
.mw-card:focus-visible{outline:2px solid var(--gold);outline-offset:2px;}
.mw-card.on{border-color:var(--gold);background:var(--gold-soft);}
.mw-c-top{display:flex;align-items:center;gap:9px;}
.mw-c-no{font-family:var(--font-en);font-size:13.5px;font-weight:800;color:var(--ink);}
.mw-c-time{font-size:11.5px;color:var(--text3);margin-inline-start:auto;white-space:nowrap;}
.mw-c-cust{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:700;color:var(--text2);min-width:0;}
.mw-c-cust i{font-size:15px;color:var(--text3);flex:0 0 auto;}
.mw-c-cust span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.mw-c-meta{display:flex;align-items:center;gap:7px;flex-wrap:wrap;}
.mw-tag{display:inline-flex;align-items:center;gap:5px;height:26px;padding:0 9px;border-radius:20px;
  background:var(--bg2);color:var(--text2);font-size:11.5px;font-weight:700;}
.mw-tag i{font-size:14px;}
.mw-tag.total{background:var(--gold-soft);color:var(--gold2);font-family:var(--font-en);font-weight:800;}
.mw-c-bot{display:flex;align-items:center;gap:9px;}
.mw-thumbs{display:flex;align-items:center;}
.mw-thumb{width:36px;height:36px;border-radius:10px;border:2px solid var(--card);background:var(--bg3) center/cover no-repeat;
  display:flex;align-items:center;justify-content:center;color:var(--text3);font-size:16px;margin-inline-start:-8px;}
.mw-thumb:first-child{margin-inline-start:0;}
.mw-thumb.more{background:var(--ink);color:#F5F0E4;font-family:var(--font-en);font-size:11px;font-weight:800;}
.mw-c-status{margin-inline-start:auto;display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 11px;
  border-radius:20px;font-size:11.5px;font-weight:800;}
.st-pending{background:var(--gold-soft);color:var(--gold2);}
.st-preparing{background:rgba(224,163,46,.14);color:#8A6410;}
.st-ready{background:rgba(46,158,91,.13);color:#1F7A45;}
.st-driver{background:rgba(62,123,182,.13);color:#2C5C8C;}
.st-scheduled{background:var(--bg3);color:var(--text2);}
.st-done{background:rgba(46,158,91,.10);color:#2E7D32;}
.st-cancelled{background:rgba(217,83,79,.12);color:#A63A36;}
/* countdown placeholder — no timing logic in Phase 1 */
.mw-cd{display:inline-flex;align-items:center;gap:5px;height:26px;padding:0 9px;border-radius:20px;
  background:rgba(217,83,79,.09);color:#A63A36;font-family:var(--font-en);font-size:11.5px;font-weight:800;}
.mw-cd i{font-size:14px;}

/* ---------- drawer ---------- */
.mw-dr-h{position:sticky;top:0;z-index:2;background:var(--card);border-bottom:1px solid var(--border);
  padding:14px 16px;display:flex;align-items:center;gap:10px;}
.mw-dr-h b{font-family:var(--font-en);font-size:15px;font-weight:800;color:var(--ink);}
.mw-dr-x{width:38px;height:38px;border-radius:11px;border:1px solid var(--border);background:var(--card);
  color:var(--text2);font-size:18px;cursor:pointer;margin-inline-start:auto;display:none;align-items:center;justify-content:center;}
.mw-dr-b{padding:14px 16px 40px;}
.mw-sec{margin-bottom:18px;}
.mw-sec-h{display:flex;align-items:center;gap:7px;font-size:12px;font-weight:800;color:var(--text3);
  letter-spacing:.4px;margin-bottom:9px;text-transform:uppercase;}
.mw-sec-h i{font-size:15px;color:var(--gold2);}
.mw-kv{display:flex;align-items:flex-start;gap:10px;padding:8px 0;border-bottom:1px solid var(--border);font-size:13px;}
.mw-kv:last-child{border-bottom:none;}
.mw-kv dt{color:var(--text3);flex:0 0 42%;font-size:12.5px;}
.mw-kv dd{margin:0;color:var(--ink);font-weight:700;flex:1;min-width:0;word-break:break-word;}
.mw-kv dd.num{font-family:var(--font-en);}
.mw-none{color:var(--text3);font-weight:500;font-style:italic;font-size:12.5px;}
.mw-note{background:var(--bg);border:1px solid var(--border);border-radius:12px;padding:11px 13px;
  font-size:12.5px;line-height:1.8;color:var(--text2);}

/* product cards inside the drawer + focus mode */
.mw-p{display:flex;gap:11px;padding:11px;border:1px solid var(--border);border-radius:14px;background:var(--card);
  margin-bottom:9px;}
.mw-p-img{width:58px;height:58px;flex:0 0 auto;border-radius:12px;background:var(--bg3) center/cover no-repeat;
  border:0;padding:0;cursor:zoom-in;display:flex;align-items:center;justify-content:center;color:var(--text3);font-size:23px;}
.mw-p-img:focus-visible{outline:2px solid var(--gold);outline-offset:2px;}
.mw-p-b{flex:1;min-width:0;}
.mw-p-n{font-size:13.5px;font-weight:700;color:var(--ink);line-height:1.45;}
.mw-p-opts{display:flex;flex-wrap:wrap;gap:6px;margin-top:7px;}
.mw-opt{display:inline-flex;align-items:center;gap:5px;height:24px;padding:0 8px;border-radius:8px;
  background:var(--bg2);font-size:11.5px;font-weight:700;color:var(--text2);}
.mw-opt b{color:var(--ink);}
.mw-opt .sw{width:11px;height:11px;border-radius:50%;border:1px solid var(--border2);}
.mw-qty{background:var(--ink);color:#F5F0E4;font-family:var(--font-en);}
.mw-mod{background:rgba(224,163,46,.16);color:#8A6410;}
.mw-p-note{margin-top:8px;font-size:12px;color:var(--text2);background:var(--bg);border-radius:9px;padding:7px 9px;
  line-height:1.7;}

/* timeline */
.mw-tl{position:relative;padding-inline-start:20px;}
.mw-tl::before{content:"";position:absolute;inset-inline-start:5px;top:6px;bottom:6px;width:2px;background:var(--border);}
.mw-tl-i{position:relative;padding:7px 0;font-size:12.5px;}
.mw-tl-i::before{content:"";position:absolute;inset-inline-start:-19px;top:12px;width:12px;height:12px;border-radius:50%;
  background:var(--card);border:2px solid var(--border2);}
.mw-tl-i.done::before{background:var(--green);border-color:var(--green);}
.mw-tl-i.active::before{background:var(--gold);border-color:var(--gold);}
.mw-tl-i.cancel::before{background:var(--red);border-color:var(--red);}
.mw-tl-i b{display:block;font-weight:700;color:var(--ink);}
.mw-tl-i span{font-size:11.5px;color:var(--text3);}

/* invoice */
.mw-inv{background:var(--bg);border:1px solid var(--border);border-radius:14px;padding:12px 14px;}
.mw-inv-r{display:flex;justify-content:space-between;gap:12px;padding:6px 0;font-size:12.5px;color:var(--text2);}
.mw-inv-r span:last-child{font-family:var(--font-en);font-weight:700;color:var(--ink);}
.mw-inv-r.tot{border-top:1px solid var(--border2);margin-top:6px;padding-top:10px;font-size:14px;font-weight:800;color:var(--ink);}
.mw-inv-r.tot span:last-child{font-size:16px;font-weight:800;color:var(--gold2);}
.mw-inv-r.disc span:last-child{color:var(--green);}

/* drawer empty state */
.mw-dr-empty{padding:60px 26px;text-align:center;color:var(--text3);}
.mw-dr-empty i{font-size:42px;color:var(--border2);display:block;margin-bottom:12px;}
.mw-dr-empty b{display:block;font-size:14px;color:var(--text2);margin-bottom:5px;}
.mw-dr-empty span{font-size:12.5px;line-height:1.7;}

/* ---------- focus mode ---------- */
.mw-focus{position:fixed;inset:0;z-index:80;background:var(--bg);display:none;flex-direction:column;}
.mw-focus.show{display:flex;}
body.mw-focused{overflow:hidden;}
.mw-f-head{background:var(--card);border-bottom:1px solid var(--border);padding:12px clamp(14px,3vw,26px);
  display:flex;align-items:center;gap:12px;flex-wrap:wrap;}
.mw-f-head b{font-family:var(--font-en);font-size:17px;font-weight:800;color:var(--ink);}
.mw-f-x{margin-inline-start:auto;height:44px;padding:0 16px;border-radius:30px;border:1px solid var(--border2);
  background:var(--card);color:var(--text2);font-family:inherit;font-size:13px;font-weight:700;cursor:pointer;
  display:inline-flex;align-items:center;gap:7px;}
.mw-f-x:hover{border-color:var(--gold);color:var(--gold2);}
.mw-f-body{flex:1;overflow:auto;padding:18px clamp(14px,3vw,26px) 40px;}
.mw-f-grid{max-width:1100px;margin:0 auto;display:grid;grid-template-columns:minmax(0,1.55fr) minmax(0,1fr);gap:18px;align-items:start;}
.mw-panel{background:var(--card);border:1px solid var(--border);border-radius:18px;padding:16px;}
.mw-panel + .mw-panel{margin-top:14px;}
/* checklist placeholder — no logic in Phase 1 */
.mw-check{display:flex;align-items:center;gap:11px;padding:11px;border:1px solid var(--border);border-radius:12px;
  margin-bottom:8px;background:var(--bg);}
.mw-check .box{width:22px;height:22px;flex:0 0 auto;border-radius:7px;border:2px solid var(--border2);background:var(--card);}
.mw-check span{font-size:13px;color:var(--text2);}

/* ---------- overlays: panels, menus, dialogs, zoom ---------- */
.mw-pop{position:fixed;inset:0;z-index:90;display:none;}
.mw-pop.show{display:block;}
.mw-pop-back{position:absolute;inset:0;background:rgba(20,16,8,.4);}
.mw-pop-card{position:absolute;top:66px;inset-inline-end:clamp(14px,2.2vw,24px);width:min(360px,calc(100vw - 28px));
  max-height:min(70vh,520px);overflow:auto;background:var(--card);border:1px solid var(--border);border-radius:18px;
  box-shadow:0 28px 60px -28px rgba(20,16,8,.55);}
.mw-pop-h{position:sticky;top:0;background:var(--card);border-bottom:1px solid var(--border);padding:13px 15px;
  display:flex;align-items:center;gap:9px;font-size:14px;font-weight:800;color:var(--ink);}
.mw-pop-h i{color:var(--gold2);font-size:18px;}
.mw-n{display:flex;gap:11px;padding:12px 15px;border-bottom:1px solid var(--border);}
.mw-n:last-child{border-bottom:none;}
.mw-n-ic{width:36px;height:36px;flex:0 0 auto;border-radius:11px;background:var(--gold-soft);color:var(--gold2);
  display:flex;align-items:center;justify-content:center;font-size:17px;}
.mw-n-b{min-width:0;font-size:12.5px;line-height:1.6;color:var(--text2);}
.mw-n-b b{display:block;color:var(--ink);font-size:13px;}
.mw-n-b span{font-size:11px;color:var(--text3);}
.mw-menu-i{display:flex;align-items:center;gap:11px;width:100%;padding:12px 15px;border:0;background:transparent;
  font-family:inherit;font-size:13.5px;color:var(--text2);cursor:pointer;text-align:start;text-decoration:none;
  border-bottom:1px solid var(--border);}
.mw-menu-i:last-child{border-bottom:none;}
.mw-menu-i:hover{background:var(--bg);color:var(--ink);}
.mw-menu-i i{font-size:19px;color:var(--text3);}
.mw-menu-i.danger{color:var(--red);} .mw-menu-i.danger i{color:var(--red);}

.mw-dlg{position:fixed;inset:0;z-index:95;display:none;align-items:center;justify-content:center;padding:18px;
  background:rgba(20,16,8,.5);}
.mw-dlg.show{display:flex;}
.mw-dlg-c{width:100%;max-width:420px;background:var(--card);border:1px solid var(--border);border-radius:20px;padding:22px;}
.mw-dlg-c h3{font-family:var(--font-display);font-size:19px;font-weight:800;color:var(--ink);margin-bottom:6px;}
.mw-dlg-c p{font-size:13px;line-height:1.75;color:var(--text2);margin-bottom:16px;}
.mw-eta{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px;}
.mw-eta-b{flex:1 1 96px;min-height:48px;border-radius:13px;border:1.5px solid var(--border2);background:var(--card);
  font-family:var(--font-en);font-size:13.5px;font-weight:800;color:var(--text2);cursor:pointer;transition:all .18s;}
.mw-eta-b:hover{border-color:var(--gold);color:var(--gold2);}
.mw-eta-b.on{background:var(--ink);border-color:var(--ink);color:#F5F0E4;}
.mw-dlg-f{display:flex;gap:9px;}
.mw-dlg-f button{flex:1;min-height:46px;border-radius:30px;font-family:inherit;font-size:14px;font-weight:700;cursor:pointer;
  border:1px solid transparent;}
.mw-btn-ghost{background:var(--card);color:var(--text2);border-color:var(--border2);}
.mw-btn-gold{background:var(--gold);color:#1C1606;border-color:var(--gold2);}

.mw-zoom{position:fixed;inset:0;z-index:100;display:none;align-items:center;justify-content:center;padding:24px;
  background:rgba(10,8,4,.86);}
.mw-zoom.show{display:flex;}
.mw-zoom img{max-width:min(620px,92vw);max-height:82vh;border-radius:18px;background:var(--card);}
.mw-zoom-x{position:absolute;top:18px;inset-inline-end:18px;width:46px;height:46px;border-radius:50%;border:0;
  background:rgba(255,255,255,.14);color:#fff;font-size:22px;cursor:pointer;}
.mw-zoom-cap{position:absolute;bottom:24px;inset-inline:24px;text-align:center;color:#EDE8DC;font-size:13px;}

/* ---------- PHASE 2.1 · processing ---------- */
/* merchant action bar */
.mw-acts{display:flex;gap:9px;margin-top:6px;}
.mw-act{flex:1;min-height:52px;border-radius:14px;border:1px solid transparent;font-family:inherit;font-size:14.5px;
  font-weight:800;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:all .18s;}
.mw-act i{font-size:19px;}
.mw-act-accept{background:var(--ink);color:#F5F0E4;border-color:var(--ink);}
.mw-act-accept:hover:not(:disabled){background:#241F17;}
.mw-act-reject{background:var(--card);color:var(--red);border-color:var(--border2);flex:0 0 auto;padding:0 18px;}
.mw-act-reject:hover:not(:disabled){border-color:var(--red);background:rgba(217,83,79,.07);}
.mw-act-ready{background:var(--green);color:#fff;border-color:#25834A;}
.mw-act-ready:hover:not(:disabled){background:#25834A;}
.mw-act:disabled{opacity:.45;cursor:not-allowed;}
.mw-act:focus-visible{outline:2px solid var(--gold);outline-offset:2px;}

/* undo bar — replaces confirmation dialogs */
.mw-undo{display:flex;align-items:center;gap:11px;margin-top:10px;padding:11px 13px;border-radius:14px;
  background:var(--ink);color:#F5F0E4;}
.mw-undo-ring{position:relative;width:30px;height:30px;flex:0 0 auto;}
.mw-undo-ring svg{transform:rotate(-90deg);}
.mw-undo-ring .trk{stroke:rgba(255,255,255,.18);}
.mw-undo-ring .bar{stroke:var(--gold);stroke-linecap:round;}
.mw-undo-ring b{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  font-family:var(--font-en);font-size:11px;font-weight:800;}
.mw-undo-t{flex:1;min-width:0;font-size:12.5px;line-height:1.5;}
.mw-undo-t b{display:block;font-size:13px;}
.mw-undo-b{min-height:40px;padding:0 15px;border-radius:30px;border:1px solid rgba(255,255,255,.3);
  background:transparent;color:#F5F0E4;font-family:inherit;font-size:13px;font-weight:800;cursor:pointer;
  display:inline-flex;align-items:center;gap:6px;}
.mw-undo-b:hover{background:rgba(255,255,255,.12);}

/* lock banner */
.mw-lock{display:flex;align-items:center;gap:10px;padding:11px 13px;border-radius:13px;margin-bottom:12px;
  background:rgba(224,163,46,.12);border:1px solid rgba(224,163,46,.4);font-size:12.5px;color:#7A5A10;line-height:1.6;}
.mw-lock i{font-size:19px;flex:0 0 auto;}
.mw-lock b{font-weight:800;}
.mw-lock-btn{margin-inline-start:auto;min-height:38px;padding:0 13px;border-radius:30px;border:1px solid rgba(224,163,46,.6);
  background:var(--card);color:#7A5A10;font-family:inherit;font-size:12px;font-weight:800;cursor:pointer;white-space:nowrap;}
.mw-lock-btn:hover{background:rgba(224,163,46,.16);}
.mw-card.locked{border-inline-start:3px solid #E0A32E;}

/* pending timeout warning */
.mw-card.warn{border-color:var(--red);box-shadow:0 0 0 3px rgba(217,83,79,.12);}
.mw-cd.warn{background:var(--red);color:#fff;animation:mw-pulse 1.4s ease-in-out infinite;}
@keyframes mw-pulse{0%,100%{opacity:1}50%{opacity:.55}}
@media(prefers-reduced-motion:reduce){.mw-cd.warn{animation:none;}}

/* checklist (active) */
.mw-check{cursor:pointer;transition:border-color .16s,background .16s;}
.mw-check:hover{border-color:var(--gold);}
.mw-check.on{background:rgba(46,158,91,.08);border-color:rgba(46,158,91,.42);}
.mw-check.on .box{background:var(--green);border-color:var(--green);color:#fff;display:flex;align-items:center;
  justify-content:center;font-size:14px;}
.mw-check.on span{color:var(--text3);text-decoration:line-through;}
.mw-check[aria-disabled="true"]{opacity:.55;cursor:not-allowed;}

/* notification centre */
.mw-n{cursor:pointer;text-align:start;width:100%;border:0;border-bottom:1px solid var(--border);background:transparent;
  font-family:inherit;}
.mw-n:hover{background:var(--bg);}
.mw-n.unread{background:rgba(201,168,76,.06);}
.mw-n.unread .mw-n-b b::after{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;
  background:var(--gold);margin-inline-start:7px;vertical-align:middle;}
.mw-n-ic.warn{background:rgba(217,83,79,.12);color:var(--red);}
.mw-pop-h .mw-n-clear{margin-inline-start:auto;border:0;background:transparent;color:var(--gold2);font-family:inherit;
  font-size:12px;font-weight:700;cursor:pointer;}
.mw-hbtn .dot{display:none;}
.mw-hbtn .dot.show{display:block;}
.mw-hbtn .count{position:absolute;top:4px;inset-inline-end:4px;min-width:18px;height:18px;padding:0 4px;border-radius:20px;
  background:var(--red);color:#fff;font-family:var(--font-en);font-size:10.5px;font-weight:800;display:none;
  align-items:center;justify-content:center;border:2px solid var(--card);}
.mw-hbtn .count.show{display:flex;}

/* read-only state for non-holders */
.mw-readonly{font-size:12px;color:var(--text3);text-align:center;padding:10px;}

/* The merchant's actions are the point of the screen, so they stay in reach
   instead of sitting below seven sections of detail. */
.mw-actbar{position:sticky;bottom:0;z-index:3;background:var(--card);margin:14px -16px -40px;
  padding:12px 16px calc(14px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--border);}
.mw-panel .mw-actbar{position:static;margin:0;padding:0;border-top:0;background:transparent;}

/* ---------- missing-data notice (explicit, never inferred) ---------- */
.mw-gate{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:30px;}
.mw-gate-c{max-width:480px;text-align:center;background:var(--card);border:1px solid var(--border);border-radius:22px;padding:36px 30px;}
.mw-gate-c i{font-size:40px;color:var(--gold2);}
.mw-gate-c h1{font-family:var(--font-display);font-size:21px;font-weight:800;color:var(--ink);margin:14px 0 10px;}
.mw-gate-c p{font-size:13.5px;line-height:1.85;color:var(--text2);}

/* ---------- responsive ---------- */
@media(max-width:1080px){
  .mw-split{grid-template-columns:minmax(0,1fr) minmax(320px,360px);}
  .mw-cards{grid-template-columns:1fr;}
}
@media(max-width:880px){
  .mw-split{grid-template-columns:1fr;}
  /* drawer becomes a bottom sheet */
  .mw-side{position:fixed;inset:auto 0 0 0;top:auto;height:min(88vh,760px);width:100%;z-index:70;
    border:1px solid var(--border);border-radius:22px 22px 0 0;transform:translateY(100%);
    transition:transform .28s cubic-bezier(.22,.61,.36,1);box-shadow:0 -20px 50px -26px rgba(20,16,8,.5);}
  .mw-side.open{transform:none;}
  .mw-dr-x{display:flex;}
  .mw-sheet-back{position:fixed;inset:0;z-index:69;background:rgba(20,16,8,.4);display:none;}
  .mw-sheet-back.show{display:block;}
  .mw-f-grid{grid-template-columns:1fr;}
  .mw-head{gap:10px;}
  .mw-ops{width:100%;order:5;}
  .mw-prof-n{display:none;}
  .mw-prof{padding:0 10px;}
}
@media(max-width:600px){
  .mw-rail{position:fixed;inset:auto 0 0 0;top:auto;width:100%;height:64px;flex-direction:row;justify-content:space-around;
    padding:0 6px;padding-bottom:env(safe-area-inset-bottom,0px);height:calc(64px + env(safe-area-inset-bottom,0px));}
  .mw-rail-logo,.mw-rail-sp{display:none;}
  .mw{flex-direction:column;}
  .mw-main{padding-bottom:74px;}
  .mw-list{padding:14px 14px 30px;}
  .mw-store-logo{width:38px;height:38px;font-size:18px;}
  .mw-store-t b{font-size:15px;}
  .mw-pop-card{top:auto;bottom:0;inset-inline:0;width:100%;max-height:78vh;border-radius:22px 22px 0 0;}
}
@media(prefers-reduced-motion:reduce){
  .mw-side{transition:none;}
  .mw-card{transition:none;}
}
</style>
</head>
<body>

<!-- Missing-data gate: shown when the signed-in account has no store link.
     Never guesses a store — see RAFPerm.storeLinkOf(). -->
<div class="mw-gate" id="gate" style="display:none;">
  <div class="mw-gate-c">
    <i class="ti ti-building-store"></i>
    <h1 id="gateT"></h1>
    <p id="gateP"></p>
  </div>
</div>

<div class="mw" id="shell" style="display:none;">

  <!-- TEMPORARY NAVIGATION PLACEHOLDER.
       Not a designed navigation. It holds the Orders slot only so Focus Mode
       has a sidebar to hide. The real Merchant Workspace navigation is to be
       designed later — do not expand this. -->
  <aside class="mw-rail" id="rail">
    <a class="mw-rail-logo" href="raf_homepage.html" aria-label="RAF">رف</a>
    <button class="mw-rail-b on" aria-current="page"><i class="ti ti-clipboard-list"></i><span data-ar="الطلبات" data-en="Orders">الطلبات</span></button>
    <div class="mw-rail-sp"></div>
  </aside>

  <div class="mw-main">

    <!-- HEADER — store, operational banner, notifications, profile. No stats. -->
    <header class="mw-head">
      <div class="mw-store">
        <div class="mw-store-logo" id="stLogo"><i class="ti ti-building-store"></i></div>
        <div class="mw-store-t">
          <b id="stName">—</b>
          <span id="stSub" data-ar="مساحة عمل الطلبات" data-en="Orders workspace">مساحة عمل الطلبات</span>
        </div>
      </div>

      <!-- OPERATIONAL BANNER — one action only: edit expected preparation time -->
      <div class="mw-ops" id="ops" data-load="normal">
        <span class="mw-ops-dot"></span>
        <div class="mw-ops-t">
          <b id="opsLabel">—</b>
          <span data-ar="وقت التجهيز المتوقع:" data-en="Expected preparation time:">وقت التجهيز المتوقع:</span>
          <span><em id="opsEta">—</em></span>
        </div>
        <button class="mw-ops-edit" onclick="openEta()">

        <i class="ti ti-chevron-down" style="font-size:15px;color:var(--text3);"></i>
      </button>

    <!-- SPLIT WORKSPACE -->
    <div class="mw-split">

      <!-- ORDERS LIST -->
      <section class="mw-list">
        <div class="mw-search">
          <i class="ti ti-search"></i>
          <input id="q" type="search" autocomplete="off"
                 data-ar-ph="ابحث في الطلبات…" data-en-ph="Search orders…" placeholder="ابحث في الطلبات…">
        </div>
        <div class="mw-search-hint"
             data-ar="رقم الطلب · اسم العميل · رقم الهاتف · اسم المنتج · SKU · الباركود"
             data-en="Order number · customer name · phone · product name · SKU · barcode">رقم الطلب · اسم العميل · رقم الهاتف · اسم المنتج · SKU · الباركود</div>

        <div class="mw-chips" id="chips" role="group"></div>

      </section>

      <!-- ORDER DETAILS DRAWER — never navigates away -->
      <aside class="mw-side" id="drawer" aria-label="Order details">
        <div class="mw-dr-h">
          <b id="drNo" data-ar="تفاصيل الطلب" data-en="Order details">تفاصيل الطلب</b>
          <button class="mw-dr-x" onclick="closeDrawer()" aria-label="close"><i class="ti ti-x"></i></button>
        </div>
        <div class="mw-dr-b" id="drBody"></div>
      </aside>

  </div>
</div>

<div class="mw-sheet-back" id="sheetBack" onclick="closeDrawer()"></div>

<!-- FOCUS MODE — hides rail, list and header chrome -->
<div class="mw-focus" id="focus" role="dialog" aria-modal="true">
  <div class="mw-f-head">
    <i class="ti ti-focus-2" style="font-size:22px;color:var(--gold2);"></i>
    <b id="fcNo">—</b>
    <span style="font-size:12.5px;color:var(--text3);" data-ar="وضع التركيز" data-en="Focus mode">وضع التركيز</span>
    <button class="mw-f-x" onclick="closeFocus()">
      <i class="ti ti-x"></i> <span data-ar="إنهاء التركيز" data-en="Exit focus">إنهاء التركيز</span>

</div>

<!-- NOTIFICATIONS PANEL (UI only) -->
<div class="mw-pop" id="notifPop">
  <div class="mw-pop-back" onclick="closePop()"></div>
  <div class="mw-pop-card" role="dialog" aria-label="Notifications">
    <div class="mw-pop-h"><i class="ti ti-bell"></i> <span data-ar="الإشعارات" data-en="Notifications">الإشعارات</span>
      <button class="mw-n-clear" onclick="markAllRead()" data-ar="تعليم الكل كمقروء" data-en="Mark all read">تعليم الكل كمقروء</button>

  <div class="mw-pop-card" role="menu" aria-label="Merchant menu">
    <div class="mw-pop-h"><i class="ti ti-user-circle"></i> <span id="profFull">—</span></div>
    <button class="mw-menu-i" onclick="toggleLang()"><i class="ti ti-language"></i>
      <span data-ar="English" data-en="العربية">English</span></button>
    <a class="mw-menu-i" href="raf_homepage.html"><i class="ti ti-external-link"></i>
      <span data-ar="عرض المتجر كعميل" data-en="View store as customer">عرض المتجر كعميل</span></a>
    <a class="mw-menu-i danger" href="raf_login.html"><i class="ti ti-logout"></i>

<!-- EXPECTED PREPARATION TIME (UI only — business logic comes later) -->

    <h3 data-ar="وقت التجهيز المتوقع" data-en="Expected preparation time">وقت التجهيز المتوقع</h3>
    <p data-ar="هذا الوقت يظهر للعملاء عند الطلبات الجديدة فقط."
       data-en="This is shown to customers on new incoming orders only.">هذا الوقت يظهر للعملاء عند الطلبات الجديدة فقط.</p>

    <div class="mw-dlg-f">
      <button class="mw-btn-ghost" onclick="closeEta()" data-ar="إلغاء" data-en="Cancel">إلغاء</button>

<!-- IMAGE ZOOM — no navigation -->

<script>
/* ══════════════════════════════════════════════════════════════
   MERCHANT WORKSPACE — ORDERS  ·  PHASE 1: INTERFACE ONLY
   ------------------------------------------------------------
   Reads from the existing systems and renders. It deliberately
   implements NO workflow: no accept/reject/ready, no locking,
   no undo, no countdown timing, no checklist behaviour, no
   workload rules, no scheduling, no validation.

   Data sources (read-only here):
     RAFPerm        — signed-in merchant and the canonical store link
     RAFShop.Orders — the orders themselves
     RAFCatalog     — product imagery and option data for order lines
     RAFOrderEngine — whether an order is still awaiting a decision
   ══════════════════════════════════════════════════════════════ */
(function(){
  'use strict';

  function root(){ return document.getElementById('htmlRoot'); }
  function isEn(){ return root().lang === 'en'; }
  function T(ar,en){ return isEn() ? en : ar; }
  function L(o){ return (o && typeof o === 'object') ? (isEn() ? (o.en||o.ar) : (o.ar||o.en)) : (o||''); }
  function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
  /* a field the data does not carry yet is shown as missing, never invented */
  function none(){ return '<span class="mw-none">'+T('غير مسجَّل','Not recorded')+'</span>'; }

  var STORE = null, STORE_SLUG = null, ORDERS = [], selected = null;
  var E = window.RAFOrderEngine, ME = null;

  /* ---------- session recovery ----------
     The workspace remembers exactly where the merchant was, so a refresh,
     an emergency update or a crash never costs them their place. */
  var SKEY = 'raf_merchant_session';
  var SESSION = { selected:null, drawerOpen:false, focus:false, scrollY:0, q:'', chips:[] };
  function loadSession(){
    try { var s = JSON.parse(localStorage.getItem(SKEY)); if (s && typeof s === 'object') SESSION = Object.assign(SESSION, s); }
    catch(e){}
  }
  function saveSession(){
    SESSION.selected   = selected;
    SESSION.drawerOpen = document.getElementById('drawer').classList.contains('open');
    SESSION.focus      = document.getElementById('focus').classList.contains('show');
    SESSION.scrollY    = window.scrollY || 0;
    SESSION.q          = (document.getElementById('q')||{}).value || '';
    SESSION.chips      = [].slice.call(document.querySelectorAll('.mw-chip'))
                           .map(function(c,i){ return c.getAttribute('aria-pressed')==='true' ? i : -1; })
                           .filter(function(i){ return i > -1; });
    try { localStorage.setItem(SKEY, JSON.stringify(SESSION)); } catch(e){}
  }

  /* ---------- merchant notifications ----------
     Workspace-only. No push notifications. */
  var NKEY = 'raf_merchant_notifs', SEENKEY = 'raf_merchant_seen', WARNKEY = 'raf_merchant_warned';
  function notifs(){ try { var a = JSON.parse(localStorage.getItem(NKEY)); return Array.isArray(a)?a:[]; } catch(e){ return []; } }
  function writeNotifs(a){ try { localStorage.setItem(NKEY, JSON.stringify(a.slice(0,60))); } catch(e){} }
  function pushNotif(type, orderId){
    var a = notifs();
    if (a.some(function(n){ return n.type===type && n.orderId===orderId; })) return false;
    a.unshift({ id:type+'-'+orderId+'-'+Date.now(), type:type, orderId:orderId, ts:Date.now(), read:false });
    writeNotifs(a); return true;
  }
  function unreadCount(){ return notifs().filter(function(n){ return !n.read; }).length; }
  function readSet(key){ try { var a=JSON.parse(localStorage.getItem(key)); return Array.isArray(a)?a:[]; } catch(e){ return []; } }
  function writeSet(key,a){ try { localStorage.setItem(key, JSON.stringify(a.slice(-200))); } catch(e){} }

  /* ---------- notification sounds ----------
     Asset-based. The files under assets/sounds/ are placeholders and are
     meant to be swapped for the real recordings without touching this code.
     Playback failures are silent: a blocked or missing sound must never
     interrupt the merchant's work. */
  var SOUNDS = { new:'assets/sounds/new_order.wav', warn:'assets/sounds/warning.wav' };
  var audio = {};
  function primeSounds(){
    Object.keys(SOUNDS).forEach(function(k){
      if (audio[k]) return;
      try { var a = new Audio(SOUNDS[k]); a.preload = 'auto'; a.load(); audio[k] = a; } catch(e){}
    });
  }
  function beep(kind){
    var key = kind === 'warn' ? 'warn' : 'new';
    try {
      primeSounds();
      var a = audio[key];
      if (!a) return;
      a.currentTime = 0;
      var p = a.play();
      if (p && p.catch) p.catch(function(){});   /* autoplay policy — stay silent */
    } catch(e){}
  }

  /* ---------- queue order: fixed, presentational only ---------- */
  var QUEUE = [
    { k:'pending',   pip:'pip-pending',   st:'st-pending',   ar:'بانتظار القبول', en:'Pending acceptance' },
    { k:'preparing', pip:'pip-preparing', st:'st-preparing', ar:'قيد التجهيز',    en:'Preparing' },
    { k:'ready',     pip:'pip-ready',     st:'st-ready',     ar:'جاهز',           en:'Ready' },
    { k:'driver',    pip:'pip-driver',    st:'st-driver',    ar:'بانتظار السائق', en:'Waiting driver' },
    { k:'scheduled', pip:'pip-scheduled', st:'st-scheduled', ar:'مجدول',          en:'Scheduled' },
    { k:'done',      pip:'pip-done',      st:'st-done',      ar:'مكتمل',          en:'Completed' },
    { k:'cancelled', pip:'pip-cancelled', st:'st-cancelled', ar:'ملغي',           en:'Cancelled' }
  ];
  /* Queue placement now follows the merchant processing state held by the
     shared engine, falling back to the customer-facing order status. */
  function bucketOf(o){
    var m = E.mstate(o.id);
    if (m === E.MSTATE.WAITING_DRIVER) return 'driver';
    if (m === E.MSTATE.READY)          return 'ready';
    if (m === E.MSTATE.PREPARING || m === E.MSTATE.ACCEPTED) return 'preparing';
    if (m === 'rejected')              return 'cancelled';
    if (m === E.MSTATE.PENDING)        return 'pending';
    if (o.status === 'cancelled') return 'cancelled';
    if (o.status === 'delivered') return 'done';
    return 'preparing';
  }
  /* under a minute left on the acceptance window */
  function isWarning(o){
    var left = E.msLeft(o.id);
    return bucketOf(o) === 'pending' && left > 0 && left <= 60000;
  }
  function qdef(k){ return QUEUE.filter(function(g){ return g.k===k; })[0] || QUEUE[1]; }

  /* ---------- quick filter chips (UI only, no filtering logic) ---------- */
  var CHIPS = [
    { ic:'ti-calendar',       ar:'اليوم',            en:'Today' },
    { ic:'ti-clock-hour-4',   ar:'مجدولة',           en:'Scheduled' },
    { ic:'ti-truck-delivery', ar:'توصيل',            en:'Delivery' },
    { ic:'ti-building-store', ar:'استلام',           en:'Pickup' },
    { ic:'ti-cash',           ar:'نقداً',            en:'Cash' },
    { ic:'ti-credit-card',    ar:'كي نت',            en:'KNET' },
    { ic:'ti-pencil',         ar:'طلبات معدّلة',      en:'Modified orders' },
    { ic:'ti-note',           ar:'طلبات بها ملاحظات', en:'Orders with notes' }
  ];

  /* ---------- expected preparation time (display state only) ---------- */
  var ETA = [
    { k:'5-10',  load:'normal',   ar:'5–10 دقائق',  en:'5–10 minutes' },
    { k:'15-20', load:'moderate', ar:'15–20 دقيقة', en:'15–20 minutes' },
    { k:'20-30', load:'heavy',    ar:'20–30 دقيقة', en:'20–30 minutes' }
  ];
  var LOADS = {
    normal:   { ar:'المتجر يعمل بشكل طبيعي', en:'Store operating normally' },
    moderate: { ar:'ضغط متوسط',              en:'Moderate workload' },
    heavy:    { ar:'ضغط مرتفع',              en:'Heavy workload' }
  };
  var etaKey = '5-10', etaDraft = '5-10';
  function etaDef(k){ return ETA.filter(function(e){ return e.k===k; })[0] || ETA[0]; }

  /* ---------- store + identity ---------- */
  function resolveStore(){
    if (!window.RAFPerm) return { ok:false, reason:'unassigned' };
    return RAFPerm.storeLinkOf();
  }
  /* The store an order belongs to, resolved canonically: each order line
     carries its product id, and the product record in RAFSource carries the
     store slug. Display names are never consulted — an order whose lines
     cannot be resolved is not guessed at, it is simply unscopeable.
     (Phase 2 extends the order snapshot to carry storeSlug directly, which
     removes this join entirely.) */
  function slugOfOrder(o){
    var lines = o.items || [];
    for (var i = 0; i < lines.length; i++){
      if (!lines[i].id || !window.RAFSource) continue;
      var p = RAFSource.product(lines[i].id);
      if (p && p.store) return p.store;
    }
    return null;
  }
  function ordersForStore(slug){
    if (!window.RAFShop || !slug) return [];
    return RAFShop.Orders.all().filter(function(o){ return slugOfOrder(o) === slug; });
  }

  /* ---------- order card ---------- */
  function thumbsHTML(o){
    var items = o.items || [], shown = items.slice(0,3), extra = items.length - shown.length;
    var h = shown.map(function(it){
      var p = window.RAFCatalog ? RAFCatalog.get(it.id) : null;
      var img = p && p.img;
      return img
        ? '<span class="mw-thumb" style="background-image:url(\''+esc(img)+'\')"></span>'
        : '<span class="mw-thumb"><i class="ti '+esc(it.ic||'ti-box')+'"></i></span>';
    }).join('');
    if (extra > 0) h += '<span class="mw-thumb more">+'+extra+'</span>';
    return h;
  }
  function unitCount(o){
    return (o.items||[]).reduce(function(n,it){ return n + (it.qty||1); }, 0);
  }
  function cardHTML(o){
    var bucket = bucketOf(o), b = qdef(bucket);
    var isPending = bucket === 'pending', warn = isWarning(o);
    var lock = E.lockedByOther(o.id, ME);
    return '<button class="mw-card'+(selected===o.id?' on':'')+(warn?' warn':'')+(lock?' locked':'')
      + '" data-id="'+esc(o.id)+'" onclick="pick(\''+esc(o.id)+'\')">'

        + '<span class="mw-c-no">'+esc(o.id)+'</span>'

      + '</div>'
      + '<div class="mw-c-cust"><i class="ti ti-user"></i><span>'+none()+'</span></div>'

        + '<span class="mw-tag"><i class="ti ti-wallet"></i>'+esc(L(o.pay))+'</span>'

  /* ---------- queue render ---------- */
  function renderQueue(){
    var by = {}; QUEUE.forEach(function(g){ by[g.k] = []; });
    ORDERS.forEach(function(o){ (by[bucketOf(o)] || by.preparing).push(o); });

      var list = by[g.k];

  /* ---------- merchant actions · lock · undo ---------- */
  function lockBannerHTML(o){
    var lock = E.lockedByOther(o.id, ME);

                      RAFPerm.currentUser().roleId !== 'merchant_employee';
    return '<div class="mw-lock"><i class="ti ti-lock"></i><div>'
      + T('هذا الطلب قيد المعالجة حالياً بواسطة ','This order is currently being processed by ')
      + '<b>'+esc(lock.name)+'</b></div>'
      + (canOverride
          ? '<button class="mw-lock-btn" onclick="overrideLock(\''+esc(o.id)+'\')">'+T('تولّي المعالجة','Take over')+'</button>'
          : '')
      + '</div>';
  }
  function undoHTML(o){
    var u = E.undoOf(o.id);
    if (!u) return '';
    var left = E.undoMsLeft(o.id), secs = Math.ceil(left/1000);
    var frac = left / E.UNDO_MS, C = 75.4;
    var label = u.action === E.ACTION.ACCEPT ? T('تم قبول الطلب','Order accepted')
              : u.action === E.ACTION.REJECT ? T('تم رفض الطلب','Order rejected')
              : T('تم تعليم الطلب جاهزاً','Order marked ready');
    return '<div class="mw-undo">'
      + '<div class="mw-undo-ring"><svg width="30" height="30" viewBox="0 0 30 30">'
        + '<circle class="trk" cx="15" cy="15" r="12" fill="none" stroke-width="3"></circle>'
        + '<circle class="bar" cx="15" cy="15" r="12" fill="none" stroke-width="3" '
        + 'stroke-dasharray="'+C+'" stroke-dashoffset="'+(C*(1-frac))+'"></circle></svg><b>'+secs+'</b></div>'
      + '<div class="mw-undo-t"><b>'+label+'</b>'
        + T('يمكنك التراجع خلال المهلة.','You can undo within the countdown.')+'</div>'
      + '<button class="mw-undo-b" onclick="undoAction(\''+esc(o.id)+'\')">'
        + '<i class="ti ti-arrow-back-up"></i> '+T('تراجع','Undo')+'</button></div>';
  }
  function actionsHTML(o){
    return '<div class="mw-actbar">' + actionsInner(o) + '</div>';
  }
  function actionsInner(o){
    var html = undoHTML(o);
    if (E.undoOf(o.id)) return html;                 /* the undo bar is the state */

    var m = E.mstate(o.id);
    var mayProcess = E.canProcess(o.id, ME);

    if (E.merchantDone(o.id)){
      var doneLbl = m === 'rejected' ? T('تم رفض هذا الطلب','This order was rejected')
                  : T('انتهت مسؤولية المتجر — الطلب بانتظار السائق',
                      'Merchant work is complete — the order is waiting for a driver');
      return html + '<div class="mw-readonly">'+doneLbl+'</div>';
    }
    if (!mayProcess) return html + '<div class="mw-readonly">'+T('للقراءة فقط','Read only')+'</div>';

    if (m === E.MSTATE.PENDING){
      return html + '<div class="mw-acts">'
        + '<button class="mw-act mw-act-accept" onclick="doAccept(\''+esc(o.id)+'\')">'
          + '<i class="ti ti-check"></i> '+T('قبول','Accept')+'</button>'

          + '<i class="ti ti-x"></i> '+T('رفض','Reject')+'</button></div>';
    }
    if (m === E.MSTATE.PREPARING || m === E.MSTATE.ACCEPTED){
      return html + '<div class="mw-acts">'
        + '<button class="mw-act mw-act-ready" onclick="doReady(\''+esc(o.id)+'\')">'
          + '<i class="ti ti-package-export"></i> '+T('جاهز','Ready')+'</button></div>';
    }
    return html;
  }

  /* ---------- checklist ---------- */
  var CKEY = 'raf_merchant_checklist';
  function checklist(orderId){
    try { var a = JSON.parse(localStorage.getItem(CKEY)); return (a && a[orderId]) || {}; } catch(e){ return {}; }
  }
  function setChecklist(orderId, map){
    var a = {}; try { a = JSON.parse(localStorage.getItem(CKEY)) || {}; } catch(e){}
    a[orderId] = map;
    try { localStorage.setItem(CKEY, JSON.stringify(a)); } catch(e){}

  /* ---------- notification centre ---------- */
  function relTime(ts){
    var d = Math.floor((Date.now()-ts)/1000);
    if (d < 60)   return T('الآن','just now');
    if (d < 3600) return T('قبل '+Math.floor(d/60)+' د', Math.floor(d/60)+'m ago');
    if (d < 86400)return T('قبل '+Math.floor(d/3600)+' س', Math.floor(d/3600)+'h ago');
    return T('قبل '+Math.floor(d/86400)+' ي', Math.floor(d/86400)+'d ago');
  }
  function renderNotifs(){
    var list = notifs().filter(function(n){
      return ORDERS.some(function(o){ return o.id === n.orderId; });   /* store-scoped */
    });
    var box = document.getElementById('notifList');
    box.innerHTML = list.length ? list.map(function(n){
      var isWarn = n.type === 'timeout';
      return '<button class="mw-n'+(n.read?'':' unread')+'" onclick="openNotif(\''+esc(n.id)+'\',\''+esc(n.orderId)+'\')">'
        + '<div class="mw-n-ic'+(isWarn?' warn':'')+'"><i class="ti '+(isWarn?'ti-alert-triangle':'ti-shopping-bag-plus')+'"></i></div>'
        + '<div class="mw-n-b"><b>'+(isWarn?T('تحذير: قارب وقت القبول على الانتهاء','Acceptance window almost over')
                                           :T('طلب جديد','New order'))+'</b>'
        + esc(n.orderId)+'<br><span>'+relTime(n.ts)+'</span></div></button>';
    }).join('')
    : '<div class="mw-n"><div class="mw-n-ic"><i class="ti ti-bell"></i></div>'
      + '<div class="mw-n-b"><b>'+T('لا توجد إشعارات','No notifications')+'</b></div></div>';
    var n = list.filter(function(x){ return !x.read; }).length;
    var badge = document.getElementById('notifCount');
    badge.textContent = n > 9 ? '9+' : n;
    badge.classList.toggle('show', n > 0);
  }

  /* new orders and timeout warnings — sound, badge, centre, queue position */
  function scanNotifications(){
    var seen = readSet(SEENKEY), warned = readSet(WARNKEY);
    var newOnes = 0, warnings = 0;
    ORDERS.forEach(function(o){
      if (seen.indexOf(o.id) < 0){
        seen.push(o.id);
        /* only announce orders that actually need a decision */
        if (bucketOf(o) === 'pending' && pushNotif('new', o.id)) newOnes++;
      }
      if (isWarning(o) && warned.indexOf(o.id) < 0){
        warned.push(o.id);
        if (pushNotif('timeout', o.id)) warnings++;
      }
    });
    writeSet(SEENKEY, seen); writeSet(WARNKEY, warned);
    if (warnings) beep('warn');
    else if (newOnes) beep('new');
    return newOnes + warnings;
  }

  function renderOps(){
    var e = etaDef(etaKey);

    document.getElementById('opsEta').textContent = T(e.ar, e.en);

  function renderEtaRow(){
    document.getElementById('etaRow').innerHTML = ETA.map(function(e){
      return '<button class="mw-eta-b'+(etaDraft===e.k?' on':'')+'" onclick="pickEta(\''+e.k+'\')">'+T(e.ar,e.en)+'</button>';
    }).join('');
  }

  /* ---------- window-level handlers ---------- */
  window.pick = function(id){
    selected = id;
    /* opening an order claims it, if nobody else is already processing it */
    E.acquireLock(id, ME);
    renderQueue(); renderDrawer();
    if (window.matchMedia('(max-width:880px)').matches){
      document.getElementById('drawer').classList.add('open');
      document.getElementById('sheetBack').classList.add('show');
    }
    saveSession();
  };

  /* ---------- merchant actions ---------- */
  function afterAction(res){
    if (!res.ok) return;
    renderQueue(); renderDrawer();
    if (document.getElementById('focus').classList.contains('show')) renderFocus();
    saveSession();
  }
  window.doAccept = function(id){ afterAction(E.merchantAccept(id, ME)); };
  window.doReject = function(id){ afterAction(E.merchantReject(id, ME)); };
  window.doReady  = function(id){ afterAction(E.merchantReady(id, ME)); };
  window.undoAction = function(id){ E.undo(id); afterAction({ ok:true }); };
  window.overrideLock = function(id){
    /* managers and admins only; employees never see this control */
    if (!window.RAFPerm) return;
    var u = RAFPerm.currentUser();
    if (!u || u.roleId === 'merchant_employee') return;
    E.overrideLock(id, ME);
    renderQueue(); renderDrawer();
  };
  window.toggleCheck = function(orderId, key){
    var c = checklist(orderId);
    c[key] = !c[key];
    setChecklist(orderId, c);
    renderDrawer();
    if (document.getElementById('focus').classList.contains('show')) renderFocus();
  };
  window.openNotif = function(nid, orderId){
    var a = notifs();
    a.forEach(function(n){ if (n.id === nid) n.read = true; });
    writeNotifs(a);
    closePop();
    pick(orderId);                       /* deep-link into the order */
    renderNotifs();
  };
  window.markAllRead = function(){
    var a = notifs(); a.forEach(function(n){ n.read = true; }); writeNotifs(a); renderNotifs();
  };
  window.closeDrawer = function(){
    document.getElementById('drawer').classList.remove('open');
    document.getElementById('sheetBack').classList.remove('show');
  };
  window.openFocus = function(){
    if (!selected) return;
    renderFocus();
    document.getElementById('focus').classList.add('show');
    document.body.classList.add('mw-focused');
    closeDrawer();
    saveSession();
  };
  window.closeFocus = function(){
    document.getElementById('focus').classList.remove('show');
    document.body.classList.remove('mw-focused');
    /* orders that arrived during focus are shown normally now */
    refreshOrders();
    renderQueue(); renderDrawer();
    saveSession();
  };
  window.openPop  = function(id){ closePop(); document.getElementById(id).classList.add('show'); };
  window.closePop = function(){ ['notifPop','profPop'].forEach(function(i){ document.getElementById(i).classList.remove('show'); }); };
  window.openEta  = function(){ etaDraft = etaKey; renderEtaRow(); document.getElementById('etaDlg').classList.add('show'); };
  window.closeEta = function(){ document.getElementById('etaDlg').classList.remove('show'); };
  window.pickEta  = function(k){ etaDraft = k; renderEtaRow(); };
  window.saveEta  = function(){ etaKey = etaDraft; renderOps(); closeEta(); };  /* display only */
  window.toggleChip = function(btn){
    btn.setAttribute('aria-pressed', btn.getAttribute('aria-pressed') === 'true' ? 'false' : 'true');
    saveSession();
  };
  window.zoomImg = function(src, cap){
    document.getElementById('zoomImg').src = src;
    document.getElementById('zoomCap').textContent = cap || '';
    document.getElementById('zoom').classList.add('show');
  };
  window.closeZoom = function(){ document.getElementById('zoom').classList.remove('show'); };

  window.toggleLang = function(){
    var r = root(), en = r.lang === 'en';
    r.lang = en ? 'ar' : 'en'; r.dir = en ? 'rtl' : 'ltr';
    try { localStorage.setItem('raf_lang', r.lang); } catch(e){}
    applyLang(); paintAll();
  };
  function applyLang(){
    var en = isEn();
    document.querySelectorAll('[data-ar][data-en]').forEach(function(el){
      var t = el.getAttribute('data-'+(en?'en':'ar')); if (t!==null) el.textContent = t;
    });
    document.querySelectorAll('[data-ar-ph][data-en-ph]').forEach(function(el){
      el.placeholder = el.getAttribute('data-'+(en?'en':'ar')+'-ph');
    });
    document.title = en ? 'RAF — Orders' : 'رف — الطلبات';
  }

  function refreshOrders(){ ORDERS = ordersForStore(STORE_SLUG); }

  function paintAll(){
    renderChips(); renderOps(); renderQueue(); renderDrawer(); renderNotifs();
    if (document.getElementById('focus').classList.contains('show')) renderFocus();
  }

  /* ---------- the workspace tick ----------
     Drives countdowns, the undo window, lock heartbeats, new-order detection
     and the timeout warning. In Focus Mode nothing behind the overlay is
     repainted — a new order only plays its sound. */
  function tick(){
    var focused = document.getElementById('focus').classList.contains('show');
    refreshOrders();
    E.sweepLocks();
    E.sweepUndo();
    scanNotifications();
    if (focused){ renderFocus(); return; }   /* no banners, no dialogs, no interruption */
    renderQueue(); renderDrawer(); renderNotifs();
  }

  /* ---------- boot ---------- */
  function boot(){
    var l = null; try { l = localStorage.getItem('raf_lang'); } catch(e){}
    if (l === 'en'){ root().lang = 'en'; root().dir = 'ltr'; }
    applyLang();

    var link = resolveStore();
    if (!link.ok){
      /* missing data is reported, never papered over with another store */
      document.getElementById('gate').style.display = '';
      document.getElementById('gateT').textContent = link.reason === 'store_not_found'
        ? T('المتجر المرتبط غير موجود','Linked store not found')
        : T('لا يوجد متجر مرتبط بالحساب','No store linked to this account');
      document.getElementById('gateP').textContent = link.reason === 'store_not_found'
        ? T('هذا الحساب مرتبط بمتجر غير موجود في النظام. يرجى تصحيح الربط.',
            'This account points at a store that does not exist. The link needs correcting.')
        : T('لم يتم ربط هذا الحساب بمتجر بعد. يتم الربط يدوياً ولا يُخمَّن تلقائياً.',
            'This account has not been linked to a store yet. Links are set explicitly and never inferred.');
      return;
    }

    STORE = link.store;
    STORE_SLUG = link.slug;          /* the canonical scope key for every read */
    document.getElementById('shell').style.display = '';

    /* header identity */
    document.getElementById('stName').textContent = L(STORE.name);
    if (STORE.logo){
      var lg = document.getElementById('stLogo');
      lg.style.backgroundImage = "url('"+STORE.logo+"')"; lg.innerHTML = '';
    }
    var me = RAFPerm.currentUser();
    if (me){
      document.getElementById('profName').textContent = me.name;
      document.getElementById('profFull').textContent = me.name;
      document.getElementById('profAv').textContent = (me.name||'?').trim().charAt(0);
    }

    ME = me ? { id:me.id, name:me.name, roleId:me.roleId } : null;

    ORDERS = ordersForStore(STORE_SLUG);
    /* first pass seeds the seen-set without announcing history */
    if (!localStorage.getItem(SEENKEY)) writeSet(SEENKEY, ORDERS.map(function(o){ return o.id; }));
    scanNotifications();
    paintAll();

    /* ---- session recovery: put the merchant back exactly where they were ---- */
    loadSession();
    if (SESSION.q && document.getElementById('q')) document.getElementById('q').value = SESSION.q;
    (SESSION.chips||[]).forEach(function(i){
      var c = document.querySelectorAll('.mw-chip')[i];
      if (c) c.setAttribute('aria-pressed','true');
    });
    if (SESSION.selected && ORDERS.some(function(o){ return o.id === SESSION.selected; })){
      selected = SESSION.selected;
      E.acquireLock(selected, ME);        /* reclaim my own lock after a refresh */
      renderQueue(); renderDrawer();
      if (SESSION.drawerOpen && window.matchMedia('(max-width:880px)').matches){
        document.getElementById('drawer').classList.add('open');
        document.getElementById('sheetBack').classList.add('show');
      }
      if (SESSION.focus){
        renderFocus();
        document.getElementById('focus').classList.add('show');
        document.body.classList.add('mw-focused');
      }
    }
    if (SESSION.scrollY) setTimeout(function(){ window.scrollTo(0, SESSION.scrollY); }, 30);

    /* ---- heartbeat: keeps my lock alive; silence for 60s releases it ---- */
    setInterval(function(){ if (selected) E.heartbeat(selected, ME); }, E.LOCK_HEARTBEAT_MS);
    setInterval(tick, 1000);
    E.watch(function(){ if (!document.getElementById('focus').classList.contains('show')) { renderQueue(); renderDrawer(); } });
    window.addEventListener('scroll', function(){ SESSION.scrollY = window.scrollY; }, { passive:true });
    window.addEventListener('beforeunload', saveSession);
    var qEl = document.getElementById('q'); if (qEl) qEl.addEventListener('input', saveSession);

    /* browsers only allow playback after a gesture — prime on the first one */
    ['pointerdown','keydown'].forEach(function(ev){
      document.addEventListener(ev, primeSounds, { once:true });
    });

    /* existing permission layer, unchanged */
    try { RAFPerm.enforce(); } catch(e){}

    document.addEventListener('keydown', function(e){
      if (e.key !== 'Escape') return;
      if (document.getElementById('zoom').classList.contains('show')) return closeZoom();
      if (document.getElementById('etaDlg').classList.contains('show')) return closeEta();
      if (document.getElementById('focus').classList.contains('show')) return closeFocus();
      closePop(); closeDrawer();
    });
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();
})();
</script>
</body>
</html>
