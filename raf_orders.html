<style>
/* one order = one row: number & store · date · products · count · total · status */
.or-row{display:grid;grid-template-columns:minmax(150px,1.3fr) minmax(120px,1fr) minmax(130px,1.2fr) 90px 120px minmax(140px,1fr) 24px;align-items:center;gap:18px;min-height:84px;padding:14px 4px;border-bottom:1px solid #ECE6DA;color:#15130F;text-decoration:none;cursor:pointer;transition:background .15s;}
.or-row:hover{background:rgba(201,168,76,.06);}
.or-row:focus-visible{outline:2px solid #C9A84C;outline-offset:-2px;}
.or-id b{display:block;font-family:'DM Sans',sans-serif;font-size:15px;font-weight:800;}
.or-id span{display:block;font-size:13px;color:#5A5650;margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.or-date{font-size:13.5px;color:#5A5650;}
.or-th{display:flex;align-items:center;gap:6px;}
.or-th .t{width:42px;height:42px;border-radius:10px;background:#F1ECE2 center/cover no-repeat;display:flex;align-items:center;justify-content:center;color:#A07828;font-size:18px;flex-shrink:0;border:1px solid #ECE6DA;}
.or-th .more{font-family:'DM Sans',sans-serif;font-size:12.5px;font-weight:800;color:#5A5650;}
.or-cnt{font-size:13.5px;color:#5A5650;}
.or-tot{font-family:'DM Sans',sans-serif;font-size:16px;font-weight:800;}
.or-tot small{font-family:'Tajawal',sans-serif;font-size:12px;color:#8A857C;font-weight:600;}
.or-st{display:flex;flex-direction:column;align-items:flex-start;gap:6px;}
.or-rate{font-size:12.5px;font-weight:800;color:#A07828;text-decoration:none;display:inline-flex;align-items:center;gap:4px;}
.or-rate:hover{color:#15130F;}
.or-go{font-size:18px;color:#B5AE9F;}
html[dir="ltr"] .or-go{transform:scaleX(-1);}
.or-headrow{display:grid;grid-template-columns:minmax(150px,1.3fr) minmax(120px,1fr) minmax(130px,1.2fr) 90px 120px minmax(140px,1fr) 24px;gap:18px;padding:12px 4px 8px;font-size:12.5px;font-weight:800;color:#8A857C;border-bottom:1px solid #E8E1D3;}
@media(max-width:900px){
  .or-headrow{display:none;}
  .or-row{grid-template-columns:minmax(0,1fr) auto 18px;grid-template-areas:"id st go" "date tot go" "th cnt go";gap:6px 12px;padding:16px 2px;}
  .or-id{grid-area:id;} .or-st{grid-area:st;align-items:flex-end;} .or-go{grid-area:go;align-self:center;}
  .or-date{grid-area:date;font-size:12.5px;} .or-tot{grid-area:tot;text-align:end;}
  .or-th{grid-area:th;margin-top:4px;} .or-cnt{grid-area:cnt;text-align:end;align-self:end;font-size:12.5px;}
}
</style>

<script src="raf_active_order.js"></script>
<script>
/* My Orders — the signed-in customer's own orders (RAFShop.Orders.mine),
   newest first by their checkout time. A row opens the existing flow: live
   tracking for an order in progress, Order Details otherwise. */
(function(){
  function en(){ return document.getElementById('htmlRoot').lang === 'en'; }
  function T(ar,e){ return en() ? e : ar; }
  function L(o){ return (o && typeof o === 'object') ? (en() ? o.en : o.ar) : (o || ''); }
  function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
  function at(o){ return (o.snapshot && typeof o.snapshot.checkoutAt === 'number') ? o.snapshot.checkoutAt : 0; }
  function dateText(o){
    var t = at(o);
    if (!t) return L(o.date);
    try { return new Date(t).toLocaleString(en() ? 'en-GB' : 'ar-KW', { day:'numeric', month:'short', year:'numeric', hour:'2-digit', minute:'2-digit' }); } catch(e){ return L(o.date); }
  }
  function status(o){
    var m = statusMeta(o.status);
    var tone = o.status === 'delivered' ? 'green' : o.status === 'progress' ? 'gold' : 'red';
    var label = m.label;
    if (o.status === 'progress' && window.RAFActiveOrderBar && RAFActiveOrderBar.stageOf){
      try { var s = RAFActiveOrderBar.stageOf(o); if (s) label = L(s); } catch(e){}
    }
    return '<span class="ac-pill ' + tone + '"><i class="ti ' + m.ic + '"></i> ' + esc(label) + '</span>';
  }
  function thumbs(o){
    var items = o.items || [];
    var html = items.slice(0, 3).map(function(it){
      var c = window.RAFCatalog && it.id ? RAFCatalog.get(it.id) : null;
      var img = c && c.img ? c.img : '';
      return '<span class="t"' + (img ? ' style="background-image:url(\'' + esc(img) + '\')"' : '') + ' title="' + esc(L(it.name)) + '">' + (img ? '' : '<i class="ti ' + esc(it.ic || 'ti-box') + '"></i>') + '</span>';
    }).join('');
    if (items.length > 3) html += '<span class="more">+' + (items.length - 3) + '</span>';
    return html;
  }
  function count(o){ return (o.items || []).reduce(function(s, it){ return s + (parseInt(it.qty, 10) || 1); }, 0); }
  function rateLink(o){
    var CX = window.RAFCustomerExperience;
    if (!CX || !CX.orderRatingStatus) return '';
    var st = CX.orderRatingStatus(o.id);
    if (!st || !st.ok) return '';
    return st.state === 'rated' ? '<span class="or-cnt"><i class="ti ti-circle-check"></i> ' + esc(T('تم التقييم','Rated')) + '</span>'
      : '<a class="or-rate" href="raf_delivery_rating.html?id=' + encodeURIComponent(o.id) + '" onclick="event.stopPropagation()"><i class="ti ti-star"></i> ' + esc(T('قيّم الطلب','Rate order')) + '</a>';
  }
  function row(o){
    var href = o.status === 'progress' ? 'raf_tracking.html?id=' + encodeURIComponent(o.id) : 'raf_order_details.html?id=' + encodeURIComponent(o.id);
    var n = count(o);
    return '<a class="or-row" href="' + href + '" data-order="' + esc(o.id) + '">'
      + '<div class="or-id"><b>#' + esc(o.id) + '</b><span><i class="ti ti-building-store"></i> ' + esc(L(o.store)) + '</span></div>'
      + '<div class="or-date">' + esc(dateText(o)) + '</div>'
      + '<div class="or-th">' + thumbs(o) + '</div>'
      + '<div class="or-cnt">' + n + ' ' + esc(T(n === 1 ? 'منتج' : 'منتجات', n === 1 ? 'item' : 'items')) + '</div>'
      + '<div class="or-tot">' + esc(o.total) + ' <small>' + esc(T('د.ك','KWD')) + '</small></div>'
      + '<div class="or-st">' + status(o) + rateLink(o) + '</div>'
      + '<i class="ti ti-chevron-left or-go" aria-hidden="true"></i></a>';
  }
  function render(){
    var list = (typeof rafOrders === 'function' ? rafOrders() : []).slice();
    list = list.map(function(o, i){ return { o:o, i:i }; })
      .sort(function(a, b){ return (at(b.o) - at(a.o)) || (b.i - a.i); }).map(function(x){ return x.o; });
    var host = document.getElementById('ordList');
    if (!list.length){
      host.innerHTML = '<div class="ac-empty"><i class="ti ti-package-off"></i><b>' + esc(T('لا توجد طلبات بعد','No orders yet')) + '</b>'
        + '<a class="ac-link" href="raf_homepage.html">' + esc(T('ابدأ التسوق','Start shopping')) + '</a></div>';
      return;
    }
    host.innerHTML = '<div class="or-headrow" aria-hidden="true"><span>' + esc(T('الطلب','Order')) + '</span><span>' + esc(T('التاريخ','Date')) + '</span><span>'
      + esc(T('المنتجات','Products')) + '</span><span>' + esc(T('العدد','Items')) + '</span><span>' + esc(T('الإجمالي','Total')) + '</span><span>'
      + esc(T('الحالة','Status')) + '</span><span></span></div>' + list.map(row).join('');
  }
  window.onLangChange = render;
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', render); else render();
  window.addEventListener('storage', function(e){ if (!e.key || e.key === 'raf_orders' || e.key === 'raf_order_mstate') render(); });
})();
</script>
