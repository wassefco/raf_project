<!DOCTYPE html>
<html id="htmlRoot" lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>رف — الإشعارات</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700;900&family=Tajawal:wght@300;400;500;700;800&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
<link rel="stylesheet" href="raf_account.css">
<link rel="icon" type="image/png" sizes="64x64" href="raf_favicon.png">
<link rel="icon" type="image/png" sizes="32x32" href="raf_favicon_32.png">
<link rel="apple-touch-icon" href="raf_appicon.png">
<style>.unread{position:relative;}.unread::after{content:'';position:absolute;top:50%;inset-inline-start:14px;transform:translateY(-50%);width:8px;height:8px;border-radius:50%;background:var(--gold);} .nrow{padding-inline-start:32px;}</style>
</head>
<body>
<header class="ahead">
  <a href="raf_account.html" class="ahead-back"><i class="ti ti-arrow-right"></i> <span data-ar="هوية رف" data-en="RAF ID">هوية رف</span></a>
  <div class="ahead-title" data-ar="الإشعارات" data-en="Notifications">الإشعارات</div>
  <button class="lang-btn" onclick="toggleLang()"><span class="lang-dot"></span><span id="langLabel">EN</span></button>
</header>

<div class="wrap">
  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;">
    <div class="section-h" style="margin:0;" data-ar="أحدث التنبيهات" data-en="Latest alerts">أحدث التنبيهات</div>
    <button class="btn btn-ghost btn-sm" data-ar="تعليم الكل كمقروء" data-en="Mark all read">تعليم الكل كمقروء</button>
  </div>

  <div class="panel">
    <div class="row nrow unread"><div class="row-ic" style="background:var(--blue-bg);color:var(--blue)"><i class="ti ti-truck-delivery"></i></div>
      <div class="row-body"><div class="row-lbl" data-ar="طلبك ‎#ORD-1284 في الطريق" data-en="Order #ORD-1284 is on the way">طلبك ‎#ORD-1284 في الطريق</div><div class="row-sub" data-ar="منذ 10 دقائق" data-en="10 minutes ago">منذ 10 دقائق</div></div></div>
    <div class="row nrow unread"><div class="row-ic" style="background:var(--amber-bg);color:var(--amber)"><i class="ti ti-discount"></i></div>
      <div class="row-body"><div class="row-lbl" data-ar="عرض حصري من Casa Mode — خصم 25%" data-en="Exclusive 25% off from Casa Mode">عرض حصري من Casa Mode — خصم 25%</div><div class="row-sub" data-ar="منذ ساعة" data-en="1 hour ago">منذ ساعة</div></div></div>
    <div class="row nrow unread"><div class="row-ic" style="background:var(--gold-soft);color:var(--gold2)"><i class="ti ti-gift"></i></div>
      <div class="row-body"><div class="row-lbl" data-ar="ربحت 120 نقطة مكافآت" data-en="You earned 120 reward points">ربحت 120 نقطة مكافآت</div><div class="row-sub" data-ar="منذ ساعتين" data-en="2 hours ago">منذ ساعتين</div></div></div>
    <div class="row nrow"><div class="row-ic" style="background:var(--green-bg);color:var(--green)"><i class="ti ti-building-store"></i></div>
      <div class="row-body"><div class="row-lbl" data-ar="متجر جديد انضم — Nova Shoes" data-en="New store joined — Nova Shoes">متجر جديد انضم — Nova Shoes</div><div class="row-sub" data-ar="منذ 3 ساعات" data-en="3 hours ago">منذ 3 ساعات</div></div></div>
    <div class="row nrow"><div class="row-ic"><i class="ti ti-circle-check"></i></div>
      <div class="row-body"><div class="row-lbl" data-ar="تم تسليم طلبك ‎#ORD-1280 بنجاح" data-en="Order #ORD-1280 delivered successfully">تم تسليم طلبك ‎#ORD-1280 بنجاح</div><div class="row-sub" data-ar="أمس" data-en="Yesterday">أمس</div></div></div>
  </div>
</div>

<nav class="app-bnav">
  <a href="raf_homepage.html" class="bnav-tab"><i class="ti ti-home-2"></i><span data-ar="الرئيسية" data-en="Home">الرئيسية</span></a>
  <a href="raf_storespage.html" class="bnav-tab"><i class="ti ti-compass"></i><span data-ar="تصفّح" data-en="Browse">تصفّح</span></a>
  <a href="raf_cart.html" class="bnav-cart"><div class="bnav-cart-ring"><i class="ti ti-shopping-cart"></i></div><span data-ar="السلة" data-en="Cart">السلة</span></a>
  <a href="raf_wishlist.html" class="bnav-tab"><i class="ti ti-heart"></i><span data-ar="المفضلة" data-en="Saved">المفضلة</span></a>
  <a href="raf_account.html" class="bnav-tab on"><i class="ti ti-user-circle"></i><span data-ar="حسابي" data-en="Account">حسابي</span></a>
</nav>

<script src="raf_account.js"></script>
</body>
</html>
