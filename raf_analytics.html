<!DOCTYPE html>
<html id="htmlRoot" lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>رف — التحليلات والمالية</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700;900&family=Tajawal:wght@300;400;500;700;800&family=DM+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
<link rel="icon" type="image/png" sizes="64x64" href="raf_favicon.png">
<link rel="icon" type="image/png" sizes="32x32" href="raf_favicon_32.png">
<link rel="apple-touch-icon" href="raf_appicon.png">
<script src="raf_features.js"></script>
<script src="raf_config.js"></script>
<script src="raf_event_bus.js"></script>
<script src="raf_record_store.js"></script>
<script src="raf_notify_core.js"></script>
<link rel="stylesheet" href="raf_theme.css">
<style>
/* ══════════════════════════════════════════════════════════════
   ANALYTICS & FINANCE — same shell, tokens and interaction model as
   the Orders, Products and Marketing workspaces. A read-only view:
   every figure comes from RAFAnalytics, which reads the authorities.
   ══════════════════════════════════════════════════════════════ */
*{box-sizing:border-box;}
[hidden]{display:none!important;}
body{background:var(--bg2);margin:0;}
.mw{display:flex;min-height:100vh;}
.mw-rail{width:74px;flex:0 0 74px;background:var(--ink);display:flex;flex-direction:column;align-items:center;
  gap:6px;padding:14px 0;position:sticky;top:0;height:100vh;z-index:40;}
.mw-rail-logo{width:44px;height:44px;min-height:44px;border-radius:13px;background:var(--gold);color:#1C1606;display:flex;
  align-items:center;justify-content:center;font-family:var(--font-display);font-size:19px;font-weight:900;
  margin-bottom:10px;text-decoration:none;}
.mw-rail-b{width:50px;min-height:50px;border-radius:14px;border:0;background:transparent;color:#8E877A;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;cursor:pointer;
  font-family:inherit;font-size:9.5px;font-weight:700;text-decoration:none;transition:background .18s,color .18s;}
.mw-rail-b i{font-size:21px;}
.mw-rail-b:hover{background:rgba(255,255,255,.07);color:#EDE8DC;}
.mw-rail-b.on{background:var(--gold-soft);color:var(--gold);}
.mw-rail-sp{flex:1;}
.mw-main{flex:1;min-width:0;display:flex;flex-direction:column;}

.mw-head{position:sticky;top:0;z-index:35;background:var(--card);border-bottom:1px solid var(--border);
  padding:12px clamp(14px,2.2vw,24px);display:flex;align-items:center;gap:14px;flex-wrap:wrap;}
.mw-store{display:flex;align-items:center;gap:11px;min-width:0;}
.mw-store-logo{width:44px;height:44px;flex:0 0 auto;border-radius:13px;background:var(--bg3) center/cover no-repeat;
  display:flex;align-items:center;justify-content:center;color:var(--gold2);font-size:21px;}
.mw-store-t{min-width:0;}
.mw-store-t b{display:block;font-family:var(--font-display);font-size:17px;font-weight:800;color:var(--ink);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.mw-store-t span{font-size:11.5px;color:var(--text3);}
.mw-head-sp{flex:1;min-width:8px;}
.mw-hact{display:flex;align-items:center;gap:8px;}
.mw-ico-b{width:44px;height:44px;flex:0 0 auto;border-radius:13px;border:1px solid var(--border2);
  background:var(--card);color:var(--text2);font-size:18px;cursor:pointer;display:inline-flex;
  align-items:center;justify-content:center;font-family:inherit;font-weight:800;transition:all .18s;}
.mw-hact .mw-ico-b{min-height:44px;}
.mw-ico-b:hover{border-color:var(--gold);color:var(--gold2);}
.mw-ico-b.signout{color:var(--red,#C0503C);}
.mw-ico-b.signout .so-t{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;}
.mw-ico-b.signout:hover{border-color:var(--red,#C0503C);color:var(--red,#C0503C);}
.mw-ico-b.lang{width:auto;padding:0 14px;font-size:12.5px;}
.mw-body{padding:16px clamp(14px,2.2vw,24px) 60px;max-width:1320px;width:100%;}

/* ---------- tabs ---------- */
.af-tabs{display:flex;gap:4px;border:1px solid var(--border2);border-radius:15px;background:var(--card);
  padding:4px;margin-bottom:12px;overflow-x:auto;scrollbar-width:none;}
.af-tabs::-webkit-scrollbar{display:none;}
/* the theme's `html:not([data-ui]) button` rule is (0,1,2); every touch
   target here is scoped with two classes so 44px+ actually wins */
.mw-body .af-tabs button{min-height:46px;}
.af-tabs button{flex:1 0 auto;min-height:46px;padding:0 18px;border:0;border-radius:11px;background:transparent;
  color:var(--text2);font-family:inherit;font-size:13.5px;font-weight:800;cursor:pointer;white-space:nowrap;
  display:inline-flex;align-items:center;justify-content:center;gap:7px;transition:all .18s;}
.af-tabs button i{font-size:17px;}
.af-tabs button:hover{color:var(--ink);background:var(--bg);}
.af-tabs button[aria-selected="true"]{background:var(--ink);color:#F5F0E4;}
.af-tabs button:focus-visible{outline:2px solid var(--gold);outline-offset:2px;}

/* ---------- date bar ---------- */
.af-bar{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin-bottom:16px;}
.af-sel{position:relative;flex:0 0 auto;}
.af-sel select{min-height:44px;border-radius:13px;border:1px solid var(--border2);background:var(--card);
  font-family:inherit;font-size:13px;font-weight:800;color:var(--ink);padding:0 36px 0 14px;cursor:pointer;
  appearance:none;-webkit-appearance:none;}
html[dir="rtl"] .af-sel select{padding:0 14px 0 36px;}
.af-sel > i{position:absolute;top:50%;transform:translateY(-50%);inset-inline-end:12px;font-size:15px;
  color:var(--text3);pointer-events:none;}
.af-sel select:focus{outline:2px solid var(--gold);outline-offset:1px;}
.af-custom{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
.af-custom label{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:700;color:var(--text3);}
.af-custom input{min-height:44px;border-radius:12px;border:1px solid var(--border2);background:var(--card);
  font-family:var(--font-en);font-size:13px;color:var(--ink);padding:0 10px;}
.af-custom input:focus{outline:2px solid var(--gold);outline-offset:1px;}
.af-bar .af-apply{min-height:44px;}
.af-apply{min-height:44px;padding:0 16px;border-radius:12px;border:1px solid var(--gold2);background:var(--gold);
  color:#1C1606;font-family:inherit;font-size:13px;font-weight:800;cursor:pointer;}
.af-note{font-size:12px;color:var(--text3);display:inline-flex;align-items:center;gap:6px;line-height:1.5;}
.af-note i{font-size:15px;}
.af-rerr{font-size:12.5px;font-weight:700;color:#A63A36;}

/* ---------- panel scaffolding ---------- */
.af-q{display:flex;align-items:center;gap:9px;margin:0 0 14px;}
.af-q i{font-size:20px;color:var(--gold2);}
.af-q h2{margin:0;font-family:var(--font-display);font-size:18px;font-weight:800;color:var(--ink);}
.af-card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:16px;min-width:0;}
.af-card-h{display:flex;align-items:center;gap:9px;margin-bottom:12px;flex-wrap:wrap;}
.af-card-h i{font-size:18px;color:var(--gold2);}
.af-card-h b{font-size:14.5px;font-weight:800;color:var(--ink);}
.af-card-h .sp{flex:1;}
.af-card-h em{font-style:normal;font-size:12px;color:var(--text3);}
.af-stack{display:flex;flex-direction:column;gap:12px;}
.af-grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.af-num{font-family:var(--font-en);font-weight:800;unicode-bidi:isolate;direction:ltr;}
.af-cur{font-size:.78em;font-weight:700;color:var(--text3);}
.af-foot{font-size:11.5px;color:var(--text3);line-height:1.7;margin-top:10px;display:flex;gap:6px;}
.af-foot i{font-size:14px;flex:0 0 auto;margin-top:2px;}

/* ---------- KPIs ---------- */
.af-kpis{display:grid;grid-template-columns:1.3fr 1fr 1fr 1fr;gap:10px;}
.af-kpi{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:14px 15px;min-width:0;}
/* label spans only — the money value inside `b` has spans of its own */
.af-kpi > span{display:block;font-size:12px;font-weight:700;color:var(--text3);margin-bottom:6px;}
.af-kpi b{display:block;font-size:22px;line-height:1.2;color:var(--ink);overflow-wrap:anywhere;}
.af-kpi.lead{background:var(--ink);border-color:var(--ink);}
.af-kpi.lead > span{color:#B9B2A3;}
.af-kpi.lead b{color:#F5F0E4;font-size:26px;}
.af-kpi.lead .af-cur{color:#B9B2A3;}
.af-kpi small{display:block;font-size:11px;color:var(--text3);margin-top:4px;}
.af-kpi.lead small{color:#8E877A;}
.af-eq{display:flex;align-items:center;flex-wrap:wrap;gap:6px 12px;background:var(--bg);border:1px solid var(--border);
  border-radius:14px;padding:11px 14px;font-size:12.5px;color:var(--text2);}
.af-eq b{color:var(--ink);}
.af-eq .op{color:var(--text3);font-weight:800;}
.af-stats{display:grid;grid-template-columns:repeat(6,1fr);gap:9px;}
.af-stat{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:11px 13px;min-width:0;}
.af-stat > span{display:block;font-size:11.5px;font-weight:700;color:var(--text3);margin-bottom:4px;}
.af-stat b{display:block;font-size:17px;color:var(--ink);overflow-wrap:anywhere;}

/* ---------- chart ---------- */
.af-chart{position:relative;}
.af-chart svg{display:block;width:100%;height:170px;}
.af-chart .bar{fill:var(--gold);}
.af-chart .bar:hover{fill:var(--gold2);}
.af-chart .base{stroke:var(--border2);stroke-width:1;}
.af-axis{display:flex;justify-content:space-between;font-size:11px;color:var(--text3);margin-top:6px;gap:8px;}
.af-ymax{font-size:11px;color:var(--text3);margin-bottom:4px;}

/* ---------- lists / bars ---------- */
.af-list{display:flex;flex-direction:column;}
.af-li{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--border);min-height:44px;}
.af-li:last-child{border-bottom:0;}
.af-li .rk{width:24px;height:24px;flex:0 0 auto;border-radius:8px;background:var(--bg3);color:var(--text2);
  font-size:11.5px;font-weight:800;display:inline-flex;align-items:center;justify-content:center;font-family:var(--font-en);}
.af-li .nm{flex:1;min-width:0;}
.af-li .nm b{display:block;font-size:13px;font-weight:700;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.af-li .nm em{display:block;font-style:normal;font-size:11.5px;color:var(--text3);margin-top:1px;}
.af-li .vl{flex:0 0 auto;font-size:13px;color:var(--ink);text-align:end;}
.af-meter{height:7px;border-radius:5px;background:var(--bg3);overflow:hidden;margin-top:5px;}
.af-meter > span{display:block;height:100%;background:var(--gold);border-radius:5px;}
.af-seg{display:flex;height:12px;border-radius:7px;overflow:hidden;background:var(--bg3);margin-bottom:12px;}
.af-seg span{display:block;height:100%;}
.af-legend{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.af-legend div{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--text2);}
.af-legend i{width:10px;height:10px;border-radius:3px;flex:0 0 auto;}
.af-legend b{margin-inline-start:auto;color:var(--ink);}
.c-awaiting{background:#C8791E;} .c-progress{background:var(--gold2);}
.c-delivered{background:var(--green);} .c-cancelled{background:#C9C2B3;}

/* ---------- segmented control / chips ---------- */
.af-segc{display:inline-flex;border:1px solid var(--border2);border-radius:13px;overflow:hidden;background:var(--card);}
.af-card .af-segc button{min-height:44px;}
.af-segc button{min-height:44px;padding:0 15px;border:0;background:transparent;color:var(--text2);font-family:inherit;
  font-size:12.5px;font-weight:800;cursor:pointer;white-space:nowrap;}
.af-segc button[aria-pressed="true"]{background:var(--ink);color:#F5F0E4;}
.af-search{position:relative;flex:1 1 200px;max-width:320px;}
.af-search input{width:100%;min-height:44px;border-radius:12px;border:1px solid var(--border2);background:var(--card);
  font-family:inherit;font-size:13px;color:var(--ink);padding-inline-start:38px;padding-inline-end:12px;}
.af-search input:focus{outline:2px solid var(--gold);outline-offset:1px;}
.af-search > i{position:absolute;top:50%;transform:translateY(-50%);inset-inline-start:12px;font-size:17px;color:var(--text3);pointer-events:none;}
.af-tag{display:inline-flex;align-items:center;height:22px;padding:0 9px;border-radius:20px;font-size:10.5px;
  font-weight:800;background:var(--bg3);color:var(--text2);white-space:nowrap;}
.af-tag.gold{background:var(--gold-soft);color:var(--gold2);}
.af-tag.green{background:rgba(46,158,91,.14);color:#1F7A45;}
.af-tag.red{background:rgba(217,83,79,.13);color:#A63A36;}
.af-tag.amber{background:rgba(200,121,30,.14);color:#9A5B12;}

/* ---------- tables (cards on small screens) ---------- */
.af-tw{overflow-x:auto;border:1px solid var(--border);border-radius:13px;}
.af-t{width:100%;border-collapse:collapse;font-size:12.5px;}
.af-t th{position:sticky;top:0;background:var(--bg);color:var(--text3);font-size:11.5px;font-weight:800;text-align:start;
  padding:10px 12px;border-bottom:1px solid var(--border);white-space:nowrap;}
.af-t td{padding:10px 12px;border-bottom:1px solid var(--border);color:var(--ink);vertical-align:middle;}
.af-t tbody tr:last-child td{border-bottom:0;}
.af-t tfoot td{background:var(--bg);font-weight:800;border-top:1px solid var(--border2);border-bottom:0;}
.af-t .n{text-align:end;white-space:nowrap;}
.af-t .mut{color:var(--text3);}
.af-t td b{font-weight:700;}
.af-t .sub{display:block;font-size:11px;color:var(--text3);margin-top:2px;}

/* ---------- reports ---------- */
.af-reps{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px;}
.af-reps .af-rep{min-height:44px;}
.af-rep{display:flex;align-items:flex-start;gap:12px;text-align:start;padding:15px;border-radius:15px;
  border:1px solid var(--border);background:var(--card);cursor:pointer;font-family:inherit;transition:all .18s;}
.af-rep:hover{border-color:var(--gold);background:var(--gold-soft);}
.af-rep .ic{width:40px;height:40px;flex:0 0 auto;border-radius:12px;background:var(--bg3);color:var(--gold2);
  display:inline-flex;align-items:center;justify-content:center;font-size:20px;}
.af-rep b{display:block;font-size:14px;font-weight:800;color:var(--ink);}
.af-rep span{display:block;font-size:12px;color:var(--text3);line-height:1.6;margin-top:3px;}
.af-rhead{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px;}
.af-rhead .t{flex:1;min-width:180px;}
.af-rhead h3{margin:0;font-size:16px;font-weight:800;color:var(--ink);}
.af-rhead p{margin:2px 0 0;font-size:12px;color:var(--text3);}
.af-card .af-btn,.af-rhead .af-btn{min-height:44px;}
.af-btn{min-height:44px;padding:0 15px;border-radius:12px;border:1px solid var(--border2);background:var(--card);
  color:var(--text2);font-family:inherit;font-size:12.5px;font-weight:800;cursor:pointer;display:inline-flex;
  align-items:center;gap:7px;transition:all .18s;}
.af-btn:hover{border-color:var(--gold);color:var(--gold2);background:var(--gold-soft);}
.af-btn.gold{background:var(--gold);border-color:var(--gold2);color:#1C1606;}
.af-btn.gold:hover{filter:brightness(1.05);}
.af-muted{font-size:12px;color:var(--text3);display:inline-flex;align-items:center;gap:6px;}
.af-phead{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px;}
.af-subh{margin:20px 0 10px;font-size:13.5px;font-weight:800;color:var(--ink);}
.af-stmt .r .k small .af-num{font-weight:600;}
/* monthly statement: the three steps of the calculation */
.af-step{font-size:11.5px;font-weight:800;color:var(--gold2);padding:16px 0 2px;}
.af-stmt .af-step:first-child{padding-top:0;}
.af-step.sep{color:var(--text3);border-top:1px dashed var(--border2);margin-top:6px;}
/* monthly history */
.af-hist{display:flex;flex-direction:column;gap:2px;}
.af-hist .af-hrow{min-height:52px;}
.af-hrow{display:flex;align-items:center;gap:10px;flex-wrap:wrap;width:100%;min-height:52px;padding:8px 10px;border:0;
  border-radius:11px;background:transparent;cursor:pointer;font-family:inherit;text-align:start;transition:background .15s;}
.af-hrow:hover{background:var(--bg);}
.af-hrow.on{background:var(--gold-soft);}
.af-hrow:focus-visible{outline:2px solid var(--gold);outline-offset:1px;}
.af-hrow .m{font-size:13.5px;font-weight:800;color:var(--ink);}
.af-hrow .v{margin-inline-start:auto;font-size:13px;color:var(--ink);display:flex;align-items:baseline;gap:6px;}
.af-hrow .v small{font-size:11px;font-weight:700;color:var(--text3);}

/* ---------- finance statement ---------- */
.af-stmt{display:flex;flex-direction:column;}
.af-stmt .r{display:flex;align-items:baseline;gap:12px;padding:11px 0;border-bottom:1px solid var(--border);}
.af-stmt .r:last-child{border-bottom:0;}
.af-stmt .r .k{flex:1;min-width:0;font-size:13px;font-weight:700;color:var(--text2);}
.af-stmt .r .k small{display:block;font-size:11.5px;font-weight:500;color:var(--text3);margin-top:2px;line-height:1.6;}
.af-stmt .r .v{flex:0 0 auto;font-size:14px;color:var(--ink);text-align:end;}
.af-stmt .r.total{border-top:2px solid var(--ink);border-bottom:1px solid var(--border);}
.af-stmt .r.total .k{color:var(--ink);font-weight:800;}
.af-stmt .r.total .v{font-size:17px;}
.af-na{font-size:12px;font-weight:800;color:#9A5B12;background:rgba(200,121,30,.12);border-radius:20px;padding:4px 10px;white-space:nowrap;}

/* ---------- states ---------- */
.af-empty{border:1px dashed var(--border2);border-radius:16px;padding:34px 22px;text-align:center;background:var(--card);}
.af-empty i{font-size:34px;color:var(--text3);display:block;margin-bottom:10px;}
.af-empty b{display:block;font-size:15px;font-weight:800;color:var(--ink);margin-bottom:5px;}
.af-empty span{display:block;font-size:12.5px;color:var(--text3);line-height:1.8;max-width:460px;margin:0 auto;}
.af-empty .af-btn{margin-top:14px;}
.af-empty.err i{color:var(--red);}
.af-skel{border-radius:16px;background:linear-gradient(90deg,var(--bg3) 0%,var(--bg) 50%,var(--bg3) 100%);
  background-size:200% 100%;animation:afsh 1.3s linear infinite;}
@keyframes afsh{from{background-position:200% 0;}to{background-position:-200% 0;}}
@media(prefers-reduced-motion:reduce){.af-skel{animation:none;}}

.mw-gate{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:30px;}
.mw-gate-c{max-width:420px;text-align:center;}
.mw-gate-c i{font-size:40px;color:var(--text3);}
.mw-gate-c h1{font-family:var(--font-display);font-size:20px;font-weight:800;color:var(--ink);margin:12px 0 8px;}
.mw-gate-c p{font-size:13px;color:var(--text2);line-height:1.8;}
.mw-toast{position:fixed;inset-inline:0;bottom:26px;display:flex;justify-content:center;z-index:120;
  pointer-events:none;opacity:0;transform:translateY(10px);transition:opacity .22s,transform .22s;}
.mw-toast.show{opacity:1;transform:none;}
.mw-toast > div{background:var(--ink);color:#F5F0E4;border-radius:30px;padding:12px 20px;font-size:13.5px;
  font-weight:700;box-shadow:0 14px 30px -14px rgba(20,16,8,.6);max-width:90vw;text-align:center;}

@media (max-width:1100px){
  .af-stats{grid-template-columns:repeat(3,1fr);}
}
@media (max-width:900px){
  .af-grid2{grid-template-columns:1fr;}
  .af-kpis{grid-template-columns:1fr 1fr;}
}
@media (max-width:700px){
  /* rows become cards; each cell names its column */
  .af-tw{border:0;overflow:visible;}
  .af-t thead{display:none;}
  .af-t, .af-t tbody, .af-t tfoot{display:block;}
  .af-t tr{display:block;background:var(--card);border:1px solid var(--border);border-radius:13px;
    padding:6px 12px;margin-bottom:9px;}
  .af-t tfoot tr{background:var(--bg);}
  .af-t td{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:7px 0;
    border-bottom:1px dashed var(--border);text-align:end;}
  .af-t td:last-child{border-bottom:0;}
  .af-t td::before{content:attr(data-label);font-size:11.5px;font-weight:700;color:var(--text3);text-align:start;flex:0 0 auto;}
  .af-t td.lead{display:block;text-align:start;font-size:13.5px;}
  .af-t td.lead::before{display:none;}
  .af-t tfoot td{border-top:0;background:transparent;}
}
@media (max-width:640px){
  .af-bar .af-sel{flex:1 1 100%;}
  .af-sel select{width:100%;}
  .af-custom{width:100%;display:grid;grid-template-columns:1fr 1fr;}
  .af-custom label{flex-direction:column;align-items:stretch;}
  .af-custom input{width:100%;}
  .af-custom .af-apply{grid-column:1/-1;}
  .af-stats{grid-template-columns:1fr 1fr;}
  .af-kpi.lead{grid-column:1/-1;}
  .af-tabs button{padding:0 14px;font-size:13px;}
  .af-search{max-width:none;}
}
@media (max-width:560px){
  .mw-rail{position:fixed;bottom:0;top:auto;width:100%;height:auto;flex-direction:row;justify-content:space-around;
    padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px));}
  .mw-rail-logo,.mw-rail-sp{display:none;}
  /* eight destinations share the row: each takes an equal slice */
  .mw-rail{gap:0;padding-inline:2px;}
  .mw-rail-b{flex:1 1 0;min-width:0;width:auto;padding:0 1px;}
  .mw-rail-b span{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:9px;}
  .mw{flex-direction:column;}
  .mw-body{padding-bottom:90px;}
  .mw-store-logo{width:38px;height:38px;font-size:18px;}
  .mw-store-t b{font-size:15px;}
}
</style>
</head>
<body>

<div class="mw-gate" id="gate" style="display:none;">
  <div class="mw-gate-c"><i class="ti ti-chart-line"></i>
    <h1 id="gateT"></h1><p id="gateP"></p></div>
</div>

<div class="mw" id="shell" style="display:none;">
  <!-- drawn by RAFMerchantNav from the account's own saved order -->
  <aside class="mw-rail" data-nav="analytics"></aside>

  <div class="mw-main">
    <header class="mw-head">
      <div class="mw-store">
        <div class="mw-store-logo" id="stLogo"><i class="ti ti-building-store"></i></div>
        <div class="mw-store-t"><b id="stName">—</b>
          <span data-ar="التحليلات والمالية" data-en="Analytics &amp; Finance">التحليلات والمالية</span></div>
      </div>
      <div class="mw-head-sp"></div>
      <div class="mw-hact">
        <button class="mw-ico-b" onclick="refreshAll()" id="refreshBtn" aria-label="refresh"><i class="ti ti-refresh"></i></button>
        <button class="mw-ico-b lang" onclick="toggleLang()"><span id="langLabel">EN</span></button>
        <!-- sign out: the shared RAFSignOut action -->
        <button class="mw-ico-b signout" onclick="RAFSignOut()"><i class="ti ti-logout" aria-hidden="true"></i><span class="so-t" data-ar="تسجيل الخروج" data-en="Sign Out">تسجيل الخروج</span></button>
      </div>
    </header>

    <div class="mw-body">
      <div class="af-tabs" role="tablist" id="tabs"></div>

      <div class="af-bar" id="bar">
        <div class="af-sel"><select id="fRange" onchange="setPreset(this.value)" aria-label="date range"></select><i class="ti ti-chevron-down"></i></div>
        <div class="af-custom" id="custom" hidden>
          <label><span data-ar="من" data-en="From">من</span><input type="date" id="fFrom"></label>
          <label><span data-ar="إلى" data-en="To">إلى</span><input type="date" id="fTo"></label>
          <button class="af-apply" onclick="applyCustom()" data-ar="تطبيق" data-en="Apply">تطبيق</button>
        </div>
        <span class="af-note" id="rangeNote"></span>
      </div>

      <section id="panel" role="tabpanel" aria-live="polite"></section>
    </div>
  </div>
</div>

<div class="mw-toast" id="toast"><div id="toastMsg"></div></div>

<script src="raf_source.js"></script>
<script src="raf_audit.js"></script>
<script src="raf_data.js"></script>
<script src="raf_order_snapshot.js"></script>
<script src="raf_store_ops.js"></script>
<script src="raf_catalog.js"></script>
<script src="raf_inventory.js"></script>
<script src="raf_rules.js"></script>
<script src="raf_order_engine.js"></script>
<script src="raf_order_changes.js"></script>
<script src="raf_permissions.js"></script>
<script src="raf_marketing.js"></script>
<script src="raf_wallet.js"></script>
<script src="raf_settlement.js"></script>
<script src="raf_analytics.js"></script>
<script src="raf_merchant_prefs.js"></script>
<script src="raf_merchant_nav.js"></script>
<script>
/* ============================================================
   ANALYTICS & FINANCE
   The page renders; it computes nothing of its own. Every figure
   is read from RAFAnalytics, which reads the RAF authorities for
   the signed-in merchant's store. Nothing is written anywhere
   except the viewer's own tab / range preference.
   ============================================================ */
(function(){
  'use strict';
  var A = window.RAFAnalytics;
  var PREF = 'raf_af_view';
  var TABS = [
    { k:'analytics', ic:'ti-chart-line',        ar:'التحليلات', en:'Analytics' },
    { k:'sales',     ic:'ti-shopping-bag',      ar:'المبيعات',  en:'Sales' },
    { k:'reports',   ic:'ti-file-analytics',    ar:'التقارير',  en:'Reports' },
    { k:'finance',   ic:'ti-report-money',      ar:'المالية',   en:'Finance' },
    { k:'payouts',   ic:'ti-building-bank',     ar:'التحويلات', en:'Payouts' }
  ];
  var PRESETS = [
    { k:'today',     ar:'اليوم',          en:'Today' },
    { k:'yesterday', ar:'أمس',            en:'Yesterday' },
    { k:'last7',     ar:'آخر 7 أيام',     en:'Last 7 days' },
    { k:'last30',    ar:'آخر 30 يومًا',   en:'Last 30 days' },
    { k:'thisMonth', ar:'هذا الشهر',      en:'This month' },
    { k:'lastMonth', ar:'الشهر الماضي',   en:'Last month' },
    { k:'custom',    ar:'نطاق مخصص',      en:'Custom range' }
  ];
  var REPORTS = [
    { k:'monthly',   ic:'ti-calendar-stats',  ar:'التقرير الشهري',    en:'Monthly report',
      dar:'تسوية شهر محاسبي: المبيعات والخصومات وعمولة رف ومستحقاتك.', den:'One accounting month’s settlement: sales, discounts, RAF commission and your entitlement.' },
    { k:'sales',     ic:'ti-chart-bar',       ar:'تقرير المبيعات',    en:'Sales report',
      dar:'المبيعات لكل يوم ضمن النطاق.', den:'Sales for each day in the range.' },
    { k:'orders',    ic:'ti-clipboard-list',  ar:'تقرير الطلبات',     en:'Orders report',
      dar:'كل طلب ضمن النطاق بقيمه المسجّلة.', den:'Every order in the range with its recorded values.' },
    { k:'products',  ic:'ti-package',         ar:'أداء المنتجات',     en:'Product performance',
      dar:'أداء كل منتج من الطلبات الفعلية.', den:'Each product’s performance from actual orders.' },
    { k:'inventory', ic:'ti-building-warehouse', ar:'تقرير المخزون',  en:'Inventory report',
      dar:'المخزون الحالي كما يسجّله نظام المخزون.', den:'Current stock as recorded by the inventory system.' },
    { k:'marketing', ic:'ti-speakerphone',    ar:'أداء التسويق',      en:'Marketing performance',
      dar:'العروض والكوبونات والإعلانات ونتائجها.', den:'Promotions, coupons and ads, and what they produced.' },
    { k:'finance',   ic:'ti-report-money',    ar:'الملخص المالي',     en:'Financial summary',
      dar:'المبيعات والخصومات حسب من موّلها، للنطاق المحدد.', den:'Sales and discounts by who funded them, for the selected range.' }
  ];
  var STATUS = {
    awaiting:  { ar:'بانتظار القبول', en:'Awaiting acceptance', tag:'amber' },
    progress:  { ar:'قيد التنفيذ',    en:'In progress',         tag:'gold' },
    delivered: { ar:'تم التسليم',     en:'Delivered',           tag:'green' },
    cancelled: { ar:'ملغي',           en:'Cancelled',           tag:'' }
  };
  var PAY = {
    paid:{ ar:'مدفوع', en:'Paid' }, cod:{ ar:'الدفع عند الاستلام', en:'Cash on delivery' },
    pending:{ ar:'بانتظار الدفع', en:'Payment pending' }, refunded:{ ar:'مسترد', en:'Refunded' },
    not_recorded:{ ar:'غير مسجّل', en:'Not recorded' }
  };
  var PSTATE = {
    active:{ ar:'نشط', en:'Active', tag:'green' }, scheduled:{ ar:'مجدول', en:'Scheduled', tag:'' },
    expired:{ ar:'منتهي', en:'Expired', tag:'red' }, disabled:{ ar:'متوقف', en:'Disabled', tag:'' },
    draft:{ ar:'مسودة', en:'Draft', tag:'' }
  };
  var MONTHS = {
    ar:['يناير','فبراير','مارس','أبريل','مايو','يونيو','يوليو','أغسطس','سبتمبر','أكتوبر','نوفمبر','ديسمبر'],
    en:['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec']
  };

  var st = { tab:'analytics', preset:'last30', from:'', to:'', report:null, by:'product', q:'', ostatus:'all', period:null };
  /* M: range analytics · INV: current stock · PER: accounting months (RAFSettlement) */
  var M = null, INV = null, PER = null, ERR = null, loading = true;
  var MONTHS_FULL_EN = ['January','February','March','April','May','June','July','August','September','October','November','December'];

  /* ---------- helpers ---------- */
  function root(){ return document.getElementById('htmlRoot'); }
  function isEn(){ return root().lang === 'en'; }
  function T(ar,en){ return isEn() ? en : ar; }
  function L(o){ return (o && typeof o==='object') ? (isEn()?(o.en||o.ar):(o.ar||o.en)) : (o||''); }
  function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
  function el(id){ return document.getElementById(id); }
  function fmt(f){ return RAFWallet.format(f); }
  function money(f, sign){
    var neg = f < 0 || sign === '-';
    return '<span class="af-num">' + (neg && f !== 0 ? '−' : '') + fmt(Math.abs(f)) + '</span> <span class="af-cur">' + T('د.ك','KWD') + '</span>';
  }
  function int(n){ return '<span class="af-num">' + String(n) + '</span>'; }
  function day(iso){
    if (!iso) return '—';
    var m = MONTHS[isEn()?'en':'ar'][+iso.slice(5,7)-1];
    return (+iso.slice(8,10)) + ' ' + m + (iso.slice(0,4) !== (M ? M.range.today.slice(0,4) : '') ? ' ' + iso.slice(0,4) : '');
  }
  function month(key){ return MONTHS[isEn()?'en':'ar'][+key.slice(5,7)-1] + ' ' + key.slice(0,4); }
  function bucketLabel(b){ return b.monthly ? month(b.key) : day(b.key); }
  /* accounting months */
  function periodLabel(p){ return (isEn() ? MONTHS_FULL_EN : MONTHS.ar)[+p.slice(5,7)-1] + ' ' + p.slice(0,4); }
  function periodStatusText(s){
    return s === 'open'    ? T('مفتوح','Open')
         : s === 'settled' ? T('مُسوّى','Settled')
         : s === 'closed'  ? T('مغلق — طلبات تحتاج مراجعة','Closed — orders need review')
         :                   T('لا نشاط','No activity');
  }
  function periodTag(s){
    var c = s === 'settled' ? 'green' : s === 'open' ? 'gold' : s === 'closed' ? 'amber' : '';
    return '<span class="af-tag '+c+'">'+esc(periodStatusText(s))+'</span>';
  }
  function payoutText(){ return T('غير متاح — نظام التحويلات غير مُعدّ','Unavailable — payout system not configured'); }
  function payoutTag(){ return '<span class="af-tag">'+esc(T('التحويل غير متاح','Payout unavailable'))+'</span>'; }
  function rateText(bp){ return (bp / 100).toFixed(2).replace(/\.?0+$/, ''); }
  function selectedPeriod(){
    if (!PER || !PER.ok) return null;
    var p = st.period || PER.current;
    return PER.periods.filter(function(x){ return x.period === p; })[0] || PER.periods[0];
  }
  function periodPicker(){
    var S = selectedPeriod();
    return '<div class="af-sel"><select onchange="setPeriod(this.value)" aria-label="accounting month">'
      + PER.periods.map(function(p){ return '<option value="'+p.period+'"'+(S && p.period === S.period ? ' selected' : '')+'>'
          + esc(periodLabel(p.period)) + '</option>'; }).join('')
      + '</select><i class="ti ti-chevron-down"></i></div>';
  }
  function usesRange(){
    return !(st.tab === 'payouts' || st.tab === 'finance'
             || (st.tab === 'reports' && (st.report === 'inventory' || st.report === 'monthly')));
  }
  function catLabel(c){ return c && c.label ? L(c.label) : T('غير مصنّف','Uncategorised'); }
  function stTag(s){ var x = STATUS[s] || { ar:s, en:s, tag:'' }; return '<span class="af-tag '+x.tag+'">'+esc(T(x.ar,x.en))+'</span>'; }

  function savePrefs(){
    try { localStorage.setItem(PREF, JSON.stringify({ tab:st.tab, preset:st.preset, from:st.from, to:st.to,
      report:st.report, by:st.by })); } catch(e){}
  }
  function loadPrefs(){
    try {
      var p = JSON.parse(localStorage.getItem(PREF) || 'null');
      if (!p) return;
      if (TABS.some(function(t){ return t.k === p.tab; })) st.tab = p.tab;
      if (PRESETS.some(function(x){ return x.k === p.preset; })) st.preset = p.preset;
      if (typeof p.from === 'string') st.from = p.from;
      if (typeof p.to === 'string') st.to = p.to;
      if (REPORTS.some(function(r){ return r.k === p.report; })) st.report = p.report;
      if (['product','category','date'].indexOf(p.by) > -1) st.by = p.by;
    } catch(e){}
  }

  /* ---------- data ---------- */
  function compute(){
    ERR = null;
    try {
      M = A.build({ range:{ preset:st.preset, from:st.from, to:st.to } });
      INV = A.inventory();
      PER = window.RAFSettlement ? RAFSettlement.periods() : null;
    } catch(e){
      M = null; INV = null; PER = null;
      ERR = { code:'ERROR', message:String(e && e.message || e) };
    }
    loading = false;
  }

  /* ---------- chrome ---------- */
  function renderTabs(){
    el('tabs').innerHTML = TABS.map(function(t){
      var on = st.tab === t.k;
      return '<button role="tab" id="tab-'+t.k+'" aria-controls="panel" aria-selected="'+on+'" tabindex="'+(on?0:-1)+'"'
        + ' onclick="setTab(\''+t.k+'\')"><i class="ti '+t.ic+'"></i>'+esc(T(t.ar,t.en))+'</button>';
    }).join('');
    el('panel').setAttribute('aria-labelledby', 'tab-' + st.tab);
  }
  function renderBar(){
    el('fRange').innerHTML = PRESETS.map(function(p){
      return '<option value="'+p.k+'"'+(p.k===st.preset?' selected':'')+'>'+esc(T(p.ar,p.en))+'</option>';
    }).join('');
    el('custom').hidden = st.preset !== 'custom';
    if (st.preset === 'custom'){ el('fFrom').value = st.from; el('fTo').value = st.to; }
    /* finance and the monthly report work in accounting months; payouts and
       current stock have no date range at all */
    el('bar').hidden = !usesRange();
    var note = '';
    if (M && M.ok){
      var r = M.range;
      note = '<i class="ti ti-calendar"></i>' + esc(r.from === r.to ? day(r.from) : day(r.from) + ' – ' + day(r.to))
           + ' · ' + esc(T('بتوقيت الكويت، حسب تاريخ الطلب','Kuwait time, by order date'));
    } else if (M && M.code === 'INVALID_RANGE'){
      note = '<span class="af-rerr">' + esc(M.message) + '</span>';
    }
    el('rangeNote').innerHTML = note;
  }

  function render(){
    renderTabs(); renderBar();
    var P = el('panel');
    if (loading){ P.setAttribute('aria-busy','true'); P.innerHTML = skeleton(); return; }
    P.removeAttribute('aria-busy');
    if (ERR){ P.innerHTML = errorState(ERR.message); return; }
    if (M && !M.ok && (usesRange() || M.code !== 'INVALID_RANGE')){
      P.innerHTML = M.code === 'INVALID_RANGE'
        ? empty('ti-calendar-x', T('نطاق التاريخ غير صالح','That date range isn’t valid'),
                T('اختر تاريخ بداية لا يتجاوز تاريخ النهاية.','Pick a start date on or before the end date.'))
        : errorState(M.message);
      return;
    }
    var f = { analytics:renderAnalytics, sales:renderSales, reports:renderReports,
              finance:renderFinance, payouts:renderPayouts }[st.tab];
    P.innerHTML = f();
  }

  function skeleton(){
    return '<div class="af-stack">'
      + '<div class="af-skel" style="height:24px;width:40%"></div>'
      + '<div class="af-kpis">' + [1,2,3,4].map(function(){ return '<div class="af-skel" style="height:86px"></div>'; }).join('') + '</div>'
      + '<div class="af-skel" style="height:250px"></div></div>';
  }
  function empty(ic, title, text, action){
    return '<div class="af-empty"><i class="ti '+ic+'"></i><b>'+esc(title)+'</b><span>'+esc(text)+'</span>'
      + (action || '') + '</div>';
  }
  function errorState(msg){
    return '<div class="af-empty err"><i class="ti ti-alert-triangle"></i><b>'
      + esc(T('تعذّر تحميل البيانات','The figures could not be loaded')) + '</b><span>' + esc(msg || '') + '</span>'
      + '<button class="af-btn" onclick="refreshAll()"><i class="ti ti-refresh"></i>' + esc(T('إعادة المحاولة','Try again')) + '</button></div>';
  }
  function question(ic, ar, en){ return '<div class="af-q"><i class="ti '+ic+'"></i><h2>'+esc(T(ar,en))+'</h2></div>'; }
  function noOrders(){
    var act = st.preset !== 'last30'
      ? '<button class="af-btn" onclick="setPreset(\'last30\')"><i class="ti ti-calendar"></i>'+esc(T('عرض آخر 30 يومًا','Show the last 30 days'))+'</button>'
      : '';
    return empty('ti-receipt-off', T('لا توجد طلبات في هذه الفترة','No orders in this period'),
      T('ستظهر الأرقام هنا بمجرد وصول طلبات إلى متجرك. لا نعرض أي أرقام تقديرية.',
        'Figures appear here as soon as your store receives orders. Nothing is estimated.'), act);
  }
  function qualityNote(){
    var q = M.quality, out = '';
    if (q.undated) out += '<div class="af-foot"><i class="ti ti-info-circle"></i><span>'
      + esc(T(q.undated + ' طلب لا يحمل وقت إتمام مسجّل، لذلك لا يدخل في أي نطاق تاريخ.',
              q.undated + ' order(s) have no recorded checkout time, so they can’t be placed in a date range.')) + '</span></div>';
    if (q.withIssues) out += '<div class="af-foot"><i class="ti ti-alert-circle"></i><span>'
      + esc(T(q.withIssues + ' طلب بقيم سطور غير مكتملة في سجلّه.',
              q.withIssues + ' order(s) have incomplete line values in their record.')) + '</span></div>';
    return out;
  }

  /* ---------- chart ---------- */
  function chart(list){
    var n = list.length;
    if (!n) return '';
    var max = 0;
    list.forEach(function(b){ if (b.net > max) max = b.net; });
    var W = 600, H = 170, step = W / n, bw = Math.max(1.5, step * 0.62), rtl = !isEn();
    var bars = list.map(function(b, i){
      var h = max > 0 ? Math.max(b.net > 0 ? 2 : 0, (b.net / max) * (H - 8)) : 0;
      var x = rtl ? W - (i + 1) * step + (step - bw) / 2 : i * step + (step - bw) / 2;
      return '<rect class="bar" x="'+x.toFixed(2)+'" y="'+(H - h).toFixed(2)+'" width="'+bw.toFixed(2)+'" height="'+h.toFixed(2)+'" rx="2">'
        + '<title>'+esc(bucketLabel(b) + ' · ' + fmt(b.net) + ' ' + T('د.ك','KWD') + ' · ' + b.orders + ' ' + T('طلب','orders'))+'</title></rect>';
    }).join('');
    var first = bucketLabel(list[0]), last = bucketLabel(list[n-1]);
    return '<div class="af-chart">'
      + '<div class="af-ymax">' + T('الأعلى: ','Peak: ') + money(max) + '</div>'
      + '<svg viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="none" role="img" aria-label="'
      + esc(T('صافي المبيعات حسب ','Net sales by ') + (list[0].monthly ? T('الشهر','month') : T('اليوم','day'))) + '">'
      + bars + '<line class="base" x1="0" y1="'+H+'" x2="'+W+'" y2="'+H+'"/></svg>'
      + '<div class="af-axis"><span>'+esc(first)+'</span>'+(n > 2 ? '<span>'+esc(bucketLabel(list[Math.floor(n/2)]))+'</span>' : '')
      + '<span>'+esc(last)+'</span></div></div>';
  }
  function trendCard(){
    var s = M.summary;
    return '<div class="af-card"><div class="af-card-h"><i class="ti ti-chart-bar"></i><b>'
      + esc(T('صافي المبيعات','Net sales')) + '</b><span class="sp"></span><em>'
      + esc(M.trend.length && M.trend[0].monthly ? T('شهريًا','Monthly') : T('يوميًا','Daily')) + '</em></div>'
      + (s.orders ? chart(M.trend) : '<div class="af-muted"><i class="ti ti-info-circle"></i>'
        + esc(T('لا مبيعات في هذه الفترة.','No sales in this period.')) + '</div>')
      + '</div>';
  }

  /* ════════════════════ ANALYTICS ════════════════════ */
  function renderAnalytics(){
    var s = M.summary;
    var head = question('ti-chart-line','كيف يؤدي متجري؟','How is my store performing?');
    if (!M.status.total) return head + noOrders() + qualityNote();

    var kpis = '<div class="af-kpis">'
      + '<div class="af-kpi lead"><span>'+esc(T('صافي المبيعات','Net sales'))+'</span><b>'+money(s.net)+'</b>'
        + '<small>'+esc(T('بعد الخصومات والمبالغ المستردة','After discounts and refunds'))+'</small></div>'
      + '<div class="af-kpi"><span>'+esc(T('الطلبات','Orders'))+'</span><b>'+int(s.orders)+'</b>'
        + (M.status.cancelled ? '<small>'+esc(T('+ '+M.status.cancelled+' ملغي','+ '+M.status.cancelled+' cancelled'))+'</small>' : '') + '</div>'

      + '<span class="op">−</span><span>'+esc(T('المستردات','Refunds'))+' <b>'+money(s.refund)+'</b></span>'
      + '<span class="op">=</span><span>'+esc(T('الصافي','Net'))+' <b>'+money(s.net)+'</b></span></div>';

    var ins = [];

    var top = M.byProduct.filter(function(p){ return p.units > 0; }).slice()

      + top.map(function(p,i){ return '<div class="af-li"><span class="rk">'+(i+1)+'</span><div class="nm"><b>'
        + esc(L(p.name))+'</b><em>'+esc(catLabel(p.category ? { label:catById(p.category) } : null))+'</em></div>'
        + '<div class="vl">'+int(p.units)+' '+esc(T('قطعة','units'))+'<div class="af-muted">'+money(p.net)+'</div></div></div>'; }).join('')
      + '</div></div>');
    /* categories */
    var cats = M.byCategory.filter(function(c){ return c.net > 0; }).slice(0,5);
    if (cats.length){
      var cmax = cats[0].net;
      ins.push('<div class="af-card"><div class="af-card-h"><i class="ti ti-category"></i><b>'
        + esc(T('أعلى الفئات','Top categories'))+'</b></div><div class="af-list">'
        + cats.map(function(c){ return '<div class="af-li" style="display:block"><div style="display:flex;gap:10px;align-items:center">'
          + '<div class="nm"><b>'+esc(catLabel(c))+'</b></div><div class="vl">'+money(c.net)+'</div></div>'
          + '<div class="af-meter"><span style="width:'+Math.max(3, Math.round(c.net / cmax * 100))+'%"></span></div></div>'; }).join('')
        + '</div></div>');
    }
    /* order status */
    var S = M.status;
    ins.push('<div class="af-card"><div class="af-card-h"><i class="ti ti-clipboard-list"></i><b>'
      + esc(T('حالة الطلبات','Order status'))+'</b><span class="sp"></span><em>'+esc(T(S.total+' طلب',S.total+' orders'))+'</em></div>'
      + '<div class="af-seg">' + ['awaiting','progress','delivered','cancelled'].map(function(k){
          return S[k] ? '<span class="c-'+k+'" style="width:'+(S[k] / S.total * 100)+'%"></span>' : ''; }).join('') + '</div>'
      + '<div class="af-legend">' + ['awaiting','progress','delivered','cancelled'].map(function(k){
          return '<div><i class="c-'+k+'"></i>'+esc(T(STATUS[k].ar,STATUS[k].en))+'<b class="af-num">'+S[k]+'</b></div>'; }).join('')
      + '</div></div>');
    /* promotions — only when a promotion actually produced a discount */
    var mk = M.marketing;
    if (s.promotion > 0){
      var best = mk.promotions.filter(function(p){ return p.discount > 0; })[0];
      ins.push('<div class="af-card"><div class="af-card-h"><i class="ti ti-rosette-discount"></i><b>'
        + esc(T('أداء العروض','Promotion performance'))+'</b></div><div class="af-stmt">'

  function cellValue(c, r){ return c.get ? c.get(r) : r[c.k]; }
  function totalsRow(cols){
    return function(rows){
      var any = cols.some(function(c){ return c.money || c.total; });
      if (!any || rows.length < 2) return null;
      var o = {};
      cols.forEach(function(c){
        if (c.money || c.total) o[c.k] = rows.reduce(function(s, r){ var v = cellValue(c, r); return s + (typeof v === 'number' ? v : 0); }, 0);
      });
      return o;
    };
  }
  function table(cols, rows, totalsFn){
    var vis = cols.filter(function(c){ return !c.csvOnly; });
    if (!rows.length) return '<div class="af-muted" style="padding:10px 0"><i class="ti ti-info-circle"></i>'
      + esc(T('لا توجد بيانات في هذا النطاق.','No data in this range.')) + '</div>';
    function td(c, r, isTotal){
      var lab = esc(T(c.ar, c.en));
      if (isTotal){
        if (c.lead) return '<td class="lead" data-label="'+lab+'">'+esc(T('الإجمالي','Total'))+'</td>';
        if (r[c.k] === undefined) return '<td data-label="'+lab+'"></td>';
        return '<td class="n" data-label="'+lab+'">'+(c.money ? money(r[c.k]) : int(r[c.k]))+'</td>';
      }
      var v = cellValue(c, r), h;
      if (c.html) h = c.html(r);
      else if (c.money) h = money(v);
      else if (c.num && typeof v === 'number') h = int(v);
      else h = esc(v == null ? '—' : v);
      if (c.lead) return '<td class="lead" data-label="'+lab+'"><b>'+h+'</b>'+(c.sub ? '<span class="sub af-num">'+esc(c.sub(r))+'</span>' : '')+'</td>';
      return '<td class="'+(c.num ? 'n' : '')+'" data-label="'+lab+'">'+h+'</td>';
    }
    var tot = totalsFn ? totalsFn(rows) : null;
    return '<div class="af-tw"><table class="af-t"><thead><tr>'
      + vis.map(function(c){ return '<th class="'+(c.num?'n':'')+'">'+esc(T(c.ar,c.en))+'</th>'; }).join('')
      + '</tr></thead><tbody>'
      + rows.map(function(r){ return '<tr>' + vis.map(function(c){ return td(c, r); }).join('') + '</tr>'; }).join('')
      + '</tbody>' + (tot ? '<tfoot><tr>' + vis.map(function(c){ return td(c, tot, true); }).join('') + '</tr></tfoot>' : '')
      + '</table></div>';
  }

  /* ════════════════════ REPORTS ════════════════════ */
  function reportData(k){
    if (k === 'sales')    return { cols:COLS.sales(), rows:M.trend.slice().reverse(), totals:totalsRow(COLS.sales()) };
    if (k === 'products') return { cols:COLS.products(), rows:M.byProduct, totals:totalsRow(COLS.products()) };
    if (k === 'orders'){
      var rows = M.orders.filter(function(o){ return st.ostatus === 'all' || o.status === st.ostatus; });
      return { cols:COLS.orders(), rows:rows, totals:null };
    }
    if (k === 'inventory'){
      if (!INV || !INV.ok) return { cols:COLS.inventory(), rows:[], error:INV && INV.message };
      var flat = [];
      INV.rows.forEach(function(r){
        if (r.mode === 'combination' && r.combos.length){
          r.combos.forEach(function(c){ flat.push({ id:r.id, name:r.name, mode:r.mode, combo:c.label,
            onHand:c.onHand, reserved:c.reserved, available:c.available }); });
        } else flat.push({ id:r.id, name:r.name, mode:r.mode, combo:null, onHand:r.onHand, reserved:r.reserved, available:r.available });
      });
      return { cols:COLS.inventory(), rows:flat, totals:totalsRow(COLS.inventory()) };
    }
    if (k === 'marketing'){
      var mk = M.marketing, out = [];
      mk.promotions.forEach(function(p){
        var s = PSTATE[p.status] || { ar:p.status, en:p.status };
        out.push({ type:T('عرض','Promotion'), name:L(p.name) || T('عرض','Promotion'),
          detail:p.value + '% · ' + p.startDate + ' → ' + p.endDate, status:T(s.ar,s.en),
          orders:p.orders, discount:p.discount, net:p.net });
      });
      if (mk.promotionUnattributed.discount) out.push({ type:T('عرض','Promotion'),
        name:T('عرض غير محدد','Promotion not identified'), detail:T('لم يمكن ربط الخصم بعرض واحد بعينه','The discount could not be tied to a single promotion'),
        status:'—', orders:mk.promotionUnattributed.orders, discount:mk.promotionUnattributed.discount, net:null });
      mk.coupons.forEach(function(c){
        out.push({ type:T('كوبون','Coupon'), name:c.code, detail:(L(c.name) || '') + (c.platform ? ' · ' + T('كوبون رف','RAF coupon') : ''),
          status:'—', orders:c.orders, discount:c.discount, net:c.net });
      });
      mk.ads.forEach(function(a){
        var s = PSTATE[a.status] || { ar:a.status, en:a.status };
        out.push({ type:T('إعلان','Advertisement'), name:L(a.title) || T('إعلان','Advertisement'),
          detail:T('الأداء غير مُتتبَّع','Performance not tracked'), status:T(s.ar,s.en), orders:null, discount:null, net:null });
      });
      return { cols:COLS.marketing(), rows:out, totals:null, nullable:true };
    }
    if (k === 'monthly'){
      var S = selectedPeriod();
      if (!S) return { cols:COLS.finance(), rows:[], error:(PER && PER.message) || T('تعذّر تحميل الفترات المحاسبية','Accounting periods could not be loaded') };
      var sections = [
        { title:T('تفاصيل التسوية حسب الطلب','Settlement details by order'), cols:COLS.settleOrders(),
          rows:S.orders || [], totals:totalsRow(COLS.settleOrders()) },
        { title:T('تعديلات على أشهر سابقة','Adjustments to earlier months'), cols:COLS.adjustments(),
          rows:S.adjustments || [], totals:totalsRow(COLS.adjustments()) }
      ];
      /* the very rows the Finance statement renders — one source, so screen,
         report and export can only ever agree */
      return { cols:COLS.finance(), rows:statementRows(S), totals:null, period:S, sections:sections,
               after:sections.map(function(sec){
                 return sec.rows.length ? '<h4 class="af-subh">'+esc(sec.title)+'</h4>' + table(sec.cols, sec.rows, sec.totals) : '';
               }).join('') };
    }
    if (k === 'finance') return { cols:COLS.finance(), rows:financeRows(), totals:null };
    return { cols:[], rows:[] };
  }
  function financeRows(){
    var s = M.summary;
    function r(ar, en, f, sign){ return { label:T(ar,en), text:(sign === '-' && f ? '-' : '') + fmt(f), html:money(f, sign) }; }
    var rows = [
      r('إجمالي المبيعات','Gross sales', s.gross),
      r('خصومات يموّلها المتجر','Merchant-funded discounts', s.merchantDiscount, '-'),
      r('خصومات تموّلها رف','RAF-funded discounts', s.rafDiscount, '-')
    ];
    if (s.fundingUnknown) rows.push(r('خصومات تمويلها غير مسجّل','Discounts, funding not recorded', s.fundingUnknown, '-'));
    rows.push(r('المبالغ المستردة للعملاء','Refunded to customers', s.refund, '-'));
    rows.push(r('صافي المبيعات','Net sales', s.net));
    return rows;
  }

  /* ---------- one accounting month, exactly as RAFSettlement reports it ---------- */
  function srow(ar, en, v, o){
    o = o || {};
    var txt = v == null ? '—' : ((o.minus && v > 0) ? '-' + fmt(v) : fmt(v));
    var htm = v == null ? '—' : money(v, o.minus ? '-' : null);
    return { label:T(ar,en), text:txt, html:htm, total:!!o.total, note:o.note || null,
             hint:o.hint || null, group:o.group || null };
  }
  /* THE monthly statement. Finance renders these rows, the Monthly report
     tabulates them and the CSV writes them — so the three always agree. Every
     value is RAFSettlement's; nothing here calculates. */
  function statementRows(S){
    var f = S.figures, rows = [];
    var pct = S.rate ? S.rate.percent : null;
    /* 1 · commission base */
    rows.push(srow('إجمالي المبيعات','Gross sales', f.gross, { group:'base' }));
    rows.push(srow('خصومات يموّلها المتجر','Merchant-funded discounts', f.merchantDiscount, { minus:true, group:'base' }));
    if (f.removedValue) rows.push(srow('بضاعة أُزيلت أو استُبدلت بموافقة العميل','Goods removed or replaced with customer approval',
                                       f.removedValue, { minus:true, group:'base' }));
    rows.push(srow('المبيعات الخاضعة للعمولة','Commissionable sales', f.commissionable, { total:true, group:'base' }));
    /* 2 · RAF commission */
    rows.push({ label:T('نسبة عمولة رف','RAF commission rate'), text:pct === null ? '—' : pct + '%',
                html:'<span class="af-num">' + (pct === null ? '—' : pct + '%') + '</span>', group:'commission' });
    rows.push(srow('عمولة رف','RAF commission', f.commission,
      { minus:true, group:'commission',
        note:pct === null || f.commission == null ? null : fmt(f.commissionable) + ' × ' + pct + '% = ' + fmt(f.commission) }));
    /* 3 · merchant entitlement */
    rows.push(srow('مستحقات المتجر','Merchant entitlement', f.entitlement,
      { total:true, group:'entitlement',
        note:f.commission == null ? null : fmt(f.commissionable) + ' − ' + fmt(f.commission) + ' = ' + fmt(f.entitlement) }));
    if (S.adjustments && S.adjustments.length) {
      rows.push(srow('تعديلات على أشهر سابقة','Adjustments to earlier months', S.adjustmentsTotal.entitlement, { group:'entitlement' }));
      rows.push(srow(S.status === 'open' ? 'مبلغ التسوية حتى الآن' : 'مبلغ التسوية',
                     S.status === 'open' ? 'Settlement so far' : 'Settlement amount', S.settlementAmount, { total:true, group:'entitlement' }));
    }
    /* outside the base: RAF pays these, the merchant does not */
    rows.push(srow('خصومات تموّلها رف','RAF-funded discounts', f.rafBorne,
      { group:'raf', hint:T('تتحملها رف — لا تُخفّض أساس العمولة ولا مستحقاتك.','Paid by RAF — they do not reduce the commission base or your entitlement.') }));
    /* status */
    rows.push({ label:T('حالة التسوية','Settlement status'), text:periodStatusText(S.status), html:periodTag(S.status), group:'status' });
    rows.push({ label:T('حالة التحويل','Payout status'), text:payoutText(),
                html:'<span class="af-na">' + esc(payoutText()) + '</span>', group:'status' });
    return rows;
  }

  /* export: exactly the rows on screen, built from the same store-scoped model */
  function csvCell(v){
    if (v == null) return '';
    var s = String(v);
    return /[",\n\r]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
  }
  function reportCanExport(){
    if (st.report === 'inventory') return !!(INV && INV.canExport);
    if (st.report === 'monthly')   return !!(PER && PER.ok && PER.canExport);
    return !!(M && M.ok && M.canExport);
  }
  /* one table as CSV — the same columns, rows and totals row the screen shows */
  function csvSection(cols, rows, totalsFn){
    function val(c, r){
      var v = c.csv ? c.csv(r) : cellValue(c, r);
      if (c.k === '_v' && r.text !== undefined) v = r.text;
      if (c.money && typeof v === 'number') v = fmt(v);
      return csvCell(v);
    }
    var out = [cols.map(function(c){ return csvCell(T(c.ar, c.en)); }).join(',')];
    rows.forEach(function(r){ out.push(cols.map(function(c){ return val(c, r); }).join(',')); });
    var tot = totalsFn ? totalsFn(rows) : null;
    if (tot) out.push(cols.map(function(c){
      if (c.lead) return csvCell(T('الإجمالي','Total'));
      if (tot[c.k] === undefined) return '';
      return csvCell(c.money ? fmt(tot[c.k]) : tot[c.k]);
    }).join(','));
    return out;
  }
  window.exportReport = function(){
    if (!st.report) return;
    if (!reportCanExport()){ toast(T('لا تملك صلاحية التصدير','You do not have permission to export')); return; }
    var ctx = A.context(); if (!ctx.ok) return;
    var d = reportData(st.report);
    if (d.error) return;
    var lines = csvSection(d.cols, d.rows, d.totals);
    (d.sections || []).forEach(function(sec){
      if (!sec.rows.length) return;
      lines.push(''); lines.push(csvCell(sec.title));
      lines = lines.concat(csvSection(sec.cols, sec.rows, sec.totals));
    });
    var suffix = st.report === 'monthly' ? d.period.period
               : st.report === 'inventory' ? RAFMarketing.todayISO()
               : M.range.from + '_' + M.range.to;
    var name = 'raf-' + ctx.slug + '-' + st.report + '-' + suffix + '.csv';
    /* the byte-order mark lets spreadsheet apps read the Arabic text correctly */
    var blob = new Blob([String.fromCharCode(0xFEFF) + lines.join('\r\n')], { type:'text/csv;charset=utf-8' });
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob); a.download = name;
    document.body.appendChild(a); a.click();
    setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); }, 0);
    toast(T('تم تجهيز الملف','File ready'));
  };

    });
    el('langLabel').textContent = en ? 'ع' : 'EN';
    document.title = en ? 'RAF — Analytics & Finance' : 'رف — التحليلات والمالية';
  }

  /* tabs: arrow keys move between them */
  document.addEventListener('keydown', function(e){
    if (!e.target || !e.target.closest || !e.target.closest('#tabs')) return;
    if (e.key !== 'ArrowLeft' && e.key !== 'ArrowRight') return;
    var i = TABS.findIndex(function(t){ return t.k === st.tab; });
    var fwd = (e.key === 'ArrowLeft') === !isEn();
    var n = (i + (fwd ? 1 : -1) + TABS.length) % TABS.length;
    e.preventDefault(); setTab(TABS[n].k);
  });

  /* ---------- live: recalculated from the authorities whenever they change ---------- */
  var liveTimer = null;
  function scheduleLive(){
    clearTimeout(liveTimer);
    liveTimer = setTimeout(function(){ compute(); render(); }, 150);
  }

  function gate(title, text){
    el('gate').style.display = '';
    el('gateT').textContent = title;
    el('gateP').textContent = text;
  }
  function boot(){
    var l = null; try { l = localStorage.getItem('raf_lang'); } catch(e){}
    if (l === 'en'){ root().lang = 'en'; root().dir = 'ltr'; }
    applyLang();

    if (!A){ gate(T('تعذّر التحميل','Could not load'), T('تعذّر تحميل وحدة التحليلات.','The analytics module could not be loaded.')); return; }
    var ctx = A.context();
    if (!ctx.ok){
      if (ctx.code === 'FORBIDDEN')
        gate(T('لا تملك صلاحية عرض التحليلات والمالية','You do not have permission to view Analytics & Finance'),
             T('يتم التحكم بالصلاحيات من نظام صلاحيات رف.','Access is controlled by the RAF permission system.'));
      else if (ctx.code === 'NO_STORE' || ctx.code === 'STORE_NOT_FOUND')
        gate(ctx.code === 'STORE_NOT_FOUND' ? T('المتجر المرتبط غير موجود','Linked store not found')
                                            : T('لا يوجد متجر مرتبط بالحساب','No store linked to this account'),
             T('لم يتم ربط هذا الحساب بمتجر. يتم الربط يدوياً ولا يُخمَّن تلقائياً.',
               'This account is not linked to a store. Links are set explicitly and never inferred.'));
      else gate(T('تعذّر الوصول إلى بيانات رف','RAF data could not be reached'), ctx.message || '');
      return;
    }
    loadPrefs();
    el('shell').style.display = '';
    el('stName').textContent = L(ctx.store.name);
    if (ctx.store.logo){ var lg = el('stLogo'); lg.style.backgroundImage = "url('"+ctx.store.logo+"')"; lg.innerHTML = ''; }

    render();                                   /* skeleton first */
    setTimeout(function(){ compute(); render(); }, 30);
    try { RAFPerm.enforce(); } catch(e){}

    ['raf:order','raf:snapshot','raf:inventory','raf:marketing','raf:source','raf:settlement'].forEach(function(ev){
      document.addEventListener(ev, scheduleLive);
    });
    /* another tab (a customer approving a change, a checkout) writes to storage */
    window.addEventListener('storage', function(e){
      if (!e.key || (e.key.indexOf('raf_') === 0 && e.key !== PREF && e.key !== 'raf_lang')) scheduleLive();
    });
    document.addEventListener('visibilitychange', function(){ if (!document.hidden) scheduleLive(); });
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot); else boot();
})();
</script>
</body>
</html>
