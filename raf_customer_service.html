<!DOCTYPE html>
<html id="htmlRoot" lang="ar" dir="rtl" data-ui="admin">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>رف — خدمة العملاء</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
<link rel="icon" type="image/png" sizes="64x64" href="raf_favicon.png">
<link rel="icon" type="image/png" sizes="32x32" href="raf_favicon_32.png">
<link rel="apple-touch-icon" href="raf_appicon.png">
<script src="raf_features.js"></script>
<script src="raf_config.js"></script>
<script src="raf_event_bus.js"></script>
<script src="raf_record_store.js"></script>
<script src="raf_notify_core.js"></script>
<link rel="stylesheet" href="raf_theme.css">
<style>
/* ══════════════════════════════════════════════════════════════════════
   RAF CUSTOMER SERVICE — a standalone case-handling interface.
   It uses RAF's admin design language (same tokens, same shell, logical
   properties so Arabic and English use one layout) and
   renders only what RAFCustomerService answers. It holds no ticket logic,
   no counts of its own and no state that bypasses the authority.
   ══════════════════════════════════════════════════════════════════════ */
:root{
  --bg:#F2F3F0; --surface:#FFFFFF; --surface-2:#F7F8F6; --line:#E1E4DF; --line-2:#CED3CC;
  --ink:#141917; --text:#29302D; --muted:#5F6965; --faint:#88918D;
  --nav:#141B26; --nav-2:#1D2634; --nav-3:#2A3647; --nav-text:#D6DCE4; --nav-muted:#8E99A8;
  --accent:#2C5FA8; --accent-2:#22497F; --accent-soft:#E6EDF8;
  --gold:#C9A84C;
  --new:#2D5B97;   --new-bg:#E5EDF8;
  --open:#1C7466;  --open-bg:#E2F0EC;
  --pend:#9A6414;  --pend-bg:#FBF0DA;
  --done:#2B7446;  --done-bg:#E3F1E7;
  --shut:#5F6965;  --shut-bg:#EDEFEC;
  --alert:#A8412D; --alert-bg:#FAE8E3;
  --r-sm:8px; --r:10px; --r-lg:14px;
  --shadow:0 1px 2px rgba(14,28,26,.05), 0 1px 1px rgba(14,28,26,.03);
  --shadow-pop:0 12px 32px rgba(14,28,26,.16);
  --head-h:64px; --nav-w:272px;
  --font:'Tajawal',system-ui,-apple-system,'Segoe UI',sans-serif;
}
html[lang="en"]{ --font:'DM Sans',system-ui,-apple-system,'Segoe UI',sans-serif; }
*{ box-sizing:border-box; }
html,body{ margin:0; }
body{ background:var(--bg); color:var(--text); font-family:var(--font); font-size:14px; line-height:1.5;
  -webkit-font-smoothing:antialiased; overflow-x:hidden; }
[hidden]{ display:none !important; }
button,input,select,textarea{ font:inherit; color:inherit; }
a{ color:inherit; }
:focus-visible{ outline:2px solid var(--accent); outline-offset:2px; }
bdi{ unicode-bidi:isolate; }
.sr-only{ position:absolute !important; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; border:0; }

/* ───────── shell ───────── */
.cs{ min-height:100vh; display:grid; grid-template-columns:var(--nav-w) minmax(0,1fr); }
.cs-main{ min-width:0; display:flex; flex-direction:column; }
.cs-nav{ background:var(--nav); color:var(--nav-text); display:flex; flex-direction:column; position:sticky; top:0; height:100vh; min-width:0; }
.cs-brand{ display:flex; align-items:center; gap:12px; padding:0 18px; height:var(--head-h); border-block-end:1px solid rgba(255,255,255,.06); flex-shrink:0; }
.cs-brand-mark{ width:36px; height:36px; border-radius:9px; background:var(--accent); color:#fff; display:grid; place-items:center; flex-shrink:0; position:relative; }
.cs-brand-mark i{ font-size:20px; }
.cs-brand-mark::after{ content:""; position:absolute; inset-inline-end:-3px; inset-block-end:-3px; width:10px; height:10px; border-radius:3px; background:var(--gold); border:2px solid var(--nav); }
.cs-brand-t{ min-width:0; line-height:1.2; }
.cs-brand-t b{ display:block; color:#fff; font-size:15px; font-weight:800; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.cs-brand-t span{ display:block; color:var(--nav-muted); font-size:11.5px; font-weight:600; }
.cs-nav-scroll{ flex:1; overflow-y:auto; padding:12px 10px 16px; overscroll-behavior:contain; }
.cs-nav ul{ list-style:none; margin:0; padding:0; }
.cs-nav a{ display:flex; align-items:center; gap:12px; min-height:46px; padding:0 12px; color:var(--nav-text); text-decoration:none;
  border-radius:var(--r-sm); font-size:14px; font-weight:600; margin-block-end:2px; }
.cs-nav a:hover{ background:var(--nav-2); color:#fff; }
.cs-nav a[aria-current="page"]{ background:var(--nav-2); color:#fff; box-shadow:inset 3px 0 0 var(--gold); }
[dir="rtl"] .cs-nav a[aria-current="page"]{ box-shadow:inset -3px 0 0 var(--gold); }
.cs-nav a > i{ font-size:19px; color:var(--nav-muted); width:20px; text-align:center; flex-shrink:0; }
.cs-nav a[aria-current="page"] > i{ color:var(--gold); }
.cs-nav a .n{ margin-inline-start:auto; min-width:22px; padding:0 6px; height:20px; border-radius:10px; background:var(--nav-3);
  color:#fff; font-size:11px; font-weight:700; display:inline-grid; place-items:center; font-family:'DM Sans',sans-serif; }
.cs-nav a .soon{ margin-inline-start:auto; font-size:10.5px; color:var(--nav-muted); font-weight:600; }

.cs-head{ position:sticky; top:0; z-index:40; height:var(--head-h); background:rgba(255,255,255,.93); backdrop-filter:blur(8px);
  -webkit-backdrop-filter:blur(8px); border-block-end:1px solid var(--line); display:flex; align-items:center; gap:10px; padding:0 20px; }
.ibtn{ width:44px; height:44px; min-height:44px; border-radius:var(--r); border:1px solid transparent; background:transparent; color:var(--muted);
  display:inline-grid; place-items:center; cursor:pointer; padding:0; position:relative; flex-shrink:0; }
.ibtn:hover{ background:var(--surface-2); border-color:var(--line); color:var(--ink); }
.ibtn i{ font-size:20px; }
.ibtn.lang{ width:auto; min-width:44px; padding:0 12px; font-weight:800; font-size:13px; color:var(--text); border-color:var(--line); }
.ibtn.cs-burger,.ibtn.cs-nav-x{ display:none; }
.cs-crumb{ min-width:0; flex:1; line-height:1.25; }
.cs-crumb small{ display:block; color:var(--faint); font-size:11.5px; font-weight:600; }
.cs-crumb b{ display:block; color:var(--ink); font-size:15px; font-weight:800; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.cs-tools{ display:flex; align-items:center; gap:6px; }
.cs-av{ width:32px; height:32px; border-radius:50%; background:var(--nav); color:#fff; display:grid; place-items:center; font-size:13px; font-weight:800; flex-shrink:0; }
.cs-user{ display:flex; align-items:center; gap:10px; min-height:44px; padding:0 8px; border-radius:var(--r); border:1px solid transparent; background:transparent; max-width:230px; }
.cs-user-t{ min-width:0; line-height:1.2; }
.cs-user-t b{ display:block; font-size:13px; color:var(--ink); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.cs-user-t span{ display:block; font-size:11.5px; color:var(--faint); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
/* sign out — labelled beside the account on desktop, icon-only on narrow screens */
.ibtn.signout{ width:auto; padding:0 14px; gap:7px; border-color:var(--line); color:var(--alert); font-size:13px; font-weight:700; }
.ibtn.signout:hover{ background:var(--alert-bg); border-color:transparent; color:var(--alert); }
.ibtn.signout .signout-t{ white-space:nowrap; }
.cs-content{ padding:24px; min-width:0; flex:1; }

/* ───────── pieces ───────── */
.card{ background:var(--surface); border:1px solid var(--line); border-radius:var(--r-lg); box-shadow:var(--shadow); padding:18px; margin-block-end:16px; }
.card > h2{ margin:0 0 14px; font-size:15px; color:var(--ink); font-weight:800; display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
.card > h2 i{ color:var(--accent); font-size:18px; }
.tiles{ display:grid; grid-template-columns:repeat(auto-fit,minmax(170px,1fr)); gap:12px; margin-block-end:16px; }
.tile{ background:var(--surface); border:1px solid var(--line); border-radius:var(--r-lg); padding:16px; box-shadow:var(--shadow); min-width:0; }
.tile .k{ display:block; color:var(--faint); font-size:12px; font-weight:700; margin-block-end:6px; }
.tile .v{ display:block; color:var(--ink); font-size:26px; font-weight:800; font-family:'DM Sans',sans-serif; line-height:1.1; }
.tile .s{ display:block; color:var(--muted); font-size:11.5px; margin-block-start:4px; }
.tile.na .v{ font-size:15px; color:var(--muted); font-family:var(--font); }
.badge{ display:inline-flex; align-items:center; gap:5px; padding:3px 10px; border-radius:999px; font-size:11.5px; font-weight:700; white-space:nowrap; }
.b-new{ background:var(--new-bg); color:var(--new); } .b-open{ background:var(--open-bg); color:var(--open); }
.b-pending{ background:var(--pend-bg); color:var(--pend); } .b-resolved{ background:var(--done-bg); color:var(--done); }
.b-closed{ background:var(--shut-bg); color:var(--shut); } .b-reopened{ background:var(--pend-bg); color:var(--pend); }
.b-esc{ background:var(--alert-bg); color:var(--alert); } .b-due{ background:var(--alert-bg); color:var(--alert); }
.b-plain{ background:var(--surface-2); color:var(--muted); border:1px solid var(--line); }
.btn{ display:inline-flex; align-items:center; justify-content:center; gap:7px; min-height:42px; padding:0 16px; border-radius:var(--r);
  border:1px solid var(--line-2); background:var(--surface); color:var(--ink); font-size:13.5px; font-weight:700; cursor:pointer; text-decoration:none; }
.btn:hover{ background:var(--surface-2); }
.btn.pri{ background:var(--accent); border-color:var(--accent); color:#fff; }
.btn.pri:hover{ background:var(--accent-2); }
.btn.danger{ color:var(--alert); border-color:var(--alert); }
.btn[disabled]{ opacity:.5; cursor:not-allowed; }
.btn.sm{ min-height:36px; padding:0 12px; font-size:12.5px; }
.row-actions{ display:flex; flex-wrap:wrap; gap:8px; }
.filters{ display:grid; grid-template-columns:repeat(auto-fit,minmax(160px,1fr)); gap:10px; margin-block-end:14px; }
.f label{ display:block; font-size:11.5px; font-weight:700; color:var(--faint); margin-block-end:4px; }
.f input,.f select,.f textarea{ width:100%; min-height:42px; padding:0 12px; border:1px solid var(--line-2); border-radius:var(--r);
  background:var(--surface); color:var(--ink); }
.f textarea{ min-height:96px; padding:10px 12px; line-height:1.6; resize:vertical; }
.tbl-wrap{ overflow-x:auto; -webkit-overflow-scrolling:touch; }
table{ width:100%; border-collapse:collapse; min-width:720px; }
th,td{ text-align:start; padding:11px 12px; border-block-end:1px solid var(--line); font-size:13px; vertical-align:top; }
th{ color:var(--faint); font-size:11.5px; font-weight:700; text-transform:uppercase; letter-spacing:.03em; white-space:nowrap; }
tbody tr:hover{ background:var(--surface-2); cursor:pointer; }
td .sub{ display:block; color:var(--faint); font-size:11.5px; margin-block-start:2px; }
.mono{ font-family:'DM Sans',ui-monospace,monospace; font-size:12px; }
.empty{ text-align:center; padding:40px 20px; color:var(--muted); }
.empty i{ display:block; font-size:34px; color:var(--line-2); margin-block-end:10px; }
.notice{ display:flex; gap:10px; padding:12px 14px; border-radius:var(--r); background:var(--surface-2); border:1px solid var(--line);
  color:var(--muted); font-size:12.5px; margin-block-end:14px; }
.notice i{ color:var(--accent); font-size:18px; flex-shrink:0; }
.notice.warn{ background:var(--alert-bg); border-color:transparent; color:var(--alert); }
.notice.warn i{ color:var(--alert); }
.kv{ display:flex; gap:10px; padding:7px 0; border-block-end:1px dashed var(--line); font-size:13px; }
.kv:last-child{ border-block-end:0; }
.kv .k{ color:var(--faint); min-width:130px; font-weight:600; flex-shrink:0; }
.kv .v{ color:var(--ink); min-width:0; word-break:break-word; }
.split{ display:grid; grid-template-columns:minmax(0,1.6fr) minmax(0,1fr); gap:16px; align-items:start; }
.thread{ display:flex; flex-direction:column; gap:10px; }
.msg{ border:1px solid var(--line); border-radius:var(--r-lg); padding:12px 14px; background:var(--surface-2); }
.msg.cust{ background:var(--accent-soft); border-color:transparent; }
.msg.internal{ background:#FFFBEF; border-color:#F0E4C2; }
.msg .meta{ display:flex; flex-wrap:wrap; gap:8px; align-items:center; font-size:11.5px; color:var(--faint); margin-block-end:6px; }
.msg .body{ color:var(--ink); font-size:13.5px; white-space:pre-wrap; word-break:break-word; }
.tl{ list-style:none; margin:0; padding:0; }
.tl li{ display:flex; gap:10px; padding:8px 0; border-block-end:1px dashed var(--line); font-size:12.5px; }
.tl li:last-child{ border-block-end:0; }
.tl .when{ color:var(--faint); white-space:nowrap; font-family:'DM Sans',sans-serif; font-size:11.5px; }
.chip-list{ display:flex; flex-wrap:wrap; gap:8px; }
.chip{ display:inline-flex; align-items:center; gap:6px; padding:5px 10px; border-radius:999px; border:1px solid var(--line);
  background:var(--surface-2); font-size:12px; color:var(--text); }
.gate{ min-height:100vh; display:grid; place-items:center; padding:24px; background:var(--bg); }
.gate-c{ width:min(440px,100%); background:var(--surface); border:1px solid var(--line); border-radius:var(--r-lg); box-shadow:var(--shadow); padding:32px 28px; text-align:center; }
.gate-c .ic{ width:52px; height:52px; border-radius:14px; margin-inline:auto; display:grid; place-items:center; background:var(--alert-bg); color:var(--alert); margin-block-end:14px; }
.gate-c .ic i{ font-size:26px; }
.gate-c h1{ margin:0 0 8px; font-size:19px; color:var(--ink); }
.gate-c p{ margin:0 0 20px; color:var(--muted); }
.scrim{ display:none; }
.toast{ position:fixed; inset-block-end:20px; inset-inline-start:50%; transform:translateX(50%); background:var(--nav); color:#fff;
  padding:12px 18px; border-radius:var(--r); font-size:13px; font-weight:600; z-index:90; max-width:min(440px,92vw); box-shadow:var(--shadow-pop); }
[dir="ltr"] .toast{ transform:translateX(-50%); }
.toast.bad{ background:var(--alert); }
dialog.modal{ border:0; padding:0; border-radius:var(--r-lg); width:min(560px,94vw); box-shadow:var(--shadow-pop); background:var(--surface); color:var(--text); }
dialog.modal::backdrop{ background:rgba(14,25,23,.45); }
.modal-in{ padding:20px; }
.modal-in h3{ margin:0 0 14px; font-size:16px; color:var(--ink); }
.modal-actions{ display:flex; gap:8px; justify-content:flex-end; margin-block-start:16px; flex-wrap:wrap; }

@media (max-width:1100px){ .split{ grid-template-columns:minmax(0,1fr); } }
@media (max-width:900px){
  .cs{ grid-template-columns:minmax(0,1fr); }
  .cs-nav{ position:fixed; top:0; bottom:0; inset-inline-start:0; width:min(300px,86vw); height:100%; z-index:80;
    transform:translateX(-105%); transition:transform .2s ease; visibility:hidden; }
  [dir="rtl"] .cs-nav{ transform:translateX(105%); }
  .cs.nav-open .cs-nav{ transform:none; visibility:visible; }
  .cs.nav-open .scrim{ display:block; position:fixed; inset:0; background:rgba(14,25,23,.4); z-index:70; }
  .ibtn.cs-burger,.ibtn.cs-nav-x{ display:inline-grid; }
  .ibtn.cs-nav-x{ color:var(--nav-text); margin-inline-start:auto; }
  .cs-content{ padding:16px; }
  .cs-head{ padding:0 12px; }
  .cs-user-t{ display:none; }
  /* icon only, but the label stays in the accessibility tree */
  .ibtn.signout{ width:44px; padding:0; }
  .ibtn.signout .signout-t{ position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; }
}
@media (max-width:520px){
  .cs-content{ padding:12px 16px; }
  .card{ padding:14px; }
  .tiles{ grid-template-columns:repeat(auto-fit,minmax(140px,1fr)); }
  .kv{ flex-direction:column; gap:2px; }
  .kv .k{ min-width:0; }
  .btn{ width:100%; }
  .row-actions .btn{ width:auto; flex:1 1 auto; }
}
@media (prefers-reduced-motion:reduce){ *{ transition:none !important; } }
</style>
</head>
<body>

<div class="gate" id="gate" hidden>
  <div class="gate-c" role="alert">
    <div class="ic"><i class="ti ti-shield-lock" aria-hidden="true"></i></div>
    <h1 id="gateT"></h1>
    <p id="gateP"></p>
    <a class="btn" href="raf_login.html"><i class="ti ti-login" aria-hidden="true"></i><span data-ar="تسجيل الدخول" data-en="Sign in">تسجيل الدخول</span></a>
  </div>
</div>

<div class="cs" id="shell" hidden>
  <aside class="cs-nav" id="csNav">
    <div class="cs-brand">
      <span class="cs-brand-mark" aria-hidden="true"><i class="ti ti-headset"></i></span>
      <span class="cs-brand-t"><b data-ar="خدمة العملاء" data-en="Customer Service">خدمة العملاء</b>
        <span data-ar="منصة رف" data-en="RAF platform">منصة رف</span></span>
      <button class="ibtn cs-nav-x" type="button" onclick="CS.closeNav()"><i class="ti ti-x" aria-hidden="true"></i></button>
    </div>
    <nav class="cs-nav-scroll" id="navTree"></nav>
  </aside>
  <div class="scrim" onclick="CS.closeNav()" aria-hidden="true"></div>

  <div class="cs-main">
    <header class="cs-head">
      <button class="ibtn cs-burger" type="button" aria-controls="csNav" onclick="CS.openNav()"><i class="ti ti-menu-2" aria-hidden="true"></i></button>
      <div class="cs-crumb"><small id="crumbGroup"></small><b id="crumbPage"></b></div>
      <div class="cs-tools">
        <button class="ibtn lang" type="button" id="langBtn" onclick="CS.toggleLang()"></button>
        <div class="cs-user"><span class="cs-av" id="userAv"></span>
          <span class="cs-user-t"><b id="userName"></b><span id="userRole"></span></span></div>
        <!-- the account area's sign-out: the shared RAFSignOut action -->
        <button class="ibtn signout" type="button" id="signOutBtn" onclick="RAFSignOut()">
          <i class="ti ti-logout" aria-hidden="true"></i>
          <span class="signout-t" data-ar="تسجيل الخروج" data-en="Sign Out">تسجيل الخروج</span>
        </button>
      </div>
    </header>
    <main class="cs-content" id="view" tabindex="-1"></main>
  </div>
</div>

<dialog class="modal" id="modal"><div class="modal-in" id="modalIn"></div></dialog>
<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

<script src="raf_source.js"></script>
<script src="raf_audit.js"></script>
<script src="raf_data.js"></script>
<script src="raf_order_snapshot.js"></script>
<script src="raf_order_engine.js"></script>
<script src="raf_permissions.js"></script>
<script src="raf_wallet.js"></script>
<script src="raf_compensation.js"></script>
<script src="raf_customer_service.js"></script>
<script>
/* ══════════════════════════════════════════════════════════════════════
   The Customer Service console. It renders what RAFCustomerService
   answers and nothing else: every count, list, action and permission
   comes from the authority, there is no local ticket state, no fabricated
   number and no action shown that the authority would refuse.
   ══════════════════════════════════════════════════════════════════════ */
var CS = (function(){
  'use strict';
  var SVC = window.RAFCustomerService;
  var ME = null, CAPS = null, route = { p:'dashboard', id:null }, BUSY = false;

  function root(){ return document.getElementById('htmlRoot'); }
  function isEn(){ return root().lang === 'en'; }
  function T(ar,en){ return isEn() ? en : ar; }
  function el(id){ return document.getElementById(id); }
  function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){
    return { '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]; }); }
  function L(o){ return o ? T(o.ar || o.en || '', o.en || o.ar || '') : ''; }
  function when(ts){
    if (!ts) return '—';
    var d = new Date(ts);
    return d.toLocaleString(isEn() ? 'en-GB' : 'ar-KW', { day:'2-digit', month:'2-digit', year:'numeric', hour:'2-digit', minute:'2-digit' });
  }
  function toast(msg, bad){
    var t = el('toast'); t.textContent = msg; t.classList.toggle('bad', !!bad); t.hidden = false;
    clearTimeout(t._h); t._h = setTimeout(function(){ t.hidden = true; }, 3600);
  }
  function initials(n){ return String(n || '?').trim().charAt(0).toUpperCase(); }

  /* ───────── navigation ───────── */
  var NAV = [
    { k:'dashboard', ic:'ti-layout-dashboard', ar:'لوحة المتابعة', en:'Dashboard' },
    { k:'customers', ic:'ti-users',            ar:'العملاء',        en:'Customers' },
    { k:'tickets',   ic:'ti-ticket',           ar:'التذاكر',        en:'Tickets' },
    { k:'mywork',    ic:'ti-user-check',       ar:'أعمالي',         en:'My Work' },
    { k:'followups', ic:'ti-clock-hour-4',     ar:'المتابعات',      en:'Follow-ups' },
    { k:'c360',      ic:'ti-id-badge-2',       ar:'ملف العميل 360', en:'Customer 360' },

  function pageOf(k){ for (var i=0;i<NAV.length;i++) if (NAV[i].k === k) return NAV[i]; return NAV[0]; }
  function parseHash(){
    var m = (location.hash || '').replace(/^#\/?/, '').split('?')[0].split('/');
    var q = (location.hash.split('?')[1] || '');
    var id = null;
    q.split('&').forEach(function(p){ var kv = p.split('='); if (kv[0] === 't') id = decodeURIComponent(kv[1] || ''); });
    return { p:pageOf(m[0] || 'dashboard').k, id:id };
  }
  function go(p, id){ location.hash = '#/' + p + (id ? '?t=' + encodeURIComponent(id) : ''); }

    var counts = {};

      var d = SVC.dashboard();
      if (d.ok) { counts.mywork = d.myOpen; counts.followups = d.followUpsOpen; }
      var all = SVC.listTickets({ active:true });
      if (all.ok) counts.tickets = all.items.length;
    } catch (e) {}
    el('navTree').innerHTML = '<ul>' + NAV.map(function(n){
      var badge = n.soon ? '<span class="soon">' + esc(T('غير مُهيأة','Not configured')) + '</span>'
                : (counts[n.k] ? '<span class="n">' + counts[n.k] + '</span>' : '');
      return '<li><a href="#/' + n.k + '"' + (route.p === n.k ? ' aria-current="page"' : '') + '>'
        + '<i class="ti ' + n.ic + '" aria-hidden="true"></i><span>' + esc(T(n.ar, n.en)) + '</span>' + badge + '</a></li>';

  function vCustomers(){
    var r = SVC.listTickets({});

    var by = {};

      var b = by[t.customerId] = by[t.customerId] || { id:t.customerId, total:0, open:0, last:0 };

  function vTicket(id){
    var r = SVC.getTicket(id, { full:true });
    if (!r.ok) return '<div class="card"><div class="notice warn"><i class="ti ti-alert-triangle"></i><span>' + esc(r.message) + '</span></div>'
      + '<button class="btn" onclick="CS.go(\'tickets\')"><i class="ti ti-arrow-back-up"></i>' + esc(T('عودة للتذاكر','Back to tickets')) + '</button></div>';
    var t = r.ticket, can = CAPS;
    var mine = t.assignedEmployeeId === ME.id;
    var acts = [];
    if (can.manage && !t.assignedEmployeeId && t.active) acts.push(btn('claim', 'ti-hand-click', T('استلام','Claim'), 'pri'));
    if (can.manage && t.status === 'new') acts.push(btn('open', 'ti-player-play', T('بدء المعالجة','Start work')));
    if (can.manage && t.status === 'open') acts.push(btn('pending', 'ti-player-pause', T('تعليق','Set pending')));
    if (can.manage && (t.status === 'pending' || t.status === 'reopened')) acts.push(btn('open', 'ti-player-play', T('استئناف','Resume')));
    if (can.resolve && t.status === 'open') acts.push(btn('resolve', 'ti-circle-check', T('حل التذكرة','Resolve'), 'pri'));
    if (can.resolve && t.status === 'resolved') acts.push(btn('close', 'ti-lock', T('إغلاق','Close')));
    if (can.resolve && t.status === 'closed') acts.push(btn('reopen', 'ti-lock-open', T('إعادة فتح','Reopen')));
    if (can.manage && t.active) acts.push(btn('transfer', 'ti-arrows-exchange', T('تحويل لقسم','Transfer')));
    if (can.escalate && t.active) acts.push(btn('escalate', 'ti-arrow-big-up-lines', T('تصعيد','Escalate'), 'danger'));
    if (can.manage && t.active) acts.push(btn('priority', 'ti-flag', T('الأولوية','Priority')));

    return '<div class="card"><h2><i class="ti ti-ticket"></i><bdi>' + esc(t.subject) + '</bdi> ' + statusBadge(t) + ' ' + prio(t)

      + '<div class="split"><div>'
      + '<div class="card"><h2><i class="ti ti-file-description"></i>' + esc(T('المشكلة','Problem')) + '</h2>'
      + '<p style="white-space:pre-wrap;margin:0 0 12px;color:var(--ink);">' + esc(t.description) + '</p>'

      + (t.context.previousTicketId ? kv(T('تذكرة سابقة','Previous ticket'), t.context.previousTicketId) : '') + '</div>'
      + '<div class="card"><h2><i class="ti ti-messages"></i>' + esc(T('المحادثة مع العميل','Customer conversation')) + '</h2>'
      + thread(t.activities.filter(function(a){ return a.kind === 'message'; }), true)
      + (can.manage && t.status !== 'closed' ? composer('message', T('رد يراه العميل','Reply to the customer')) : '') + '</div>'
      + '<div class="card"><h2><i class="ti ti-notes"></i>' + esc(T('نشاط داخلي','Internal activity')) + '</h2>'
      + '<div class="notice"><i class="ti ti-eye-off"></i><span>' + esc(T('لا يظهر أي شيء في هذا القسم للعميل.','Nothing in this section is ever shown to the customer.')) + '</span></div>'
      + thread(t.activities.filter(function(a){ return a.kind === 'note' || a.kind === 'escalate'; }), false)
      + (can.manage ? composer('note', T('ملاحظة داخلية','Internal note')) : '') + '</div>'
      + '<div class="card"><h2><i class="ti ti-timeline"></i>' + esc(T('السجل الزمني','Timeline')) + '</h2>' + timeline(t) + '</div>'
      + '</div><div>'
      + '<div class="card"><h2><i class="ti ti-user"></i>' + esc(T('العميل','Customer')) + '</h2>'
      + kv(T('الاسم','Name'), customerName(t.customerId)) + kv(T('رقم الحساب','Account'), t.customerId)
      + '<div class="row-actions" style="margin-block-start:10px;"><button class="btn sm" onclick="CS.go360(\'' + esc(t.customerId) + '\')">'
      + '<i class="ti ti-id-badge-2"></i>' + esc(T('ملف 360','Customer 360')) + '</button></div></div>'
      + '<div class="card"><h2><i class="ti ti-route"></i>' + esc(T('المسؤولية','Ownership')) + '</h2>'
      + kv(T('القسم المسؤول','Responsible department'), depName(t.responsibleDepartment))
      + kv(T('الموظف','Assigned employee'), t.assignedEmployeeName || T('غير مُستلمة','Unassigned'))
      + kv(T('أُنشئت','Created'), when(t.createdAt)) + kv(T('استُلمت','Claimed'), t.claimedAt ? when(t.claimedAt) : '—')
      + kv(T('حُلّت','Resolved'), t.resolvedAt ? when(t.resolvedAt) : '—')
      + kv(T('أُغلقت','Closed'), t.closedAt ? when(t.closedAt) : '—')
      + (t.resolution.description ? kv(T('الحل','Resolution'), t.resolution.description) : '') + '</div>'
      + '<div class="card"><h2><i class="ti ti-clock-shield"></i>' + esc(T('مستوى الخدمة','SLA')) + '</h2>'
      + '<div class="notice"><i class="ti ti-info-circle"></i><span>'
      + esc(T('مهلة أول رد: ','First response: ') + slaTxt(t.sla.firstResponse) + ' · ' + T('مهلة الحل: ','Resolution: ') + slaTxt(t.sla.resolution)) + '</span></div>'
      + '<p style="margin:0;color:var(--muted);font-size:12.5px;">'
      + esc(T('هذه هي الحالة وقت فتح التذكرة، ولا يُعاد حسابها عند تغيير الإعدادات لاحقاً.',
              'This is the state when the ticket was opened; a later configuration change never rewrites it.')) + '</p></div>'
      + '<div class="card"><h2><i class="ti ti-subtask"></i>' + esc(T('المهام','Tasks')) + ' <span class="badge b-plain">' + t.tasks.length + '</span></h2>'
      + (t.tasks.length ? t.tasks.map(function(x){
          return '<div class="kv"><span class="k">' + esc(x.title) + '</span><span class="v">'
            + esc(depName(x.department)) + ' · <span class="badge b-plain">' + esc(x.status) + '</span>'
            + (x.status === 'open' && can.manage ? ' <button class="btn sm" onclick="CS.act(\'task\',\'' + esc(x.taskId) + '\')">'
               + esc(T('إنجاز','Complete')) + '</button>' : '') + '</span></div>';
        }).join('') : emptyBox('لا توجد مهام.','No tasks.','ti-subtask'))
      + (can.manage && t.active ? '<div class="row-actions" style="margin-block-start:10px;"><button class="btn sm" onclick="CS.act(\'newtask\')">'
        + '<i class="ti ti-plus"></i>' + esc(T('مهمة جديدة','New task')) + '</button></div>' : '') + '</div>'
      + '<div class="card"><h2><i class="ti ti-clock-hour-4"></i>' + esc(T('المتابعات','Follow-ups')) + '</h2>'
      + (t.followUps.length ? t.followUps.map(function(x){
          return '<div class="kv"><span class="k mono">' + esc(when(x.dueAt)) + '</span><span class="v">' + esc(x.reason)
            + ' <span class="badge b-plain">' + esc(x.status) + '</span>'
            + (x.status === 'open' && can.manage ? ' <button class="btn sm" onclick="CS.act(\'fu\',\'' + esc(x.followUpId) + '\')">'
               + esc(T('إنجاز','Complete')) + '</button>' : '') + '</span></div>';
        }).join('') : emptyBox('لا توجد متابعات.','No follow-ups.','ti-clock-hour-4'))
      + (can.manage ? '<div class="row-actions" style="margin-block-start:10px;"><button class="btn sm" onclick="CS.act(\'newfu\')">'
        + '<i class="ti ti-plus"></i>' + esc(T('متابعة جديدة','New follow-up')) + '</button></div>' : '') + '</div>'
      + '<div class="card"><h2><i class="ti ti-link"></i>' + esc(T('سجلات مرتبطة','Related records')) + '</h2>'
      + (t.relations.length ? '<div class="chip-list">' + t.relations.map(function(x){
          return '<span class="chip"><i class="ti ti-paperclip"></i>' + esc(x.recordType) + ' <span class="mono">' + esc(x.recordId) + '</span>'
            + (x.verified ? '' : ' <span class="badge b-plain">' + esc(T('غير مُتحقَّق','unverified')) + '</span>') + '</span>';
        }).join('') + '</div>' : emptyBox('لا توجد سجلات مرتبطة.','No related records.','ti-link'))
      + (can.manage ? '<div class="row-actions" style="margin-block-start:10px;"><button class="btn sm" onclick="CS.act(\'link\')">'
        + '<i class="ti ti-plus"></i>' + esc(T('ربط سجل','Link a record')) + '</button></div>' : '') + '</div>'
      + '</div></div>';
  }
  function slaTxt(s){ return s && s.configured ? (s.minutes + ' ' + T('دقيقة','min')) : 'NOT_CONFIGURED'; }
  function btn(a, ic, label, kind){
    return '<button class="btn sm ' + (kind || '') + '" onclick="CS.act(\'' + a + '\')"><i class="ti ' + ic + '"></i>' + esc(label) + '</button>';
  }
  function thread(list, customerFacing){
    if (!list.length) return emptyBox(customerFacing ? 'لا توجد رسائل.' : 'لا يوجد نشاط داخلي.',
      customerFacing ? 'No messages yet.' : 'No internal activity yet.', 'ti-message-2');
    return '<div class="thread">' + list.map(function(a){
      var cls = a.kind === 'message' ? (a.direction === 'inbound' ? 'cust' : '') : 'internal';
      var who = a.direction === 'inbound' ? T('العميل','Customer') : (a.actorName || a.actorId);
      return '<div class="msg ' + cls + '"><div class="meta"><b><bdi>' + esc(who) + '</bdi></b><span class="mono">' + esc(when(a.at)) + '</span>'
        + '<span class="badge b-plain">' + esc(a.kind === 'message' ? T('يراه العميل','Customer-visible') : T('داخلي','Internal')) + '</span></div>'
        + '<div class="body">' + esc(a.body || '') + '</div></div>';
    }).join('') + '</div>';
  }
  function composer(kind, label){
    return '<div class="f" style="margin-block-start:12px;"><label for="c_' + kind + '">' + esc(label) + '</label>'
      + '<textarea id="c_' + kind + '" maxlength="4000"></textarea>'
      + '<div class="row-actions" style="margin-block-start:8px;"><button class="btn sm pri" onclick="CS.send(\'' + kind + '\')">'
      + '<i class="ti ti-send"></i>' + esc(T('إرسال','Send')) + '</button></div></div>';
  }
  function timeline(t){
    var items = t.activities.map(function(a){
      var txt = '';
      if (a.kind === 'status')   txt = T('تغيّرت الحالة: ','Status: ') + a.from + ' → ' + a.to + (a.reason ? ' — ' + a.reason : '');
      if (a.kind === 'claim')    txt = T('استلمها ','Claimed by ') + (a.actorName || a.toEmployeeId);
      if (a.kind === 'transfer') txt = T('حُوّلت من ','Transferred from ') + depName(a.fromDepartment) + T(' إلى ',' to ') + depName(a.toDepartment) + ' — ' + (a.reason || '');
      if (a.kind === 'priority') txt = T('الأولوية: ','Priority: ') + a.from + ' → ' + a.to;
      if (a.kind === 'note')     txt = T('ملاحظة داخلية','Internal note');
      if (a.kind === 'message')  txt = a.direction === 'inbound' ? T('رسالة من العميل','Message from the customer') : T('رد للعميل','Reply to the customer');
      if (a.kind === 'escalate') txt = T('تصعيد للإدارة','Escalated to management');
      if (a.kind === 'update')   txt = T('تعديل بيانات التذكرة','Ticket fields updated');
      if (a.kind === 'guard')    return '';
      return '<li><span class="when mono">' + esc(when(a.at)) + '</span><span>' + esc(txt)
        + ' <span style="color:var(--faint)">· <bdi>' + esc(a.actorName || a.actorId || '') + '</bdi></span></span></li>';
    }).filter(Boolean);
    return '<ul class="tl">' + (items.join('') || '<li>' + esc(T('لا يوجد سجل.','No history.')) + '</li>') + '</ul>';
  }

  /* ───────── modals & actions ───────── */
  function modal(title, inner, onOk, okLabel){
    el('modalIn').innerHTML = '<h3>' + esc(title) + '</h3>' + inner
      + '<div class="modal-actions"><button class="btn" onclick="CS.closeModal()">' + esc(T('إلغاء','Cancel')) + '</button>'
      + '<button class="btn pri" id="modalOk">' + esc(okLabel || T('تأكيد','Confirm')) + '</button></div>';
    el('modalOk').onclick = onOk;
    el('modal').showModal();
  }
  function closeModal(){ try { el('modal').close(); } catch (e) {} }
  function val(id){ var e = el(id); return e ? e.value : ''; }

  async function run(promise, okMsg){
    if (BUSY) return;
    BUSY = true;
    try {
      var r = await promise;
      if (r && r.ok) { closeModal(); toast(okMsg || T('تم.','Done.')); render(); }
      else { toast((r && r.message) || T('تعذّر تنفيذ الإجراء.','The action could not be completed.'), true); render(); }
      return r;
    } finally { BUSY = false; }
  }

  function act(a, arg){
    var id = route.id;
    if (a === 'claim')   return run(SVC.claimTicket(id), T('تم استلام التذكرة.','Ticket claimed.'));
    if (a === 'open')    return run(SVC.updateTicket(id, { status:'open' }));
    if (a === 'pending') return run(SVC.updateTicket(id, { status:'pending' }));
    if (a === 'task')    return run(SVC.completeTask(arg), T('تم إنجاز المهمة.','Task completed.'));
    if (a === 'fu')      return run(SVC.completeFollowUp(arg), T('تم إنجاز المتابعة.','Follow-up completed.'));
    if (a === 'resolve') return modal(T('حل التذكرة','Resolve ticket'),
      '<div class="f"><label for="m1">' + esc(T('وصف الحل (إلزامي)','Resolution description (required)')) + '</label><textarea id="m1"></textarea></div>'
      + '<div class="f"><label for="m2">' + esc(T('رمز الحل (اختياري)','Resolution code (optional)')) + '</label><input id="m2"></div>',
      function(){ run(SVC.resolveTicket(id, { description:val('m1'), code:val('m2') }), T('تم حل التذكرة.','Ticket resolved.')); });
    if (a === 'close')   return run(SVC.closeTicket(id, {}), T('تم إغلاق التذكرة.','Ticket closed.'));
    if (a === 'reopen')  return modal(T('إعادة فتح التذكرة','Reopen ticket'),
      '<div class="f"><label for="m1">' + esc(T('السبب (إلزامي)','Reason (required)')) + '</label><textarea id="m1"></textarea></div>',
      function(){ run(SVC.reopenTicket(id, { reason:val('m1') }), T('أُعيد فتح التذكرة.','Ticket reopened.')); });
    if (a === 'transfer') {
      var deps = SVC.departments();
      return modal(T('تحويل إلى قسم','Transfer to a department'),
        '<div class="notice"><i class="ti ti-info-circle"></i><span>'
        + esc(T('التحويل لا ينشئ تذكرة جديدة: نفس التذكرة وكل سجلها تنتقل إلى القسم الجديد.',
                'A transfer never creates a new ticket: the same ticket and its whole history move to the new department.')) + '</span></div>'
        + '<div class="f"><label for="m1">' + esc(T('القسم','Department')) + '</label><select id="m1">'
        + Object.keys(deps).map(function(k){ return '<option value="' + esc(k) + '">' + esc(depName(k)) + '</option>'; }).join('') + '</select></div>'
        + '<div class="f"><label for="m2">' + esc(T('السبب (إلزامي)','Reason (required)')) + '</label><textarea id="m2"></textarea></div>',
        function(){ run(SVC.transferTicket(id, { toDepartment:val('m1'), reason:val('m2') }), T('تم التحويل.','Transferred.')); });
    }
    if (a === 'escalate') return modal(T('تصعيد للإدارة','Escalate to management'),
      '<div class="notice"><i class="ti ti-info-circle"></i><span>'
      + esc(T('التصعيد لا ينشئ تذكرة أخرى؛ يسجّل طلب انتباه الإدارة على نفس التذكرة.',
              'Escalation never creates another ticket; it records a management-attention request on this one.')) + '</span></div>'
      + '<div class="f"><label for="m1">' + esc(T('الوصف (إلزامي)','Description (required)')) + '</label><textarea id="m1"></textarea></div>'
      + '<p style="color:var(--muted);font-size:12px;margin:8px 0 0;">'
      + esc(T('لا توجد قائمة أسباب تصعيد معتمدة في رف، لذلك الوصف إلزامي.',
              'RAF has no approved escalation reason list, so the description is what carries the case.')) + '</p>',
      function(){ run(SVC.escalateTicket(id, { description:val('m1') }), T('تم التصعيد.','Escalated.')); });
    if (a === 'priority') return modal(T('تغيير الأولوية','Change priority'),
      '<div class="f"><label for="m1">' + esc(T('الأولوية','Priority')) + '</label><select id="m1">'
      + SVC.PRIORITIES.map(function(p){ return '<option value="' + esc(p) + '">' + esc(L(SVC.PRIORITY_TXT[p])) + '</option>'; }).join('') + '</select></div>',
      function(){ run(SVC.updateTicket(id, { priority:val('m1') })); });
    if (a === 'newtask') {
      var deps2 = SVC.departments();
      return modal(T('مهمة جديدة','New task'),
        '<div class="notice"><i class="ti ti-info-circle"></i><span>'
        + esc(T('المهمة سجل فرعي لهذه التذكرة، وليست تذكرة جديدة.','A task is a child record of this ticket, never a second ticket.')) + '</span></div>'
        + '<div class="f"><label for="m1">' + esc(T('العنوان','Title')) + '</label><input id="m1"></div>'
        + '<div class="f"><label for="m2">' + esc(T('الوصف','Description')) + '</label><textarea id="m2"></textarea></div>'
        + '<div class="f"><label for="m3">' + esc(T('القسم','Department')) + '</label><select id="m3">'
        + Object.keys(deps2).map(function(k){ return '<option value="' + esc(k) + '">' + esc(depName(k)) + '</option>'; }).join('') + '</select></div>',
        function(){ run(SVC.createTask(id, { title:val('m1'), description:val('m2'), department:val('m3') }), T('أُنشئت المهمة.','Task created.')); });
    }
    if (a === 'newfu') return modal(T('متابعة جديدة','New follow-up'),
      '<div class="f"><label for="m1">' + esc(T('الموعد','Due')) + '</label><input type="datetime-local" id="m1"></div>'
      + '<div class="f"><label for="m2">' + esc(T('السبب','Reason')) + '</label><textarea id="m2"></textarea></div>',
      function(){
        var due = new Date(val('m1')).getTime();
        if (!due) return toast(T('اختر موعداً صحيحاً.','Pick a valid date and time.'), true);
        run(SVC.createFollowUp(id, { dueAt:due, reason:val('m2') }), T('أُنشئت المتابعة.','Follow-up created.'));
      });
    if (a === 'link') return modal(T('ربط سجل','Link a record'),
      '<div class="f"><label for="m1">' + esc(T('النوع','Type')) + '</label><select id="m1">'
      + SVC.RELATION_TYPES.map(function(x){ return '<option value="' + esc(x) + '">' + esc(x) + '</option>'; }).join('') + '</select></div>'
      + '<div class="f"><label for="m2">' + esc(T('رقم السجل','Record id')) + '</label><input id="m2"></div>',
      function(){ run(SVC.linkRecord(id, { recordType:val('m1'), recordId:val('m2') }), T('تم الربط.','Linked.')); });
  }
  function send(kind){
    var box = el('c_' + kind), body = box ? box.value : '';
    if (!body.trim()) return toast(T('اكتب نصاً أولاً.','Write something first.'), true);
    if (kind === 'message') return run(SVC.addCustomerMessage(route.id, { body:body }), T('أُرسل الرد.','Reply sent.'));
    return run(SVC.addInternalNote(route.id, { body:body }), T('أُضيفت الملاحظة.','Note added.'));
  }
  function newTicket(){
    var cats = SVC.categories(), deps = SVC.departments();
    modal(T('تذكرة جديدة','New ticket'),
      '<div class="f"><label for="m0">' + esc(T('رقم العميل','Customer ID')) + '</label><input id="m0" placeholder="usr-016"></div>'
      + '<div class="f"><label for="m1">' + esc(T('الموضوع','Subject')) + '</label><input id="m1"></div>'
      + '<div class="f"><label for="m2">' + esc(T('الوصف','Description')) + '</label><textarea id="m2"></textarea></div>'
      + '<div class="f"><label for="m3">' + esc(T('الفئة','Category')) + '</label><select id="m3">'
      + cats.map(function(c){ return '<option value="' + esc(c.key) + '">' + esc(T(c.ar, c.en)) + '</option>'; }).join('') + '</select></div>'
      + '<div class="f"><label for="m4">' + esc(T('القسم المسؤول','Responsible department')) + '</label><select id="m4">'
      + Object.keys(deps).map(function(k){ return '<option value="' + esc(k) + '">' + esc(depName(k)) + '</option>'; }).join('') + '</select></div>'
      + '<div class="f"><label for="m5">' + esc(T('رقم الطلب (اختياري)','Order ID (optional)')) + '</label><input id="m5"></div>',
      async function(){
        var orderId = val('m5').trim();
        var r = await run(SVC.createTicket({
          customerId:val('m0').trim(), type:orderId ? 'order_linked' : 'general',
          source:'customer_service', orderId:orderId || undefined,
          category:val('m3'), subject:val('m1'), description:val('m2'), department:val('m4')
        }), T('أُنشئت التذكرة.','Ticket created.'));
        if (r && !r.ok && r.code === 'DUPLICATE' && r.ticketId) {
          toast(T('توجد تذكرة مفتوحة لنفس المشكلة — تم فتحها.','An active ticket already exists for this problem — opening it.'), true);
          go('tickets', r.ticketId);
        }
      }, T('إنشاء','Create'));
  }

  /* ───────── routing & render ───────── */
  function render(){
    route = parseHash();
    var p = pageOf(route.p);
    el('crumbGroup').textContent = T('خدمة العملاء','Customer Service');
    el('crumbPage').textContent = route.id ? T('تفاصيل التذكرة','Ticket details') : T(p.ar, p.en);
    var html;
    if (route.id) html = vTicket(route.id);
    else if (route.p === 'dashboard') html = vDashboard();
    else if (route.p === 'tickets')   html = vTickets();
    else if (route.p === 'mywork')    html = vMyWork();
    else if (route.p === 'followups') html = vFollowUps();
    else if (route.p === 'customers') html = vCustomers();
    else if (route.p === 'c360')      html = vC360();
    else html = vKnowledge();
    el('view').innerHTML = html;
    renderNav();
  }
  function applyLang(){
    var en = isEn();
    el('langBtn').textContent = en ? 'ع' : 'EN';
    document.querySelectorAll('[data-ar]').forEach(function(n){ n.textContent = en ? n.getAttribute('data-en') : n.getAttribute('data-ar'); });
    document.title = en ? 'RAF — Customer Service' : 'رف — خدمة العملاء';
  }
  function toggleLang(){
    var en = isEn();
    root().lang = en ? 'ar' : 'en'; root().dir = en ? 'rtl' : 'ltr';
    try { localStorage.setItem('raf_lang', en ? 'ar' : 'en'); } catch (e) {}
    applyLang(); render();
  }
  function gate(ar, en, msg){
    el('shell').hidden = true; el('gate').hidden = false;
    el('gateT').textContent = T(ar, en); el('gateP').textContent = msg || '';
    applyLang();
  }

  function boot(){
    try { if (localStorage.getItem('raf_lang') === 'en') { root().lang = 'en'; root().dir = 'ltr'; } } catch (e) {}
    applyLang();
    if (!SVC || !window.RAFPerm) return gate('تعذّر التحميل','Could not load', T('لم يتم تحميل وحدات رف المطلوبة.','The required RAF modules did not load.'));
    CAPS = SVC.capabilities();
    if (!CAPS.ok) return gate('لا تملك صلاحية الوصول','You do not have access', (SVC.ERRORS[CAPS.code] ? T(SVC.ERRORS[CAPS.code].ar, SVC.ERRORS[CAPS.code].en) : ''));
    if (CAPS.audience !== 'employee' || !CAPS.view) {
      return gate('لا تملك صلاحية الوصول إلى خدمة العملاء','You do not have access to Customer Service',
        T('هذه الواجهة لموظفي رف المصرّح لهم فقط.','This console is for authorised RAF employees only.'));
    }
    ME = CAPS.me;
    el('gate').hidden = true; el('shell').hidden = false;
    el('userAv').textContent = initials(ME.name);
    el('userName').textContent = ME.name;
    el('userRole').textContent = (CAPS.department ? depName(CAPS.department) : ME.roleId);
    render();
    window.addEventListener('hashchange', function(){ closeNav(); render(); });
    /* live updates — the event only says something changed; every view re-reads
       through the authority. No polling, no setInterval. */
    if (window.RAFEventBus) {
      RAFEventBus.subscribe('support.*', function(){ render(); });
      RAFEventBus.subscribe('notification.created', function(){ renderNav(); });
    }
    window.addEventListener('storage', function(e){
      if (e.key && /^raf_(support_|users|current_user)/.test(e.key)) render();
    });
  }

  return { boot:boot, render:render, act:act, send:send, newTicket:newTicket, toggleLang:toggleLang,
           openNav:openNav, closeNav:closeNav, closeModal:closeModal,
           open:function(id){ go('tickets', id); },
           go:function(p){ go(p); },
           go360:function(id){ C360 = id; go('c360'); },
           set360:function(v){ C360 = v.trim(); clearTimeout(window.__c); window.__c = setTimeout(render, 350); },
           setFilter:function(k, v){ FILTERS[k] = v; clearTimeout(window.__f); window.__f = setTimeout(render, 300); },
           clearFilters:function(){ Object.keys(FILTERS).forEach(function(k){ FILTERS[k] = ''; }); render(); } };
})();
document.addEventListener('DOMContentLoaded', CS.boot);
</script>
</body>
</html>
