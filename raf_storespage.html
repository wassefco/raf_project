<!DOCTYPE html>
<html lang="ar" dir="rtl" id="htmlRoot">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>رف — جميع المحلات</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700;900&family=Tajawal:wght@300;400;500;700&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
<style>
:root{--bg:#F5F2EC;--bg2:#EDE8DC;--card:#FFFFFF;--gold:#C9A84C;--gold2:#A07828;--black:#0A0A0A;--text:#0A0A0A;--text2:#555;--text3:#888;--border:#D8D3C8;--r:8px;--rl:12px;--font:'Tajawal',sans-serif;--fdisplay:'Playfair Display',serif;--fen:'DM Sans',sans-serif;--green:#2E7D32;--green-bg:#E8F5E9;--red:#C62828;--red-bg:#FFEBEE;--amber:#E65100;--amber-bg:#FFF3E0;}
*{box-sizing:border-box;margin:0;padding:0;}
html{overflow-x:hidden;}
body{background:var(--bg);color:var(--text);font-family:var(--font);min-height:100vh;max-width:100%;overflow-x:hidden;}
/* NAV */
nav{position:sticky;top:0;z-index:100;background:rgba(245,242,236,.97);backdrop-filter:blur(12px);border-bottom:1px solid rgba(201,168,76,.3);padding:0 40px;display:flex;align-items:center;justify-content:space-between;height:64px;}
.nav-logo{font-family:var(--fdisplay);font-size:28px;font-weight:900;color:var(--gold);text-decoration:none;}
.nav-logo span{color:var(--text);font-size:11px;font-family:var(--fen);font-weight:300;letter-spacing:3px;display:block;margin-top:-6px;}
.nav-links{display:flex;align-items:center;gap:4px;}
.nav-link{color:var(--text3);text-decoration:none;font-size:14px;padding:6px 12px;border-radius:var(--r);transition:color .2s;}
.nav-link:hover{color:var(--text);}
.nav-link.on{color:var(--gold);font-weight:700;}
.nav-actions{display:flex;align-items:center;gap:8px;}
.btn-ghost{padding:8px 16px;border:1px solid var(--border);border-radius:var(--r);background:transparent;color:var(--text2);font-family:var(--font);font-size:13px;cursor:pointer;transition:all .2s;text-decoration:none;display:inline-flex;align-items:center;gap:6px;}
.btn-ghost:hover{border-color:var(--gold);color:var(--gold);}
.btn-gold{padding:8px 20px;border:none;border-radius:var(--r);background:var(--gold);color:var(--black);font-family:var(--font);font-size:13px;font-weight:700;cursor:pointer;transition:all .2s;text-decoration:none;display:inline-flex;align-items:center;gap:6px;}
.btn-gold:hover{background:var(--gold2);}
.nav-ico{width:40px;height:40px;border:1px solid var(--border);border-radius:var(--r);display:flex;align-items:center;justify-content:center;color:var(--text3);cursor:pointer;background:transparent;font-size:18px;position:relative;transition:all .2s;}
.nav-ico:hover{border-color:var(--gold);color:var(--gold);}
.cart-badge{position:absolute;top:-6px;left:-6px;width:18px;height:18px;background:var(--gold);color:var(--black);border-radius:50%;font-size:10px;font-weight:700;display:flex;align-items:center;justify-content:center;font-family:var(--fen);}
/* PAGE HEADER */
.page-header{background:var(--black);padding:40px;}
.page-header-inner{max-width:1200px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;}
.page-title{font-size:30px;font-weight:700;color:#F5F2EC;}
.page-title span{color:var(--gold);}
.page-sub{font-size:14px;color:#888;margin-top:6px;}
.stat-pills{display:flex;gap:14px;}
.stat-pill{background:rgba(201,168,76,.1);border:1px solid rgba(201,168,76,.3);border-radius:var(--rl);padding:12px 20px;text-align:center;}
.stat-pill-num{font-size:24px;font-weight:900;color:var(--gold);font-family:var(--fen);}
.stat-pill-lbl{font-size:11px;color:#888;margin-top:2px;}
/* BREADCRUMB */
.breadcrumb{padding:12px 40px;font-size:13px;color:var(--text3);display:flex;align-items:center;gap:6px;background:var(--bg2);border-bottom:1px solid var(--border);}
.breadcrumb a{color:var(--text3);text-decoration:none;transition:color .2s;}
.breadcrumb a:hover{color:var(--gold);}
/* MAIN */
.main{max-width:1200px;margin:0 auto;padding:32px 40px;}
/* SEARCH + FILTER */
.search-bar{display:flex;gap:12px;align-items:center;background:var(--card);border:1px solid var(--border);border-radius:var(--rl);padding:16px 20px;margin-bottom:20px;flex-wrap:wrap;}
.search-inp{flex:1;min-width:240px;display:flex;align-items:center;gap:8px;background:var(--bg);border:1px solid var(--border);border-radius:var(--r);padding:9px 14px;}
.search-inp input{border:none;background:transparent;font-family:var(--font);font-size:14px;color:var(--text);outline:none;flex:1;}
.f-select{padding:9px 14px;border:1px solid var(--border);border-radius:var(--r);background:var(--bg);font-family:var(--font);font-size:13px;color:var(--text2);cursor:pointer;outline:none;}
.f-select:focus{border-color:var(--gold);}
/* FILTER CHIPS */
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:24px;}
.chip{padding:6px 14px;border:1px solid var(--border);border-radius:20px;font-size:12px;color:var(--text2);cursor:pointer;transition:all .15s;background:var(--card);}
.chip:hover{border-color:var(--gold);color:var(--gold);}
.chip.on{background:var(--gold);border-color:var(--gold);color:var(--black);font-weight:700;}
/* VIEW TOGGLE */
.view-toggle{display:flex;gap:4px;background:var(--bg2);border:1px solid var(--border);border-radius:var(--r);padding:3px;}
.vt-btn{padding:6px 10px;border-radius:5px;border:none;background:transparent;color:var(--text3);cursor:pointer;transition:all .15s;font-size:16px;}
.vt-btn.on{background:var(--card);color:var(--gold);box-shadow:0 1px 4px rgba(0,0,0,.08);}
/* RESULTS BAR */
.results-bar{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;}
.results-count{font-size:13px;color:var(--text3);}
/* STORES GRID */
.stores-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:20px;}
.stores-grid.list-view{grid-template-columns:1fr;gap:12px;}
/* STORE CARD */
.store-card{background:var(--card);border:1px solid var(--border);border-radius:var(--rl);overflow:hidden;cursor:pointer;transition:all .2s;position:relative;}
.store-card:hover{border-color:var(--gold);transform:translateY(-2px);box-shadow:0 8px 28px rgba(0,0,0,.08);}
.store-num{position:absolute;top:10px;left:10px;background:rgba(10,10,10,.65);color:#fff;font-family:var(--fen);font-size:10px;font-weight:700;padding:2px 8px;border-radius:20px;backdrop-filter:blur(4px);z-index:1;}
.store-img{height:130px;background:linear-gradient(135deg,var(--bg2),var(--border));display:flex;align-items:center;justify-content:center;font-size:44px;color:var(--gold);position:relative;}
.store-badge{position:absolute;top:10px;right:10px;padding:3px 10px;border-radius:20px;font-size:10px;font-weight:700;}
.badge-premium{background:var(--gold);color:var(--black);}
.badge-featured{background:rgba(201,168,76,.15);color:var(--gold);border:1px solid rgba(201,168,76,.3);}
.badge-closed{background:rgba(10,10,10,.5);color:#aaa;}
.verified-ico{position:absolute;bottom:10px;right:10px;width:22px;height:22px;background:var(--gold);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;color:var(--black);}
.store-body{padding:16px;}
.store-name{font-size:15px;font-weight:700;margin-bottom:4px;}
.store-cat-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;}
.store-cat{font-size:12px;color:var(--text3);}
.store-rating{font-size:12px;color:var(--gold);display:flex;align-items:center;gap:3px;}
.store-footer{display:flex;align-items:center;justify-content:space-between;padding-top:10px;border-top:1px solid var(--border);font-size:12px;color:var(--text3);}
.store-status-open{color:var(--green);font-weight:700;display:flex;align-items:center;gap:4px;}
.store-status-closed{color:var(--red);font-weight:700;display:flex;align-items:center;gap:4px;}
/* LIST VIEW CARD */
.stores-grid.list-view .store-card{display:flex;align-items:center;}
.stores-grid.list-view .store-img{height:80px;width:100px;min-width:100px;flex-shrink:0;}
.stores-grid.list-view .store-body{flex:1;padding:12px 16px;}
.stores-grid.list-view .store-num{top:8px;left:8px;}
/* FOOTER */
footer{background:var(--black);color:#888;padding:48px 40px 24px;margin-top:80px;}
.footer-grid{display:grid;grid-template-columns:2fr 1fr 1fr 1fr;gap:40px;max-width:1200px;margin:0 auto 40px;}
.footer-logo{font-family:var(--fdisplay);font-size:32px;font-weight:900;color:var(--gold);text-decoration:none;display:block;margin-bottom:12px;}
.footer-desc{font-size:13px;color:#555;line-height:1.7;}
.footer-col-title{font-size:13px;font-weight:700;color:#ccc;margin-bottom:16px;letter-spacing:1px;}
.footer-link{display:block;font-size:13px;color:#555;text-decoration:none;margin-bottom:10px;transition:color .2s;}
.footer-link:hover{color:var(--gold);}
.footer-bottom{border-top:1px solid #1a1a1a;padding-top:24px;display:flex;align-items:center;justify-content:space-between;font-size:12px;color:#444;max-width:1200px;margin:0 auto;}
/* ── GLOBAL MOBILE RESET ── */
@media(max-width:768px){*{max-width:100%;}img,video,iframe{max-width:100%!important;height:auto;}table{max-width:100%;}}
@media(max-width:900px){nav{padding:0 16px;}.nav-links{display:none;}.main{padding:20px 16px;}.page-header{padding:28px 16px;}.page-header-inner{flex-direction:column;align-items:flex-start;gap:14px;}.footer-grid{grid-template-columns:1fr 1fr;}.search-inp{min-width:0!important;width:100%;}.filter-top{flex-wrap:wrap;gap:8px;}}
@media(max-width:480px){
  .main{padding:12px;}
  .chips{flex-wrap:nowrap;overflow-x:auto;padding-bottom:4px;-webkit-overflow-scrolling:touch;scrollbar-width:none;gap:6px;}
  .chips::-webkit-scrollbar{display:none;}
  .chip{flex-shrink:0;}
  .filter-row{flex-direction:column;gap:8px;}
  .f-select{width:100%;}
  .footer-grid{grid-template-columns:1fr;}
  .footer-bottom{flex-direction:column;text-align:center;gap:6px;}
  footer{padding:32px 16px 16px;}
  .search-inp input{width:100%;}
}
.lang-btn{padding:6px 12px;border:1px solid var(--border);border-radius:var(--r);background:transparent;color:var(--text3);font-family:'DM Sans',sans-serif;font-size:12px;cursor:pointer;transition:all .2s;letter-spacing:1px;display:inline-flex;align-items:center;gap:5px;}
.lang-btn:hover{border-color:var(--gold);color:var(--gold);}
.lang-btn .lang-dot{width:6px;height:6px;border-radius:50%;background:var(--gold);display:inline-block;}
html[lang="en"] body{font-family:'DM Sans',sans-serif;}

  /* ===== APP BOTTOM NAV ===== */

    .app-bnav{display:flex;position:fixed;top:auto;bottom:0;left:0;right:0;height:56px;background:#fff;border-top:1px solid #e8e4dc;box-shadow:0 -2px 16px rgba(0,0,0,.06);z-index:998;padding:0 4px;padding-bottom:env(safe-area-inset-bottom,0px);align-items:stretch;}
    .bnav-tab{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;text-decoration:none;color:#aaa;font-size:10px;font-family:'Tajawal',sans-serif;font-weight:500;transition:color .15s;border:none;background:transparent;cursor:pointer;padding:0;}
    .bnav-tab i{font-size:22px;line-height:1;}
    .bnav-tab.on{color:#C9A84C;}
    .bnav-cart{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:2px;text-decoration:none;font-size:10px;font-family:'Tajawal',sans-serif;color:#aaa;padding-bottom:4px;}
    .bnav-cart-ring{width:44px;height:44px;border-radius:50%;background:#C9A84C;display:flex;align-items:center;justify-content:center;font-size:20px;color:#0A0A0A;margin-top:-14px;box-shadow:0 4px 14px rgba(201,168,76,.3);}
    .bnav-cart.on .bnav-cart-ring{background:#A07828;}
    nav a.btn-ghost,nav a.btn-gold,nav .btn-ghost,nav .btn-gold{display:none!important;}
  }
</style>

<script>
/* LANG (the shared header's language button calls this) */
function toggleLang() {
  const html=document.getElementById('htmlRoot'),isAR=html.lang==='ar',nl=isAR?'en':'ar';
  html.lang=nl;html.dir=isAR?'ltr':'rtl';
  const lb=document.getElementById('langLabel'); if(lb) lb.textContent=isAR?'ع':'EN';
  localStorage.setItem('raf_lang',nl);
  document.querySelectorAll('[data-ar]').forEach(el=>{const t=el.getAttribute('data-'+nl);if(t)el.textContent=t;});
}
(function(){
  if(localStorage.getItem('raf_lang')==='en'){
    document.getElementById('htmlRoot').lang='en';document.getElementById('htmlRoot').dir='ltr';
    const lb=document.getElementById('langLabel'); if(lb) lb.textContent='ع';
    document.querySelectorAll('[data-en]').forEach(el=>{el.textContent=el.getAttribute('data-en');});
  }
})();
</script>

<script>
/* Stores directory — RAF's open stores (RAFCatalog.stores), drawn with the
   shared store card. A store belongs to a category when it has public
   products in it; ?cat=<key> preselects one (existing links keep working). */
(function(){
  function en(){ var r=document.getElementById('htmlRoot')||document.documentElement; return r.lang==='en'; }
  function T(ar,e){ return en()?e:ar; }
  var cat = (new URLSearchParams(location.search).get('cat')||'').trim();
  function storeCats(slug){
    var u={}; RAFCatalog.list({ store:slug, visibleOnly:false, publicOnly:true }).forEach(function(p){ u[p.cat]=1; }); return u;
  }
  function render(){
    var grid=document.getElementById('storesGrid'); if(!grid||!window.RAFCatalog||!window.RAFStoreCard) return;
    var stores=RAFCatalog.stores(), cats={};
    stores.forEach(function(s){ s.__cats=storeCats(s.slug); Object.keys(s.__cats).forEach(function(k){ cats[k]=(cats[k]||0)+1; }); });
    var CATS=RAFCatalog.categories({ populatedOnly:false }).filter(function(c){ return cats[c.k]; });
    if(cat && !cats[cat]) cat='';
    document.getElementById('spCats').innerHTML=
      '<button type="button" class="cx-chip'+(cat?'':' on')+'" aria-pressed="'+(cat?'false':'true')+'" onclick="spPick(\'\')">'+T('الكل','All')+' <span class="n">'+stores.length+'</span></button>'+
      CATS.map(function(c){ return '<button type="button" class="cx-chip'+(cat===c.k?' on':'')+'" aria-pressed="'+(cat===c.k)+'" onclick="spPick(\''+c.k+'\')"><i class="ti '+c.ic+'"></i> '+(en()?c.en:c.ar)+' <span class="n">'+cats[c.k]+'</span></button>'; }).join('');
    var list=stores.filter(function(s){ return !cat || s.__cats[cat]; });
    document.getElementById('spCount').innerHTML='<b>'+list.length+'</b> '+T('متجر', list.length===1?'store':'stores');
    grid.innerHTML=list.map(function(s){ return RAFStoreCard.html(RAFStoreCard.model(s), { showPremium:true, showStatus:true }); }).join('');
  }
  window.spPick=function(k){
    cat=k;
    try{ var u=new URL(location.href); if(k) u.searchParams.set('cat',k); else u.searchParams.delete('cat'); history.replaceState({},'',u.pathname+(u.search||'')+u.hash); }catch(e){}
    render();
  };
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', render); else render();
  var r = document.getElementById('htmlRoot');
  if (r) new MutationObserver(render).observe(r, { attributes:true, attributeFilter:['lang'] });
  document.addEventListener('raf:source', render);
})();
</script>
