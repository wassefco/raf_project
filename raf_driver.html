<!DOCTYPE html>
<html id="htmlRoot" lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>رف — مساحة السائق</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700;900&family=Tajawal:wght@300;400;500;700;800&family=DM+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
<link rel="icon" type="image/png" sizes="64x64" href="raf_favicon.png">
<link rel="icon" type="image/png" sizes="32x32" href="raf_favicon_32.png">
<link rel="apple-touch-icon" href="raf_appicon.png">
<script src="raf_features.js"></script>
<script src="raf_config.js"></script>
<script src="raf_event_bus.js"></script>
<script src="raf_record_store.js"></script>
<script src="raf_notify_core.js"></script>
<link rel="stylesheet" href="raf_theme.css">
<style>
/* ══════════════════════════════════════════════════════════════
   DRIVER WORKSPACE — one-handed, mobile first.
   The screen is a stack: what I am carrying now, then what is waiting,
   then everything else. It renders from RAFDriver and owns no rules.
   ══════════════════════════════════════════════════════════════ */
*{box-sizing:border-box;}
[hidden]{display:none!important;}
body{background:var(--bg2);margin:0;}

.dv{min-height:100vh;display:flex;flex-direction:column;max-width:640px;margin:0 auto;
  background:var(--bg2);position:relative;}

/* ---------- header ---------- */
.dv-head{position:sticky;top:0;z-index:30;background:var(--ink);color:#F5F0E4;
  padding:calc(10px + env(safe-area-inset-top,0px)) 14px 10px;display:flex;align-items:center;gap:11px;}
.dv-mark{width:40px;height:40px;flex:0 0 auto;border-radius:12px;background:var(--gold);color:#1C1606;
  display:flex;align-items:center;justify-content:center;font-family:var(--font-display);font-size:18px;font-weight:900;}
.dv-who{flex:1;min-width:0;}
.dv-who b{display:block;font-size:14.5px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.dv-who span{display:block;font-size:11.5px;color:#B9B1A0;margin-top:1px;}
.dv-head .dv-ico{min-height:44px;min-width:44px;border-radius:13px;border:1px solid rgba(255,255,255,.18);
  background:transparent;color:#F5F0E4;font-family:inherit;font-size:13px;font-weight:800;cursor:pointer;
  display:inline-flex;align-items:center;justify-content:center;gap:5px;padding:0 12px;}
.dv-head .dv-ico:hover{background:rgba(255,255,255,.09);}
.dv-head .dv-ico i{font-size:18px;}

/* ---------- Phase G: my performance (read-only) ---------- */
.pf-periods{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 10px;}
/* two classes + element so the theme's button{min-height:40px} does not win */
.dv-card .pf-periods button{min-height:44px;}
.pf-periods button{min-height:44px;padding:0 13px;border-radius:12px;border:1px solid var(--border2);background:var(--card);
  color:var(--text2);font-family:inherit;font-size:13px;font-weight:800;cursor:pointer;}
.pf-periods button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#F5F0E4;}
.pf-periods button:focus-visible,.pf-range input:focus-visible{outline:2px solid var(--gold);outline-offset:2px;}
.pf-range{display:flex;gap:8px;flex-wrap:wrap;align-items:flex-end;margin-bottom:10px;}
.pf-range label{display:flex;flex-direction:column;gap:4px;font-size:12px;font-weight:800;color:var(--text3);flex:1 1 130px;min-width:0;}
.pf-range input{min-height:44px;border-radius:12px;border:1px solid var(--border2);background:var(--card);color:var(--ink);font-family:inherit;font-size:14px;padding:0 10px;width:100%;}
.pf-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;}
.pf-m{border:1px solid var(--border);border-radius:14px;padding:10px 12px;min-width:0;}
.pf-m span{display:block;font-size:12px;color:var(--text3);font-weight:700;line-height:1.5;}
.pf-m b{display:block;font-size:19px;font-weight:800;color:var(--ink);margin-top:2px;overflow-wrap:anywhere;}
.pf-m.wide{grid-column:1 / -1;}

/* ---------- body ---------- */
.dv-body{flex:1;padding:14px 14px calc(90px + env(safe-area-inset-bottom,0px));}
.dv-h1{font-family:var(--font-display);font-size:19px;font-weight:800;color:var(--ink);margin:2px 0 10px;}
.dv-sub{font-size:13px;color:var(--text3);line-height:1.7;margin:-6px 0 12px;}

.dv-card{background:var(--card);border:1px solid var(--border);border-radius:18px;padding:15px 16px;
  margin-bottom:12px;min-width:0;}
.dv-card.live{border-color:var(--gold2);box-shadow:0 0 0 3px var(--gold-soft);}
.dv-card h2{margin:0;font-size:15px;font-weight:800;color:var(--ink);}
.dv-card-h{display:flex;align-items:center;gap:9px;min-height:32px;margin-bottom:4px;}
.dv-card-h h2{flex:1;min-width:0;}

.dv-stage{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 11px;border-radius:20px;
  font-size:11.5px;font-weight:800;background:var(--bg3);color:var(--text2);white-space:nowrap;flex:0 0 auto;}
.dv-stage i{font-size:15px;}
.dv-stage.wait{background:rgba(200,121,30,.14);color:#9A5B12;}
.dv-stage.mine{background:var(--gold-soft);color:var(--gold2);}
.dv-stage.hold{background:rgba(46,158,91,.13);color:#1F7A45;}

.dv-oid{font-family:var(--font-en);font-size:13px;font-weight:800;color:var(--text3);direction:ltr;unicode-bidi:isolate;}
.dv-line{display:flex;align-items:flex-start;gap:9px;padding:9px 0;border-top:1px solid var(--border);font-size:13.5px;color:var(--ink);}
.dv-line:first-of-type{border-top:0;}
.dv-line i{font-size:17px;color:var(--gold2);flex:0 0 auto;margin-top:1px;}
.dv-line .k{flex:0 0 auto;color:var(--text3);font-size:12.5px;font-weight:800;min-width:72px;}
.dv-line .v{flex:1;min-width:0;line-height:1.7;overflow-wrap:anywhere;}
.dv-line .v bdi,.dv-line .v .en{font-family:var(--font-en);}

.dv-leg{display:flex;align-items:center;gap:8px;margin:14px 0 6px;}
.dv-leg .n{width:26px;height:26px;flex:0 0 auto;border-radius:9px;background:var(--ink);color:#F5F0E4;
  display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:800;font-family:var(--font-en);}
.dv-leg b{font-size:13.5px;font-weight:800;color:var(--ink);}
.dv-leg span{font-size:12px;color:var(--text3);}

.dv-items{margin-top:8px;font-size:13.5px;color:var(--ink);}
.dv-items div{display:flex;gap:10px;padding:7px 0;border-top:1px solid var(--border);}
.dv-items div:first-child{border-top:0;}
.dv-items .q{font-family:var(--font-en);font-weight:800;color:var(--gold2);flex:0 0 auto;}
.dv-items .n{flex:1;min-width:0;overflow-wrap:anywhere;}

/* calling the customer is a real action, so it gets a real target */
.dv-line .dv-call{display:inline-flex;align-items:center;gap:7px;min-height:44px;padding:0 13px;border-radius:12px;
  border:1px solid var(--border2);background:var(--card);color:var(--ink);font-size:13.5px;font-weight:800;
  text-decoration:none;}
.dv-line .dv-call:hover{border-color:var(--gold);color:var(--gold2);}
.dv-line .dv-call bdi{font-family:var(--font-en);}

.dv-pay{display:flex;align-items:center;gap:10px;margin-top:12px;padding:11px 13px;border-radius:14px;background:var(--bg);}
.dv-pay i{font-size:20px;color:var(--gold2);}
.dv-pay .t{flex:1;min-width:0;font-size:13px;color:var(--text2);}
.dv-pay .t b{display:block;font-size:15px;color:var(--ink);font-family:var(--font-en);direction:ltr;unicode-bidi:isolate;}

/* ---------- actions ---------- */
.dv-acts{margin-top:14px;display:flex;flex-direction:column;gap:9px;}
.dv-acts .dv-b{min-height:52px;}
.dv-b{width:100%;min-height:52px;border-radius:15px;border:1px solid var(--border2);background:var(--card);
  color:var(--ink);font-family:inherit;font-size:14.5px;font-weight:800;cursor:pointer;
  display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:all .18s;}
.dv-b i{font-size:20px;}
.dv-b.gold{background:var(--gold);border-color:var(--gold2);color:#1C1606;}
.dv-b.gold:hover:not(:disabled){filter:brightness(1.05);}
.dv-b:hover:not(:disabled){border-color:var(--gold);}
.dv-b:disabled{opacity:.5;cursor:not-allowed;}
.dv-b:focus-visible{outline:2px solid var(--gold);outline-offset:2px;}

/* an operation RAF cannot perform yet: named, explained, never faked */
.dv-na{display:flex;align-items:flex-start;gap:10px;padding:12px 13px;border-radius:14px;
  border:1px dashed var(--border2);background:transparent;}
.dv-na i{font-size:18px;color:var(--text3);flex:0 0 auto;margin-top:1px;}
.dv-na .t{flex:1;min-width:0;}
.dv-na .t b{display:block;font-size:13.5px;font-weight:800;color:var(--text2);}
.dv-na .t span{display:block;font-size:12.5px;color:var(--text3);line-height:1.65;margin-top:3px;}
.dv-na .tag{flex:0 0 auto;align-self:center;font-size:11px;font-weight:800;color:var(--text3);
  background:var(--bg3);border-radius:20px;padding:5px 10px;white-space:nowrap;}

.dv-note{display:flex;gap:8px;align-items:flex-start;font-size:12.5px;color:var(--text3);line-height:1.7;
  margin-top:12px;padding-top:12px;border-top:1px solid var(--border);}
.dv-note i{font-size:16px;flex:0 0 auto;margin-top:1px;}
.dv-msg{border-radius:13px;padding:11px 13px;font-size:12.5px;line-height:1.7;margin-top:10px;
  background:rgba(217,83,79,.1);border:1px solid rgba(217,83,79,.34);color:#A63A36;}
.dv-ok{border-radius:13px;padding:11px 13px;font-size:12.5px;line-height:1.7;margin-top:10px;
  background:rgba(46,158,91,.1);border:1px solid rgba(46,158,91,.3);color:#1F7A45;}
.dv-empty{padding:28px 12px;text-align:center;color:var(--text3);font-size:13.5px;line-height:1.8;}
.dv-empty i{display:block;font-size:34px;color:var(--border2);margin-bottom:8px;}

/* the whole card is the way into a delivery */
.dv-open{display:block;width:100%;text-align:start;border:0;background:transparent;padding:0;
  font-family:inherit;color:inherit;cursor:pointer;min-height:44px;}
.dv-open:focus-visible{outline:2px solid var(--gold);outline-offset:3px;border-radius:18px;}

/* ---------- bottom navigation ---------- */
.dv-nav{position:fixed;inset-inline:0;bottom:0;z-index:40;display:flex;justify-content:center;
  background:var(--card);border-top:1px solid var(--border);
  padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px));}
.dv-nav-in{display:flex;width:100%;max-width:640px;}
.dv-nav .dv-tab{flex:1 1 0;min-width:0;min-height:54px;border:0;background:transparent;cursor:pointer;
  font-family:inherit;font-size:10.5px;font-weight:800;color:var(--text3);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;border-radius:14px;padding:0 2px;}
.dv-nav .dv-tab i{font-size:21px;}
.dv-nav .dv-tab span{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.dv-nav .dv-tab[aria-current="page"]{color:var(--gold2);background:var(--gold-soft);}
.dv-nav .dv-tab:focus-visible{outline:2px solid var(--gold);outline-offset:-2px;}
.dv-nav .dv-tab .pip{position:absolute;transform:translate(0,-16px);margin-inline-start:20px;
  min-width:18px;height:18px;border-radius:20px;background:var(--gold2);color:#fff;font-size:10px;
  font-family:var(--font-en);display:flex;align-items:center;justify-content:center;padding:0 4px;}

/* ---------- gate ---------- */
.dv-gate{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:30px;}
.dv-gate-c{max-width:400px;text-align:center;}
.dv-gate-c i{font-size:42px;color:var(--text3);}
.dv-gate-c h1{font-family:var(--font-display);font-size:20px;font-weight:800;color:var(--ink);margin:12px 0 8px;}
.dv-gate-c p{font-size:13.5px;color:var(--text2);line-height:1.9;}
.dv-gate-c .dv-b{margin-top:18px;}

/* a secondary action: quieter than the delivery actions, and never beside
   Confirm delivery without a separator */

/* the one question this app asks */
.dv-dlg{position:fixed;inset:0;z-index:90;background:rgba(20,16,8,.5);display:flex;align-items:center;
  justify-content:center;padding:20px;}
.dv-dlg-c{width:100%;max-width:380px;background:var(--card);border-radius:20px;padding:22px;
  box-shadow:0 30px 60px -30px rgba(20,16,8,.6);}
.dv-dlg-c h3{margin:0 0 8px;font-size:17px;font-weight:800;color:var(--ink);}
.dv-dlg-c p{margin:0 0 18px;font-size:13.5px;line-height:1.8;color:var(--text2);}
.dv-dlg-a{display:flex;flex-direction:column;gap:9px;}
.dv-dlg-a .dv-b{min-height:50px;}

.dv-toast{position:fixed;inset-inline:0;bottom:calc(78px + env(safe-area-inset-bottom,0px));display:flex;
  justify-content:center;z-index:60;pointer-events:none;opacity:0;transform:translateY(10px);
  transition:opacity .22s,transform .22s;}
.dv-toast.show{opacity:1;transform:none;}
.dv-toast > div{background:var(--ink);color:#F5F0E4;border-radius:30px;padding:12px 20px;font-size:13.5px;
  font-weight:700;max-width:90vw;text-align:center;}

@media (min-width:700px){
  .dv{border-inline:1px solid var(--border);min-height:100vh;}
  .dv-body{padding:18px 18px 40px;}
  .dv-nav{position:sticky;bottom:0;}
}
</style>
</head>
<body>

<div class="dv-gate" id="gate" hidden>
  <div class="dv-gate-c">
    <i class="ti ti-steering-wheel"></i>
    <h1 id="gateT"></h1>
    <p id="gateP"></p>
    <button class="dv-b" onclick="location.href='raf_login.html'" id="gateB"></button>
  </div>
</div>

<div class="dv" id="shell" hidden>
  <header class="dv-head">
    <span class="dv-mark" aria-hidden="true">R</span>
    <div class="dv-who"><b id="whoName">—</b><span id="whoRole"></span></div>
    <button class="dv-ico" onclick="refreshAll()" id="btnRefresh"><i class="ti ti-refresh"></i></button>
    <button class="dv-ico" onclick="toggleLang()"><span id="langLabel">EN</span></button>
  </header>

  <main class="dv-body" id="view" aria-live="polite"></main>

  <nav class="dv-nav" aria-label="Driver" id="nav"><div class="dv-nav-in" id="navIn"></div></nav>
</div>

<div class="dv-dlg" id="dlg" hidden>
  <div class="dv-dlg-c" role="alertdialog" aria-modal="true" aria-labelledby="dlgT" aria-describedby="dlgP">
    <h3 id="dlgT"></h3>
    <p id="dlgP"></p>
    <div id="dlgCatWrap" hidden>
      <label for="dlgCat" id="dlgCatL" style="display:block;font-weight:700;margin:4px 0 6px"></label>
      <select id="dlgCat" style="width:100%;box-sizing:border-box;min-height:48px;border:1px solid var(--border);border-radius:12px;padding:0 10px;font:inherit;margin-bottom:8px"></select>
    </div>
    <div id="dlgReasonWrap" hidden>
      <label for="dlgReason" id="dlgReasonL" style="display:block;font-weight:700;margin:4px 0 6px"></label>
      <textarea id="dlgReason" rows="3" style="width:100%;box-sizing:border-box;min-height:84px;border:1px solid var(--border);border-radius:12px;padding:10px;font:inherit;resize:vertical"></textarea>
      <div id="dlgReasonErr" class="dv-msg" hidden style="margin-top:8px"></div>
    </div>
    <div class="dv-dlg-a">
      <button class="dv-b gold" id="dlgYes" onclick="dlgConfirm()"></button>
      <button class="dv-b" id="dlgNo" onclick="dlgCancel()"></button>
    </div>
  </div>
</div>

<div class="dv-toast" id="toast"><div id="toastMsg"></div></div>

<script src="raf_source.js"></script>
<script src="raf_audit.js"></script>
<script src="raf_data.js"></script>
<script src="raf_order_snapshot.js"></script>
<script src="raf_store_ops.js"></script>
<script src="raf_catalog.js"></script>
<script src="raf_inventory.js"></script>
<script src="raf_rules.js"></script>
<script src="raf_order_engine.js"></script>
<script src="raf_permissions.js"></script>
<script src="raf_driver.js"></script>
<!-- the driver availability authority (own state, self-unavailable, schedule) -->
<script src="raf_driver_management.js"></script>
<script src="raf_driver_rating.js"></script>
<script src="raf_driver_performance.js"></script>
<!-- the Logistics operations authority: the driver's exception actions and the
     delivery auto-close hook (it renders nothing; every call proves the session) -->
<script src="raf_delivery_management.js"></script>
<script>
/* ============================================================
   DRIVER WORKSPACE
   Every fact and every refusal comes from RAFDriver, which reads
   RAFOrderEngine and RAFOrderSnapshot. This file renders; it holds
   no lifecycle rule and performs no state change of its own.
   ============================================================ */
(function(){
  'use strict';
  var D = window.RAFDriver;
  var ME = null, CAP = null, msg = null, ok = null, openId = null;
  var st = { tab:'home' };
  var PREF = 'raf_driver_view';

  function root(){ return document.getElementById('htmlRoot'); }
  function isEn(){ return root().lang === 'en'; }
  function T(ar,en){ return isEn() ? en : ar; }
  function L(o){ return (o && typeof o==='object') ? (isEn()?(o.en||o.ar):(o.ar||o.en)) : (o||''); }
  function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
  function el(id){ return document.getElementById(id); }
  var toastTimer = null;
  function toast(m){
    el('toastMsg').textContent = m; el('toast').classList.add('show');
    clearTimeout(toastTimer); toastTimer = setTimeout(function(){ el('toast').classList.remove('show'); }, 2400);
  }
  /* Kuwait time, Western digits, like the rest of RAF */
  function kwDateTime(ms){
    if (!ms) return '—';
    try { return new Date(ms).toLocaleString(isEn() ? 'en-GB' : 'ar-KW-u-nu-latn',
      { day:'2-digit', month:'short', hour:'2-digit', minute:'2-digit', timeZone:'Asia/Kuwait' }); }
    catch(e){ return new Date(ms).toISOString().slice(0,16).replace('T',' '); }
  }

  var TABS = [
    { k:'home',    ic:'ti-home',           ar:'الرئيسية', en:'Home' },
    { k:'tasks',   ic:'ti-package',        ar:'المتاح',   en:'Available' },
    { k:'active',  ic:'ti-truck-delivery', ar:'توصيلتي',  en:'My delivery' },
    { k:'history', ic:'ti-history',        ar:'السجل',    en:'History' },
    { k:'profile', ic:'ti-user',           ar:'حسابي',    en:'Profile' }
  ];

  /* ---------- small building blocks ---------- */
  function stageChip(stage){
    var txt = D.STAGE_TEXT[stage] || { ar:'—', en:'—' };
    var cls = stage === 'awaiting_driver' ? 'wait' : stage === 'claimed' ? 'mine'
            : stage === 'out_for_delivery' ? 'hold' : stage === 'delivered' ? 'hold' : '';
    var ic  = stage === 'awaiting_driver' ? 'ti-clock-hour-4' : stage === 'claimed' ? 'ti-hand-grab'
            : stage === 'out_for_delivery' ? 'ti-truck-delivery' : 'ti-circle-check';
    /* the state is never colour alone: an icon and a word carry it too */
    return '<span class="dv-stage '+cls+'"><i class="ti '+ic+'" aria-hidden="true"></i>'+esc(T(txt.ar,txt.en))+'</span>';
  }
  var TIMING = {
    instant:      { ar:'فوري',            en:'Instant' },
    scheduled:    { ar:'موعد محدد',       en:'Scheduled' },
    next_opening: { ar:'عند الافتتاح',    en:'Next opening' }
  };
  function timingText(t){
    var d = t.delivery || {};
    var base = d.timing && TIMING[d.timing] ? T(TIMING[d.timing].ar, TIMING[d.timing].en) : T('غير محدد','Not specified');
    if (d.timing === 'scheduled' && d.scheduled && d.scheduled.date)
      base += ' · <bdi>'+esc(d.scheduled.date)+' '+esc(d.scheduled.from||'')+'–'+esc(d.scheduled.to||'')+'</bdi>';
    else if (d.receiveAt && d.receiveAt.date)
      base += ' · <bdi>'+esc(d.receiveAt.date)+(d.receiveAt.time ? ' '+esc(d.receiveAt.time) : '')+'</bdi>';
    return base;
  }
  function addressText(t){
    var d = t.delivery || {};
    var parts = [d.area, d.block ? T('قطعة ','Block ')+d.block : null, d.street ? T('شارع ','Street ')+d.street : null,
                 d.building, d.floor ? T('الدور ','Floor ')+d.floor : null, d.apartment].filter(Boolean);
    return parts.length ? parts.join(' · ') : (d.address || T('لا يوجد عنوان في سجل الطلب','No address in the order record'));
  }
  function unavailable(cap, icon){
    if (!cap || cap.available) return '';
    return '<div class="dv-na"><i class="ti '+(icon||'ti-lock')+'" aria-hidden="true"></i><div class="t">'
      + '<b>'+esc(cap.title)+'</b><span>'+esc(T(cap.ar, cap.en))+'</span></div>'
      + '<span class="tag">'+esc(T('غير مُهيّأ','Not configured'))+'</span></div>';
  }
  function cap(key, titleAr, titleEn){
    var c = CAP[key] || { available:false, ar:'', en:'' };
    return { available:c.available, ar:c.ar, en:c.en, title:T(titleAr, titleEn) };
  }

  /* ---------- a delivery card in a list ---------- */
  /* a pool card: the primary action says exactly what it does — the driver
     pulls the delivery and owns it */
  function poolCard(t){
    return '<section class="dv-card">'
      + '<div class="dv-card-h"><h2>'+esc(L(t.store.name))+'</h2>'+stageChip(t.stage)+'</div>'
      + '<div class="dv-oid">'+esc(t.orderId)+'</div>'
      + (t.fulfilment && t.fulfilment.pickedUpAt
          ? '<div class="dv-line"><i class="ti ti-package-export" aria-hidden="true"></i><span class="v">'
            + esc(T('استُلم من المتجر مسبقًا — البضاعة ليست في المتجر','Already collected from the store — the goods are not at the store'))+'</span></div>'
          : '')
      + '<div class="dv-line"><i class="ti ti-map-pin" aria-hidden="true"></i><span class="v">'+addressText(t)+'</span></div>'
      + '<div class="dv-line"><i class="ti ti-clock" aria-hidden="true"></i><span class="v">'+timingText(t)+'</span></div>'
      + '<div class="dv-line"><i class="ti ti-shopping-bag" aria-hidden="true"></i><span class="v">'
        + esc(T(t.itemCount + ' قطعة', t.itemCount + (t.itemCount === 1 ? ' item' : ' items')))
        + (t.payment.collect ? ' · ' + esc(T('يُحصَّل عند التسليم','Collect on delivery')) + ' <bdi>' + esc(t.payment.collect) + ' ' + esc(t.payment.currency||'') + '</bdi>' : '')
        + '</span></div>'
      + '<div class="dv-acts"><button class="dv-b gold" onclick="doClaim(\''+esc(t.orderId)+'\')" aria-label="'
        + esc(T('سحب الطلب ' + t.orderId, 'Take delivery ' + t.orderId))+'">'
        + '<i class="ti ti-hand-grab"></i>'+esc(T('سحب الطلب','Take delivery'))+'</button>'
        /* skipping is recorded, never ownership; a skipped delivery stays here */
        + (t.skippedByMe
            ? '<span class="dv-stage"><i class="ti ti-player-skip-forward" aria-hidden="true"></i>'+esc(T('تخطيته','Skipped'))+'</span>'
            : '<button class="dv-b" onclick="doSkip(\''+esc(t.orderId)+'\')" aria-label="'
              + esc(T('تخطي الطلب ' + t.orderId, 'Skip delivery ' + t.orderId))+'">'
              + '<i class="ti ti-player-skip-forward"></i>'+esc(T('تخطي','Skip'))+'</button>')
        + '</div>'
      + '</section>';
  }
  function taskCard(t, clickable){
    var inner = '<div class="dv-card-h"><h2>'+esc(L(t.store.name))+'</h2>'+stageChip(t.stage)+'</div>'
      + '<div class="dv-oid">'+esc(t.orderId)+'</div>'
      + '<div class="dv-line"><i class="ti ti-map-pin" aria-hidden="true"></i><span class="v">'+addressText(t)+'</span></div>'
      + '<div class="dv-line"><i class="ti ti-clock" aria-hidden="true"></i><span class="v">'+timingText(t)+'</span></div>'
      + '<div class="dv-line"><i class="ti ti-shopping-bag" aria-hidden="true"></i><span class="v">'
        + esc(T(t.itemCount + ' قطعة', t.itemCount + (t.itemCount === 1 ? ' item' : ' items')))
        + (t.payment.collect ? ' · ' + esc(T('يُحصَّل عند التسليم','Collect on delivery')) + ' <bdi>' + esc(t.payment.collect) + ' ' + esc(t.payment.currency||'') + '</bdi>' : '')
        + '</span></div>';
    if (!clickable) return '<section class="dv-card">'+inner+'</section>';
    return '<section class="dv-card'+(t.stage === 'assigned' || t.stage === 'picked_up' ? ' live' : '')+'">'
      + '<button class="dv-open" onclick="openTask(\''+esc(t.orderId)+'\')" aria-label="'
      + esc(T('فتح توصيلة ' + t.orderId, 'Open delivery ' + t.orderId))+'">'+inner+'</button></section>';
  }

  /* ---------- notifications (read from RAFNotify for the signed-in driver) ---------- */
  function myNotifs(){
    try { return window.RAFNotify && RAFNotify.forRecipient ? RAFNotify.forRecipient({ audience:'driver' }) : []; }
    catch(e){ return []; }
  }
  function notifLine(n){
    return '<button class="dv-open" type="button" onclick="openNotif(\''+esc(n.notificationId)+'\',\''+esc(n.entityId||'')+'\')">'
      + '<div class="dv-line"><i class="ti '+(n.read ? 'ti-bell' : 'ti-bell-ringing')+'" aria-hidden="true"></i>'
      + '<span class="v"><b>'+esc(L(n.title))+'</b>'+(n.message ? ' · <bdi>'+esc(L(n.message))+'</bdi>' : '')
      + '<br><span style="opacity:.75">'+esc(kwDateTime(n.timestamp))+(n.read ? '' : ' · '+esc(T('غير مقروء','Unread')))+'</span></span></div></button>';
  }

  /* ---------- availability (RAFDriverManagement.availability is the authority) ----------
     The driver sees their state, why, and the schedule management set. There is
     no overtime counter and no way to make oneself Available — only management
     does that. Going Unavailable never touches a delivery already held. */
  var DAYS = { ar:['الأحد','الاثنين','الثلاثاء','الأربعاء','الخميس','الجمعة','السبت'],
               en:['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'] };
  function AV(){ return window.RAFDriverManagement && RAFDriverManagement.availability; }
  function renderAvailability(){
    var A = AV(), h = '<section class="dv-card" id="avCard"><div class="dv-card-h"><h2>'+esc(T('حالة التوفر','Availability'))+'</h2>';
    var m = A ? A.mine() : null;
    if (!m || !m.ok){
      return h + '</div><div class="dv-na"><i class="ti ti-lock" aria-hidden="true"></i><div class="t"><b>'
        + esc(T('تعذّر قراءة حالة التوفر','Availability could not be read'))+'</b><span>'
        + esc(m && m.message ? L(m.message) : T('خدمة التوفر غير محمّلة.','The availability service is not loaded.'))+'</span></div></div></section>';
    }
    var on = m.state === 'available';
    h += '<span class="dv-stage'+(on ? ' mine' : '')+'" data-av-state="'+esc(m.state||'')+'"><i class="ti '+(on ? 'ti-circle-check' : 'ti-circle-minus')+'" aria-hidden="true"></i>'
      + esc(on ? T('متاح','Available') : T('غير متاح','Unavailable'))+'</span></div>';
    h += '<div class="dv-line"><i class="ti ti-info-circle" aria-hidden="true"></i><span class="v">'
      + esc(on ? T('تظهر لك الطلبات الجديدة ويمكنك سحبها.','New deliveries are shown to you and you can take them.')
               : T('لا تصلك مهام جديدة الآن. أي توصيلة لديك تستمر كالمعتاد.','You receive no new tasks now. Any delivery you already hold continues as normal.'))+'</span></div>';
    if (m.sourceLabel) h += '<div class="dv-line"><i class="ti ti-tag" aria-hidden="true"></i><span class="v">'+esc(T('المصدر: ','Source: '))+esc(L(m.sourceLabel))
      + (m.since ? ' · <bdi>'+esc(kwDateTime(m.since))+'</bdi>' : '')+'</span></div>';
    if (m.reason) h += '<div class="dv-line"><i class="ti ti-message" aria-hidden="true"></i><span class="v">'+esc(T('السبب: ','Reason: '))+'<bdi>'+esc(m.reason)+'</bdi></span></div>';
    if (m.source === 'auto_offline') h += '<div class="dv-note"><i class="ti ti-info-circle" aria-hidden="true"></i><span>'
      + esc(T('تم التحويل تلقائيًا لعدم سحب أي طلب خلال المدة المحددة. هذا ليس إجراءً تأديبيًا وحسابك نشط. الإدارة تعيدك متاحًا.',
              'Switched automatically because no delivery was taken within the set time. This is not disciplinary and your account stays active. Management can make you Available again.'))+'</span></div>';
    /* schedule — set by management, read-only here */
    h += '<div class="dv-note" style="display:block"><b style="display:block;color:var(--text2);margin-bottom:4px">'+esc(T('جدول العمل (تحدده الإدارة)','Work schedule (set by management)'))+'</b>';
    if (m.schedule && m.schedule.windows && m.schedule.windows.length){
      h += '<ul style="margin:0;padding-inline-start:18px">' + m.schedule.windows.map(function(w){
        return '<li>'+esc(T(DAYS.ar[w.day], DAYS.en[w.day]))+' · <bdi dir="ltr">'+esc(w.start)+'–'+esc(w.end)+'</bdi></li>'; }).join('') + '</ul>'
        + '<span>'+esc(T('المنطقة الزمنية: ','Timezone: '))+'<bdi dir="ltr">'+esc(m.schedule.timezone||'')+'</bdi></span>';
    } else h += '<span>'+esc(T('لم تحدد الإدارة جدولًا بعد.','Management has not set a schedule yet.'))+'</span>';
    h += '</div>';
    if (m.canSetUnavailable){
      h += '<div style="margin-top:12px"><button class="dv-b" type="button" id="avSelfBtn" onclick="doSelfUnavailable()"><i class="ti ti-player-pause" aria-hidden="true"></i>'
        + esc(T('تحويل نفسي إلى غير متاح','Set myself Unavailable'))+'</button></div>';
      if (m.liveDeliveries) h += '<div class="dv-note"><i class="ti ti-truck-delivery" aria-hidden="true"></i><span>'
        + esc(T('لديك توصيلات قائمة — ستبقى معك ويجب إكمالها.','You hold deliveries — they stay with you and must be completed.'))+'</span></div>';
    } else {
      h += '<div class="dv-note"><i class="ti ti-lock" aria-hidden="true"></i><span>'+esc(T('العودة إلى «متاح» تتم عبر الإدارة فقط.','Only management can make you Available again.'))+'</span></div>';
    }
    return h + '</section>';
  }
  window.doSelfUnavailable = function(){
    var m = AV() && AV().mine();
    var reasons = m && m.ok && m.unavailableReasons && m.unavailableReasons.length ? m.unavailableReasons : null;
    openDialog('التحويل إلى غير متاح', 'Set yourself Unavailable',
      'لن تصلك مهام جديدة. التوصيلات التي لديك تبقى معك.' + (m && m.liveDeliveries ? ' لديك ' + m.liveDeliveries + ' توصيلة قائمة.' : ''),
      'You will not receive new tasks. Deliveries you hold stay with you.' + (m && m.liveDeliveries ? ' You hold ' + m.liveDeliveries + ' delivery(ies).' : ''),
      'تأكيد', 'Confirm', function(text, key){
        /* the reason list comes from RAFConfig through the authority; a free-text
           reason is used only when no list is configured */
        var res = reasons ? AV().setSelfUnavailable(text ? { reasonKey:key, note:text } : { reasonKey:key })
                          : AV().setSelfUnavailable({ reason:text });
        if (!res.ok){ toast(res.message ? L(res.message) : res.code || res.reason); render(); return; }
        toast(T('أصبحت غير متاح لمهام جديدة','You are now unavailable for new tasks')); render();
      }, true,
      reasons ? reasons.map(function(r){ return { key:r.key, label:L({ ar:r.ar, en:r.en }), requiresDescription:!!r.requiresDescription }; }) : null,
      reasons ? { category:T('السبب (إلزامي)','Reason (required)'), text:T('ملاحظة (إلزامية لبعض الأسباب)','Note (required for some reasons)'),
                  pickError:T('اختر السبب.','Choose the reason.'), textError:T('الملاحظة إلزامية لهذا السبب.','A note is required for this reason.') } : null);
  };
  /* one timer to the next availability threshold (work duration / overtime /
     auto-offline) — it asks the authority to evaluate, it does not poll */
  var avTimer = null;
  function scheduleAvDeadline(){
    clearTimeout(avTimer); var A = AV(); if (!A) return;
    var at = null; try { at = A.nextDeadline(); } catch(e){}
    if (!at) return;
    avTimer = setTimeout(function(){ try { A.evaluate(); } catch(e){} if (el('dlg').hidden) render(); scheduleAvDeadline(); }, Math.max(0, Math.min(at - Date.now() + 250, 2147483000)));
  }

  /* ════════════════ HOME ════════════════
     What am I carrying, what is waiting, what RAF cannot tell me yet. */
  function renderHome(){
    var a = D.active({ actor:ME.id }), q = D.queue({ actor:ME.id });
    var h = '<h1 class="dv-h1">'+esc(T('مساحة السائق','Driver workspace'))+'</h1>'
      + '<p class="dv-sub">'+esc(T('كل ما تحتاجه لتوصيل الطلبات المسندة إليك.',
                                   'Everything you need for the deliveries assigned to you.'))+'</p>';

    /* unread notifications addressed to this driver (RAFNotify) */
    var unread = myNotifs().filter(function(n){ return !n.read; });
    if (unread.length){
      h += '<section class="dv-card live"><div class="dv-card-h"><h2>'+esc(T('إشعارات جديدة','New notifications'))+'</h2>'
        + '<span class="dv-stage mine"><i class="ti ti-bell" aria-hidden="true"></i><bdi>'+unread.length+'</bdi></span></div>'
        + unread.slice(0,3).map(notifLine).join('') + '</section>';
    }

    h += renderAvailability();

    /* the current task always comes before anything else on this screen */
    h += '<section class="dv-card'+(a.ok && a.task ? ' live' : '')+'">'
      + '<div class="dv-card-h"><h2>'+esc(T('توصيلتي الحالية','My current delivery'))+'</h2></div>';
    if (a.ok && a.task){
      h += taskCard(a.task, true);
      if (a.others) h += '<div class="dv-note"><i class="ti ti-info-circle"></i><span>'
        + esc(T('لديك ' + a.others + ' توصيلة أخرى مسندة إليك.', 'You have ' + a.others + ' other assigned deliveries.'))+'</span></div>';
    } else {
      h += '<div class="dv-empty"><i class="ti ti-steering-wheel"></i>'
        + esc(T('لا توجد توصيلة مسندة إليك الآن.','No delivery is assigned to you right now.'))+'</div>';
    }
    h += '</section>';

    var n = q.ok ? q.tasks.length : 0;
    h += '<section class="dv-card"><div class="dv-card-h"><h2>'+esc(T('طلبات بانتظار سائق','Orders waiting for a driver'))+'</h2>'
      + '<span class="dv-stage wait"><i class="ti ti-clock-hour-4" aria-hidden="true"></i><bdi>'+n+'</bdi></span></div>'
      + '<div class="dv-line"><i class="ti ti-info-circle" aria-hidden="true"></i><span class="v">'
      + esc(T('هذه الطلبات أنهى المتجر تجهيزها وتنتظر سائقاً.','These orders are finished by the store and are waiting for a driver.'))
      + '</span></div>'
      + '<div class="dv-acts"><button class="dv-b" onclick="setTab(\'tasks\')"><i class="ti ti-list"></i>'
      + esc(T('عرض الطلبات المتاحة','View available orders'))+'</button></div></section>';

    h += renderPerformance();
    return h;
  }

  /* ---------- Phase G: my performance ----------
     Read-only, from RAFDriverPerformance (own data only; identity from the
     session). Total rating only — no count, no individual ratings, no comments.
     No score, rate or ranking. Earnings/distance remain not recorded by RAF. */
  var PF = { preset:'today', from:'', to:'' };
  function hm(ms){
    if (ms == null) return T('غير متاح','Not available');
    var m = Math.floor(ms / 60000);
    return T(Math.floor(m / 60) + ' س ' + (m % 60) + ' د', Math.floor(m / 60) + 'h ' + (m % 60) + 'm');
  }
  function renderPerformance(){
    var h = '<section class="dv-card" id="pfCard"><div class="dv-card-h"><h2>'+esc(T('أدائي','My performance'))+'</h2></div>';
    h += '<div class="pf-periods" role="group" aria-label="'+esc(T('الفترة','Period'))+'">'
      + [['today','اليوم','Today'],['week','هذا الأسبوع','This week'],['month','هذا الشهر','This month'],['custom','فترة مخصصة','Custom']].map(function(x){
          return '<button type="button" aria-pressed="'+(PF.preset === x[0])+'" onclick="pfPreset(\''+x[0]+'\')">'+esc(T(x[1], x[2]))+'</button>'; }).join('')
      + '</div>';
    if (PF.preset === 'custom')
      h += '<div class="pf-range"><label>'+esc(T('من','From'))+'<input type="date" id="pfFrom" dir="ltr" value="'+esc(PF.from)+'" onchange="pfDate(\'from\',this.value)"></label>'
        + '<label>'+esc(T('إلى','To'))+'<input type="date" id="pfTo" dir="ltr" value="'+esc(PF.to)+'" onchange="pfDate(\'to\',this.value)"></label></div>';
    var P = window.RAFDriverPerformance;
    if (!P) return h + '<div class="dv-empty">'+esc(T('خدمة الأداء غير محمّلة.','The performance service is not loaded.'))+'</div></section>';
    if (PF.preset === 'custom' && (!PF.from || !PF.to))
      return h + '<div class="dv-note"><i class="ti ti-calendar" aria-hidden="true"></i><span>'+esc(T('اختر تاريخ البداية والنهاية.','Choose a start and end date.'))+'</span></div></section>';
    var spec = PF.preset === 'custom' ? { preset:'custom', from:PF.from, to:PF.to } : { preset:PF.preset };
    var r = P.mine({ period:spec });
    if (!r.ok) return h + '<div class="dv-msg">'+esc(r.message)+'</div></section>';
    var m = r.metrics, tot = m.rating && m.rating.total;
    function cell(ar, en, v, wide){ return '<div class="pf-m'+(wide ? ' wide' : '')+'"><span>'+esc(T(ar, en))+'</span><b>'+v+'</b></div>'; }
    h += '<div class="pf-grid">'
      + cell('السحب الناجح','Successful claims', '<bdi>'+m.claims+'</bdi>')
      + cell('التوصيلات المكتملة','Completed deliveries', '<bdi>'+m.deliveries+'</bdi>')
      + cell('نُقلت منك (إعادة إسناد أو إرجاع)','Moved from you (reassigned / returned)', '<bdi>'+m.lostOwnership+'</bdi>')
      + cell('التخطي','Skips', '<bdi>'+m.skips+'</bdi>')
      + cell('طلبات إعادة الإسناد','Reassignment requests', '<bdi>'+m.reassignmentRequests+'</bdi>')
      + cell('الاستثناءات','Exceptions', '<bdi>'+m.exceptions+'</bdi>')
      + cell('ساعات العمل','Working hours', '<bdi>'+esc(hm(m.workingMs))+'</bdi>')
      + cell('العمل الإضافي','Overtime', '<bdi>'+esc(hm(m.overtimeMs))+'</bdi>')
      + cell('تقييم العملاء (كل الفترات)','Customer rating (all time)', tot == null ? esc(T('لا يوجد تقييم بعد','No rating yet')) : '<bdi dir="ltr">'+esc(tot.toFixed(1))+' / 5</bdi>', true)
      + '</div>';
    h += '<div class="dv-note"><i class="ti ti-info-circle" aria-hidden="true"></i><span>'
      + esc(T('أرقام للاطلاع فقط من سجلات رف الفعلية، بتوقيت الكويت. لا توجد درجة أو ترتيب. التقييم يشمل كل التقييمات السابقة.',
              'Read-only figures from RAF’s actual records, in Kuwait time. There is no score or ranking. The rating covers all past ratings.'))
      + (m.openSession ? ' ' + esc(T('ساعات الجلسة الحالية محسوبة حتى وقت العرض.','The current session is counted up to the time shown.')) : '')+'</span></div>';
    return h + '</section>';
  }
  window.pfPreset = function(k){ PF.preset = k; render(); var c = el('pfCard'); if (c) c.scrollIntoView({ block:'nearest' }); };
  window.pfDate = function(k, v){ PF[k] = v; render(); var c = el('pfCard'); if (c) c.scrollIntoView({ block:'nearest' }); };

  /* ════════════════ AVAILABLE ════════════════
     Visible, not claimable: RAF has no approved assignment rule. */
  function renderTasks(){
    var q = D.queue({ actor:ME.id });
    if (!q.ok) return '<div class="dv-card"><div class="dv-empty">'+esc(q.message)+'</div></div>';
    var h = '<h1 class="dv-h1">'+esc(T('الطلبات المتاحة','Available deliveries'))+'</h1>'
      + '<p class="dv-sub">'+esc(T('أول سائق يسحب الطلب يصبح مسؤولاً عنه، وقد يسنده فريق اللوجستيات إلى سائق. الطلب يختفي من القائمة فور ذلك.',
                                   'The first driver to take a delivery owns it, or Logistics may assign it to a driver. It leaves this list the moment that happens.'))+'</p>';
    if (msg) h += '<div class="dv-msg">'+esc(msg)+'</div>';
    if (ok)  h += '<div class="dv-ok">'+esc(ok)+'</div>';
    h += q.tasks.length ? q.tasks.map(poolCard).join('')
       : '<section class="dv-card"><div class="dv-empty"><i class="ti ti-package-off"></i>'
         + esc(T('لا توجد طلبات بانتظار سائق الآن.','No deliveries are waiting for a driver right now.'))+'</div></section>';
    return h;
  }

  /* ════════════════ MY DELIVERY ════════════════ */
  function renderActive(){
    var r = openId ? D.task(openId, { actor:ME.id }) : D.active({ actor:ME.id });
    if (!r.ok) return '<div class="dv-card"><div class="dv-empty">'+esc(r.message)+'</div></div>';
    var t = r.task;
    if (!t) return '<h1 class="dv-h1">'+esc(T('توصيلتي','My delivery'))+'</h1>'
      + '<section class="dv-card"><div class="dv-empty"><i class="ti ti-steering-wheel"></i>'
      + esc(T('لا توجد توصيلة مسندة إليك.','No delivery is assigned to you.'))+'<br>'
      + esc(T('يظهر هنا الطلب فور إسناده لحسابك.','An order appears here as soon as it is assigned to your account.'))+'</div></section>';

    var mine = t.fulfilment.driverId === ME.id;
    var h = '<h1 class="dv-h1">'+esc(T('توصيلتي','My delivery'))+'</h1>'
      + '<section class="dv-card live"><div class="dv-card-h"><h2 class="dv-oid">'+esc(t.orderId)+'</h2>'+stageChip(t.stage)+'</div>';

    /* 1 · PICKUP — the store */
    h += '<div class="dv-leg"><span class="n" aria-hidden="true">1</span><div><b>'+esc(T('الاستلام','Pickup'))+'</b>'
       + ' <span>'+esc(T('من المتجر','from the store'))+'</span></div></div>'
      + '<div class="dv-line"><i class="ti ti-building-store" aria-hidden="true"></i><span class="v">'+esc(L(t.store.name))
        + (t.store.number ? ' · <bdi>'+esc(t.store.number)+'</bdi>' : '')+'</span></div>'
      + unavailable(cap('navigation','عنوان المتجر والملاحة','Store address and navigation'), 'ti-map-off');

    /* 2 · DELIVERY — the customer */
    h += '<div class="dv-leg"><span class="n" aria-hidden="true">2</span><div><b>'+esc(T('التسليم','Delivery'))+'</b>'
       + ' <span>'+esc(T('إلى العميل','to the customer'))+'</span></div></div>'
      + '<div class="dv-line"><i class="ti ti-user" aria-hidden="true"></i><span class="k">'+esc(T('العميل','Customer'))+'</span>'
        + '<span class="v">'+esc(t.customer.name || '—')+'</span></div>'
      + '<div class="dv-line"><i class="ti ti-phone" aria-hidden="true"></i><span class="k">'+esc(T('الهاتف','Phone'))+'</span>'
        + '<span class="v">'+(t.customer.phone
            ? '<a class="dv-call" href="tel:'+esc(String(t.customer.phone).replace(/\s/g,''))+'" aria-label="'
              + esc(T('اتصال بالعميل','Call the customer'))+'"><i class="ti ti-phone-call" aria-hidden="true"></i>'
              + '<bdi>'+esc(t.customer.phone)+'</bdi></a>'
            : '—')+'</span></div>'
      + '<div class="dv-line"><i class="ti ti-map-pin" aria-hidden="true"></i><span class="k">'+esc(T('العنوان','Address'))+'</span>'
        + '<span class="v">'+addressText(t)+'</span></div>'
      + (t.delivery.instructions ? '<div class="dv-line"><i class="ti ti-note" aria-hidden="true"></i><span class="k">'
        + esc(T('تعليمات','Instructions'))+'</span><span class="v">'+esc(t.delivery.instructions)+'</span></div>' : '')
      + '<div class="dv-line"><i class="ti ti-clock" aria-hidden="true"></i><span class="k">'+esc(T('التوقيت','Timing'))+'</span>'
        + '<span class="v">'+timingText(t)+'</span></div>';

    /* what is in the bag */
    h += '<div class="dv-leg"><span class="n" aria-hidden="true">3</span><div><b>'+esc(T('محتوى الطلب','Order contents'))+'</b>'
       + ' <span>'+esc(T(t.itemCount+' قطعة', t.itemCount + (t.itemCount === 1 ? ' item' : ' items')))+'</span></div></div>'
      + '<div class="dv-items">'+t.items.map(function(it){
          return '<div><span class="q"><bdi>'+esc(it.qty)+'×</bdi></span><span class="n">'+esc(L(it.name))+'</span></div>'; }).join('')+'</div>';

    h += '<div class="dv-pay"><i class="ti ti-cash" aria-hidden="true"></i><div class="t">'
      + esc(t.payment.collect ? T('المبلغ المطلوب تحصيله','Amount to collect') : T('مدفوع مسبقاً','Already paid'))
      + (t.payment.collect ? '<b>'+esc(t.payment.collect)+' '+esc(t.payment.currency||'')+'</b>' : '')
      + '</div><span class="dv-stage">'+esc(L(t.payment.method) || '—')+'</span></div>';

    /* ---- the operations that genuinely exist ---- */
    var pendReq = mine && t.reassignmentRequest;
    if (pendReq){
      /* a pending reassignment request pauses pickup and delivery */
      h += '<div class="dv-msg" role="status"><b>'+esc(T('طلب إعادة الإسناد قيد المراجعة','Reassignment request under review'))+'</b><br>'
        + esc(T('السبب: ','Reason: ')) + esc(pendReq.reason) + '<br>'
        + esc(T('إجراءات الاستلام والتسليم متوقفة حتى يبت فريق اللوجستيات في الطلب.','Pickup and delivery are paused until Logistics decides.'))+'</div>'
        + '<div class="dv-acts"><button class="dv-b" onclick="doCancelRequest(\''+esc(t.orderId)+'\')"><i class="ti ti-arrow-back-up"></i>'
        + esc(T('إلغاء طلب إعادة الإسناد','Cancel reassignment request'))+'</button></div>';
    }
    h += '<div class="dv-acts">';
    if (pendReq) { /* no delivery actions while the request is pending */ }
    else if (mine && t.stage === 'claimed')
      h += '<button class="dv-b gold" onclick="doPickup(\''+esc(t.orderId)+'\')"><i class="ti ti-package-import"></i>'
        + esc(T('تأكيد استلام الطلب من المتجر','Confirm pickup from the store'))+'</button>';
    else if (mine && t.stage === 'out_for_delivery'){
      h += '<div class="dv-ok"><i class="ti ti-check"></i> '
        + esc(T('استلمت الطلب في ','Picked up at ')) + esc(kwDateTime(t.fulfilment.pickedUpAt)) + ' — '
        + esc(T('الطلب في طريقه للعميل.','the order is on its way to the customer.'))+'</div>'
        + '<button class="dv-b gold" onclick="doDeliver(\''+esc(t.orderId)+'\')"><i class="ti ti-circle-check"></i>'
        + esc(T('تأكيد تسليم الطلب للعميل','Confirm delivery to the customer'))+'</button>';
    } else if (mine && t.stage === 'delivered')
      h += '<div class="dv-ok"><i class="ti ti-circle-check"></i> '
        + esc(T('تم تسليم الطلب في ','Delivered at ')) + esc(kwDateTime(t.fulfilment.deliveredAt))+'</div>';
    h += '</div>';

    if (msg) h += '<div class="dv-msg">'+esc(msg)+'</div>';
    if (ok)  h += '<div class="dv-ok">'+esc(ok)+'</div>';

    /* a driver cannot hand a claimed delivery back directly; the problem flow
       is a reassignment request decided by Logistics, which is not configured
       yet — so it is shown as unavailable rather than offered */
    /* ---- delivery exception (Phase E): state, instruction, call attempts, report ---- */
    var EX = window.RAFDeliveryOps && RAFDeliveryOps.exceptions;
    if (EX && mine && (t.stage === 'claimed' || t.stage === 'out_for_delivery')){
      var xv = EX.driverView(t.orderId);
      if (xv.ok){
        h += '<div class="dv-leg"><span class="n" aria-hidden="true">!</span><div><b>'+esc(T('مشكلة في التوصيل','Delivery problem'))+'</b></div></div>';
        if (xv.active){
          var stTxt = xv.active.status === 'escalated' ? T('لدى الإدارة','With management') : T('مفتوح','Open');
          h += '<div class="dv-msg" role="status"><b>'+esc(L({ ar:xv.active.category.ar || xv.active.category.en, en:xv.active.category.en }))+'</b> · '+esc(stTxt)
            + (xv.active.instruction ? '<br>'+esc(T('تعليمات الإدارة: ','Management instruction: '))+esc(xv.active.instruction) : '')+'</div>';
          if (xv.active.canClose) h += '<div class="dv-acts"><button class="dv-b" onclick="doCloseException(\''+esc(xv.active.exceptionId)+'\')"><i class="ti ti-circle-check"></i>'
            + esc(T('تم الوصول إلى العميل — إغلاق','Customer reached — close'))+'</button></div>';
        } else if (xv.last && xv.last.status === 'closed'){
          h += '<div class="dv-ok">'+esc(T('آخر مشكلة أُغلقت','The last problem was closed'))
            + (xv.last.resolutionType === 'driver_must_continue' ? ' — '+esc(T('تابع التوصيل','continue the delivery')) : '')
            + (xv.last.autoClosed ? '' : '')+'</div>';
        }
        var ca = xv.callAttempts;
        h += '<div class="dv-line"><i class="ti ti-phone-x" aria-hidden="true"></i><span class="v">'
          + esc(T('محاولات الاتصال بالعميل المسجّلة: ','Recorded customer call attempts: ')) + '<bdi>' + ca.count + (ca.required != null ? ' / ' + ca.required : '') + '</bdi></span></div>'
          + '<div class="dv-acts"><button class="dv-b" onclick="doCallAttempt(\''+esc(t.orderId)+'\')"><i class="ti ti-phone-off"></i>'
          + esc(T('اتصلت ولم يرد العميل — تسجيل محاولة','I called, no answer — record attempt'))+'</button>'
          + (!xv.active ? '<button class="dv-b" onclick="doReport(\''+esc(t.orderId)+'\')"><i class="ti ti-alert-triangle"></i>'+esc(T('الإبلاغ عن مشكلة','Report a problem'))+'</button>' : '')
          + '</div>';
      }
    }

    h += '<div class="dv-acts" style="margin-top:12px">'
      + (mine && !pendReq && (t.stage === 'claimed' || t.stage === 'out_for_delivery')
          ? '<button class="dv-b" onclick="doRequest(\''+esc(t.orderId)+'\')"><i class="ti ti-arrows-exchange"></i>'
            + esc(T('طلب إعادة الإسناد','Request reassignment'))+'</button>'
          : '')
      + unavailable(cap('proofOfDelivery','إثبات التسليم','Proof of delivery'), 'ti-camera')
      + '</div>';

    h += '<div class="dv-note"><i class="ti ti-info-circle"></i><span>'
      + esc(T('حالة الطلب يديرها محرك الطلبات؛ هذه الشاشة تعرضها ولا تغيّرها.',
              'The order state is owned by the order engine; this screen shows it and never changes it.'))+'</span></div>';
    return h + '</section>';
  }

  /* ════════════════ HISTORY ════════════════ */
  function renderHistory(){

      + '<p class="dv-sub">'+esc(T('التوصيلات المنتهية المسندة إلى حسابك.','Completed deliveries assigned to your account.'))+'</p>';
    h += r.tasks.length ? r.tasks.map(function(t){ return taskCard(t, false); }).join('')
       : '<section class="dv-card"><div class="dv-empty"><i class="ti ti-history"></i>'
         + esc(T('لا يوجد سجل توصيل بعد.','No delivery history yet.'))+'</div></section>';
    h += '<section class="dv-card"><div class="dv-line"><i class="ti ti-chart-bar" aria-hidden="true"></i><span class="v">'
      + esc(T('ملخص أدائك في بطاقة «أدائي» في الرئيسية.','Your performance summary is in the “My performance” card on Home.'))+'</span></div>'
      + '<div class="dv-acts"><button class="dv-b" type="button" onclick="setTab(\'home\')"><i class="ti ti-home"></i>'+esc(T('الرئيسية','Home'))+'</button></div></section>';
    return h;
  }

      [T('الدور','Role'), esc(p.role ? L(p.role) : '—')],
      [T('الحالة','Status'), esc(p.status === 'active' ? T('نشط','Active') : T('موقوف','Suspended'))],

      + '<section class="dv-card"><div class="dv-card-h"><h2>'+esc(T('بيانات الحساب','Account details'))+'</h2>'
      + '<span class="dv-stage"><i class="ti ti-lock" aria-hidden="true"></i>'+esc(T('للعرض فقط','Read-only'))+'</span></div>'
      + rows.map(function(r){ return '<div class="dv-line"><span class="k">'+esc(r[0])+'</span><span class="v">'+r[1]+'</span></div>'; }).join('')
      + '<div class="dv-note"><i class="ti ti-info-circle"></i><span>'
      + esc(T('بيانات الحساب تديرها إدارة رف ولا يمكن تعديلها من هنا. لا تُحفظ كلمات مرور أو بيانات اعتماد في هذا الجهاز.',
              'Account details are managed by RAF and cannot be edited here. No passwords or credentials are stored on this device.'))
      + '</span></div></section>';

    var all = myNotifs();
    var sp = null; try { sp = RAFNotify.soundPreference(); } catch(e){}
    h += '<section class="dv-card"><div class="dv-card-h"><h2>'+esc(T('الإشعارات','Notifications'))+'</h2></div>'
      + '<div class="dv-line"><i class="ti ti-volume" aria-hidden="true"></i><span class="v">'+esc(T('صوت الإشعارات: ','Notification sound: '))
      + '<b>'+esc(sp && sp.enabled === true ? T('مفعّل','On') : (sp && sp.configured ? T('متوقف','Off') : T('غير مُهيّأ (متوقف)','Not set (off)')))+'</b></span></div>'
      + '<div class="dv-acts"><button class="dv-b" onclick="doSoundToggle()"><i class="ti ti-volume-2"></i>'
      + esc(sp && sp.enabled === true ? T('إيقاف الصوت','Turn sound off') : T('تشغيل الصوت','Turn sound on'))+'</button></div>'
      + (all.length ? all.slice(0,20).map(notifLine).join('')
         : '<div class="dv-empty"><i class="ti ti-bell-off"></i>'+esc(T('لا توجد إشعارات.','No notifications.'))+'</div>')
      + '</section>';

    h += '<section class="dv-card"><div class="dv-card-h"><h2>'+esc(T('اللغة','Language'))+'</h2></div>'
      + '<div class="dv-acts"><button class="dv-b" onclick="toggleLang()"><i class="ti ti-language"></i>'
      + esc(isEn() ? 'العربية' : 'English')+'</button>'
      + '<button class="dv-b" onclick="location.href=\'raf_login.html\'"><i class="ti ti-logout"></i>'
      + esc(T('تسجيل الخروج','Sign out'))+'</button></div></section>';
    return h;
  }

  /* ---------- chrome ---------- */
  function renderNav(){
    var q = D.queue({ actor:ME.id }), a = D.active({ actor:ME.id });
    var counts = { tasks:(q.ok ? q.tasks.length : 0), active:(a.ok && a.task ? 1 : 0) };
    el('navIn').innerHTML = TABS.map(function(t){
      var on = st.tab === t.k, n = counts[t.k] || 0;
      return '<button class="dv-tab" type="button" onclick="setTab(\''+t.k+'\')"'
        + (on ? ' aria-current="page"' : '') + ' aria-label="'+esc(T(t.ar,t.en))+'">'
        + '<i class="ti '+t.ic+'" aria-hidden="true"></i><span>'+esc(T(t.ar,t.en))+'</span>'
        + (n ? '<span class="pip"><bdi>'+n+'</bdi></span>' : '')+'</button>';
    }).join('');
  }
  function render(){
    renderNav();
    el('view').innerHTML = st.tab === 'tasks'   ? renderTasks()
                         : st.tab === 'active'  ? renderActive()
                         : st.tab === 'history' ? renderHistory()
                         : st.tab === 'profile' ? renderProfile()
                         :                        renderHome();
    el('view').scrollTop = 0;
  }
  window.setTab = function(k){
    if (!TABS.some(function(t){ return t.k === k; })) return;
    if (k !== 'active') openId = null;
    st.tab = k; msg = null; ok = null;
    try { localStorage.setItem(PREF, JSON.stringify({ tab:k })); } catch(e){}
    render();
    window.scrollTo({ top:0 });
  };
  window.openTask = function(id){ openId = id; st.tab = 'active'; msg = null; ok = null; render(); window.scrollTo({ top:0 }); };
  window.refreshAll = function(){ msg = null; ok = null; render(); toast(T('تم التحديث','Refreshed')); };

  /* every mutation is a request to the authority; the page decides nothing.
     A claim that lost the race is reported plainly and the pool is re-read,
     so the driver never sees a card the authority has already given away. */
  window.doClaim = function(id){
    var res = D.claim(id, { actor:ME.id });
    if (!res.ok){
      msg = res.message; ok = null;
      st.tab = 'tasks';                       /* stay on the pool and show it fresh */
      render(); toast(res.message);
      return;
    }
    msg = null; ok = null;
    openId = id; st.tab = 'active'; render();
    toast(T('تم سحب الطلب — أصبح مسؤوليتك','Delivery taken — it is yours now'));
    window.scrollTo({ top:0 });
  };
  /* the confirmation this app asks before delivery ownership changes hands.
     Escape closes it, focus starts inside it and returns to the control that
     opened it. */
  var dlgAction = null, dlgReturnFocus = null;
  /* withReason: the dialog collects a required free-text reason and hands it
     to fn; an empty reason keeps the dialog open (the authority checks again) */
  var dlgWithReason = false, dlgCats = null, dlgLabels = null;
  /* categories (optional): [{ key, label, requiresDescription, disabled, hint }] — adds a category
     select; the text then is required only when the chosen category requires it */
  function openDialog(titleAr, titleEn, bodyAr, bodyEn, yesAr, yesEn, fn, withReason, categories, labels){
    dlgAction = fn; dlgReturnFocus = document.activeElement; dlgWithReason = !!withReason; dlgCats = categories || null; dlgLabels = labels || null;
    el('dlgCatWrap').hidden = !dlgCats;
    if (dlgCats){
      el('dlgCatL').textContent = labels && labels.category ? labels.category : T('الفئة','Category');
      el('dlgCat').innerHTML = '<option value="">—</option>' + dlgCats.map(function(c){
        return '<option value="'+esc(c.key)+'"'+(c.disabled ? ' disabled' : '')+'>'+esc(c.label + (c.hint ? ' — ' + c.hint : ''))+'</option>'; }).join('');
    }
    el('dlgT').textContent = T(titleAr, titleEn);
    el('dlgP').textContent = T(bodyAr, bodyEn);
    el('dlgYes').innerHTML = '<i class="ti ti-check"></i>' + esc(T(yesAr, yesEn));
    el('dlgNo').innerHTML  = '<i class="ti ti-x"></i>' + esc(T('إلغاء','Cancel'));
    el('dlgReasonWrap').hidden = !dlgWithReason; el('dlgReason').value = ''; el('dlgReasonErr').hidden = true;
    el('dlgReasonL').textContent = labels && labels.text ? labels.text : dlgCats ? T('الوصف (إلزامي لفئة «أخرى»)','Description (required for “Other”)') : T('السبب (إلزامي)','Reason (required)');
    el('dlg').hidden = false;
    (dlgWithReason ? el('dlgReason') : el('dlgYes')).focus();
  }
  function closeDialog(){
    el('dlg').hidden = true; dlgAction = null; dlgWithReason = false; dlgCats = null; el('dlgReasonWrap').hidden = true; el('dlgCatWrap').hidden = true;
    if (dlgReturnFocus && document.contains(dlgReturnFocus)) dlgReturnFocus.focus();
    dlgReturnFocus = null;
  }
  window.dlgCancel = function(){ closeDialog(); };
  window.dlgConfirm = function(){
    var fn = dlgAction, reason = null, category = null;
    if (dlgCats){
      category = el('dlgCat').value;
      var cat = dlgCats.filter(function(c){ return c.key === category; })[0];
      reason = el('dlgReason').value.trim();
      if (!cat || cat.disabled){ el('dlgReasonErr').textContent = dlgLabels && dlgLabels.pickError ? dlgLabels.pickError : T('اختر الفئة.','Choose the category.'); el('dlgReasonErr').hidden = false; el('dlgCat').focus(); return; }
      if (cat.requiresDescription && !reason){ el('dlgReasonErr').textContent = dlgLabels && dlgLabels.textError ? dlgLabels.textError : T('الوصف إلزامي لهذه الفئة.','A description is required for this category.'); el('dlgReasonErr').hidden = false; el('dlgReason').focus(); return; }
    } else if (dlgWithReason){
      reason = el('dlgReason').value.trim();
      if (!reason){ el('dlgReasonErr').textContent = T('اكتب السبب.','Enter the reason.'); el('dlgReasonErr').hidden = false; el('dlgReason').focus(); return; }
    }
    closeDialog(); if (fn) fn(reason, category);
  };
  /* reassignment request: a request to Logistics, never a reassignment */
  window.doRequest = function(id){
    openDialog('طلب إعادة الإسناد', 'Request reassignment',
      'سيراجع فريق اللوجستيات طلبك. تتوقف إجراءات الاستلام والتسليم حتى يُبت فيه، ويمكنك إلغاء الطلب.',
      'Logistics will review your request. Pickup and delivery pause until it is decided, and you can cancel the request.',
      'إرسال الطلب', 'Send request', function(reason){
        var res = D.requestReassignment(id, { reason:reason, actor:ME.id });
        if (!res.ok){ msg = res.message; ok = null; openId = id; render(); toast(res.message); return; }
        msg = null; ok = T('تم إرسال طلب إعادة الإسناد.','Reassignment request sent.');
        openId = id; render(); toast(T('تم إرسال الطلب','Request sent'));
      }, true);
  };
  /* delivery exceptions (RAFDeliveryOps.exceptions — the session is the driver) */
  window.doReport = function(id){
    var EX = window.RAFDeliveryOps && RAFDeliveryOps.exceptions; if (!EX) return;
    var xv = EX.driverView(id); if (!xv.ok){ toast(xv.message); return; }
    var need = xv.callAttempts.required, have = xv.callAttempts.count;
    var cats = xv.categories.map(function(c){
      var cu = c.key === 'customer_unreachable', blocked = cu && (need == null || have < need);
      return { key:c.key, label:isEn() ? c.en : (c.ar || c.en), requiresDescription:!!c.requiresDescription, disabled:blocked,
               hint:cu ? (need == null ? T('غير مُهيّأ','not configured') : T('محاولات الاتصال ','call attempts ') + have + '/' + need) : null };
    });
    openDialog('الإبلاغ عن مشكلة في التوصيل', 'Report a delivery problem',
      'يصل البلاغ إلى فريق اللوجستيات وتبدأ مهلة المعالجة. لا تُرسل تفاصيله الداخلية للعميل.',
      'Logistics is notified and the handling SLA starts. Internal details are not sent to the customer.',
      'إرسال البلاغ', 'Send report', function(desc, category){
        var res = EX.open(id, { category:category, description:desc || undefined });
        if (!res.ok){ msg = res.message; ok = null; openId = id; render(); toast(res.message); return; }
        msg = null; ok = T('تم إرسال البلاغ.','The problem was reported.'); openId = id; render(); toast(T('تم الإبلاغ','Reported'));
      }, true, cats);
  };
  window.doCallAttempt = function(id){
    var EX = window.RAFDeliveryOps && RAFDeliveryOps.exceptions; if (!EX) return;
    openDialog('تسجيل محاولة اتصال', 'Record a call attempt',
      'سجّل فقط مكالمة هاتفية أجريتها ولم يرد فيها العميل. الرسائل لا تُحتسب.',
      'Record only a phone call you made that the customer did not answer. Messages do not count.',
      'تسجيل المحاولة', 'Record attempt', function(){
        var res = EX.recordCallAttempt(id);
        if (!res.ok){ msg = res.message; ok = null; openId = id; render(); toast(res.message); return; }
        msg = null; ok = T('سُجّلت محاولة الاتصال ','Call attempt recorded ') + res.count + (res.required != null ? '/' + res.required : '');
        openId = id; render(); toast(ok);
      });
  };
  window.doCloseException = function(exceptionId){
    var EX = window.RAFDeliveryOps && RAFDeliveryOps.exceptions; if (!EX) return;
    openDialog('إغلاق مشكلة «تعذّر الوصول إلى العميل»؟', 'Close “Customer Unreachable”?',
      'استخدم هذا عند الوصول إلى العميل ومتابعة التوصيل.', 'Use this when you reached the customer and continue the delivery.',
      'إغلاق', 'Close', function(){
        var res = EX.driverClose(exceptionId, { resolutionType:'driver_must_continue' });
        if (!res.ok){ msg = res.message; ok = null; render(); toast(res.message); return; }
        msg = null; ok = T('أُغلقت المشكلة — تابع التوصيل.','Closed — continue the delivery.'); render(); toast(ok);
      });
  };
  window.doSoundToggle = function(){
    try { var p = RAFNotify.soundPreference(); RAFNotify.setSoundPreference(!(p && p.enabled === true)); } catch(e){}
    render();
  };
  var audioCtx = null;
  function beep(){
    try { audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
      var o = audioCtx.createOscillator(), g = audioCtx.createGain(); o.frequency.value = 880; g.gain.value = 0.06;
      o.connect(g); g.connect(audioCtx.destination); o.start(); o.stop(audioCtx.currentTime + 0.18); } catch(e){}
  }
  window.doCancelRequest = function(id){
    openDialog('إلغاء طلب إعادة الإسناد؟', 'Cancel the reassignment request?',
      'تستمر في التوصيل كالمعتاد.', 'You continue the delivery as usual.',
      'إلغاء الطلب', 'Cancel request', function(){
        var res = D.cancelReassignmentRequest(id, { actor:ME.id });
        if (!res.ok){ msg = res.message; ok = null; openId = id; render(); toast(res.message); return; }
        /* the approved wording for this outcome */
        msg = null; ok = res.message;
        openId = id; render(); toast(res.message);
      });
  };
  document.addEventListener('keydown', function(e){
    if (e.key === 'Escape' && !el('dlg').hidden){ e.preventDefault(); closeDialog(); }
  });
  /* skip: confirmed first, then one request to the authority */
  window.doSkip = function(id){
    openDialog('تخطي هذا الطلب؟', 'Skip this delivery?',
      'يُسجَّل التخطي في سجلك بشكل دائم. لن تصبح مسؤولاً عن الطلب، ويبقى متاحاً في القائمة.',
      'The skip is permanently recorded on your history. You will not own the delivery, and it stays available in the pool.',
      'تخطي', 'Skip', function(){
        var res = D.skip(id, { actor:ME.id });
        if (!res.ok){ msg = res.message; ok = null; st.tab = 'tasks'; render(); toast(res.message); return; }
        msg = null; ok = T('تم تسجيل التخطي.','The skip was recorded.');
        st.tab = 'tasks'; render(); toast(T('تم التخطي','Skipped'));
      });
  };
  /* opening a notification marks it read (for this driver only) and opens the delivery */
  window.openNotif = function(nid, orderId){
    try { RAFNotify.markRead(nid); } catch(e){}
    if (orderId && D.task(orderId, { actor:ME.id }).ok){ openTask(orderId); return; }
    render();
  };
  window.doDeliver = function(id){
    var res = D.completeDelivery(id, { actor:ME.id });
    if (!res.ok){ msg = res.message; ok = null; render(); return; }
    msg = null; ok = T('تم تسجيل تسليم الطلب للعميل.','The delivery was recorded.');
    openId = id; render(); toast(T('تم التسليم','Delivered'));
  };
  window.doPickup = function(id){
    var res = D.confirmPickup(id, { actor:ME.id });
    if (!res.ok){ msg = res.message; ok = null; render(); return; }
    msg = null; ok = T('تم تسجيل استلام الطلب من المتجر.','The pickup was recorded.');
    openId = id; render(); toast(T('تم تسجيل الاستلام','Pickup recorded'));
  };
  window.toggleLang = function(){
    var r = root(), en = r.lang === 'en';
    r.lang = en ? 'ar' : 'en'; r.dir = en ? 'rtl' : 'ltr';
    try { localStorage.setItem('raf_lang', r.lang); } catch(e){}
    applyChrome(); render();
  };
  function applyChrome(){
    var en = isEn();
    el('langLabel').textContent = en ? 'ع' : 'EN';
    el('btnRefresh').setAttribute('aria-label', en ? 'Refresh' : 'تحديث');
    document.title = en ? 'RAF — Driver' : 'رف — مساحة السائق';
    if (ME) el('whoRole').textContent = en ? 'Driver' : 'سائق';
  }
  function gate(titleAr, titleEn, textAr, textEn){
    el('shell').hidden = true; el('gate').hidden = false;
    el('gateT').textContent = T(titleAr, titleEn);
    el('gateP').textContent = T(textAr, textEn);
    el('gateB').innerHTML = '<i class="ti ti-login"></i>' + T('تسجيل الدخول','Sign in');
  }

  function boot(){
    var l = null; try { l = localStorage.getItem('raf_lang'); } catch(e){}
    if (l === 'en'){ root().lang = 'en'; root().dir = 'ltr'; }

    if (!D || !window.RAFPerm || !window.RAFOrderEngine || !window.RAFOrderSnapshot){
      gate('تعذّر التحميل','Could not load','لم يتم تحميل وحدات رف المطلوبة.','The required RAF modules did not load.');
      applyChrome(); return;
    }
    /* fail closed: the authority decides, not this page */
    var sc = D.scope();
    if (!sc.ok){
      gate('مساحة السائق','Driver workspace', sc.message, sc.message);
      el('gateP').textContent = sc.message;
      applyChrome(); return;
    }
    ME = { id:sc.id, name:sc.name };
    CAP = D.capabilities();
    el('gate').hidden = true; el('shell').hidden = false;
    el('whoName').textContent = ME.name;
    try { var p = JSON.parse(localStorage.getItem(PREF) || 'null');
      if (p && TABS.some(function(t){ return t.k === p.tab; })) st.tab = p.tab; } catch(e){}
    applyChrome();
    render();
    scheduleAvDeadline();

    /* another surface changed an order — the merchant marking it ready, the
       engine sweeping a timeout — so the screen re-reads rather than guesses */
    if (window.RAFEventBus){
      /* live news on RAFEventBus — the screen re-reads RAFDriver, never the payload */
      ['order.*','ownership.*','logistics.delivery.*','driver.delivery.*'].forEach(function(p){
        RAFEventBus.subscribe(p, function(){ if (el('dlg').hidden) render(); });
      });
      /* Phase G: exceptions and ratings change "My performance" — re-read, never
         under an open dialog or while a date is being typed */
      ['logistics.exception.*','driver.rating.submitted'].forEach(function(p){
        RAFEventBus.subscribe(p, function(){
          var a = document.activeElement;
          if (el('dlg').hidden && !(a && (a.id === 'pfFrom' || a.id === 'pfTo'))) render();
        });
      });
      /* Phase F: availability / schedule / auto-offline / account changes for
         this driver re-read the authority and re-arm the one deadline timer */
      ['driver.availability.*','driver.schedule.*','driver.overtime.*','driver.auto_offline','driver.auto_offline.*','driver.account.*'].forEach(function(p){
        RAFEventBus.subscribe(p, function(ev){
          if (ev && ev.entityId && ev.entityId !== ME.id) return;
          scheduleAvDeadline(); if (el('dlg').hidden) render();
        });
      });
      RAFEventBus.subscribe('notification.*', function(ev){
        if (!ev || !ev.payload || ev.payload.recipientUserId !== ME.id) return;
        var TOAST = {
          'driver.delivery.assigned':            T('أُسند إليك توصيل جديد','A delivery was assigned to you'),
          'driver.delivery.reassigned':          T('أصبحت مسؤولاً عن توصيل','You are now responsible for a delivery'),
          'driver.delivery.removed':             T('لم تعد مسؤولاً عن أحد التوصيلات','You are no longer responsible for a delivery'),
          'driver.reassignment_request.approved':T('تمت الموافقة على طلب إعادة الإسناد','Your reassignment request was approved'),
          'driver.reassignment_request.rejected':T('لم تتم الموافقة على الطلب — تابع التوصيل','Request not approved — continue the delivery'),
          'driver.exception.opened':             T('فُتح استثناء على توصيلك','An exception was opened on your delivery'),
          'driver.exception.closed':             T('أُغلق الاستثناء على توصيلك','The exception on your delivery was closed'),
          'driver.exception.reopened':           T('أُعيد فتح الاستثناء على توصيلك','The exception on your delivery was reopened'),
          'driver.exception.instruction':        T('تعليمات من الإدارة','Instruction from management'),
          'driver.delivery.eta_updated':         T('تم تحديث الوقت المتوقع للتوصيل','The delivery ETA was updated'),
          'driver.availability.changed':         T('تغيّرت حالة توفرك','Your availability changed'),
          'driver.availability.auto_offline':    T('أصبحت غير متاح تلقائيًا — ليس إجراءً تأديبيًا','You were set Unavailable automatically — not disciplinary'),
          'driver.schedule.changed':             T('حدّثت الإدارة جدول عملك','Management updated your work schedule')
        };
        /* sound only if this driver's own preference is ON (the notification exists either way) */
        if (ev.eventType === 'notification.created'){ try { var sp = RAFNotify.soundPreference(); if (sp && sp.enabled === true) beep(); } catch(e){} }
        if (ev.eventType === 'notification.created' && TOAST[ev.payload.eventType]) toast(TOAST[ev.payload.eventType]);
        if (el('dlg').hidden) render();
      });
    } else {
      document.addEventListener('raf:order', function(){ render(); });
      document.addEventListener('raf:snapshot', function(){ render(); });
    }
    window.addEventListener('storage', function(e){
      /* another driver claimed something, or a store finished an order: the
         pool is re-read from the authority. No realtime infrastructure is
         simulated — this is the browser's own storage event. */
      if (e.key && /^raf_(orders|order_mstate|driver_claims)$/.test(e.key)) render();
    });
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();
})();
</script>
</body>
</html>
