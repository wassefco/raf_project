<style>
/* an address = an open entry between thin dividers, one under the other */
.ad-list{display:block;}
.ad-item{display:flex;gap:14px;padding:18px 4px;border-bottom:1px solid #ECE6DA;}
.ad-item > .ic{flex:0 0 auto;width:26px;font-size:22px;color:#A07828;display:flex;justify-content:center;padding-top:2px;}
.ad-b{flex:1;min-width:0;}
.ad-top{display:flex;align-items:center;flex-wrap:wrap;gap:8px;}
.ad-lbl{font-size:16px;font-weight:800;}
.ad-nm{font-size:14px;color:#3F3B35;margin-top:4px;}
.ad-tx{font-size:13.5px;color:#5A5650;margin-top:3px;line-height:1.7;overflow-wrap:anywhere;}
.ad-ph{font-family:'DM Sans',sans-serif;font-size:13.5px;color:#5A5650;margin-top:2px;}
.ad-acts{display:flex;flex-wrap:wrap;align-items:center;gap:4px 16px;margin-top:8px;}
.ad-confirm{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-top:10px;font-size:13.5px;font-weight:700;color:#9A332F;}
.ad-add-row{display:flex;padding:10px 0;}
#addrForm[hidden],#addrListWrap[hidden]{display:none;}
.fm-h{font-size:20px;font-weight:800;padding:18px 2px 6px;}
</style>

<main class="cx-page ac-main">
  <div class="cx-crumbs" role="navigation" aria-label="breadcrumb">
    <a href="raf_homepage.html" data-ar="الرئيسية" data-en="Home">الرئيسية</a>
    <i class="ti ti-chevron-left" aria-hidden="true"></i>
    <a href="raf_account.html" data-ar="حسابي" data-en="My Account">حسابي</a>
    <i class="ti ti-chevron-left" aria-hidden="true"></i>
    <span class="cur" data-ar="عناويني" data-en="My Addresses">عناويني</span>
  </div>
  <div class="ac-head"><h1 class="ac-title" data-ar="عناويني" data-en="My Addresses">عناويني</h1></div>

  <!-- LIST -->
  <div id="addrListWrap">
    <div class="ad-add-row"><button type="button" class="ac-add" onclick="openForm()"><i class="ti ti-plus" aria-hidden="true"></i><span data-ar="إضافة عنوان جديد" data-en="Add a new address">إضافة عنوان جديد</span></button></div>
    <div class="ad-list" id="addrGrid"></div>
  </div>

  <!-- ADD / EDIT — one form for both -->
  <form id="addrForm" hidden onsubmit="saveAddress(); return false;" novalidate>
    <h2 class="fm-h" id="formTitle"></h2>
    <input type="hidden" id="editId">
    <div class="ac-form">
      <div class="ac-fld full" id="fwLabel">
        <label for="fLabel" data-ar="اسم العنوان" data-en="Address name">اسم العنوان</label>
        <input id="fLabel" type="text" maxlength="40" autocomplete="off" data-ar-ph="مثال: المنزل، العمل، بيت الوالدين" data-en-ph="e.g. Home, Work, Parents' house">
        <span class="err"></span>
      </div>
      <div class="ac-fld" id="fwName">
        <label for="fName" data-ar="الاسم الكامل" data-en="Full name">الاسم الكامل</label>
        <input id="fName" type="text" autocomplete="name">
        <span class="err"></span>
      </div>
      <div class="ac-fld" id="fwPhone">
        <label for="fPhone" data-ar="رقم الهاتف" data-en="Phone number">رقم الهاتف</label>
        <div class="ac-ph" dir="ltr"><span>+965</span><input id="fPhone" type="tel" inputmode="numeric" autocomplete="tel-national" maxlength="12"></div>
        <span class="err"></span>
      </div>
      <div class="ac-fld" id="fwGov">
        <label for="fGov" data-ar="المحافظة" data-en="Governorate">المحافظة</label>
        <select id="fGov"></select>
        <span class="err"></span>
      </div>
      <div class="ac-fld" id="fwArea">
        <label for="fArea" data-ar="المنطقة" data-en="Area">المنطقة</label>
        <select id="fArea">
          <option value="" data-ar="اختر المنطقة" data-en="Choose an area">اختر المنطقة</option>
          <option>حولي</option><option>السالمية</option><option>الرميثية</option>
          <option>الفروانية</option><option>مبارك الكبير</option><option>الأحمدي</option>
          <option>الجهراء</option><option>شرق</option><option>الكويت</option><option>أخرى</option>
        </select>
        <span class="err"></span>
      </div>
      <div class="ac-fld" id="fwBlock">
        <label for="fBlock" data-ar="القطعة" data-en="Block">القطعة</label>
        <input id="fBlock" type="text" inputmode="numeric">
        <span class="err"></span>
      </div>
      <div class="ac-fld" id="fwStreet">
        <label for="fStreet" data-ar="الشارع" data-en="Street">الشارع</label>
        <input id="fStreet" type="text">
        <span class="err"></span>
      </div>
      <div class="ac-fld" id="fwAvenue">
        <label for="fAvenue" data-ar="الجادة / المنزل" data-en="Avenue / House">الجادة / المنزل</label>
        <input id="fAvenue" type="text">
        <span class="err"></span>
      </div>
      <div class="ac-fld" id="fwBuilding">
        <label for="fBuilding" data-ar="المبنى" data-en="Building">المبنى</label>
        <input id="fBuilding" type="text">
        <span class="err"></span>
      </div>
      <div class="ac-fld">
        <label for="fFloor"><span data-ar="الدور" data-en="Floor">الدور</span> <span class="opt" data-ar="(اختياري)" data-en="(optional)">(اختياري)</span></label>
        <input id="fFloor" type="text">
      </div>
      <div class="ac-fld">
        <label for="fApt"><span data-ar="الشقة" data-en="Apartment">الشقة</span> <span class="opt" data-ar="(اختياري)" data-en="(optional)">(اختياري)</span></label>
        <input id="fApt" type="text">
      </div>
      <div class="ac-fld full">
        <label for="fNotes"><span data-ar="ملاحظات إضافية" data-en="Additional notes">ملاحظات إضافية</span> <span class="opt" data-ar="(اختياري)" data-en="(optional)">(اختياري)</span></label>
        <textarea id="fNotes" maxlength="300"></textarea>
      </div>
    </div>
    <div class="ac-actions">
      <button type="submit" class="ac-btn gold" id="saveBtn"></button>
      <button type="button" class="ac-btn ghost" onclick="closeForm()" data-ar="إلغاء" data-en="Cancel">إلغاء</button>
    </div>
  </form>

<script>
/* ============================================================
   MY ADDRESSES — the customer's address book (localStorage
   'raf_addresses', the same list checkout reads). Existing rules kept:
   the first address is the default, deleting the default passes it to
   the next one, one address can be made the default, ?edit=<id> opens
   the form and ?from=cart returns to the cart after saving.
   The address name is typed by the customer (not a fixed type).
   ============================================================ */
const ADDR_KEY = 'raf_addresses';

const SEED_DATA = [
  { id:'addr-1', type:'home', name:'محمد العنزي', phone:'+965 9123 4567',
    area:'حولي', block:'5', street:'شارع الأمير', building:'12',
    floor:'1', apartment:'4', notes:'', isDefault:true },
  { id:'addr-2', type:'work', name:'محمد العنزي', phone:'+965 9123 4567',
    area:'شرق', block:'1', street:'برج X', building:'',
    floor:'8', apartment:'', notes:'مكتب 801', isDefault:false }
];
/* older addresses carried a type instead of a typed name — shown by it */
const TYPE_LABELS = { home:'منزل', work:'عمل', family:'عائلة', other:'أخرى' };
const TYPE_LABELS_EN = { home:'Home', work:'Work', family:'Family', other:'Other' };
/* Kuwait's six governorates */
const GOVS = [
  { ar:'محافظة العاصمة', en:'Capital' }, { ar:'محافظة حولي', en:'Hawalli' }, { ar:'محافظة الفروانية', en:'Farwaniya' },
  { ar:'محافظة الأحمدي', en:'Ahmadi' }, { ar:'محافظة الجهراء', en:'Jahra' }, { ar:'محافظة مبارك الكبير', en:'Mubarak Al-Kabeer' }
];

function isEN(){ return document.getElementById('htmlRoot').lang === 'en'; }
function T(ar,en){ return isEN() ? en : ar; }
function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }

function loadAddresses() {
  try {
    const d = JSON.parse(localStorage.getItem(ADDR_KEY));
    if (d && d.length > 0) return d;
  } catch(e) {}
  return JSON.parse(JSON.stringify(SEED_DATA));
}
function saveAddresses(list) { localStorage.setItem(ADDR_KEY, JSON.stringify(list)); }

function labelOf(a){ return a.label || (isEN() ? TYPE_LABELS_EN[a.type] : TYPE_LABELS[a.type]) || T('عنوان','Address'); }
function govText(v){ const g = GOVS.find(x => x.ar === v || x.en === v); return g ? (isEN() ? g.en : g.ar) : (v || ''); }
function lines(a){
  const b = (ar,en) => isEN() ? en : ar;
  return [govText(a.governorate), a.area, a.block ? b('ق ','Block ') + a.block : '', a.street,
          a.avenue ? b('جادة/منزل ','Ave/House ') + a.avenue : '', a.building ? b('مبنى ','Bldg ') + a.building : '',
          a.floor ? b('الدور ','Floor ') + a.floor : '', a.apartment ? b('شقة ','Apt ') + a.apartment : '']
    .filter(Boolean).join(isEN() ? ', ' : '، ');
}

let confirmId = null;
function renderAddresses() {
  const list = loadAddresses();
  const grid = document.getElementById('addrGrid');
  if (!list.length){
    grid.innerHTML = '<div class="ac-empty" style="grid-column:1/-1"><i class="ti ti-map-pin-off"></i><b>' + esc(T('لا توجد عناوين محفوظة','No saved addresses')) + '</b></div>';
    return;
  }
  grid.innerHTML = list.map(a => {
    const confirming = confirmId === a.id;
    return '<div class="ad-item" data-id="' + esc(a.id) + '">'
      + '<i class="ti ' + (a.isDefault ? 'ti-map-pin-filled' : 'ti-map-pin') + ' ic" aria-hidden="true"></i>'
      + '<div class="ad-b">'
        + '<div class="ad-top"><span class="ad-lbl">' + esc(labelOf(a)) + '</span>'
          + (a.isDefault ? '<span class="ac-pill gold">' + esc(T('العنوان الافتراضي','Default')) + '</span>' : '') + '</div>'
        + (a.name ? '<div class="ad-nm">' + esc(a.name) + '</div>' : '')
        + '<div class="ad-tx">' + esc(lines(a)) + (a.notes ? '<br>' + esc(a.notes) : '') + '</div>'
        + (a.phone ? '<div class="ad-ph"><bdi dir="ltr">' + esc(a.phone) + '</bdi></div>' : '')
        + (confirming
            ? '<div class="ad-confirm" role="alert"><span>' + esc(T('حذف هذا العنوان؟','Delete this address?')) + '</span>'
              + '<button type="button" class="ac-btn" style="min-height:38px" onclick="deleteAddress(\'' + esc(a.id) + '\', true)">' + esc(T('نعم، احذف','Yes, delete')) + '</button>'
              + '<button type="button" class="ac-link" onclick="cancelDelete()">' + esc(T('إلغاء','Cancel')) + '</button></div>'
            : '<div class="ad-acts">'
              + '<button type="button" class="ac-link" onclick="editAddress(\'' + esc(a.id) + '\')"><i class="ti ti-edit"></i> ' + esc(T('تعديل','Edit')) + '</button>'
              + (!a.isDefault ? '<button type="button" class="ac-link" onclick="setDefault(\'' + esc(a.id) + '\')"><i class="ti ti-star"></i> ' + esc(T('تعيين كافتراضي','Set as default')) + '</button>' : '')
              + '<button type="button" class="ac-link danger" onclick="deleteAddress(\'' + esc(a.id) + '\')"><i class="ti ti-trash"></i> ' + esc(T('حذف','Delete')) + '</button></div>')
      + '</div></div>';
  }).join('');
}

function paintGovs(sel){
  const s = document.getElementById('fGov');
  s.innerHTML = '<option value="">' + esc(T('اختر المحافظة','Choose a governorate')) + '</option>'
    + GOVS.map(g => '<option value="' + esc(g.ar) + '"' + (sel === g.ar || sel === g.en ? ' selected' : '') + '>' + esc(isEN() ? g.en : g.ar) + '</option>').join('');
}
function clearErrors(){ document.querySelectorAll('#addrForm .ac-fld').forEach(f => { f.classList.remove('bad'); const e = f.querySelector('.err'); if (e) e.textContent = ''; }); }
function openForm(id) {
  confirmId = null;
  clearErrors();
  const list = loadAddresses();
  const a = id ? list.find(x => x.id === id) : null;
  document.getElementById('editId').value = a ? a.id : '';
  document.getElementById('formTitle').textContent = a ? T('تعديل العنوان','Edit address') : T('إضافة عنوان جديد','Add a new address');
  document.getElementById('saveBtn').textContent = a ? T('حفظ التعديلات','Save changes') : T('حفظ العنوان','Save address');
  document.getElementById('fLabel').value = a ? labelOf(a) : '';
  document.getElementById('fName').value = a ? (a.name || '') : '';
  document.getElementById('fPhone').value = a ? String(a.phone || '').replace(/^\+?965\s*/, '') : '';
  paintGovs(a ? a.governorate : '');
  document.getElementById('fArea').value = a ? (a.area || '') : '';
  document.getElementById('fBlock').value = a ? (a.block || '') : '';
  document.getElementById('fStreet').value = a ? (a.street || '') : '';
  document.getElementById('fAvenue').value = a ? (a.avenue || '') : '';
  document.getElementById('fBuilding').value = a ? (a.building || '') : '';
  document.getElementById('fFloor').value = a ? (a.floor || '') : '';
  document.getElementById('fApt').value = a ? (a.apartment || '') : '';
  document.getElementById('fNotes').value = a ? (a.notes || '') : '';
  document.getElementById('addrListWrap').hidden = true;
  document.getElementById('addrForm').hidden = false;
  window.scrollTo(0, 0);
  document.getElementById('fLabel').focus();
}
function closeForm() {
  document.getElementById('addrForm').hidden = true;
  document.getElementById('addrListWrap').hidden = false;
  renderAddresses();
}

function saveAddress() {
  clearErrors();
  const v = id => document.getElementById(id).value.trim();
  const id = v('editId');
  const f = { label:v('fLabel'), name:v('fName'), phoneDigits:v('fPhone').replace(/\D/g, ''), governorate:v('fGov'), area:v('fArea'),
              block:v('fBlock'), street:v('fStreet'), avenue:v('fAvenue'), building:v('fBuilding'),
              floor:v('fFloor'), apartment:v('fApt'), notes:v('fNotes') };
  const req = [['fwLabel', f.label, T('اكتب اسماً للعنوان','Enter a name for this address')],
               ['fwName', f.name, T('الاسم الكامل مطلوب','Full name is required')],
               ['fwPhone', f.phoneDigits.length >= 6, T('يرجى إدخال رقم هاتف صالح','Please enter a valid phone number')],
               ['fwGov', f.governorate, T('اختر المحافظة','Choose a governorate')],
               ['fwArea', f.area, T('اختر المنطقة','Choose an area')],
               ['fwBlock', f.block, T('القطعة مطلوبة','Block is required')],
               ['fwStreet', f.street, T('الشارع مطلوب','Street is required')],
               ['fwAvenue', f.avenue, T('الجادة / المنزل مطلوب','Avenue / House is required')],
               ['fwBuilding', f.building, T('المبنى مطلوب','Building is required')]];
  let first = null;
  req.forEach(r => { if (!r[1]) { const w = document.getElementById(r[0]); w.classList.add('bad'); w.querySelector('.err').textContent = r[2]; if (!first) first = w; } });
  if (first) { const i = first.querySelector('input,select'); if (i) i.focus(); return; }
  const rec = { label:f.label, name:f.name, phone:'+965 ' + f.phoneDigits, governorate:f.governorate, area:f.area, block:f.block,
                street:f.street, avenue:f.avenue, building:f.building, floor:f.floor, apartment:f.apartment, notes:f.notes };
  const list = loadAddresses();
  if (id) {
    const idx = list.findIndex(a => a.id === id);
    if (idx > -1) list[idx] = { ...list[idx], ...rec };
  } else {
    list.push({ id:'addr-' + Date.now(), type:'other', ...rec, isDefault:list.length === 0 });
  }
  saveAddresses(list);
  closeForm();
  // If came from cart, go back
  const params = new URLSearchParams(window.location.search);
  if (params.get('from') === 'cart') {
    setTimeout(() => window.location = 'raf_cart.html', 300);
  }
}

/* delete: a plain inline confirmation on the address itself */
function deleteAddress(id, confirmed) {
  if (!confirmed) { confirmId = id; renderAddresses(); return; }
  confirmId = null;
  let list = loadAddresses().filter(a => a.id !== id);
  if (list.length > 0 && !list.some(a => a.isDefault)) list[0].isDefault = true;
  saveAddresses(list);
  renderAddresses();
}
function cancelDelete(){ confirmId = null; renderAddresses(); }

function setDefault(id) {
  const list = loadAddresses().map(a => ({ ...a, isDefault: a.id === id }));
  saveAddresses(list);
  renderAddresses();
}
function editAddress(id) { openForm(id); }

/* LANG (the shared header's language button calls this) */
function applyLang(){
  const nl = isEN() ? 'en' : 'ar';
  document.querySelectorAll('[data-ar]').forEach(el => { const t = el.getAttribute('data-' + nl); if (t) el.textContent = t; });
  document.querySelectorAll('[data-ar-ph]').forEach(el => { el.placeholder = el.getAttribute('data-' + nl + '-ph') || ''; });
}
function toggleLang() {
  const html = document.getElementById('htmlRoot'), isAR = html.lang === 'ar', nl = isAR ? 'en' : 'ar';
  html.lang = nl; html.dir = isAR ? 'ltr' : 'rtl';
  localStorage.setItem('raf_lang', nl);
  applyLang();
  renderAddresses();
  if (!document.getElementById('addrForm').hidden) {
    const id = document.getElementById('editId').value;
    document.getElementById('formTitle').textContent = id ? T('تعديل العنوان','Edit address') : T('إضافة عنوان جديد','Add a new address');
    document.getElementById('saveBtn').textContent = id ? T('حفظ التعديلات','Save changes') : T('حفظ العنوان','Save address');
    paintGovs(document.getElementById('fGov').value);
  }
}

/* INIT */
(function init() {
  if (localStorage.getItem('raf_lang') === 'en') {
    document.getElementById('htmlRoot').lang = 'en';
    document.getElementById('htmlRoot').dir = 'ltr';
  }
  applyLang();
  // Seed default data if none exists
  if (!localStorage.getItem(ADDR_KEY)) {
    saveAddresses(SEED_DATA);
  }
  renderAddresses();
  // Auto-open edit form if ?edit=id in URL
  const params = new URLSearchParams(window.location.search);
  const editId = params.get('edit');
  if (editId) setTimeout(() => openForm(editId), 100);
})();
</script>
