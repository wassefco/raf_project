<!DOCTYPE html>
<html id="htmlRoot" lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>رف — المعلومات الشخصية</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700;900&family=Tajawal:wght@300;400;500;700;800&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
<link rel="stylesheet" href="raf_account.css">
<link rel="icon" type="image/png" sizes="64x64" href="raf_favicon.png">
<link rel="icon" type="image/png" sizes="32x32" href="raf_favicon_32.png">
<link rel="apple-touch-icon" href="raf_appicon.png">
<script src="raf_features.js"></script>
<link rel="stylesheet" href="raf_theme.css">
</head>
<body>
<header class="ahead">
  <button type="button" class="ahead-back" data-fallback="raf_account.html"><i class="ti ti-arrow-right"></i> <span data-ar="العودة" data-en="Back">العودة</span></button>
  <div class="ahead-title" data-ar="المعلومات الشخصية" data-en="Personal Information">المعلومات الشخصية</div>
  <button class="lang-btn" onclick="toggleLang()"><span class="lang-dot"></span><span id="langLabel">EN</span></button>
</header>

<div class="wrap">
  <div class="idcard" style="margin-bottom:20px;">
    <div class="idcard-top">
      <div class="id-avatar" id="idAvatar">م</div>
      <div><div class="id-name" id="idName">محمد العنزي</div><div class="id-num" id="idNum">RAF-2026-04871</div></div>
    </div>
  </div>

  <div class="panel">
    <div class="panel-h"><i class="ti ti-user"></i> <span data-ar="البيانات الأساسية" data-en="Basic details">البيانات الأساسية</span></div>
    <div class="panel-pad">
      <div class="field"><label class="field-lbl" data-ar="الاسم الكامل" data-en="Full Name">الاسم الكامل</label><input id="fName" class="field-input" value="محمد العنزي"></div>
      <div class="field"><label class="field-lbl" data-ar="البريد الإلكتروني" data-en="Email Address">البريد الإلكتروني</label><input id="fEmail" type="email" class="field-input" style="direction:ltr;text-align:right;" value="mohammed@example.com"></div>
      <div class="field-2">
        <div class="field"><label class="field-lbl" data-ar="رقم الجوال" data-en="Phone Number">رقم الجوال</label><input class="field-input" style="direction:ltr;text-align:right;" value="+965 9XXX XXXX"></div>
        <div class="field"><label class="field-lbl" data-ar="تاريخ الميلاد" data-en="Date of Birth">تاريخ الميلاد</label><input class="field-input" type="text" placeholder="1995 / 01 / 01" value="1995 / 01 / 01"></div>
      </div>
      <button class="btn btn-gold btn-block"><i class="ti ti-device-floppy"></i> <span data-ar="حفظ التغييرات" data-en="Save changes">حفظ التغييرات</span></button>
    </div>
  </div>

  <div class="panel">
    <div class="row"><div class="row-ic" style="background:var(--green-bg);color:var(--green)"><i class="ti ti-shield-check"></i></div>
      <div class="row-body"><div class="row-lbl" data-ar="حالة التوثيق" data-en="Verification">حالة التوثيق</div><div class="row-sub" data-ar="بريد وجوال موثّقان" data-en="Email & phone verified">بريد وجوال موثّقان</div></div>
      <span class="badge b-delivered"><i class="ti ti-circle-check"></i> <span data-ar="موثّق" data-en="Verified">موثّق</span></span></div>
    <div class="row"><div class="row-ic"><i class="ti ti-lock"></i></div>
      <div class="row-body"><div class="row-lbl" data-ar="كلمة المرور" data-en="Password">كلمة المرور</div><div class="row-sub" data-ar="آخر تغيير قبل 3 أشهر" data-en="Last changed 3 months ago">آخر تغيير قبل 3 أشهر</div></div>
      <button class="btn btn-ghost btn-sm" data-ar="تغيير" data-en="Change">تغيير</button></div>
  </div>
</div>

<nav class="app-bnav">
  <a href="raf_homepage.html" class="bnav-tab"><i class="ti ti-home-2"></i><span data-ar="الرئيسية" data-en="Home">الرئيسية</span></a>
  <a href="raf_notifications.html" class="bnav-tab"><i class="ti ti-bell"></i><span data-ar="الإشعارات" data-en="Notifications">الإشعارات</span></a>
  <a href="raf_cart.html" class="bnav-cart"><div class="bnav-cart-ring"><i class="ti ti-shopping-cart"></i></div><span data-ar="السلة" data-en="Cart">السلة</span></a>
  <a href="raf_wishlist.html" class="bnav-tab"><i class="ti ti-heart"></i><span data-ar="المفضلة" data-en="Saved">المفضلة</span></a>
  <a href="raf_account.html" class="bnav-tab on"><i class="ti ti-user-circle"></i><span data-ar="حسابي" data-en="Account">حسابي</span></a>
</nav>

<script src="raf_account.js"></script>
<script>
  (function(){var p=rafProfile();document.getElementById('idName').textContent=p.name;document.getElementById('idAvatar').textContent=p.name.charAt(0);document.getElementById('idNum').textContent=p.id;document.getElementById('fName').value=p.name;document.getElementById('fEmail').value=p.email;})();
</script>
</body>
</html>
