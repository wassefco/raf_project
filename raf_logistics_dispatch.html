<style>
/* ══════════════════════════════════════════════════════════════════════
   DISPATCH & ASSIGNMENT — the queue of orders the store has finished and
   that are waiting to go out. Shares the Logistics shell and components;
   what follows is only what this page adds: the toolbar, the scope tabs,
   the dispatch grid and the inspection sheet. The shared stylesheet is
   untouched — every rule here is scoped to this page's own classes.
   ══════════════════════════════════════════════════════════════════════ */

.wk{ display:flex; flex-direction:column; gap:12px; }
.wk-head{ display:flex; align-items:center; gap:12px; flex-wrap:wrap; }
.wk-head p{ margin:0; color:var(--muted); font-size:13px; flex:1 1 240px; min-width:0; }
.wk-count{ color:var(--faint); font-size:12px; font-weight:700; font-family:'DM Sans',sans-serif; white-space:nowrap; }

/* scope: the authoritative dispatch lifecycle, the waiting queue first */
.scopes{ display:flex; gap:2px; padding:3px; background:var(--surface-2); border:1px solid var(--line); border-radius:var(--r); overflow-x:auto; }
.scope{ display:inline-flex; align-items:center; gap:7px; min-height:36px; padding:0 14px; border:0; background:transparent; cursor:pointer;
  border-radius:var(--r-sm); color:var(--muted); font-size:13px; font-weight:700; white-space:nowrap; }
.scope:hover{ color:var(--ink); }
.scope[aria-pressed="true"]{ background:var(--surface); color:var(--ink); box-shadow:var(--shadow); }
.scope .n{ font-family:'DM Sans',sans-serif; font-size:11.5px; color:var(--faint); }
.scope[aria-pressed="true"] .n{ color:var(--accent); }

/* toolbar — the fixed Logistics pattern: search, then one Filter button */
.tools{ display:flex; gap:10px; flex-wrap:wrap; align-items:center; background:var(--surface); border:1px solid var(--line);
  border-radius:var(--r); padding:10px; box-shadow:var(--shadow); }
.srch{ position:relative; flex:1 1 280px; min-width:0; }
.srch > i{ position:absolute; inset-inline-start:11px; top:50%; transform:translateY(-50%); color:var(--faint); font-size:18px; pointer-events:none; }
.srch input{ width:100%; min-height:42px; padding:0 12px; padding-inline-start:38px; padding-inline-end:36px; border:1px solid var(--line-2);
  border-radius:var(--r-sm); background:var(--surface); color:var(--ink); font-size:13.5px; }
.srch input:focus{ outline:2px solid var(--accent); outline-offset:0; border-color:var(--accent); }
.srch .clr{ position:absolute; inset-inline-end:4px; top:50%; transform:translateY(-50%); width:32px; height:32px; border:0; border-radius:var(--r-sm);
  background:transparent; color:var(--faint); cursor:pointer; display:grid; place-items:center; }
.srch .clr:hover{ background:var(--surface-2); color:var(--ink); }
.tools .btn{ min-height:42px; }
.filter-btn{ flex:0 0 auto; gap:8px; }
.filter-btn.on{ border-color:var(--accent); color:var(--accent-2); background:var(--accent-soft); }
.filter-btn .fcount{ min-width:20px; height:20px; padding:0 6px; border-radius:10px; background:var(--accent); color:#fff;
  font-size:11.5px; font-weight:800; display:inline-grid; place-items:center; font-family:'DM Sans',sans-serif; }

/* filter applet — the same sheet family as the details sheet */
.applet{ width:min(440px,100%); }
.applet .sheet-b{ padding:4px 16px 16px; }
.fld{ padding:12px 0; border-block-end:1px solid var(--line); }
.fld:last-child{ border-block-end:0; }
.fld > label,.fld > .lg{ display:block; font-size:12px; font-weight:800; color:var(--muted); margin-block-end:6px; }
.fld select,.fld input[type="date"]{ width:100%; min-height:44px; padding:0 10px; border:1px solid var(--line-2);
  border-radius:var(--r-sm); background:var(--surface); color:var(--ink); font-size:13.5px; }
.fld select:focus,.fld input:focus{ outline:2px solid var(--accent); outline-offset:0; border-color:var(--accent); }
.fld .two{ display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:10px; }
.sub-f{ display:block; font-size:11.5px; font-weight:700; color:var(--faint); }
.sub-f input{ margin-block-start:5px; }
.sheet-f{ display:flex; gap:10px; padding:12px 16px; border-block-start:1px solid var(--line); background:var(--surface-2); }
.sheet-f .btn{ flex:1 1 auto; min-height:44px; }
/* the assignment form — the same sheet family as the filter applet */
.fld textarea{ width:100%; min-height:72px; padding:8px 10px; border:1px solid var(--line-2); border-radius:var(--r-sm);
  background:var(--surface); color:var(--ink); font-size:13.5px; font-family:inherit; resize:vertical; }
.fld textarea:focus{ outline:2px solid var(--accent); outline-offset:0; border-color:var(--accent); }
.fld .req{ color:var(--alert); font-weight:800; }
.fld .hint{ display:block; margin-block-start:5px; font-size:11.5px; color:var(--faint); line-height:1.6; }
.acts-row{ display:flex; gap:8px; flex-wrap:wrap; margin-block-start:10px; }
.acts-row .btn{ flex:0 1 auto; }
.form-msg{ display:flex; gap:9px; padding:11px 12px; border-radius:var(--r); font-size:12.5px; margin-block-start:12px; }
.form-msg i{ font-size:17px; flex-shrink:0; }
.form-msg.err{ background:var(--alert-bg); color:var(--alert); }
.form-msg.busy{ background:var(--surface-2); color:var(--muted); }

/* active filter chips */
.fchips{ display:flex; flex-wrap:wrap; gap:8px; align-items:center; }
.fchip{ display:inline-flex; align-items:center; gap:6px; min-height:30px; padding:0 6px 0 11px; border-radius:999px;
  border:1px solid var(--line-2); background:var(--surface); color:var(--text); font-size:12.5px; font-weight:600; }
[dir="rtl"] .fchip{ padding:0 11px 0 6px; }
.fchip b{ color:var(--ink); font-weight:800; }
.fchip button{ width:22px; height:22px; border:0; border-radius:50%; background:var(--surface-2); color:var(--muted); cursor:pointer;
  display:grid; place-items:center; flex-shrink:0; }
.fchip button:hover{ background:var(--alert-bg); color:var(--alert); }
.fchip button i{ font-size:13px; }

/* the queue is the workspace: full-bleed inside its card, sticky header */
.tbl-card{ background:var(--surface); border:1px solid var(--line); border-radius:var(--r-lg); box-shadow:var(--shadow); overflow:hidden; }
.tbl-scroll{ overflow-x:auto; -webkit-overflow-scrolling:touch; }
/* ───────── the dispatch grid ─────────
   A deliberate, fixed grid: every column keeps its width whatever the content
   is, so headers never drift from their data and rows never jump as the queue
   moves. Widths are proportional and weighted by how much text each field
   really carries. Scoped to .dsp — the shared stylesheet is untouched. */
table.dsp{ width:100%; border-collapse:collapse; table-layout:fixed; min-width:700px; }
table.dsp th,table.dsp td{ padding:10px 10px; vertical-align:middle; }
table.dsp col.d-order{ width:14%; }   /* a full RAF-XXXXXXX id plus its flags */
table.dsp col.d-store{ width:12%; }
table.dsp col.d-area { width:12%; }
table.dsp col.d-type { width:11%; }
table.dsp col.d-state{ width:16%; }   /* the longest operational label lives here */
table.dsp col.d-drv  { width:10%; }
table.dsp col.d-wait { width:12%; }
table.dsp col.d-act  { width:13%; }

/* semantic alignment — not everything centred */
table.dsp .d-order,table.dsp .d-store,table.dsp .d-area{ text-align:start; }
table.dsp .d-type,table.dsp .d-state,table.dsp .d-drv,table.dsp .d-wait,table.dsp .d-act{ text-align:center; }
table.dsp .d-store,table.dsp .d-area,table.dsp .d-state,table.dsp .d-drv,table.dsp .d-type{ overflow-wrap:anywhere; }
table.dsp .d-order .ord-id{ white-space:nowrap; }
table.dsp .badge{ max-width:100%; white-space:normal; overflow-wrap:anywhere; }
table.dsp .nc{ max-width:100%; white-space:normal; }
table.dsp .d-wait .nowrap{ display:block; }
table.dsp .d-wait .sub{ display:block; margin-block-start:1px; }
table.dsp th{ position:sticky; top:0; z-index:1; }
table.dsp tbody tr{ cursor:pointer; }
table.dsp tbody tr:focus-visible{ outline:2px solid var(--accent); outline-offset:-2px; }
.ord-id{ display:inline-flex; align-items:center; gap:7px; font-family:'DM Sans',ui-monospace,monospace; font-size:12.5px; font-weight:700; color:var(--ink); }
.ord-id .live{ width:6px; height:6px; border-radius:50%; background:var(--accent); flex-shrink:0; }
/* the two flags an order can carry, from facts the authorities already hold */
.flag{ display:inline-flex; align-items:center; gap:4px; font-size:11.5px; font-weight:700; margin-block-start:2px; }
.flag.late{ color:var(--alert); }
.flag.tkt{ color:var(--pend); }

/* details sheet */
.sheet{ position:fixed; inset:0; z-index:90; background:rgba(12,20,17,.42); display:flex; justify-content:flex-end; }
.sheet-c{ width:min(560px,100%); height:100%; background:var(--surface); display:flex; flex-direction:column; box-shadow:var(--shadow-pop); }
.sheet-h{ display:flex; align-items:center; gap:10px; padding:12px 16px; border-block-end:1px solid var(--line); background:var(--surface-2); }
.sheet-h .t{ flex:1; min-width:0; }
.sheet-h .t b{ display:block; color:var(--ink); font-size:14.5px; font-family:'DM Sans',sans-serif; }
.sheet-h .t span{ display:block; color:var(--muted); font-size:12px; }
.sheet-b{ flex:1; overflow-y:auto; padding:0 0 20px; }
.sec{ padding:14px 16px; border-block-end:1px solid var(--line); }
.sec:last-child{ border-block-end:0; }
.sec > h3{ margin:0 0 10px; font-size:11px; font-weight:800; letter-spacing:.08em; text-transform:uppercase; color:var(--faint);
  display:flex; align-items:center; gap:7px; }
.sec > h3 i{ font-size:15px; color:var(--accent); letter-spacing:0; }
.kv{ display:flex; gap:12px; padding:5px 0; font-size:13px; align-items:baseline; }
.kv .k{ color:var(--muted); flex:0 0 40%; max-width:40%; }
.kv .v{ color:var(--ink); font-weight:600; min-width:0; overflow-wrap:anywhere; }
.lines{ list-style:none; margin:0; padding:0; }
.lines li{ display:flex; gap:10px; align-items:baseline; padding:7px 0; border-block-end:1px dashed var(--line); font-size:13px; }
.lines li:last-child{ border-block-end:0; }
.lines .nm{ flex:1; min-width:0; color:var(--ink); overflow-wrap:anywhere; }
.lines .sub{ display:block; color:var(--faint); font-size:11.5px; margin-block-start:2px; overflow-wrap:anywhere; }
.ms{ list-style:none; margin:0; padding:0; }
.ms li{ display:flex; gap:10px; align-items:baseline; padding:6px 0; font-size:12.5px; }
.ms .k{ flex:1; color:var(--muted); }
.ms .v{ color:var(--ink); font-weight:600; font-family:'DM Sans',sans-serif; white-space:nowrap; }
.ms .v.na{ color:var(--faint); font-weight:500; font-family:var(--font); }

/* laptop: the eight columns tighten so the queue fits beside the sidebar
   without a sideways scroll — the long labels wrap instead */
@media (max-width:1400px){
  table.dsp th,table.dsp td{ padding:9px 8px; }
  table.dsp th{ white-space:normal; }
  table.dsp .ord-id{ font-size:12px; }
}
@media (max-width:1100px){
  table.dsp th,table.dsp td{ padding:9px 6px; }
  table.dsp .ord-id{ font-size:11px; gap:5px; }
  table.dsp .badge{ font-size:11px; padding:3px 7px; }
  table.dsp .nc{ font-size:10.5px; padding:2px 6px; }
  html[lang="en"] table.dsp th{ font-size:10px; letter-spacing:.02em; }
}
@media (max-width:900px){ .tools{ padding:8px; } }
/* the queue becomes one card per order */
@media (max-width:860px){
  table.dsp{ min-width:0; table-layout:auto; }
  table.dsp colgroup{ display:none; }
  table.dsp td[class*="d-"]{ text-align:start; }
  table.dsp .d-wait .nowrap,table.dsp .d-wait .sub{ display:inline; }
  table.dsp, table.dsp tbody, table.dsp tr, table.dsp td{ display:block; width:100%; }
  table.dsp thead{ position:absolute; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; border:0; }
  table.dsp tbody tr{ border-block-end:1px solid var(--line); padding:8px 0; }
  table.dsp tbody tr:last-child{ border-block-end:0; }
  table.dsp td{ border:0; display:flex; align-items:center; gap:12px; padding:5px 14px; }
  table.dsp td::before{ content:attr(data-l); flex:0 0 38%; max-width:38%; color:var(--faint); font-size:11.5px; font-weight:700; }
  table.dsp td > *{ min-width:0; }
  table.dsp td .badge{ white-space:normal; }
  .sheet-c{ width:100%; }
  .kv .k{ flex-basis:44%; max-width:44%; }
  .kv .badge{ white-space:normal; }
}
@media (max-width:520px){
  .scope{ padding:0 10px; font-size:12.5px; }
  .tools .btn{ flex:1 1 auto; }
}
</style>

<script>
/* ============================================================================
   DISPATCH & ASSIGNMENT — التوزيع والتعيين
   The queue between the store and the road: which orders the merchant has
   finished, how long each has been waiting, where it is going, and what is
   already on its way.

   IT IS A VIEW. It writes no order, no assignment, no ticket and no audit
   event, and it keeps no storage of its own. Every value comes from the
   authority that owns it (RAFShop.Orders, RAFOrderSnapshot, RAFOrderEngine,
   RAFSource, RAFCustomerService, RAFPerm); a value that does not exist is
   shown as "—" rather than computed, guessed or filled in.

   ON THE ASSIGNMENT ACTION — RAF today has no authority that can carry out a
   تعيين: no permission key expresses it (the drivers module is view / approve
   / suspend), no authority decides which driver may take an order, and no
   record holds the chosen driver — fulfilment.driverId is written by nothing.
   So the page shows the queue and states plainly that the action is not
   available, rather than offering a control that would fabricate one.
   ==========================================================================*/
(function(){
  'use strict';

  var E = window.RAFOrderEngine, P = window.RAFPerm, CS = window.RAFCustomerService;
  /* assignment belongs to the Logistics authority. Dispatch performs no
     assignment of its own: it calls the same RAFLogistics.assignOrder the
     Drivers page calls, so the rule lives in exactly one place. */
  var LG = window.RAFLogistics;
  var ME = null, CAP = null, CAN = { tickets:false, customer:false };

  /* the Command Center's access boundary, unchanged: existing keys only, which
     today is exactly Super Admin, Higher Management and Operations Manager.
     RAF still has no dedicated logistics permission key. */
  var PERM = { orders:'orders.view', drivers:'drivers.view', ops:'drivers.suspend' };

  function root(){ return document.getElementById('htmlRoot'); }
  function isEn(){ return root().lang === 'en'; }
  function T(ar,en){ return isEn() ? en : ar; }
  function L(o){ return (o && typeof o === 'object') ? (isEn() ? (o.en||o.ar) : (o.ar||o.en)) : (o||''); }
  function el(id){ return document.getElementById(id); }
  function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
  function locale(){ return isEn() ? 'en-GB' : 'ar-KW-u-nu-latn'; }
  var DASH = '<span class="dash">—</span>';
  function bidi(v){ return (v == null || v === '') ? DASH : '<bdi>' + esc(v) + '</bdi>'; }

  function clockOf(ms){
    if(!ms && ms !== 0) return null;
    var d = new Date(ms); if(isNaN(d.getTime())) return null;
    try { return d.toLocaleString(locale(), { day:'2-digit', month:'short', year:'numeric', hour:'2-digit', minute:'2-digit', timeZone:'Asia/Kuwait' }); }
    catch(e){ return d.toISOString().slice(0,16).replace('T',' '); }
  }
  function shortClock(ms){
    if(!ms && ms !== 0) return null;
    var d = new Date(ms); if(isNaN(d.getTime())) return null;
    try { return d.toLocaleString(locale(), { day:'2-digit', month:'short', hour:'2-digit', minute:'2-digit', timeZone:'Asia/Kuwait' }); }
    catch(e){ return d.toISOString().slice(0,16).replace('T',' '); }
  }
  function mins(ms){
    var m = Math.max(0, Math.round(ms/60000));
    if(m < 60) return T(m + ' د', m + 'm');
    var h = Math.floor(m/60), r = m%60;
    if(h < 48) return T(h + ' س ' + r + ' د', h + 'h ' + r + 'm');
    return T(Math.floor(h/24) + ' ي', Math.floor(h/24) + 'd');
  }

  /* ───────── the read model ─────────
     One pass over the orders the authorities already hold. Nothing is stored;
     every render re-reads. */
  var ROWS = [];
  function readAll(){
    var orders = [];
    try { orders = (window.RAFShop && RAFShop.Orders ? RAFShop.Orders.all() : []) || []; } catch(e){ orders = []; }
    ROWS = orders.map(function(o){
      var snap = null;
      try { snap = window.RAFOrderSnapshot ? RAFOrderSnapshot.of(o.id) : null; } catch(e){ snap = null; }
      var f = (snap && snap.fulfilment) || {};
      var d = (snap && snap.delivery) || {};
      var m = null; try { m = E ? E.mstate(o.id) : null; } catch(e){ m = null; }
      var accepted = null, ready = null;
      try {
        var ma = E ? E.acceptedAt(o.id) : null, mr = E ? E.readyAt(o.id) : null;
        accepted = ma && ma.at ? ma.at : null; ready = mr && mr.at ? mr.at : null;
      } catch(e){}
      /* the merchant's Promised ETA, recorded at acceptance. It is the order
         promise, NOT a delivery ETA, and is always labelled as such. */
      var promise = null;
      try { var pe = E ? E.promisedEtaAt(o.id) : null; if(pe && pe.recorded) promise = pe.at; } catch(e){ promise = null; }
      /* the canonical store record, by the snapshot's slug */
      var store = null;
      if(snap && snap.storeSlug){
        var s = null; try { s = window.RAFSource ? RAFSource.store(snap.storeSlug) : null; } catch(e){ s = null; }
        store = s && s.name ? { ar:s.name.ar, en:s.name.en } : { ar:snap.storeNameAr, en:snap.storeNameEn };
      } else if(o.store) store = o.store;
      return {
        id:o.id, status:o.status, mstate:m, snap:snap,
        store:store, storeSlug:(snap && snap.storeSlug) || null,
        customerName:(snap && snap.customer) ? snap.customer.name : null,
        area:d.area || null, address:d.address || null, dtype:d.type || null,
        placedAt:snap ? snap.checkoutAt : null,
        acceptedAt:accepted, readyAt:ready, promisedAt:promise,
        driverId:f.driverId || null, assignedAt:f.assignedAt || null,
        pickedUpAt:f.pickedUpAt || null, deliveredAt:f.deliveredAt || null
      };
    });
    return ROWS;
  }

  /* ───────── operational state ─────────
     The same DISPLAY reading the Command Center and Orders use, unchanged: the
     order status, the merchant state (RAFOrderEngine) and the snapshot's
     fulfilment record. This page defines no state and writes none. */
  function stateOf(r){
    if(r.status === 'cancelled') return { k:'cancelled', ar:'ملغى', en:'Cancelled', cls:'b-off' };
    if(r.status === 'delivered' || r.deliveredAt) return { k:'delivered', ar:'تم التسليم', en:'Delivered', cls:'b-done' };
    if(r.pickedUpAt) return { k:'on_the_way', ar:'في الطريق', en:'On the way', cls:'b-go' };
    if(r.driverId)   return { k:'assigned', ar:'تم تعيين السائق', en:'Assigned', cls:'b-go' };
    if(r.mstate === 'ready' || r.mstate === 'waiting_driver')
      return { k:'unassigned', ar:'بانتظار تعيين سائق', en:'Waiting for Driver Assignment', cls:'b-wait' };
    if(r.mstate === 'preparing' || r.mstate === 'accepted')
      return { k:'preparing', ar:'قيد التجهيز في المتجر', en:'Preparing at the store', cls:'b-prep' };
    if(r.mstate === 'pending')
      return { k:'pending', ar:'بانتظار قبول المتجر', en:'Awaiting merchant acceptance', cls:'b-prep' };
    if(r.mstate === 'rejected') return { k:'rejected', ar:'رفضه المتجر', en:'Rejected by the store', cls:'b-off' };
    return { k:'none', ar:'—', en:'—', cls:'b-plain' };
  }
  /* the moment the CURRENT state began — the basis of the Waiting column */
  function stateSince(r){
    var k = stateOf(r).k;
    if(k === 'unassigned')  return r.readyAt || null;      /* waiting since READY */
    if(k === 'preparing')   return r.acceptedAt || null;
    if(k === 'on_the_way')  return r.pickedUpAt || null;
    if(k === 'assigned')    return r.assignedAt || null;
    if(k === 'pending')     return r.placedAt || null;
    return null;
  }
  /* past the merchant's Promised ETA — a historical fact from RAFOrderEngine,
     never a threshold invented here */
  function isLate(r){
    var k = stateOf(r).k;
    if(k === 'delivered' || k === 'cancelled' || k === 'rejected') return false;
    return !!(r.promisedAt && Date.now() > r.promisedAt);
  }

  /* RAFOrderSnapshot's own DELIVERY values, shown in words rather than as the
     stored identifier. A pickup order is shown as such — the page states the
     recorded fulfilment type and draws no conclusion of its own from it. */
  function deliveryType(v){
    var S = window.RAFOrderSnapshot, D = (S && S.DELIVERY) || { DELIVERY:'delivery', PICKUP:'pickup' };
    if(v === D.DELIVERY) return T('توصيل','Delivery');
    if(v === D.PICKUP)   return T('استلام من المتجر','Pickup');
    return null;
  }

  /* ───────── scopes ─────────
     The dispatch lifecycle as the authorities record it, the waiting queue
     first. Delivered, cancelled and rejected orders are order history and
     belong to the Orders page, not to dispatch. */
  var SCOPES = [
    { k:'queue',  ar:'بانتظار التعيين', en:'Awaiting Assignment',
      emptyAr:'لا توجد طلبات بانتظار التعيين', emptyEn:'No orders are waiting for assignment',
      test:function(r){ return stateOf(r).k === 'unassigned'; } },
    { k:'prep',   ar:'قيد التجهيز', en:'Preparing',
      emptyAr:'لا توجد طلبات قيد التجهيز', emptyEn:'No orders are being prepared',
      test:function(r){ return stateOf(r).k === 'preparing'; } },
    { k:'out',    ar:'مع السائق', en:'With Driver',
      emptyAr:'لا توجد طلبات مع سائق', emptyEn:'No orders are with a driver',
      test:function(r){ var k = stateOf(r).k; return k === 'assigned' || k === 'on_the_way'; } },
    { k:'all',    ar:'الكل', en:'All',
      emptyAr:'لا توجد عمليات حالية', emptyEn:'No current operations',
      test:function(r){ var k = stateOf(r).k; return k === 'unassigned' || k === 'preparing' || k === 'assigned' || k === 'on_the_way'; } }
  ];
  var F = { scope:'queue', q:'', state:'', store:'', dtype:'', from:'', to:'' };

  function scopeOf(k){ for(var i=0;i<SCOPES.length;i++) if(SCOPES[i].k === k) return SCOPES[i]; return SCOPES[0]; }
  function matchesFilters(r){
    if(F.state && stateOf(r).k !== F.state) return false;
    if(F.store && r.storeSlug !== F.store) return false;
    if(F.dtype && (r.dtype || '') !== F.dtype) return false;
    var at = r.placedAt;
    if(F.from){ var fromMs = Date.parse(F.from + 'T00:00:00'); if(!at || isNaN(fromMs) || at < fromMs) return false; }
    if(F.to){ var toMs = Date.parse(F.to + 'T23:59:59'); if(!at || isNaN(toMs) || at > toMs) return false; }
    if(F.q){
      var q = F.q.trim().toLowerCase();
      if(q){
        var hay = [r.id, L(r.store), r.store && r.store.ar, r.store && r.store.en, r.customerName, r.area]
          .filter(Boolean).join(' ').toLowerCase();
        if(hay.indexOf(q) < 0) return false;
      }
    }
    return true;
  }
  /* longest wait first: the order that has been ready the longest is the one
     dispatch needs to look at first */
  function visibleRows(){
    var sc = scopeOf(F.scope);
    return ROWS.filter(function(r){ return sc.test(r) && matchesFilters(r); })
               .sort(function(a,b){ return (stateSince(a)||Infinity) - (stateSince(b)||Infinity); });
  }
  function filtersActive(){ return !!(F.q || F.state || F.store || F.dtype || F.from || F.to); }

  /* ───────── toolbar: THE LOGISTICS FILTER PATTERN ─────────
     Search + one Filter button that opens one applet. No dropdown ever returns
     to the toolbar, and no filter exists for anything the data cannot answer —
     there is no driver, zone, distance, proximity or SLA filter here because
     RAF holds none of those facts. */
  function toolbar(){
    var n = activeFilterCount();
    return '<div class="tools" role="search">'
      + '<div class="srch"><i class="ti ti-search" aria-hidden="true"></i>'
      + '<input id="q" type="search" value="' + esc(F.q) + '" autocomplete="off" spellcheck="false"'
      + ' placeholder="' + esc(T('ابحث عن رقم الطلب أو المتجر أو المنطقة...','Search order ID, store or area...')) + '"'
      + ' aria-label="' + esc(T('بحث في قائمة التوزيع','Search the dispatch queue')) + '" oninput="OPS.setQ(this.value)">'
      + (F.q ? '<button class="clr" type="button" onclick="OPS.setQ(\'\')" aria-label="' + esc(T('مسح البحث','Clear search')) + '"><i class="ti ti-x" aria-hidden="true"></i></button>' : '')
      + '</div>'
      + '<button class="btn filter-btn' + (n ? ' on' : '') + '" type="button" id="filterBtn" onclick="OPS.openFilters()"'
      + ' aria-haspopup="dialog" aria-label="' + esc(T('تصفية قائمة التوزيع','Filter the dispatch queue')) + '">'
      + '<i class="ti ti-filter" aria-hidden="true"></i>' + T('فلتر','Filter')
      + (n ? '<span class="fcount">' + n + '</span>' : '') + '</button>'
      + '</div>';
  }

  /* ───────── the filter applet ─────────
     One dialog holding every supported filter. It edits a DRAFT copy; the list
     changes only on Apply, so nothing shifts under the operator while they are
     choosing. It reads no authority and writes no record. */
  var DRAFT = null;
  function activeFilterCount(){
    var n = 0;
    if(F.state) n++; if(F.store) n++; if(F.dtype) n++; if(F.from) n++; if(F.to) n++;
    return n;
  }
  function stateOptions(){
    var seen = {}, out = [];
    ROWS.forEach(function(r){
      if(!scopeOf('all').test(r)) return;
      var s = stateOf(r); if(s.k === 'none' || seen[s.k]) return;
      seen[s.k] = 1; out.push(s);
    });
    return out;
  }
  function storeOptions(){
    var seen = {}, out = [];
    ROWS.forEach(function(r){
      if(!scopeOf('all').test(r) || !r.storeSlug || seen[r.storeSlug]) return;
      seen[r.storeSlug] = 1; out.push({ slug:r.storeSlug, name:L(r.store) || r.storeSlug });
    });
    return out.sort(function(a,b){ return String(a.name).localeCompare(String(b.name)); });
  }
  function typeOptions(){
    var seen = {}, out = [];
    ROWS.forEach(function(r){
      if(!scopeOf('all').test(r) || !r.dtype || seen[r.dtype]) return;
      var lbl = deliveryType(r.dtype); if(!lbl) return;
      seen[r.dtype] = 1; out.push({ v:r.dtype, label:lbl });
    });
    return out;
  }
  function openFilters(){
    if(!ME) return;
    DRAFT = { state:F.state, store:F.store, dtype:F.dtype, from:F.from, to:F.to };
    renderApplet();
  }
  function closeFilters(){
    DRAFT = null; el('appletHost').innerHTML = '';
    var b = el('filterBtn'); if(b) b.focus();
  }
  function renderApplet(){
    if(!DRAFT) return;
    var stOpts = stateOptions().map(function(s){
      return '<option value="' + esc(s.k) + '"' + (DRAFT.state === s.k ? ' selected' : '') + '>' + T(s.ar,s.en) + '</option>'; }).join('');
    var srOpts = storeOptions().map(function(s){
      return '<option value="' + esc(s.slug) + '"' + (DRAFT.store === s.slug ? ' selected' : '') + '>' + esc(s.name) + '</option>'; }).join('');
    var tyOpts = typeOptions().map(function(t){
      return '<option value="' + esc(t.v) + '"' + (DRAFT.dtype === t.v ? ' selected' : '') + '>' + esc(t.label) + '</option>'; }).join('');
    el('appletHost').innerHTML =
      '<div class="sheet" id="applet" onclick="if(event.target===this)OPS.closeFilters()">'
      + '<div class="sheet-c applet" role="dialog" aria-modal="true" aria-labelledby="flT">'
      + '<div class="sheet-h"><div class="t"><b id="flT">' + T('تصفية قائمة التوزيع','Filter Dispatch') + '</b>'
        + '<span>' + T('تُطبَّق على النطاق المحدد','Applied within the selected scope') + '</span></div>'
        + '<button class="ibtn" type="button" onclick="OPS.closeFilters()" aria-label="' + esc(T('إغلاق','Close')) + '"><i class="ti ti-x" aria-hidden="true"></i></button></div>'
      + '<div class="sheet-b">'
        + '<div class="fld"><label for="f-state">' + T('الحالة','Status') + '</label>'
          + '<select id="f-state" onchange="OPS.draft(\'state\',this.value)"><option value="">' + T('كل الحالات','All statuses') + '</option>' + stOpts + '</select></div>'
        + '<div class="fld"><label for="f-store">' + T('المتجر','Store') + '</label>'
          + '<select id="f-store" onchange="OPS.draft(\'store\',this.value)"><option value="">' + T('كل المتاجر','All stores') + '</option>' + srOpts + '</select></div>'
        + (tyOpts ? '<div class="fld"><label for="f-type">' + T('نوع الاستلام','Fulfilment type') + '</label>'
          + '<select id="f-type" onchange="OPS.draft(\'dtype\',this.value)"><option value="">' + T('كل الأنواع','All types') + '</option>' + tyOpts + '</select></div>' : '')
        + '<div class="fld"><span class="lg">' + T('التاريخ','Date') + '</span><div class="two">'
          + '<label class="sub-f" for="f-from">' + T('من تاريخ','From date')
            + '<input id="f-from" type="date" dir="ltr" value="' + esc(DRAFT.from) + '" onchange="OPS.draft(\'from\',this.value)"></label>'
          + '<label class="sub-f" for="f-to">' + T('إلى تاريخ','To date')
            + '<input id="f-to" type="date" dir="ltr" value="' + esc(DRAFT.to) + '" onchange="OPS.draft(\'to\',this.value)"></label>'
          + '</div></div>'
      + '</div>'
      + '<div class="sheet-f">'
        + '<button class="btn" type="button" onclick="OPS.clearFilters()"><i class="ti ti-filter-off" aria-hidden="true"></i>' + T('مسح الفلاتر','Clear Filters') + '</button>'
        + '<button class="btn pri" type="button" onclick="OPS.applyFilters()"><i class="ti ti-check" aria-hidden="true"></i>' + T('تطبيق','Apply') + '</button>'
      + '</div></div></div>';
    var first = el('f-state'); if(first) first.focus();
  }

  function chips(){
    if(!filtersActive()) return '';
    var out = [];
    function chip(key, label, value){
      out.push('<span class="fchip">' + esc(label) + ': <b><bdi>' + esc(value) + '</bdi></b>'
        + '<button type="button" onclick="OPS.setF(\'' + key + '\',\'\')" aria-label="' + esc(T('إزالة الفلتر','Remove filter')) + '">'
        + '<i class="ti ti-x" aria-hidden="true"></i></button></span>');
    }
    if(F.q) chip('q', T('بحث','Search'), F.q);
    if(F.state){ var s = stateOptions().filter(function(x){ return x.k === F.state; })[0]; chip('state', T('الحالة','Status'), s ? T(s.ar,s.en) : F.state); }
    if(F.store){ var st = storeOptions().filter(function(x){ return x.slug === F.store; })[0]; chip('store', T('المتجر','Store'), st ? st.name : F.store); }
    if(F.dtype) chip('dtype', T('نوع الاستلام','Fulfilment type'), deliveryType(F.dtype) || F.dtype);
    if(F.from) chip('from', T('من','From'), F.from);
    if(F.to) chip('to', T('إلى','To'), F.to);
    return '<div class="fchips">' + out.join('') + '</div>';
  }

  /* ───────── driver ─────────
     ONLY a real assignment record. Nothing in RAF writes fulfilment.driverId
     today, so this reads the authoritative record and, finding none, shows
     "—". The Status column already says the order is waiting for a driver, so
     the cell never repeats it. When an assignment authority starts recording a
     driver, the name appears here with no further change. Only the display
     name is ever shown: no phone, no email, no account id. */
  function driverCell(r){
    if(!r.driverId) return DASH;
    var u = null; try { u = P.getUser(r.driverId); } catch(e){ u = null; }
    var name = u && u.name ? u.name : null;
    return name ? '<bdi>' + esc(name) + '</bdi>' : DASH;
  }
  function waitCell(r){
    var at = stateSince(r);
    if(!at) return DASH;
    return '<span class="nowrap">' + esc(mins(Date.now() - at)) + '</span>'
      + '<span class="sub">' + T('منذ ','since ') + esc(shortClock(at) || '') + '</span>';
  }
  /* تعيين — performed by RAFLogistics, never here. The control is rendered
     only when the authority says this account holds drivers.assign; the
     authority re-proves that when the call runs, so the button is presentation
     and not the security boundary. */
  function actionCell(r){
    var k = stateOf(r).k;
    /* assignable from the merchant's acceptance onward (RAFLogistics decides) */
    if(k !== 'unassigned' && k !== 'preparing') return DASH;
    if(!(CAP && CAP.assign))
      return '<span class="nc"><i class="ti ti-lock" aria-hidden="true"></i>' + T('لا تملك صلاحية التعيين','No assignment permission') + '</span>';
    return '<button class="btn sm pri" type="button" onclick="event.stopPropagation();OPS.openAssign(\'' + esc(r.id) + '\')">'
      + '<i class="ti ti-user-check" aria-hidden="true"></i>' + T('تعيين','Assign') + '</button>';
  }
  function areaCell(r){
    if(!CAN.customer) return '<span class="dash" title="' + esc(T('غير مصرّح','Not authorised')) + '">—</span>';
    return r.area ? bidi(r.area) : DASH;
  }

  function rows(list){
    var H = [T('الطلب','Order'), T('المتجر','Store'), T('المنطقة','Area'), T('نوع الاستلام','Fulfilment'),
             T('الحالة','Status'), T('السائق','Driver'), T('مدة الانتظار','Waiting'), T('الإجراء','Action')];
    var COLS = ['d-order','d-store','d-area','d-type','d-state','d-drv','d-wait','d-act'];
    return '<div class="tbl-scroll"><table class="dsp"><caption class="sr-only">' + T('قائمة التوزيع والتعيين','Dispatch queue') + '</caption>'
      + '<colgroup>' + COLS.map(function(c){ return '<col class="' + c + '">'; }).join('') + '</colgroup>'
      + '<thead><tr>'
      + H.map(function(h,i){ return '<th scope="col" class="' + COLS[i] + '">' + h + '</th>'; }).join('') + '</tr></thead><tbody>'
      + list.map(function(r){
          var st = stateOf(r), ty = deliveryType(r.dtype), tkt = TKT[r.id];
          return '<tr tabindex="0" onclick="OPS.open(\'' + esc(r.id) + '\')" onkeydown="if(event.key===\'Enter\'||event.key===\' \'){event.preventDefault();OPS.open(\'' + esc(r.id) + '\');}">'
            + '<td class="d-order" data-l="' + esc(H[0]) + '"><span class="ord-id">'
              + (st.k === 'unassigned' ? '<span class="live" aria-hidden="true"></span>' : '')
              + '<bdi>' + esc(r.id) + '</bdi></span>'
              + (isLate(r) ? '<span class="flag late"><i class="ti ti-clock-exclamation" aria-hidden="true"></i>'
                  + T('تجاوز الوقت الموعود','Past promised time') + '</span>' : '')
              + (tkt ? '<span class="flag tkt"><i class="ti ti-ticket" aria-hidden="true"></i>'
                  + T(tkt + ' تذكرة', tkt + ' ticket(s)') + '</span>' : '') + '</td>'
            + '<td class="d-store" data-l="' + esc(H[1]) + '">' + (r.store ? bidi(L(r.store)) : DASH) + '</td>'
            + '<td class="d-area" data-l="' + esc(H[2]) + '">' + areaCell(r) + '</td>'
            + '<td class="d-type" data-l="' + esc(H[3]) + '">' + (ty ? esc(ty) : DASH) + '</td>'
            + '<td class="d-state" data-l="' + esc(H[4]) + '">' + (st.k === 'none' ? DASH : '<span class="badge ' + st.cls + '">' + T(st.ar,st.en) + '</span>') + '</td>'
            + '<td class="d-drv" data-l="' + esc(H[5]) + '">' + driverCell(r) + '</td>'
            + '<td class="d-wait" data-l="' + esc(H[6]) + '">' + waitCell(r) + '</td>'
            + '<td class="d-act" data-l="' + esc(H[7]) + '">' + actionCell(r) + '</td>'
            + '</tr>';
        }).join('')
      + '</tbody></table></div>';
  }

  /* related central tickets, counted per order by the ticket authority itself.
     RAF keeps ONE central ticket record: this page reads the tickets already
     linked to an order and never opens, moves or duplicates one. */
  var TKT = {};
  function readTickets(){
    TKT = {};
    if(!CAN.tickets || !CS) return;
    try {
      var r = CS.listTickets({ active:true });
      if(r && r.ok) (r.items || []).forEach(function(t){
        var oid = t.context && t.context.orderId;
        if(oid) TKT[oid] = (TKT[oid] || 0) + 1;
      });
    } catch(e){ TKT = {}; }
  }

  /* one slim line of real counts, each the length of a list on this page */
  function strip(){
    var all = ROWS.filter(scopeOf('all').test);
    function n(k){ return all.filter(function(r){ return stateOf(r).k === k; }).length; }
    var late = all.filter(isLate).length;
    var q = n('unassigned');
    var cells = [
      { k:T('بانتظار التعيين','Awaiting Assignment'), v:q, cls:q ? 'wait' : '' },
      { k:T('تجاوز الوقت الموعود','Past promised time'), v:late, cls:late ? 'hot' : '' },
      { k:T('قيد التجهيز','Preparing'), v:n('preparing'), cls:'' },
      { k:T('مع السائق','With Driver'), v:n('assigned') + n('on_the_way'), cls:'' }
    ];
    return '<div class="strip">' + cells.map(function(c){
      return '<span class="s ' + c.cls + '"><b class="v">' + c.v + '</b><span class="k">' + c.k + '</span></span>'; }).join('') + '</div>';
  }

  function render(){
    renderHeader(); renderNav();
    var list = visibleRows(), total = ROWS.filter(scopeOf('all').test).length;
    var body = list.length
      ? rows(list)
      : '<div class="empty"><i class="ti ti-truck-off" aria-hidden="true"></i><b>'
        /* a filtered-out list and an empty scope are different facts */
        + (filtersActive()
            ? T('لا توجد طلبات مطابقة للفلاتر الحالية','No orders match the current filters')
            : T(scopeOf(F.scope).emptyAr, scopeOf(F.scope).emptyEn))
        + '</b>' + (filtersActive() ? '<button class="btn sm" type="button" onclick="OPS.clearFilters()">'
            + T('مسح الفلاتر','Clear Filters') + '</button>' : '') + '</div>';
    el('view').innerHTML =
      '<h1 class="sr-only">' + T('التوزيع والتعيين','Dispatch & Assignment') + '</h1>'
      + '<div class="wk">'
      + '<div class="wk-head"><p>' + T('الطلبات المقبولة في المتاجر وما هو في الطريق.','Orders accepted by the stores and what is already on the way.') + '</p>'
      + '<span class="wk-count">' + T(list.length + ' من ' + total + ' طلب', list.length + ' of ' + total + ' orders') + '</span></div>'
      + strip()
      + '<div class="scopes" role="group" aria-label="' + esc(T('نطاق التوزيع','Dispatch scope')) + '">'
      + SCOPES.map(function(s){
          var n = ROWS.filter(s.test).length;
          return '<button class="scope" type="button" aria-pressed="' + (F.scope === s.k) + '" onclick="OPS.setScope(\'' + s.k + '\')">'
            + T(s.ar,s.en) + '<span class="n">' + n + '</span></button>'; }).join('')
      + '</div>'
      + toolbar() + chips()
      + '<div class="tbl-card">' + body + '</div>'
      + '</div>';
    if(OPEN) renderSheet();
  }

  /* ───────── inspection sheet ───────── */
  var OPEN = null, openTrigger = null;
  function sec(title, icon, inner){
    return '<section class="sec"><h3><i class="ti ' + icon + '" aria-hidden="true"></i>' + esc(title) + '</h3>' + inner + '</section>';
  }
  function kv(k, v){ return '<div class="kv"><span class="k">' + esc(k) + '</span><span class="v">' + v + '</span></div>'; }

  function sheetBody(r){
    var st = stateOf(r), snap = r.snap, ty = deliveryType(r.dtype);
    var h = '';

    /* التعيين — the dispatch question this page exists to answer */
    h += sec(T('التعيين','Assignment'), 'ti-user-check',
        kv(T('الحالة','Status'), st.k === 'none' ? DASH : '<span class="badge ' + st.cls + '">' + T(st.ar,st.en) + '</span>')
      + kv(T('السائق','Driver'), driverCell(r))
      + kv(T('وقت التعيين','Assigned at'), r.assignedAt ? '<bdi>' + esc(clockOf(r.assignedAt)) + '</bdi>' : DASH)
      + kv(T('مدة الانتظار','Waiting'), stateSince(r) ? esc(mins(Date.now() - stateSince(r))) : DASH)
      + (st.k === 'unassigned' || st.k === 'preparing'
          ? (CAP && CAP.assign
              ? '<div class="acts-row"><button class="btn pri" type="button" onclick="OPS.openAssign(\'' + esc(r.id) + '\')">'
                + '<i class="ti ti-user-check" aria-hidden="true"></i>' + T('تعيين سائق','Assign a driver') + '</button></div>'
              : '<div class="notice"><i class="ti ti-lock" aria-hidden="true"></i><span>'
                + T('التعيين غير متاح لحسابك.','Assignment is not available to your account.') + '</span></div>')
          : '')
      + (st.k !== 'unassigned' && r.driverId && !r.pickedUpAt && CAP && CAP.assign
          ? '<div class="acts-row"><button class="btn" type="button" onclick="OPS.openReturn(\'' + esc(r.id) + '\')">'
            + '<i class="ti ti-arrow-back-up" aria-hidden="true"></i>' + T('إعادة إلى القائمة','Return to pool') + '</button></div>'
          : ''));

    /* التسليم — where this order is going */
    h += sec(T('التسليم','Delivery'), 'ti-map-pin',
        kv(T('نوع الاستلام','Fulfilment type'), ty ? esc(ty) : DASH)
      + (CAN.customer
          ? kv(T('المنطقة','Area'), r.area ? bidi(r.area) : DASH)
            + kv(T('العنوان','Address'), r.address ? bidi(r.address) : DASH)
            + kv(T('العميل','Customer'), r.customerName ? bidi(r.customerName) : DASH)
          : '<div class="notice"><i class="ti ti-lock" aria-hidden="true"></i><span>'
            + T('بيانات التسليم غير متاحة لحسابك.','Delivery details are not available to your account.') + '</span></div>'));

    /* المتجر — where it is collected from */
    h += sec(T('المتجر','Store'), 'ti-building-store',
        kv(T('المتجر','Store'), r.store ? bidi(L(r.store)) : DASH)
      + kv(T('المعرّف','Slug'), r.storeSlug ? '<bdi>' + esc(r.storeSlug) + '</bdi>' : DASH));

    /* التوقيت — authoritative timestamps only. The Promised ETA is the
       merchant's order promise and is labelled as such; it is never presented
       as a delivery ETA. */
    var ms = [
      [T('الإنشاء','Created'), r.placedAt],
      [T('قبول المتجر','Merchant accepted'), r.acceptedAt],
      [T('الجاهزية','Ready'), r.readyAt],
      [T('الاستلام من المتجر','Picked up'), r.pickedUpAt]
    ];
    h += sec(T('التوقيت','Timeline'), 'ti-clock', '<ul class="ms">' + ms.map(function(m){
        return '<li><span class="k">' + esc(m[0]) + '</span><span class="v' + (m[1] ? '' : ' na') + '">'
          + (m[1] ? '<bdi>' + esc(clockOf(m[1])) + '</bdi>' : '—') + '</span></li>'; }).join('')
      + '<li><span class="k">' + T('الوقت الموعود من المتجر','Merchant promised time') + '</span>'
      + '<span class="v' + (r.promisedAt ? '' : ' na') + '">'
      + (r.promisedAt ? '<bdi>' + esc(clockOf(r.promisedAt)) + '</bdi>' : '—') + '</span></li>'
      + '</ul>'
      + (isLate(r) ? '<div class="notice"><i class="ti ti-clock-exclamation" aria-hidden="true"></i><span>'
          + T('تجاوز الطلب الوقت الموعود من المتجر.','This order is past the time the store promised.') + '</span></div>' : ''));

    /* التذاكر — the central ticket record's own answer for this order */
    h += sec(T('التذاكر','Tickets'), 'ti-ticket', ticketSection(r));
    return h;
  }

  function ticketSection(r){
    if(!CAN.tickets)
      return '<div class="notice"><i class="ti ti-lock" aria-hidden="true"></i><span>'
        + T('لا تملك صلاحية قراءة التذاكر.','You do not have permission to read tickets.') + '</span></div>';
    var list = null;
    try { var res = CS.listTickets({ orderId:r.id }); if(res && res.ok) list = res.items || []; } catch(e){ list = null; }
    if(list == null)
      return '<div class="notice warn"><i class="ti ti-alert-circle" aria-hidden="true"></i><span>'
        + T('تعذّرت قراءة التذاكر.','Tickets could not be read.') + '</span></div>';
    if(!list.length)
      return '<div class="empty"><span>' + T('لا توجد تذاكر مرتبطة بهذا الطلب.','No tickets are linked to this order.') + '</span></div>';
    return '<ul class="lines">' + list.map(function(t){
        return '<li><span class="nm"><bdi>' + esc(t.subject || t.ticketId) + '</bdi>'
          + '<span class="sub"><bdi>' + esc(t.ticketId) + '</bdi>'
          + (t.departmentText ? ' · ' + esc(L(t.departmentText)) : '') + '</span></span>'
          + (t.statusText ? '<span class="badge b-plain">' + esc(L(t.statusText)) + '</span>' : '') + '</li>'; }).join('')
      + '</ul>';
  }

  function renderSheet(){
    var r = null;
    for(var i=0;i<ROWS.length;i++) if(ROWS[i].id === OPEN) r = ROWS[i];
    if(!r){ closeSheet(); return; }
    var st = stateOf(r);
    el('sheetHost').innerHTML =
      '<div class="sheet" id="sheet" onclick="if(event.target===this)OPS.close()">'
      + '<div class="sheet-c" role="dialog" aria-modal="true" aria-labelledby="shT">'
      + '<div class="sheet-h"><div class="t"><b id="shT"><bdi>' + esc(r.id) + '</bdi></b>'
        + '<span>' + (r.store ? esc(L(r.store)) : '') + '</span></div>'
        + (st.k === 'none' ? '' : '<span class="badge ' + st.cls + '">' + T(st.ar,st.en) + '</span>')
        + '<button class="ibtn" type="button" onclick="OPS.close()" aria-label="' + esc(T('إغلاق','Close')) + '"><i class="ti ti-x" aria-hidden="true"></i></button></div>'
      + '<div class="sheet-b">' + sheetBody(r) + '</div></div></div>';
    var x = el('sheet').querySelector('.ibtn'); if(x) x.focus();
  }
  function closeSheet(){
    OPEN = null; el('sheetHost').innerHTML = '';
    if(openTrigger && document.contains(openTrigger)) openTrigger.focus();
    openTrigger = null;
  }

  /* ───────── shell ───────── */
  /* the existing settings permission decides whether Settings is listed */
  function canSettings(){ try { return !!(ME && P.can(ME.id, 'settings.view')); } catch(e){ return false; } }
  /* Compensation is listed for the accounts the compensation authority lets
     manage compensations — the same existing Logistics management permission
     these pages already gate their operational actions on. */
  function canCompensation(){ try { return !!(ME && P.can(ME.id, 'drivers.suspend')); } catch(e){ return false; } }
  function renderNav(){
    function item(href, icon, ar, en, current){
      return '<li><a href="' + href + '"' + (current ? ' aria-current="page"' : '') + '>'
        + '<i class="ti ' + icon + '" aria-hidden="true"></i><span>' + T(ar,en) + '</span></a></li>';
    }
    el('navTree').innerHTML =
      '<span class="grp">' + T('العمليات','Operations') + '</span><ul>'
      + item('raf_logistics.html', 'ti-layout-dashboard', 'مركز العمليات', 'Command Center', false)
      + item('raf_logistics_orders.html', 'ti-shopping-bag', 'الطلبات', 'Orders', false)
      + item('raf_logistics_dispatch.html', 'ti-route', 'التوزيع والتعيين', 'Dispatch & Assignment', true)
      + item('raf_logistics_tickets.html', 'ti-ticket', 'التذاكر', 'Tickets', false)
      + item('raf_logistics_drivers.html', 'ti-motorbike', 'السائقون', 'Drivers', false)
      /* Settings is the final administrative section, listed only for an
         account that may actually open it */
      + (canSettings() ? item('raf_logistics_settings.html', 'ti-settings', 'الإعدادات', 'Settings', false) : '')
      + (canCompensation() ? item('raf_logistics_compensation.html', 'ti-receipt-refund', 'التعويضات', 'Compensation', false) : '')
      + '</ul>'
      + '<div class="ops-nav-foot"><b>' + T('العمليات واللوجستيات','Operations & Logistics') + '</b>'
      + T('منصة رف','RAF platform') + '</div>';
  }
  function renderHeader(){
    el('crumbGroup').textContent = T('اللوجستيات · العمليات','Logistics · Operations');
    el('crumbPage').textContent = T('التوزيع والتعيين','Dispatch & Assignment');
    el('langBtn').textContent = isEn() ? 'ع' : 'EN';
    el('langBtn').setAttribute('aria-label', T('التبديل إلى الإنجليزية','Switch to Arabic'));
    if(ME){
      el('userAv').textContent = String(ME.name || '?').trim().charAt(0);
      el('userName').textContent = ME.name || '';
      var role = null; try { role = P.getRole(ME.roleId); } catch(e){}
      el('userRole').textContent = role ? T(role.nameAr, role.nameEn) : '';
    }
    document.title = T('رف — التوزيع والتعيين','RAF — Dispatch & Assignment');
  }

  /* ═════════════════ ASSIGNMENT FORM ═════════════════
     A driver picker and a reason box. Both submits call RAFLogistics — this
     page performs no assignment and knows no assignment rule. The driver list
     is the authority's own answer (assignable drivers only). */
  var FORM = null, FMSG = null, FBUSY = false;
  function fclose(){
    FORM = null; FMSG = null; FBUSY = false; el('formHost').innerHTML = '';
    if(OPEN) renderSheet();
  }
  function fsync(){ var e = el('x-val'); if(e && FORM) FORM.val = String(e.value || ''); }
  function renderForm(){
    if(!FORM) return;
    el('formHost').innerHTML =
      '<div class="sheet" id="formSheet" onclick="if(event.target===this)OPS.fclose()">'
      + '<div class="sheet-c applet" role="dialog" aria-modal="true" aria-labelledby="fmT">'
      + '<div class="sheet-h"><div class="t"><b id="fmT">' + esc(FORM.title) + '</b>'
        + '<span><bdi>' + esc(FORM.orderId) + '</bdi></span></div>'
        + '<button class="ibtn" type="button" onclick="OPS.fclose()" aria-label="' + esc(T('إغلاق','Close')) + '"><i class="ti ti-x" aria-hidden="true"></i></button></div>'
      + '<div class="sheet-b">' + FORM.body()
        + (FMSG ? '<div class="form-msg ' + FMSG.kind + '"><i class="ti ' + (FMSG.kind === 'err' ? 'ti-alert-circle' : 'ti-loader') + '" aria-hidden="true"></i><span>' + esc(FMSG.text) + '</span></div>' : '')
      + '</div>'
      + '<div class="sheet-f">'
        + '<button class="btn" type="button" onclick="OPS.fclose()">' + T('إلغاء','Cancel') + '</button>'
        + '<button class="btn pri" type="button"' + (FBUSY ? ' disabled' : '') + ' onclick="OPS.fsubmit()">'
        + '<i class="ti ' + FORM.icon + '" aria-hidden="true"></i>' + esc(FORM.cta) + '</button>'
      + '</div></div></div>';
    var f = el('x-val'); if(f) f.focus();
  }
  function runOp(call, okAr, okEn){
    FBUSY = true; FMSG = { kind:'busy', text:T('جارٍ التنفيذ...','Working...') };
    renderForm();
    var res = call();
    FBUSY = false;
    if(res && res.ok){ FORM = null; FMSG = null; el('formHost').innerHTML = ''; refresh(); return; }
    FMSG = { kind:'err', text:(res && res.message) || T('تعذّر تنفيذ الإجراء.','The action could not be completed.') };
    renderForm();
  }

  function refresh(){ readAll(); readTickets(); render(); }

  function gate(titleAr, titleEn, msg){
    ME = null; CAP = null; OPEN = null; DRAFT = null; FORM = null;
    el('shell').hidden = true; el('sheetHost').innerHTML = ''; el('appletHost').innerHTML = '';
    el('formHost').innerHTML = '';
    var g = el('gate'); g.hidden = false;
    el('gateT').textContent = T(titleAr, titleEn);
    el('gateP').textContent = msg;
    document.title = T('رف — التوزيع والتعيين','RAF — Dispatch & Assignment');
  }
  function applyLang(){
    var en = isEn();
    document.querySelectorAll('[data-ar][data-en]').forEach(function(e){
      var t = e.getAttribute('data-' + (en ? 'en' : 'ar')); if(t !== null) e.textContent = t;
    });
  }
  function boot(){
    var l = null; try { l = localStorage.getItem('raf_lang'); } catch(e){}
    if(l === 'en'){ root().lang = 'en'; root().dir = 'ltr'; }
    applyLang();

    if(!P || !E || !window.RAFShop){
      gate('تعذّر التحميل','Could not load', T('لم يتم تحميل وحدات رف المطلوبة.','The required RAF modules did not load.'));
      return;
    }
    /* identity from the stored session only — never from the URL, a query
       string or a caller-supplied id. RAFPerm.currentUser() falls back to the
       first administrator when nothing is signed in, so the session key is
       read first and an empty session is refused. */
    var sid = null;
    try {
      sid = P.sessionUserId ? P.sessionUserId() : null;   /* RAFPerm owns this tab's session */
    } catch(e){ sid = null; }
    if(!sid){ gate('يلزم تسجيل الدخول','Sign-in required', T('التوزيع والتعيين متاح لفريق عمليات رف بعد تسجيل الدخول.','Dispatch is available to RAF operations staff after signing in.')); return; }
    var u = null; try { u = P.getUser(sid); } catch(e){ u = null; }
    if(!u){ gate('يلزم تسجيل الدخول','Sign-in required', T('تعذّر التعرف على الحساب.','That account could not be identified.')); return; }
    if(u.status !== 'active'){ gate('حسابك موقوف','Your account is suspended', T('لا يمكن فتح التوزيع والتعيين بحساب موقوف.','A suspended account cannot open Dispatch.')); return; }
    var ok = true;
    try { ok = P.can(u.id, PERM.orders) && P.can(u.id, PERM.drivers) && P.can(u.id, PERM.ops); } catch(e){ ok = false; }
    if(!ok){ gate('لا تملك صلاحية الوصول','You do not have access', T('التوزيع والتعيين متاح لفريق عمليات رف فقط.','Dispatch is available to RAF operations staff only.')); return; }

    ME = { id:u.id, name:u.name, roleId:u.roleId };
    /* what this account may do in Logistics is the authority's answer */
    try { var c = LG ? LG.capabilities() : null; CAP = (c && c.ok) ? c : null; } catch(e){ CAP = null; }
    CAN.tickets  = (function(){ try { return !!(CS && P.can(u.id, 'support.view')); } catch(e){ return false; } })();
    /* the delivery address rides on the order record this account may already
       read (orders.view); nothing else of the customer is read */
    CAN.customer = (function(){ try { return !!P.can(u.id, PERM.orders); } catch(e){ return false; } })();

    el('gate').hidden = true; el('shell').hidden = false;
    refresh();

    /* live updates through the mechanisms that already exist — no polling, no timer */
    if(window.RAFEventBus){
      ['order.*','support.*','audit.*'].forEach(function(p){
        try { RAFEventBus.subscribe(p, function(){ refresh(); }); } catch(e){}
      });
    }
    window.addEventListener('storage', function(e){
      if(e.key && /^raf_(orders|order_mstate|order_undo|pending|support_tickets|support_activities|audit_events|users)$/.test(e.key)) refresh();
    });
    document.addEventListener('raf:order', refresh);
    document.addEventListener('raf:audit', refresh);
  }

  window.OPS = {
    refresh: refresh,
    setScope: function(k){ F.scope = k; render(); },
    setQ: function(v){
      F.q = v; render();
      var i = el('q'); if(i){ i.focus(); try { i.setSelectionRange(i.value.length, i.value.length); } catch(e){} }
    },
    setF: function(k, v){ F[k] = v; render(); },
    /* applet: edit a draft, commit on Apply */
    openFilters: openFilters,
    closeFilters: closeFilters,
    draft: function(k, v){ if(DRAFT) DRAFT[k] = v; },
    applyFilters: function(){
      if(!DRAFT) return;
      F.state = DRAFT.state; F.store = DRAFT.store; F.dtype = DRAFT.dtype; F.from = DRAFT.from; F.to = DRAFT.to;
      closeFilters(); render();
      var b = el('filterBtn'); if(b) b.focus();
    },
    /* clears the applet's filters; the scope and the search box are separate controls */
    clearFilters: function(){
      F.state = ''; F.store = ''; F.dtype = ''; F.from = ''; F.to = '';
      if(DRAFT){ closeFilters(); }
      render();
      var b = el('filterBtn'); if(b) b.focus();
    },
    /* ---- assignment, performed by RAFLogistics ---- */
    fclose: fclose,
    fdraft: fsync,
    fsubmit: function(){ if(FORM && !FBUSY){ fsync(); FORM.submit(); } },
    openAssign: function(orderId){
      if(!ME || !CAP || !CAP.assign || !LG) return;
      var avail = { items:[] };
      try { avail = LG.listDrivers({ assignableOnly:true }) || { items:[] }; } catch(e){ avail = { items:[] }; }
      var opts = (avail.items || []).map(function(d){
        return { v:d.driverId, t:d.name + ' · ' + T(d.activeOrders + ' طلب جارٍ', d.activeOrders + ' in progress') };
      });
      FORM = {
        title:T('تعيين سائق','Assign a driver'), orderId:orderId, cta:T('تعيين','Assign'), icon:'ti-user-check',
        val:'',
        body:function(){
          if(!opts.length)
            return '<div class="empty"><i class="ti ti-user-off" aria-hidden="true"></i><b>'
              + T('لا يوجد سائقون نشطون للتعيين.','No active drivers are available to assign.') + '</b></div>';
          return '<div class="fld"><label for="x-val">' + T('السائق','Driver') + ' <span class="req">*</span></label>'
            + '<select id="x-val" onchange="OPS.fdraft()"><option value="">' + T('اختر السائق','Select a driver') + '</option>'
            + opts.map(function(o){ return '<option value="' + esc(o.v) + '">' + esc(o.t) + '</option>'; }).join('')
            + '</select><span class="hint">' + T('تعرض القائمة الحسابات النشطة فقط.','The list shows active accounts only.') + '</span></div>';
        },
        submit:function(){
          if(!opts.length) return;
          runOp(function(){ return LG.assignOrder(orderId, FORM.val); },
                'تم تعيين الطلب.', 'The order was assigned.');
        }
      };
      FMSG = null; renderForm();
    },
    openReturn: function(orderId){
      if(!ME || !CAP || !CAP.assign || !LG) return;
      FORM = {
        title:T('إعادة الطلب إلى القائمة','Return the order to the pool'), orderId:orderId,
        cta:T('إعادة','Return'), icon:'ti-arrow-back-up', val:'',
        body:function(){
          return '<div class="fld"><label for="x-val">' + T('السبب','Reason') + ' <span class="req">*</span></label>'
            + '<textarea id="x-val" rows="3" oninput="OPS.fdraft()"></textarea></div>';
        },
        submit:function(){
          runOp(function(){ return LG.returnToPool(orderId, { reason:FORM.val }); },
                'أُعيد الطلب إلى القائمة.', 'The order was returned to the pool.');
        }
      };
      FMSG = null; renderForm();
    },

    /* nothing opens over the access gate: with no authorised session there is
       no sheet and no applet */
    open: function(id){ if(!ME) return; openTrigger = document.activeElement; OPEN = id; renderSheet(); },
    close: closeSheet,
    toggleLang: function(){
      var r = root(), en = r.lang === 'en';
      r.lang = en ? 'ar' : 'en'; r.dir = en ? 'rtl' : 'ltr';
      try { localStorage.setItem('raf_lang', r.lang); } catch(e){}
      applyLang(); render(); el('langBtn').focus();
    },
    openNav: function(){ el('shell').classList.add('nav-open'); var x = document.querySelector('.ops-nav-x'); if(x) x.focus(); },
    closeNav: function(){ el('shell').classList.remove('nav-open'); var b = document.querySelector('.ops-burger'); if(b) b.focus(); }
  };
  document.addEventListener('keydown', function(e){
    if(e.key !== 'Escape') return;
    if(FORM){ e.preventDefault(); fclose(); return; }
    if(DRAFT){ e.preventDefault(); closeFilters(); return; }
    if(OPEN){ e.preventDefault(); closeSheet(); return; }
    if(el('shell') && el('shell').classList.contains('nav-open')) OPS.closeNav();
  });

  if(document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();
})();
</script>
</body>
</html>
