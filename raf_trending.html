<head>
<meta charset="UTF-8">

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700;900&family=Tajawal:wght@300;400;500;700&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">

<style>
:root{--bg:#F5F2EC;--bg2:#EDE8DC;--card:#FFFFFF;--gold:#C9A84C;--gold2:#A07828;--black:#0A0A0A;--text:#0A0A0A;--text2:#555;--text3:#888;--border:#D8D3C8;--r:8px;--rl:12px;--font:'Tajawal',sans-serif;--fdisplay:'Playfair Display',serif;--fen:'DM Sans',sans-serif;--green:#2E7D32;--green-bg:#E8F5E9;--red:#C62828;--red-bg:#FFEBEE;}
*{box-sizing:border-box;margin:0;padding:0;}
html{overflow-x:hidden;}
body{background:var(--bg);color:var(--text);font-family:var(--font);min-height:100vh;max-width:100%;overflow-x:hidden;}
nav{position:sticky;top:0;z-index:100;background:rgba(245,242,236,.97);backdrop-filter:blur(12px);border-bottom:1px solid rgba(201,168,76,.3);padding:0 40px;display:flex;align-items:center;justify-content:space-between;height:64px;}
.nav-logo{font-family:var(--fdisplay);font-size:28px;font-weight:900;color:var(--gold);text-decoration:none;}
.nav-logo span{color:var(--text);font-size:11px;font-family:var(--fen);font-weight:300;letter-spacing:3px;display:block;margin-top:-6px;}
.nav-links{display:flex;align-items:center;gap:4px;}
.nav-link{color:var(--text3);text-decoration:none;font-size:14px;padding:6px 12px;border-radius:var(--r);transition:color .2s;}
.nav-link:hover,.nav-link.on{color:var(--gold);}
.nav-link.on{font-weight:700;}
.nav-actions{display:flex;align-items:center;gap:8px;}
.btn-ghost{padding:8px 16px;border:1px solid var(--border);border-radius:var(--r);background:transparent;color:var(--text2);font-family:var(--font);font-size:13px;cursor:pointer;transition:all .2s;text-decoration:none;display:inline-flex;align-items:center;gap:6px;}
.btn-ghost:hover{border-color:var(--gold);color:var(--gold);}
.btn-gold{padding:8px 20px;border:none;border-radius:var(--r);background:var(--gold);color:var(--black);font-family:var(--font);font-size:13px;font-weight:700;cursor:pointer;transition:all .2s;text-decoration:none;display:inline-flex;align-items:center;gap:6px;}
.btn-gold:hover{background:var(--gold2);}
.nav-ico{width:40px;height:40px;border:1px solid var(--border);border-radius:var(--r);display:flex;align-items:center;justify-content:center;color:var(--text3);cursor:pointer;background:transparent;font-size:18px;position:relative;transition:all .2s;}
.nav-ico:hover{border-color:var(--gold);color:var(--gold);}
.cart-badge{position:absolute;top:-6px;left:-6px;width:18px;height:18px;background:var(--gold);color:var(--black);border-radius:50%;font-size:10px;font-weight:700;display:flex;align-items:center;justify-content:center;font-family:var(--fen);}
/* PAGE HEADER */
.page-header{background:var(--black);padding:40px;}
.page-header-inner{max-width:1200px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:16px;}
.page-title{font-size:30px;font-weight:700;color:#F5F2EC;}
.page-title span{color:var(--gold);}
.page-sub{font-size:14px;color:#888;margin-top:6px;}
.stat-pills{display:flex;gap:14px;}
.stat-pill{background:rgba(201,168,76,.1);border:1px solid rgba(201,168,76,.3);border-radius:var(--rl);padding:12px 20px;text-align:center;}
.stat-pill-num{font-size:24px;font-weight:900;color:var(--gold);font-family:var(--fen);}
.stat-pill-lbl{font-size:11px;color:#888;margin-top:2px;}
.breadcrumb{padding:12px 40px;font-size:13px;color:var(--text3);display:flex;align-items:center;gap:6px;background:var(--bg2);border-bottom:1px solid var(--border);}
.breadcrumb a{color:var(--text3);text-decoration:none;transition:color .2s;}
.breadcrumb a:hover{color:var(--gold);}
.main{max-width:1200px;margin:0 auto;padding:32px 40px;}
/* TABS */
.tab-row{display:flex;gap:4px;background:var(--bg2);border:1px solid var(--border);border-radius:var(--rl);padding:4px;margin-bottom:24px;width:fit-content;}
.tab-btn{padding:8px 20px;border-radius:var(--r);border:none;background:transparent;font-family:var(--font);font-size:14px;color:var(--text3);cursor:pointer;transition:all .2s;display:flex;align-items:center;gap:8px;}
.tab-btn.on{background:var(--card);color:var(--text);font-weight:700;box-shadow:0 1px 4px rgba(0,0,0,.08);}
.tab-btn.on i{color:var(--gold);}
/* FILTER BAR */
.filter-bar{display:flex;gap:12px;align-items:center;background:var(--card);border:1px solid var(--border);border-radius:var(--rl);padding:14px 20px;margin-bottom:20px;flex-wrap:wrap;}
.search-inp{flex:1;min-width:220px;display:flex;align-items:center;gap:8px;background:var(--bg);border:1px solid var(--border);border-radius:var(--r);padding:9px 14px;}
.search-inp input{border:none;background:transparent;font-family:var(--font);font-size:14px;color:var(--text);outline:none;flex:1;}
.f-select{padding:9px 14px;border:1px solid var(--border);border-radius:var(--r);background:var(--bg);font-family:var(--font);font-size:13px;color:var(--text2);cursor:pointer;outline:none;}
.f-select:focus{border-color:var(--gold);}
/* CHIPS */
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:24px;}
.chip{padding:6px 14px;border:1px solid var(--border);border-radius:20px;font-size:12px;color:var(--text2);cursor:pointer;transition:all .15s;background:var(--card);}
.chip:hover{border-color:var(--gold);color:var(--gold);}
.chip.on{background:var(--gold);border-color:var(--gold);color:var(--black);font-weight:700;}
.results-bar{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;}
.results-count{font-size:13px;color:var(--text3);}
/* PRODUCT GRID */
.prod-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:20px;}
/* PRODUCT CARD */
.prod-card{background:var(--card);border:1px solid var(--border);border-radius:var(--rl);overflow:hidden;cursor:pointer;transition:all .2s;position:relative;}
.prod-card:hover{border-color:var(--gold);transform:translateY(-2px);box-shadow:0 8px 28px rgba(0,0,0,.08);}
.prod-img{height:200px;background:linear-gradient(135deg,var(--bg2),var(--border));display:flex;align-items:center;justify-content:center;font-size:56px;color:var(--gold);position:relative;}
/* BADGES */
.badge-fire{position:absolute;top:10px;right:10px;background:#E65100;color:#fff;padding:4px 10px;border-radius:20px;font-size:10px;font-weight:700;display:flex;align-items:center;gap:4px;}
.badge-new{position:absolute;top:10px;right:10px;background:var(--green);color:#fff;padding:4px 10px;border-radius:20px;font-size:10px;font-weight:700;}
.badge-disc{position:absolute;top:10px;right:10px;background:var(--red);color:#fff;padding:4px 10px;border-radius:20px;font-size:11px;font-weight:700;font-family:var(--fen);}
.prod-num{position:absolute;top:10px;left:10px;background:rgba(10,10,10,.65);color:#fff;padding:2px 8px;border-radius:20px;font-family:var(--fen);font-size:10px;font-weight:700;backdrop-filter:blur(4px);}
.wishlist-btn{position:absolute;bottom:10px;left:10px;width:32px;height:32px;border-radius:50%;background:rgba(245,242,236,.9);border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:15px;color:var(--text3);transition:all .2s;}
.wishlist-btn:hover,.wishlist-btn.on{color:#E05555;}
.prod-body{padding:14px;}
.prod-name{font-size:14px;font-weight:700;margin-bottom:3px;line-height:1.4;}
.prod-store{font-size:12px;color:var(--gold2);margin-bottom:8px;display:flex;align-items:center;gap:4px;}
.prod-rating{display:flex;align-items:center;gap:4px;font-size:12px;color:var(--text3);margin-bottom:10px;}
.prod-rating i{color:var(--gold);font-size:11px;}
.prod-price-row{display:flex;align-items:center;gap:8px;margin-bottom:12px;}
.price-old{font-size:12px;color:var(--text3);text-decoration:line-through;font-family:var(--fen);}
.price-new{font-size:16px;font-weight:900;color:var(--gold);font-family:var(--fen);}
.trend-stat{font-size:11px;color:var(--text3);display:flex;align-items:center;gap:4px;margin-bottom:10px;}
.trend-stat.hot{color:#E65100;}
/* CART BTNS */
.cart-btn-wrap{width:100%;}
.add-cart-btn{width:100%;padding:9px;border:1px solid var(--border);border-radius:var(--r);background:transparent;color:var(--text2);font-family:var(--font);font-size:13px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px;transition:all .2s;}
.add-cart-btn:hover{border-color:var(--gold);color:var(--gold);}
.qty-ctrl{display:flex;align-items:center;gap:4px;width:100%;}
.qty-btn{width:32px;height:32px;border:1px solid var(--border);border-radius:var(--r);background:var(--bg);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:14px;transition:all .2s;}
.qty-btn:hover{border-color:var(--gold);color:var(--gold);}
.qty-num{flex:1;text-align:center;font-weight:700;font-family:var(--fen);font-size:14px;}
.qty-del{width:32px;height:32px;border:1px solid var(--red-bg);border-radius:var(--r);background:var(--red-bg);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:14px;color:var(--red);transition:all .2s;}
.qty-del:hover{background:var(--red);color:#fff;}
/* SECTION HEADING */
.sec-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;}
.sec-label{font-size:18px;font-weight:900;display:flex;align-items:center;gap:10px;}
.sec-label i{color:var(--gold);}
/* FOOTER */
footer{background:var(--black);color:#888;padding:48px 40px 24px;margin-top:80px;}
.footer-grid{display:grid;grid-template-columns:2fr 1fr 1fr 1fr;gap:40px;max-width:1200px;margin:0 auto 40px;}
.footer-logo{font-family:var(--fdisplay);font-size:32px;font-weight:900;color:var(--gold);text-decoration:none;display:block;margin-bottom:12px;}
.footer-desc{font-size:13px;color:#555;line-height:1.7;}
.footer-col-title{font-size:13px;font-weight:700;color:#ccc;margin-bottom:16px;letter-spacing:1px;}
.footer-link{display:block;font-size:13px;color:#555;text-decoration:none;margin-bottom:10px;transition:color .2s;}
.footer-link:hover{color:var(--gold);}
.footer-bottom{border-top:1px solid #1a1a1a;padding-top:24px;display:flex;align-items:center;justify-content:space-between;font-size:12px;color:#444;max-width:1200px;margin:0 auto;}
/* ── GLOBAL MOBILE RESET ── */
@media(max-width:768px){*{max-width:100%;}img,video,iframe{max-width:100%!important;height:auto;}table{max-width:100%;}}
@media(max-width:900px){nav{padding:0 16px;}.nav-links{display:none;}.main{padding:20px 16px;}.page-header{padding:28px 16px;}.breadcrumb{padding:10px 16px;}.footer-grid{grid-template-columns:1fr 1fr;}.search-inp{min-width:0!important;width:100%;}.tab-bar{overflow-x:auto;flex-wrap:nowrap;scrollbar-width:none;}.tab-bar::-webkit-scrollbar{display:none;}}
@media(max-width:480px){
  .main{padding:12px;}
  .chips{flex-wrap:nowrap;overflow-x:auto;padding-bottom:4px;-webkit-overflow-scrolling:touch;scrollbar-width:none;gap:6px;}
  .chips::-webkit-scrollbar{display:none;}
  .chip{flex-shrink:0;}
  .tab-bar{overflow-x:auto;white-space:nowrap;scrollbar-width:none;}
  .tab-bar::-webkit-scrollbar{display:none;}
  .footer-grid{grid-template-columns:1fr;}
  .footer-bottom{flex-direction:column;text-align:center;gap:6px;}
  footer{padding:32px 16px 16px;}
}
.lang-btn{padding:6px 12px;border:1px solid var(--border);border-radius:var(--r);background:transparent;color:var(--text3);font-family:'DM Sans',sans-serif;font-size:12px;font-weight:500;cursor:pointer;transition:all .2s;letter-spacing:1px;display:inline-flex;align-items:center;gap:5px;}
.lang-btn:hover{border-color:var(--gold);color:var(--gold);}
.lang-btn .lang-dot{width:6px;height:6px;border-radius:50%;background:var(--gold);display:inline-block;}
html[lang="en"] body{font-family:'DM Sans',sans-serif;}

  /* ===== APP BOTTOM NAV ===== */
  .app-bnav{display:none;}

    .bnav-tab{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;text-decoration:none;color:#aaa;font-size:10px;font-family:'Tajawal',sans-serif;font-weight:500;transition:color .15s;border:none;background:transparent;cursor:pointer;padding:0;}
    .bnav-tab i{font-size:22px;line-height:1;}
    .bnav-tab.on{color:#C9A84C;}
    .bnav-cart{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:2px;text-decoration:none;font-size:10px;font-family:'Tajawal',sans-serif;color:#aaa;padding-bottom:4px;}
    .bnav-cart-ring{width:44px;height:44px;border-radius:50%;background:#C9A84C;display:flex;align-items:center;justify-content:center;font-size:20px;color:#0A0A0A;margin-top:-14px;box-shadow:0 4px 14px rgba(201,168,76,.3);}
    .bnav-cart.on .bnav-cart-ring{background:#A07828;}
    nav a.btn-ghost,nav a.btn-gold,nav .btn-ghost,nav .btn-gold{display:none!important;}
  }
</style>

<script>
function toggleLang(){
  const html=document.getElementById('htmlRoot'),isAR=html.lang==='ar',nl=isAR?'en':'ar';
  html.lang=nl;html.dir=isAR?'ltr':'rtl';
  document.getElementById('langLabel').textContent=isAR?'ع':'EN';
  localStorage.setItem('raf_lang',nl);
  document.querySelectorAll('[data-ar]').forEach(el=>{const t=el.getAttribute('data-'+nl);if(t)el.textContent=t;});
}
(function(){
  if(localStorage.getItem('raf_lang')==='en'){
    document.getElementById('htmlRoot').lang='en';document.getElementById('htmlRoot').dir='ltr';
    document.getElementById('langLabel').textContent='ع';
    document.querySelectorAll('[data-en]').forEach(el=>{el.textContent=el.getAttribute('data-en');});
  }
})();
/* WISHLIST */
function toggleWish(btn){
  const ico=btn.querySelector('i');
  ico.className=ico.className.includes('ti-heart-filled')?'ti ti-heart':'ti ti-heart-filled';
  btn.classList.toggle('on');
}

</script>

<script>
  /* Trends — two orderings of the same canonical list (RAFCatalog, listable
     products): by number of customer reviews, and by rating. Enough products
     to fill three full rows of the grid at the current width. */
  (function(){
    var cur = 'trending';
    function en(){ return document.getElementById('htmlRoot').lang === 'en'; }
    function cols(grid){ try { return getComputedStyle(grid).gridTemplateColumns.split(' ').filter(Boolean).length || 4; } catch(e){ return 4; } }
    function lists(){
      var all = RAFCatalog.list({});
      return {
        'view-trending': all.slice().sort(function(a,b){ return (parseInt(b.rev,10)||0) - (parseInt(a.rev,10)||0) || (parseFloat(b.rate)||0) - (parseFloat(a.rate)||0); }),
        'view-top':      all.slice().sort(function(a,b){ return (parseFloat(b.rate)||0) - (parseFloat(a.rate)||0) || (parseInt(b.rev,10)||0) - (parseInt(a.rev,10)||0); }),
        total: all.length
      };
    }
    function render(){
      if (!window.RAFCard) return;
      var v = lists();
      ['view-trending','view-top'].forEach(function(id){
        var grid = document.querySelector('#' + id + ' .cx-grid'); if (!grid) return;
        var n = Math.min(v[id].length, Math.max(12, cols(grid) * 3));
        grid.innerHTML = v[id].slice(0, n).map(function(p){ return RAFCard.product(p); }).join('');
        grid.setAttribute('data-count', n);
      });
      var shown = document.querySelector('#view-' + cur + ' .cx-grid').getAttribute('data-count');
      document.getElementById('trMeta').innerHTML = en()
        ? 'Top <b>' + shown + '</b> of ' + v.total + ' products — ' + (cur === 'top' ? 'ordered by rating' : 'ordered by number of reviews')
        : 'أفضل <b>' + shown + '</b> من ' + v.total + ' منتج — ' + (cur === 'top' ? 'مرتبة حسب التقييم' : 'مرتبة حسب عدد التقييمات');
      RAFCard.badge();
    }
    window.switchTab = function(tab, btn){
      cur = tab;
      document.querySelectorAll('.cx-chips [role="tab"]').forEach(function(b){ b.classList.toggle('on', b === btn); b.setAttribute('aria-selected', String(b === btn)); });
      document.getElementById('view-trending').style.display = tab === 'trending' ? '' : 'none';
      document.getElementById('view-top').style.display = tab === 'top' ? '' : 'none';
      render();
    };
    if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', render); else render();
    var r = document.getElementById('htmlRoot');
    if (r) new MutationObserver(render).observe(r, { attributes:true, attributeFilter:['lang'] });
    document.addEventListener('raf:source', render);
    var rt = null; window.addEventListener('resize', function(){ clearTimeout(rt); rt = setTimeout(render, 200); });
  })();
</script>

<script src="raf_permissions.js"></script>

</body>
