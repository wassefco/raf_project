<!DOCTYPE html>
<html id="htmlRoot" lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>رف — طرق الدفع</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700;900&family=Tajawal:wght@300;400;500;700;800&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
<link rel="stylesheet" href="raf_account.css">
<link rel="icon" type="image/png" sizes="64x64" href="raf_favicon.png">
<link rel="icon" type="image/png" sizes="32x32" href="raf_favicon_32.png">
<link rel="apple-touch-icon" href="raf_appicon.png">
<style>
  .pcard{display:flex;align-items:center;gap:14px;background:var(--card);border:1px solid var(--border);border-radius:var(--rl);box-shadow:var(--sh);padding:16px 18px;margin-bottom:12px;}
  .pcard.def{border-color:var(--gold);}
  .plogo{width:50px;height:34px;border-radius:7px;display:flex;align-items:center;justify-content:center;font-size:22px;color:#fff;flex-shrink:0;}
  .pnum{font-family:var(--fen);font-size:14.5px;font-weight:600;letter-spacing:1px;color:var(--ink);}
  .psub{font-size:12px;color:var(--text3);margin-top:2px;}
  .padd{display:flex;align-items:center;justify-content:center;gap:9px;width:100%;padding:16px;border:1.5px dashed var(--border2);border-radius:var(--rl);background:var(--card);color:var(--text3);font-family:var(--font);font-size:14px;font-weight:600;cursor:pointer;transition:all .2s;}
  .padd:hover{border-color:var(--gold);color:var(--gold2);}
</style>
</head>
<body>
<header class="ahead">
  <a href="raf_account.html" class="ahead-back"><i class="ti ti-arrow-right"></i> <span data-ar="هوية رف" data-en="RAF ID">هوية رف</span></a>
  <div class="ahead-title" data-ar="طرق الدفع" data-en="Payment Methods">طرق الدفع</div>
  <button class="lang-btn" onclick="toggleLang()"><span class="lang-dot"></span><span id="langLabel">EN</span></button>
</header>

<div class="wrap">
  <div class="section-h" data-ar="البطاقات المحفوظة" data-en="Saved Cards">البطاقات المحفوظة</div>

  <div class="pcard def">
    <div class="plogo" style="background:linear-gradient(135deg,#1A1F71,#2A3D9E)"><i class="ti ti-brand-visa"></i></div>
    <div style="flex:1;"><div class="pnum">•••• •••• •••• 4821</div><div class="psub"><span data-ar="تنتهي 09/27 — محمد العنزي" data-en="Expires 09/27 — Mohammed Al-Anzi">تنتهي 09/27 — محمد العنزي</span></div></div>
    <span class="badge b-gold"><span data-ar="افتراضية" data-en="Default">افتراضية</span></span>
  </div>

  <div class="pcard">
    <div class="plogo" style="background:linear-gradient(135deg,#EB001B,#F79E1B)"><i class="ti ti-brand-mastercard"></i></div>
    <div style="flex:1;"><div class="pnum">•••• •••• •••• 9035</div><div class="psub"><span data-ar="تنتهي 04/26" data-en="Expires 04/26">تنتهي 04/26</span></div></div>
    <button class="btn btn-ghost btn-sm"><i class="ti ti-trash"></i> <span data-ar="حذف" data-en="Remove">حذف</span></button>
  </div>

  <button class="padd"><i class="ti ti-plus"></i> <span data-ar="إضافة بطاقة جديدة" data-en="Add new card">إضافة بطاقة جديدة</span></button>

  <div class="section-h" data-ar="خيارات أخرى" data-en="Other options">خيارات أخرى</div>
  <div class="panel">
    <div class="row"><div class="row-ic"><i class="ti ti-cash"></i></div><div class="row-body"><div class="row-lbl" data-ar="الدفع عند الاستلام" data-en="Cash on delivery">الدفع عند الاستلام</div><div class="row-sub" data-ar="متاح لمعظم الطلبات" data-en="Available for most orders">متاح لمعظم الطلبات</div></div><span class="badge b-delivered" data-ar="مُفعّل" data-en="Enabled">مُفعّل</span></div>
    <div class="row"><div class="row-ic" style="background:var(--gold-soft);color:var(--gold2)"><i class="ti ti-wallet"></i></div><div class="row-body"><div class="row-lbl" data-ar="محفظة رف" data-en="RAF Wallet">محفظة رف</div><div class="row-sub">12.500 <span data-ar="د.ك" data-en="KWD">د.ك</span></div></div><button class="btn btn-ghost btn-sm" data-ar="شحن" data-en="Top up">شحن</button></div>
  </div>
</div>

<nav class="app-bnav">
  <a href="raf_homepage.html" class="bnav-tab"><i class="ti ti-home-2"></i><span data-ar="الرئيسية" data-en="Home">الرئيسية</span></a>
  <a href="raf_storespage.html" class="bnav-tab"><i class="ti ti-compass"></i><span data-ar="تصفّح" data-en="Browse">تصفّح</span></a>
  <a href="raf_cart.html" class="bnav-cart"><div class="bnav-cart-ring"><i class="ti ti-shopping-cart"></i></div><span data-ar="السلة" data-en="Cart">السلة</span></a>
  <a href="raf_wishlist.html" class="bnav-tab"><i class="ti ti-heart"></i><span data-ar="المفضلة" data-en="Saved">المفضلة</span></a>
  <a href="raf_account.html" class="bnav-tab on"><i class="ti ti-user-circle"></i><span data-ar="حسابي" data-en="Account">حسابي</span></a>
</nav>

<script src="raf_account.js"></script>
</body>
</html>
