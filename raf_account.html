<script>
/* My Account — identity and the section rows. Every value comes from its
   authority (RAFPerm, RAFShop, RAFWallet, raf_addresses); a value RAF does
   not have is left out. */
(function(){
  function en(){ return document.getElementById('htmlRoot').lang === 'en'; }
  function T(ar,e){ return en() ? e : ar; }
  function paint(){
    var p = rafProfile();
    document.getElementById('acName').textContent = p.name || T('ضيف','Guest');
    var av = document.getElementById('acAv'); av.textContent = (p.name || '?').trim().charAt(0);
    var ct = document.getElementById('acContact'); ct.innerHTML = '';
    [p.email, p.phone].filter(Boolean).forEach(function(v, i){
      if (i) ct.appendChild(document.createTextNode(' · '));
      var b = document.createElement('bdi'); b.textContent = v; ct.appendChild(b);
    });
    if (!p.signedIn){ var a = document.getElementById('acId'); a.href = 'raf_login.html'; ct.textContent = T('سجّل الدخول لعرض حسابك','Sign in to see your account'); }
    /* live values beside the rows */
    try {
      var orders = (typeof rafOrders === 'function') ? rafOrders() : [];
      document.getElementById('acOrdersVal').innerHTML = orders.length ? '<b>' + orders.length + '</b>' : '';
    } catch(e){}
    try { var w = window.RAFShop ? RAFShop.Wish.count() : 0; document.getElementById('acWishVal').innerHTML = w ? '<b>' + w + '</b>' : ''; } catch(e){}
    try { var ad = JSON.parse(localStorage.getItem('raf_addresses') || '[]'); document.getElementById('acAddrVal').innerHTML = Array.isArray(ad) && ad.length ? '<b>' + ad.length + '</b>' : ''; } catch(e){}
    try {
      var u = RAFPerm.currentUser(), el = document.getElementById('acWalletVal');
      var b = u && window.RAFWallet ? RAFWallet.balance(u.id, { id:u.id, name:u.name, type:'customer' }) : null;
      el.innerHTML = b && b.ok ? '<b>' + b.balance + '</b> ' + T('د.ك','KWD') : '';
    } catch(e){}
    document.getElementById('acRows').setAttribute('aria-label', T('حسابي','My Account'));
  }
  window.onLangChange = paint;
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', paint); else paint();
  document.addEventListener('raf:wish', paint);
})();
</script>
